        if (!Array.isArray(_srvImgCache[query])) _srvImgCache[query] = [];

                  const arr = [...data.hits];

                }
              } catch(e) { console.warn('Server Pixabay fetch error', e); }
              finally { _srvImgLocks[query] = null; }
            })();

        reconnecting: "reconectando",
        darkMode: "Modo Noturno",
        tutorial: "Tutorial",
        language: "EN",
        serverFullMigration: "Servidor cheio! Migrando você para a rede descentralizada.",
        pureServerModeConnected: "Conectado ao servidor K10 em modo servidor puro",
        globalRadio: "Rádio Global",
        k10Server: "Servidor K10",
        serverName: "SERVIDOR",
        chatAlreadyActive: "Um chat já está ativo. Pare-o primeiro.",
        hydraModeMessage: "Servidor em modo Hydra. Conecte-se à rede global.",
        idDescription1: "O ID consiste em 6 caracteres alfanuméricos.",
        idDescription2: "Mais especificamente:",
        idDescription3: "Letras: A a Z (apenas maiúsculas)",
        idDescription4: "Números: 2 a 9",
        ytChatExplanation: "Você pode iniciar um chat em uma live do YouTube e transmitir o chat do YouTube a partir do servidor. Use o botão 'Iniciar Chat YT'. Esta informação está disponível nos menus Mídias e Servidor.",
        clearAuditLog: "Limpar",
        noAuditEvents: "Nenhum evento registrado."
      }
    };

    const t = (lang, key, vars = {}) => {
      let str = TRANSLATIONS[lang][key] || TRANSLATIONS['en'][key] || key;
      Object.entries(vars).forEach(([k, v]) => { str = str.replace(`{${k}}`, v); });
      return str;
    };

    const PEER_ID_STORAGE_KEY = 'p2pChatDistributorId';
    const DEFAULT_ID = 'AAAAAA';

    const usePersistentId = () => {
      const [peerId, setPeerId] = useState(() => {
        try {
          const saved = localStorage.getItem(PEER_ID_STORAGE_KEY) || DEFAULT_ID;
          return saved.endsWith('-CENTRAL') ? saved : saved + '-CENTRAL';
        } catch (e) {
          return DEFAULT_ID + '-CENTRAL';
        }
      });

      useEffect(() => {
        try {
          const formattedId = peerId.endsWith('-CENTRAL') ? peerId : peerId + '-CENTRAL';
          if (formattedId !== peerId) {
            setPeerId(formattedId);
            return;
          }
          localStorage.setItem(PEER_ID_STORAGE_KEY, formattedId);
          sessionStorage.setItem(PEER_ID_STORAGE_KEY, formattedId);
          document.cookie = `${PEER_ID_STORAGE_KEY}=${formattedId}; max-age=31536000; path=/`;
        } catch (e) {
          console.error("Erro ao persistir ID:", e);
        }
      }, [peerId]);

      return [peerId, setPeerId];
    };

    const IdBackupTools = ({ peerId, setPeerId, onSaveId, isConnected, lang }) => {
      const [editableId, setEditableId] = useState(peerId);
      const [isEditing, setIsEditing] = useState(false);

      const copyToClipboard = () => {
        navigator.clipboard.writeText(peerId).then(() => {
          alert(t(lang, 'idCopied'));
        });
      };

      const startEditing = () => {
        setEditableId(peerId);
        setIsEditing(true);
      };

      const saveId = () => {
        if (editableId.trim() === '') {
          alert(t(lang, 'idEmpty'));
          return;
        }
        
        if (editableId !== peerId) {
          setPeerId(editableId);
          if (onSaveId) onSaveId(editableId);
        }
        
        setIsEditing(false);
      };

      return (
        <div className="id-backup-container">
          <div>
            <strong>{t(lang, 'distributorId')}</strong> 
            {isEditing ? (
              <>
                <input 
                  type="text" 
                  className="id-input"
                  value={editableId}
                  onChange={(e) => setEditableId(e.target.value)}
                  placeholder={t(lang, 'distributorId')}
                />
                <button onClick={saveId}>{t(lang, 'save')}</button>
                <button onClick={() => setIsEditing(false)}>{t(lang, 'cancel')}</button>
              </>
            ) : (
              <>
                {peerId}
                <button onClick={copyToClipboard} className="copy-button">
                  {t(lang, 'copy')}
                </button>
                <button 
                  onClick={startEditing}
                  disabled={isConnected}
                >
                  {t(lang, 'edit')}
                </button>
              </>
            )}
          </div>
          {isConnected && !isEditing && (
            <p><small>{t(lang, 'logoutToEdit')}</small></p>
          )}
        </div>
      );
    };

    const DistributorApp = () => {
      const [lang, setLang] = useState(() => localStorage.getItem('serverLang') || 'en');
      const langRef = useRef(localStorage.getItem('serverLang') || 'en'); // FIX S1: evita stale closure em setupConnection/conn.on
      useEffect(() => { langRef.current = lang; }, [lang]);
      const [peerId, setPeerId] = usePersistentId();
      const [connections, setConnections] = useState([]);
      const [messages, setMessages] = useState([]);
      const [connectionStatus, setConnectionStatus] = useState('disconnected');
      const [stats, setStats] = useState({
        messagesReceived: 0,
        messagesDistributed: 0,
        activeConnections: 0,
        hydraNodes: 0
      });

      useEffect(() => {
        localStorage.setItem('serverLang', lang);
      }, [lang]);
      // New state to control the mode — persisted in localStorage
      const [pureServerMode, setPureServerMode] = useState(() => {
        const saved = localStorage.getItem('pureServerMode');
        return saved === null ? true : saved === 'true';
      });
      // BUG S-6 FIX: inicializa pureServerModeRef com o valor real salvo,
      // evitando janela de dessincronização entre estado e ref antes do primeiro useEffect.
      const _pureServerModeInitial = (() => {
        const saved = localStorage.getItem('pureServerMode');
        return saved === null ? true : saved === 'true';
      })();
      const pureServerModeRef = useRef(_pureServerModeInitial);
      useEffect(() => { pureServerModeRef.current = pureServerMode; localStorage.setItem('pureServerMode', pureServerMode); }, [pureServerMode]);
      const [knownServers, setKnownServers] = useState(() => {
        try { return JSON.parse(localStorage.getItem('knownServers') || '[]'); } catch { return []; }
      });
      // FIX: ref mirrors knownServers so peer.on('open') never reads stale closure
      const knownServersRef = useRef([]);
      useEffect(() => { knownServersRef.current = knownServers; }, [knownServers]);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('serverDarkMode') === 'true');
      const [auditLog, setAuditLog] = useState([]);
      const auditLogRef = useRef([]);
      const addAudit = (msg, type = 'info') => {
        const entry = { ts: new Date().toLocaleTimeString(), msg, type };
        auditLogRef.current = [entry, ...auditLogRef.current].slice(0, 60);
        setAuditLog([...auditLogRef.current]);
      };
      useEffect(() => {
        if (darkMode) { document.body.classList.add('dark-mode'); }
        else { document.body.classList.remove('dark-mode'); }
        localStorage.setItem('serverDarkMode', darkMode);
      }, [darkMode]);
      const [newServerId, setNewServerId] = useState('');
      const [youtubeChatId, setYoutubeChatId] = useState(null);
      const [youtubeBroadcasts, setYoutubeBroadcasts] = useState({});
      const youtubeChatIdRef = useRef(null);
      useEffect(() => { youtubeChatIdRef.current = youtubeChatId; }, [youtubeChatId]);
      const radioStateRef = useRef({ status: 'idle', startTime: 0, duration: 0 });
      
      const peerInstance = useRef(null);
      const pendingFiles = useRef({});
      const messagesEndRef = useRef(null);
      const activeConnectionsRef = useRef(new Map());
      const seenMessagesRef = useRef(new Set());
      const isHydraModeRef = useRef(false);
      const recentPeersRef = useRef([]);
      const heartbeatsRef = useRef(new Map());
      const worldQuizNodesRef = useRef(new Set());
      const quizBotPeerRef = useRef(null);
      // FASE-2: diretório global de grupos no servidor
      // { [groupId]: { size: number, reservados: string[] } }
      const activeGroupsRef = useRef({ 'G0001': { size: 0, reservados: [], members: new Set() } });
      // FASE-2: mapeia peerId → groupId para decrementar ao desconectar
      const peerGroupMapRef = useRef(new Map());

      // FIX BUG-I: seenMessagesRef crescia sem limite → memory leak grave no servidor
      // Mantém no máximo 2 000 entradas; ao ultrapassar, descarta a metade mais antiga (FIFO)
      const pruneSeenSrv = () => {
        const s = seenMessagesRef.current;
        if (s.size > 2000) {
          const keep = [...s].slice(-1000);
          seenMessagesRef.current = new Set(keep);
        }
      };

      
      // ── Estado do Quiz quando o SERVIDOR assume a transmissão ──
      const [serverQuizActive, setServerQuizActive] = useState(false);
      const serverQuizActiveRef = useRef(false);
      const srvQuizDisciplineRef = useRef('world');
      const srvQuizIntervalRef = useRef(SRV_MIN_QUIZ_INTERVAL);
      const srvLastQuizTimeRef = useRef(0);
      const srvQuizUsedImagesRef = useRef(new Set());
      const srvQuizTimerRef = useRef(null);
      const srvCurrentQuizRef = useRef(null);
      const srvWorldPlaceIdxRef = useRef(0);

      // V9: Garbage Collector para conexões WebRTC fantasmas (onde o evento on('close') não dispara)
      useEffect(() => {
        const ghostGcIv = setInterval(() => {
          activeConnectionsRef.current.forEach((conn, peerId) => {
            if (!conn.peerConnection) return;
            const state = conn.peerConnection.connectionState;
            if (state === 'failed' || state === 'closed' || state === 'disconnected') {
              addAudit(`[GhostGC] Peer fantasma [${peerId}] detectado e removido (${state})`, 'warn');
              try { conn.close(); } catch(e){}
              
              // Limpeza manual já que o evento close pode não disparar
              if (quizBotPeerRef.current === peerId) {
                quizBotPeerRef.current = null;
                activeConnectionsRef.current.forEach((c) => {
                  try { c.send({ type: 'quiz-bot-status', active: false }); } catch(e) {}
                });
              }
              
              const peerGroupId = peerGroupMapRef.current.get(peerId);
              if (peerGroupId && activeGroupsRef.current[peerGroupId]) {
                activeGroupsRef.current[peerGroupId].size = Math.max(0, activeGroupsRef.current[peerGroupId].size - 1);
                activeGroupsRef.current[peerGroupId].members.delete(peerId);
              }
              peerGroupMapRef.current.delete(peerId);
              activeConnectionsRef.current.delete(peerId);
              
              setConnections(Array.from(activeConnectionsRef.current.keys()));
              setStats(prev => ({
                ...prev,
                activeConnections: activeConnectionsRef.current.size,
                hydraNodes: recentPeersRef.current.length
              }));
            }
          });
        }, 5000);
        return () => clearInterval(ghostGcIv);
      }, []);
      const srvQuizAllIdxRef = useRef(0);
      const HYDRA_THRESHOLD = 150;
      const CHUNK_SIZE = 16 * 1024;

      // ── Reconexão robusta ──────────────────────────────────────────────
      const reconnectAttemptsRef = useRef(0);
      const reconnectTimerRef    = useRef(null);
      const keepaliveTimerRef    = useRef(null);
      const isManualDisconnectRef = useRef(false); // distingue desconexão manual
      const MAX_RECONNECT_ATTEMPTS = 20; // circuit-breaker

      // ═══ V8-F10: GC periódico de members fantasmas em activeGroupsRef ═══
      useEffect(() => {
        const gc = setInterval(() => {
          try {
            const livePeers = new Set(activeConnectionsRef.current.keys());
            for (const gid in activeGroupsRef.current) {
              const g = activeGroupsRef.current[gid];
              if (!g || !g.members) continue;
              let removed = 0;
              for (const p of Array.from(g.members)) {
                if (!livePeers.has(p)) { g.members.delete(p); removed++; }
              }
              g.size = Math.max(0, g.members.size);
              g.reservados = (g.reservados || []).filter(p => livePeers.has(p)).slice(0, 10);
              if (removed > 0) console.log(`[V8-F10] GC group ${gid}: -${removed} fantasmas, size=${g.size}`);
              // remove grupo vazio (exceto G0001)
              if (g.members.size === 0 && gid !== 'G0001') {
                delete activeGroupsRef.current[gid];
              }
            }
          } catch(e) { console.warn('[V8-F10] gc error', e); }
        }, 60000);
        return () => clearInterval(gc);
      }, []);

      const BASE_RECONNECT_DELAY   = 2000; // 2s inicial

      // Backoff exponencial com jitter: 2s, 4s, 8s … até 60s
      const getBackoffDelay = (attempt) => {
        const exp = Math.min(BASE_RECONNECT_DELAY * Math.pow(2, attempt), 60000);
        return exp + Math.random() * 1000; // jitter de até 1s
      };

      // Cancela qualquer timer de reconexão pendente
      const clearReconnectTimer = () => {
        if (reconnectTimerRef.current) {
          clearTimeout(reconnectTimerRef.current);
          reconnectTimerRef.current = null;
        }
      };

      // Para o keepalive
      const stopKeepalive = () => {
        if (keepaliveTimerRef.current) {
          clearInterval(keepaliveTimerRef.current);
          keepaliveTimerRef.current = null;
        }
      };

      // Keepalive: envia um ping ao servidor PeerJS a cada 25s para evitar timeout silencioso
      const startKeepalive = () => {
        stopKeepalive();
        keepaliveTimerRef.current = setInterval(() => {
          const p = peerInstance.current;
          if (p && !p.destroyed && !p.disconnected) {
            // FIX S-9: p.socket._socket era API privada inexistente no PeerJS 1.5+ → código morto + erro silencioso.
            // PeerJS 1.5+ já faz keep-alive automático via pingInterval:5000 configurado no new Peer(). Linha removida.
            // Também detecta conexões mortas e remove
            activeConnectionsRef.current.forEach((conn, id) => {
              try {
                const state = conn.peerConnection && conn.peerConnection.connectionState;
                if (state === 'failed' || state === 'closed') {
                  console.warn(`Keepalive: removendo conexão morta ${id}`);
                  activeConnectionsRef.current.delete(id);
                  setConnections(Array.from(activeConnectionsRef.current.keys()));
                }
              } catch(e) {}
            });
          } else if (p && p.disconnected && !p.destroyed) {
            console.log("Keepalive: peer desconectado, tentando reconectar...");
            scheduleReconnect();
          }
        }, 25000);
      };

      // Ref para sempre ter o peerId mais recente dentro dos closures dos timers
      const peerIdRef = useRef(peerId);
      useEffect(() => { peerIdRef.current = peerId; }, [peerId]);

      // Agenda reconexão com backoff – único ponto de entrada para retentativas
      const scheduleReconnect = () => {
        if (isManualDisconnectRef.current) return;
        clearReconnectTimer();

        if (reconnectAttemptsRef.current >= MAX_RECONNECT_ATTEMPTS) {
          console.error(`Circuit-breaker: ${MAX_RECONNECT_ATTEMPTS} tentativas falharam. Desistindo.`);
          setConnectionStatus('errorFatal');
          stopKeepalive();
          return;
        }

        const delay = getBackoffDelay(reconnectAttemptsRef.current);
        reconnectAttemptsRef.current += 1;
        console.log(`Reconectando em ${(delay/1000).toFixed(1)}s (tentativa ${reconnectAttemptsRef.current}/${MAX_RECONNECT_ATTEMPTS})...`);
        setConnectionStatus(`reconnecting (${reconnectAttemptsRef.current}/${MAX_RECONNECT_ATTEMPTS})`);

        reconnectTimerRef.current = setTimeout(() => {
          const p = peerInstance.current;
          if (p && !p.destroyed) {
            try {
              p.reconnect();
              return;
            } catch(e) {
              console.warn("p.reconnect() falhou, recriando peer:", e);
            }
          }
          // Se reconnect() falhar ou peer estiver destruído, recria do zero
          setupPeer();
        }, delay);
      };

      useEffect(() => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [messages]);

      const toggleConnection = () => {
        if (connectionStatus === 'connected' || connectionStatus.startsWith('reconnecting') || connectionStatus === 'connecting') {
          disconnectPeer();
        } else {
          isManualDisconnectRef.current = false;
          reconnectAttemptsRef.current = 0;
          setupPeer();
        }
      };

      const disconnectPeer = () => {
        isManualDisconnectRef.current = true; // impede reconexão automática
        clearReconnectTimer();
        stopKeepalive();
        if (peerInstance.current) {
          try {
            console.log("Desconectando peer (manual)...");
            activeConnectionsRef.current.forEach((conn) => {
              try { conn.close(); } catch (e) {}
            });
            activeConnectionsRef.current.clear();
            setConnections([]);
            peerInstance.current.destroy();
            peerInstance.current = null;
            setConnectionStatus('disconnected');
            setStats({ messagesReceived: 0, messagesDistributed: 0, activeConnections: 0, hydraNodes: 0 });
            console.log("Peer desconectado com sucesso");
          } catch (err) {
            console.error("Erro ao desconectar peer:", err);
          }
        }
      };

      const setupPeer = () => {
        // BUG S-1 FIX: usamos peerIdRef.current em vez de peerId (closure) para que
        // handleIdChange funcione corretamente após setPeerId() assincrônico.
        const currentId = peerIdRef.current;
        if (!currentId) return;
        if (isManualDisconnectRef.current) return; // respeita desconexão manual

        console.log("Configurando distribuidor com ID:", currentId);
        setConnectionStatus('connecting');
        stopKeepalive();
        clearReconnectTimer();
        
        if (peerInstance.current) {
          try { peerInstance.current.destroy(); } catch (err) {}
          peerInstance.current = null;
        }
        
        const peer = new Peer(currentId, {
          host: '0.peerjs.com',
          port: 443,
          secure: true,
          pingInterval: 5000, // PeerJS interno: ping a cada 5s
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' },
              { urls: 'stun:stun3.l.google.com:19302' },
              // ⚠️ BUG-4 WARNING: These are public demo TURN credentials with no SLA.
              // Voice/video calls behind strict NAT may fail in production.
              // For reliability, replace with your own credentials:
              // Free tier: https://dashboard.metered.ca/  (sign up → create app → copy credentials)
              { urls: 'turn:openrelay.metered.ca:80',                username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443',               username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:80?transport=tcp',  username: 'openrelayproject', credential: 'openrelayproject' }
            ]
          },
          debug: 1
        });

        peer.on('open', (id) => {
          console.log("Distribuidor conectado com ID:", id);
          reconnectAttemptsRef.current = 0; // reset do circuit-breaker ao conectar
          setConnectionStatus('connected');
          addAudit(`✅ Servidor online: ${id}`, 'ok');
          startKeepalive();
          
          // FIX: usa ref para evitar stale closure – knownServers pode estar desatualizado
          knownServersRef.current.forEach(serverId => {
            if (serverId !== id) {
              console.log(`Auto-conectando ao servidor: ${serverId}`);
              addAudit(`🔗 Auto-conectando a: ${serverId}`, 'info');
              const conn = peer.connect(serverId);
              setupConnection(conn);
            }
          });
        });

        peer.on('connection', (conn) => {
          console.log("Nova conexão recebida de:", conn.peer);
          
          if (isHydraModeRef.current) {
            setupConnection(conn);
            return;
          }

          const MAX_SERVER_CONNECTIONS = 200;
          if (activeConnectionsRef.current.size >= MAX_SERVER_CONNECTIONS) {
            console.log("Servidor cheio. Rejeitando conexão de:", conn.peer);
            setTimeout(() => { try { conn.close(); } catch (e) {} }, 500);
            return;
          }
          
          setupConnection(conn);
        });

        // ── Tratamento robusto de erros ──────────────────────────────────
        peer.on('error', (err) => {
          console.error("Erro no peer:", err.type, err);
          addAudit(`❌ Erro PeerJS: ${err.type}`, 'err');

          // Erros FATAIS: não adianta reconectar com o mesmo ID
          if (err.type === 'unavailable-id' || err.type === 'invalid-id') {
            setConnectionStatus('errorIdUnavailable');
            console.error("ID já em uso ou inválido. Altere o ID e tente novamente.");
            addAudit('⛔ ID indisponível ou inválido — altere o ID', 'err');
            stopKeepalive();
            return;
          }

          // Erros de peer remoto não afetam o servidor em si
          if (err.type === 'peer-unavailable') {
            console.warn("Peer remoto indisponível:", err.message);
            addAudit(`⚠️ Peer remoto indisponível: ${err.message}`, 'warn');
            return; // não reconecta – o servidor continua de pé
          }

          // Erros de REDE / SERVIDOR – reconecta automaticamente
          setConnectionStatus('error');
          if (!isManualDisconnectRef.current) {
            scheduleReconnect();
          }
        });

        // Sinalização desconectou (não o peer em si) – tenta reconectar
        peer.on('disconnected', () => {
          if (isManualDisconnectRef.current) return;
          console.log("Peer desconectado do servidor de sinalização. Reconectando...");
          addAudit('⚠️ Sinalização perdida — reconectando…', 'warn');
          setConnectionStatus('reconnecting');
          scheduleReconnect();
        });

        // Peer completamente fechado (raro, mas tratado)
        peer.on('close', () => {
          if (isManualDisconnectRef.current) return;
          console.warn("Peer fechou completamente. Recriando...");
          addAudit('🔄 Peer fechou — recriando…', 'warn');
          stopKeepalive();
          peerInstance.current = null;
          scheduleReconnect();
        });

        peerInstance.current = peer;
      };

      // ── Reconecta quando a internet voltar ──────────────────────────────
      useEffect(() => {
        const handleOnline = () => {
          console.log("Rede online detectada.");
          if (!isManualDisconnectRef.current) {
            const p = peerInstance.current;
            const isOk = p && !p.destroyed && !p.disconnected;
            if (!isOk) {
              console.log("Reconectando após retorno da rede...");
              reconnectAttemptsRef.current = 0;
              setupPeer();
            }
          }
        };
        window.addEventListener('online', handleOnline);
        return () => window.removeEventListener('online', handleOnline);
      }, [peerId]);

      useEffect(() => {
        // Monitora saúde da conexão a cada 15s – funciona em TODOS os estados (inclusive 'error')
        // FIX BUG-1: guards now use the same English strings that setConnectionStatus() actually writes
        if (connectionStatus === 'disconnected' || connectionStatus === 'errorFatal') return;
        
        const checkConnectionInterval = setInterval(() => {
          const p = peerInstance.current;

          // Se estiver no estado 'error' aguarda o scheduleReconnect atuar
          if (connectionStatus.startsWith('error')) return;

          if (p && p.disconnected && !p.destroyed) {
            console.log("Monitor: peer desconectado, agendando reconexão...");
            if (!isManualDisconnectRef.current) scheduleReconnect();
          }
          
          // Limpeza de heartbeats antigos (> 45s)
          const now = Date.now();
          let changed = false;
          heartbeatsRef.current.forEach((time, id) => {
            if (now - time > 45000) {
              heartbeatsRef.current.delete(id);
              worldQuizNodesRef.current.delete(id);
              changed = true;
            }
          });
          if (changed) setStats(prev => ({ ...prev, hydraNodes: heartbeatsRef.current.size }));
          
          // Broadcast de estatísticas para todos os conectados
          const statsMsg = {
            type: 'network-stats',
            totalOnline: heartbeatsRef.current.size,
            timestamp: now,
            worldQuizNodes: Array.from(worldQuizNodesRef.current)
          };
          activeConnectionsRef.current.forEach(conn => { try { conn.send(statsMsg); } catch(e) {} });
          
        }, 15000);

        return () => clearInterval(checkConnectionInterval);
      }, [connectionStatus]);

      const handleIdChange = (newId) => {
        disconnectPeer();
        // Após limpar, reconecta automaticamente com o novo ID
        setTimeout(() => {
          isManualDisconnectRef.current = false;
          reconnectAttemptsRef.current = 0;
          setupPeer();
        }, 600);
      };

      const broadcastMyYoutubeVideo = () => {
        const url = prompt('Digite a URL do vídeo do YouTube para transmitir:');
        if (!url) return;
        
        let finalYoutubeId = '';
        try {
          const parsedUrl = new URL(url);
          if (parsedUrl.hostname === 'youtu.be') {
            finalYoutubeId = parsedUrl.pathname.slice(1);
          } else if (parsedUrl.hostname.includes('youtube.com')) {
            if (parsedUrl.pathname === '/playlist') {
              const list = parsedUrl.searchParams.get('list');
              if (list) finalYoutubeId = `playlist:${list}`;
            } else if (parsedUrl.pathname === '/watch') {
              const v = parsedUrl.searchParams.get('v');
              const list = parsedUrl.searchParams.get('list');
              if (list) {
                finalYoutubeId = `playlist:${list}`;
              } else if (v) {
                finalYoutubeId = v;
              }
            } else if (parsedUrl.pathname.startsWith('/embed/')) {
              finalYoutubeId = parsedUrl.pathname.split('/')[2];
            }
          }
        } catch (e) {}

        if (!finalYoutubeId) {
          const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
          const match = url.match(regExp);
          if (match && match[2].length === 11) {
            finalYoutubeId = match[2];
          }
        }

        if (!finalYoutubeId) {
          alert('URL do YouTube inválida');
          return;
        }

        const serverId = peerInstance.current ? peerInstance.current.id : 'SERVER';
        const startTime = Date.now() + 5000; // 5s delay for sync
        const duration = 300; // 5 minutes limit
        const radioId = serverId + '_yt_' + Date.now();
        const msg = { 
          type: 'radio-youtube-start', 
          id: radioId + '_start', 
          radioId,
          youtubeId: finalYoutubeId, 
          startTime,
          duration,
          sender: serverId,
          senderName: t(lang, 'serverName'),
          ttl: 15 
        };
        
        setYoutubeBroadcasts(prev => ({ ...prev, [serverId]: { videoId: finalYoutubeId, senderName: t(lang, 'serverName') } }));
        distributeMessage(msg, null);
      };

      const stopMyYoutubeVideo = () => {
        const pId = peerInstance.current ? peerInstance.current.id : 'SERVER';
        const msg = { 
          type: 'radio-youtube-stop', 
          id: pId + '_stop_yt_video_' + Date.now(), 
          sender: pId,
          senderName: t(lang, 'serverName'),
          ttl: 15 
        };
        
        setYoutubeBroadcasts(prev => {
          const next = { ...prev };
          delete next[pId];
          return next;
        });
        distributeMessage(msg, null);
      };

      const handleIncomingData = (data, sourceConn) => {
        // Handle Heartbeat from any user (even if not directly connected long-term)
        if (data && data.type === 'heartbeat') {
          heartbeatsRef.current.set(sourceConn.peer, Date.now());
          if (data.worldQuizAtivo) {
            worldQuizNodesRef.current.add(sourceConn.peer);
          } else {
            worldQuizNodesRef.current.delete(sourceConn.peer);
          }
          setStats(prev => ({
            ...prev,
            hydraNodes: heartbeatsRef.current.size
          }));
          
          // Responde com as estatísticas para que o nó saiba quem são os distribuidores
          try {
            sourceConn.send({
              type: 'network-stats',
              totalOnline: heartbeatsRef.current.size,
              timestamp: Date.now(),
              worldQuizNodes: Array.from(worldQuizNodesRef.current)
            });
          } catch(e) {}
          
          // If it's just a heartbeat and we are in Hydra Mode, we can close the connection to save resources
          if (isHydraModeRef.current) {
            setTimeout(() => {
              try { sourceConn.close(); } catch(e) {}
            }, 1000);
          }
          return;
        }

        // Se estiver no modo Hydra, ignora qualquer mensagem de chat/dados
        if (isHydraModeRef.current) return;

        console.log(`Recebendo dados de ${sourceConn.peer}:`, data);
        
        if (data.type === 'pex') {
          // FASE-2: atualiza diretório de grupos com info do PEX enriquecido
          if (data.groupId && data.groupSize !== undefined) {
            if (!activeGroupsRef.current[data.groupId]) {
              activeGroupsRef.current[data.groupId] = { size: 0, reservados: [], members: new Set() };
            }
            // V6 (P1): autoridade do server e o conjunto 'members'.
            // Usa Math.max do reportado vs membros conhecidos para evitar regressao.
            if (data.peerId) activeGroupsRef.current[data.groupId].members.add(data.peerId);
            activeGroupsRef.current[data.groupId].size = Math.max(
              data.groupSize,
              activeGroupsRef.current[data.groupId].members.size
            );
            if (data.isReservado && data.peerId) {
              const set = new Set(activeGroupsRef.current[data.groupId].reservados);
              set.add(data.peerId);
              activeGroupsRef.current[data.groupId].reservados = [...set].slice(0, 10); // V7-B7
            }
          }
          return; // Servidor não precisa processar PEX de clientes além disso
        }

        // ═══ V8-BUG#2: directory-announce — servidor escuta para diretório global ═══
        if (data.type === 'directory-announce') {
          if (!data.groupId || typeof data.groupId !== 'string' || data.groupId.length > 50) return;
          if (data.msgId && seenMessagesRef.current.has(data.msgId)) return;
          if (data.msgId) { seenMessagesRef.current.add(data.msgId); pruneSeenSrv(); } // FIX BUG-I
          if (!activeGroupsRef.current[data.groupId]) {
            activeGroupsRef.current[data.groupId] = { size: 0, reservados: [], members: new Set() };
          }
          const g = activeGroupsRef.current[data.groupId];
          if (typeof data.groupSize === 'number' && data.groupSize >= 0 && data.groupSize <= 100000) {
            g.size = Math.max(g.size, data.groupSize, g.members.size);
          }
          if (Array.isArray(data.reservados)) {
            const set = new Set([...g.reservados, ...data.reservados.filter(x => typeof x === 'string').slice(0, 10)]);
            g.reservados = [...set].slice(0, 10);
          }
          // Re-broadcast para outros peers conectados (relay com TTL decrementado)
          const ttl = (data.ttl || 0) - 1;
          if (ttl > 0) {
            const relay = { ...data, ttl };
            activeConnectionsRef.current.forEach((c, pid) => {
              if (pid !== sourceConn.peer && c.open) try { c.send(relay); } catch(e) {}
            });
          }
          return;
        }

        // ═══ V8-BUG#2: group-split / group-merge — servidor relay + atualiza diretório ═══
        if (data.type === 'group-split') {
          addAudit(`[Hydra] Split: ${data.oldGroupId} gerou ${data.newGroupId}`, 'info');
          if (data.msgId && seenMessagesRef.current.has(data.msgId)) return;
          if (data.msgId) { seenMessagesRef.current.add(data.msgId); pruneSeenSrv(); } // FIX BUG-I
          if (data.newGroupId && !activeGroupsRef.current[data.newGroupId]) {
            activeGroupsRef.current[data.newGroupId] = { size: 0, reservados: Array.isArray(data.migratedReservados) ? data.migratedReservados.slice(0,10) : [], members: new Set() };
          }
          const ttl = (data.ttl || 0) - 1;
          if (ttl > 0) {
            const relay = { ...data, ttl };
            activeConnectionsRef.current.forEach((c, pid) => {
              if (pid !== sourceConn.peer && c.open) try { c.send(relay); } catch(e) {}
            });
          }
          return;
        }
        if (data.type === 'group-merge') {
          addAudit(`[Hydra] Merge: ${data.absorbedGroupId} absorvido por ${data.survivingGroupId}`, 'info');
          if (data.msgId && seenMessagesRef.current.has(data.msgId)) return;
          if (data.msgId) { seenMessagesRef.current.add(data.msgId); pruneSeenSrv(); } // FIX BUG-I
          const { survivingGroupId, absorbedGroupId } = data;
          if (survivingGroupId && absorbedGroupId && activeGroupsRef.current[absorbedGroupId]) {
            const surv = activeGroupsRef.current[survivingGroupId] || (activeGroupsRef.current[survivingGroupId] = { size: 0, reservados: [], members: new Set() });
            const abs = activeGroupsRef.current[absorbedGroupId];
            // merge members
            abs.members.forEach(p => surv.members.add(p));
            const mergedR = new Set([...surv.reservados, ...abs.reservados]);
            surv.reservados = [...mergedR].slice(0, 10);
            // V8: groupSize = MAX (idempotente)
            surv.size = Math.max(surv.size, surv.members.size, (surv.size || 0) + (abs.size || 0));
            // remap peerGroupMap
            abs.members.forEach(p => peerGroupMapRef.current.set(p, survivingGroupId));
            delete activeGroupsRef.current[absorbedGroupId];
          }
          const ttl = (data.ttl || 0) - 1;
          if (ttl > 0) {
            const relay = { ...data, ttl };
            activeConnectionsRef.current.forEach((c, pid) => {
              if (pid !== sourceConn.peer && c.open) try { c.send(relay); } catch(e) {}
            });
          }
          return;
        }

        // ── Quiz Bot: controle de slot único por servidor ────────────────
        if (data.type === 'subscribe-world-quiz') {
          addAudit(`[Quiz] Usuário ${sourceConn.peer} inscrito no Quiz Mundial`, 'info');
          // O servidor apenas repassa essa mensagem para o distribuidor correto
          const distributorConn = activeConnectionsRef.current.get(data.distributorId);
          if (distributorConn) {
            try { distributorConn.send(data); } catch(e) {}
          }
          return;
        }

        if (data.type === 'quiz-bot-start') {
          // Se o SERVIDOR estava transmitindo: cede o controle ao usuário
          // (para timer, limpa estado, mas NÃO anuncia status:false — o owner muda direto)
          if (serverQuizActiveRef.current) {
            console.log('🔄 Usuário', sourceConn.peer, 'assumiu o Quiz — servidor cede transmissão');
            serverQuizActiveRef.current = false;
            setServerQuizActive(false);
            if (srvQuizTimerRef.current) { clearTimeout(srvQuizTimerRef.current); srvQuizTimerRef.current = null; }
            srvCurrentQuizRef.current = null;
            // FIX BUG-2: marca timestamp agora para cooldown ficar correto
            // quando/se o servidor retomar depois
            srvLastQuizTimeRef.current = Date.now();
          }
          quizBotPeerRef.current = sourceConn.peer;
          // Notifica TODOS os conectados que o bot está ativo
          activeConnectionsRef.current.forEach((c, id) => {
            try { c.send({ type: 'quiz-bot-status', active: true, owner: sourceConn.peer }); } catch(e) {}
          });
          return;
        }
        if (data.type === 'quiz-bot-stop') {
          if (quizBotPeerRef.current === sourceConn.peer) {
            quizBotPeerRef.current = null;
            activeConnectionsRef.current.forEach((c) => {
              try { c.send({ type: 'quiz-bot-status', active: false }); } catch(e) {}
            });
          }
          return;
        }
        // ── HANDOFF: usuário desligou bot e nos passa o estado pra continuar ──
        if (data.type === 'quiz-handoff') {
          handleQuizHandoff(data, sourceConn.peer);
          return;
        }

        if (data.type === 'message' || data.type === 'torrent-request') {
          if (data.id) {
            if (seenMessagesRef.current.has(data.id)) {
              console.log(`Servidor: ${data.type} repetido ignorado (Anti-Loop).`);
              return;
            }
            seenMessagesRef.current.add(data.id);
            pruneSeenSrv(); // FIX BUG-I: substitui purga manual por pruneSeenSrv() consistente
          }

          if (data.type === 'message') {
            // Role Tracking Global: se é um quiz de um usuário, atualiza cooldown do servidor
            if (data.text === '__QUIZ__' && data.quizPayload) {
              srvLastQuizTimeRef.current = Date.now();
            }
            
            if (data.text && data.text.length > 2000) {
              console.log("Servidor: Mensagem muito longa ignorada.");
              return;
            }
            setStats(prev => ({
              ...prev,
              messagesReceived: prev.messagesReceived + 1
            }));

            const senderName = data.senderName || sourceConn.peer;
            
            const newMessage = {
              id: data.id || (Date.now() + Math.random().toString(36).substring(2)),
              text: data.text,
              sender: senderName,
              timestamp: new Date().toISOString(),
              source: sourceConn.peer
            };
            
            setMessages(prev => [...prev, newMessage].slice(-100));
          }
          
          distributeMessage(data, sourceConn.peer);
        }
        else if (data.type === 'radio-start' || data.type === 'radio-stream-start' || data.type === 'radio-chunk' || data.type === 'radio-sync' || data.type === 'radio-request-sync') {
          if (!data.id) data = { ...data, id: Date.now() + Math.random().toString(36).substring(2) };
          if (seenMessagesRef.current.has(data.id)) return;
          seenMessagesRef.current.add(data.id); pruneSeenSrv(); // FIX BUG-I
          
          if (data.type === 'radio-start' || data.type === 'radio-stream-start' || data.type === 'radio-sync') {
            radioStateRef.current = {
              status: 'playing',
              radioType: data.type === 'radio-stream-start' || data.radioType === 'stream' ? 'stream' : 'file',
              startTime: data.startTime,
              duration: data.duration,
              fileName: data.fileName,
              senderName: data.senderName,
              streamUrl: data.streamUrl
            };
          }
          
          // O Servidor também atua como um relay para a rádio
          distributeMessage(data, sourceConn.peer);
        }
        else if (data.type === 'audio-start' || data.type === 'audio-chunk') {
          if (data.type === 'audio-start' && data.audioSize > 2 * 1024 * 1024) {
            console.log("Servidor: Áudio muito longo ignorado (limite de 1 minuto).");
            return;
          }
          // FIX BUG-E: garante ID para dedup sempre funcionar, mesmo em chunks sem ID
          if (!data.id) data = { ...data, id: sourceConn.peer + '_' + data.type + '_' + (data.audioId || '') + '_' + (data.offset || 0) };
          if (seenMessagesRef.current.has(data.id)) return;
          seenMessagesRef.current.add(data.id); pruneSeenSrv(); // FIX BUG-I
          distributeMessage(data, sourceConn.peer);
        }
        else if (data.type === 'file-start' || data.type === 'file-chunk') {
          console.log("Bloqueado: O servidor agora só repassa mensagens de texto, emojis, torrents e áudio para proteger a banda da rede.");
        }
        else if (data.type === 'e2ee-secret' || data.type === 'server-e2ee-invite' || data.type === 'youtube-cam-start' || data.type === 'youtube-cam-stop' || data.type === 'youtube-chat-start' || data.type === 'radio-youtube-start' || data.type === 'radio-youtube-stop' || data.type === 'radio-world-start' || data.type === 'radio-world-stop') {
           // Relay para segredos E2EE, YouTube Cam, YouTube Chat e Radio YouTube
           // FIX BUG-G: garante ID para dedup sempre funcionar
           if (!data.id) data = { ...data, id: sourceConn.peer + '_' + data.type + '_' + Date.now() };
           if (seenMessagesRef.current.has(data.id)) return;
           seenMessagesRef.current.add(data.id); pruneSeenSrv(); // FIX BUG-I
           if (data.type === 'youtube-chat-start') {
             if (youtubeChatIdRef.current) return;
             setYoutubeChatId(data.youtubeId);
           }
           if (data.type === 'radio-youtube-start') {
             setYoutubeBroadcasts(prev => ({ ...prev, [data.sender || sourceConn.peer]: { videoId: data.youtubeId, senderName: data.senderName } }));
           }
           if (data.type === 'radio-youtube-stop') {
             setYoutubeBroadcasts(prev => {
               const next = { ...prev };
               delete next[data.sender || sourceConn.peer];
               return next;
             });
           }
           distributeMessage(data, sourceConn.peer);
        }
        else if (data.type === 'youtube-chat-stop') {
           // FIX BUG-G: garante ID para dedup
           if (!data.id) data = { ...data, id: sourceConn.peer + '_yt_stop_' + Date.now() };
           if (seenMessagesRef.current.has(data.id)) return;
           seenMessagesRef.current.add(data.id); pruneSeenSrv(); // FIX BUG-I
           setYoutubeChatId(null);
           // FIX S-7: relay para todos os outros peers — sem isso, clientes ficavam com aba YT presa
           // porque apenas o servidor limpava o estado, mas nenhum cliente recebia o stop.
           distributeMessage(data, sourceConn.peer);
        }
      };

      const distributeMessage = (data, sourceId) => {
        let distributionCount = 0;
        
        let currentTtl = data.ttl !== undefined ? data.ttl : 8;
        if (currentTtl <= 0) {
          console.log("Servidor: Mensagem descartada por TTL = 0");
          return;
        }
        
        const relayData = { ...data, ttl: currentTtl - 1 };
        
        activeConnectionsRef.current.forEach((conn, connPeerId) => {
          // BUG S-2 FIX: checa conn.open antes de enviar para evitar erros desnecessários
          if (connPeerId !== sourceId && conn.open) {
            try {
              console.log(`Distribuindo mensagem para ${connPeerId}`);
              conn.send(relayData);
              distributionCount++;
            } catch (err) {
              console.error(`Erro ao enviar para ${connPeerId}:`, err);
            }
          }
        });
        
        setStats(prev => ({
          ...prev,
          messagesDistributed: prev.messagesDistributed + distributionCount
        }));
        
        console.log(`Mensagem distribuída para ${distributionCount} conexões`);
      };

      const setupConnection = (conn) => {
        conn.on('open', () => {
          console.log(`Conexão estabelecida com ${conn.peer}`);
          addAudit(`🔗 Conexão aberta: ${conn.peer}`, 'ok');
          
          if (isHydraModeRef.current) {
            // MODO HYDRA: Apenas envia a lista de peers e desconecta
            if (!recentPeersRef.current.includes(conn.peer)) {
              recentPeersRef.current.push(conn.peer);
              // FASE-1/M1: cap expandido 1.000→5.000; remoção aleatória evita viés temporal
              if (recentPeersRef.current.length > 5000) {
                const idx = Math.floor(Math.random() * recentPeersRef.current.length);
                recentPeersRef.current.splice(idx, 1);
              }
              
              setStats(prev => ({
                ...prev,
                hydraNodes: recentPeersRef.current.length
              }));
            }
            
            // FASE-1/M1: amostra aleatória de 50 – elimina ilhas temporais do slice(-50)
            const filtered = recentPeersRef.current.filter(p => p !== conn.peer);
            const peersToSend = filtered.sort(() => 0.5 - Math.random()).slice(0, 50);
            
            try {
              conn.send({
                type: 'migrate-to-p2p',
                peers: peersToSend,
                message: t(langRef.current, 'hydraModeMessage') // FIX S1
              });
            } catch (err) {}
            
            // Desconecta após enviar a lista para não pesar o servidor
            setTimeout(() => {
              try { conn.close(); } catch(e) {}
            }, 2000);
            return;
          }

          activeConnectionsRef.current.set(conn.peer, conn);
          
          // Informa ao novo peer se já há um Quiz Bot ativo no servidor
          if (quizBotPeerRef.current) {
            try { conn.send({ type: 'quiz-bot-status', active: true, owner: quizBotPeerRef.current }); } catch(e) {}
          }
          
          setConnections(Array.from(activeConnectionsRef.current.keys()));
          
          setStats(prev => ({
            ...prev,
            activeConnections: activeConnectionsRef.current.size,
            hydraNodes: recentPeersRef.current.length
          }));

          // VERIFICA SE ATINGIU O LIMITE PARA VIRAR HYDRA AUTOMATICAMENTE
          if (activeConnectionsRef.current.size >= HYDRA_THRESHOLD && !isHydraModeRef.current) {
            console.log("LIMITE ATINGIDO! Ativando MODO HYDRA: Migrando todos para a Rede Global P2P...");
            isHydraModeRef.current = true;
            
            const allPeers = Array.from(activeConnectionsRef.current.keys());
            recentPeersRef.current = [...allPeers]; // Salva os peers atuais no cache do Hydra
            
            // Avisa todos os conectados para formarem a rede P2P
            activeConnectionsRef.current.forEach(c => {
              try {
                c.send({
                  type: 'migrate-to-p2p',
                  peers: allPeers,
                  message: t(langRef.current, 'serverFullMigration') // FIX S1
                });
              } catch (err) {}
            });
            
            // Opcional: O servidor pode fechar as conexões depois de um tempo, 
            // mas os próprios clientes vão se conectar entre si.
            // Para garantir que o servidor fique leve, vamos desconectar todos após 5 segundos.
            setTimeout(() => {
              activeConnectionsRef.current.forEach(c => {
                try { c.close(); } catch(e) {}
              });
              activeConnectionsRef.current.clear();
              setConnections([]);
              setStats(prev => ({ ...prev, activeConnections: 0 }));
            }, 5000);
          }
          
          // FIX S-8 V20: cada send em try-catch individual — falha em handshake não descarta peer-list
          // Always send handshake from server so clients know it's a central server
          try { conn.send({ type: 'handshake', peerId: peerIdRef.current }); } catch(e) {}
          if (youtubeChatIdRef.current) {
            try { conn.send({ type: 'youtube-chat-start', id: Date.now() + Math.random().toString(), youtubeId: youtubeChatIdRef.current, ttl: 0 }); } catch(e) {}
          }
          // FASE-1/M2: Bootstrap – envia amostra aleatória de peers ao novo nó
          // para que ele possa estabelecer conexões P2P imediatamente
          const allPeersNow = Array.from(activeConnectionsRef.current.keys());
          const others = allPeersNow.filter(pid => pid !== conn.peer);
          const sample = others.sort(() => 0.5 - Math.random()).slice(0, 30);
          // FASE-2: inclui groupId do grupo mais fraco para orientar o novo nó
          const groups = Object.entries(activeGroupsRef.current);
          const weakestEntry = groups.length > 0
            ? groups.reduce((a, b) => a[1].size < b[1].size ? a : b)
            : null;
          const assignedGroupId = weakestEntry ? weakestEntry[0] : 'G0001';
          if (!activeGroupsRef.current[assignedGroupId]) {
            activeGroupsRef.current[assignedGroupId] = { size: 0, reservados: [], members: new Set() };
          }
          activeGroupsRef.current[assignedGroupId].size += 1;
          activeGroupsRef.current[assignedGroupId].members.add(conn.peer); // FIX SRV-1: sem isso o GC (V8-F10) zera o size mesmo com peers conectados
          peerGroupMapRef.current.set(conn.peer, assignedGroupId);
          if (sample.length > 0 || assignedGroupId) {
            try { conn.send({ type: 'peer-list', peers: sample, groupId: assignedGroupId }); } catch(e) {}
          }

          // Here is the critical change to ensure we operate in pure server mode:
          // We'll send a special message to mark this as a server connection
          // when pure server mode is enabled
          if (pureServerModeRef.current) {
            try {
              conn.send({
                type: 'server-info',
                isServer: true,
                message: t(langRef.current, 'pureServerModeConnected') // FIX S1
              });
            } catch (err) {
              console.error(`Erro ao enviar informação de servidor para ${conn.peer}:`, err);
            }
          }

          // Se a rádio estiver tocando, avisa o novato imediatamente
          if (radioStateRef.current.status === 'playing') {
            const now = Date.now();
            if (radioStateRef.current.radioType === 'stream') {
              // FIX S-11 V22: cada send em try-catch individual — se radio-sync falha, '#$%' não era enviado
              try {
                conn.send({
                  type: 'radio-sync',
                  radioType: 'stream',
                  startTime: radioStateRef.current.startTime,
                  streamUrl: radioStateRef.current.streamUrl,
                  fileName: radioStateRef.current.fileName || t(langRef.current, 'globalRadio'), // FIX S1
                  senderName: radioStateRef.current.senderName || t(langRef.current, 'k10Server') // FIX S1
                });
              } catch (e) {}
              try {
                conn.send({
                  type: 'message',
                  text: '#$%',
                  senderName: t(langRef.current, 'k10Server'), // FIX S1
                  id: 'radio_block_' + Date.now()
                });
              } catch (e) {}
            } else {
              const endTime = radioStateRef.current.startTime + radioStateRef.current.duration * 1000;
              if (now < endTime) {
                // FIX S-12 V22: cada send em try-catch individual — se radio-sync falha, '#$%' não era enviado
                try {
                  conn.send({
                    type: 'radio-sync',
                    radioType: 'file',
                    startTime: radioStateRef.current.startTime,
                    duration: radioStateRef.current.duration,
                    fileName: radioStateRef.current.fileName || t(langRef.current, 'globalRadio'), // FIX S1
                    senderName: radioStateRef.current.senderName || t(langRef.current, 'k10Server') // FIX S1
                  });
                } catch (e) {}
                try {
                  conn.send({
                    type: 'message',
                    text: '#$%',
                    senderName: t(langRef.current, 'k10Server'), // FIX S1
                    id: 'radio_block_' + Date.now()
                  });
                } catch (e) {}
              } else {
                radioStateRef.current.status = 'idle';
              }
            }
          }
        });

        conn.on('data', (data) => {
          handleIncomingData(data, conn);
        });

        conn.on('close', () => {
          console.log(`Conexão fechada com ${conn.peer}`);
          addAudit(`🔌 Conexão encerrada: ${conn.peer}`, 'warn');
          
          // Libera slot do Quiz Bot se era o dono
          if (quizBotPeerRef.current === conn.peer) {
            quizBotPeerRef.current = null;
            activeConnectionsRef.current.forEach((c) => {
              try { c.send({ type: 'quiz-bot-status', active: false }); } catch(e) {}
            });
          }
          
          // FASE-2 + V3 FIX BUG#S1/S2: decrementa size E remove do members:Set.
          // Sem o .delete(), Math.max(reportado, members.size) inflava com fantasmas.
          const peerGroupId = peerGroupMapRef.current.get(conn.peer);
          if (peerGroupId && activeGroupsRef.current[peerGroupId]) {
            activeGroupsRef.current[peerGroupId].size = Math.max(0, activeGroupsRef.current[peerGroupId].size - 1);
            activeGroupsRef.current[peerGroupId].members.delete(conn.peer);
          }
          peerGroupMapRef.current.delete(conn.peer);
          
          activeConnectionsRef.current.delete(conn.peer);
          
          setConnections(Array.from(activeConnectionsRef.current.keys()));
          
          setStats(prev => ({
            ...prev,
            activeConnections: activeConnectionsRef.current.size,
            hydraNodes: recentPeersRef.current.length
          }));
        });

        conn.on('error', (err) => {
          console.error(`Erro na conexão com ${conn.peer}:`, err);
        });
      };

      
      // ════════════════════════════════════════════════════════════════════
      // SERVIDOR — transmissão do Quiz após handoff (mesmo wire-format)
      // ════════════════════════════════════════════════════════════════════
      const srvSendQuizQuestion = (quizData) => {
        const ts = new Date();
        srvLastQuizTimeRef.current = ts.getTime();
        const wireMsg = {
          type: 'message',
          id: Date.now() + Math.random().toString(36).substring(2),
          ttl: 15,
          // FIX BUG-4: campo sender presente para que o filtro de vigilância
          // identifique corretamente a fonte e não aplique spam ao peerId do servidor
          sender: 'server-self',
          senderName: '🤖 Quiz Bot',
          direct: false,
          time: ts.toLocaleTimeString('en-US'),
          timestamp: ts.getTime(),
          text: '__QUIZ__',
          quizPayload: quizData
        };
        activeConnectionsRef.current.forEach(c => { try { c.send(wireMsg); } catch(e) {} });
      };
      const srvSendQuizReveal = (quizId, votes) => {
        const ts = new Date();
        const wireMsg = {
          type: 'message',
          id: Date.now() + Math.random().toString(36).substring(2),
          ttl: 15,
          // FIX BUG-4: idem — sender explícito
          sender: 'server-self',
          senderName: '🤖 Quiz Bot',
          direct: false,
          time: ts.toLocaleTimeString('en-US'),
          text: '__QUIZ_REVEAL__',
          quizRevealPayload: { quizId, votes: votes || {} }
        };
        activeConnectionsRef.current.forEach(c => { try { c.send(wireMsg); } catch(e) {} });
      };

      const srvNextWorldPlace = () => {
        const i = srvWorldPlaceIdxRef.current % WORLD_PLACES.length;
        srvWorldPlaceIdxRef.current = (srvWorldPlaceIdxRef.current + 1) % WORLD_PLACES.length;
        return WORLD_PLACES[i];
      };

      const srvAskWorldQuestion = async () => {
        if (!serverQuizActiveRef.current) return;
        if (srvQuizTimerRef.current) clearTimeout(srvQuizTimerRef.current);

        const place = srvNextWorldPlace();
        const hit = await srvFetchWorldImage(place.query, srvQuizUsedImagesRef.current);
        const imgUrl = hit ? (hit.largeImageURL || hit.webformatURL) : null;
        const imgId = hit ? hit.id : null;

        const [countryOpts, countryCorrectIdx] = srvBuildAlternatives(ALL_COUNTRIES, place.country);
        const quizId1 = 'quiz-srv-w1-' + Date.now() + '-' + Math.random().toString(36).substring(2);
        const quizData1 = {
          quizId: quizId1,
          quizQuestion: '🌍 Em qual PAÍS fica este lugar famoso?',
          quizOptions: countryOpts,
          quizCorrect: countryCorrectIdx,
          quizSubject: '📸 Lugares do Mundo',
          quizStage: 1,
          quizImage: imgUrl || undefined,
          quizImageId: imgId || undefined,
          nonce: Math.random().toString(36).substring(2, 10)
        };
        srvCurrentQuizRef.current = { ...quizData1, votes: {} };
        srvSendQuizQuestion(quizData1);

        srvQuizTimerRef.current = setTimeout(() => {
          if (!serverQuizActiveRef.current) return;
          srvSendQuizReveal(quizId1, {});
          srvCurrentQuizRef.current = null;

          setTimeout(() => {
            if (!serverQuizActiveRef.current) return;
            const statePool = place.statePool || ALL_COUNTRIES;
            const [stateOpts, stateCorrectIdx] = srvBuildAlternatives(statePool, place.state);
            const quizId2 = 'quiz-srv-w2-' + Date.now() + '-' + Math.random().toString(36).substring(2);
            const quizData2 = {
              quizId: quizId2,
              quizQuestion: '🗺️ Em qual ESTADO ou CIDADE fica este lugar?',
              quizOptions: stateOpts,
              quizCorrect: stateCorrectIdx,
              quizSubject: '📸 Lugares do Mundo',
              quizStage: 2,
              quizImage: imgUrl || undefined,
              nonce: Math.random().toString(36).substring(2, 10)
            };
            srvCurrentQuizRef.current = { ...quizData2, votes: {} };
            srvSendQuizQuestion(quizData2);

            srvQuizTimerRef.current = setTimeout(() => {
              if (!serverQuizActiveRef.current) return;
              srvSendQuizReveal(quizId2, {});
              srvCurrentQuizRef.current = null;
              setTimeout(() => { if (serverQuizActiveRef.current) srvAskNextQuestion(); }, 10000);
            }, srvQuizIntervalRef.current * 1000);
          }, 5000);
        }, srvQuizIntervalRef.current * 1000);
      };

      const srvAskDisciplineQuestion = async () => {
        if (!serverQuizActiveRef.current) return;
        if (srvQuizTimerRef.current) clearTimeout(srvQuizTimerRef.current);

        const ALL_POOL = QUIZ_SUBJECTS.filter(s => s.id !== 'world');
        let subj;
        if (srvQuizDisciplineRef.current === 'all') {
          subj = ALL_POOL[srvQuizAllIdxRef.current % ALL_POOL.length];
          srvQuizAllIdxRef.current = (srvQuizAllIdxRef.current + 1) % ALL_POOL.length;
        } else {
          subj = QUIZ_SUBJECTS.find(s => s.id === srvQuizDisciplineRef.current) || ALL_POOL[0];
        }
        if (!subj || !subj.url) subj = ALL_POOL[0];

        let questions = [];
        try {
          const res = await fetch(subj.url);
          const data = await res.json();
          const arr = Array.isArray(data) ? data : (Object.values(data).find(v => Array.isArray(v)) || []);
          questions = arr.filter(p => p.pergunta && Array.isArray(p.opcoes) && typeof p.correta === 'number');
        } catch(e) { console.warn('Server quiz fetch err', e); }
        if (!questions.length) {
          questions = [
            { pergunta:'Qual a capital do Brasil?', opcoes:['São Paulo','Rio de Janeiro','Brasília','Salvador'], correta:2 }
          ];
        }
        const q = questions[Math.floor(Math.random() * questions.length)];
        const cleanOpts = q.opcoes.map(s => s.replace(/^[A-Fa-f]\)\s*/, '').trim());
        const quizId = 'quiz-srv-' + Date.now() + '-' + Math.random().toString(36).substring(2);
        const quizData = {
          quizId,
          quizQuestion: q.pergunta,
          quizOptions: cleanOpts,
          quizCorrect: q.correta,
          quizSubject: `${subj.emoji} ${subj.name}`,
          quizStage: 0,
          nonce: Math.random().toString(36).substring(2, 10)
        };
        srvCurrentQuizRef.current = { ...quizData, votes: {} };
        srvSendQuizQuestion(quizData);

        srvQuizTimerRef.current = setTimeout(() => {
          if (!serverQuizActiveRef.current) return;
          srvSendQuizReveal(quizId, {});
          srvCurrentQuizRef.current = null;
          setTimeout(() => { if (serverQuizActiveRef.current) srvAskNextQuestion(); }, 15000);
        }, srvQuizIntervalRef.current * 1000);
      };

      const srvAskNextQuestion = async () => {
        if (!serverQuizActiveRef.current) return;
        
        // FIX: Respeita o cooldown global antes de disparar próxima pergunta
        const now = Date.now();
        const elapsed = now - srvLastQuizTimeRef.current;
        const minIntervalMs = SRV_MIN_QUIZ_INTERVAL * 1000;
        
        if (elapsed < minIntervalMs) {
          const wait = minIntervalMs - elapsed + 1000;
          console.log(`Server Quiz: Respeitando cooldown. Aguardando ${Math.round(wait/1000)}s...`);
          srvQuizTimerRef.current = setTimeout(srvAskNextQuestion, wait);
          return;
        }

        if (srvQuizDisciplineRef.current === 'world') return srvAskWorldQuestion();
        return srvAskDisciplineQuestion();
      };

      // ── Receber HANDOFF: o usuário desligou e entregou o controle ──
      const handleQuizHandoff = (data, fromPeer) => {
        if (serverQuizActiveRef.current) {
          console.log('🛑 Servidor já está transmitindo — handoff ignorado');
          return;
        }
        // FIX BUG-3a: se outro peer (não quem enviou) ainda é dono do bot, ignora
        if (quizBotPeerRef.current && quizBotPeerRef.current !== fromPeer && quizBotPeerRef.current !== 'server-self') {
          console.log('🛑 Outro peer já é dono do Quiz Bot — handoff de', fromPeer, 'ignorado');
          return;
        }
        // Hidrata estado a partir do handoff (URL+ID, sem binário)
        srvQuizDisciplineRef.current = data.quizDiscipline || 'world';
        srvQuizIntervalRef.current = Math.max(SRV_MIN_QUIZ_INTERVAL, data.quizInterval || SRV_MIN_QUIZ_INTERVAL);
        srvQuizUsedImagesRef.current = new Set(data.usedImageIds || []);
        if (data.lastQuizTime) srvLastQuizTimeRef.current = data.lastQuizTime;
        // Hidrata cache de hits Pixabay (já buscados pelo cliente — evita refetch)
        if (data.bufferedHits && typeof data.bufferedHits === 'object') {
          for (const q in data.bufferedHits) {
            if (Array.isArray(data.bufferedHits[q])) {
              _srvImgCache[q] = data.bufferedHits[q].slice(0);
            }
          }
        }
        // Toma posse do slot único (igual quiz-bot-start)
        quizBotPeerRef.current = 'server-self';
        activeConnectionsRef.current.forEach(c => {
          try { c.send({ type: 'quiz-bot-status', active: true, owner: 'server-self' }); } catch(e) {}
        });
        serverQuizActiveRef.current = true;
        setServerQuizActive(true);
        console.log('🎯 Servidor assumiu o Quiz Bot via handoff de', fromPeer, data);

        // FIX BUG-3b: jitter inteligente — espera o cooldown restante + 3s de segurança,
        // evitando que o servidor envie pergunta antes do MIN_QUIZ_INTERVAL do cliente (120s)
        // expirar. Jitter fixo de 1500ms era insuficiente e causava violação de spam.
        const now = Date.now();
        const elapsed = now - srvLastQuizTimeRef.current;
        const minMs = SRV_MIN_QUIZ_INTERVAL * 1000;
        const cooldownRemaining = Math.max(0, minMs - elapsed);
        const jitter = cooldownRemaining + 3000; // 3s extra de folga para mensagens em trânsito
        console.log(`⏳ Handoff jitter: ${Math.round(jitter/1000)}s (cooldown restante: ${Math.round(cooldownRemaining/1000)}s)`);
        srvQuizTimerRef.current = setTimeout(() => { if (serverQuizActiveRef.current) srvAskNextQuestion(); }, jitter);
      };

      // ── Botão "Parar Quiz" — só funciona se o servidor está transmitindo ──
      const stopServerQuiz = () => {
        if (!serverQuizActiveRef.current) return;
        serverQuizActiveRef.current = false;
        setServerQuizActive(false);
        if (srvQuizTimerRef.current) { clearTimeout(srvQuizTimerRef.current); srvQuizTimerRef.current = null; }
        srvCurrentQuizRef.current = null;
        if (quizBotPeerRef.current === 'server-self') {
          quizBotPeerRef.current = null;
          activeConnectionsRef.current.forEach(c => {
            try { c.send({ type: 'quiz-bot-status', active: false }); } catch(e) {}
          });
        }
        console.log('🛑 Quiz parado pelo servidor (manual)');
      };

      const broadcastYoutubeChat = () => {
        if (youtubeChatId) { alert(t(lang, 'chatAlreadyActive')); return; }
        const url = prompt(t(lang, 'enterYoutubeUrl'));
        if (!url) return;
        let yId = null;
        try {
          let parsedUrl = url;
          if (!parsedUrl.startsWith('http')) parsedUrl = 'https://' + parsedUrl;
          if (parsedUrl.includes('youtu.be/')) yId = parsedUrl.split('youtu.be/')[1].split('?')[0];
          else if (parsedUrl.includes('youtube.com/watch')) yId = new URL(parsedUrl).searchParams.get('v');
          else if (parsedUrl.includes('youtube.com/live/')) yId = parsedUrl.split('youtube.com/live/')[1].split('?')[0];
        } catch (e) {}
        if (!yId) { alert(t(lang, 'invalidYoutubeUrl')); return; }
        
        setYoutubeChatId(yId);
        const msgId = Date.now() + Math.random().toString(36).substring(2);
        // BUG S-4 FIX: adiciona ao seenMessages antes de broadcast para evitar loop de relay
        seenMessagesRef.current.add(msgId);
        pruneSeenSrv();
        const msgData = { type: 'youtube-chat-start', id: msgId, youtubeId: yId, ttl: 15 };
        // BUG S-5 FIX: checa conn.open antes de enviar
        activeConnectionsRef.current.forEach((c) => { if (c.open) try { c.send(msgData); } catch(e){} });
      };

      const stopYoutubeChat = () => {
        setYoutubeChatId(null);
        // BUG S-3 FIX: faltava broadcast do stop para que os clientes
        // saibam que o chat foi encerrado e limpem o tab YouTube.
        const msgId = Date.now() + Math.random().toString(36).substring(2);
        seenMessagesRef.current.add(msgId);
        pruneSeenSrv();
        const msgData = { type: 'youtube-chat-stop', id: msgId, ttl: 8 };
        activeConnectionsRef.current.forEach((c) => { if (c.open) try { c.send(msgData); } catch(e){} });
      };

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
            <h1 style={{ margin: 0 }}>{t(lang, 'serverTitle')}</h1>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button
                onClick={() => setDarkMode(d => !d)}
                title={t(lang, 'darkMode')}
                style={{
                  padding: '5px 10px',
                  fontSize: '14px',
                  borderRadius: '4px',
                  border: '1px solid #334155',
                  background: darkMode ? '#1e293b' : '#f1f5f9',
                  color: darkMode ? '#e2e8f0' : '#1e293b',
                  cursor: 'pointer'
                }}
              >
                {darkMode ? '☀️' : '🌙'}
              </button>
              <a 
                href="https://andradepsa.github.io/MATEMATICO10/chat/manual.html"
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  padding: '5px 10px',
                  fontSize: '12px',
                  borderRadius: '4px',
                  border: '1px solid #1e3a5f',
                  background: '#1e40af',
                  color: 'white',
                  cursor: 'pointer',
                  fontWeight: 'bold',
                  textDecoration: 'none',
                  display: 'inline-flex',
                  alignItems: 'center'
                }}
              >
                📖 Manual
              </a>
              <button 
                onClick={() => setLang(lang === 'en' ? 'pt' : 'en')}
                style={{
                  padding: '5px 10px',
                  fontSize: '12px',
                  borderRadius: '4px',
                  border: '1px solid #0369a1',
                  background: '#0ea5e9',
                  color: 'white',
                  cursor: 'pointer',
                  fontWeight: 'bold'
                }}
              >
                {t(lang, 'language')}
              </button>
            </div>
          </div>

          <p>{t(lang, 'idDescription1')}</p>
          <p>{t(lang, 'idDescription2')}</p>
          <p>{t(lang, 'idDescription3')}</p>
          <p>{t(lang, 'idDescription4')}</p>
          <div style={{ background: '#f0f9ff', border: '1px solid #bae6fd', padding: '10px', borderRadius: '8px', marginBottom: '15px', fontSize: '13px', color: '#0369a1' }}>
            <i className="fas fa-info-circle"></i> {t(lang, 'ytChatExplanation')}
          </div>
          <div className="peer-id-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
              <span className={`connection-badge ${
                connectionStatus === 'connected' ? 'connected' :
                (connectionStatus === 'connecting' || connectionStatus.startsWith('reconnecting')) ? 'connecting' :
                (connectionStatus.startsWith('error') && connectionStatus !== 'errorFatal') ? 'connecting' :
                'disconnected'
              }`}>
                <span className={`status-indicator status-${
                  connectionStatus === 'connected' ? 'online' :
                  (connectionStatus === 'connecting' || connectionStatus.startsWith('reconnecting')) ? 'connecting' : 'offline'
                }`}></span>
                {t(lang, 'status')} {t(lang, connectionStatus.split(' ')[0])} {connectionStatus.includes('(') ? connectionStatus.substring(connectionStatus.indexOf('(')) : ''}
              </span>
              <button onClick={toggleConnection} style={{ background: (connectionStatus === 'connected' || connectionStatus.startsWith('reconnecting')) ? '#ef4444' : '#4CAF50' }}>
                {connectionStatus === 'connected' || connectionStatus === 'connecting' || connectionStatus.startsWith('reconnecting') ? t(lang, 'disconnect') : t(lang, 'connect')}
              </button>
              {connectionStatus === 'errorFatal' && (
                <button onClick={() => { reconnectAttemptsRef.current = 0; isManualDisconnectRef.current = false; setupPeer(); }} style={{ background: '#ef4444', marginLeft: 8 }}>
                  {t(lang, 'forceReconnect')}
                </button>
              )}
            </div>
          </div>
          
          <IdBackupTools 
            peerId={peerId} 
            setPeerId={setPeerId} 
            onSaveId={handleIdChange} 
            isConnected={connectionStatus === 'connected' || connectionStatus === 'connecting' || connectionStatus.startsWith('reconnecting')}
            lang={lang}
          />
          
          {/* New component for controlling server mode */}
          <div className="server-mode-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flex: 1 }}>
              <strong>{t(lang, 'pureServerMode')}</strong>
              <input 
                type="checkbox" 
                checked={pureServerMode} 
                onChange={(e) => {
                  setPureServerMode(e.target.checked);
                  if (connectionStatus === 'connected') {
                    disconnectPeer();
                    setTimeout(setupPeer, 500);
                  }
                }} 
                id="serverModeCheckbox"
              />
              <label htmlFor="serverModeCheckbox">
                {t(lang, 'activatePureServer')}
              </label>
            </div>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button onClick={broadcastYoutubeChat} disabled={Boolean(youtubeChatId)} style={{ backgroundColor: youtubeChatId ? '#cccccc' : '#eab308', cursor: youtubeChatId ? 'not-allowed' : 'pointer', color: youtubeChatId ? '#666666' : 'black' }}>
                <i className="fab fa-youtube"></i> {t(lang, 'startYoutubeChat')}
              </button>
              {youtubeChatId && (
                <button onClick={stopYoutubeChat} style={{ backgroundColor: '#ef4444' }}>
                  <i className="fas fa-times"></i> {t(lang, 'stopYoutubeChat')}
                </button>
              )}
              {serverQuizActive && (
                <button onClick={stopServerQuiz} style={{ backgroundColor: '#dc2626', color: 'white', fontWeight: 'bold' }} title={t(lang, 'quizActiveOnServer')}>
                  <i className="fas fa-robot"></i> {t(lang, 'stopQuiz')}
                </button>
              )}
            </div>
          </div>

          <div className="server-mode-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flex: 1 }}>
              <strong>{t(lang, 'connectToOtherServer')}</strong>
              <input 
                type="text" 
                value={newServerId} 
                onChange={(e) => setNewServerId(e.target.value)} 
                placeholder={t(lang, 'serverIdPlaceholder')}
              />
              <button onClick={() => {
                if (newServerId && newServerId !== peerId) {
                  setKnownServers(prev => {
                    const updated = [...new Set([...prev, newServerId])];
                    localStorage.setItem('knownServers', JSON.stringify(updated));
                    return updated;
                  });
                  if (peerInstance.current) {
                    const conn = peerInstance.current.connect(newServerId);
                    setupConnection(conn);
                  }
                  setNewServerId('');
                } else if (newServerId === peerId) {
                  alert(t(lang, 'serverSelfAdd'));
                }
              }}>{t(lang, 'connect')}</button>
            </div>
          </div>
          
          <div className="server-mode-container">
            <strong>{t(lang, 'knownServers')}</strong>
            {knownServers.map(id => (
              <span key={id} style={{ background: '#e2e8f0', padding: '2px 8px', borderRadius: '4px', margin: '0 5px' }}>
                {id} <button onClick={() => {
                  setKnownServers(prev => {
                    const updated = prev.filter(s => s !== id);
                    localStorage.setItem('knownServers', JSON.stringify(updated));
                    return updated;
                  });
                }}>x</button>
              </span>
            ))}
          </div>
          
          <div className="distribution-stats">
            <h3>{t(lang, 'distributionStats')}</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '10px' }}>
              <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px', border: '1px solid #e2e8f0' }}>
                <div style={{ fontSize: '10px', color: '#64748b', textTransform: 'uppercase' }}>{t(lang, 'messagesReceived')}</div>
                <div style={{ fontSize: '18px', fontWeight: 'bold' }}>{stats.messagesReceived}</div>
              </div>
              <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px', border: '1px solid #e2e8f0' }}>
                <div style={{ fontSize: '10px', color: '#64748b', textTransform: 'uppercase' }}>{t(lang, 'messagesDistributed')}</div>
                <div style={{ fontSize: '18px', fontWeight: 'bold' }}>{stats.messagesDistributed}</div>
              </div>
              <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px', border: '1px solid #e2e8f0' }}>
                <div style={{ fontSize: '10px', color: '#64748b', textTransform: 'uppercase' }}>{t(lang, 'activeConnections')}</div>
                <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#3b82f6' }}>{stats.activeConnections}</div>
              </div>
              <div style={{ background: '#f0fdf4', padding: '10px', borderRadius: '8px', border: '1px solid #bbf7d0' }}>
                <div style={{ fontSize: '10px', color: '#166534', textTransform: 'uppercase' }}>{t(lang, 'hydraWebSize')}</div>
                <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#15803d' }}>{stats.hydraNodes}</div>
                <div style={{ fontSize: '9px', color: '#166534' }}>{t(lang, 'estimatedP2PNodes')}</div>
              </div>
            </div>
          </div>
          
          <div className="connected-peers">
            <h3>{t(lang, 'activeConnections')} ({connections.length})</h3>
            {connections.length === 0 ? (
              <p>{t(lang, 'noActiveConnections')}</p>
            ) : (
              <div>
                {connections.map((connPeerId, index) => (
                 <div key={index} className="peer-item">
                    <span className="status-indicator status-online"></span>
                    {connPeerId}
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{ marginTop: '20px' }}>
            <h3>{t(lang, 'messages')}</h3>
            <div style={{ maxHeight: '300px', overflowY: 'auto', border: '1px solid #ddd', padding: '10px' }}>
              {messages.length === 0 ? (
                <p>{t(lang, 'noMessagesReceived')}</p>
              ) : (
                <div>
                  {messages.map((msg, index) => (
                    <div key={index} className={`message other`}>
                      <div>{msg.text}</div>
                      <div className="message-source">
                        {t(lang, 'origin')} {msg.source} | {new Date(msg.timestamp).toLocaleTimeString()}
                      </div>
                    </div>
                  ))}
                  <div ref={messagesEndRef} />
                </div>
              )}
            </div>
          </div>

          {/* ── AUDIT LOG ── */}
          <div style={{ marginTop: '20px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
              <h3 style={{ margin: 0, fontSize: '13px' }}>📋 Audit Log</h3>
              <button onClick={() => { auditLogRef.current = []; setAuditLog([]); }} style={{ fontSize: '11px', padding: '3px 8px', background: '#ef4444', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>
                {t(lang, 'clearAuditLog')}
              </button>
            </div>
            <div className="audit-log">
              {auditLog.length === 0
                ? <span style={{ color: '#94a3b8', fontSize: '11px' }}>{t(lang, 'noAuditEvents')}</span>
                : auditLog.map((e, i) => (
                  <div key={i} className="audit-entry">
                    <span className="audit-ts">{e.ts}</span>
                    <span className={`audit-msg ${e.type}`}>{e.msg}</span>
                  </div>
                ))
              }
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<DistributorApp />);
  </script>
  <script>
    (async () => {
      try {
        await esbuild.initialize({ wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.20.1/esbuild.wasm' });
        const script = document.getElementById('esbuild-main').textContent;
        const { code } = await esbuild.transform(script, { loader: 'tsx', target: 'esnext' });
        const s = document.createElement('script');
        s.textContent = code;
        document.body.appendChild(s);
      } catch (e) {
        console.error('Esbuild error:', e);
        document.getElementById('k10-loading').innerHTML = '<p style="color:red;text-align:center;margin-top:20px">Erro ao carregar o servidor. Por favor, recarregue a página.</p>';
      }
    })();
  </script>
</body>
</html>
