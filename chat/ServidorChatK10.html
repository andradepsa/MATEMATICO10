<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Servidor Central 10 - Autoridade</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    #root { max-width: 800px; margin: 0 auto; background: #2d2d2d; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .status-bar { padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #3d3d3d; border-left: 5px solid #007bff; }
    .peer-list { background: #1e1e1e; padding: 15px; border-radius: 8px; max-height: 200px; overflow-y: auto; }
    .vote-panel { margin-top: 20px; padding: 15px; background: #333; border-radius: 8px; border: 1px solid #444; }
    .progress-bg { background: #444; height: 10px; border-radius: 5px; margin-top: 10px; }
    .progress-fill { background: #28a745; height: 100%; border-radius: 5px; transition: width 0.3s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MAX_SERVER_CONNECTIONS = 200;
    // Token Único de Autoridade para evitar Spoofing
    const SERVER_AUTH_TOKEN = "AUTH-" + Math.random().toString(36).substr(2, 9);

    const DistributorApp = () => {
      const [peerId, setPeerId] = useState('');
      const [connections, setConnections] = useState([]);
      const [stopVotes, setStopVotes] = useState(new Set());
      const [status, setStatus] = useState('Iniciando...');
      const peerRef = useRef(null);
      const connsRef = useRef(new Map());

      useEffect(() => {
        let savedId = localStorage.getItem('server_peer_id') || 'MATEMATICO10';
        if (!savedId.endsWith('-CENTRAL')) savedId += '-CENTRAL';
        
        const peer = new Peer(savedId);
        peerRef.current = peer;

        peer.on('open', (id) => {
          setPeerId(id);
          localStorage.setItem('server_peer_id', id);
          setStatus('Online - Aguardando conexões');
        });

        peer.on('connection', (conn) => {
          if (connsRef.current.size >= MAX_SERVER_CONNECTIONS) {
            conn.on('open', () => {
              conn.send({ type: 'error', message: 'Servidor Lotado (Max 200)' });
              setTimeout(() => conn.close(), 500);
            });
            return;
          }

          conn.on('open', () => {
            connsRef.current.set(conn.peer, conn);
            updateConnList();
            
            // Handshake de Autoridade
            conn.send({
              type: 'handshake',
              isServer: true,
              serverToken: SERVER_AUTH_TOKEN,
              peerId: peer.id
            });
          });

          conn.on('data', (data) => handleData(conn, data));
          conn.on('close', () => {
            connsRef.current.delete(conn.peer);
            setStopVotes(prev => {
              const next = new Set(prev);
              next.delete(conn.peer);
              return next;
            });
            updateConnList();
          });
        });
      }, []);

      const updateConnList = () => {
        setConnections(Array.from(connsRef.current.keys()));
      };

      const handleData = (conn, data) => {
        if (data.type === 'stop-music-request') {
          setStopVotes(prev => {
            const next = new Set(prev).add(conn.peer);
            checkVotes(next);
            return next;
          });
        }
      };

      const checkVotes = (currentVotes) => {
        const total = connsRef.current.size;
        const percent = (currentVotes.size / total) * 100;

        broadcast({
          type: 'stop-music-stats',
          percentage: Math.round(percent),
          count: currentVotes.size,
          total: total
        });

        if (percent >= 80) {
          broadcast({ type: 'stop-music-command', serverToken: SERVER_AUTH_TOKEN });
          setStopVotes(new Set());
        }
      };

      const broadcast = (data) => {
        const payload = { ...data, sender: peerId, timestamp: Date.now() };
        connsRef.current.forEach(c => c.open && c.send(payload));
      };

      const votePercent = connections.length > 0 ? (stopVotes.size / connections.length) * 100 : 0;

      return (
        <div>
          <h2>Painel do Servidor Central</h2>
          <div className="status-bar">
            <strong>ID:</strong> {peerId} <br/>
            <strong>Status:</strong> {status} <br/>
            <strong>Token de Segurança:</strong> <code style={{color:'#ffc107'}}>{SERVER_AUTH_TOKEN}</code>
          </div>

          <div className="vote-panel">
            <h3>Votação "Stop Music" (Meta 80%)</h3>
            <p>{stopVotes.size} de {connections.length} usuários votaram.</p>
            <div className="progress-bg">
              <div className="progress-fill" style={{width: `${votePercent}%`}}></div>
            </div>
          </div>

          <h3>Usuários Conectados ({connections.length}/200)</h3>
          <div className="peer-list">
            {connections.map(id => <div key={id}>• {id}</div>)}
          </div>
        </div>
      );
    };

    ReactDOM.render(<DistributorApp />, document.getElementById('root'));
  </script>
</body>
</html>
