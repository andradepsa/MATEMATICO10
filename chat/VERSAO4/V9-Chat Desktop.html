const MessageText = ({ msg, onContentChange, onHide }) => {
  const contactPeer = msg.sender === 'you' ? msg.recipient : msg.sender;
  const isE2EE = typeof msg.text === 'string' && msg.text.startsWith(E2EE_PREFIX);
  const isGroup = typeof msg.text === 'string' && msg.text.startsWith(GROUP_E2EE_PREFIX);

  // ── Per-user quiz-bot translation ──────────────────────────────
  const isQuizBot = msg.senderName === '🤖 Quiz Bot';
  const quizCacheKey = `pt|${lang}|${msg.text}`;
  const [quizTranslated, setQuizTranslated] = useState(() => {
    if (!isQuizBot) return null;
    if (lang === 'pt') return msg.text || null;
    // Prioridade 1: já veio traduzido do handleIncomingData (caso normal)
    if (msg.translatedText) return msg.translatedText;
    // Prioridade 2: cache sessionStorage (recarregou a página)
    return _gtCache[quizCacheKey] || null;
  });
  const [quizTranslating, setQuizTranslating] = useState(false);

  useEffect(() => {
    if (!isQuizBot || !msg.text) { setQuizTranslated(null); return; }
    if (lang === 'pt') { setQuizTranslated(msg.text); return; }
    // Caso 1: já traduzido — usa direto, zero fetch
    if (msg.translatedText) { setQuizTranslated(msg.translatedText); return; }
    // Caso 2: cache sessionStorage disponível — usa direto, zero fetch
    if (_gtCache[quizCacheKey]) { setQuizTranslated(_gtCache[quizCacheKey]); return; }
    // Caso 3: fallback (mensagem antiga sem pré-tradução) — fetch com deduplicação
    let cancelled = false;
    setQuizTranslating(true);
    translateQuizText(msg.text, lang)
      .then(result => { if (!cancelled) setQuizTranslated(result); })
      .catch(() => { if (!cancelled) setQuizTranslated(msg.text); })
      .finally(() => { if (!cancelled) setQuizTranslating(false); });
    return () => { cancelled = true; };
  }, [isQuizBot, msg.text, lang, msg.translatedText, quizCacheKey]);
  // ──────────────────────────────────────────────────────────────

  const cacheKey = `${msg.timestamp}-${msg.text}`;
  const [display, setDisplay] = useState(() => {
    if (!isE2EE && !isGroup) return { plain: msg.text, encrypted: false };
    if (decryptionCache.current.has(cacheKey)) return decryptionCache.current.get(cacheKey);
    return null;
  });

  useEffect(() => {
    if (onContentChange) onContentChange();
  }, [display, onContentChange]);

  useEffect(() => {
    if (display && (display.noKey || display.error)) {
      if (onHide) onHide(msg.timestamp);
    }
  }, [display, msg.timestamp, onHide]);

  useEffect(() => {
    if (!isE2EE && !isGroup) return;
    if (decryptionCache.current.has(cacheKey)) {
      setDisplay(decryptionCache.current.get(cacheKey));
      return;
    }

    let isMounted = true;
    const runDecryption = async () => {
      if (isGroup) {
        const b64 = msg.text.slice(GROUP_E2EE_PREFIX.length);
        const serverSecrets = Object.values(serverE2EE).filter(s => s.groupSecret).map(s => s.groupSecret);
        if (serverSecrets.length === 0) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, noKey: true, isGroup: true });
          return;
        }
        for (const secret of serverSecrets) {
          try {
            const plain = await decryptMsg(b64, secret);
            const result = { plain, encrypted: true, isGroup: true };
            decryptionCache.current.set(cacheKey, result);
            if (isMounted) setDisplay(result);
            return;
          } catch(e) {}
        }
        if (isMounted) setDisplay({ plain: null, encrypted: true, error: true, isGroup: true });
      } else {
        const b64 = msg.text.slice(E2EE_PREFIX.length);
        const isMine = msg.sender === 'you';
        const secret = isMine ? e2eeState[contactPeer]?.mySecret : e2eeState[contactPeer]?.contactSecret;
        if (!secret) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, noKey: true });
          return;
        }
        try {
          const plain = await decryptMsg(b64, secret);
          const result = { plain, encrypted: true };
          decryptionCache.current.set(cacheKey, result);
          if (isMounted) setDisplay(result);
        } catch(e) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, error: true });
        }
      }
    };

    runDecryption();
    return () => { isMounted = false; };
  }, [msg.text, contactPeer, e2eeState[contactPeer]?.mySecret, e2eeState[contactPeer]?.contactSecret, JSON.stringify(serverE2EE)]);

  const renderMarkdown = (text) => {
    if (!text) return null;
    if (window.marked && window.DOMPurify) {
      const rawHtml = marked.parse(text);
      const cleanHtml = DOMPurify.sanitize(rawHtml);
      return <div className="md-editor-preview" style={{ padding: 0, background: 'transparent' }} dangerouslySetInnerHTML={{ __html: sanitizeHTML(cleanHtml) }} />;
    }
    return text;
  };

  const isInvite = msg.isInvite;

  const handleAcceptInvite = () => {
    if (msg.inviteData) {
      setServerE2EE(prev => ({ ...prev, [msg.inviteData.serverId]: { active: true, groupSecret: msg.inviteData.groupSecret } }));
      connectToPeer(msg.inviteData.serverId);
      setMessages(prev => prev.map(m => m.timestamp === msg.timestamp ? { ...m, isInvite: false, text: t(lang, 'joinedGroup', { id: msg.inviteData.serverId }) } : m));
    }
  };

  const handleDeclineInvite = () => {
    setMessages(prev => prev.map(m => m.timestamp === msg.timestamp ? { ...m, isInvite: false, text: t(lang, 'declinedGroup', { id: msg.inviteData.serverId }) } : m));
  };

  if (isInvite) {
    return (
      <div className="invite-container" style={{ marginTop: '8px', padding: '10px', background: '#f0f9ff', borderRadius: '8px', border: '1px solid #bae6fd' }}>
        <div style={{ fontSize: '13px', marginBottom: '8px', color: '#0369a1', fontWeight: '500' }}>{msg.text}</div>
        <div style={{ display: 'flex', gap: '8px' }}>
          <button onClick={handleAcceptInvite} style={{ background: '#10b981', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{t(lang, 'accept')}</button>
          <button onClick={handleDeclineInvite} style={{ background: '#ef4444', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{t(lang, 'decline')}</button>
        </div>
      </div>
    );
  }

  if (display === null) return null;
  if (!display.encrypted) {
    if (isQuizBot) {
      const displayTxt = quizTranslated !== null ? quizTranslated : (quizTranslating ? '⏳ ...' : display.plain);
      const langName = getLangName(lang);
      return (
        <div>
          {lang !== 'pt' && (
            <div style={{ fontSize: '10px', color: '#64748b', marginBottom: '3px', fontStyle: 'italic' }}>
              🌐 {langName}
            </div>
          )}
          <div style={{ whiteSpace: 'pre-wrap' }}>{displayTxt}</div>
        </div>
      );
    }
    // For regular text messages: show translated text when available (from auto-translate)
    const isSentByMe = msg.sender === 'you';
    if (!isSentByMe && msg.translatedText && msg.translatedText !== display.plain) {
      return (
        <div>
          <div>{renderMarkdown(msg.translatedText)}</div>
          <div style={{ fontSize: '10px', color: '#94a3b8', marginTop: '3px', fontStyle: 'italic', display: 'flex', alignItems: 'center', gap: '4px' }}>
            🌐 <span style={{ textDecoration: 'line-through', opacity: 0.6 }}>{display.plain.slice(0, 50)}{display.plain.length > 50 ? '…' : ''}</span>
          </div>
        </div>
      );
    }
    return <div>{renderMarkdown(display.plain)}</div>;
  }
  if (display.noKey || display.error) return null;
  const decryptedText = display.plain;
  // Show translated version of decrypted text when available
  if (msg.sender !== 'you' && msg.translatedText && msg.translatedText !== decryptedText) {
    return (
      <div>
        <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>{display.isGroup ? '🛡️ GROUP' : '🔒 PRIVATE'}</div>
        <div>{renderMarkdown(msg.translatedText)}</div>
        <div style={{ fontSize: '10px', color: '#94a3b8', marginTop: '3px', fontStyle: 'italic' }}>🌐 {decryptedText.slice(0, 40)}{decryptedText.length > 40 ? '…' : ''}</div>
      </div>
    );
  }
  return (
    <div>
      <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>{display.isGroup ? '🛡️ GROUP' : '🔒 PRIVATE'}</div>
      <div>{renderMarkdown(decryptedText)}</div>
    </div>
  );
};


const sendDirectMessage = async () => {
if (!userName.trim()) { alert(t(lang, 'pleaseSetName')); return; }
if (!newMessage.trim() || cooldownRemaining > 0 || isSending) return;
if (newMessage.length > 2000) { alert(t(lang, 'msgTooLong')); return; }


if (selectedContact) {
// FIX N-8 V20: era connections.find (stale closure) → connectionsRef.current.find
const conn = connectionsRef.current.find(c => c.peer === selectedContact);
if (!conn || !conn.open) { alert(t(lang, 'contactOffline', { name: getContactName(selectedContact) })); return; }
} else if (connectionsRef.current.length === 0) {
// FIX V67-BUG2: era alert() bloqueante — travava o event loop do JS enquanto
// o usuário não clicava OK. Com o JS travado, o PeerJS não enviava heartbeats
// e todas as conexões morriam (timeout). Substituído por mensagem inline no chat.
const _errMsg = t(lang, 'noConnections') || 'Sem conexões P2P ativas. Aguarde a rede se conectar.';
setMessages(prev => [...prev, { text: '⚠️ ' + _errMsg, sender: '__system__', recipient: 'general', senderName: 'System', time: formatTime(new Date()), type: 'text', direct: false, timestamp: Date.now() }].slice(-500));
return;
}


setIsSending(true);
const currentCooldown = Math.max(1, Math.floor(networkSize / 1000));
setCooldownRemaining(currentCooldown);


try {
const timestamp = new Date();
const msgId = Date.now() + Math.random().toString(36).substring(2);
if (registerSentMessage) registerSentMessage(msgId);
let textToSend = newMessage;


if (selectedContact) {
if (selectedIsServer && serverGroupActive) {
textToSend = GROUP_E2EE_PREFIX + await encryptMsg(newMessage, serverE2EE[selectedContact].groupSecret);
} else if (!selectedIsServer && canSendPrivate) {
textToSend = E2EE_PREFIX + await encryptMsg(newMessage, e2eeState[selectedContact].mySecret);
}
const conn = connectionsRef.current.find(c => c.peer === selectedContact && c.open); // FIX N-8 V20: era connections.find (stale pós-await encryptMsg)
// V70-DIRECT-FALLBACK: sem conexão direta, roteia pelo gateway (K10GatewayShadow faz relay por recipient)
const fallbackConn = conn ? null : connectionsRef.current.find(c => c.open && isCentralServer(c.peer));
const sendConn = conn || fallbackConn;
if (!sendConn) throw new Error('Connection lost during encryption. Please try again.');
sendConn.send({ type: 'message', id: msgId, ttl: 15, text: textToSend, sender: peerId, senderName: userName, recipient: selectedContact, direct: true, time: formatTime(timestamp) });
const newMsgObj = { text: textToSend, sender: 'you', recipient: selectedContact, senderName: userName, time: formatTime(timestamp), type: 'text', direct: true, timestamp: timestamp.getTime() };
setMessages(prev => {
const updated = [...prev, newMsgObj].slice(-500);
return updated;
});
} else {
const msgData = { type: 'message', id: msgId, ttl: 15, text: textToSend, sender: peerId, senderName: userName, direct: false, time: formatTime(timestamp) }; // FIX C-15: sender: peerId ausente → relay tracking e spam guard não funcionavam para mensagens próprias
connectionsRef.current.forEach(c => { if (c.open) try { c.send(msgData); } catch(e){} }); // FIX BUG-L2: era connections (stale state)
const newMsgObj = { text: textToSend, sender: 'you', recipient: 'general', senderName: userName, time: formatTime(timestamp), type: 'text', direct: false, timestamp: timestamp.getTime() };
setMessages(prev => {
const updated = [...prev, newMsgObj].slice(-500);
return updated;
});
}
setNewMessage('');
} catch (err) { alert(t(lang, 'sendError') + err.message); }
finally { setIsSending(false); }
};

const FloatingWindow = ({ title, onClose, children, initialPosition, initialSize, onNextCamera }) => {
const [pos, setPos] = useState(initialPosition || { x: 50, y: 50 });
const [size, setSize] = useState(initialSize || { width: 320, height: 240 });
const [isDragging, setIsDragging] = useState(false);
const [isResizing, setIsResizing] = useState(false);
const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
const [resizeStart, setResizeStart] = useState({ x: 0, y: 0, w: 0, h: 0 });
const [showSettings, setShowSettings] = useState(false);
const [opacity, setOpacity] = useState(1);
const [headerColor, setHeaderColor] = useState('#2563eb');


const handleMouseDown = (e) => {
if (e.target.closest('.window-controls')) return;
setIsDragging(true);
setDragOffset({
x: e.clientX - pos.x,
y: e.clientY - pos.y
});
};


const handleResizeDown = (e) => {
e.preventDefault();
e.stopPropagation();
setIsResizing(true);
setResizeStart({
x: e.clientX,
y: e.clientY,
w: size.width,
h: size.height
});
};


const handleMouseMove = (e) => {
if (isDragging) {
setPos({
x: e.clientX - dragOffset.x,
y: e.clientY - dragOffset.y
});
}
if (isResizing) {
const dw = e.clientX - resizeStart.x;
const dh = e.clientY - resizeStart.y;
setSize({
width: Math.max(200, resizeStart.w + dw),
height: Math.max(150, resizeStart.h + dh)
});
}
};


const handleMouseUp = () => {
setIsDragging(false);
setIsResizing(false);
};


useEffect(() => {
if (isDragging || isResizing) {
window.addEventListener('mousemove', handleMouseMove);
window.addEventListener('mouseup', handleMouseUp);
} else {
window.removeEventListener('mousemove', handleMouseMove);
window.removeEventListener('mouseup', handleMouseUp);
}
return () => {
window.removeEventListener('mousemove', handleMouseMove);
window.removeEventListener('mouseup', handleMouseUp);
};
}, [isDragging, isResizing, dragOffset, resizeStart]);


return (
<div className="floating-window" style={{
position: 'fixed',
left: pos.x,
top: pos.y,
width: size.width + 'px',

const StreamRenderer = ({ targetId, peerId, streamType, userYoutubeStreams, userRadios, localVideoRef, videoRefs }) => {
if ((!streamType || streamType === 'radio') && userRadios && userRadios[targetId]) {
  const wrUrl = userRadios[targetId].url;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', width: '100%', alignItems: 'center', justifyContent: 'center', background: '#0f172a' }}>
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" style={{ width: '80px', height: '80px', borderRadius: '50%', marginBottom: '20px', objectFit: 'cover' }} alt="radio" />
      <h3 style={{ margin: '0 0 10px 0', color: '#38bdf8', fontSize: '14px', textAlign: 'center', padding: '0 10px' }}>{userRadios[targetId].name}</h3>
      <audio 
        controls 
        autoPlay 
        src={wrUrl} 
        style={{ width: '80%' }}></audio>
    </div>
  );
}

if ((!streamType || streamType === 'yt') && userYoutubeStreams[targetId]) {
const isPlaylist = userYoutubeStreams[targetId].startsWith('playlist:');
const actualId = isPlaylist ? userYoutubeStreams[targetId].split(':')[1] : userYoutubeStreams[targetId];
const srcUrl = isPlaylist
? `https://www.youtube.com/embed/videoseries?list=${actualId}&autoplay=1&mute=0`
: `https://www.youtube.com/embed/${actualId}?autoplay=1&mute=0`;
return (
<iframe width="100%" height="100%" src={srcUrl} frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen style={{ display: 'block' }}></iframe>
);
}
if ((!streamType || streamType === 'video') && targetId === peerId) {
return <video className="local-video-player" ref={localVideoRef} autoPlay muted style={{ display: 'block', width: '100%', height: '100%', objectFit: 'cover' }}></video>;
}
return <video className="video-player" ref={el => videoRefs.current[targetId] = el} autoPlay style={{ display: 'block', width: '100%', height: '100%', objectFit: 'cover' }}></video>;
};

const WorldRadiosModal = ({ lang, onClose, onBroadcast }) => {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [previewUrl, setPreviewUrl] = useState(null);
  const audioRef = useRef(null);

  const searchRadios = async () => {
    if (!query.trim()) return;
    setLoading(true);
    try {
      const res = await fetch(`https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(query)}&limit=20`);
      const data = await res.json();
      setResults(data);
    } catch (e) {
      console.error(e);
      alert('Error searching radios');
    }
    setLoading(false);
  };

  const togglePreview = (url) => {
    if (previewUrl === url) {
      setPreviewUrl(null);
      if (audioRef.current) {
        audioRef.current.pause();
        audioRef.current.src = '';
      }
    } else {
      setPreviewUrl(url);
      if (audioRef.current) {
        audioRef.current.src = url;
        audioRef.current.play().catch(e => console.error("Preview play error:", e));
      }
    }
  };

  return (
    <div className="media-controls-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="media-controls-modal" style={{ maxWidth: '600px', maxHeight: '80vh', display: 'flex', flexDirection: 'column' }}>
        <div className="media-controls-header">
          <h2><i className="fas fa-globe"></i> World Radios</h2>
          <button className="tutorial-close" onClick={onClose}>×</button>
        </div>
        
        <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', padding: '0 20px' }}>
          <input 
            type="text" 
            value={query} 
            onChange={e => setQuery(e.target.value)} 
            placeholder="Search by name or country..." 
            style={{ flex: 1, padding: '10px', borderRadius: '8px', border: '1px solid #334155', background: '#1e293b', color: 'white' }}
            onKeyDown={e => e.key === 'Enter' && searchRadios()}
          />
          <button onClick={searchRadios} style={{ padding: '10px 16px', background: '#2563eb', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
            {loading ? '...' : 'Search'}
          </button>
        </div>

        <div style={{ overflowY: 'auto', flex: 1, display: 'flex', flexDirection: 'column', gap: '8px', padding: '0 20px 20px 20px' }}>
          {results.map((r, i) => (
            <div key={i} style={{ background: '#1e293b', padding: '12px', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ overflow: 'hidden', marginRight: '10px' }}>
                <div style={{ fontWeight: 'bold', fontSize: '14px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.name}</div>
                <div style={{ fontSize: '12px', color: '#94a3b8' }}>{r.country} • {(r.tags || '').split(',').slice(0,3).join(', ')}</div>
              </div>
              <div style={{ display: 'flex', gap: '8px', flexShrink: 0 }}>
                <button 
                  onClick={() => togglePreview(r.url_resolved)}
                  style={{ background: previewUrl === r.url_resolved ? '#ef4444' : '#10b981', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >
                  <i className={`fas ${previewUrl === r.url_resolved ? 'fa-stop' : 'fa-play'}`}></i> {previewUrl === r.url_resolved ? 'Stop' : 'Preview'}
                </button>
                <button 
                  onClick={() => {
                    if (audioRef.current) { audioRef.current.pause(); audioRef.current.src = ''; }
                    onBroadcast(r);
                  }}
                  style={{ background: '#8b5cf6', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >
                  <i className="fas fa-broadcast-tower"></i> Broadcast
                </button>
              </div>
            </div>
          ))}
          {results.length === 0 && !loading && (
            <div style={{ textAlign: 'center', color: '#64748b', padding: '20px' }}>No radios found.</div>
          )}
        </div>
        <audio ref={audioRef} style={{ display: 'none' }} />
      </div>
    </div>
  );
};

// Cache de imagens: query -> URL  (evita chamar API repetidamente)
// Cache de rodada: guarda SÓ a URL escolhida para etapa 2 reusar a mesma foto
// Limpo a cada nova rodada — nunca acumula no computador do usuário
const _worldImgCache = {};
const _worldImgLocks = {};

async function fetchWorldImage(query, usedImagesSet, syncCallback) {
  if (!Array.isArray(_worldImgCache[query])) {
    _worldImgCache[query] = [];
  }

  if (_worldImgCache[query].length === 0) {
    if (!_worldImgLocks[query]) {
      _worldImgLocks[query] = (async () => {
        const key = getPixabayKey();
        try {
          const url = `https://pixabay.com/api/?key=${key}&q=${encodeURIComponent(query)}&image_type=photo&safesearch=true&per_page=200&orientation=horizontal`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.hits && data.hits.length > 0) {
            let hitsArr = [...data.hits];
            // Fisher-Yates shuffle
            for (let i = hitsArr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [hitsArr[i], hitsArr[j]] = [hitsArr[j], hitsArr[i]];
            }
            _worldImgCache[query] = hitsArr;
            
            // ── SOLUÇÃO 2: Limpeza LRU Simples (Prevenção Memory Leak) ──
            const keys = Object.keys(_worldImgCache);
            if (keys.length > 20) {
              const oldKey = keys.find(k => k !== query);
              if (oldKey) delete _worldImgCache[oldKey];
            }
            
            if (syncCallback) syncCallback(hitsArr);
          }
        } catch(e) { console.warn('Pixabay fetch error', e); } finally {
          _worldImgLocks[query] = null;
        }
      })();
    }
    await _worldImgLocks[query];
  }

  while (_worldImgCache[query].length > 0) {
    const pick = _worldImgCache[query].shift();
    if (usedImagesSet && !usedImagesSet.has(pick.id)) {
       usedImagesSet.add(pick.id);
       return pick; // Retorna todo o objeto 'hit' (incluindo .id e .webformatURL/.largeImageURL)
    }
  }
  return null;
}

// Gera 3 alternativas falsas de um array, evitando o valor correto
function pickFakeAlts(pool, correct, count = 3) {
  const filtered = pool.filter(v => v.toLowerCase() !== correct.toLowerCase());
  const shuffled = filtered.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Monta 4 alternativas (1 certa + 3 erradas) embaralhadas; retorna [opts, correctIndex]
function buildAlternatives(pool, correct) {
  const fakes = pickFakeAlts(pool, correct, 3);
  const all = [...fakes, correct].sort(() => Math.random() - 0.5);
  const correctIdx = all.findIndex(v => v.toLowerCase() === correct.toLowerCase());
  return [all, correctIdx];
}

const QuizBotWindow = ({ lang, onClose, quizBotActive, setQuizBotActive, askNextQuestion, quizInterval, setQuizInterval, quizIntervalInput, setQuizIntervalInput, quizDiscipline, setQuizDiscipline, serverQuizBotActive, notifyServer, quizJitterTimerRef, broadcastToggle, sendQuizHandoff, quizServerOwnerId, globalQuizOwner, setGlobalQuizOwner, quizMasterIdRef, peerId, quizStopCooldown, startQuizStopCooldown }) => {

        <div style={{ marginBottom: '10px', textAlign: 'left' }}>
          <label style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{t(lang, 'quizDiscipline')}</label>

            {QUIZ_SUBJECTS.map(sub => (
              <option key={sub.id} value={sub.id}>{sub.emoji} {t(lang, sub.nameKey)}</option>
            ))}
          </select>
        </div>
        <div style={{ marginBottom: '20px', textAlign: 'left' }}>
          <label style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{t(lang, 'quizTimePerQuestion')}</label>
          <input 
            type="number" 
            value={quizIntervalInput} 
            onChange={e => setQuizIntervalInput(Number(e.target.value))} 
            onBlur={() => {
              const val = Math.max(DEFAULT_QUIZ_INTERVAL, quizIntervalInput);
              setQuizIntervalInput(val);
              setQuizInterval(val);
            }}
            min="120" 
            style={{ width: '100%', padding: '8px', borderRadius: '4px', background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text)', marginTop: '4px' }} 
            disabled={quizBotActive} 
          />
        </div>

        <div style={{ marginBottom: '20px' }}>
          <span style={{ display: 'inline-block', padding: '8px 16px', borderRadius: '20px', background: quizBotActive ? '#10b98120' : '#ef444420', color: quizBotActive ? '#10b981' : '#ef4444', fontWeight: 'bold' }}>
            {quizBotActive ? t(lang, 'quizActive') : t(lang, 'quizInactive')}
          </span>
        </div>

        <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginTop: 'auto' }}>
          {(() => {
            // V69-LOCK-2: dono = quem ativou via P2P ou via servidor
            const peerP2POwner = quizBotActive && globalQuizOwner && globalQuizOwner !== peerId;
            const isLockedByServer = serverQuizBotActive && quizServerOwnerId !== peerId;
            const isLocked = peerP2POwner || isLockedByServer;
            const iAmOwner = (quizBotActive && globalQuizOwner === peerId) ||
                             (serverQuizBotActive && quizServerOwnerId === peerId);

            // V69-LOCK-2: não-donos NUNCA veem o botão Stop — apenas um painel de bloqueio
            if (isLocked) {
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#f1f5f9', border: '1.5px solid #e2e8f0',
                  textAlign: 'center', color: '#64748b', fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                }}>
                  {t(lang, 'quizLockedByOther')}
                </div>
              );
            }

            // V73: cooldown pós-parada — bloqueia botão de iniciar para todos por 3 min
            if (!quizBotActive && quizStopCooldown > 0) {
              const mins = Math.floor(quizStopCooldown / 60);
              const secs = quizStopCooldown % 60;
              const display = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#fff7ed', border: '1.5px solid #fed7aa',
                  textAlign: 'center', color: '#c2410c', fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                }}>
                  {t(lang, 'quizStopCooldownMsg', { s: display })}
                </div>
              );
            }

            return (
          <button 
            className="primary-btn" 
            onClick={() => {
              const newActive = !quizBotActive;
              let handoffSent = false;
              if (!newActive && sendQuizHandoff) {
                try { sendQuizHandoff(); handoffSent = true; } catch(e) { console.warn('Quiz handoff failed', e); }
              }
              setGlobalQuizOwner(newActive ? peerId : null);
              setQuizBotActive(newActive);
              if (newActive) {
                notifyServer('quiz-bot-start');
              } else if (!handoffSent) {
                notifyServer('quiz-bot-stop');
              }
              if (broadcastToggle) broadcastToggle(newActive);
              if (newActive) {
                const initialJitterMs = 1000 + Math.floor(Math.random() * 2000);
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                quizJitterTimerRef.current = setTimeout(askNextQuestion, initialJitterMs);
              } else {
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                if (startQuizStopCooldown) startQuizStopCooldown(); // V73: cooldown 3min para o dono local
              }
            }}
            style={{ background: iAmOwner ? '#ef4444' : '#10b981', width: '100%' }}
          >
            {iAmOwner ? t(lang, 'quizStopBot') : t(lang, 'quizStartBot')}
          </button>
            );
          })()}
        </div>
      </div>
    </FloatingWindow>
  );
};

// Embaralha array in-place (Fisher-Yates)
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Retira o próximo lugar da fila; quando vazia, reembaralha tudo de novo
function nextWorldPlace() {
  if (worldQuizQueueRef.current.length === 0) {
    // Cria nova fila com todos os índices embaralhados + seed de tempo para variar sempre
    const indices = WORLD_PLACES.map((_, i) => i);
    shuffleArray(indices);
    // Garante que o primeiro da nova fila ≠ último lugar jogado (evita repetição na virada)
    if (worldQuizPlaceRef.current) {
      const lastIdx = WORLD_PLACES.indexOf(worldQuizPlaceRef.current);
      if (indices[0] === lastIdx && indices.length > 1) {
        [indices[0], indices[1]] = [indices[1], indices[0]];
      }
    }
    worldQuizQueueRef.current = indices;
  }
  const idx = worldQuizQueueRef.current.shift();
  return WORLD_PLACES[idx];
}

// QUIZ HANDOFF: quando o usuário desliga o bot, transfere o estado
// (disciplina, intervalo, IDs já usados, hits em buffer) para o servidor
// continuar a transmissão exatamente de onde parou.
// IMPORTANTE: segue o mesmo padrão do programa — só URL + ID das imagens
// (nada de binário). O servidor reusa fetchWorldImage com os mesmos IDs
// no Set de já-usados pra não repetir.

const sendQuizHandoff = () => {
  if (!centralServerId) return;
  const conn = connectionsRef.current.find(c => c.peer === centralServerId && c.open);
  if (!conn) return;

  // Snapshot dos hits do Pixabay já buscados mas ainda não usados (por query)
  // _worldImgCache é módulo-level, então acessamos por window
  const bufferedHits = {};
  try {
    if (typeof _worldImgCache === 'object' && _worldImgCache) {
      for (const q in _worldImgCache) {
        if (Array.isArray(_worldImgCache[q]) && _worldImgCache[q].length > 0) {
          bufferedHits[q] = _worldImgCache[q].slice(0); // shallow copy
        }
      }
    }
  } catch(e) {}

  const handoff = {
    type: 'quiz-handoff',
    quizDiscipline: quizDisciplineRef.current,
    quizInterval: safeQuizInterval(),
    usedImageIds: Array.from(worldQuizUsedImagesRef.current || []),
    bufferedHits,                                  // hits Pixabay (URL+ID, sem binário)
    lastPlaceQuery: worldQuizPlaceRef.current ? worldQuizPlaceRef.current.query : null,
    lastQuizTime: lastQuizTimeRef.current,        // Sincroniza cooldown global
    senderName: userNameRef.current || 'Quiz Master', // FIX BUG-3: ref evita stale closure
  };
  try { conn.send(handoff); } catch(e) {} // handoff enviado ao servidor
};

    direct: false,
    time: timeStr,

  };

  const localMsg = {
    type: 'quiz-question',
    sender: 'you',
    senderName: '🤖 Quiz Bot',
    time: timeStr,
    timestamp: timestamp.getTime(),
    recipient: target || 'general',

    setMessages(prev => [...prev, localMsg].slice(-500));

  if (quizData.quizStage) {

const sendQuizReveal = (quizId) => {
  const timestamp = new Date();
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  const q = currentQuizQuestionRef.current;
  const refVotes = q ? (q.votes || {}) : {};

  setMessages(prev => {
    const quizMsg = prev.find(m => m.quizId === quizId);
    const stateVotes = quizMsg ? (quizMsg.quizVotes || {}) : {};
    const mergedVotes = { ...stateVotes, ...refVotes };

    // IMPORTANTE: usa type:'message' para relay pelo servidor
    const wireMsg = {
      type: 'message',
      id: msgId,
      ttl: 15,
      senderName: '🤖 Quiz Bot',
      direct: false,
      time: timeStr,
      text: '__QUIZ_REVEAL__',
      quizRevealPayload: { quizId, votes: mergedVotes }
    };

    if (target) {
      const conn = connectionsRef.current.find(c => c.peer === target && c.open);
      if (conn) try { conn.send(wireMsg); } catch(e) {}
    } else {
      connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
    }
    
    if (q && q.quizStage) {
      worldQuizSubscribersRef.current.forEach(subId => {
        const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
        if (subConn) try { subConn.send(wireMsg); } catch(e) {}
      });
    }

    return prev.map(m =>
      m.quizId === quizId ? { ...m, quizRevealed: true, quizVotes: mergedVotes } : m
    );
  });
};

  };

// ── Eleição de Mestre P2P (Self-Healing e Consistência) ──
const checkAndAssumeQuizMaster = () => {
  if (!quizBotActiveRef.current) return false;
  // Pega todos os peers conectados + nós mesmos
  // FIX: exclui servidores K10-GATE / K10-CENTRAL da eleição — eles nunca rodam quiz
  // Sem esse filtro, 'K10-GATE-XXXX' ganha sempre (alfanumérico 'K' < maioria dos IDs)
  // e o usuário nunca vira mestre, então askNextQuestion retorna sem enviar perguntas.
  const peers = [peerId, ...connectionsRef.current
    .filter(c => c.open && !isCentralServer(c.peer))
    .map(c => c.peer)];
  peers.sort(); // Eleição alfanumérica
  const isMaster = peers[0] === peerId;
  const wasMaster = quizMasterIdRef.current === peerId;
  quizMasterIdRef.current = peers[0];

  if (isMaster && !wasMaster) {
     console.log("👑 Assumi a coroa de Mestre do Quiz via P2P (Alfanumérico)!");
     if (quizTimerRef.current) clearTimeout(quizTimerRef.current);
     if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
     // Jitter aleatório p/ dar segurança que todos enxergaram a queda unânime
     const takeoverDelayMs = 2000 + Math.floor(Math.random() * 2000); 
     quizJitterTimerRef.current = setTimeout(() => {
        // ── SOLUÇÃO 5: Master Claim pra Resolução de Conflito ──
        connectionsRef.current.forEach(c => { if(c.open) try{c.send({type: 'master-claim', senderId: peerId});}catch(e){} });
        askNextQuestion();
     }, takeoverDelayMs);
     
     // RETORNO FALSO TEMPORÁRIO: Bloqueia a execução imediata para evitar disparo duplo de perguntas, delegando para o setTimeout acima.
     return false;
  }
  return isMaster;
};

const askNextQuestion = async () => {
  if (quizTimerRef.current) clearTimeout(quizTimerRef.current);

  const isMaster = checkAndAssumeQuizMaster();

  if (!isMaster) {
      // Somos ouvintes/escravos (Vice-Mestres ou Recebedores).
      // Apenas aguardamos. O tempo e os dados virão pelo relay.
      const masterId = quizMasterIdRef.current;
      
      // Enviamos inscrição (Fallback pra garantir rotas diretas, vital pro World Sync)
      if (masterId !== worldQuizSubscribedToRef.current) {
        worldQuizSubscribedToRef.current = masterId;
        const subMsg = { type: 'subscribe-world-quiz', myId: peerId, distributorId: masterId };
        const masterConn = connectionsRef.current.find(c => c.peer === masterId && c.open);
        if (masterConn) {
          try { masterConn.send(subMsg); } catch(e) {}
        }
      }
      
      // Vigilância P2P pra Failover rápido: se o master demorar muito, re-elege
      quizTimerRef.current = setTimeout(() => {
        if (quizBotActiveRef.current) {
          console.log("Quiz: Timeout esperando mestre. Removendo inscrição e triggando auto-cura...");
          worldQuizSubscribedToRef.current = null;
          askNextQuestion(); // Retorna ao ciclo para auto-cura local ser triggada
        }
      }, safeQuizInterval() * 1000 + 15000); // Fôlego pro master network
      
      return;
  }

  // ── SE CHEGAMOS AQUI: SOMOS O MESTRE DA REDE! ──
  worldQuizSubscribedToRef.current = null;

  // FIX: Respeita o intervalo global mesmo após virar mestre (handoff sync)
  const now = Date.now();
  const elapsed = now - lastQuizTimeRef.current;
  const minIntervalMs = MIN_QUIZ_INTERVAL * 1000;
  
  if (elapsed < minIntervalMs) {
    const wait = minIntervalMs - elapsed + 1000;
    console.log(`Quiz: Cooldown global ativo. Aguardando ${Math.round(wait/1000)}s...`);
    quizTimerRef.current = setTimeout(askNextQuestion, wait);
    return;
  }

  // ── World Quiz: rota direta Fetch ──
  if (quizDiscipline === 'world') {
      return askWorldQuestion();
  }

  const ALL_POOL_NO_WORLD = QUIZ_SUBJECTS.filter(s => s.id !== 'world');

  let questions = [];
  let selectedSubject;

  if (quizDiscipline === 'all') {
    selectedSubject = ALL_POOL_NO_WORLD[quizAllIndexRef.current % ALL_POOL_NO_WORLD.length];
    quizAllIndexRef.current = (quizAllIndexRef.current + 1) % ALL_POOL_NO_WORLD.length;
  } else {
    selectedSubject = QUIZ_SUBJECTS.find(s => s.id === quizDiscipline);
  }

  // Guarda contra subject inválido ou sem url
  if (!selectedSubject || !selectedSubject.url) {
    selectedSubject = ALL_POOL_NO_WORLD[0];
  }
  
  try {
    const res = await fetch(selectedSubject.url);
    const data = await res.json();
    
    // Handle the specific JSON format provided (array of arrays or direct array)
    const arr = Array.isArray(data) ? data : (Object.values(data).find(v => Array.isArray(v)) || []);
    questions = arr.filter(p => p.pergunta && Array.isArray(p.opcoes) && typeof p.correta === 'number');
    
  } catch (e) {
    console.error("Fetch error", e);
  }
  
  if (!questions || questions.length === 0) {
    questions = [
      { pergunta: "Qual a capital do Brasil?", opcoes: ["São Paulo", "Rio de Janeiro", "Brasília", "Salvador"], correta: 2 },
      { pergunta: "Qual o maior planeta do sistema solar?", opcoes: ["Terra", "Marte", "Júpiter", "Saturno"], correta: 2 },
      { pergunta: "Quem pintou a Mona Lisa?", opcoes: ["Van Gogh", "Leonardo da Vinci", "Picasso", "Michelangelo"], correta: 1 }
    ];
  }

  const q = questions[Math.floor(Math.random() * questions.length)];
  const questionText = q.pergunta;
  const L = ['A','B','C','D','E','F'];

  // FIX: Remove prefixo duplicado (ex: "A) texto" -> "texto") que alguns JSONs já incluem
  const stripPrefix = (str) => str.replace(/^[A-Fa-f]\)\s*/, '').trim();
  const cleanOpts = q.opcoes.map(stripPrefix);

  const quizId = 'quiz-' + Date.now() + '-' + Math.random().toString(36).substring(2);

  currentQuizQuestionRef.current = {
    ...q,
    quizId,
    p: questionText,
    corretaIndex: q.correta,
    cleanOpts,
    votes: {}
  };

  // Send structured quiz-question message (not plain text)
  sendQuizQuestion({
    quizId,
    quizQuestion: questionText,
    quizOptions: cleanOpts,
    quizCorrect: q.correta,
    quizSubject: `${selectedSubject.emoji} ${selectedSubject.name}`,
    quizStage: 0,
    nonce: Math.random().toString(36).substring(2, 10),
  });

  quizTimerRef.current = setTimeout(() => {
    if (quizBotActiveRef.current && currentQuizQuestionRef.current && currentQuizQuestionRef.current.quizId === quizId) {
      // Reveal answer with stats
      sendQuizReveal(quizId);
      currentQuizQuestionRef.current = null;
      setTimeout(() => {
        if (quizBotActiveRef.current) askNextQuestion();
      }, 15000);
    }
  }, safeQuizInterval() * 1000);
};

const handleAvatarChange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 120;
      const MAX_HEIGHT = 120;
      let width = img.width;
      let height = img.height;
      
      if (width > height) {
        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
      } else {
        if (height > MAX_HEIGHT) {
          width *= MAX_HEIGHT / height;
          height = MAX_HEIGHT;
        }
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.7); // Compress to 70% quality
      setUserAvatar(base64);
      localStorage.setItem('p2pUserAvatar', base64);
      
      // Notify all connected peers about the new avatar
      connectionsRef.current.forEach(conn => {
        if (conn.open) {
          try { conn.send({ type: 'avatar-update', peerId, avatar: base64 }); } catch(err) {}
        }
      });
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

const ensureGroupPresenceBits = (gid) => {
if (!gid) return null;
if (!groupPresenceBitsRef.current[gid]) {
  groupPresenceBitsRef.current[gid] = new Uint8Array(Math.ceil(K10_MAX_GROUP / 8));
}
return groupPresenceBitsRef.current[gid];
};

const fillGroupPresenceBits = (gid, count) => {
const bits = ensureGroupPresenceBits(gid);
if (!bits) return null;
const safeCount = Math.min(Math.max(0, parseInt(count) || 0), K10_MAX_GROUP);
bits.fill(0);
for (let i = 0; i < safeCount; i++) bits[i >> 3] |= (1 << (i & 7));
return bits;
};

const setGroupPresenceBit = (gid, index, online = true) => {
const bits = ensureGroupPresenceBits(gid);
if (!bits) return;
if (typeof index !== 'number' || index < 0 || index >= K10_MAX_GROUP) return;
const byte = index >> 3;
const mask = 1 << (index & 7);
if (online) bits[byte] |= mask;
else bits[byte] &= (~mask) & 0xFF;
};

const sendBinaryGroupPacket = (type, gid, paramB, ttl = 5, exceptPeer = null) => {
if (!gid) return false;
const gidIdx = k10bin.getOrRegisterIdx(gid);
if (gidIdx < 0) return false;
const pkt = k10bin.encode(type, gidIdx, Math.min(Math.max(0, parseInt(paramB) || 0), K10_MAX_GROUP), ttl);
if (!pkt) return false;
const buf = pkt.buffer.slice(pkt.byteOffset, pkt.byteOffset + pkt.byteLength);
let sent = false;
connectionsRef.current.forEach(c => {
  if (c.peer !== exceptPeer && c.open) {
    try { c.send(buf); sent = true; } catch(e) {}
  }
});
return sent;
};

  // Evita colisão: pex-update=0x01, position-update=0x02, gid-promote=0x03
  const rawPkt = k10bin.decode(data instanceof ArrayBuffer ? new Uint8Array(data) : data);
  if (rawPkt && decoded._gidIdx !== undefined && decoded._seq !== undefined) {
    if (k10bin.isDuplicate(decoded._gidIdx, rawPkt.type, decoded._seq)) return;
  }

  // Relay binário P2P: recodifica com TTL decrementado — sem JSON.stringify/parse
  if ((decoded.ttl || 0) > 0) {

    if (Object.prototype.hasOwnProperty.call(data, 'groupServers') && Array.isArray(data.groupServers)) {
      groupServersRef.current = data.groupServers;
    }
    // V26: aprende o índice binário do GID — habilita recepção de pacotes binários
    // gidIdx é enviado pelo servidor V26; se ausente (servidor V25), registra localmente
    if (typeof data.gidIdx === 'number') {
      k10bin.learnGid(newGid, data.gidIdx);
    } else {
      k10bin.registerGid(newGid); // fallback: atribui índice local
    }
    // V25: 'user' é o sufixo atribuído; V24: 'suffix'
    const assignedSuffix = data.user || data.suffix;

    // Atualiza GID do nó — o servidor é sempre autoritativo na atribuição
    // FIX V39-GROUP: a condição anterior bloqueava a atualização quando o usuário
    // já tinha um savedGroupId no localStorage (ex: AAAA) e o servidor atribuía um
    // grupo filho (ex: AAAB). Resultado: todos os clientes ficavam reportando AAAA
    // ao monitor mesmo após o servidor criar grupos filhos, fazendo o monitor mostrar
    // 1 grupo com N>50 usuários em vez dos grupos reais.
    myGroupIdRef.current = newGid;
    localStorage.setItem('myGroupId', newGid);
    sendUserToMonitor();

    if (typeof K10GroupShadow !== 'undefined' && K10GroupShadow.probeAndElect) {
      setTimeout(() => K10GroupShadow.probeAndElect(), 500);
    }

    // FIX V26→V23: Peer ID NUNCA muda. Apenas registra posição se sufixo atribuído.
    if (assignedSuffix && assignedSuffix.length === K10_SUFFIX_LEN) {
      const posIdx = K10_POSITION_LIST.indexOf(assignedSuffix);
      if (posIdx >= 0) myPositionIdxRef.current = posIdx;
      addAudit(`[K10] Grupo ${newGid} atribuído (pos ${posIdx+1}). Peer ID mantido: ${peerIdRef.current}`, 'sys');
    }

    // V25: conecta aos peers do grupo usando K10_POSITION_LIST[0..count-1]
    // Não precisa de lista de sufixos — a lista pré-definida é suficiente!
    const count = data.count !== undefined ? data.count
      : (Array.isArray(data.users) ? data.users.length : 0);

    if (!directoryGlobalRef.current[newGid]) {
      directoryGlobalRef.current[newGid] = { reservados: [], groupSize: 0 };
    }
    directoryGlobalRef.current[newGid].groupSize = count;
    fillGroupPresenceBits(newGid, count);

    if (peerInstance.current && count > 0) {
      const maxConns = isSuperNodeRef.current ? 50 : 15;
      // FIX V33-PEERLIST: conecta usando IDs PeerJS reais enviados pelo servidor (data.peers).
      // Bug V25: iterava K10_POSITION_LIST para construir IDs sintéticos (K10AAAA+sufixo) que
      // nunca existem na rede PeerJS — peer IDs reais são aleatórios (ex: QYTPF8YAM).
      // Fix: usa data.peers[] com os IDs reais, conforme enviado pelo servidor V33+.
      if (Array.isArray(data.peers) && data.peers.length > 0) {
        data.peers.forEach((fullPeerId) => {
          if (fullPeerId === peerIdRef.current) return; // não conecta a si mesmo
          const activeCount = Object.keys(peerInstance.current.connections).length;
          if (activeCount < maxConns
              && !peerInstance.current.connections[fullPeerId]
              && !bannedPeersRef.current.has(fullPeerId)) {
            setTimeout(() => connectToPeer(fullPeerId), Math.random() * 3000);
          }
        });
      }
    }

  } else if (Array.isArray(data.peers)) {
    // ── Formato legado (compatibilidade): peers com IDs completos ──
    if (peerInstance.current) {
      const maxConns = isSuperNodeRef.current ? 50 : 15;
      data.peers.forEach(newPId => {
        const activeCount = Object.keys(peerInstance.current.connections).length;
        if (activeCount < maxConns
            && newPId !== peerId
            && !peerInstance.current.connections[newPId]
            && !bannedPeersRef.current.has(newPId)) {

        }
      });
    }
    if (data.groupId) {
      // FIX V47-GROUP-LEGACY: mesmo fix do V39-GROUP aplicado ao handler legado.
      // Antes: condicional bloqueava update quando savedGroupId era diferente de data.groupId.
      // Agora: atualização incondicional (servidor tem autoridade sobre o GID).
      myGroupIdRef.current = data.groupId;

if (data.type === 'pex') {
// V23 S-10: PEX comprimido — suporta {gid, users:[2chars]} e formato legado {peers, groupId}
const gid = data.gid || data.groupId;
if (gid) {
  if (!directoryGlobalRef.current[gid]) {
    directoryGlobalRef.current[gid] = { reservados: [], groupSize: 0 };
  }
  // FIX-AUDIT-CLI4: groupSize só é inflado por count (campo autoritativo V25) ou pelo servidor central
  // Peers P2P com dados stale podem ter groupSize desatualizado — usamos apenas para conectar, não para inflar
  const fromServer = isCentralServer(pId);
  // V25: campo 'count' = autoritativo (vem do servidor junto com peer-list/pex)
  if (typeof data.count === 'number' && data.count > 0) {
    const safe = Math.min(data.count, K10_MAX_GROUP);
    if (fromServer || safe > (directoryGlobalRef.current[gid].groupSize || 0)) {
      directoryGlobalRef.current[gid].groupSize = safe;
    }
    fillGroupPresenceBits(gid, directoryGlobalRef.current[gid].groupSize || safe);
  }
  // Formato V23: lista comprimida (tamanho real da lista)
  if (Array.isArray(data.users)) {
    // Só inflamos se vier do servidor; de peers P2P aceita apenas se maior pelo número real de entradas
    const listLen = data.users.length;
    if (fromServer) {
      directoryGlobalRef.current[gid].groupSize = Math.max(directoryGlobalRef.current[gid].groupSize || 0, listLen);
    }
    if (data.isReservado && data.suffix) {
      const set = new Set(directoryGlobalRef.current[gid].reservados);
      set.add(k10BuildPeerId(gid, data.suffix));
      directoryGlobalRef.current[gid].reservados = [...set].slice(0, 10);
    }
  }
  // Formato legado: groupSize scalar — só do servidor para evitar inflação P2P
  if (data.groupSize !== undefined && fromServer) {
    const safeGs = Math.min(Math.max(0, parseInt(data.groupSize) || 0), K10_MAX_GROUP);
    directoryGlobalRef.current[gid].groupSize = Math.max(directoryGlobalRef.current[gid].groupSize || 0, safeGs);
  }
  if (data.isReservado && data.peerId) {
    const set = new Set(directoryGlobalRef.current[gid].reservados);
    set.add(data.peerId);
    directoryGlobalRef.current[gid].reservados = [...set].slice(0, 10);
  }
}
// Conecta a peers da lista (formato V23 ou legado)
if (peerInstance.current) {
const activeCount = Object.keys(peerInstance.current.connections).length;
if (activeCount < maxConnections) {
  // Formato V23: reconstrói peerIds a partir dos sufixos
  if (gid && Array.isArray(data.users)) {
    data.users.forEach(suffix => {
      if (typeof suffix !== 'string' || suffix.length !== K10_SUFFIX_LEN) return;
      const fullPeerId = k10BuildPeerId(gid, suffix);
      if (fullPeerId !== peerId && !peerInstance.current.connections[fullPeerId] && !bannedPeersRef.current.has(fullPeerId)) {
        setTimeout(() => connectToPeer(fullPeerId), 2000);
      }
    });
  }
  // Formato legado
  if (Array.isArray(data.peers)) {
    data.peers.forEach(newPId => {
      if (newPId !== peerId && !peerInstance.current.connections[newPId] && !bannedPeersRef.current.has(newPId)) {
        setTimeout(() => connectToPeer(newPId), 2000);
      }
    });
  }
}
}
return;
}


// ── V26: join-update — broadcast compacto de entrada/contagem de grupo ───────
if (data.type === 'join-update') {
  const newCount = typeof data.newCount === 'number'
    ? Math.min(Math.max(0, data.newCount), K10_MAX_GROUP)

  if (data.gid && newCount >= 0) {

      directoryGlobalRef.current[data.gid] = { reservados: [], groupSize: 0 };

    const cur = directoryGlobalRef.current[data.gid].groupSize || 0;
    directoryGlobalRef.current[data.gid].groupSize = Math.max(cur, newCount);
    fillGroupPresenceBits(data.gid, newCount);
    addAudit(`[K10-V26] join-update binário: grupo ${data.gid} → ${newCount} usuários`, 'sys');

}

// ── V25/V26: pex-update — broadcast compacto de saída de peer ────────────────
// V26 binário: relay já foi feito no interceptor acima; só processa estado local
// V25 JSON:    relay normal com TTL decrementado
if (data.type === 'pex-update') {

  const newCount = (data._binary && typeof data.newCount === 'number')

  if (data.gid && newCount >= 0) {
    if (!directoryGlobalRef.current[data.gid]) {
      directoryGlobalRef.current[data.gid] = { reservados: [], groupSize: 0 };
    }
    // Atualiza groupSize apenas se for redução (nunca inflamos por pex-update)
    const cur = directoryGlobalRef.current[data.gid].groupSize || 0;
    directoryGlobalRef.current[data.gid].groupSize = cur > newCount ? newCount : cur;
    fillGroupPresenceBits(data.gid, newCount);
    const tag = data._binary ? '[K10-V26] pex-update binário' : '[K10-V25] pex-update';
    addAudit(`${tag}: grupo ${data.gid} → ${newCount} usuários`, 'sys');
  }

  // Relay JSON apenas para pacotes V25 (binários já foram relayados no interceptor)
  if (!data._binary) {
    const pexJsonMsgId = data.msgId || (pId + '_pexupd_' + Date.now());
    if (isDuplicate(pexJsonMsgId)) return;
    const safeTtlUpd = Math.min(Math.max(0, parseInt(data.ttl) || 0), 6);
    if (safeTtlUpd > 0) {
      const relay = { ...data, ttl: safeTtlUpd - 1, msgId: pexJsonMsgId };
      connectionsRef.current.forEach(c => {
        if (c.peer !== pId && c.open) try { c.send(relay); } catch(e) {}
      });
    }
  }
  return;
}

// ── position-update — atualiza APENAS myGroupId (GID) ──

// do servidor central (isCentralServer) para prevenir spoofing.
if (data.type === 'position-update') {
  if (!data.gid) return;
  // Segurança: só aceita do servidor central
  if (!isCentralServer(pId) && pId !== centralServerIdRef.current) return;
  // Atualiza SOMENTE o Group ID — Peer ID permanece intocado
  myGroupIdRef.current = data.gid;
  localStorage.setItem('myGroupId', data.gid);

  if (data.user) {
    const newPosIdx = K10_POSITION_LIST.indexOf(data.user);
    if (newPosIdx >= 0) {
      myPositionIdxRef.current = newPosIdx;
      setGroupPresenceBit(data.gid, newPosIdx, true);
    }
  }
  addAudit(`[Hydra] position-update recebido do servidor: novo GID = ${data.gid}`, 'sys');
  return;
}

    directoryGlobalRef.current[gid].groupSize = size || K10_MAX_GROUP;

if (data.type === 'group-state-sync') {

// HYDRA V6: Helpers de flooding com TTL+dedup (corrige P8)
// ════════════════════════════════════════════════════════════════════
const makeMsgId = () => {
  return (peerIdRef.current || 'anon') + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
};
const isDuplicate = (msgId) => {
  // V8-F16: LRU com hard-cap absoluto 5000 + GC por TTL
  const cache = seenMsgIdsRef.current;
  const HARD_CAP = 5000;
  const now = Date.now();
  // GC por TTL primeiro (entradas expiradas)
  if (cache.size > 500) {
    for (const [k, exp] of cache) if (exp < now) cache.delete(k);
  }
  // Hard-cap LRU: remove os 1000 mais antigos (Map preserva ordem de inserção)
  while (cache.size > HARD_CAP) {
    const k = cache.keys().next().value;
    if (k === undefined) break;
    cache.delete(k);
  }
  if (!msgId) return false;
  if (cache.has(msgId)) {
    // touch: re-insert para atualizar ordem LRU
    const exp = cache.get(msgId);
    cache.delete(msgId);
    cache.set(msgId, exp);
    return true;
  }
  cache.set(msgId, now + 300000);
  return false;
};
const floodMessage = (msg, excludePeer) => {
  // Garantir msgId e TTL
  if (!msg.msgId) msg.msgId = makeMsgId();
  if (msg.ttl === undefined) msg.ttl = 5;
  if (isDuplicate(msg.msgId)) return;
  if (msg.ttl <= 0) return;
  const relayMsg = { ...msg, ttl: msg.ttl - 1 };
  connectionsRef.current.forEach(c => {
    if (c.open && c.peer !== excludePeer) {
      try { c.send(relayMsg); } catch(e) {}
    }
  });
};

useEffect(() => {
  // V23 S-10: geração de novo GID no formato K10 (4 chars, 62-charset)
  // Substitui o simpleHash legado 'G'+0000 que não era compatível com o novo sistema
  const generateNewGid = (baseStr) => {
    // Usa hash determinístico do baseStr para gerar 4 chars do charset K10
    let h = 5381;
    const input = String(baseStr);
    for (let i = 0; i < input.length; i++) h = ((h << 5) + h) ^ input.charCodeAt(i);
    let abs = Math.abs(h);
    let gid = '';
    for (let i = 0; i < K10_GID_LEN; i++) {
      gid = K10_CHARS[abs % K10_CHARS.length] + gid;
      abs = Math.floor(abs / K10_CHARS.length);
    }
    // Evita colisão com GIDs existentes no diretório
    let salt = 0;
    let candidate = gid;
    while (directoryGlobalRef.current[candidate] && salt < 100) {
      salt++;
      let h2 = h ^ salt;
      let abs2 = Math.abs(h2);
      candidate = '';
      for (let i = 0; i < K10_GID_LEN; i++) {
        candidate = K10_CHARS[abs2 % K10_CHARS.length] + candidate;
        abs2 = Math.floor(abs2 / K10_CHARS.length);
      }
    }
    return candidate;
  };
  const hashWithCollisionAvoidance = generateNewGid;

  // V6: broadcastToAll usa floodMessage (TTL+dedup) em vez de hop unico.
  const broadcastToAll = (msg) => {
    if (!msg.msgId) msg.msgId = makeMsgId();
    if (msg.ttl === undefined) msg.ttl = 8;
    if (isDuplicate(msg.msgId)) return;

  };

}, [isSuperNode]);

const sendChunkedData = (conn, idKey, dataBlob, typePrefix, metaData) => {
const id = peerId + `_${typePrefix}_` + Date.now();
const reader = new FileReader(); let offset = 0;
const timestamp = new Date(), formattedTime = formatTime(timestamp);
const isFile = typePrefix === 'file';
const localUrl = URL.createObjectURL(dataBlob);
setMessages(prev => { const msg = { ...metaData, [idKey]: id, sender: 'you', recipient: conn.peer, senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio', sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(), [isFile ? 'fileData' : 'audioData']: localUrl }; const updated = [...prev, msg]; return updated; });
try { conn.send({ type: `${typePrefix}-start`, [idKey]: id, [isFile ? 'fileSize' : 'audioSize']: dataBlob.size, senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(), ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type }) }); }
catch (err) { alert(t(lang, 'sendError') + err.message); setMessages(prev => prev.filter(m => m[idKey] !== id)); return; }
const readChunk = () => { const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE); reader.readAsArrayBuffer(chunk); };
reader.onload = ev => {
if (!conn || !conn.open) { alert(t(lang, 'connectionLost')); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); return; }
try {
conn.send({ type: `${typePrefix}-chunk`, [idKey]: id, chunk: ev.target.result, offset, direct: true });
offset += ev.target.result.byteLength;
const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, progress } : m));
if (offset < dataBlob.size) requestAnimationFrame(readChunk);
else setMessages(prev => { const updated = prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: 100 } : m); return updated; });
} catch (err) { alert(t(lang, 'sendingError') + err.message); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); }
};
reader.onerror = () => { alert(t(lang, 'fileReadError')); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); };
readChunk();
};

const startVoiceCall = async (peerIdToCall) => {
if (!peerInstance.current || !peerIdToCall) return;
if (activeCallsRef.current.some(c => c.peerId === peerIdToCall && c.type === 'voice')) return; // FIX N-1 V20: era activeCalls (stale closure)
// V39-FIX: chamada user→user sainte → peer aparece na aba Privado
// V43-FIX: atualiza REF + STATE
if (!directPeersRef.current.has(peerIdToCall)) {
  directPeersRef.current.add(peerIdToCall);
  setDirectPeers(prev => { const s = new Set(prev); s.add(peerIdToCall); return s; });
}
// BUG C-3 FIX: usa connectionsRef.current para evitar stale closure em event handlers
const conn = connectionsRef.current.find(c => c.peer === peerIdToCall);
if (!conn || !conn.open) { alert(t(lang, 'contactOffline2')); return; }
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
localStreamsRef.current.set(peerIdToCall + '_voice', stream);
const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'voice' } });
setActiveCalls(prev => [...prev, { peerId: peerIdToCall, call, localStream: stream, type: 'voice', direction: 'outgoing', isTemporaryStream: false }]);
call.on('stream', rs => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'voice')), { peerId: peerIdToCall, stream: rs, type: 'voice' }]));
call.on('close', () => endCall(peerIdToCall, 'voice'));
call.on('error', err => { alert(t(lang, 'callError') + err.message); endCall(peerIdToCall, 'voice'); });
} catch (err) { alert(t(lang, 'micError') + err.message); }
};

call.on('close', () => endCall(peerIdToCall, 'video'));

}

const endCall = (peerIdToEnd, callType) => {
  // V7-B19: parar tracks do remoteStream antes de remover
  try {
    setRemoteStreams(prev => {
      prev.forEach(s => { if (s.peerId === peerIdToEnd && s.type === callType && s.stream) { try { s.stream.getTracks().forEach(t => t.stop()); } catch(e){} } });
      return prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType));
    });
  } catch(e){}
// FIX C-10: usa activeCallsRef.current (sempre fresco) — activeCalls é closure stale em callbacks PeerJS
const callData = activeCallsRef.current.find(c => c.peerId === peerIdToEnd && c.type === callType);
if (callData) {
if (callData.call) callData.call.close();
if (callData.localStream) { callData.localStream.getTracks().forEach(tr => tr.stop()); stopAndRemoveLocalStream(peerIdToEnd + '_' + callType); }
}
setActiveCalls(prev => prev.filter(c => !(c.peerId === peerIdToEnd && c.type === callType)));
setRemoteStreams(prev => prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType)));
const anyVideo = Array.from(localStreamsRef.current.values()).some(s => s.getVideoTracks().some(tr => tr.readyState === 'live'));
if (!anyVideo) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
};
