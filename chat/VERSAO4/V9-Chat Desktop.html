// ═══════════════════════════════════════════════════════════════════════
// K10-CENTRAL SHADOW ELECTION (V49) — runs silently in background
// 
// Concept: any user who opens the chat is a CANDIDATE. The lowest peerId
// (lex order) among connected peers wins and silently registers a 2nd
// PeerJS instance with id 'K10-CENTRAL'. This shadow peer answers
// group0-request from new entrants (Modo Geral / Group Zero entry).
// 
// When the elected user disconnects (closes tab, network drop), the ID
// 'K10-CENTRAL' is freed in PeerJS. The next user with lowest peerId
// wins the next election after a probe timeout.
// 
// User UX: ZERO. No badge, no notification, no opt-in. The chat works
// the same whether you are central or not. K10-CENTRAL is filtered from
// contact lists by isCentralServer().
// ═══════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════
// K10-GATEWAY SHADOW (V53) — eleição distribuída de slots de bootstrap
//
// Quando o bootstrap detecta que um slot K10-GATE-XXXX está vago
// (peer-unavailable), este módulo tenta registrar aquele PeerJS ID.
// Se conseguir (open), o cliente serve como gateway público para outros
// clientes que enviarem group0-request. Se unavailable-id, outro ganhou;
// o bootstrap segue para o próximo slot normalmente.
//
// Resultado: cada slot dos 100 gateways é sempre preenchido por algum
// par vivo. Não há ponto central: qualquer cliente pode ser gateway.
// ═══════════════════════════════════════════════════════════════════════
const K10GatewayShadow = (() => {
  // ── Constantes ────────────────────────────────────────────────────────
  const GW_MAX_GROUP       = 50;          // max peers por grupo
  const GW_ELECTION_MS     = 12_000;      // intervalo de eleição proativa
  const GW_PROBE_TIMEOUT   = 5_000;       // timeout para sondar se slot está ocupado (FIX V34: 3s→5s, evita falso-positivo quando poll K10-CENTRAL sobrecarrega PeerJS)
  const GW_CLAIM_TIMEOUT   = 14_000;      // timeout para reivindicar slot

  // Lista de sufixos de posição (AA, AB, … até 50 entradas)
  const GW_POSITION_LIST = (() => {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const list = [];
    outer: for (let i = 0; i < chars.length; i++) {
      for (let j = 0; j < chars.length; j++) {
        list.push(chars[i] + chars[j]);
        if (list.length >= GW_MAX_GROUP) break outer;
      }
    }
    return list;
  })();

  // ── Estado global do módulo ───────────────────────────────────────────
  let claimedId       = null;   // ID do gateway que estamos servindo
  let gwPeer          = null;   // instância Peer do gateway
  let isActive        = false;  // true quando servindo como gateway
  // FIX V57: impede double-claim por corrida de async (dois tryClaim antes de open chegar)
  let claimInProgress = false;
  let getKnownPeers   = null;   // () => string[]  — peers conhecidos
  let getMyPeerId     = null;   // () => string     — nosso próprio ID
  let stunPoolFn      = null;   // () => ICEServer[] — servidores STUN
  let getMainPeer     = null;   // () => Peer       — peer principal do App (para sondagem)
  // FIX V57: callback acionado quando claim bem-sucedido, para reconectar o bootstrap
  let onClaimedCb     = null;   // (gatewayId: string) => void

  // Estado dos grupos gerenciados (só ativo quando isActive === true)
  let activeGroups  = {};     // { gid: { positions: string[], open: bool } }
  let peerGroupMap  = new Map(); // peerId → gid
  let gwConns       = new Map(); // peerId → conn (todos os clientes conectados)
  let gidCounter    = 0;     // contador sequencial para GIDs

  // FIX V58: peers descobertos em outros gateways via cross-gateway sampling.
  // Incluídos no peer-list quando o grupo local está vazio/pequeno, permitindo
  // que clientes de gateways diferentes se conectem diretamente entre si.
  let crossGatewayPeers = new Set(); // peerId (não-K10) de outros gateways
  let crossGwDiscovTimer = null;

  // ── V70: DUAL-SERVER PER GROUP (MIRROR MODEL) ──────────────────────────
  // Cada sala com 2+ usuários deve ter DOIS servidores (primary + secondary).
  //
  // ARQUITETURA: cada gateway mantém UMA conexão persistente com outro
  // gateway (o "mirror"). Todos os grupos com ≥2 users são espelhados
  // nessa única conexão — sem abrir 1 conn por grupo.
  //
  // Com 5 gateways e 1000 salas: apenas 5 conexões de mirror no total.
  //
  // Quando somos PRIMARY (temos o mirror):
  //   mirrorGwId, mirrorConn — conexão única ao mirror
  //   mirroredGroups — Set<gid> — quais grupos estão sendo espelhados
  //
  // Quando somos MIRROR (espelhando grupos de outro primary):
  //   mirrorPrimaries — Map<primaryGwId, { conn, groups: {gid: {positions}}, lastPing }>
  // ─────────────────────────────────────────────────────────────────────
  let mirrorGwId          = null;    // ID do gateway que espelha nossos grupos
  let mirrorConn          = null;    // DataConnection única ao mirror
  let mirrorAlive         = false;
  let mirrorLastPing      = 0;
  let mirroredGroups      = new Set(); // gids com ≥2 users que estamos espelhando

  // Quando somos o MIRROR de outro primary:
  let mirrorPrimaries     = new Map(); // primaryGwId → { conn, groups: {gid: positions[]}, lastPing }

  const GW_MIRROR_SYNC_MS     = 10_000; // sync completo periódico
  const GW_MIRROR_PING_MS     = 15_000; // ping de health
  const GW_MIRROR_TIMEOUT     = 40_000; // timeout para promoção
  let mirrorSyncTimer         = null;
  let mirrorHealthTimer       = null;
  // ─────────────────────────────────────────────────────────────────────

  // Timer de eleição proativa
  let electionTimer = null;

  // ── API pública ───────────────────────────────────────────────────────

  // Inicializa o módulo. Chamado uma vez quando o Peer principal abre.
  function init(getPeers, getStun, getOwnId, getMain, onClaimed) {
    console.log(`[K10GatewayShadow] init chamado. getKnownPeers=${!!getPeers}, getMain=${!!getMain}`);
    getKnownPeers = getPeers;
    stunPoolFn    = getStun;
    getMyPeerId   = getOwnId;
    getMainPeer   = getMain;
    // FIX V57: callback de reconexão pós-claim
    if (typeof onClaimed === 'function') onClaimedCb = onClaimed;
    // Inicia eleição proativa periódica
    if (electionTimer) clearInterval(electionTimer);
    electionTimer = setInterval(_proactiveElect, GW_ELECTION_MS);
    // Primeira eleição após estabilização inicial
    setTimeout(_proactiveElect, 8_000);
  }

  // Reivindicação reativa (chamada pelo bootstrap quando peer-unavailable)
  function tryClaim(gatewayId) {
    // FIX V57: guarda duplo — isActive E claimInProgress evitam race condition
    if (isActive || claimInProgress) return;
    _attemptClaim(gatewayId);
  }

  // ── Eleição proativa ──────────────────────────────────────────────────
  // A cada ciclo: monta lista global de peers, ordena por peerId.
  // Se minha posição p < 100, verifico se GATEWAY_IDS[p] está vago.
  // Se estiver, reivindico o slot.
  function _proactiveElect() {
    if (isActive || claimInProgress) return;
    const myId = getMyPeerId && getMyPeerId();
    if (!myId) return;
    const known = (getKnownPeers && getKnownPeers()) || [];
    // Inclui apenas peers reais (exclui IDs K10-*)
    const allPeers = [...new Set([...known, myId])]
      .filter(p => p && !p.startsWith('K10-'))
      .sort();
    const myRank = allPeers.indexOf(myId);
    console.log(`[Gateway] _proactiveElect myRank=${myRank} in allPeers=${allPeers.length}`);
    if (myRank < 0 || myRank >= 100) return;
    const targetGw = GATEWAY_IDS[myRank];
    if (!targetGw) return;
    console.log(`[Gateway] _proactiveElect targetGw=${targetGw}`);
    _probeAndClaim(targetGw);
  }

  // Sonda se o gateway está ocupado; se não estiver, reivindica.
  function _probeAndClaim(gatewayId) {
    if (isActive) return;
    const mainPeer = getMainPeer ? getMainPeer() : null;
    if (!mainPeer || mainPeer.destroyed) {
      console.warn(`[Gateway] _probeAndClaim: mainPeer indisponível para sondar ${gatewayId}`);
      return;
    }
    let resolved = false;
    let probe;
    try { probe = mainPeer.connect(gatewayId, { reliable: true }); }
    catch(e) { 
      console.warn(`[Gateway] Exceção ao sondar ${gatewayId}`, e);
      return; 
    }
    if (!probe) return;
    console.log(`[Gateway] Sondando ${gatewayId}...`);
    const t = setTimeout(() => {
      if (resolved) return;
      resolved = true;
      try { probe.close(); } catch(e) {}
      // FIX V34: timeout sem resposta = PeerJS lento (ex: rede fria, poll K10-CENTRAL paralelo).
      // Tentar reivindicar: se slot ocupado, _attemptClaim falha com unavailable-id (inofensivo);
      // se vago, assume o slot. Resolve o loop gateway em redes com 1 peer.
      _attemptClaim(gatewayId);
    }, GW_PROBE_TIMEOUT);
    probe.on('open', () => {
      if (resolved) return;
      resolved = true;
      clearTimeout(t);
      try { probe.close(); } catch(e) {}
      // Gateway vivo — nada a fazer
    });
    probe.on('error', err => {
      if (resolved) return;
      resolved = true;
      clearTimeout(t);
      console.log(`[Gateway] Sondagem ${gatewayId} falhou (provavelmente vago):`, err && err.type);
      if (err && err.type === 'peer-unavailable') {
        // Slot vago! Reivindicar.
        _attemptClaim(gatewayId);
      }
    });
  }

  // ── Reivindicação de slot ─────────────────────────────────────────────
  function _attemptClaim(gatewayId) {
    if (isActive || claimInProgress) return;
    if (!gatewayId) return;
    // FIX V57: marca claim em progresso antes de qualquer await/async
    claimInProgress = true;
    console.log('[Gateway] Tentando reivindicar', gatewayId);
    const ice = (stunPoolFn && stunPoolFn()) || [];
    let resolved = false;
    let gp;
    try {
      gp = new Peer(gatewayId, {
        host: '0.peerjs.com', port: 443, secure: true, debug: 0,
        config: { iceServers: ice }
      });
    } catch(e) {
      console.warn('[Gateway] Exceção ao criar Peer para', gatewayId, e);
      return;
    }
    gwPeer = gp;

    const failTimer = setTimeout(() => {
      if (resolved) return;
      resolved = true;
      console.warn('[Gateway] Timeout ao reivindicar', gatewayId);
      _cleanup();
    }, GW_CLAIM_TIMEOUT);

   gp.on('open', () => {
  if (resolved) return;
  resolved = true;
  console.log('[Gateway] Reivindicado com sucesso:', gatewayId);
  clearTimeout(failTimer);
  isActive        = true;
  claimInProgress = false;  // FIX V57: libera flag (claim concluído)
  claimedId       = gatewayId;

  // ─────────────────────────────────────────────────────────────
  // NOVO: Reporte periódico ao K10-MONITOR (formato agregado)
  // V70: inclui grupos espelhados (mirror) no reporte
  // ─────────────────────────────────────────────────────────────
  setInterval(() => {
    if (!isActive) return;
    // Grupos onde somos primary
    let total = Object.values(activeGroups).reduce((sum, g) => sum + (g.positions?.length || 0), 0);
    const groups = {};
    for (const gid in activeGroups) {
      groups[gid] = activeGroups[gid].positions?.length || 0;
    }
    // V70: Adiciona grupos onde somos mirror de outro primary
    mirrorPrimaries.forEach((info, primaryId) => {
      for (const gid in (info.groups || {})) {
        const mCount = info.groups[gid]?.length || 0;
        if (!groups[gid]) {
          groups[gid] = mCount;
          total += mCount;
        }
      }
    });
    // V70: inclui info de mirror no payload
    const mirrorInfo = {
      mirrorOf: mirrorGwId || null,
      mirroringGroups: [...mirroredGroups],
      mirrorForPrimaries: [...mirrorPrimaries.keys()]
    };
    const payload = { t: 's', id: claimedId, total, groups, dualServer: mirrorInfo };
    const monConn = gwPeer.connect('K10-MON', { reliable: true });
    monConn.on('open', () => {
      try { monConn.send(payload); } catch(e) {}
      setTimeout(() => { try { monConn.close(); } catch(e) {} }, 1000);
    });
    monConn.on('error', () => {});
  }, 30000);
  // ─────────────────────────────────────────────────────────────

  // Reinicia estado dos grupos
  activeGroups = {};
  peerGroupMap.clear();
  gwConns.clear();
  gidCounter = 0;
  // Começa a aceitar conexões
  gp.on('connection', _onClient);
  // FIX V57: notifica o bootstrap para reconectar imediatamente ao
  // gateway recém-eleito (resolve o race bootstrap × claim async)
  try { if (typeof onClaimedCb === 'function') onClaimedCb(gatewayId); } catch(e) {}
  // FIX V58: inicia descoberta cross-gateway para o Modo Geral funcionar
  _startCrossGatewayDiscovery();
});
     

    gp.on('error', (err) => {
      // unavailable-id = outro ganhou a corrida — desiste silenciosamente
      if (resolved) return;
      resolved = true;
      clearTimeout(failTimer);
      console.warn('[Gateway] Falha ao reivindicar:', gatewayId, err && err.type);
      _cleanup();
    });

    gp.on('close',        () => _cleanup());
    gp.on('disconnected', () => { /* PeerJS reconecta automaticamente */ });
  }

  // ── Gerenciamento de grupos ───────────────────────────────────────────

  // V70: retorna array com [primary, mirror?] para o grupo
  function _getGroupServers(gid) {
    const servers = claimedId ? [claimedId] : [];
    // Se somos primary e temos mirror ativo espelhando este grupo
    if (mirrorGwId && mirrorAlive && mirroredGroups.has(gid)) {
      servers.push(mirrorGwId);
    }
    // Se somos mirror para este grupo de algum primary
    mirrorPrimaries.forEach((info, primaryId) => {
      if (info.groups && info.groups[gid]) {
        if (!servers.includes(primaryId)) servers.unshift(primaryId);
        if (claimedId && !servers.includes(claimedId)) servers.push(claimedId);
      }
    });
    return servers;
  }

  // Gera o próximo GID sequencial (AAAA, AAAB, …)
  function _nextGid() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let n = gidCounter++;
    let gid = '';
    for (let i = 0; i < 4; i++) {
      gid = chars[n % chars.length] + gid;
      n = Math.floor(n / chars.length);
    }
    return gid;
  }

  // Encontra um grupo aberto com vaga
  function _findOpenGroup() {
    for (const gid in activeGroups) {
      const g = activeGroups[gid];
      if (g.open && g.positions.length < GW_MAX_GROUP) return gid;
    }
    return null;
  }

  // Atribui um peer recém-conectado a um grupo, envia peer-list
  function _doAssignPeer(conn) {
    // Evita dupla atribuição
    if (peerGroupMap.has(conn.peer)) return;
    // V70: não atribuir conexões gateway-to-gateway (recruitment, sampling, etc.)
    if (conn.peer && conn.peer.startsWith('K10-')) return;

    let gid = _findOpenGroup();
    if (!gid) {
      gid = _nextGid();
      activeGroups[gid] = { positions: [], open: true };
    }
    const group = activeGroups[gid];
    const posIdx = group.positions.length;
    group.positions.push(conn.peer);
    peerGroupMap.set(conn.peer, gid);

    // Envia peer-list ao novo cliente (até 20 peers do mesmo grupo)
    const localPeers = group.positions.filter(p => p !== conn.peer).slice(0, 20);
    // FIX V58: se grupo local pequeno, completa com peers de outros gateways
    // (cross-gateway sampling). Permite que clientes de gateways diferentes
    // se encontrem e se conectem diretamente via WebRTC P2P.
    let peers = localPeers;
    if (peers.length < 5 && crossGatewayPeers.size > 0) {
      const crossSample = [...crossGatewayPeers]
        .filter(id => id !== conn.peer && !group.positions.includes(id))
        .sort(() => Math.random() - 0.5)
        .slice(0, 20 - peers.length);
      peers = [...peers, ...crossSample];
    }
    // Servidores do grupo: primary + secondary (V70: dual-server)
    const groupServers = _getGroupServers(gid);
    try {
      conn.send({
        type:         'peer-list',
        gid:          gid,
        peers:        peers,
        groupServers: groupServers,
        user:         GW_POSITION_LIST[posIdx] || String(posIdx),
        count:        group.positions.length
      });
    } catch(e) {}

    // Anuncia entrada para os demais membros do grupo
    const joinMsg = { type: 'join-update', gid, count: group.positions.length };
    group.positions.forEach(pid => {
      if (pid === conn.peer) return;
      const c = gwConns.get(pid);
      if (c && c.open) try { c.send(joinMsg); } catch(e) {}
    });

    // V70: Quando grupo atinge 2+ usuários, espelha no mirror
    if (group.positions.length >= 2) {
      // Estabelece mirror se ainda não temos
      if (!mirrorGwId) _establishMirror();
      // Adiciona grupo ao set de espelhados
      if (!mirroredGroups.has(gid)) {
        mirroredGroups.add(gid);
        console.log(`[Gateway V70] Grupo ${gid} agora espelhado (${group.positions.length} users)`);
        _broadcastGroupServersUpdate(gid);
      }
      // Sync incremental ao mirror
      _syncGroupToMirror(gid);
    }

    // Grupo atingiu 50? Fechar e notificar
    if (group.positions.length >= GW_MAX_GROUP) {
      group.open = false;
      const fullMsg = { type: 'group-full', gid, size: group.positions.length };
      group.positions.forEach(pid => {
        const c = gwConns.get(pid);
        if (c && c.open) try { c.send(fullMsg); } catch(e) {}
      });
      _gossipState(gid, group);
    }
  }

  // FIX V61: Re-send peer-list for already-assigned peer.
  // Called when group0-request arrives but the peer was already auto-assigned
  // on open. The original peer-list may have been lost if the client's DataChannel
  // wasn't fully ready to receive when the gateway sent it.
  function _resendPeerList(conn) {
    const gid = peerGroupMap.get(conn.peer);
    if (!gid || !activeGroups[gid]) return;
    const group = activeGroups[gid];
    const localPeers = group.positions.filter(p => p !== conn.peer).slice(0, 20);
    let peers = localPeers;
    if (peers.length < 5 && crossGatewayPeers.size > 0) {
      const crossSample = [...crossGatewayPeers]
        .filter(id => id !== conn.peer && !group.positions.includes(id))
        .sort(() => Math.random() - 0.5)
        .slice(0, 20 - peers.length);
      peers = [...peers, ...crossSample];
    }
    const posIdx = group.positions.indexOf(conn.peer);
    const groupServers = _getGroupServers(gid);
    try {
      conn.send({
        type:         'peer-list',
        gid:          gid,
        peers:        peers,
        groupServers: groupServers,
        user:         GW_POSITION_LIST[posIdx >= 0 ? posIdx : 0] || String(posIdx),
        count:        group.positions.length
      });
    } catch(e) {}
  }

  // Remove peer do grupo quando desconecta
  function _onPeerLeave(peerId) {
    const gid = peerGroupMap.get(peerId);
    peerGroupMap.delete(peerId);
    gwConns.delete(peerId);
    if (!gid || !activeGroups[gid]) return;
    const group = activeGroups[gid];
    const idx = group.positions.indexOf(peerId);
    if (idx !== -1) {
      // Swap-remove para manter array denso
      const last = group.positions.pop();
      if (idx < group.positions.length) group.positions[idx] = last;
    }

    // V70: Sincroniza leave com mirror
    if (mirroredGroups.has(gid)) {
      _syncGroupToMirror(gid);
    }

    // V70: Se grupo ficou com <2 usuários, remove do espelhamento
    if (group.positions.length < 2 && mirroredGroups.has(gid)) {
      console.log(`[Gateway V70] Grupo ${gid} com ${group.positions.length} users — removendo do mirror`);
      mirroredGroups.delete(gid);
      _syncGroupToMirror(gid); // envia com 0/1 para mirror remover
      _broadcastGroupServersUpdate(gid);
    }

    // Grupo estava cheio e agora tem vaga? Reabrir e notificar
    if (!group.open && group.positions.length < GW_MAX_GROUP) {
      group.open = true;
      const reopenMsg = { type: 'group-reopened', gid, size: group.positions.length };
      group.positions.forEach(pid => {
        const c = gwConns.get(pid);
        if (c && c.open) try { c.send(reopenMsg); } catch(e) {}
      });
      _gossipState(gid, group);
    }
    // Anuncia saída (pex-update)
    if (group.positions.length > 0) {
      const leaveMsg = { type: 'pex-update', gid, user: peerId, ttl: 5 };
      group.positions.forEach(pid => {
        const c = gwConns.get(pid);
        if (c && c.open) try { c.send(leaveMsg); } catch(e) {}
      });
    }
    // Remove grupo vazio
    if (group.positions.length === 0) delete activeGroups[gid];
  }

  // Propaga estado do grupo para todos os clientes conectados (gossip)
  function _gossipState(gid, group) {
    const syncMsg = {
      type:      'group-state-sync',
      gid:       gid,
      size:      group.positions.length,
      open:      group.open,
      timestamp: Date.now()
    };
    gwConns.forEach(c => {
      if (c && c.open) try { c.send(syncMsg); } catch(e) {}
    });
  }

  // ── V70: Mirror Gateway — funções core ─────────────────────────────────
  //
  // _establishMirror(): conecta a UM outro gateway como espelho. UMA conexão
  //   para TODOS os grupos — escala a 1000+ salas sem problema.
  // _syncGroupToMirror(gid): envia estado de um grupo ao mirror.
  // _syncAllGroupsToMirror(): envia estado de TODOS os grupos espelhados.
  // _broadcastGroupServersUpdate(gid): notifica clientes de mudança de servers.
  // _startMirrorHealth(): health check periódico.
  // _onMirrorLost(): mirror morreu — tenta outro.
  // _promoteMirrorToPrimary(primaryId): primary morreu — assumimos.
  // ─────────────────────────────────────────────────────────────────────

  function _establishMirror() {
    if (!isActive || !gwPeer || gwPeer.destroyed) return;
    if (mirrorConn && mirrorAlive) return; // já temos mirror

    // Escolhe o candidato com round-robin simples (exclui a si mesmo)
    const candidates = GATEWAY_IDS.filter(id => id !== claimedId);
    if (candidates.length === 0) return;

    let resolved = false;
    let attempts = 0;

    function _tryNextCandidate() {
      if (resolved || attempts >= candidates.length) return;
      const candidateId = candidates[attempts++];

      let probe;
      try { probe = gwPeer.connect(candidateId, { reliable: true }); }
      catch(e) { _tryNextCandidate(); return; }
      if (!probe) { _tryNextCandidate(); return; }

      const t = setTimeout(() => {
        if (resolved) return;
        try { probe.close(); } catch(e) {}
        _tryNextCandidate();
      }, 6_000);

      probe.on('open', () => {
        if (resolved) { clearTimeout(t); try { probe.close(); } catch(e) {} return; }
        // Pede para ser nosso mirror
        try {
          probe.send({
            type: 'gw-mirror-request',
            primaryId: claimedId
          });
        } catch(e) { clearTimeout(t); try { probe.close(); } catch(e2) {} _tryNextCandidate(); return; }
      });

      probe.on('data', d => {
        if (resolved) return;
        if (d && d.type === 'gw-mirror-accept') {
          resolved = true;
          clearTimeout(t);
          mirrorGwId = candidateId;
          mirrorConn = probe;
          mirrorAlive = true;
          mirrorLastPing = Date.now();
          console.log(`[Gateway V70] Mirror estabelecido: ${candidateId} (1 conexão para todos os grupos)`);

          // Listener de dados do mirror (pongs, relays)
          probe.on('data', mirrorData => {
            if (!mirrorData || !mirrorData.type) return;
            if (mirrorData.type === 'gw-mirror-pong') {
              mirrorLastPing = Date.now();
            }
            if (mirrorData.type === 'gw-mirror-relay') {
              // Relay de mensagem vinda de cliente no mirror
              const gid = mirrorData.gid;
              const payload = mirrorData.payload;
              if (payload && gid && activeGroups[gid]) {
                activeGroups[gid].positions.forEach(pid => {
                  if (pid === mirrorData.originPeer) return;
                  const c = gwConns.get(pid);
                  if (c && c.open) try { c.send(payload); } catch(e) {}
                });
              }
            }
          });

          // Listener de desconexão
          probe.on('close', () => _onMirrorLost());
          probe.on('error', () => _onMirrorLost());

          // Sync inicial completo de todos os grupos
          _syncAllGroupsToMirror();
          // Broadcast groupServers para todos os grupos espelhados
          mirroredGroups.forEach(gid => _broadcastGroupServersUpdate(gid));
          // Inicia health check
          if (!mirrorHealthTimer) _startMirrorHealth();
          return;
        }
        if (d && d.type === 'gw-mirror-reject') {
          clearTimeout(t);
          try { probe.close(); } catch(e) {}
          _tryNextCandidate();
        }
      });

      probe.on('error', () => {
        if (resolved) return;
        clearTimeout(t);
        _tryNextCandidate();
      });
    }

    _tryNextCandidate();
  }

  function _syncGroupToMirror(gid) {
    if (!mirrorConn || !mirrorConn.open || !mirrorAlive) return;
    const group = activeGroups[gid];
    try {
      mirrorConn.send({
        type: 'gw-mirror-sync',
        gid: gid,
        positions: group ? group.positions.slice() : [],
        count: group ? group.positions.length : 0,
        active: mirroredGroups.has(gid)
      });
    } catch(e) { console.warn('[Gateway V70] Falha ao sincronizar grupo', gid, e); }
  }

  function _syncAllGroupsToMirror() {
    if (!mirrorConn || !mirrorConn.open) return;
    const allGroups = {};
    for (const gid of mirroredGroups) {
      if (activeGroups[gid]) {
        allGroups[gid] = activeGroups[gid].positions.slice();
      }
    }
    try {
      mirrorConn.send({
        type: 'gw-mirror-full-sync',
        primaryId: claimedId,
        groups: allGroups
      });
    } catch(e) { console.warn('[Gateway V70] Falha no full-sync ao mirror', e); }
  }

  function _onMirrorLost() {
    if (!mirrorGwId) return;
    console.log(`[Gateway V70] Mirror ${mirrorGwId} perdido — tentando outro`);
    const lostId = mirrorGwId;
    mirrorGwId = null;
    mirrorConn = null;
    mirrorAlive = false;
    // Notifica clientes que ficaram com 1 servidor
    mirroredGroups.forEach(gid => _broadcastGroupServersUpdate(gid));
    // Tenta estabelecer novo mirror após 3s
    setTimeout(() => {
      if (isActive && mirroredGroups.size > 0) _establishMirror();
    }, 3_000);
  }

  function _broadcastGroupServersUpdate(gid) {
    if (!activeGroups[gid]) return;
    const servers = _getGroupServers(gid);
    const updateMsg = { type: 'group-servers-update', gid, groupServers: servers };
    activeGroups[gid].positions.forEach(pid => {
      const c = gwConns.get(pid);
      if (c && c.open) try { c.send(updateMsg); } catch(e) {}
    });
    console.log(`[Gateway V70] Broadcast groupServers ${gid}: [${servers.join(', ')}]`);
  }

  function _startMirrorHealth() {
    if (mirrorHealthTimer) return;
    mirrorHealthTimer = setInterval(() => {
      const now = Date.now();

      // PRIMARY → ping mirror
      if (mirrorConn && mirrorConn.open && mirrorAlive) {
        try { mirrorConn.send({ type: 'gw-mirror-ping' }); } catch(e) {}
        if (now - mirrorLastPing > GW_MIRROR_TIMEOUT) {
          console.warn(`[Gateway V70] Mirror ${mirrorGwId} timeout`);
          _onMirrorLost();
        }
      }

      // MIRROR → ping primaries
      mirrorPrimaries.forEach((info, primaryId) => {
        if (info.conn && info.conn.open) {
          try { info.conn.send({ type: 'gw-mirror-ping' }); } catch(e) {}
        }
        if (now - (info.lastPing || 0) > GW_MIRROR_TIMEOUT) {
          console.warn(`[Gateway V70] Primary ${primaryId} timeout — promovendo`);
          _promoteMirrorToPrimary(primaryId);
        }
      });

      // Se não temos papel dual, parar timer
      if (!mirrorGwId && mirrorPrimaries.size === 0) {
        clearInterval(mirrorHealthTimer);
        mirrorHealthTimer = null;
      }
    }, GW_MIRROR_PING_MS);

    // SYNC periódico — envia estado completo ao mirror a cada ciclo
    if (!mirrorSyncTimer) {
      mirrorSyncTimer = setInterval(() => {
        if (mirrorConn && mirrorConn.open && mirrorAlive) {
          _syncAllGroupsToMirror();
        }
      }, GW_MIRROR_SYNC_MS);
    }
  }

  function _promoteMirrorToPrimary(primaryId) {
    const info = mirrorPrimaries.get(primaryId);
    if (!info) return;
    console.log(`[Gateway V70] PROMOÇÃO: assumindo ${Object.keys(info.groups || {}).length} grupos do primary ${primaryId}`);
    // Migra todos os grupos para activeGroups
    for (const gid in (info.groups || {})) {
      const positions = info.groups[gid] || [];
      if (!activeGroups[gid] && positions.length > 0) {
        activeGroups[gid] = { positions: positions, open: positions.length < GW_MAX_GROUP };
        positions.forEach(pid => peerGroupMap.set(pid, gid));
        if (positions.length >= 2) mirroredGroups.add(gid);
      }
      _broadcastGroupServersUpdate(gid);
    }
    // Limpa
    try { if (info.conn && info.conn.open) info.conn.close(); } catch(e) {}
    mirrorPrimaries.delete(primaryId);
    // Estabelece nosso próprio mirror para os novos grupos
    if (mirroredGroups.size > 0 && !mirrorGwId) {
      setTimeout(() => _establishMirror(), 3_000);
    }
  }

  // ── Cross-gateway peer discovery (FIX V58) ───────────────────────────
  //
  // Problema: cada gateway elege-se de forma independente e cria grupos
  // isolados. Peers em gateways diferentes nunca se descobrem.
  //
  // Solução: gwPeer sonda 3 gateways aleatórios via DataConnection, envia
  // gw-peer-sample-request e armazena os IDs recebidos em crossGatewayPeers.
  // Quando um novo cliente conecta e o grupo local está vazio, esses IDs são
  // incluídos no peer-list — o cliente os conecta diretamente via WebRTC.
  // ─────────────────────────────────────────────────────────────────────────

  // FIX V62: intervalo adaptativo — primeiros ciclos rápidos (5s), depois estável (30s).
  // Cobre a janela de entrada de novos peers sem sobrecarregar a rede no longo prazo.
  let _discovCycle = 0; // conta ciclos para controle do intervalo adaptativo

  function _startCrossGatewayDiscovery() {
    _discovCycle = 0;
    if (crossGwDiscovTimer) { clearTimeout(crossGwDiscovTimer); crossGwDiscovTimer = null; }
    // Primeiro sample logo após o claim (aguarda gateways vizinhos subirem)
    crossGwDiscovTimer = setTimeout(_runDiscoveryCycle, 4_000);
  }

  function _runDiscoveryCycle() {
    crossGwDiscovTimer = null;
    if (!isActive) return;
    _discoverCrossGatewayPeers();
    _discovCycle++;
    // Primeiros 3 ciclos a cada 5s (cobre janela de entrada); depois 30s
    const nextMs = _discovCycle < 3 ? 5_000 : 30_000;
    crossGwDiscovTimer = setTimeout(_runDiscoveryCycle, nextMs);
  }

  function _discoverCrossGatewayPeers() {
    if (!isActive || !gwPeer || gwPeer.destroyed) return;
    const prevSize = crossGatewayPeers.size;
    // Sonda 3 gateways aleatórios (excluindo o próprio)
    const targets = GATEWAY_IDS
      .filter(id => id !== claimedId)
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);

    // FIX V62: após todos os probes terminarem, se crossGatewayPeers cresceu,
    // empurra peer-list atualizado para clientes já conectados com grupo pequeno.
    let pending = targets.length;
    function _onProbesDone() {
      if (crossGatewayPeers.size > prevSize) {
        console.log(`[Gateway] Cross-discovery: ${crossGatewayPeers.size - prevSize} novos peers — pushing peer-list para clientes existentes`);
        gwConns.forEach(c => {
          if (!c || !c.open) return;
          const gid = peerGroupMap.get(c.peer);
          if (!gid || !activeGroups[gid]) return;
          // Só envia se o grupo local é pequeno (beneficia de cross-peers)
          if (activeGroups[gid].positions.length < 5) {
            _resendPeerList(c);
          }
        });
      }
    }

    targets.forEach(gwTargetId => {
      let resolved = false;
      let probe;
      try { probe = gwPeer.connect(gwTargetId, { reliable: true }); }
      catch(e) { pending--; if (pending === 0) _onProbesDone(); return; }
      if (!probe) { pending--; if (pending === 0) _onProbesDone(); return; }

      const t = setTimeout(() => {
        if (resolved) return;
        resolved = true;
        try { probe.close(); } catch(e) {}
        pending--; if (pending === 0) _onProbesDone();
      }, 6_000);

      probe.on('open', () => {
        if (resolved) return;
        // Solicita amostra de peers do gateway remoto
        try { probe.send({ type: 'gw-peer-sample-request' }); } catch(e) {}
      });

      probe.on('data', d => {
        if (resolved) return;
        // Aguarda especificamente gw-peer-sample-response (ignora peer-list etc.)
        if (d && d.type === 'gw-peer-sample-response' && Array.isArray(d.peers)) {
          resolved = true;
          clearTimeout(t);
          d.peers.forEach(id => {
            if (id && typeof id === 'string' && !id.startsWith('K10-')) {
              crossGatewayPeers.add(id);
            }
          });
          console.log(`[Gateway] Cross-sample de ${gwTargetId}: +${d.peers.length} peers (total: ${crossGatewayPeers.size})`);
          try { probe.close(); } catch(e) {}
          pending--; if (pending === 0) _onProbesDone();
        }
      });

      probe.on('error', () => {
        clearTimeout(t);
        if (resolved) return;
        resolved = true;
        pending--; if (pending === 0) _onProbesDone();
        try { probe.close(); } catch(e) {}
      });
      probe.on('close', () => { clearTimeout(t); });
    });
  }

  // ── Handlers de conexão ───────────────────────────────────────────────

  function _onClient(conn) {
    gwConns.set(conn.peer, conn);
    // FIX V61: handle race where conn is already open when _onClient runs.
    // In some PeerJS timing scenarios, the DataConnection's open event fires
    // before the connection event handler sets up the listener, causing
    // _doAssignPeer to never be called and peer-list to never be sent.
    if (conn.open) {
      _doAssignPeer(conn);
    } else {
      conn.on('open',  () => _doAssignPeer(conn));
    }
    conn.on('data',  data => _onData(conn, data));
    conn.on('close', ()   => _onPeerLeave(conn.peer));
    conn.on('error', ()   => _onPeerLeave(conn.peer));
  }

  function _onData(conn, data) {
    if (!data || !data.type) return;

    // FIX V58: Cross-gateway peer sampling — outro gateway sonda nossos peers.
    // Responde com até 10 IDs reais (não-K10), depois remove o probe do grupo
    // e fecha a conexão para não poluir os grupos locais.
    if (data.type === 'gw-peer-sample-request') {
      const allPeers = [...peerGroupMap.keys()].filter(id => id !== conn.peer && !id.startsWith('K10-'));
      const sample   = allPeers.sort(() => Math.random() - 0.5).slice(0, 10);
      try { conn.send({ type: 'gw-peer-sample-response', peers: sample }); } catch(e) {}
      // Remove o probe do grupo (foi auto-atribuído no open) e fecha a conexão
      _onPeerLeave(conn.peer);
      setTimeout(() => { try { conn.close(); } catch(e) {} }, 800);
      return;
    }

    // ── V70: Protocolo mirror gateway ───────────────────────────────────
    // Outro gateway quer que nós sejamos seu mirror (UMA conexão → todos os grupos)
    if (data.type === 'gw-mirror-request') {
      const primaryId = data.primaryId;
      console.log(`[Gateway V70] Mirror request de ${primaryId}`);
      // Aceitar sempre (sem limite — é apenas 1 conexão)
      try { conn.send({ type: 'gw-mirror-accept', mirrorId: claimedId }); } catch(e) {}

      mirrorPrimaries.set(primaryId, {
        conn: conn,
        groups: {},
        lastPing: Date.now()
      });

      // Escuta desconexão do primary
      conn.on('close', () => {
        console.log(`[Gateway V70] Primary ${primaryId} desconectou`);
        // Timeout irá detectar e promover se necessário
        const info = mirrorPrimaries.get(primaryId);
        if (info) info.conn = null;
      });

      // Inicia health check se não rodando
      if (!mirrorHealthTimer) _startMirrorHealth();
      return;
    }
    if (data.type === 'gw-mirror-reject') return; // noop, tratado no callback

    // Sync incremental: um grupo mudou no primary
    if (data.type === 'gw-mirror-sync') {
      const senderId = conn.peer;
      const info = mirrorPrimaries.get(senderId);
      if (info) {
        info.lastPing = Date.now();
        if (data.active && data.positions && data.positions.length > 0) {
          info.groups[data.gid] = data.positions;
        } else {
          delete info.groups[data.gid]; // grupo removido do espelhamento
        }
      }
      return;
    }

    // Sync completo: todos os grupos do primary de uma vez
    if (data.type === 'gw-mirror-full-sync') {
      const primaryId = data.primaryId || conn.peer;
      const info = mirrorPrimaries.get(primaryId);
      if (info) {
        info.groups = data.groups || {};
        info.lastPing = Date.now();
        console.log(`[Gateway V70] Full-sync de ${primaryId}: ${Object.keys(info.groups).length} grupos espelhados`);
      }
      return;
    }

    // Pings de health
    if (data.type === 'gw-mirror-ping') {
      // Atualizar lastPing
      const info = mirrorPrimaries.get(conn.peer);
      if (info) info.lastPing = Date.now();
      if (conn.peer === mirrorGwId) mirrorLastPing = Date.now();
      try { conn.send({ type: 'gw-mirror-pong' }); } catch(e) {}
      return;
    }
    if (data.type === 'gw-mirror-pong') {
      const info = mirrorPrimaries.get(conn.peer);
      if (info) info.lastPing = Date.now();
      if (conn.peer === mirrorGwId) mirrorLastPing = Date.now();
      return;
    }

    // Relay de mensagem (mirror → primary)
    if (data.type === 'gw-mirror-relay') {
      // Já tratado no listener da mirrorConn em _establishMirror
      return;
    }
    // ── Fim V70 ────────────────────────────────────────────────────────

    // Bootstrap explícito
    if (data.type === 'group0-request') {
      // FIX V61: If peer was already assigned (auto-assign on open worked but
      // peer-list was lost because client DataChannel wasn't fully ready),
      // re-send the peer-list instead of silently returning.
      if (peerGroupMap.has(conn.peer)) {
        _resendPeerList(conn);
      } else {
        _doAssignPeer(conn);
      }
      return;
    }

    // Handshake silencioso
    if (data.type === 'handshake') {
      try { conn.send({ type: 'handshake', peerId: claimedId }); } catch(e) {}
      return;
    }

    // Novo gateway solicitando estado completo (sincronização inicial)
    if (data.type === 'state-request') {
      try {
        conn.send({ type: 'state-response', groups: activeGroups, timestamp: Date.now() });
      } catch(e) {}
      return;
    }

    // Relay de mensagens dentro do grupo (broadcast e diretas) com TTL
    if (data.type === 'message' || data.type === 'youtube-chat-start' ||
        data.type === 'youtube-chat-stop' || data.type === 'radio-start' ||
        data.type === 'radio-chunk') {
      const rawTtl = typeof data.ttl === 'number' ? data.ttl : 8;
      const ttl    = Math.min(Math.max(0, rawTtl), 15);
      if (ttl <= 0) return;
      const relay = Object.assign({}, data, { ttl: ttl - 1 });
      if (data.direct && data.recipient) {
        const target = gwConns.get(data.recipient);
        if (target && target.open && data.recipient !== conn.peer) {
          try { target.send(relay); } catch(e) {}
        }
        return;
      }
      // Broadcast apenas para membros do mesmo grupo
      const gid = peerGroupMap.get(conn.peer);
      if (gid && activeGroups[gid]) {
        activeGroups[gid].positions.forEach(pid => {
          if (pid === conn.peer) return;
          const c = gwConns.get(pid);
          if (c && c.open) try { c.send(relay); } catch(e) {}
        });
      }
    }
  }

  // ── Limpeza ───────────────────────────────────────────────────────────
  function _cleanup() {
    if (gwPeer && !gwPeer.destroyed) { try { gwPeer.destroy(); } catch(e) {} }
    gwPeer              = null;
    isActive            = false;
    claimInProgress     = false;  // FIX V57: libera flag ao limpar estado
    claimedId           = null;
    activeGroups        = {};
    peerGroupMap.clear();
    gwConns.clear();
    // FIX V58: limpa estado cross-gateway
    crossGatewayPeers.clear();
    if (crossGwDiscovTimer) { clearTimeout(crossGwDiscovTimer); crossGwDiscovTimer = null; }
    _discovCycle = 0;
    // V70: limpa estado mirror
    try { if (mirrorConn && mirrorConn.open) mirrorConn.close(); } catch(e) {}
    mirrorGwId = null; mirrorConn = null; mirrorAlive = false;
    mirroredGroups.clear();
    mirrorPrimaries.forEach(info => { try { if (info.conn && info.conn.open) info.conn.close(); } catch(e) {} });
    mirrorPrimaries.clear();
    if (mirrorHealthTimer) { clearInterval(mirrorHealthTimer); mirrorHealthTimer = null; }
    if (mirrorSyncTimer)   { clearInterval(mirrorSyncTimer);   mirrorSyncTimer = null; }
  }

  return {
    init, tryClaim,
    get isActive()  { return isActive; },
    get claimedId() { return claimedId; },
    // V70: expõe estado mirror para debugging/monitor
    get mirrorGwId()        { return mirrorGwId; },
    get mirrorAlive()       { return mirrorAlive; },
    get mirroredGroups()    { return mirroredGroups; },
    get mirrorPrimaries()   { return mirrorPrimaries; }
  };
})();


// ═══════════════════════════════════════════════════════════════════════
// K10-CENTRAL SHADOW (V59) — Hub de descoberta eleito
//
// CONCEITO: O primeiro peer que detecta K10-CENTRAL vago tenta reivindicar
// o ID. Se conseguir (PeerJS open), torna-se a Central. Se outro ganhou
// a corrida (unavailable-id), desiste silenciosamente.
//
// RESPONSABILIDADE DA CENTRAL:
//   1. Pinga periodicamente os 100 gateways para saber quais estão ativos.
//   2. Quando um novo peer conecta e envia central-discovery-request,
//      responde com a lista dos gateways confirmados ativos.
//   3. O bootstrap usa K10-CENTRAL como fast-path: recebe a lista e
//      conecta direto aos gateways ativos, sem varrer todos os 100.
//
// FAILOVER AUTOMÁTICO: ao cair, K10-CENTRAL libera o ID no PeerJS.
// O próximo peer que detectar a ausência assume automaticamente.
// Nenhum usuário percebe — o processo é 100% silencioso.
// ═══════════════════════════════════════════════════════════════════════
const K10CentralShadow = (() => {
  const CENTRAL_ID = 'K10-HUB-V62';
  const POLL_MS         = 25_000;   // re-verifica gateways ativos a cada 25s
  const ELECT_MS        = 15_000;   // tenta eleição a cada 15s
  const CLAIM_TIMEOUT   = 14_000;   // timeout para reivindicar o ID
  const PROBE_TIMEOUT   = 2_000;    // V60: reduzido 3s→2s (sonda rápida)

  let centralPeer     = null;   // instância Peer com id 'K10-CENTRAL'
  let isActive        = false;  // true quando somos a central
  let claimInProgress = false;
  let electionTimer   = null;
  let pollTimer       = null;
  let centralConns    = new Map(); // peerId → DataConnection

  // Gateways confirmados ativos pelo último poll
  let activeGateways = new Set();

  let getKnownPeers   = null; // () => string[]
  let getMyPeerId     = null; // () => string
  let stunPoolFn      = null; // () => ICEServer[]
  let getMainPeer     = null; // () => Peer
  let onCentralUpCb   = null; // (id) => void — chamado ao assumir a central

  // ── API pública ───────────────────────────────────────────────────────
  function init(getPeers, getStun, getOwnId, getMain, onCentralUp) {
    console.log(`[K10CentralShadow] init chamado.`);
    getKnownPeers = getPeers;
    stunPoolFn    = getStun;
    getMyPeerId   = getOwnId;
    getMainPeer   = getMain;
    if (typeof onCentralUp === 'function') onCentralUpCb = onCentralUp;
    if (electionTimer) clearInterval(electionTimer);
    electionTimer = setInterval(_proactiveElect, ELECT_MS);
    // V60: primeira tentativa imediata — claimWithGateway pode ser chamado
    // antes desta linha pelo onClaimed do K10GatewayShadow, então aqui
    // fazemos apenas a eleição proativa para casos onde nenhum gateway foi
    // ainda reivindicado (rede completamente fria).
    setTimeout(_proactiveElect, 6_000);
  }

  // Reivindicação reativa — chamada pelo bootstrap quando detecta peer-unavailable
  function tryClaim() {
    if (isActive || claimInProgress) {
      console.log(`[K10CentralShadow] tryClaim ignorado: isActive=${isActive}, claimInProgress=${claimInProgress}`);
      return;
    }
    console.log(`[K10CentralShadow] tryClaim chamado. Acionando _attemptClaim()`);
    _attemptClaim();
  }

  // V60: Reivindicação com gateway pré-conhecido.
  // Chamada pelo K10GatewayShadow quando este assume um K10-GATE-XXXX.
  // O peer acumula os dois papéis: central de descoberta + gateway de grupo.
  // Assim, quando o próximo peer perguntar "quem está ativo?", K10-CENTRAL
  // já sabe a resposta (seu próprio gateway) sem precisar esperar o poll.
  function claimWithGateway(gwId) {
    if (gwId) {
      // Pré-popula activeGateways com o próprio gateway do peer.
      // Mesmo que K10-CENTRAL já esteja ativo (outro peer ganhou a corrida),
      // o gwId fica disponível para o próximo poll.
      activeGateways.add(gwId);
      console.log(`[K10CentralShadow] claimWithGateway: ${gwId} adicionado a activeGateways`);
    }
    if (isActive || claimInProgress) return; // já é central ou em processo
    console.log(`[K10CentralShadow] claimWithGateway agendando _attemptClaim()`);
    _attemptClaim();
  }

  // ── Eleição proativa ──────────────────────────────────────────────────
  function _proactiveElect() {
    if (isActive || claimInProgress) return;
    const myId = getMyPeerId && getMyPeerId();
    if (!myId) return;
    // Qualquer peer tenta sondar K10-CENTRAL; PeerJS resolve a corrida.
    // Para reduzir colisões, o peer com menor ID tem prioridade:
    // verifica se é o menor entre os conhecidos antes de sondar.
    const known = (getKnownPeers && getKnownPeers()) || [];
    const realPeers = [...new Set([...known, myId])].filter(p => p && !p.startsWith('K10-')).sort();
    const myRank = realPeers.indexOf(myId);
    // Rank 0 = menor ID → tenta sempre. Rank 1 só tenta se rank 0 não assumiu em tempo.
    // Ranks maiores têm jitter crescente para deixar os menores tentarem primeiro.
    if (myRank < 0) return;
    const delay = myRank === 0 ? 0 : myRank * 2000 + Math.random() * 1000;
    setTimeout(() => {
      if (isActive || claimInProgress) return;
      _probeAndMaybeClaim();
    }, delay);
  }

  // Sonda se K10-CENTRAL existe; se não existir, reivindica.
  function _probeAndMaybeClaim() {
    if (isActive || claimInProgress) return;
    const mainPeer = getMainPeer ? getMainPeer() : null;
    if (!mainPeer || mainPeer.destroyed) return;
    let resolved = false, probe;
    try { probe = mainPeer.connect(CENTRAL_ID, { reliable: true }); }
    catch(e) { return; }
    if (!probe) return;
    const t = setTimeout(() => {
      if (resolved) return;
      resolved = true;
      try { probe.close(); } catch(e) {}
      // Timeout = central existe mas lenta; não tenta assumir
    }, PROBE_TIMEOUT);
    probe.on('open', () => {
      if (resolved) return;
      resolved = true; clearTimeout(t);
      try { probe.close(); } catch(e) {}
      // K10-CENTRAL viva — nada a fazer
    });
    probe.on('error', err => {
      if (resolved) return;
      resolved = true; clearTimeout(t);
      if (err && err.type === 'peer-unavailable') {
        _attemptClaim(); // slot vago — tenta reivindicar
      }
    });
    probe.on('close', () => { clearTimeout(t); });
  }

  // ── Reivindicação ─────────────────────────────────────────────────────
  function _attemptClaim() {
    if (isActive || claimInProgress) return;
    claimInProgress = true;
    console.log(`[K10CentralShadow] Iniciando nova instância PeerJS para K10-CENTRAL...`);
    const ice = (stunPoolFn && stunPoolFn()) || [];
    let gp;
    try {
      gp = new Peer(CENTRAL_ID, {
        host: '0.peerjs.com', port: 443, secure: true, debug: 0,
        config: { iceServers: ice }
      });
    } catch(e) { 
      claimInProgress = false; 
      console.warn(`[K10CentralShadow] Exceção em new Peer(K10-CENTRAL):`, e);
      return; 
    }
    centralPeer = gp;
    const failTimer = setTimeout(() => {
      console.warn(`[K10CentralShadow] Timeout (14s) tentando reivindicar K10-CENTRAL`);
      _cleanup();
    }, CLAIM_TIMEOUT);
    gp.on('open', () => {
      clearTimeout(failTimer);
      isActive = true;
      claimInProgress = false;
      console.log(`[K10CentralShadow] K10-CENTRAL assumida com sucesso!`);
      // Começa a aceitar clientes
      gp.on('connection', _onClient);
      // Inicia poll periódico dos gateways
      _startGatewayPoll();
      try { if (typeof onCentralUpCb === 'function') onCentralUpCb(CENTRAL_ID); } catch(e) {}
    });
    gp.on('error', (err) => { 
      clearTimeout(failTimer); 
      // FIX V33: peer-unavailable borbulha das sondagens _pollGateways — NÃO é fatal.
      // FIX V62: suprime log de peer-unavailable (é ruído normal das sondagens periódicas).
      if (err && err.type === 'peer-unavailable') return;
      console.warn(`[K10CentralShadow] Erro do PeerJS em K10-CENTRAL:`, err && err.type);
      _cleanup(); 
    });
    gp.on('close', () => {
      console.log(`[K10CentralShadow] K10-CENTRAL fechada`);
      _cleanup()
    });
    gp.on('disconnected', () => { /* PeerJS reconecta */ });
  }

  // ── Poll periódico dos gateways ───────────────────────────────────────
  function _startGatewayPoll() {
    setTimeout(_pollGateways, 1_500); // poll inicial rápido
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (!isActive) { clearInterval(pollTimer); pollTimer = null; return; }
      _pollGateways();
    }, POLL_MS);
  }

  function _pollGateways() {
    if (!isActive || !centralPeer || centralPeer.destroyed) return;
    // Sonda até 25 gateways em paralelo; atualiza activeGateways
    const batch = GATEWAY_IDS.sort(() => Math.random() - 0.5).slice(0, 25);
    batch.forEach(gwId => {
      let probe, resolved = false;
      try { probe = centralPeer.connect(gwId, { reliable: true }); }
      catch(e) { return; }
      if (!probe) return;
      const t = setTimeout(() => {
        if (resolved) return; resolved = true;
        // Timeout sem open/error: o gateway existe mas está ocupado = ativo
        activeGateways.add(gwId);
        try { probe.close(); } catch(e) {}
      }, 4_500);
      probe.on('open', () => {
        if (resolved) return; resolved = true; clearTimeout(t);
        activeGateways.add(gwId);
        try { probe.close(); } catch(e) {}
      });
      probe.on('error', err => {
        if (resolved) return; resolved = true; clearTimeout(t);
        if (err && err.type === 'peer-unavailable') {
          activeGateways.delete(gwId); // gateway vago (não serve como bootstrap)
        } else {
          activeGateways.add(gwId); // erro de rede: assume ativo
        }
        try { probe.close(); } catch(e) {}
      });
      probe.on('close', () => clearTimeout(t));
    });
  }

  // ── Atende clientes ───────────────────────────────────────────────────
  function _onClient(conn) {
    centralConns.set(conn.peer, conn);
    // FIX V61: handle race where conn is already open when _onClient runs.
    if (conn.open) {
      _sendGatewayList(conn);
    } else {
      conn.on('open', () => {
        // Envia lista imediatamente ao conectar
        _sendGatewayList(conn);
      });
    }
    conn.on('data', data => {
      if (!data || !data.type) return;
      if (data.type === 'central-discovery-request') {
        _sendGatewayList(conn);
      }
    });
    conn.on('close', () => centralConns.delete(conn.peer));
    conn.on('error', () => centralConns.delete(conn.peer));
  }

  function _sendGatewayList(conn) {
    // Prefere gateways confirmados ativos; se poucos, completa com lista estática
    const confirmed = [...activeGateways];
    const fallback  = GATEWAY_IDS.filter(id => !activeGateways.has(id)).sort(() => Math.random() - 0.5);
    const gateways  = [...confirmed, ...fallback].slice(0, 30);
    try {
      conn.send({ type: 'central-response', gateways, confirmedCount: confirmed.length });
    } catch(e) {}
  }

  // ── Limpeza ───────────────────────────────────────────────────────────
  function _cleanup() {
    if (centralPeer && !centralPeer.destroyed) { try { centralPeer.destroy(); } catch(e) {} }
    centralPeer = null; isActive = false; claimInProgress = false;
    activeGateways.clear(); centralConns.clear();
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  return { init, tryClaim, claimWithGateway, get isActive() { return isActive; } };
})();


// ═══════════════════════════════════════════════════════════════════════
// K10-GROUP SHADOW (V50) — 2 servidores eleitos por salinha, em background
//
// Cada salinha (gid) precisa ter exatamente 2 servidores ativos em
// qualquer momento. Os 2 sao eleitos entre os usuarios da propria
// salinha (menor peerId = slot 1, segundo menor = slot 2).
//
// Quando 1 cai, o proximo da fila assume automaticamente. Tudo silencioso.
// O usuario nao sabe que esta servindo. IDs registrados no PeerJS publico:
//   K10-{gid}-1  (servidor primario da salinha)
//   K10-{gid}-2  (servidor secundario da salinha)
//
// Cada slot atende clientes do proprio gid: relay de mensagens broadcast
// (Modo Geral dentro da salinha) e mensagens diretas entre membros.
// ═══════════════════════════════════════════════════════════════════════
const K10GroupShadow = (() => {
  const PROBE_MS         = 10_000;
  const ELECT_JITTER_MS  = 1_500;
  const RECENT_ALIVE_MS  = 18_000;

  const slots = new Map();   // slotId -> { peer, conns:Map, isActive:bool, alive:number, hbTimer }
  let probeTimer = null;
  let myPeerId   = null;
  let getMyGid   = null;
  let getGroupMembers = null;  // () => Array<peerId>
  let stunPoolFn = null;

  function start(myId, gidGetter, membersGetter, stunGetter) {
    myPeerId        = myId;
    getMyGid        = gidGetter;
    getGroupMembers = membersGetter;
    stunPoolFn      = stunGetter;
    if (probeTimer) clearInterval(probeTimer);
    probeTimer = setInterval(probeAndElect, PROBE_MS);
    setTimeout(probeAndElect, 6000);
  }

  function stop() {
    if (probeTimer) clearInterval(probeTimer);
    probeTimer = null;
    for (const [slotId, s] of slots) {
      if (s.hbTimer) clearInterval(s.hbTimer);
      try { if (s.peer && !s.peer.destroyed) s.peer.destroy(); } catch(e) {}
    }
    slots.clear();
  }

  function noteAlive(slotId) {
    const s = slots.get(slotId);
    if (s) s.alive = Date.now();
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function probeAndElect() {
    if (!peerInstance.current || peerInstance.current.destroyed) return;
    const gid = getMyGid && getMyGid();
    if (!gid) {
      for (const slotId of [...slots.keys()]) releaseSlot(slotId);
      return;
    }

    const members = (getGroupMembers && getGroupMembers()) || [];
    const sortedAll = [...new Set([...members, myPeerId])].filter(Boolean).sort();
    const myRank = sortedAll.indexOf(myPeerId);

    // Libera slots que não me pertencem mais
    for (const slotId of [...slots.keys()]) {
      const m = slotId.match(/^K10-(.+)-(\d)$/);
      if (!m) { releaseSlot(slotId); continue; }
      const slotGid = m[1];
      const slotNum = parseInt(m[2]);
      if (slotGid !== gid || myRank !== (slotNum - 1)) releaseSlot(slotId);
    }

    // Tenta ocupar slots 1 e 2
    for (let slotNum = 1; slotNum <= 2; slotNum++) {
      const slotId = `K10-${gid}-${slotNum}`;
      const expectedHolder = sortedAll[slotNum - 1];
      if (myPeerId !== expectedHolder) continue;
      if (slots.has(slotId) && slots.get(slotId).isActive) continue;
      const alive = await probeId(slotId);
      if (alive) continue;
      await sleep(slotNum * ELECT_JITTER_MS + Math.random() * 400);
      if (!getMyGid || getMyGid() !== gid) return;
      const stillDead = !(await probeId(slotId));
      if (stillDead) await tryClaimSlot(slotId);
    }
  }

  function probeId(targetId) {
    return new Promise(resolve => {
      const p = peerInstance.current;
      if (!p || p.destroyed) return resolve(false);
      let test, resolved = false;
      try { test = p.connect(targetId, { reliable: true }); } catch(e) { return resolve(false); }
      if (!test) return resolve(false);
      const t = setTimeout(() => {
        if (!resolved) { resolved = true; try{test.close();}catch(e){} resolve(false); }
      }, 4500);
      test.on('open',  () => { if (!resolved) { resolved = true; clearTimeout(t); try{test.close();}catch(e){} resolve(true); } });
      test.on('error', () => { if (!resolved) { resolved = true; clearTimeout(t); resolve(false); } });
    });
  }

  function tryClaimSlot(slotId) {
    return new Promise(resolve => {
      const slot = { peer: null, conns: new Map(), isActive: false, alive: Date.now(), hbTimer: null };
      slots.set(slotId, slot);
      let resolved = false;
      try {
        const ice = (stunPoolFn && stunPoolFn()) || [];
        slot.peer = new Peer(slotId, {
          host: '0.peerjs.com', port: 443, secure: true, debug: 0,
          config: { iceServers: ice }
        });
        const failTimer = setTimeout(() => {
          if (resolved) return;
          resolved = true;
          releaseSlot(slotId);
          resolve(false);
        }, 12_000);
        slot.peer.on('open', () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(failTimer);
          slot.isActive = true;
          slot.peer.on('connection', conn => onClientConn(slotId, conn));
          // 🔥 HEARTBEAT PARA O MONITOR
          const monitorId = 'K10-MON';
          const sendHeartbeat = () => {
            if (!slot.isActive || !slot.peer || slot.peer.destroyed) return;
            const gid = slotId.match(/^K10-(\w{4})-\d$/)?.[1];
            if (!gid) return;
            let groupSize = 1;
            try {
              if (typeof directoryGlobalRef !== 'undefined' && directoryGlobalRef.current && directoryGlobalRef.current[gid]) {
                groupSize = directoryGlobalRef.current[gid].groupSize || 1;
              } else if (typeof getGroupSize === 'function') {
                groupSize = getGroupSize(gid) || 1;
              }
            } catch(e) { groupSize = 1; }
            const payload = { t: 's', id: slotId, total: groupSize, groups: { [gid]: groupSize } };
            try {
              const monConn = slot.peer.connect(monitorId, { reliable: true });
              monConn.on('open', () => {
                try { monConn.send(payload); } catch(e) {}
                setTimeout(() => { try { monConn.close(); } catch(e) {} }, 1000);
              });
              monConn.on('error', () => {});
            } catch(e) {}
          };
          slot.hbTimer = setInterval(sendHeartbeat, 30000);
          sendHeartbeat(); // envia imediatamente
          resolve(true);
        });
        slot.peer.on('error', err => {
          if (err && (err.type === 'unavailable-id' || err.type === 'invalid-id')) {
            if (resolved) return;
            resolved = true;
            clearTimeout(failTimer);
            releaseSlot(slotId);
            resolve(false);
          } else {
            releaseSlot(slotId);
          }
        });
        slot.peer.on('close', () => releaseSlot(slotId));
      } catch(e) {
        releaseSlot(slotId);
        resolve(false);
      }
    });
  }

  function releaseSlot(slotId) {
    const s = slots.get(slotId);
    if (!s) return;
    if (s.hbTimer) clearInterval(s.hbTimer);
    try { if (s.peer && !s.peer.destroyed) s.peer.destroy(); } catch(e) {}
    slots.delete(slotId);
  }

  function onClientConn(slotId, conn) {
    const s = slots.get(slotId);
    if (!s) return;
    s.conns.set(conn.peer, conn);
    conn.on('data',  data => onClientData(slotId, conn, data));
    conn.on('close', () => { const ss = slots.get(slotId); if (ss) ss.conns.delete(conn.peer); });
    conn.on('error', () => { const ss = slots.get(slotId); if (ss) ss.conns.delete(conn.peer); });
  }

  function onClientData(slotId, conn, data) {
    if (!data || !data.type) return;
    const s = slots.get(slotId);
    if (!s) return;
    if (data.type === 'handshake') {
      try { conn.send({ type: 'handshake', peerId: slotId }); } catch(e) {}
      return;
    }
    // Relay de mensagens (broadcast P2P)
    if (data.type === 'message' || data.type === 'youtube-chat-start' || data.type === 'youtube-chat-stop' || data.type === 'radio-start' || data.type === 'radio-chunk') {
      const rawTtl = (typeof data.ttl === 'number') ? data.ttl : 8;
      const ttl = Math.min(Math.max(0, rawTtl), 15);
      if (ttl <= 0) return;
      const relay = Object.assign({}, data, { ttl: ttl - 1 });
      if (data.direct && data.recipient) {
        const target = s.conns.get(data.recipient);
        if (target && target.open && data.recipient !== conn.peer) {
          try { target.send(relay); } catch(e) {}
        }
        return;
      }
      s.conns.forEach((c, pid) => {
        if (pid !== conn.peer && c.open) {
          try { c.send(relay); } catch(e) {}
        }
      });
    }
  }

  return {
    start, stop, noteAlive, probeAndElect,
    get activeSlots() { return [...slots.keys()].filter(k => slots.get(k).isActive); }
  };
})();

<button onClick={() => setIsSuperNode(!isSuperNode)} style={{ backgroundColor: isSuperNode ? '#fef3c7' : 'white', color: isSuperNode ? '#b45309' : '#64748b', border: `1px solid ${isSuperNode ? '#f59e0b' : 'var(--border)'}`, padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '700' }}>
<i className="fas fa-bolt" style={{ color: isSuperNode ? '#d97706' : '#94a3b8' }}></i> {isSuperNode ? t(lang, 'superNodeOn') : t(lang, 'superNodeOff')}
</button>
</div>
<div style={{ display: 'flex', gap: '8px' }}>
<button onClick={() => { navigator.clipboard.writeText(peerId); alert(t(lang, 'copied')); }}>{t(lang, 'copy')}</button>

</div>
</div>


{showYoutubeGrid && (
<div style={{ position: 'fixed', inset: 0, backgroundColor: 'rgba(0,0,0,0.85)', zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
<div style={{ backgroundColor: '#1e1e1e', borderRadius: '12px', width: '100%', maxWidth: '500px', padding: '24px', boxShadow: '0 20px 50px rgba(0,0,0,0.8)', color: 'white', fontFamily: 'sans-serif' }}>
<div style={{ marginBottom: '16px' }}>
<div style={{ fontSize: '14px', color: '#ccc', marginBottom: '8px' }}>andradepsa.github.io diz</div>
<div style={{ fontSize: '16px', fontWeight: '500', marginBottom: '12px' }}>{t(lang, 'enterYoutubeUrl')}</div>
<input
type="text"
value={gridInput}
onChange={e => setGridInput(e.target.value)}
style={{ width: '100%', padding: '12px', borderRadius: '8px', border: '1px solid #444', backgroundColor: '#2d2d2d', color: 'white', outline: 'none', fontSize: '14px' }}
onKeyDown={e => { if (e.key === 'Enter') startYoutubeBroadcast(gridInput); }}
autoFocus
/>
</div>


<div style={{ display: 'grid', gridTemplateColumns: 'repeat(10, 1fr)', gap: '4px', marginBottom: '24px', maxHeight: '300px', overflowY: 'auto', padding: '4px' }}>
{Array.from({ length: Object.keys(YOUTUBE_LINKS_LIST).length }, (_, i) => i + 1).map(num => (
<button
key={num}
onClick={() => {
const savedUrl = youtubeLinks[num];
if (savedUrl) {
startYoutubeBroadcast(savedUrl);
} else {
const url = prompt(`${t(lang, 'enterUrlFor')} ${num}:`);
if (url) {
const newLinks = { ...youtubeLinks, [num]: url };
setYoutubeLinks(newLinks);
startYoutubeBroadcast(url);
}
}
}}
onContextMenu={(e) => {
e.preventDefault();
const url = prompt(`${t(lang, 'editUrlFor')} ${num}:`, youtubeLinks[num] || '');
if (url !== null) {
const newLinks = { ...youtubeLinks, [num]: url };
setYoutubeLinks(newLinks);
}
}}
style={{
padding: '6px 0',
borderRadius: '4px',
border: 'none',
backgroundColor: 'transparent',
color: youtubeLinks[num] ? '#38bdf8' : '#fff',
fontSize: '13px',
cursor: 'pointer',
textAlign: 'center'
}}
>
{num}
</button>
))}
</div>


<div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px' }}>
<button
onClick={() => startYoutubeBroadcast(gridInput)}
style={{ padding: '10px 30px', borderRadius: '25px', border: 'none', backgroundColor: '#93c5fd', color: '#1e3a8a', fontWeight: 'bold', cursor: 'pointer' }}
>
OK
</button>
<button
onClick={() => setShowYoutubeGrid(false)}
style={{ padding: '10px 30px', borderRadius: '25px', border: 'none', backgroundColor: '#0c4a6e', color: '#bae6fd', fontWeight: 'bold', cursor: 'pointer' }}
>
{t(lang, 'cancel') || 'Cancelar'}
</button>
</div>
</div>
</div>
)}


{/* Local Video Windows */}
{isLocalVideoVisible && (
<FloatingWindow
title={t(lang, 'you') + ' (Cam)'}
initialPosition={{ x: 20, y: 20 }}
onClose={() => setIsLocalVideoVisible(false)}
onNextCamera={() => {
const allPeers = [...new Set([peerId, ...remoteStreams.map(s => s.peerId), ...Object.keys(userYoutubeStreams), ...Object.keys(userRadios)])];
if (allPeers.length <= 1) return;
const currIdx = allPeers.indexOf(peerId);
const nextPeer = allPeers[(currIdx + 1) % allPeers.length];
setWindowTargets(prev => ({ ...prev, [peerId]: nextPeer }));
}}
>
<StreamRenderer targetId={windowTargets[peerId] || peerId} peerId={peerId} streamType="video" localVideoRef={localVideoRef} videoRefs={videoRefs}/>
</FloatingWindow>
)}

{/* Local Radio Window */}
{userRadios[peerId] && (
<FloatingWindow
title={t(lang, 'worldRadios')}
initialPosition={{ x: 30, y: 30 }}
onClose={handleStopWorldRadio}
>
<StreamRenderer targetId={peerId} peerId={peerId} streamType="radio" userRadios={userRadios} localVideoRef={localVideoRef} videoRefs={videoRefs} />
</FloatingWindow>
)}

{/* Local YouTube Window */}
{userYoutubeStreams[peerId] && (
<FloatingWindow
title={t(lang, 'you') + ' (YT)'}
initialPosition={{ x: 40, y: 40 }}
onClose={handleYoutubeRadio}
>
<StreamRenderer targetId={peerId} peerId={peerId} streamType="yt" userYoutubeStreams={userYoutubeStreams} localVideoRef={localVideoRef} videoRefs={videoRefs} />
</FloatingWindow>
)}


{/* Remote Streams / YouTube Gallery / World Radios */}
{(() => {
  const videoPeers = remoteStreams.map(s => s.peerId).filter(id => id !== peerId);
  const ytPeers = Object.keys(userYoutubeStreams).filter(id => id !== peerId);
  const wrPeers = Object.keys(userRadios).filter(id => id !== peerId);

  return (
    <>
      {videoPeers.map((pId) => (
        <FloatingWindow key={pId} title={getContactName(windowTargets[pId] || pId)} onClose={() => endCall(pId, 'video')}>
           <StreamRenderer targetId={windowTargets[pId] || pId} peerId={peerId} localVideoRef={localVideoRef} videoRefs={videoRefs}/>
        </FloatingWindow>
      ))}
      {ytPeers.map((pId) => (
        <FloatingWindow key={pId + '_yt'} title={getContactName(pId) + ' (YT)'} onClose={() => setUserYoutubeStreams(prev => { const next = { ...prev }; delete next[pId]; return next; })}>
           <StreamRenderer targetId={pId} peerId={peerId} streamType="yt" userYoutubeStreams={userYoutubeStreams} localVideoRef={localVideoRef} videoRefs={videoRefs}/>
        </FloatingWindow>
      ))}
      {wrPeers.map((pId) => (
        <FloatingWindow key={pId + '_radio'} title={getContactName(pId) + ' (Radio)'} onClose={() => setUserRadios(prev => { const next = { ...prev }; delete next[pId]; return next; })}>
           <StreamRenderer targetId={pId} peerId={peerId} streamType="radio" userRadios={userRadios} localVideoRef={localVideoRef} videoRefs={videoRefs}/>
        </FloatingWindow>
      ))}
    </>
  );
})()}


{activeCalls.map((call, idx) => call.type === 'voice' && (
<div key={idx} className="audio-call-container">
<i className="fas fa-phone" style={{ color: '#22c55e' }}></i>
<span style={{ fontSize: '14px', fontWeight: 600 }}>{t(lang, 'voiceCallWith')} {getContactName(call.peerId)}</span>
<button className="call-end-button" onClick={() => endCall(call.peerId, 'voice')}>{t(lang, 'endCall')}</button>
<audio ref={el => audioRefs.current[call.peerId] = el} autoPlay></audio>
<div style={{ marginTop: '4px', display: 'flex', alignItems: 'center', gap: '8px' }}>
<label style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{t(lang, 'volume')}</label>
<input type="range" min="0" max="1" step="0.1" defaultValue="1" onChange={e => { if (audioRefs.current[call.peerId]) audioRefs.current[call.peerId].volume = parseFloat(e.target.value); }} />
</div>
</div>
))}


{showContacts ? (
<ContactsScreen lang={lang} contacts={contacts} setContacts={setContacts} onBack={() => setShowContacts(false)}
onSelectContact={(pId) => {
  if (!activatedContactsRef.current.has(pId)) {
    activatedContactsRef.current.add(pId);
    setActivatedContacts(prev => { const s = new Set(prev); s.add(pId); return s; });
  }
  connectToPeer(pId); setSelectedContact(pId); setShowContacts(false);
}}
onSelectGroup={(name, chId) => {
  setShowContacts(false);
  setPendingGroup({ name, chId });
}}
avatars={avatars} />
) : (
<ChatManager
lang={lang}
connections={connections} messages={messages} setMessages={setMessages}
contacts={contacts} userName={userName} peerId={peerId}
activeCalls={activeCalls} endCall={endCall} startVoiceCall={startVoiceCall}
toggleVideoCall={toggleVideoCall} remoteStreams={remoteStreams}
audioRefs={audioRefs} videoRefs={videoRefs} handleFileChange={handleFileChange}
fileInputRef={fileInputRef} handleAudioRecording={handleAudioRecording}
newMessage={newMessage} setNewMessage={setNewMessage}
showEmojiPanel={showEmojiPanel} setShowEmojiPanel={setShowEmojiPanel}
populateEmojiPanel={populateEmojiPanel} getContactName={getContactName}
selectedContact={selectedContact} setSelectedContact={setSelectedContact}
localVideoRef={localVideoRef} registerSentMessage={(id) => seenMessagesRef.current.add(id)}
cooldownRemaining={cooldownRemaining} setCooldownRemaining={setCooldownRemaining}
networkSize={networkSize} centralServerId={centralServerId}
e2eeState={e2eeState} setE2eeState={setE2eeState}
isCentralServer={isCentralServer}
isMyGroupServer={isMyGroupServer}
serverE2EE={serverE2EE} setServerE2EE={setServerE2EE} connectToPeer={connectToPeer}
handleTorrentSeed={handleTorrentSeed} handleTorrentDownload={handleTorrentDownload}
setShowTorrentManager={setShowTorrentManager}
pendingTorrentRequests={pendingTorrentRequests}
setPendingTorrentRequests={setPendingTorrentRequests}
handleTorrentDirectSeed={handleTorrentDirectSeed}
youtubeChatId={youtubeChatId}
broadcastYoutubeChat={broadcastYoutubeChat}
stopYoutubeChat={stopYoutubeChat}
disconnectPeer={disconnectPeer}
showWhiteboard={showWhiteboard}
setShowWhiteboard={setShowWhiteboard}
avatars={avatars}
currentQuizQuestionRef={currentQuizQuestionRef}
connectionsRef={connectionsRef}
directPeersRef={directPeersRef}
directPeers={directPeers}
activatedContactsRef={activatedContactsRef}
activatedContacts={activatedContacts}
isSuperNode={isSuperNode}
pendingGroup={pendingGroup}
setPendingGroup={setPendingGroup}
quizBotActive={quizBotActive}
onOpenQuizBot={() => setShowQuizBot(true)}
/>
)}

{showWhiteboard && (
  <Whiteboard 
    lang={lang} 
    connectionsRef={connectionsRef}
    selectedContact={selectedContact} 
    onClose={() => setShowWhiteboard(false)} 
  />
)}
{showAuditPanel && <AuditPanel lang={lang} logs={auditLogs} onClose={() => setShowAuditPanel(false)} />}
</div>
);
};



ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
<script>
  (async () => {
    try {
      await esbuild.initialize({ wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.20.1/esbuild.wasm' });
      const script = document.getElementById('esbuild-main').textContent;
      const { code } = await esbuild.transform(script, { loader: 'tsx', target: 'esnext' });
      const s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    } catch (e) {
      console.error('Esbuild error:', e);
      document.getElementById('k10-loading').innerHTML = '<p style="color:red;text-align:center;margin-top:20px">Erro ao carregar o chat. Por favor, recarregue a página.</p>';
    }
  })();
</script>

<!-- K10 MONITOR PRO is now a standalone file. The previous embedded template was removed because nested closing-script tokens prematurely terminated the parent script and caused monitor JS to leak into the chat document. Use openK10Monitor() to open it. -->

</body>
</html>
