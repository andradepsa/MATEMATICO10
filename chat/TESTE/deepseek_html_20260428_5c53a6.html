<style>

<script id="jsx-src" type="text/plain">
const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════
const K10_MAX_GROUP   = 50;
const K10_MAX_SRV_GRP = 2;
const HB_MS           = 25000;
const GC_MS           = 5000;
const MON_MS          = 30000;
const K10_MON         = 'K10-MON';
const SEEN_CAP        = 2000;
const SEEN_KEEP       = 1000;
const AUDIT_MAX       = 60;
const SRV_QUIZ_MIN    = 120;

// Servidores PeerJS disponíveis (fallback)
const PEER_SERVERS = [
  { host: '0.peerjs.com', port: 443, secure: true },
  { host: 'peerjs-server.herokuapp.com', port: 443, secure: true }
];

function genId() {
  const C = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const b = new Uint8Array(6); crypto.getRandomValues(b);
  return Array.from(b, x => C[x % C.length]).join('');
}
function clampTtl(v) { return Math.min(15, Math.max(0, parseInt(v) || 0)); }
function sanName(n) { return typeof n === 'string' ? n.replace(/[<>]/g, '').slice(0, 60) : ''; }
function ftime() { return new Date().toLocaleTimeString(); }
function getStunPool() {
  const pool = [
    'stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302',
    'stun:stun2.l.google.com:19302','stun:stun3.l.google.com:19302',
    'stun:stun4.l.google.com:19302','stun:stun.stunprotocol.org:3478',
    'stun:stun.ekiga.net','stun:stun.voipbuster.com',
    'stun:stun.sipgate.net','stun:stun.linphone.org',
    'stun:stun.gmx.de','stun:stun.sip.us'
  ];
  const b = new Uint32Array(pool.length); crypto.getRandomValues(b);
  for (let i = pool.length-1; i > 0; i--) { const j = b[i] % (i+1); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  return pool.slice(0,5).map(u => ({ urls: u }));
}

// Quiz data (mantido igual ao original)
const PLACES = [
  {q:'Eiffel Tower Paris',country:'France',state:'Île-de-France',sp:['Île-de-France','Normandy','Provence','Brittany']},
  {q:'Colosseum Rome',country:'Italy',state:'Lazio',sp:['Lazio','Lombardy','Tuscany','Sicily']},
  {q:'Machu Picchu Peru',country:'Peru',state:'Cusco',sp:['Cusco','Lima','Arequipa','Puno']},
  {q:'Great Wall China',country:'China',state:'Hebei',sp:['Hebei','Beijing','Shanxi','Liaoning']},
  {q:'Taj Mahal India',country:'India',state:'Uttar Pradesh',sp:['Uttar Pradesh','Delhi','Rajasthan','Kerala']},
  {q:'Stonehenge England',country:'United Kingdom',state:'Wiltshire',sp:['Wiltshire','London','Yorkshire','Cornwall']},
  {q:'Petra Jordan',country:'Jordan',state:"Ma'an",sp:["Ma'an",'Amman','Aqaba','Zarqa']},
  {q:'Acropolis Athens',country:'Greece',state:'Attica',sp:['Attica','Crete','Thessaloniki','Peloponnese']},
  {q:'Angkor Wat Cambodia',country:'Cambodia',state:'Siem Reap',sp:['Siem Reap','Phnom Penh','Battambang','Kampong Cham']},
  {q:'Chichen Itza Mexico',country:'Mexico',state:'Yucatán',sp:['Yucatán','Quintana Roo','Mexico City','Oaxaca']},
  {q:'Sydney Opera House',country:'Australia',state:'New South Wales',sp:['New South Wales','Victoria','Queensland','Western Australia']},
  {q:'Niagara Falls USA',country:'United States',state:'New York',sp:['New York','Ontario','Buffalo','Rochester']},
  {q:'Christ the Redeemer Rio',country:'Brazil',state:'Rio de Janeiro',sp:['Rio de Janeiro','São Paulo','Bahia','Minas Gerais']},
  {q:'Burj Khalifa Dubai',country:'UAE',state:'Dubai',sp:['Dubai','Abu Dhabi','Sharjah','Ajman']},
  {q:'Santorini Greece',country:'Greece',state:'South Aegean',sp:['South Aegean','Attica','Crete','Ionian Islands']},
];
const ALL_COUNTRIES = ['France','Italy','Peru','China','India','United Kingdom','Jordan','Greece',
  'Cambodia','Mexico','Australia','United States','Brazil','UAE','Japan','Germany','Spain','Egypt'];
function buildAlts(pool, correct) {
  const opts = [correct];
  const f = pool.filter(x => x !== correct);
  const b = new Uint32Array(f.length); crypto.getRandomValues(b);
  for (let i = f.length-1; i > 0; i--) { const j = b[i]%(i+1); [f[i],f[j]]=[f[j],f[i]]; }
  while (opts.length < 4 && f.length) opts.push(f.shift());
  const b2 = new Uint32Array(opts.length); crypto.getRandomValues(b2);
  for (let i = opts.length-1; i > 0; i--) { const j = b2[i]%(i+1); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return [opts, opts.indexOf(correct)];
}
const _imgCache = {};
async function fetchImg(q, usedIds) {
  if (!_imgCache[q] || !_imgCache[q].length) {
    try {
      const r = await fetch(`https://pixabay.com/api/?key=49017285-a1d0c85f9b08a8c0dcd80c6c8&q=${encodeURIComponent(q)}&image_type=photo&per_page=20&safesearch=true`);
      const d = await r.json(); _imgCache[q] = (d.hits||[]).filter(h => h.largeImageURL||h.webformatURL);
    } catch(e) { _imgCache[q] = []; }
  }
  const hits = _imgCache[q]; const un = hits.filter(h => !usedIds.has(h.id));
  const pool = un.length ? un : hits;
  return pool[Math.floor(Math.random()*pool.length)] || null;
}
const QUIZ_SUBS = [
  {id:'mat',name:'Mathematics',emoji:'📐',url:'https://andradepsa.github.io/MATEMATICO10/quiz/mat.json'},
  {id:'sci',name:'Science',emoji:'🔬',url:'https://andradepsa.github.io/MATEMATICO10/quiz/sci.json'},
  {id:'geo',name:'Geography',emoji:'🌍',url:'https://andradepsa.github.io/MATEMATICO10/quiz/geo.json'},
  {id:'his',name:'History',emoji:'📜',url:'https://andradepsa.github.io/MATEMATICO10/quiz/his.json'},
];
const _qCache = {};
async function fetchQuestions(id) {
  if (_qCache[id]) return _qCache[id];
  const s = QUIZ_SUBS.find(x => x.id === id);
  if (!s) return [];
  try { const r = await fetch(s.url); _qCache[id] = await r.json(); return _qCache[id]; } catch(e) { return []; }
}

// Toast component
const Toasts = ({ list }) => (
  <div className="tc">
    {list.map(t => (
      <div key={t.id} className="toast" style={{borderLeft:`3px solid ${t.ty==='e'?'var(--danger)':t.ty==='s'?'var(--success)':'var(--info)'}`}}>
        {t.msg}
      </div>
    ))}
  </div>
);

// ═══════════════════════════════════════
// SERVER ENGINE (corrigido – fallback e novo ID em caso de conflito)
// ═══════════════════════════════════════
function useServerEngine({ serverId, onAudit, onStats, onGroups, onStatus, peerServerIndex, setPeerServerIndex }) {
  const peerRef       = useRef(null);
  const conns         = useRef(new Map());
  const groups        = useRef(new Map());
  const peerGrp       = useRef(new Map());
  const seen          = useRef(new Set());
  const routerRef     = useRef(false);
  const pureRef       = useRef(false);
  const radioRef      = useRef({type:null,id:null,url:null,name:null});
  const quizActiveRef = useRef(false);
  const quizDiscRef   = useRef('mat');
  const quizIntRef    = useRef(SRV_QUIZ_MIN);
  const quizOwnerRef  = useRef(null);
  const quizTimer     = useRef(null);
  const quizLastRef   = useRef(0);
  const worldQueue    = useRef([]);
  const worldUsed     = useRef(new Set());
  const worldImgRef   = useRef(null);
  const worldPlaceRef = useRef(null);
  const qIdxRef       = useRef(0);
  const reconn        = useRef(0);
  const reconTimer    = useRef(null);
  const manualDisc    = useRef(false);
  const hbTimer       = useRef(null);
  const gcTimer       = useRef(null);
  const monTimer      = useRef(null);
  const msgCount      = useRef({rx:0,tx:0});
  const serverIdRef   = useRef(serverId);
  useEffect(() => { serverIdRef.current = serverId; }, [serverId]);

  const audit = (msg, ty='info') => onAudit({ id: Date.now()+Math.random().toString(36).slice(2), time:ftime(), msg, ty });
  const upStats = () => {
    let total=0;
    const gs=[];
    groups.current.forEach((g,gid) => { total+=g.peers.length; gs.push({gid,pc:g.peers.length,sc:g.servers.length,open:g.open}); });
    onStats({ rx:msgCount.current.rx, tx:msgCount.current.tx, conns:conns.current.size, hydra:total });
    onGroups(gs);
  };

  const sendTo = (pid, data) => {
    const c = conns.current.get(pid);
    if (c && c.open) { try { c.send(data); msgCount.current.tx++; return true; } catch(e){} }
    return false;
  };
  const bcastGroup = (gid, data, except) => {
    const g = groups.current.get(gid);
    if (!g) return;
    [...g.peers, ...g.servers].forEach(pid => { if (pid!==except) sendTo(pid, data); });
  };
  const bcastAll = (data, except) => {
    conns.current.forEach((c, pid) => {
      if (pid!==except && c.open) { try { c.send(data); msgCount.current.tx++; } catch(e){} }
    });
  };
  const pruneSeen = () => {
    if (seen.current.size > SEEN_CAP) {
      const keep = [...seen.current].slice(-SEEN_KEEP);
      seen.current = new Set(keep);
    }
  };

  // ── group management ─────────────────────────────────────────────────
  const getBestGroup = () => {
    let best=null, bestSz=-1;
    groups.current.forEach((g,gid) => { if (g.open && g.peers.length > bestSz) { best=gid; bestSz=g.peers.length; } });
    if (best) return best;
    const gid = 'G' + Date.now().toString(36).toUpperCase().slice(-6);
    groups.current.set(gid, {peers:[],servers:[],open:true});
    audit(`[Hydra] New group created: ${gid}`, 'sys');
    return gid;
  };
  const addPeer = (pid, gid) => {
    const g = groups.current.get(gid); if (!g) return;
    if (!g.peers.includes(pid)) g.peers.push(pid);
    peerGrp.current.set(pid, gid);
    if (g.peers.length >= K10_MAX_GROUP && g.open) {
      g.open = false;
      bcastGroup(gid, {type:'group-full', gid}, null);
      audit(`[Hydra] Group ${gid} full`, 'warn');
    }
    upStats();
  };
  const addSrv = (pid) => {
    let tgt=null; let minS=Infinity;
    groups.current.forEach((g,gid) => { if (g.servers.length < minS) { minS=g.servers.length; tgt=gid; } });
    if (!tgt) tgt = getBestGroup();
    const g = groups.current.get(tgt); if (!g) return;
    if (!g.servers.includes(pid) && g.servers.length < K10_MAX_SRV_GRP) {
      g.servers.push(pid); peerGrp.current.set(pid, tgt);
      audit(`[Hydra] Server ${pid.slice(-12)} → group ${tgt}`, 'sys');
    }
    upStats();
    return tgt;
  };
  const removePeer = (pid) => {
    const gid = peerGrp.current.get(pid); if (!gid) return;
    const g = groups.current.get(gid); if (!g) return;
    const idx = g.peers.indexOf(pid);
    if (idx >= 0) { g.peers[idx] = g.peers[g.peers.length-1]; g.peers.pop(); }
    peerGrp.current.delete(pid);
    if (!g.open && g.peers.length < K10_MAX_GROUP) {
      g.open = true;
      bcastGroup(gid, {type:'group-reopened', gid}, null);
    }
    [...g.peers, ...g.servers].forEach(p => sendTo(p, {type:'pex-update', gid, user:pid}));
    if (g.peers.length===0 && g.servers.length===0) groups.current.delete(gid);
    upStats();
  };
  const removeSrv = (pid) => {
    const gid = peerGrp.current.get(pid); if (!gid) return;
    const g = groups.current.get(gid);
    if (g) { const i=g.servers.indexOf(pid); if (i>=0) g.servers.splice(i,1); }
    peerGrp.current.delete(pid);
    if (g && g.peers.length===0 && g.servers.length===0) groups.current.delete(gid);
    upStats();
  };

  // ── assign / peer-list ───────────────────────────────────────────────
  const assignPeer = (conn) => {
    const pid = conn.peer;
    const isSrv = pid.endsWith('-CENTRAL');
    if (isSrv) {
      const gid = addSrv(pid);
      const g = gid ? groups.current.get(gid) : null;
      sendTo(pid, {type:'peer-list', gid:gid||'', user:pid.slice(-4), count:g?g.peers.length:0,
        peers:g?g.peers.slice(0,20):[], groupServers:g?[...g.servers]:[], routerMode:routerRef.current});
      return;
    }
    if (peerGrp.current.has(pid)) { resendList(conn); return; }
    const gid = getBestGroup();
    addPeer(pid, gid);
    const g = groups.current.get(gid);
    const peerList = {
      type:'peer-list', gid,
      user: String(g ? g.peers.indexOf(pid) : 0),
      count: g ? g.peers.length : 1,
      peers: g ? g.peers.filter(p=>p!==pid).slice(0,20) : [],
      groupServers: g ? [...g.servers] : [],
      routerMode: routerRef.current
    };
    sendTo(pid, peerList);
    audit(`[Hydra] ${pid.slice(-10)} → ${gid} (${g?g.peers.length:1}/${K10_MAX_GROUP})`, 'success');
    if (pureRef.current) sendTo(pid, {type:'server-info', serverId:serverIdRef.current});
    if (radioRef.current.type) sendTo(pid, {type:'radio-sync', radioType:radioRef.current.type, radioId:radioRef.current.id, radioUrl:radioRef.current.url, radioName:radioRef.current.name});
    if (routerRef.current) setTimeout(() => { try{conns.current.get(pid)?.close();}catch(e){} }, 3000);
  };
  const resendList = (conn) => {
    const pid=conn.peer, gid=peerGrp.current.get(pid);
    if (!gid) { assignPeer(conn); return; }
    const g = groups.current.get(gid); if (!g) return;
    sendTo(pid, {type:'peer-list', gid, user:String(g.peers.indexOf(pid)), count:g.peers.length,
      peers:g.peers.filter(p=>p!==pid).slice(0,20), groupServers:[...g.servers], routerMode:routerRef.current});
  };

  // ── message distribution ─────────────────────────────────────────────
  const distribute = (data, from) => {
    const id = data.id; if (!id) return;
    if (seen.current.has(id)) return;
    seen.current.add(id); pruneSeen();
    msgCount.current.rx++;
    const ttl = clampTtl(data.ttl);
    if (ttl <= 0) return;
    const relay = {...data, ttl: ttl-1};
    if (data.direct && data.recipient) { sendTo(data.recipient, relay); return; }
    const gid = peerGrp.current.get(from);
    if (gid) bcastGroup(gid, relay, from);
    else bcastAll(relay, from);
  };

  const handleData = (data, from) => {
    if (!data || typeof data!=='object') return;
    if (typeof data.senderName==='string') data.senderName = sanName(data.senderName);
    const t = data.type;
    if (t==='file-start' || t==='file-chunk') return;
    if (t==='audio-message' && data.data && data.data.length*0.75 > 2*1024*1024) return;
    if (t==='group0-request') {
      const c = conns.current.get(from);
      if (!c) return;
      if (peerGrp.current.has(from)) resendList(c);
      else assignPeer(c);
      return;
    }
    if (t && (t.startsWith('radio-') || t.startsWith('youtube-chat-') || t.startsWith('audio-'))) {
      if (t==='radio-youtube-start' && data.youtubeId) radioRef.current={type:'youtube',id:data.youtubeId,url:null,name:null};
      else if (t==='radio-world-start') radioRef.current={type:'world',id:null,url:data.url,name:data.name};
      else if (t==='radio-stop') radioRef.current={type:null,id:null,url:null,name:null};
      if (data.id) { if (seen.current.has(data.id)) return; seen.current.add(data.id); pruneSeen(); }
      bcastAll(data, from); return;
    }
    if (t==='radio-request-sync') {
      if (radioRef.current.type) sendTo(from, {type:'radio-sync', radioType:radioRef.current.type, radioId:radioRef.current.id, radioUrl:radioRef.current.url, radioName:radioRef.current.name});
      return;
    }
    if (t==='quiz-bot-start') { stopQuiz(); quizOwnerRef.current = from; bcastAll({type:'quiz-bot-status',active:true, owner:from}, null); audit(`[Quiz] External bot: ${from.slice(-8)}`, 'info'); return; }
    if (t==='quiz-bot-stop') { if (quizOwnerRef.current===from) { quizOwnerRef.current=null; bcastAll({type:'quiz-bot-status',active:false,owner:null},null); } return; }
    if (t==='quiz-handoff') { quizOwnerRef.current=null; if (data.quizDiscipline) quizDiscRef.current=data.quizDiscipline; if (data.quizInterval) quizIntRef.current=Math.max(SRV_QUIZ_MIN, data.quizInterval); if (Array.isArray(data.usedImageIds)) data.usedImageIds.forEach(id=>worldUsed.current.add(id)); if (data.bufferedHits) Object.assign(_imgCache, data.bufferedHits); if (data.lastQuizTime) quizLastRef.current=data.lastQuizTime; quizActiveRef.current=true; scheduleQuiz(); audit(`[Quiz] Handoff from ${from.slice(-8)}, server taking over`, 'success'); return; }
    if (t==='e2ee-secret' && data.recipient) { sendTo(data.recipient, data); return; }
    if (t==='pex' || t==='pex-update' || t==='directory-announce') {
      if (data.id) { if (seen.current.has(data.id)) return; seen.current.add(data.id); pruneSeen(); }
      const gid=peerGrp.current.get(from);
      if (gid) bcastGroup(gid,data,from); return;
    }
    if (t==='message' || t==='poll-create' || t==='poll-vote') { distribute(data, from); return; }
    if (t && (t.startsWith('quiz-') || t==='whiteboard-draw' || t==='whiteboard-clear' || t==='markdown-sync' || t==='avatar-update')) {
      if (data.id) { if (seen.current.has(data.id)) return; seen.current.add(data.id); pruneSeen(); }
      bcastAll(data, from); return;
    }
  };

  // ── quiz (server-side) ────────────────────────────────────────────────
  const stopQuiz = () => { if (quizTimer.current) { clearTimeout(quizTimer.current); quizTimer.current=null; } quizActiveRef.current=false; };
  const bcastQuiz = (text, quizPayload) => {
    const id='sq-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    const m={type:'message',id,ttl:15,text,senderName:'🤖 Quiz Bot',sender:'server-self',direct:false,time:ftime(),timestamp:Date.now(),quizPayload};
    seen.current.add(id); bcastAll(m,null);
  };
  const bcastReveal = (quizId,votes={}) => {
    const id='sr-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    const m={type:'message',id,ttl:15,text:'__QUIZ_REVEAL__',senderName:'🤖 Quiz Bot',sender:'server-self',direct:false,time:ftime(),timestamp:Date.now(),quizRevealPayload:{quizId,votes}};
    seen.current.add(id); bcastAll(m,null);
  };
  const scheduleQuiz = () => {
    if (quizTimer.current) clearTimeout(quizTimer.current);
    const elapsed = Date.now()-quizLastRef.current;
    const intMs = quizIntRef.current*1000;
    const delay = Math.max(500, intMs-elapsed);
    quizTimer.current = setTimeout(runQuiz, delay);
  };
  const nextPlace = () => {
    if (!worldQueue.current.length) {
      const idx=PLACES.map((_,i)=>i);
      const b=new Uint32Array(idx.length); crypto.getRandomValues(b);
      for(let i=idx.length-1;i>0;i--){const j=b[i]%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]];}
      worldQueue.current=idx;
    }
    return PLACES[worldQueue.current.shift()];
  };
  const runQuiz = async () => {
    if (!quizActiveRef.current) return;
    quizLastRef.current = Date.now();
    const disc = quizDiscRef.current;
    if (disc==='world') { await runWorldQuiz(); return; }
    const qs = await fetchQuestions(disc==='all'?QUIZ_SUBS[Math.floor(Math.random()*QUIZ_SUBS.length)].id:disc);
    if (!qs.length) { scheduleQuiz(); return; }
    const q = qs[qIdxRef.current % qs.length]; qIdxRef.current++;
    const qid='sq-d-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    bcastQuiz('__QUIZ__',{quizId:qid,quizQuestion:q.question,quizOptions:q.options,quizCorrect:q.correct,quizSubject:QUIZ_SUBS.find(s=>s.id===disc)?.name||disc,nonce:Math.random().toString(36).slice(2,10)});
    quizTimer.current = setTimeout(()=>{
      if(!quizActiveRef.current) return;
      bcastReveal(qid);
      quizTimer.current = setTimeout(()=>{ if(quizActiveRef.current) runQuiz(); }, quizIntRef.current*1000);
    }, quizIntRef.current*1000);
  };
  const runWorldQuiz = async () => {
    if (!quizActiveRef.current) return;
    const place = nextPlace(); worldPlaceRef.current=place;
    const hit = await fetchImg(place.q, worldUsed.current);
    const imgUrl = hit?(hit.largeImageURL||hit.webformatURL):null;
    const imgId = hit?hit.id:null;
    worldImgRef.current=imgUrl;
    if(imgId) worldUsed.current.add(imgId);
    const [opts1,c1]=buildAlts(ALL_COUNTRIES,place.country);
    const qid1='sq-w1-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    bcastQuiz('__QUIZ__',{quizId:qid1,quizQuestion:'🌍 In which COUNTRY is this famous place?',quizOptions:opts1,quizCorrect:c1,quizSubject:'📸 World Places',quizStage:1,quizImage:imgUrl||undefined,quizImageId:imgId||undefined,nonce:Math.random().toString(36).slice(2,10)});
    quizTimer.current = setTimeout(()=>{
      if(!quizActiveRef.current) return;
      bcastReveal(qid1);
      setTimeout(()=>{
        if(!quizActiveRef.current) return;
        const [opts2,c2]=buildAlts(place.sp||ALL_COUNTRIES,place.state);
        const qid2='sq-w2-'+Date.now()+'-'+Math.random().toString(36).slice(2);
        bcastQuiz('__QUIZ__',{quizId:qid2,quizQuestion:'🗺️ In which STATE or CITY is this place?',quizOptions:opts2,quizCorrect:c2,quizSubject:'📸 World Places',quizStage:2,quizImage:worldImgRef.current||undefined,nonce:Math.random().toString(36).slice(2,10)});
        quizTimer.current = setTimeout(()=>{
          if(!quizActiveRef.current) return;
          bcastReveal(qid2);
          setTimeout(()=>{ if(quizActiveRef.current) runQuiz(); },10000);
        },quizIntRef.current*1000);
      },5000);
    },quizIntRef.current*1000);
  };

  // ── PeerJS init com fallback e geração automática de novo ID ──
  const initPeer = () => {
    if (peerRef.current && !peerRef.current.destroyed) { try{peerRef.current.destroy();}catch(e){} }
    const sid = serverIdRef.current;
    const peerServer = PEER_SERVERS[peerServerIndex] || PEER_SERVERS[0];
    audit(`[Peer] Tentando conectar com ID ${sid} via ${peerServer.host}`, 'info');
    onStatus('reconnecting', `Conectando a ${peerServer.host} como ${sid}…`);

    let peer;
    try {
      peer = new Peer(sid, {
        host: peerServer.host,
        port: peerServer.port,
        secure: peerServer.secure,
        config:{
          iceServers:[
            ...getStunPool(),
            {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
            {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
            {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
            {urls:'turn:openrelay.metered.ca:80?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
          ],
          sdpSemantics:'unified-plan', iceTransportPolicy:'all', bundlePolicy:'max-bundle'
        }, debug: 0
      });
    } catch(e) {
      audit(`[Peer] Erro ao criar: ${e.message}`, 'error');
      onStatus('error', 'Falha ao criar peer: ' + e.message);
      return;
    }

    peerRef.current = peer;

    peer.on('open', (id) => {
      reconn.current = 0;
      onStatus('connected', `Online: ${id} (${peerServer.host})`);
      audit(`[Peer] ✅ Conectado: ${id} via ${peerServer.host}`, 'success');

      if (hbTimer.current) clearInterval(hbTimer.current);
      hbTimer.current = setInterval(() => {
        const ping = {type:'heartbeat',ts:Date.now()};
        conns.current.forEach((c, pid) => {
          if (!c.open) { conns.current.delete(pid); removePeer(pid); }
          else { try{c.send(ping);}catch(e){} }
        });
      }, HB_MS);

      if (gcTimer.current) clearInterval(gcTimer.current);
      gcTimer.current = setInterval(() => {
        let pruned=0;
        conns.current.forEach((c, pid) => {
          const pc = c.peerConnection;
          if (pc) {
            const s=pc.connectionState;
            if (s==='failed'||s==='closed'||s==='disconnected') {
              conns.current.delete(pid);
              pid.endsWith('-CENTRAL') ? removeSrv(pid) : removePeer(pid);
              pruned++;
            }
          }
        });
        if (pruned>0) { audit(`[GC] Pruned ${pruned} dead conn(s)`,'warn'); upStats(); }
      }, GC_MS);

      if (monTimer.current) clearInterval(monTimer.current);
      const doReport = () => {
        if (!peerRef.current || peerRef.current.destroyed) return;
        const rpt = {};
        groups.current.forEach((g,gid)=>{rpt[gid]=g.peers.length;});
        try {
          const mc = peerRef.current.connect(K10_MON, {reliable:true});
          mc.on('open',()=>{ try{mc.send({type:'srv-report',serverId:sid,groups:rpt,ts:Date.now()});}catch(e){} setTimeout(()=>{try{mc.close();}catch(e){}},4000); });
          mc.on('error',()=>{});
        } catch(e){}
      };
      doReport();
      monTimer.current = setInterval(doReport, MON_MS);
    });

    peer.on('connection', (conn) => {
      const pid = conn.peer;
      audit(`[Conn] ← ${pid.slice(-10)}`, 'info');
      const doSetup = () => {
        conns.current.set(pid, conn);
        if (!peerGrp.current.has(pid)) assignPeer(conn);
        upStats();
        conn.on('data', (data) => handleData(data, pid));
        conn.on('close', () => {
          conns.current.delete(pid);
          pid.endsWith('-CENTRAL') ? removeSrv(pid) : removePeer(pid);
          audit(`[Conn] ↓ ${pid.slice(-10)} left`, 'warn');
          upStats();
        });
        conn.on('error', (err) => {
          audit(`[Conn] ✗ ${pid.slice(-10)}: ${err?.type||'error'}`, 'error');
        });
      };
      if (conn.open) doSetup();
      else conn.on('open', doSetup);
    });

    peer.on('error', (err) => {
      audit(`[Peer] Erro: ${err?.type||err?.message||'unknown'}`, 'error');
      if (err?.type === 'unavailable-id') {
        // CONFLITO DE ID: gera um novo ID automaticamente
        const newId = genId();
        audit(`[Peer] ID ${serverIdRef.current} já está em uso → gerando novo ID: ${newId}`, 'warn');
        // Atualiza o estado no componente pai via callback
        onAudit({ id: Date.now()+Math.random().toString(36).slice(2), time:ftime(), msg: `ID conflitante, trocando para ${newId}`, ty:'warn' });
        if (window.__setRawId) window.__setRawId(newId);
        // A engine será reiniciada após o estado ser atualizado, mas para evitar loop, paramos reconexão e esperamos o efeito do rawId
        manualDisc.current = false;
        if (reconTimer.current) clearTimeout(reconTimer.current);
        // O componente App vai mudar o rawId e chamar engine.connect novamente
        return;
      }
      if (!manualDisc.current) scheduleReconn();
    });

    peer.on('disconnected', () => {
      onStatus('disconnected', 'Desconectado do servidor de sinalização');
      audit('[Peer] Desconectado do servidor de sinalização', 'warn');
      if (!manualDisc.current) scheduleReconn();
    });
    peer.on('close', () => { onStatus('disconnected', 'Peer fechado'); });
  };

  const scheduleReconn = () => {
    if (reconn.current >= 10) {
      // Após 10 falhas, tenta trocar de servidor PeerJS
      const nextIdx = (peerServerIndex + 1) % PEER_SERVERS.length;
      audit(`[Peer] Mudando servidor de sinalização para ${PEER_SERVERS[nextIdx].host}`, 'warn');
      if (setPeerServerIndex) setPeerServerIndex(nextIdx);
      reconn.current = 0;
    }
    const d = Math.min(30000, 1000 * Math.pow(1.5, reconn.current)) + Math.random()*800;
    reconn.current++;
    onStatus('reconnecting', `Reconectando (${reconn.current}/10) em ${(d/1000).toFixed(1)}s…`);
    audit(`[Peer] Retry ${reconn.current} em ${(d/1000).toFixed(1)}s`, 'warn');
    if (reconTimer.current) clearTimeout(reconTimer.current);
    reconTimer.current = setTimeout(initPeer, d);
  };

  const connectToServer = (sid) => {
    const p = peerRef.current;
    if (!p || p.destroyed) return;
    const full = sid.endsWith('-CENTRAL') ? sid : sid+'-CENTRAL';
    try {
      const conn = p.connect(full, {reliable:true});
      conn.on('open', () => {
        conns.current.set(full, conn);
        try{conn.send({type:'server-announce',serverId:serverIdRef.current});}catch(e){}
        audit(`[SrvConn] ↗ ${full}`, 'success'); upStats();
      });
      conn.on('data', (d) => handleData(d, full));
      conn.on('close', () => { conns.current.delete(full); removeSrv(full); upStats(); });
      conn.on('error', () => {});
    } catch(e){}
  };

  return {
    connect: () => { manualDisc.current=false; reconn.current=0; if(reconTimer.current) clearTimeout(reconTimer.current); initPeer(); },
    disconnect: () => {
      manualDisc.current=true;
      if(reconTimer.current) clearTimeout(reconTimer.current);
      if(hbTimer.current) clearInterval(hbTimer.current);
      if(gcTimer.current) clearInterval(gcTimer.current);
      if(monTimer.current) clearInterval(monTimer.current);
      stopQuiz();
      if(peerRef.current) { try{peerRef.current.destroy();}catch(e){} }
      onStatus('disconnected','Desconectado manualmente');
    },
    connectToServer,
    setRouterMode: (v) => { routerRef.current=v; },
    setPureMode: (v) => { pureRef.current=v; },
    startQuiz: (disc, intSec) => {
      if (quizOwnerRef.current) return;
      quizDiscRef.current=disc; quizIntRef.current=Math.max(SRV_QUIZ_MIN,intSec);
      quizActiveRef.current=true; quizLastRef.current=0;
      scheduleQuiz();
      bcastAll({type:'quiz-bot-status',active:true,owner:'server'},null);
      audit('[Quiz] Server quiz started', 'success');
    },
    stopQuiz: () => {
      stopQuiz();
      bcastAll({type:'quiz-bot-status',active:false,owner:null},null);
      audit('[Quiz] Server quiz stopped', 'warn');
    },
    startYT: (ytId) => {
      radioRef.current={type:'youtube',id:ytId,url:null,name:null};
      bcastAll({type:'youtube-chat-start',youtubeId:ytId,id:'srv-yt-'+Date.now(),ttl:15},null);
    },
    stopYT: () => {
      radioRef.current={type:null,id:null,url:null,name:null};
      bcastAll({type:'youtube-chat-stop',id:'srv-yt-stop-'+Date.now(),ttl:15},null);
    },
    quizOwnerRef,
    quizActiveRef,
  };
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
const App = () => {
  const [rawId, setRawId] = useState(() => localStorage.getItem('k10srv_id') || genId());
  const [editingId, setEditingId] = useState(false);
  const [idInput, setIdInput] = useState('');
  const fullId = rawId + '-CENTRAL';
  const [status, setStatus] = useState({st:'disconnected', msg:'Offline'});
  const [auditLog, setAuditLog] = useState([]);
  const [stats, setStats] = useState({rx:0,tx:0,conns:0,hydra:0});
  const [groups, setGroups] = useState([]);
  const [tab, setTab] = useState('groups');
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem('k10srv_dark')!=='false');
  const [routerMode, setRouterMode] = useState(false);
  const [pureMode, setPureMode] = useState(false);
  const [servers, setServers] = useState(() => { try{return JSON.parse(localStorage.getItem('k10srv_srvs')||'[]');}catch{return[];} });
  const [srvInput, setSrvInput] = useState('');
  const [quizActive, setQuizActive] = useState(false);
  const [quizDisc, setQuizDisc] = useState('mat');
  const [quizInt, setQuizInt] = useState(SRV_QUIZ_MIN);
  const [ytActive, setYtActive] = useState(false);
  const [ytInput, setYtInput] = useState('');
  const [toasts, setToasts] = useState([]);
  const [peerServerIndex, setPeerServerIndex] = useState(() => parseInt(localStorage.getItem('k10srv_peer_idx')||'0'));

  useEffect(() => {
    localStorage.setItem('k10srv_peer_idx', peerServerIndex);
  }, [peerServerIndex]);

  useEffect(() => { document.body.classList.toggle('light', !darkMode); localStorage.setItem('k10srv_dark', darkMode?'true':'false'); }, [darkMode]);

  const addAudit = (e) => setAuditLog(prev => [e, ...prev].slice(0, AUDIT_MAX));
  const toast = (msg, ty='i', ms=3000) => {
    const id = Date.now().toString();
    setToasts(p => [...p, {id,msg,ty}]);
    setTimeout(() => setToasts(p => p.filter(t => t.id!==id)), ms);
  };

  // Hook para forçar atualização do rawId a partir da engine (quando houver conflito)
  useEffect(() => {
    window.__setRawId = (newId) => {
      setRawId(newId);
      localStorage.setItem('k10srv_id', newId);
      toast(`ID alterado para ${newId} devido a conflito`, 's');
    };
    return () => { delete window.__setRawId; };
  }, []);

  const engine = useServerEngine({
    serverId: fullId,
    onAudit: addAudit,
    onStats: setStats,
    onGroups: setGroups,
    onStatus: (st, msg) => setStatus({st, msg}),
    peerServerIndex,
    setPeerServerIndex,
  });

  useEffect(() => {
    engine.connect();
    return () => engine.disconnect();
  }, [fullId, peerServerIndex]); // reconecta se ID ou servidor PeerJS mudar

  useEffect(() => { engine.setRouterMode(routerMode); }, [routerMode]);
  useEffect(() => { engine.setPureMode(pureMode); }, [pureMode]);

  const saveId = () => {
    const c = idInput.toUpperCase().replace(/[^A-Z2-9]/g,'').slice(0,6);
    if (c.length<4) { toast('ID deve ter 4-6 caracteres (A-Z, 2-9)', 'e'); return; }
    setRawId(c); localStorage.setItem('k10srv_id', c); setEditingId(false);
    engine.disconnect();
    setTimeout(() => engine.connect(), 600);
  };

  const addServer = () => {
    const s = srvInput.trim().toUpperCase();
    if (!s) return;
    const full = s.endsWith('-CENTRAL') ? s : s+'-CENTRAL';
    if (!servers.includes(full)) {
      const u = [...servers, full]; setServers(u);
      localStorage.setItem('k10srv_srvs', JSON.stringify(u));
      engine.connectToServer(full);
    }
    setSrvInput('');
  };
  const rmServer = (s) => {
    const u = servers.filter(x=>x!==s); setServers(u);
    localStorage.setItem('k10srv_srvs', JSON.stringify(u));
  };
  const startQuiz = () => {
    if (engine.quizOwnerRef.current) { toast('Um cliente já possui o quiz bot', 'e'); return; }
    engine.startQuiz(quizDisc, quizInt);
    setQuizActive(true);
  };
  const stopQuiz = () => { engine.stopQuiz(); setQuizActive(false); };
  const startYT = () => {
    const raw = ytInput.trim();
    const m = raw.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,50})/);
    const id = m ? m[1] : raw;
    if (!/^[a-zA-Z0-9_-]{6,50}$/.test(id) && !id.startsWith('playlist:')) { toast('ID do YouTube inválido', 'e'); return; }
    engine.startYT(id); setYtActive(true); setYtInput(''); toast('YouTube Chat iniciado!', 's');
  };
  const stopYT = () => { engine.stopYT(); setYtActive(false); toast('YouTube Chat parado'); };

  const stColor = {connected:'var(--success)',disconnected:'var(--danger)',reconnecting:'var(--warn)',error:'var(--danger)'}[status.st]||'var(--muted)';

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <div className="hdr">
        <div className="sdot" style={{background:stColor,boxShadow:status.st==='connected'?`0 0 6px ${stColor}`:'none',animation:status.st==='reconnecting'?'pulse 1s infinite':status.st==='connected'?'pulse 2s infinite':'none'}}></div>
        <div>
          <div className="hdr-title"><i className="fas fa-server"></i> K10 Chat Server V52+ (corrigido)</div>
          <div className="hdr-sub" style={{color:stColor}}>{status.msg}</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:'8px',alignItems:'center'}}>
          {status.st!=='connected'
            ? <button className="btn bs" onClick={()=>{engine.connect(); toast('Conectando…','i');}}><i className="fas fa-plug"></i> Conectar</button>
            : <button className="btn bg" onClick={()=>{engine.disconnect(); toast('Desconectado');}}><i className="fas fa-power-off"></i> Desconectar</button>
          }
          <button className="btn bg" onClick={()=>setDarkMode(!darkMode)} title="Alternar tema"><i className={`fas fa-${darkMode?'sun':'moon'}`}></i></button>
        </div>
      </div>

      <div className="layout" style={{flex:1,overflow:'hidden'}}>
        <div className="sidebar">
          <div className="stabs">
            {[['groups','sitemap','Grupos'],['servers','network-wired','Servidores'],['audit','scroll','Auditoria']].map(([id,ic,lb])=>(
              <div key={id} className={`stab${tab===id?' on':''}`} onClick={()=>setTab(id)}>
                <i className={`fas fa-${ic}`}></i> {lb}
              </div>
            ))}
          </div>

          {tab==='groups' && (
            <div style={{flex:1,overflowY:'auto'}}>
              {groups.length===0
                ? <div style={{padding:'30px 14px',textAlign:'center',color:'var(--muted)',fontSize:'12px'}}><div style={{fontSize:'26px',marginBottom:'8px',opacity:.4}}>🌐</div>Nenhum grupo ativo.</div>
                : groups.map(g => (
                  <div key={g.gid} className="grow">
                    <div style={{flex:1}}>
                      <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'3px'}}>
                        <span style={{fontFamily:'monospace',fontSize:'11px',color:'var(--warn)',fontWeight:700}}>{g.gid}</span>
                        <span className={`bdg ${g.open?'bgs':'bgw'}`}>{g.open?'aberto':'cheio'}</span>
                      </div>
                      <div style={{fontSize:'10px',color:'var(--muted)',marginBottom:'4px'}}>👥 {g.pc}/{K10_MAX_GROUP} · 🖥️ {g.sc}/{K10_MAX_SRV_GRP}</div>
                      <div className="gbar"><div className="gfill" style={{width:`${(g.pc/K10_MAX_GROUP)*100}%`,background:g.pc>=K10_MAX_GROUP?'var(--danger)':g.pc>=K10_MAX_GROUP*.8?'var(--warn)':'var(--success)'}}></div></div>
                    </div>
                  </div>
                ))
              }
            </div>
          )}

          {tab==='servers' && (
            <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
              <div style={{padding:'10px 12px',borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',gap:'6px'}}>
                  <input className="inp" style={{flex:1,fontSize:'12px'}} value={srvInput} onChange={e=>setSrvInput(e.target.value)} placeholder="ID do servidor (ex. ABC123)" onKeyDown={e=>e.key==='Enter'&&addServer()} />
                  <button className="btn bp" onClick={addServer}><i className="fas fa-plus"></i></button>
                </div>
              </div>
              {servers.length===0
                ? <div style={{padding:'18px',textAlign:'center',color:'var(--muted)',fontSize:'11px'}}>Nenhum servidor conhecido.</div>
                : servers.map(s=>(
                  <div key={s} className="sitem">
                    <div style={{width:7,height:7,borderRadius:'50%',background:'var(--muted)',flexShrink:0}}></div>
                    <span className="sid">{s}</span>
                    <button className="btn bg" style={{padding:'3px 7px',fontSize:'11px'}} onClick={()=>engine.connectToServer(s)}><i className="fas fa-plug"></i></button>
                    <button className="btn bd" style={{padding:'3px 7px',fontSize:'11px'}} onClick={()=>rmServer(s)}><i className="fas fa-trash"></i></button>
                  </div>
                ))
              }
            </div>
          )}

          {tab==='audit' && (
            <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
              <div style={{padding:'5px 10px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'10px',color:'var(--muted)',fontWeight:700,textTransform:'uppercase'}}>{auditLog.length} eventos</span>
                <button className="btn bg" style={{padding:'2px 7px',fontSize:'10px'}} onClick={()=>setAuditLog([])}>Limpar</button>
              </div>
              {auditLog.length===0
                ? <div style={{padding:'18px',textAlign:'center',color:'var(--muted)',fontSize:'11px'}}>Nenhum evento.</div>
                : auditLog.map(e=>(
                  <div key={e.id} className="ae">
                    <span className="at">{e.time}</span>
                    <span className={`a${e.ty==='error'?'er':e.ty==='success'?'s':e.ty==='warn'?'w':e.ty==='sys'?'sy':'i'}`}>{e.msg}</span>
                  </div>
                ))
              }
            </div>
          )}
        </div>

        <div className="panel">
          <div className="card">
            <div className="ch"><span><i className="fas fa-id-card"></i> Identidade do Servidor</span></div>
            <div className="cb">
              {editingId ? (
                <div style={{display:'flex',gap:'7px',alignItems:'center',marginBottom:'9px'}}>
                  <input className="inp" value={idInput} onChange={e=>setIdInput(e.target.value.toUpperCase())} placeholder="4-6 caracteres (A-Z,2-9)" maxLength={6} style={{fontFamily:'monospace',letterSpacing:2,flex:1}} onKeyDown={e=>e.key==='Enter'&&saveId()} autoFocus />
                  <span style={{color:'var(--muted)',fontSize:'12px',whiteSpace:'nowrap'}}>-CENTRAL</span>
                  <button className="btn bs" onClick={saveId}><i className="fas fa-save"></i></button>
                  <button className="btn bg" onClick={()=>setEditingId(false)}><i className="fas fa-times"></i></button>
                </div>
              ) : (
                <div style={{display:'flex',gap:'7px',alignItems:'center',marginBottom:'9px'}}>
                  <div className="idbox">{fullId}</div>
                  <button className="btn bg" onClick={()=>{ navigator.clipboard.writeText(fullId).then(()=>toast('ID copiado!','s')); }} title="Copiar"><i className="fas fa-copy"></i></button>
                  <button className="btn bg" onClick={()=>{ setIdInput(rawId); setEditingId(true); }} title="Editar"><i className="fas fa-edit"></i></button>
                </div>
              )}
              <div style={{fontSize:'11px',color:'var(--muted)'}}>Compartilhe este ID com os clientes.</div>
            </div>
          </div>

          <div className="card">
            <div className="ch"><span><i className="fas fa-chart-bar"></i> Estatísticas</span></div>
            <div className="cb">
              <div className="sgrid">
                <div className="sbox"><div className="sv">{stats.conns}</div><div className="sl">Conexões ativas</div></div>
                <div className="sbox"><div className="sv">{stats.hydra}</div><div className="sl">Tamanho Hydra</div></div>
                <div className="sbox"><div className="sv">{stats.rx}</div><div className="sl">Msgs recebidas</div></div>
                <div className="sbox"><div className="sv">{stats.tx}</div><div className="sl">Msgs distribuídas</div></div>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="ch"><span><i className="fas fa-sliders-h"></i> Modos do Servidor</span></div>
            <div className="cb" style={{display:'flex',flexDirection:'column',gap:'13px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px'}}>
                <div><div style={{fontWeight:700,fontSize:'13px'}}>Router Mode</div><div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}}>Desconecta clientes após atribuição (escala até ∞)</div></div>
                <label className="tgl"><input type="checkbox" checked={routerMode} onChange={e=>setRouterMode(e.target.checked)} /><span className="tslider"></span></label>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px'}}>
                <div><div style={{fontWeight:700,fontSize:'13px'}}>Pure Server Mode</div><div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}}>Envia server-info para todos os clientes</div></div>
                <label className="tgl"><input type="checkbox" checked={pureMode} onChange={e=>setPureMode(e.target.checked)} /><span className="tslider"></span></label>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="ch">
              <span><i className="fas fa-robot"></i> Quiz Bot do Servidor</span>
              <span className={`bdg ${quizActive?'bgs':engine.quizOwnerRef.current?'bgw':'bgi'}`}>
                {quizActive?'🟢 Ativo':engine.quizOwnerRef.current?'🔒 Cliente dono':'🔴 Inativo'}
              </span>
            </div>
            <div className="cb" style={{display:'flex',flexDirection:'column',gap:'11px'}}>
              <div style={{display:'flex',gap:'9px'}}>
                <div style={{flex:1}}><div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'4px'}}>Disciplina</div>
                  <select value={quizDisc} onChange={e=>setQuizDisc(e.target.value)} disabled={quizActive} className="inp" style={{padding:'7px 9px'}}>
                    <option value="all">📚 Todas</option><option value="world">🌍 Lugares do Mundo</option>
                    {QUIZ_SUBS.map(s=><option key={s.id} value={s.id}>{s.emoji} {s.name}</option>)}
                  </select>
                </div>
                <div style={{flex:1}}><div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'4px'}}>Intervalo (s, min {SRV_QUIZ_MIN})</div>
                  <input type="number" className="inp" value={quizInt} min={SRV_QUIZ_MIN} onChange={e=>setQuizInt(Math.max(SRV_QUIZ_MIN,parseInt(e.target.value)||SRV_QUIZ_MIN))} disabled={quizActive} />
                </div>
              </div>
              {!quizActive ? <button className="btn bs" style={{width:'100%',justifyContent:'center'}} onClick={startQuiz}><i className="fas fa-play"></i> Iniciar Quiz</button>
                         : <button className="btn bd" style={{width:'100%',justifyContent:'center'}} onClick={stopQuiz}><i className="fas fa-stop"></i> Parar Quiz</button>}
            </div>
          </div>

          <div className="card">
            <div className="ch"><span><i className="fab fa-youtube" style={{color:'#ef4444'}}></i> YouTube Chat Broadcast</span>{ytActive && <span className="bdg bgd">🔴 Ao vivo</span>}</div>
            <div className="cb" style={{display:'flex',flexDirection:'column',gap:'9px'}}>
              <div style={{display:'flex',gap:'7px'}}>
                <input className="inp" value={ytInput} onChange={e=>setYtInput(e.target.value)} placeholder="ID ou URL do YouTube" onKeyDown={e=>e.key==='Enter'&&startYT()} />
                <button className="btn bd" onClick={startYT}><i className="fas fa-broadcast-tower"></i></button>
              </div>
              {ytActive && <button className="btn bg" onClick={stopYT}><i className="fas fa-stop"></i> Parar YouTube Chat</button>}
            </div>
          </div>

          <div className="card">
            <div className="ch"><span><i className="fas fa-info-circle"></i> Sobre</span></div>
            <div className="cb" style={{fontSize:'11px',color:'var(--muted)',lineHeight:1.7}}>
              <div style={{marginBottom:'6px'}}><span className="bdg bgi" style={{marginRight:'6px'}}>Hydra V52+</span> Cada grupo suporta até <strong style={{color:'var(--text)'}}>{K10_MAX_GROUP} peers</strong> e <strong style={{color:'var(--text)'}}>{K10_MAX_SRV_GRP} servidores</strong>.</div>
              <div>Router Mode escala ilimitadamente ao desconectar clientes após atribuição. GC fantasma a cada 5s, heartbeat a cada 25s.</div>
              <div style={{marginTop:'8px'}}><i className="fas fa-exchange-alt"></i> Servidor de sinalização atual: <strong>{PEER_SERVERS[peerServerIndex].host}</strong> (troca automática após 10 falhas)</div>
            </div>
          </div>
        </div>
      </div>
      <Toasts list={toasts} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(async () => {
  try {
    await esbuild.initialize({ wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.20.1/esbuild.wasm' });
    const src = document.getElementById('jsx-src').textContent;
    const { code } = await esbuild.transform(src, { loader: 'tsx', target: 'esnext' });
    document.getElementById('k10-loading').style.display = 'none';
    document.getElementById('root').style.display = 'flex';
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  } catch(e) {
    console.error('esbuild error', e);
    document.getElementById('k10-loading').innerHTML = '<p style="color:#ef4444;text-align:center;padding:40px">Falha ao inicializar.<br><small>' + e.message + '</small></p>';
  }
})();
</script>
</body>
</html>
