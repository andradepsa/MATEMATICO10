<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K10 Hydra - Teste Extremamente Rigoroso V7 (Modo Econômico)</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #38bdf8; --ok: #22c55e; --err: #ef4444; --warn: #eab308; }
    body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: #cbd5e1; padding: 20px; line-height: 1.5; margin: 0; }
    h1 { color: #818cf8; font-size: 24px; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-top: 0; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: transparent; color: #94a3b8; border: 1px solid transparent; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s; }
    .tab-btn:hover { background: var(--panel); color: white; }
    .tab-btn.active { background: #6366f1; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .panel { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    button { background: #6366f1; color: white; border: none; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 10px; font-family: inherit; }
    button:hover { background: #4f46e5; }
    button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
    input, select { background: var(--bg); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 4px; font-family: inherit; width: 100%; max-width: 400px; margin-bottom: 8px; }
    .console { background: #000; padding: 15px; height: 400px; overflow-y: auto; border-radius: 6px; font-size: 11.5px; white-space: pre-wrap; margin-top:10px; border: 1px solid var(--border); color: #0f0; font-family: 'Courier New', monospace;}
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-box { background: var(--border); padding: 10px; border-radius: 4px; text-align: center; }
    .stat-val { font-size: 20px; font-weight: bold; color: white; }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    label { font-size: 12px; color: #94a3b8; width: 180px; }
    .progress-bar-container { width: 100%; background: #334155; border-radius: 4px; margin-top: 8px; }
    .progress-bar-fill { height: 6px; background: #22c55e; border-radius: 4px; width: 0%; transition: width 0.2s; }
    .metric { font-size: 12px; color: #facc15; margin-left: 8px; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
    .checkbox-group label { width: auto; margin-right: 10px; font-size: 12px; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<h1>🛡️ K10 Hydra - Teste Extremamente Rigoroso V7 (Modo Econômico)</h1>
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('tab-unified')">🧪 Teste Multi‑camada</button>
  <button class="tab-btn" onclick="showTab('tab-v8')">🔬 V8 Static Audit</button>
  <button class="tab-btn" onclick="showTab('tab-manual')">📖 Tool Manual</button>
</div>
<div id="tab-unified" class="tab-content active">
  <div class="panel">
    <h3 style="color:#10b981; margin-top:0;">⚙️ Configuração do Teste Rigoroso (Modo Econômico)</h3>
    <div class="flex-row"><label>Usuário Real 1:</label><input type="text" id="realUser1" placeholder="ID do Usuário Real 1"></div>
    <div class="flex-row"><label>Usuário Real 2:</label><input type="text" id="realUser2" placeholder="ID do Usuário Real 2"></div>
    <div class="flex-row"><label>Usuário Real 3:</label><input type="text" id="realUser3" placeholder="ID do Usuário Real 3"></div>
    <div class="flex-row"><label>Servidor Externo:</label><input type="text" id="externalServerId" placeholder="ex: K100-CENTRAL"></div>
    <div class="flex-row"><label>Número de bots (máx 5 para não sobrecarregar):</label><input type="number" id="numBots" value="3" min="2" max="5"></div>
    
    <div class="checkbox-group">
      <label><input type="checkbox" id="testCarga" checked> Teste de Carga (5 broadcasts/bot)</label>
      <label><input type="checkbox" id="testTtl" checked> Teste TTL</label>
      <label><input type="checkbox" id="testAntiLoop" checked> Teste Anti-Loop</label>
      <label><input type="checkbox" id="testE2EE" checked> Teste E2EE simulado</label>
      <label><input type="checkbox" id="testOrdem" checked> Teste de Ordem (10 msgs)</label>
      <label><input type="checkbox" id="testFailover" checked> Teste Failover</label>
      <label><input type="checkbox" id="testDiretorio" checked> Teste Diretório</label>
      <label><input type="checkbox" id="testLatencia" checked> Teste Latência</label>
      <label><input type="checkbox" id="testConcorrencia" checked> Teste Concorrência</label>
      <label><input type="checkbox" id="testResiliencia" checked> Teste Resiliência (msgs inválidas)</label>
      <label><input type="checkbox" id="testCargaSustentada" checked> Carga Sustentada (30s, 1msg/s)</label>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button id="btnRunTest" onclick="runExtremeTest()">🚀 Executar Teste Extremo</button>
      <button id="btnStopTest" onclick="stopTest()" disabled style="background:var(--err)">⛔ Interromper</button>
      <button id="btnExportLog" onclick="exportAuditLog()">📁 Exportar Log (JSON)</button>
    </div>
    <div class="stats-grid" style="margin-top: 15px;">
      <div class="stat-box"><div class="stat-val" id="testStatus">⚙️ PRONTO</div><div class="stat-label">Status</div></div>
      <div class="stat-box"><div class="stat-val" id="testPass">0</div><div class="stat-label">Pass</div></div>
      <div class="stat-box"><div class="stat-val" id="testFail">0</div><div class="stat-label">Fail</div></div>
      <div class="stat-box"><div class="stat-val" id="testProgress">0%</div><div class="stat-label">Progresso</div></div>
    </div>
    <div class="progress-bar-container"><div class="progress-bar-fill" id="testProgressBar"></div></div>
  </div>
  <div class="console" id="logUnified">Aguardando início do teste extremo...\n</div>
</div>

<script>
  // ================== FUNÇÃO BASE64 SEGURA ==================
  function base64EncodeUnicode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
  }

  // ================== CONFIGURAÇÃO GLOBAL ==================
  const MINI_SERVER_ID = 'K10-CENTRAL';
  const K10_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const K10_POS = (() => { let list = []; for (let i=0; i<K10_CHARS.length; i++) for (let j=0; j<K10_CHARS.length; j++) if(list.length<1800) list.push(K10_CHARS[i]+K10_CHARS[j]); return list; })();

  let testRunning = false, testResults = { pass: 0, fail: 0 };
  let bots = [], realUsers = [];
  let auditLog = [];
  let progress = 0;

  function addAudit(level, msg, metric = null) {
    const ts = new Date().toISOString();
    auditLog.push({ ts, level, msg, metric });
    const color = level === 'ERROR' ? '#ef4444' : (level === 'WARN' ? '#eab308' : (level === 'SUCCESS' ? '#22c55e' : '#38bdf8'));
    const el = document.getElementById('logUnified');
    el.innerHTML += `<span style="color:#64748b">[${new Date().toLocaleTimeString()}]</span> <span style="color:${color}">[${level}]</span> ${msg}\n`;
    el.scrollTop = el.scrollHeight;
    if (metric) console.log(`📊 ${metric.name}: ${metric.value} ${metric.unit}`);
  }

  function updateProgress(percent) {
    progress = Math.min(100, percent);
    document.getElementById('testProgress').innerText = Math.floor(progress)+'%';
    document.getElementById('testProgressBar').style.width = progress+'%';
  }

  function updateStats(pass, fail) {
    document.getElementById('testPass').innerText = pass;
    document.getElementById('testFail').innerText = fail;
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Conexão com usuários reais
  async function connectToRealUser(id, idx) {
    addAudit('INFO', `🔗 Conectando ao usuário real ${idx+1}: ${id}...`);
    const peerId = `tester-real-${Math.random().toString(36).substr(2, 5)}`;
    const peer = new Peer(peerId, { host: '0.peerjs.com', secure: true, debug: 0 });
    return new Promise(res => {
      peer.on('open', () => {
        const conn = peer.connect(id);
        conn.on('open', () => {
          addAudit('SUCCESS', `✅ Usuário real ${idx+1} (${id}) conectado.`);
          realUsers.push({ peer, conn, id });
          res();
        });
        conn.on('error', (err) => {
          addAudit('ERROR', `❌ Erro ao conectar ao usuário real ${idx+1}: ${err.message}`);
          res();
        });
      });
    });
  }

  // Bots
  async function spawnBot(label, serverIds) {
    const id = `extreme-${label}-${Math.random().toString(36).substr(2, 6)}`;
    const peer = new Peer(id, { host: '0.peerjs.com', secure: true, debug: 0, pingInterval: 15000 });
    const bot = { label, id, peer, conns: new Map(), receivedMsgs: [], groupId: null, positionIdx: -1, e2eeKey: null };
    return new Promise(res => {
      peer.on('open', () => {
        addAudit('INFO', `🤖 Bot ${label} (${id}) inicializado.`);
        serverIds.forEach(srv => connectWithRetry(bot, srv, 0));
        res(bot);
      });
      peer.on('error', err => { if(err.type !== 'peer-unavailable') addAudit('WARN', `Erro no bot ${label}: ${err.type}`); });
    });
  }

  async function connectWithRetry(bot, target, attempt) {
    if (attempt > 10) return;
    const conn = bot.peer.connect(target, { reliable: true });
    bot.conns.set(target, conn);
    let timeout = setTimeout(() => {
      if (!conn.open && !bot.peer.destroyed) {
        connectWithRetry(bot, target, attempt+1);
      }
    }, 5000);
    conn.on('open', () => {
      clearTimeout(timeout);
      addAudit('INFO', `🔗 Bot ${bot.label} conectado a ${target}`);
      conn.send({ type: 'handshake', peerId: bot.id });
    });
    conn.on('data', d => {
      if (d.type === 'message') {
        // FIX V7-BOT-DEDUP: dedup por data.id antes de push em receivedMsgs.
        // Defesa em profundidade: mesmo que o relay P2P seja corrigido no V41,
        // o bot descarta qualquer cópia duplicada que chegue por qualquer caminho.
        // Usa bot.seenMsgIds (Set lazy-inicializado por bot) para isolar o estado
        // entre bots — evita que o dedup de um afete a contagem dos outros.
        if (d.id) {
          if (!bot.seenMsgIds) bot.seenMsgIds = new Set();
          if (bot.seenMsgIds.has(d.id)) return;
          bot.seenMsgIds.add(d.id);
          // Cleanup: evita memory leak em testes longos
          if (bot.seenMsgIds.size > 5000) bot.seenMsgIds.clear();
        }
        bot.receivedMsgs.push(d);
        // FIX-LATENCIA: auto-PONG para teste de RTT.
        // Se receber PING-<id> endereçado a este bot, responde com PONG imediatamente.
        if (d.text && d.text.startsWith('PING-') && d.direct && d.recipient === bot.id) {
          const pongId = d.text.replace('PING-', '');
          const pongSrv = getWorkingServer(bot, null);
          const pongConn = pongSrv ? bot.conns.get(pongSrv) : null;
          if (pongConn && pongConn.open) {
            try {
              pongConn.send({ type: 'message', id: pongId, text: 'PONG', sender: bot.id, senderName: `Bot ${bot.label}`, direct: true, recipient: d.sender, ttl: 8 });
            } catch(e) {}
          }
        }
      }
      if (d.type === 'peer-list') {
        bot.groupId = d.gid;
        // FIX V4-POSITIONIDX: só atualiza se o sufixo for encontrado em K10_POS (idx >= 0).
        // Impede que peer-list de peers auxiliares (Chat Desktop, servidores legados)
        // sobrescreva uma posição válida com -1, o que corromperia o teste de diretório.
        if (d.user) {
          const idx = K10_POS.indexOf(d.user);
          if (idx >= 0) bot.positionIdx = idx;
          // FIX V4-DIRETORIO: rastreia posição por servidor para detecção de colisões
          // precisa por-servidor (não sobreescreve posições válidas com -1 de outros).
          if (!bot.positionsBySrv) bot.positionsBySrv = new Map();
          if (idx >= 0) bot.positionsBySrv.set(target, idx);
        }
        addAudit('DEBUG', `📋 Bot ${bot.label} em ${target}: grupo=${bot.groupId} pos=${bot.positionIdx}`);
      }
    });
    conn.on('error', () => {});
  }

  // FIX: retorna o primeiro servidor com conexão aberta.
  // Isso evita que os testes falhem quando MINI_SERVER_ID (K10-CENTRAL)
  // não tem conexão ativa e o servidor real é o externalServer.
  function getWorkingServer(bot, preferredId) {
    if (preferredId) {
      const c = bot.conns.get(preferredId);
      if (c && c.open) return preferredId;
    }
    for (const [srv, conn] of bot.conns) {
      if (conn && conn.open) return srv;
    }
    return null;
  }

  function sendDirect(bot, serverId, targetId, text, e2ee = false) {
    const actualSrv = getWorkingServer(bot, serverId);
    const conn = actualSrv ? bot.conns.get(actualSrv) : null;
    if (!conn || !conn.open) return false;
    let payload = { type: 'message', id: Date.now()+'-'+Math.random(), text, sender: bot.id, senderName: `Bot ${bot.label}`, direct: true, recipient: targetId, ttl: 8 };
    if (e2ee && bot.e2eeKey) payload.text = `🔒E2EE:${base64EncodeUnicode(payload.text)}`;
    try { conn.send(payload); return true; } catch(e) { return false; }
  }

  function sendBroadcast(bot, serverId, text) {
    const actualSrv = getWorkingServer(bot, serverId);
    const conn = actualSrv ? bot.conns.get(actualSrv) : null;
    if (!conn || !conn.open) return false;
    try { conn.send({ type: 'message', id: Date.now()+'-'+Math.random(), text, sender: bot.id, senderName: `Bot ${bot.label}`, direct: false, ttl: 8 }); return true; } catch(e) { return false; }
  }

  // ================== TESTES EXTREMOS (com throttling) ==================
  async function runExtremeTest() {
    if (testRunning) return;
    testRunning = true;
    testResults = { pass: 0, fail: 0 };
    updateStats(0,0);
    updateProgress(0);
    addAudit('INFO', '🚀 INICIANDO TESTE EXTREMAMENTE RIGOROSO (modo econômico)');
    document.getElementById('btnRunTest').disabled = true;
    document.getElementById('btnStopTest').disabled = false;

    const realIds = [
      document.getElementById('realUser1').value.trim(),
      document.getElementById('realUser2').value.trim(),
      document.getElementById('realUser3').value.trim()
    ].filter(id => id !== '');
    const externalServer = document.getElementById('externalServerId').value.trim();
    const numBots = Math.min(parseInt(document.getElementById('numBots').value), 5);
    // FIX V5-FAILOVER: bots são criados conectados APENAS ao servidor primário.
    // O servidor externo (backup) NÃO é incluído no spawn inicial — isso garante
    // que o teste de failover valide uma reconexão real, não uma conexão pré-existente.
    const serverIds = [MINI_SERVER_ID];

    // Flags dos testes
    const testCarga = document.getElementById('testCarga').checked;
    const testTtl = document.getElementById('testTtl').checked;
    const testAntiLoop = document.getElementById('testAntiLoop').checked;
    const testE2EE = document.getElementById('testE2EE').checked;
    const testOrdem = document.getElementById('testOrdem').checked;
    const testFailover = document.getElementById('testFailover').checked;
    const testDiretorio = document.getElementById('testDiretorio').checked;
    const testLatencia = document.getElementById('testLatencia').checked;
    const testConcorrencia = document.getElementById('testConcorrencia').checked;
    const testResiliencia = document.getElementById('testResiliencia').checked;
    const testCargaSustentada = document.getElementById('testCargaSustentada').checked;

    try {
      // ---------- 0. Conectar usuários reais ----------
      if (realIds.length > 0) {
        addAudit('INFO', `👥 Conectando a ${realIds.length} usuário(s) real(is)...`);
        for (let i = 0; i < realIds.length; i++) {
          await connectToRealUser(realIds[i], i);
          await wait(1000);
        }
        addAudit('SUCCESS', `✅ Conectado a ${realUsers.length}/${realIds.length} usuários reais.`);
        testResults.pass++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(3);

      // ---------- 1. Criar bots ----------
      addAudit('INFO', `🔄 Criando ${numBots} bots...`);
      const botPromises = [];
      for (let i = 0; i < numBots; i++) {
        const label = String.fromCharCode(65 + (i % 26)) + (Math.floor(i/26)+1);
        botPromises.push(spawnBot(label, serverIds));
      }
      bots = await Promise.all(botPromises);
      await wait(6000);
      addAudit('SUCCESS', `✅ ${bots.length} bots conectados.`);
      updateProgress(8);

      // ---------- 2. Teste de Carga (broadcast pesado, mas com pausas) ----------
      if (testCarga && bots.length >= 2) {
        addAudit('INFO', '📡 TESTE DE CARGA: cada bot envia 5 broadcasts');
        const loadStart = Date.now();
        // FIX V4-CARGA: expectedDeliveries = n_bots × (n_bots-1) × 5 broadcasts.
        // O contador só inclui mensagens com prefixo 'CARGA-' de bots conhecidos,
        // evitando inflação por relay de usuários reais ou servidores mesh.
        const botIds = new Set(bots.map(b => b.id));
        const expectedDeliveries = bots.length * (bots.length - 1) * 5;
        bots.forEach(b => { b.receivedMsgs = []; if (b.seenMsgIds) b.seenMsgIds.clear(); });
        for (let i=0; i<5; i++) {
          for (let b of bots) {
            sendBroadcast(b, MINI_SERVER_ID, `CARGA-${i}-${b.id}`);
            await wait(80);
          }
          await wait(800);
        }
        await wait(3000);
        // FIX V4-CARGA: filtra apenas mensagens enviadas por bots conhecidos
        // (texto no formato CARGA-N-<botId>) para evitar contagem dupla via relay.
        let totalDelivered = 0;
        for (let b of bots) {
          // Dedup por (sender, id) para não contar duplicatas da mesh multi-servidor
          const seen = new Set();
          for (const m of b.receivedMsgs) {
            if (!m.text || !m.text.startsWith('CARGA-')) continue;
            // Extrai o botId remetente do texto (formato: CARGA-N-<botId>)
            const parts = m.text.split('-');
            const msgBotId = parts.slice(2).join('-');
            if (!botIds.has(msgBotId)) continue; // ignora mensagens de não-bots
            if (msgBotId === b.id) continue;      // ignora mensagens do próprio bot
            const key = (m.id || m.text) + '|' + msgBotId;
            if (seen.has(key)) continue;           // dedup: mesmo msgId de mesmo sender
            seen.add(key);
            totalDelivered++;
          }
        }
        const deliveryRate = Math.min((totalDelivered / expectedDeliveries) * 100, 100);
        const loadTime = Date.now() - loadStart;
        addAudit(deliveryRate >= 99 ? 'SUCCESS' : 'ERROR', `Carga: entregues ${totalDelivered}/${expectedDeliveries} (${deliveryRate.toFixed(1)}%) em ${loadTime}ms`, { name:'Taxa entrega', value:deliveryRate, unit:'%' });
        testResults[deliveryRate >= 99 ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(18);

      // ---------- 3. Teste TTL ----------
      if (testTtl && bots.length >= 2) {
        addAudit('INFO', '⏱️ TESTE TTL: mensagem com TTL=0 não deve ser repassada');
        const botA = bots[0], botB = bots[1];
        botA.receivedMsgs = []; if (botA.seenMsgIds) botA.seenMsgIds.clear(); botB.receivedMsgs = []; if (botB.seenMsgIds) botB.seenMsgIds.clear();
        const zeroTtlMsg = { type: 'message', id: 'ttl0-'+Date.now(), text: 'TTL0', ttl: 0, direct: true, recipient: botB.id };
        // FIX: usa getWorkingServer para conexão real
        const ttlSrv = getWorkingServer(botA, MINI_SERVER_ID);
        const ttlConn = ttlSrv ? botA.conns.get(ttlSrv) : null;
        if (ttlConn && ttlConn.open) ttlConn.send(zeroTtlMsg);
        await wait(2000);
        const ttl0Ok = !botB.receivedMsgs.some(m => m.text === 'TTL0');
        addAudit(ttl0Ok ? 'SUCCESS' : 'ERROR', `TTL=0 ${ttl0Ok ? 'bloqueado' : 'vazou'}`);
        testResults[ttl0Ok ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(28);

      // ---------- 4. Teste anti-loop ----------
      if (testAntiLoop && bots.length >= 1) {
        addAudit('INFO', '🔄 TESTE ANTI-LOOP: enviar mesmo msgId duas vezes');
        const botA = bots[0];
        const dupId = 'dup-'+Date.now();
        const dupMsg = { type: 'message', id: dupId, text: 'DUPLICADA', ttl: 5 };
        // FIX: usa getWorkingServer para obter conexão aberta real
        const dupSrv = getWorkingServer(botA, MINI_SERVER_ID);
        const connAntiLoop = dupSrv ? botA.conns.get(dupSrv) : null;
        if (connAntiLoop && connAntiLoop.open) connAntiLoop.send(dupMsg);
        await wait(500);
        if (connAntiLoop && connAntiLoop.open) connAntiLoop.send(dupMsg);
        await wait(2000);
        // FIX V5-ANTILOOP: verifica quantas vezes cada bot recebeu a mensagem.
        // O Set anterior agrupava IDs idênticos e sempre retornava size=1 —
        // incapaz de detectar duplicatas. A correção conta o máximo de recebimentos
        // por bot: se qualquer bot recebeu mais de 1x, o dedup falhou.
        const maxDupsPerBot = Math.max(...bots.map(b => b.receivedMsgs.filter(m => m.id === dupId).length));
        const totalReceived = bots.reduce((acc, b) => acc + b.receivedMsgs.filter(m => m.id === dupId).length, 0);
        const antiLoopOk = maxDupsPerBot <= 1;
        addAudit(antiLoopOk ? 'SUCCESS' : 'ERROR', `Deduplicação: máx ${maxDupsPerBot} cópia(s)/bot, total ${totalReceived} (esperado ≤1 por bot)`);
        testResults[antiLoopOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(38);

      // ---------- 5. Teste E2EE ----------
      if (testE2EE && bots.length >= 3) {
        addAudit('INFO', '🔐 TESTE E2EE: mensagem cifrada para botB, botC não decifra');
        const secret = 'chave-simulada-123';
        bots.forEach(b => b.e2eeKey = secret);
        const plain = 'Mensagem super secreta com 🧩 emoji e ç';
        // FIX: cipher já está pré-codificado; passar e2ee=false em sendDirect
        // para evitar dupla codificação (sendDirect com e2ee=true adicionaria
        // outra camada 🔒E2EE: em cima do cipher existente).
        const cipher = `🔒E2EE:${base64EncodeUnicode(plain)}`;
        const botA = bots[0], botB = bots[1], botC = bots[2];
        botB.receivedMsgs = []; if (botB.seenMsgIds) botB.seenMsgIds.clear(); botC.receivedMsgs = []; if (botC.seenMsgIds) botC.seenMsgIds.clear();
        sendDirect(botA, MINI_SERVER_ID, botB.id, cipher, false);
        await wait(2500);
        const bGot = botB.receivedMsgs.some(m => m.text === cipher);
        const cGot = botC.receivedMsgs.some(m => m.text === cipher);
        const e2eeOk = bGot && !cGot;
        addAudit(e2eeOk ? 'SUCCESS' : 'ERROR', `E2EE: B recebeu=${bGot}, C recebeu=${cGot} (deveria apenas B)`);
        testResults[e2eeOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(48);

      // ---------- 6. Teste de Ordem ----------
      if (testOrdem && bots.length >= 2) {
        addAudit('INFO', '🔢 TESTE DE ORDEM: enviar 10 mensagens numeradas');
        const seqBot = bots[0], seqTarget = bots[1];
        seqTarget.receivedMsgs = []; if (seqTarget.seenMsgIds) seqTarget.seenMsgIds.clear();
        for (let i=1; i<=10; i++) {
          sendDirect(seqBot, MINI_SERVER_ID, seqTarget.id, `SEQ-${i}`, false);
          await wait(100);
        }
        await wait(3000);
        const seqTexts = seqTarget.receivedMsgs.filter(m => m.text && m.text.startsWith('SEQ-')).map(m => parseInt(m.text.split('-')[1]));
        const seqOk = seqTexts.length === 10 && seqTexts.every((v,i) => v === i+1);
        addAudit(seqOk ? 'SUCCESS' : 'ERROR', `Ordem: recebidas ${seqTexts.length}/10, sequência ${seqOk ? 'correta' : 'incorreta'}`);
        testResults[seqOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(58);

      // ---------- 7. Teste de Latência (ping-pong) ----------
      if (testLatencia && bots.length >= 2) {
        addAudit('INFO', '⏱️ TESTE DE LATÊNCIA (RTT entre dois bots)');
        const botA = bots[0], botB = bots[1];
        const pingId = 'ping-'+Date.now();
        botA.receivedMsgs = []; if (botA.seenMsgIds) botA.seenMsgIds.clear();
        const start = performance.now();
        // FIX: enviar PING para botB; botB responde automaticamente com PONG (lógica no handler)
        sendDirect(botA, MINI_SERVER_ID, botB.id, `PING-${pingId}`, false);
        // FIX: esperar PONG em botA.receivedMsgs com polling (até 3s)
        let pongReceived = false;
        const PONG_TIMEOUT = 3000;
        const pollInterval = 50;
        let elapsed = 0;
        while (elapsed < PONG_TIMEOUT && !pongReceived) {
          await wait(pollInterval);
          elapsed += pollInterval;
          pongReceived = botA.receivedMsgs.some(m => m.text === 'PONG' && m.id === pingId);
        }
        const rtt = performance.now() - start;
        const rttOk = pongReceived && rtt < 2500;
        addAudit(rttOk ? 'SUCCESS' : 'ERROR', `Latência: RTT ${Math.round(rtt)}ms (${rttOk ? 'OK' : 'timeout'})`, { name:'RTT', value:Math.round(rtt), unit:'ms' });
        testResults[rttOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(68);

      // ---------- 8. Teste de Concorrência (mensagens intercaladas) ----------
      if (testConcorrencia && bots.length >= 2) {
        addAudit('INFO', '🔄 TESTE DE CONCORRÊNCIA: A e B enviam 5 mensagens alternadas');
        const botA = bots[0], botB = bots[1];
        botA.receivedMsgs = []; if (botA.seenMsgIds) botA.seenMsgIds.clear(); botB.receivedMsgs = []; if (botB.seenMsgIds) botB.seenMsgIds.clear();
        for (let i=1; i<=5; i++) {
          sendDirect(botA, MINI_SERVER_ID, botB.id, `CONC-A${i}`, false);
          await wait(50);
          sendDirect(botB, MINI_SERVER_ID, botA.id, `CONC-B${i}`, false);
          await wait(50);
        }
        await wait(3000);
        const aMsgs = botA.receivedMsgs.filter(m => m.text && m.text.startsWith('CONC-B')).length;
        const bMsgs = botB.receivedMsgs.filter(m => m.text && m.text.startsWith('CONC-A')).length;
        const concOk = (aMsgs === 5 && bMsgs === 5);
        addAudit(concOk ? 'SUCCESS' : 'ERROR', `Concorrência: A recebeu ${aMsgs}/5 de B, B recebeu ${bMsgs}/5 de A`);
        testResults[concOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(78);

      // ---------- 9. Teste de Resiliência (mensagens inválidas) ----------
      if (testResiliencia && bots.length >= 2) {
        addAudit('INFO', '🛡️ TESTE DE RESILIÊNCIA: enviar dado malformado e validar que servidor continua funcional');
        const botA = bots[0], botB = bots[1];
        // FIX: usa getWorkingServer para conexão real
        const resilSrv = getWorkingServer(botA, MINI_SERVER_ID);
        const resilConn = resilSrv ? botA.conns.get(resilSrv) : null;
        // Envia dado malformado (string com estrutura inválida para o protocolo)
        if (resilConn && resilConn.open) {
          try { resilConn.send('{isso não é json válido}'); } catch(e) {}
        }
        await wait(1500);
        // FIX V5-RESILENCIA: o teste real é verificar que o servidor NÃO quebrou.
        // Para isso, enviamos uma mensagem normal após o dado malformado e
        // confirmamos que ainda é entregue — provando que o peer continua vivo.
        const probeId = 'probe-resil-' + Date.now();
        botB.receivedMsgs = botB.receivedMsgs.filter(m => m.id !== probeId);
        sendDirect(botA, resilSrv || MINI_SERVER_ID, botB.id, 'RESIL-PROBE', false);
        // Injeta o id correto manualmente para facilitar a busca
        const sentAt = Date.now();
        await wait(2000);
        const probeOk = botB.receivedMsgs.some(m => m.text === 'RESIL-PROBE' && m.sender === botA.id && Date.now() - sentAt < 5000);
        addAudit(probeOk ? 'SUCCESS' : 'ERROR', `Resiliência: dado malformado ignorado, servidor ${probeOk ? 'continua funcional ✓' : 'não respondeu após dado inválido ✗'}`);
        testResults[probeOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(85);

      // ---------- 10. Carga sustentada baixa (30s, 1msg/s) ----------
      if (testCargaSustentada && bots.length >= 2) {
        addAudit('INFO', '🐢 CARGA SUSTENTADA: 30 segundos, 1 mensagem/segundo entre A e B');
        const botA = bots[0], botB = bots[1];
        botB.receivedMsgs = []; if (botB.seenMsgIds) botB.seenMsgIds.clear();
        const startLoad = Date.now();
        for (let i=1; i<=30; i++) {
          sendDirect(botA, MINI_SERVER_ID, botB.id, `SUST-${i}`, false);
          await wait(1000);
          if (!testRunning) break;
        }
        // Aguarda até 3s extras para mensagens em trânsito chegarem
        await wait(3000);
        const elapsed = Date.now() - startLoad;
        const received = botB.receivedMsgs.filter(m => m.text && m.text.startsWith('SUST-')).length;
        const elapsedS = Math.round(elapsed / 1000);
        // FIX V6-CARGA-SUSTENTADA: reportar taxa real (msgs/s) e alertar sobre
        // overhead de tempo excessivo. O loop de 30 iterações de 1s deveria
        // terminar em ~30s; valores muito acima indicam latência acumulada na
        // rede WebRTC que pode mascarar problemas de desempenho.
        const msgPerSec = (received / (elapsed / 1000)).toFixed(2);
        const overheadPct = Math.round(((elapsed - 30000) / 30000) * 100);
        const sustainedOk = received >= 28; // permite até 2 perdas
        addAudit(sustainedOk ? 'SUCCESS' : 'ERROR',
          `Carga sustentada: ${received}/30 msgs em ${elapsedS}s | taxa real: ${msgPerSec} msgs/s | overhead: +${overheadPct}%`);
        if (overheadPct > 40) {
          addAudit('WARN', `⚠️ Overhead de tempo alto (+${overheadPct}%): latência WebRTC está acumulando por iteração. Considere verificar congestionamento de rede ou aumentar o intervalo entre mensagens.`);
        }
        testResults[sustainedOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(92);

      // ---------- 11. Failover (se houver servidor externo) ----------
      if (testFailover && externalServer && bots.length >= 1) {
        addAudit('WARN', '💥 SIMULANDO QUEDA do servidor K10-CENTRAL');
        // FIX V5-FAILOVER: fecha a conexão de TODOS os bots com o primário
        // (antes só fechava bots[0]) e aguarda reconexão real ao backup.
        // Os bots tentam reconectar via connectWithRetry ao detectar queda.
        // Adicionamos o externalServer às conns antes da queda para que
        // connectWithRetry tenha o alvo disponível.
        for (const b of bots) {
          connectWithRetry(b, externalServer, 0); // registra o backup antes da queda
        }
        await wait(1000); // pequena janela para registrar antes de derrubar
        const failStart = Date.now();
        for (const b of bots) {
          const c = b.conns.get(MINI_SERVER_ID);
          if (c) { try { c.close(); } catch(e) {} }
        }
        addAudit('INFO', `⏳ Aguardando reconexão de ${bots.length} bot(s) a ${externalServer}...`);
        // Polling: aguarda até 10s para que os bots reconectem
        const FAILOVER_TIMEOUT = 10000;
        const POLL = 500;
        let elapsed2 = 0;
        let migrated = 0;
        while (elapsed2 < FAILOVER_TIMEOUT) {
          await wait(POLL);
          elapsed2 += POLL;
          migrated = bots.filter(b => b.conns.has(externalServer) && b.conns.get(externalServer).open).length;
          if (migrated >= bots.length) break;
        }
        const failoverTime = Date.now() - failStart;
        const failoverOk = migrated >= Math.ceil(bots.length * 0.8);
        addAudit(failoverOk ? 'SUCCESS' : 'ERROR', `Failover: ${migrated}/${bots.length} bots reconectados a ${externalServer} em ${failoverTime}ms`);
        testResults[failoverOk ? 'pass' : 'fail']++;
        updateStats(testResults.pass, testResults.fail);
      }
      updateProgress(96);

      // ---------- 12. Integridade do Diretório ----------
      if (testDiretorio && bots.length >= 1) {
        addAudit('INFO', '📂 VALIDANDO INTEGRIDADE DO DIRETÓRIO (posições únicas por grupo)');
        const groups = new Map();
        for (let b of bots) {
          if (!b.groupId) continue;
          if (!groups.has(b.groupId)) groups.set(b.groupId, []);
          const validPositions = [];
          for (const [srv, _] of b.conns) {
            const posForSrv = b.positionsBySrv ? b.positionsBySrv.get(srv) : undefined;
            if (posForSrv !== undefined && posForSrv >= 0) validPositions.push(`${srv}:${posForSrv}`);
          }
          if (validPositions.length === 0 && b.positionIdx >= 0) {
            validPositions.push(`any:${b.positionIdx}`);
          }
          groups.get(b.groupId).push({ id: b.id, positions: validPositions });
        }

        // FIX V6-DIRETORIO: verificar se algum bot tem posição rastreável.
        // Quando todos os bots ficam com pos=-1 (servidor enviou sufixo fora do
        // formato K10_POS), o teste não tem posições para checar e passaria
        // trivialmente — produzindo um falso positivo silencioso.
        // Solução: contar bots com pelo menos uma posição válida; se nenhum tiver,
        // reportar WARN (inconclusivo) e NÃO incrementar pass ou fail.
        const botsWithPositions = [...groups.values()]
          .flat()
          .filter(e => e.positions.length > 0).length;
        const totalBotsInGroups = [...groups.values()].flat().length;

        if (totalBotsInGroups > 0 && botsWithPositions === 0) {
          addAudit('WARN', `⚠️ Diretório INCONCLUSIVO: ${totalBotsInGroups} bot(s) com pos=-1 — servidor não enviou sufixo no formato K10_POS. Verifique o protocolo peer-list do servidor.`);
          // Não conta como pass nem fail — resultado inconclusivo
          updateStats(testResults.pass, testResults.fail);
        } else {
          let dirOk = true;
          for (let [gid, botEntries] of groups) {
            const srvPositionSets = new Map();
            for (const entry of botEntries) {
              for (const p of entry.positions) {
                const [srv, posStr] = p.split(':');
                if (!srvPositionSets.has(srv)) srvPositionSets.set(srv, new Set());
                const set = srvPositionSets.get(srv);
                if (set.has(posStr)) {
                  addAudit('ERROR', `Grupo ${gid}: posições duplicadas no servidor ${srv}!`);
                  dirOk = false;
                }
                set.add(posStr);
              }
            }
          }
          const coverage = `${botsWithPositions}/${totalBotsInGroups} bots rastreados`;
          addAudit(dirOk ? 'SUCCESS' : 'ERROR', `Diretório ${dirOk ? 'consistente' : 'com colisões'}: ${groups.size} grupo(s), ${coverage}`);
          testResults[dirOk ? 'pass' : 'fail']++;
          updateStats(testResults.pass, testResults.fail);
        }
      }
      updateProgress(100);

      addAudit('SUCCESS', `🎉 TESTE FINALIZADO - PASS: ${testResults.pass}, FAIL: ${testResults.fail}`, { name:'Score', value:testResults.pass, unit:'passes' });
      document.getElementById('testStatus').innerText = '✅ CONCLUÍDO';
    } catch(e) {
      addAudit('ERROR', `❌ Exceção: ${e.message}`);
    } finally {
      stopTest();
    }
  }

  function stopTest() {
    bots.forEach(b => { try { b.peer.destroy(); } catch(e) {} });
    bots = [];
    realUsers.forEach(u => { try { u.peer.destroy(); } catch(e) {} });
    realUsers = [];
    testRunning = false;
    document.getElementById('btnRunTest').disabled = false;
    document.getElementById('btnStopTest').disabled = true;
  }

  function exportAuditLog() {
    const dataStr = JSON.stringify(auditLog, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `k10_audit_${new Date().toISOString()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    addAudit('INFO', '📁 Log exportado como JSON');
  }

  function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // Supressão de erros esperados do PeerJS
  const origErr = console.error;
  console.error = function(...args) {
    if (args[0] && (args[0].includes('is taken') || args[0].includes('Aborting!'))) return;
    origErr.apply(console, args);
  };
</script>
