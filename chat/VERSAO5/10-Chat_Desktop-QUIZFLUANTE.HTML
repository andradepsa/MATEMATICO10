const matrixRtcKey = (pId, callType) => `${pId}:${callType || 'video'}`;
const matrixRtcConfig = () => ({
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ],
  iceTransportPolicy: 'all', bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require'
});

const createMatrixRtcPeer = (remotePeerId, callType, localStream) => {
  const pc = new RTCPeerConnection(matrixRtcConfig());
  const key = matrixRtcKey(remotePeerId, callType);
  matrixRtcRef.current.set(key, pc);
  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      p2pSendDirect(remotePeerId, { type: 'matrix-rtc-ice', callType, candidate: ev.candidate.toJSON ? ev.candidate.toJSON() : ev.candidate });
    }
  };
  pc.ontrack = (ev) => {
    const stream = ev.streams && ev.streams[0] ? ev.streams[0] : new MediaStream([ev.track]);
    setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === remotePeerId && s.type === callType)), { peerId: remotePeerId, stream, type: callType }]);
  };
  pc.onconnectionstatechange = () => {
    if (['failed','closed','disconnected'].includes(pc.connectionState)) {
      matrixRtcRef.current.delete(key);
      if (pc.connectionState !== 'disconnected') endCall(remotePeerId, callType);
    }
  };
  if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  const call = { peer: remotePeerId, metadata: { type: callType, via: 'matrix' }, __matrixRtc: true, close: () => { try { pc.close(); } catch(e) {} } };
  return { pc, call };
};

const startMatrixRtcCall = async (remotePeerId, callType, localStream) => {
  const { pc, call } = createMatrixRtcPeer(remotePeerId, callType, localStream);
  setActiveCalls(prev => [...prev.filter(c => !(c.peerId === remotePeerId && c.type === callType)), { peerId: remotePeerId, call, localStream, type: callType, direction: 'outgoing', isTemporaryStream: false }]);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await p2pSendDirect(remotePeerId, { type: 'matrix-rtc-offer', callType, sdp: offer, senderName: userNameRef.current || userName, time: formatTime(new Date()) });
  return call;
};

const handleMatrixRtcSignal = async (data, pId) => {
  const callType = data.callType || 'video';
  const key = matrixRtcKey(pId, callType);
  if (data.type === 'matrix-rtc-offer') {
    if (!directPeersRef.current.has(pId)) {
      directPeersRef.current.add(pId);
      setDirectPeers(prev => { const s = new Set(prev); s.add(pId); return s; });
    }
    const constraints = callType === 'voice' ? { audio: true, video: false } : { audio: true, video: true };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    localStreamsRef.current.set(pId + '_' + callType, stream);
    if (callType === 'video') {
      setIsLocalVideoVisible(true);
      if (localVideoRef.current) localVideoRef.current.srcObject = stream;
    }
    const { pc, call } = createMatrixRtcPeer(pId, callType, stream);
    setActiveCalls(prev => [...prev.filter(c => !(c.peerId === pId && c.type === callType)), { peerId: pId, call, localStream: stream, type: callType, direction: 'incoming', isTemporaryStream: false }]);
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await p2pSendDirect(pId, { type: 'matrix-rtc-answer', callType, sdp: answer, senderName: userNameRef.current || userName, time: formatTime(new Date()) });
    return true;
  }
  if (data.type === 'matrix-rtc-answer') {
    const pc = matrixRtcRef.current.get(key);
    if (pc && data.sdp) await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    return true;
  }
  if (data.type === 'matrix-rtc-ice') {
    const pc = matrixRtcRef.current.get(key);
    if (pc && data.candidate) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    return true;
  }
  if (data.type === 'matrix-rtc-hangup') {
    const pc = matrixRtcRef.current.get(key);
    if (pc) { try { pc.close(); } catch(e) {} matrixRtcRef.current.delete(key); }
    endCall(pId, callType);
    return true;
  }
  return false;
};

// ══════════════════════════════════════════════════════════════
// ── UNIFIED BROADCAST SYSTEM ────────────────────────────────
// Código ÚNICO para todas as transmissões (Radio, YouTube, IPTV)
// Todas usam p2pBroadcast() = Matrix DM + PeerJS fallback
// ══════════════════════════════════════════════════════════════

const unifiedBroadcastStart = (broadcastType, data) => {
  const ts = Date.now();
  const radioId = peerId + '_' + broadcastType + '_' + ts;
  let payload, updateState;

  switch (broadcastType) {
    case 'radio':
      payload = {
        type: 'radio-world-start', id: radioId + '_start', radioId,
        fileName: data.name, streamUrl: data.url,
        sender: peerId, senderName: userName, ttl: 15
      };
      updateState = () => {
        setUserRadios(prev => ({ ...prev, [peerId]: { url: data.url, name: data.name, radioId, senderName: userName, streamId: radioId } }));
      };
      break;
    case 'youtube':
      payload = {
        type: 'radio-youtube-start', id: radioId + '_start', radioId,
        youtubeId: data.youtubeId,
        sender: peerId, senderName: userName, ttl: 15
      };
      updateState = () => {
        // FIX BUG-YT-STREAMID: guarda o radioId real para uso no publishStop
        window.__k10YtStreamIds = window.__k10YtStreamIds || {};
        window.__k10YtStreamIds[peerId] = radioId;
        setUserYoutubeStreams(prev => ({ ...prev, [peerId]: data.youtubeId }));
      };
      break;
    case 'iptv':
      payload = {
        type: 'iptv-start', id: radioId,
        url: data.url, name: data.name, country: data.country, flag: data.flag,
        sender: peerId, senderName: userName, ttl: 15
      };
      updateState = () => {
        setUserIptvStreams(prev => ({ ...prev, [peerId]: { url: data.url, name: data.name, country: data.country, flag: data.flag, senderName: userName, streamId: radioId } }));
      };
      break;
    default: return;
  }

  seenMessagesRef.current.add(payload.id);
  p2pBroadcast(payload); // Matrix DM + PeerJS — SEMPRE ambos
  // FIX CRÍTICO: envia também pela Sala Matrix Geral (igual quiz/ytchat)
  if (typeof window.enviarParaMatrix === 'function') {
    try { window.enviarParaMatrix('__K10BROADCAST__:' + JSON.stringify(payload)); } catch(e) {}
  }
  updateState();
  // ── Registra no servidor de telemetria para late-joiners ──
  try {
    window.K10BroadcastRegistry?.publish({
      broadcastType,
      streamId: radioId,
      peerId,
      senderName: userName,
      ...data,           // url, name, flag, country, youtubeId, etc.
      id: undefined      // remove id duplicado do payload
    });
  } catch(e) {}
};

const unifiedBroadcastStop = (broadcastType) => {
  const ts = Date.now();
  let payload, updateState, condition;

  switch (broadcastType) {
    case 'radio':
      if (!userRadios[peerId]) return;
      payload = { type: 'radio-world-stop', id: peerId + '_wr_stop_' + ts, sender: peerId, senderName: userName, ttl: 15 };
      updateState = () => setUserRadios(prev => { const n = { ...prev }; delete n[peerId]; return n; });
      break;
    case 'youtube':
      if (!userYoutubeStreams[peerId]) return;
      payload = { type: 'radio-youtube-stop', id: peerId + '_yt_stop_' + ts, sender: peerId, senderName: userName, ttl: 15 };
      updateState = () => setUserYoutubeStreams(prev => { const n = { ...prev }; delete n[peerId]; return n; });
      break;
    case 'iptv':
      if (!userIptvStreams[peerId]) return;
      payload = { type: 'iptv-stop', id: peerId + '_iptv_stop_' + ts, sender: peerId, senderName: userName, ttl: 8 };
      updateState = () => setUserIptvStreams(prev => { const n = { ...prev }; delete n[peerId]; return n; });
      break;
    default: return;
  }

  seenMessagesRef.current.add(payload.id);
  p2pBroadcast(payload); // Matrix DM + PeerJS — SEMPRE ambos
  // FIX CRÍTICO: stop também vai pela Sala Matrix Geral
  if (typeof window.enviarParaMatrix === 'function') {
    try { window.enviarParaMatrix('__K10BROADCAST__:' + JSON.stringify(payload)); } catch(e) {}
  }
  updateState();
  // ── Remove do servidor de telemetria ──
  try {
    // FIX BUG-YT-STREAMID: youtube usava userYoutubeStreams[peerId] (= youtubeId string),
    // não o radioId real. Agora lemos de window.__k10YtStreamIds que guarda o radioId correto.
    const sid = broadcastType==='iptv'    ? userIptvStreams[peerId]?.streamId
              : broadcastType==='radio'   ? userRadios[peerId]?.streamId
              : broadcastType==='youtube' ? (window.__k10YtStreamIds?.[peerId] || null)
              : null;
    if(sid) window.K10BroadcastRegistry?.publishStop(sid, broadcastType, peerId);
  } catch(e) {}
};

const p2pSendDirect = async (targetId, payload) => {
  let sent = false;
  // FASE 2/3: Matrix DM é o transporte primário user↔user para mensagens, ferramentas,
  // arquivos/áudios em chunks e pré-sinalização de chamadas — sem gateway/servidor/grupo K10.
  if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(targetId)) {
    try {
      await window.MxDM.send(targetId, { ...payload, direct: payload.direct !== false, recipient: targetId, sender: payload.sender || peerIdRef.current || peerId });
      sent = true;
    } catch(e) { console.warn('[MxDM] Direct send error:', e); }
  }

  if (!sent) {
    const conn = connectionsRef.current.find(c => c.peer === targetId);
    if (conn && conn.open) {
      try {
        conn.send(payload);
        sent = true;
      } catch(e) {}
    }
  }
  return sent;
};

const sendChunkedData = (targetId, idKey, dataBlob, typePrefix, metaData) => {
const id = peerId + `_${typePrefix}_` + Date.now();
const reader = new FileReader(); let offset = 0;
const timestamp = new Date(), formattedTime = formatTime(timestamp);
const isFile = typePrefix === 'file';
const localUrl = URL.createObjectURL(dataBlob);
setMessages(prev => { const msg = { ...metaData, [idKey]: id, sender: 'you', recipient: targetId, senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio', sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(), [isFile ? 'fileData' : 'audioData']: localUrl }; const updated = [...prev, msg]; return updated; });

const sendStart = async () => {
  const startSent = await p2pSendDirect(targetId, { type: `${typePrefix}-start`, [idKey]: id, [isFile ? 'fileSize' : 'audioSize']: dataBlob.size, senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(), ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type }) });
  if (!startSent) {
    window.k10Toast(t(langRef.current, 'sendError'), 'error'); // V74-D: langRef evita stale closure
    setMessages(prev => prev.filter(m => m[idKey] !== id));
    return;
  }
  readChunk();
};

const readChunk = () => { const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE); reader.readAsArrayBuffer(chunk); };
reader.onload = async ev => {
const chunkSent = await p2pSendDirect(targetId, { type: `${typePrefix}-chunk`, [idKey]: id, chunk: ev.target.result, offset, direct: true });
if (!chunkSent) { window.k10Toast(t(langRef.current, 'connectionLost'), 'error'); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); return; }
offset += ev.target.result.byteLength;
const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, progress } : m));
if (offset < dataBlob.size) requestAnimationFrame(readChunk);
else setMessages(prev => { const updated = prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: 100 } : m); return updated; });
};
reader.onerror = () => { window.k10Toast(t(langRef.current, 'fileReadError'), 'error'); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); };
sendStart();
};

const callData = activeCallsRef.current.find(c => c.peerId === peerIdToEnd && c.type === callType);
if (callData) {
if (callData.call && callData.call.__matrixRtc) {
  try { p2pSendDirect(peerIdToEnd, { type: 'matrix-rtc-hangup', callType }); } catch(e) {}
  try { matrixRtcRef.current.delete(matrixRtcKey(peerIdToEnd, callType)); } catch(e) {}
}
if (callData.call) callData.call.close();
if (callData.localStream) { callData.localStream.getTracks().forEach(tr => tr.stop()); stopAndRemoveLocalStream(peerIdToEnd + '_' + callType); }
}
setActiveCalls(prev => prev.filter(c => !(c.peerId === peerIdToEnd && c.type === callType)));
setRemoteStreams(prev => prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType)));
const anyVideo = Array.from(localStreamsRef.current.values()).some(s => s.getVideoTracks().some(tr => tr.readyState === 'live'));
if (!anyVideo) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
};

      const q = encodeURIComponent(`site:youtube.com ${filmesQuery.trim()}`);
      const ddgUrl = encodeURIComponent(`https://html.duckduckgo.com/html/?q=${q}`);
      
      const fetchDDG = () => fetch(`https://api.allorigins.win/raw?url=${ddgUrl}`)
        .then(r => r.text())
        .then(t => {
          const itemsMap = new Map();
          Array.from(t.matchAll(/watch%3Fv%3D([a-zA-Z0-9_\-]{11})[^\"]*\">([^<]+)<\/a>/g)).forEach(m => {
            const vId = m[1];
            const title = m[2];
            if (title.includes(' - YouTube') && !itemsMap.has(vId)) {
              itemsMap.set(vId, {
                videoId: vId,
                title: title.replace(' - YouTube', '').replace(/&amp;/g, '&'),
                author: 'YouTube',
                thumb: `https://img.youtube.com/vi/${vId}/mqdefault.jpg`
              });
            }
          });
          const items = Array.from(itemsMap.values()).slice(0, 50);
          if (items.length > 0) return items;
          throw new Error('No results from DDG');
        });

      fetchDDG()
        .then(items => { setFilmesResults(items); setFilmesLoading(false); })

           // Fallback to lemno / piped via cors proxy

                const vId = i.url.split('v=')[1]?.split('&')[0];
                return {
                  videoId: vId || '', title: i.title || '', author: i.uploaderName || '',

  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
<script>
(function() {

    // ==================================================
    // ⚙️ CONFIGURAÇÃO — altere apenas estas variáveis
    // ==================================================
    // ── MATRIX DIRETO — sem proxy ──
    const MATRIX_HS = 'https://matrix.org';
    let   MATRIX_TOKEN = localStorage.getItem('matrixToken') || '';
    let   MATRIX_USER  = localStorage.getItem('matrixUser')  || '';

    // ── SALA FIXA DO MODO GERAL ──────────────────────────────────
    // Sala única de papo livre para a aba Geral.

    const SALA_GERAL_ALIAS  = '!jKDBXnpcIDcjFlVWFz:matrix.org';
    const SALA_GERAL_NOME   = '🗣️ Conversa Geral';


    // ==================================================
    // 🔧 INTERNOS — não precisa alterar
    // ==================================================
    let salasInfo      = [];
    let pollingInterval = null;
    let _salaAtiva      = null;
    let _syncToken      = null;   // Long poll: token global do /sync
    let _longPollAtivo  = false;  // Evita dois loops simultâneos
    const _programStartTime = Date.now(); // Ignora broadcasts anteriores ao início do programa

    // --------------------------------------------------
    // API fetch helper — fetch() com CORS (substitui JSONP)
    // --------------------------------------------------
    // ── MATRIX API — chamadas diretas (sem proxy) ──
    async function matrixGet(path, params = {}) {
        const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
        const sep = path.includes('?') ? '&' : '?';
        const tokenPart = MATRIX_TOKEN ? 'access_token=' + encodeURIComponent(MATRIX_TOKEN) : '';
        const qsFull = [tokenPart, qs].filter(Boolean).join('&');
        const url = MATRIX_HS + path + (qsFull ? sep + qsFull : '');
        const resp = await fetch(url, { signal: AbortSignal.timeout(35000) });
        return resp.json();
    }
    async function matrixPost(path, body = {}) {
        const tokenPart = MATRIX_TOKEN ? '?access_token=' + encodeURIComponent(MATRIX_TOKEN) : '';
        const url = MATRIX_HS + path + tokenPart;
        const resp = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body), signal: AbortSignal.timeout(35000) });
        return resp.json();
    }
    async function matrixPut(path, body = {}) {
        const tokenPart = MATRIX_TOKEN ? '?access_token=' + encodeURIComponent(MATRIX_TOKEN) : '';
        const url = MATRIX_HS + path + tokenPart;
        const resp = await fetch(url, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body), signal: AbortSignal.timeout(35000) });
        return resp.json();
    }

    function escapeHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
    }

    async function resolverRoomId(alias) {
        if (alias && alias.startsWith('!')) return alias; // já é room ID
        try {
            const dados = await matrixGet('/_matrix/client/v3/directory/room/' + encodeURIComponent(alias));
            return dados.room_id || null;
        } catch (e) {
            console.warn(`[Matrix] Erro ao resolver alias ${alias}:`, e);
            return null;
        }
    }

    function injetarMensagemNoChat(sala, mensagem) {
        if (!sala._mensagens) sala._mensagens = [];
        const hora = new Date(mensagem.timestamp).toLocaleTimeString();
        const remetente = mensagem.sender.split(':')[0];
        const body = mensagem.body;

        // ── Detecta YouTube Chat start/stop enviado pela sala Matrix ──
        if (typeof body === 'string' && body.startsWith('__K10YTCHAT_START__:')) {
            if (sala.alias === SALA_GERAL_ALIAS) {
                // Lookback de 2h — alinhado com IPTV/Rádio para late-joiners recuperarem o chat
                if (mensagem.timestamp < Date.now() - 2 * 60 * 60 * 1000) return;
                const yId = body.slice('__K10YTCHAT_START__:'.length).trim();
                if (yId && window.handleIncomingDataRef && window.handleIncomingDataRef.current) {
                    const fakeId = 'ytchat_matrix_' + Date.now();
                    window.handleIncomingDataRef.current(
                        { type: 'youtube-chat-start', id: fakeId, youtubeId: yId, ttl: 0 },
                        mensagem.sender || 'matrix'
                    );
                }
            }
            return;
        }
        if (typeof body === 'string' && body === '__K10YTCHAT_STOP__') {
            if (sala.alias === SALA_GERAL_ALIAS) {
                // Lookback de 2h — alinhado com IPTV/Rádio
                if (mensagem.timestamp < Date.now() - 2 * 60 * 60 * 1000) return;
                if (window.handleIncomingDataRef && window.handleIncomingDataRef.current) {
                    const fakeId = 'ytchat_stop_matrix_' + Date.now();
                    window.handleIncomingDataRef.current(
                        { type: 'youtube-chat-stop', id: fakeId, ttl: 0 },
                        mensagem.sender || 'matrix'
                    );
                }
            }
            return;
        }
        // ── Detecta BROADCAST (radio/youtube/iptv) enviado pela sala Matrix ──
        if (typeof body === 'string' && body.startsWith('__K10BROADCAST__:')) {
            if (sala.alias === SALA_GERAL_ALIAS) {
                // FIX-LATE-JOINER: permite histórico das últimas 2h (em vez de bloquear tudo anterior ao programStartTime)
                // Isso garante que quem entra depois receba transmissões IPTV/Rádio/YouTube ainda ativas
                const BROADCAST_LOOKBACK_MS = 2 * 60 * 60 * 1000; // 2 horas
                if (mensagem.timestamp < Date.now() - BROADCAST_LOOKBACK_MS) return;
                try {
                    const raw = body.slice('__K10BROADCAST__:'.length).trim();
                    const broadcastData = JSON.parse(raw);
                    if (broadcastData && broadcastData.type && window.handleIncomingDataRef && window.handleIncomingDataRef.current) {
                        // Evita processar nosso próprio broadcast (já processado localmente)
                        const myPeerId = localStorage.getItem('p2pChatClientId') || '';
                        if (broadcastData.sender !== myPeerId) {
                            window.handleIncomingDataRef.current(broadcastData, broadcastData.sender || mensagem.sender || 'matrix');
                        }
                    }
                } catch(e) { console.warn('[Matrix Geral] broadcast parse error:', e); }
            }
            return;
        }
        // ── Detecta quiz enviado pela sala Matrix ──
        if (typeof body === 'string' && body.startsWith('__K10QUIZ__:')) {
            if (sala.alias === SALA_GERAL_ALIAS && typeof window._matrixGeralInjetarQuiz === 'function') {
                try {
                    // Remove prefixo __K10QUIZ__: e opcional [K10·nome]
                    const raw = body.slice('__K10QUIZ__:'.length).replace(/^\[K10·[^\]]*\]\s*/, '');
                    const quizData = JSON.parse(raw);
                    window._matrixGeralInjetarQuiz(quizData, remetente || '🤖 Quiz Bot', hora);
                } catch(e) {}
            }
            return; // não adiciona à lista de texto
        }

        // Remove msg local com mesmo texto se existir (evita duplicata)
        const localIdx = sala._mensagens.findIndex(m => m._local && m._texto === body);
        if (localIdx !== -1) sala._mensagens.splice(localIdx, 1);

        sala._mensagens.push({ body, sender: remetente, hora });

        // Atualiza o Modo Geral se a mensagem for da sala geral
        if (sala.alias === SALA_GERAL_ALIAS) {
            renderizarChatGeral();
        }
    }




    async function enviarParaSala(sala, texto) {
        try {
            const txnId = 'k10_' + Date.now();
            const res = await matrixPut(
                `/_matrix/client/v3/rooms/${encodeURIComponent(sala.room_id)}/send/m.room.message/${txnId}`,
                { msgtype: 'm.text', body: texto }
            );
            if (res && res.event_id) return true;
            const motivo = res && res.error ? res.error : (res && res.errcode ? res.errcode : 'falha desconhecida');
            console.error('[Matrix] ❌ Envio rejeitado:', motivo);
            if (res && res.errcode === 'M_UNKNOWN_TOKEN') { MATRIX_TOKEN = ''; localStorage.removeItem('matrixToken'); _matrixSolicitarLogin('Sessão expirada — faça login novamente'); }
            mostrarToast(`❌ Mensagem não enviada: ${motivo}`);
            return false;
        } catch(e) {
            console.error('[Matrix] ❌ Envio falhou:', e);
            mostrarToast('❌ Falha de rede ao enviar mensagem');
            return false;
        }
    }

    // --------------------------------------------------
    // LONG POLL — uma requisição cobre todas as salas
    // O Deno segura a conexão até 25s esperando msg nova
    // Consumo: ~1 req/25s por usuário (vs 1 req/3s antes)
    // --------------------------------------------------
    async function iniciarLongPoll() {
        if (_longPollAtivo) return;
        _longPollAtivo = true;
        console.log('[Matrix] 🔄 Long poll direto iniciado');
        while (true) {
            if (!MATRIX_TOKEN) { await _sleep(3000); continue; }
            const salas = salasInfo.filter(s => s.room_id);
            if (salas.length === 0) { await _sleep(3000); continue; }
            try {
                const roomIds = salas.map(s => s.room_id);
                const filter = JSON.stringify({
                    room: { rooms: roomIds, timeline: { limit: 50, types: ['m.room.message'] }, state: { types: [] }, ephemeral: { types: [] } },
                    presence: { types: [] }, account_data: { types: [] }
                });
                const params = { timeout: 25000, filter };
                if (_syncToken) params.since = _syncToken;
                const _pingT0 = Date.now();
                const dados = await matrixGet('/_matrix/client/v3/sync', params);
                // Atualiza indicador de latência (exclui o long-poll timeout de 25s do cálculo)
                if (_syncToken) _atualizarPing(Date.now() - _pingT0);
                if (dados.errcode === 'M_UNKNOWN_TOKEN') {
                    MATRIX_TOKEN = ''; localStorage.removeItem('matrixToken');
                    _matrixSolicitarLogin('Sessão expirada — faça login novamente');
                    await _sleep(8000); continue;
                }
                if (dados.next_batch) _syncToken = dados.next_batch;
                const joinedRooms = (dados.rooms && dados.rooms.join) || {};
                for (const [roomId, roomData] of Object.entries(joinedRooms)) {
                    const sala = salasInfo.find(s => s.room_id === roomId);
                    if (!sala) continue;
                    for (const ev of (roomData.timeline && roomData.timeline.events || [])) {
                        if (ev.type !== 'm.room.message' || !ev.content || ev.content.msgtype !== 'm.text') continue;
                        if (sala.ultimasMensagens.has(ev.event_id)) continue;
                        sala.ultimasMensagens.add(ev.event_id);
                        injetarMensagemNoChat(sala, { event_id: ev.event_id, sender: ev.sender, body: ev.content.body, timestamp: ev.origin_server_ts, room_id: roomId });
                    }
                }
            } catch(e) {
                console.warn('[Matrix] ⚠️ Long poll erro:', e.message || e);
                await _sleep(5000);
            }
        }
    }

    function _sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    window.enviarParaMatrix = async (texto, indiceSala = 0) => {
        // Prioridade: busca sala Geral pelo flag geral:true (independe da posição no array)
        // Se indiceSala != 0 foi passado explicitamente, usa o índice como antes
        const sala = (indiceSala === 0)
            ? (salasInfo.find(s => s.geral) || salasInfo[0])
            : salasInfo[indiceSala];
        if (sala) await enviarParaSala(sala, texto);
        else console.warn('[Matrix] enviarParaMatrix: Sala Geral ainda não inicializada — mensagem descartada');
    };
    window.getMatrixSalas = () => salasInfo.map((s, i) => ({ indice: i, nome: s.nome, room_id: s.room_id, geral: !!s.geral }));

    function mostrarToast(msg) {
        let t = document.getElementById('matrix-toast');
        if (!t) { t = document.createElement('div'); t.id = 'matrix-toast'; t.className = 'matrix-toast'; document.body.appendChild(t); }
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
    }





    // Helper: atualiza o dot de ping com base em ms
    function _atualizarPing(ms) {
        const dotG = document.getElementById('general-matrix-ping');
        if (dotG) {
            dotG.classList.remove('ping-good','ping-mid','ping-bad','ping-idle');
            if      (ms < 800)  { dotG.classList.add('ping-good'); dotG.title = `Latência: ${ms}ms ✅`; }
            else if (ms < 2500) { dotG.classList.add('ping-mid');  dotG.title = `Latência: ${ms}ms ⚠️`; }
            else                { dotG.classList.add('ping-bad');  dotG.title = `Latência: ${ms}ms ❌`; }
        }
    }





    // ══════════════════════════════════════════════════════════════
    // 🔬 MATRIX DIAGNOSTICS — Relatório completo em tempo real
    // ══════════════════════════════════════════════════════════════

    window._matrixAbrirDiagnostico = function() {
        if (document.getElementById('matrix-diag-modal')) return;
        const modal = document.createElement('div');
        modal.id = 'matrix-diag-modal';
        modal.innerHTML = `
            <div id="matrix-diag-box">
                <div id="matrix-diag-header">
                    <span>🔬 Diagnóstico Matrix K10</span>
                    <button onclick="window._matrixFecharDiagnostico()">✕ Fechar</button>
                </div>
                <div id="matrix-diag-log">
                    <div class="mdiag-line"><span class="mdiag-sys">Pronto. Clique em ▶ Executar para iniciar o diagnóstico completo.</span></div>
                </div>
                <div id="matrix-diag-footer">
                    <button class="mdiag-btn-run"  onclick="window._matrixExecutarDiag()">▶ Executar</button>
                    <button class="mdiag-btn-fix"  onclick="window._matrixAutoFix()">🔧 Auto-Fix</button>
                    <button class="mdiag-btn-copy" onclick="window._matrixCopiarRelatorio()">📋 Copiar</button>
                    <button class="mdiag-btn-close" onclick="window._matrixFecharDiagnostico()">Fechar</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
    };

    window._matrixFecharDiagnostico = function() {
        const m = document.getElementById('matrix-diag-modal');
        if (m) m.remove();
    };

    function _diagLog(msg, tipo) {
        const log = document.getElementById('matrix-diag-log');
        if (!log) return;
        const ts = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = 'mdiag-line';
        line.innerHTML = `<span class="mdiag-ts">[${ts}]</span><span class="mdiag-${tipo||'inf'}">${escapeHtml(String(msg))}</span>`;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
        (window._diagRelatorio = window._diagRelatorio||[]).push(`[${ts}] ${msg}`);
    }

    function _diagSep(titulo) {
        const log = document.getElementById('matrix-diag-log');
        if (!log) return;
        const d = document.createElement('div');
        d.style.cssText = 'padding:8px 0 3px;color:#6366f1;font-weight:800;font-size:10px;letter-spacing:2px;border-top:1px solid #1e293b;margin-top:4px;font-family:"JetBrains Mono",monospace';
        d.textContent = '── ' + titulo + ' ──';
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
        (window._diagRelatorio = window._diagRelatorio||[]).push('\n── ' + titulo + ' ──');
    }

    window._matrixExecutarDiag = async function() {
        const log = document.getElementById('matrix-diag-log');
        if (log) log.innerHTML = '';
        window._diagRelatorio = [];
        window._diagUserId   = null;
        window._diagEventId  = null;

        // ── 1. PROXY ──
        _diagSep('1. PROXY GAS');
        _diagLog('Servidor: ' + MATRIX_HS, 'inf');
        let proxyOk = !!MATRIX_TOKEN;
        if (!MATRIX_TOKEN) { _diagLog('❌ Não está logado — clique em 🔑 Login', 'err'); return; }
        _diagLog('✅ Token presente no localStorage', 'ok');

        // ── 2. TOKEN / WHOAMI direto ──
        _diagSep('2. TOKEN — AUTENTICAÇÃO');
        try {
            const r = await matrixGet('/_matrix/client/v3/account/whoami');
            if (r && r.user_id) {
                _diagLog('✅ Conta: ' + r.user_id, 'ok');
                window._diagUserId = r.user_id;
            } else {
                _diagLog('❌ Token inválido: ' + JSON.stringify(r), 'err');
                _diagLog('👉 Clique em 🔑 Login para gerar novo token.', 'warn');
            }
        } catch(e) { _diagLog('❌ Erro whoami: ' + e.message, 'err'); }

        // ── 3. SALAS ──
        _diagSep('3. SALAS CARREGADAS');
        _diagLog('Total em salasInfo: ' + salasInfo.length, 'inf');
        salasInfo.forEach(s => _diagLog(
            (s.room_id ? '✅' : '❌') + ' ' + s.nome + ' → ' + (s.room_id || 'SEM room_id'),
            s.room_id ? 'ok' : 'err'
        ));

        // ── 4. LEITURA ──
        _diagSep('4. LEITURA DE MENSAGENS');
        for (const sala of salasInfo.slice(0,3)) {
            if (!sala.room_id) { _diagLog('⏭ ' + sala.nome + ' sem room_id', 'warn'); continue; }
            try {
                const _rd = await matrixGet(`/_matrix/client/v3/rooms/${encodeURIComponent(sala.room_id)}/messages`, { dir: 'b', limit: 2 });
                const r = { mensagens: (_rd.chunk||[]).filter(e=>e.type==='m.room.message').map(e=>({sender:e.sender, body:e.content?.body})) };
                if (r && Array.isArray(r.mensagens)) {
                    if (r.mensagens.length > 0)
                        _diagLog('✅ ' + sala.nome + ': ' + r.mensagens.length + ' msg(s) lida(s). Último sender: ' + r.mensagens[0].sender, 'ok');
                    else
                        _diagLog('⚠️ ' + sala.nome + ': lista vazia (bot fora da sala ou sala vazia)', 'warn');
                } else {
                    _diagLog('❌ ' + sala.nome + ': ' + JSON.stringify(r).slice(0,100), 'err');
                }
            } catch(e) { _diagLog('❌ ' + sala.nome + ': ' + e.message, 'err'); }
        }

        // ── 5. ENVIO ──
        _diagSep('5. ENVIO DE MENSAGEM (teste)');
        // Prioriza a sala que teve leitura bem-sucedida (tem mensagens) — evita testar sala que o bot não está
        const salaEnvio = salasInfo.find(s => s.room_id && s._mensagens && s._mensagens.length > 0)
                       || salasInfo.find(s => s.room_id);
        if (salaEnvio) {
            const textoTeste = '[K10·DIAG] Auto-teste ' + new Date().toLocaleTimeString();
            _diagLog('Enviando para: ' + salaEnvio.nome, 'inf');
            try {
                const _txn = 'k10_diag_' + Date.now();
                const r = await matrixPut(`/_matrix/client/v3/rooms/${encodeURIComponent(salaEnvio.room_id)}/send/m.room.message/${_txn}`, { msgtype: 'm.text', body: textoTeste });
                if (r && r.event_id) {
                    _diagLog('✅ Envio OK! event_id: ' + r.event_id, 'ok');
                    window._diagEventId = r.event_id;
                    window._diagSalaEnvio = salaEnvio;
                } else {
                    const motivo = (r && r.erro) ? r.erro : JSON.stringify(r);
                    _diagLog('❌ Envio rejeitado: ' + motivo, 'err');
                    _diagLog('👉 Bot provavelmente fora da sala. Clique em 🔧 Auto-Fix.', 'warn');
                }
            } catch(e) { _diagLog('❌ Erro no envio: ' + e.message, 'err'); }
        } else {
            _diagLog('⏭ Nenhuma sala disponível para teste.', 'warn');
        }

        // ── 6. POLLING ──
        _diagSep('6. POLLING — RECEBER MENSAGENS');
        if (window._diagEventId && window._diagSalaEnvio) {
            _diagLog('Aguardando 5s pelo poll confirmar o envio...', 'inf');
            await new Promise(res => setTimeout(res, 5000));
            const s = salasInfo.find(x => x.room_id === window._diagSalaEnvio.room_id);
            const chegou = s && s.ultimasMensagens && s.ultimasMensagens.has(window._diagEventId);
            if (chegou)
                _diagLog('✅ Polling OK! Mensagem confirmada na fila de recebimento.', 'ok');
            else
                _diagLog('⚠️ Mensagem enviada mas ainda não voltou no poll (delay normal do Matrix ≤30s).', 'warn');
        } else {
            _diagLog('⏭ Pulando (envio não teve sucesso).', 'warn');
        }

        // ── RESUMO ──
        _diagSep('RESUMO FINAL');
        if (window._diagUserId && window._diagEventId)
            _diagLog('🟢 SISTEMA OK — Token válido e envio funcionando!', 'ok');
        else if (window._diagUserId && !window._diagEventId)
            _diagLog('🟡 Token OK mas envio falhou — bot fora da(s) sala(s). Use 🔧 Auto-Fix.', 'warn');
        else
            _diagLog('🔴 Token inválido — configure ACCESS_TOKEN no GAS e faça novo deploy.', 'err');
    };

    window._matrixAutoFix = async function() {
        _diagSep('🔧 AUTO-FIX — ENTRAR NAS SALAS');
        for (const sala of salasInfo) {
            if (!sala.room_id) continue;
            _diagLog('Tentando entrar em: ' + sala.nome + '...', 'inf');
            try {
                const r = await matrixPost(`/_matrix/client/v3/join/${encodeURIComponent(sala.room_id)}`);
                if (r && (r.ok || r.room_id))
                    _diagLog('✅ Entrou em: ' + sala.nome, 'ok');
                else
                    _diagLog('⚠️ ' + sala.nome + ': ' + JSON.stringify(r).slice(0,80), 'warn');
            } catch(e) { _diagLog('❌ ' + sala.nome + ': ' + e.message, 'err'); }
        }
        _diagLog('Auto-fix concluído. Clique em ▶ Executar para confirmar.', 'sys');
    };

    window._matrixCopiarRelatorio = function() {
        const txt = ['=== RELATÓRIO DIAGNÓSTICO MATRIX K10 ===',
                     'Data: ' + new Date().toLocaleString(),
                     'Servidor: ' + MATRIX_HS, '',
                     ...(window._diagRelatorio||['Nenhum diagnóstico executado.'])
                    ].join('\n');
        navigator.clipboard.writeText(txt).then(
            () => mostrarToast('📋 Relatório copiado!'),
            () => prompt('Copie o relatório:', txt)
        );
    };



    // --------------------------------------------------
    // Carrega histórico de uma sala
    // --------------------------------------------------
    async function carregarHistorico(sala, limite = 30) {
        try {
            const dados = await matrixGet(`/_matrix/client/v3/rooms/${encodeURIComponent(sala.room_id)}/messages`, { dir: 'b', limit: Math.min(limite, 50) });
            // Normaliza para o formato esperado
            if (dados.chunk) { dados.mensagens = dados.chunk.filter(ev => ev.type==='m.room.message' && ev.content?.msgtype==='m.text').map(ev => ({ event_id: ev.event_id, sender: ev.sender, body: ev.content.body, timestamp: ev.origin_server_ts })).reverse(); dados.since = dados.start || ''; }
            if (!sala._mensagens) sala._mensagens = [];
            // Guarda o since token para o polling começar a pegar msgs novas daqui
            if (dados.since) sala._sinceToken = dados.since;
            if (dados.mensagens && dados.mensagens.length > 0) {
                for (const msg of dados.mensagens) {
                    if (!sala.ultimasMensagens.has(msg.event_id)) {
                        sala.ultimasMensagens.add(msg.event_id);
                        const hora = new Date(msg.timestamp).toLocaleTimeString();
                        const remetente = msg.sender.split(':')[0];
                        sala._mensagens.push({ body: msg.body, sender: remetente, hora });
                    }
                }
                console.log(`[Matrix] 📜 Histórico: ${dados.mensagens.length} msgs de "${sala.nome}"`);
            }
        } catch (e) {
            console.warn(`[Matrix] ⚠️ Sem histórico para "${sala.nome}":`, e);
        }
    }

    // Aliases das salas que devem ter geral:true (usadas pelo _matrixEnviarHook)
    const ALIASES_GERAL = new Set([
        '#chatk10-geral:matrix.org',
        '!jKDBXnpcIDcjFlVWFz:matrix.org'
    ]);

    // ════════════════════════════════════════════════════════════
    // MODO GERAL — Sala fixa Matrix

    // Login compartilhado: mesmo MATRIX_TOKEN, mesmo longPoll.
    // ════════════════════════════════════════════════════════════

    function _getSalaGeral() {
        return salasInfo.find(s => s.alias === SALA_GERAL_ALIAS);
    }

    async function _initSalaGeral() {
        let sala = _getSalaGeral();
        if (sala) return sala;
        // Resolve room_id a partir do alias
        const roomId = await resolverRoomId(SALA_GERAL_ALIAS);
        if (!roomId) { console.warn('[Geral] ❌ Sala não encontrada:', SALA_GERAL_ALIAS); return null; }
        // Entra na sala se estiver logado
        if (MATRIX_TOKEN) {
            try { await matrixPost(`/_matrix/client/v3/join/${encodeURIComponent(roomId)}`); }
            catch(e) { console.warn('[Geral] join aviso:', e.message); }
        }
        sala = {
            alias: SALA_GERAL_ALIAS, nome: SALA_GERAL_NOME, cat: 'br', geral: true,
            room_id: roomId, ultimasMensagens: new Set(),
            _historicoCarregado: false, _mensagens: [], _sinceToken: null
        };
        salasInfo.push(sala);
        console.log('[Geral] ✅ Sala Geral inicializada:', roomId);
        return sala;
    }

    function garantirOverlayGeral() {
        if (document.getElementById('general-matrix-overlay')) return;
        const container = document.getElementById('general-matrix-content');
        if (!container) return;
        // Remove placeholder se existir
        const ph = document.getElementById('general-matrix-placeholder');
        if (ph) ph.remove();
        const overlay = document.createElement('div');
        overlay.id = 'general-matrix-overlay';
        overlay.innerHTML = `
            <div id="general-matrix-header">
                <div id="general-matrix-title">
                    <span style="font-size:18px">🌐</span>
                    <span>${SALA_GERAL_NOME}</span>
                    <small>Papo livre · Matrix</small>
                </div>
                <span id="general-matrix-ping" class="mx-ping ping-idle" title="Latência">●</span>
                <span class="mx-e2ee-badge">🔒 Matrix</span>
            </div>
            <div id="general-matrix-messages">
                <div id="general-matrix-empty">⏳ Carregando mensagens...</div>
            </div>
            <div id="general-matrix-input-row">
                <input id="general-matrix-input" type="text"
                    placeholder="💬 Mensagem para o Chat Geral..." autocomplete="off" />
                <button id="general-matrix-send" onclick="window._matrixGeralEnviar()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        `;
        container.appendChild(overlay);
        overlay.querySelector('#general-matrix-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') window._matrixGeralEnviar();
        });
    }

    function _renderQuizBubble(m) {
        const qd = m._quizData;
        const qid = qd.quizId;
        const state = _geralQuizzes.get(qid) || { data: qd, myAnswer: null, revealed: false };
        _geralQuizzes.set(qid, state);
        const statusIcon = state.revealed ? '✅' : (state.myAnswer !== null ? '🟢' : '');
        const statusText = state.revealed ? 'Revelado' : (state.myAnswer !== null ? 'Respondido' : 'Responder ↗');
        const btnStyle = state.revealed || state.myAnswer !== null
            ? 'background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3);'
            : 'background:#6366f1;color:#fff;border:none;';
        return `<div class="matrix-chat-bubble" style="cursor:pointer" onclick="if(window._setFloatingQuiz){window._setFloatingQuiz({quizId:'${qid.replace(/'/g,"\\'")}',quizQuestion:${JSON.stringify(qd.quizQuestion||'')},quizOptions:${JSON.stringify(qd.quizOptions||[])},quizCorrect:${qd.quizCorrect},quizSubject:${JSON.stringify(qd.quizSubject||'')},quizImage:${JSON.stringify(qd.quizImage||null)},quizStage:${JSON.stringify(qd.quizStage||null)},quizVotes:{},quizRevealed:false,sender:'quiz',senderName:'🤖 Quiz Bot',type:'quiz-question'})}">
            <div class="matrix-bubble-name">${escapeHtml(m.sender || '🤖 Quiz Bot')}</div>
            <div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0">
                <span style="font-size:16px">🤖</span>
                <span style="flex:1"><b>Quiz:</b> ${escapeHtml(qd.quizQuestion || 'Pergunta')} ${statusIcon}</span>
                <span style="${btnStyle}border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700">${statusText}</span>
            </div>
            <div class="matrix-bubble-time">${m.hora}</div>
        </div>`;
    }

    function renderizarChatGeral() {
        const sala = _getSalaGeral();
        const msgArea = document.getElementById('general-matrix-messages');
        if (!msgArea) return;
        if (!sala || sala._mensagens.length === 0) {
            msgArea.innerHTML = sala && sala._historicoCarregado
                ? '<div id="general-matrix-empty">📭 Nenhuma mensagem ainda. Seja o primeiro!</div>'
                : '<div id="general-matrix-empty">⏳ Carregando mensagens...</div>';
            return;
        }
        msgArea.innerHTML = sala._mensagens.map((m, idx) => {
            // ── Mensagem de Quiz — não renderiza no chat, vai para janela flutuante ──
            if (m._quiz && m._quizData) return '';
            // ── Mensagem de texto normal ──
            const isLocal  = !!m._local;
            const isFailed = !!m._falhou;
            const cls   = isFailed ? 'bubble-failed' : isLocal ? 'bubble-sending' : (m.sender === '👤 Você' ? 'bubble-sent' : '');
            const label = isFailed ? '❌ Você (falhou)' : isLocal ? '⏳ Você (enviando…)' : escapeHtml(m.sender);
            const retry = isFailed
                ? `<span class="matrix-bubble-retry" onclick="window._matrixGeralRetry(${idx})">↩ Tentar novamente</span>`
                : '';
            return `<div class="matrix-chat-bubble ${cls}" data-idx="${idx}">
                <div class="matrix-bubble-name">${label}</div>
                <div>${escapeHtml(m.body)}</div>
                <div class="matrix-bubble-time">${m.hora}${retry}</div>
            </div>`;
        }).join('');
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    // ── Hook de injeção local — usado pelas ferramentas P2P (Quiz, Poll, etc.)
    // Insere uma notificação no overlay do Geral SEM enviar para o servidor Matrix.
    window._matrixGeralInjetarMsg = function(corpo, remetente, hora) {
        const sala = _getSalaGeral();
        const msgArea = document.getElementById('general-matrix-messages');
        if (!sala || !msgArea) return;
        if (!sala._mensagens) sala._mensagens = [];
        const h = hora || new Date().toLocaleTimeString();
        const r = remetente || '👤';
        sala._mensagens.push({ body: corpo, sender: r, hora: h });
        if (sala._mensagens.length > 500) sala._mensagens.shift();
        renderizarChatGeral();
    };

    // ── Mapa de quizzes ativos no overlay do Geral ──
    const _geralQuizzes = new Map(); // quizId → { data, myAnswer, revealed }

    // Sanitiza quizId para usar como atributo HTML id
    function _qSafe(id) { return (id || '').replace(/[^a-zA-Z0-9_-]/g, '_'); }

    // ── Injeta quiz interativo completo no overlay do Geral ──
    // Salva em sala._mensagens para sobreviver ao re-render
    window._matrixGeralInjetarQuiz = function(quizData, remetente, hora) {
        if (!quizData || !quizData.quizId) return;
        const sala = _getSalaGeral();
        // Evita duplicata
        if (sala && sala._mensagens && sala._mensagens.find(m => m._quiz && m._quizData && m._quizData.quizId === quizData.quizId)) return;
        _geralQuizzes.set(quizData.quizId, { data: quizData, myAnswer: null, revealed: false });
        const h = hora || new Date().toLocaleTimeString();
        const r = remetente || '🤖 Quiz Bot';
        if (sala) {
            if (!sala._mensagens) sala._mensagens = [];
            sala._mensagens.push({ _quiz: true, _quizData: quizData, sender: r, hora: h });
            if (sala._mensagens.length > 500) sala._mensagens.shift();
        }
        renderizarChatGeral();
        // ── Abre quiz na janela flutuante automaticamente ──
        if (typeof window._setFloatingQuiz === 'function') {
            window._setFloatingQuiz({ ...quizData, quizVotes:{}, quizRevealed:false, sender:'quiz', senderName:r, type:'quiz-question' });
        }
    };

    // ── Clique numa opção do quiz no overlay Geral ──
    window._geralQuizVotar = function(quizId, optionIndex) {
        const state = _geralQuizzes.get(quizId);
        if (!state || state.myAnswer !== null || state.revealed) return;
        state.myAnswer = optionIndex;
        // Re-render para mostrar estado correto/errado
        renderizarChatGeral();
        // Propaga resposta via React
        if (typeof window._matrixGeralOnQuizAnswer === 'function')
            window._matrixGeralOnQuizAnswer(quizId, optionIndex);
    };

    // ── Reveal da resposta correta no overlay Geral ──
    window._matrixGeralRevealQuiz = function(quizId, correctIdx) {
        const state = _geralQuizzes.get(quizId);
        if (!state) return;
        state.revealed = true;
        state.revealedCorrect = correctIdx;
        renderizarChatGeral();
    };

    window._matrixGeralEnviar = async function() {
        const input = document.getElementById('general-matrix-input');
        if (!input || !input.value.trim()) return;
        // Login sob demanda
        if (!MATRIX_TOKEN) { _matrixSolicitarLogin('Faça login para enviar mensagens'); return; }
        const sala = _getSalaGeral();
        if (!sala || !sala.room_id) { mostrarToast('⏳ Sala ainda carregando...'); return; }
        const texto = input.value.trim();
        input.value = '';
        const nomeK10 = localStorage.getItem('p2pUserName') || '';
        const textoFinal = nomeK10 ? `[K10·${nomeK10}] ${texto}` : texto;
        if (!sala._mensagens) sala._mensagens = [];
        const msgLocal = { body: textoFinal, sender: '👤 Você', hora: new Date().toLocaleTimeString(), _local: true, _texto: textoFinal };
        sala._mensagens.push(msgLocal);
        renderizarChatGeral();
        const ok = await enviarParaSala(sala, textoFinal);
        if (!ok) { msgLocal._falhou = true; delete msgLocal._local; renderizarChatGeral(); }
    };

    window._matrixGeralRetry = async function(idx) {
        const sala = _getSalaGeral();
        if (!sala || !sala._mensagens[idx]) return;
        const m = sala._mensagens[idx];
        m._falhou = false; m._local = true;
        renderizarChatGeral();
        const ok = await enviarParaSala(sala, m._texto || m.body);
        if (!ok) { m._falhou = true; delete m._local; renderizarChatGeral(); }
    };

    window._matrixGeralActive = async function() {
        garantirOverlayGeral();
        const sala = _getSalaGeral();
        if (sala) {
            // Sala já inicializada (pelo startup ou por chamada anterior) — só re-renderiza
            if (!sala._historicoCarregado) {
                sala._historicoCarregado = true;
                await carregarHistorico(sala, 30);
            }
            renderizarChatGeral();
            return;
        }
        // Sala ainda não inicializada (startup ainda não terminou ou falhou) — tenta agora
        const s = await _initSalaGeral();
        if (!s) {
            const msgArea = document.getElementById('general-matrix-messages');
            if (msgArea) msgArea.innerHTML = '<div id="general-matrix-empty">❌ Sala não encontrada. Tente novamente.</div>';
            return;
        }
        if (!s._historicoCarregado) {
            s._historicoCarregado = true;
            await carregarHistorico(s, 30);
        }
        renderizarChatGeral();
    };

    // ════════════════════════════════════════════════════════════
    // --------------------------------------------------
    // LOGIN MATRIX — modal com SSO (Google/GitHub/email) + senha
    // --------------------------------------------------
    function _matrixSolicitarLogin(motivo = '') {
        document.getElementById('matrix-login-overlay')?.remove();
        const ov = document.createElement('div');
        ov.id = 'matrix-login-overlay';
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99999;display:flex;align-items:center;justify-content:center;';
        ov.innerHTML = `
        <div style="background:#1e2030;border:1px solid #4a5568;border-radius:14px;padding:32px;width:360px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.6)">
            <div style="font-size:22px;font-weight:700;color:#e2e8f0;margin-bottom:6px;">🔑 Login Matrix</div>
            ${motivo ? `<div style="color:#fc8181;font-size:13px;margin-bottom:10px;">${motivo}</div>` : ''}
            <div style="color:#a0aec0;font-size:13px;margin-bottom:20px;">Faça login para enviar mensagens</div>

            <!-- SSO: Google / GitHub -->
            <button id="mx-sso-google" style="width:100%;padding:11px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:10px;">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Entrar com Google
            </button>
            <button id="mx-sso-github" style="width:100%;padding:11px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#e2e8f0"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                Entrar com GitHub
            </button>

            <!-- Separador -->
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
                <div style="flex:1;height:1px;background:#4a5568;"></div>
                <span style="color:#718096;font-size:12px;">ou com usuário e senha</span>
                <div style="flex:1;height:1px;background:#4a5568;"></div>
            </div>

            <input id="mx-login-user" type="text" placeholder="@usuario:matrix.org" value="${MATRIX_USER}"
                style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;box-sizing:border-box;margin-bottom:10px;outline:none;">
            <input id="mx-login-pass" type="password" placeholder="Senha"
                style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;box-sizing:border-box;margin-bottom:12px;outline:none;">
            <div id="mx-login-err" style="color:#fc8181;font-size:13px;min-height:18px;margin-bottom:8px;"></div>
            <button id="mx-login-btn" style="width:100%;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
                Entrar
            </button>
            <div style="text-align:center;margin-top:14px;color:#718096;font-size:12px;">
                Não tem conta? <a href="https://app.element.io/#/register" target="_blank" style="color:#667eea;">Criar gratuitamente</a>
            </div>
        </div>`;
        document.body.appendChild(ov);

        const btn  = ov.querySelector('#mx-login-btn');
        const err  = ov.querySelector('#mx-login-err');
        const uInp = ov.querySelector('#mx-login-user');
        const pInp = ov.querySelector('#mx-login-pass');

        // ── Login SSO (Google / GitHub) via Deno relay ──
        // Fluxo: Chat → popup Deno /sso → Google login → Deno /sso/callback → postMessage → Chat
        const SSO_RELAY = 'https://cold-puma-46.andradepsa.deno.net';

        function _ssoLogin(provider) {
            err.style.color = '#68d391';
            err.textContent = '⏳ Abrindo login ' + provider + '...';
            const popup = window.open(
                `${SSO_RELAY}/sso?provider=${provider}`,
                'matrix_sso',
                'width=520,height=640,resizable=yes,scrollbars=yes'
            );
            if (!popup) {
                err.style.color = '#fc8181';
                err.textContent = '❌ Popup bloqueado — permita popups para este site e tente novamente';
                return;
            }
            // Escuta o token enviado pelo Deno callback via postMessage
            function _onMessage(ev) {
                if (!ev.data || ev.data.type !== 'matrix_sso_token') return;
                window.removeEventListener('message', _onMessage);
                if (ev.data.access_token) {
                    _aplicarToken(ev.data.access_token, ev.data.user_id || '');
                } else {
                    err.style.color = '#fc8181';
                    err.textContent = '❌ Token não recebido — tente login com senha';
                }
            }
            window.addEventListener('message', _onMessage);
            // Se o popup fechar sem mandar mensagem
            const watchClose = setInterval(() => {
                if (popup.closed) {
                    clearInterval(watchClose);
                    window.removeEventListener('message', _onMessage);
                    if (!MATRIX_TOKEN) {
                        err.style.color = '#fc8181';
                        err.textContent = 'Janela fechada sem login. Tente novamente.';
                    }
                }
            }, 800);
        }

        ov.querySelector('#mx-sso-google').onclick = () => _ssoLogin('google');
        ov.querySelector('#mx-sso-github').onclick = () => _ssoLogin('github');

        // ── Login com senha ──
        async function _aplicarToken(token, userHint) {
            MATRIX_TOKEN = token;
            localStorage.setItem('matrixToken', token);
            // Verifica quem é
            try {
                const me = await matrixGet('/_matrix/client/v3/account/whoami');
                MATRIX_USER = me.user_id || userHint;
                localStorage.setItem('matrixUser', MATRIX_USER);
            } catch(e) {}
            ov.remove();
            mostrarToast('✅ Login Matrix: ' + MATRIX_USER);
            _longPollAtivo = false;
            _syncToken = null;
            iniciarLongPoll();
        }

        async function doLogin() {
            const user = uInp.value.trim();
            const pass = pInp.value;
            if (!user || !pass) { err.style.color='#fc8181'; err.textContent = 'Preencha usuário e senha'; return; }
            btn.textContent = '⏳ Entrando...';
            btn.disabled = true;
            err.textContent = '';
            try {
                const resp = await fetch(MATRIX_HS + '/_matrix/client/v3/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'm.login.password',
                        identifier: { type: 'm.id.user', user: user.replace(/^@/,'').split(':')[0] },
                        password: pass })
                });
                const data = await resp.json();
                if (data.access_token) {
                    await _aplicarToken(data.access_token, data.user_id || user);
                } else {
                    err.style.color='#fc8181';
                    err.textContent = data.error || data.errcode || 'Usuário ou senha incorretos';
                    btn.textContent = 'Entrar'; btn.disabled = false;
                }
            } catch(e) {
                err.style.color='#fc8181';
                err.textContent = 'Erro de rede: ' + e.message;
                btn.textContent = 'Entrar'; btn.disabled = false;
            }
        }

        btn.addEventListener('click', doLogin);
        pInp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        setTimeout(() => { if (uInp.value) pInp.focus(); else uInp.focus(); }, 100);
    }

    // Botão 🔑 login na UI — injetado junto com a sidebar

    async function iniciarMatrix() {
        console.log('[Matrix] 🟢 Iniciando integração v5.0 — Login direto...');
        if (pollingInterval) clearInterval(pollingInterval);

        // Inicializa Sala Geral proativamente (não aguarda o usuário abrir a aba)
        // Isso garante que enviarParaMatrix e o longPoll já incluem a sala desde o início
        _initSalaGeral().then(s => {
            if (s) console.log('[Matrix] ✅ Sala Geral pré-inicializada no startup');
        }).catch(e => console.warn('[Matrix] ⚠️ Sala Geral startup init falhou:', e.message));

        iniciarLongPoll();
        console.log('[Matrix] ✅ Long poll ativo.');
        // Login só aparece quando o usuário tentar enviar — não interrompe a navegação

    }




    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(iniciarMatrix, 2000));
    } else {
        setTimeout(iniciarMatrix, 2000);
    }

})();
</script>

  let roomMap = {};
  try { peerMap = JSON.parse(localStorage.getItem(MAP_KEY)  || '{}'); } catch(e){}
  try { roomMap = JSON.parse(localStorage.getItem(ROOM_KEY) || '{}'); } catch(e){}

  const saveMaps = () => {
    localStorage.setItem(MAP_KEY,  JSON.stringify(peerMap));
    localStorage.setItem(ROOM_KEY, JSON.stringify(roomMap));
  };

  const abToB64 = (ab) => {
    const bytes = ab instanceof Uint8Array ? ab : new Uint8Array(ab);
    let bin = '';
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    return btoa(bin);
  };
  const b64ToAb = (b64) => {
    const bin = atob(b64 || '');
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  };
  const encodePayload = (value) => {
    if (value instanceof ArrayBuffer) return { __mxdmBinary: 'arraybuffer', data: abToB64(value) };
    if (ArrayBuffer.isView(value)) return { __mxdmBinary: value.constructor && value.constructor.name || 'typedarray', data: abToB64(value) };
    if (Array.isArray(value)) return value.map(encodePayload);
    if (value && typeof value === 'object') {
      const out = {};
      for (const [k,v] of Object.entries(value)) out[k] = encodePayload(v);
      return out;
    }
    return value;
  };
  const decodePayload = (value) => {
    if (value && typeof value === 'object' && value.__mxdmBinary) return b64ToAb(value.data);
    if (Array.isArray(value)) return value.map(decodePayload);
    if (value && typeof value === 'object') {
      const out = {};
      for (const [k,v] of Object.entries(value)) out[k] = decodePayload(v);
      return out;
    }
    return value;
  };

  async function api(method, path, body, params) {
    const url = new URL(HS + path);
    if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const headers = { 'Content-Type': 'application/json' };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    const res = await fetch(url.toString(), {
      method, headers, body: body ? JSON.stringify(body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch(e){}
    if (!res.ok && data.errcode) data._httpStatus = res.status;
    return data;
  }

  async function login(user, pass) {
    const r = await api('POST', '/_matrix/client/v3/login', {
      type: 'm.login.password',
      identifier: { type: 'm.id.user', user },
      password: pass,
      initial_device_display_name: 'Chat K10 MxDM'
    });
    if (r.access_token) {
      TOKEN = r.access_token;
      MY_MXID = r.user_id;
      localStorage.setItem(TOKEN_KEY, TOKEN);
      localStorage.setItem('mxdmMxid', MY_MXID);
      console.log('[MxDM] login ok →', MY_MXID);
      startSync();
      return true;
    }
    console.error('[MxDM] login failed:', r);
    return false;
  }

  async function ensureRoom(peerId) {
    if (roomMap[peerId]) return roomMap[peerId];
    const mxid = peerMap[peerId];
    if (!mxid) throw new Error('No mxid mapped for peer ' + peerId);
    const r = await api('POST', '/_matrix/client/v3/createRoom', {
      preset: 'trusted_private_chat',
      invite: [mxid],
      is_direct: true,
      visibility: 'private'
    });
    if (!r.room_id) throw new Error('createRoom failed: ' + JSON.stringify(r));
    roomMap[peerId] = r.room_id;
    saveMaps();
    return r.room_id;
  }

  async function send(peerId, payload) {
    if (!TOKEN) throw new Error('MxDM not logged in');
    const roomId = await ensureRoom(peerId);
    const txnId  = 'mxdm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const body = {
      msgtype: CUSTOM_MSGTYPE,
      body: '[K10 payload]',
      'm.k10': encodePayload(payload)
    };
    const r = await api('PUT',
      `/_matrix/client/v3/rooms/${encodeURIComponent(roomId)}/send/m.room.message/${txnId}`,
      body
    );
    if (!r.event_id) throw new Error('send failed: ' + JSON.stringify(r));
    return r.event_id;
  }

  async function broadcast(payload, options) {
    const ids = Object.keys(peerMap).filter(Boolean);
    const results = [];
    for (const pid of ids) {
      try { results.push(await send(pid, payload)); }
      catch(e) { console.warn('[MxDM] broadcast fail →', pid, e); }
    }
    return results;
  }

  function canSend(peerId) {
    return !!(TOKEN && peerMap[peerId]);
  }

  function mapPeer(peerId, mxid) {
    if (!peerId || !mxid) return;
    peerMap[peerId] = mxid;
    saveMaps();
    console.log('[MxDM] mapped', peerId, '↔', mxid);
  }

  function unmapPeer(peerId) {
    if (!peerId) return;
    delete peerMap[peerId];
    delete roomMap[peerId];
    saveMaps();
  }

  // ── Sync paralelo: entrega payloads K10 recebidos para handleIncomingDataRef ──
  let syncRunning = false;
  async function startSync() {
    if (syncRunning || !TOKEN) return;
    syncRunning = true;
    while (TOKEN) {
      try {
        const filter = JSON.stringify({
          room: { timeline: { limit: 50, types: ['m.room.message'] }, state: { types: [] }, ephemeral:{types:[]} },
          presence:{types:[]}, account_data:{types:[]}
        });
        const params = { timeout: 25000, filter };
        if (SINCE) params.since = SINCE;
        const data = await api('GET', '/_matrix/client/v3/sync', null, params);
        if (data.errcode === 'M_UNKNOWN_TOKEN') { TOKEN=''; localStorage.removeItem(TOKEN_KEY); break; }
        if (data.next_batch) { SINCE = data.next_batch; localStorage.setItem(SINCE_KEY, SINCE); }

        const invited = (data.rooms && data.rooms.invite) || {};
        for (const roomId of Object.keys(invited)) {
          await api('POST', `/_matrix/client/v3/rooms/${encodeURIComponent(roomId)}/join`, {});
        }

        const joined = (data.rooms && data.rooms.join) || {};
        for (const [roomId, rd] of Object.entries(joined)) {
          for (const ev of (rd.timeline && rd.timeline.events || [])) {
            if (ev.type !== 'm.room.message') continue;
            if (ev.sender === MY_MXID) continue;
            const raw = ev.content && ev.content['m.k10'];
            if (!raw) continue;
            const k10 = decodePayload(raw);
            let fromPeer = Object.keys(peerMap).find(pid => peerMap[pid] === ev.sender);
            if (!fromPeer && k10.sender) {
              fromPeer = k10.sender;
              mapPeer(fromPeer, ev.sender);
              roomMap[fromPeer] = roomId; saveMaps();
            }
            if (!fromPeer) continue;
            try {
              const fn = (window.handleIncomingDataRef && window.handleIncomingDataRef.current)
                       || window._k10HandleIncomingData;
              if (fn) fn(k10, fromPeer);
              else console.warn('[MxDM] handleIncomingData not exposed yet, dropping payload');
            } catch(e) { console.error('[MxDM] dispatch error', e); }
          }
        }
      } catch(e) {
        console.warn('[MxDM] sync error', e);
        await new Promise(r => setTimeout(r, 4000));
      }
    }
    syncRunning = false;
  }

  function promptLogin() {
    const u = prompt('MxDM · usuário Matrix (ex: alice em matrix.org):');
    if (!u) return;
    const p = prompt('MxDM · senha:');
    if (!p) return;
    login(u, p).then(ok => window.k10Toast(ok ? '✅ Logado em '+HS : '❌ Falha de login', ok ? 'success' : 'error'));
  }

  window.MxDM = {
    HS, get token(){return TOKEN;}, get mxid(){return MY_MXID;},
    login, send, broadcast, canSend, mapPeer, unmapPeer, ensureRoom, promptLogin,
    map: peerMap, rooms: roomMap,
    encodePayload, decodePayload,
    setHomeserver(url){ localStorage.setItem('mxdmHomeserver', url); location.reload(); }
  };

  if (TOKEN) startSync();
  console.log('[MxDM] phase2/3 ready · token?', !!TOKEN, '· mxid:', MY_MXID || '(none)');
  console.log('[MxDM] use MxDM.promptLogin() · MxDM.mapPeer(peerId,"@user:matrix.org")');
})();
</script>



<!-- ================================================================
     K10 TELEMETRIA AVANÇADA v5 — Chat Desktop
     CANAL PRINCIPAL: Matrix (sala oculta #k10-telemetria:HOMESERVER)
     CANAL FALLBACK:  PeerJS → K10-MON
     
     Quando o usuário faz login no Matrix (para Geral/Grupos),
     o mesmo token é usado para entrar silenciosamente na sala de
     telemetria e postar eventos m.k10.telemetry.
     Todos os monitores logados na mesma sala recebem em tempo real.
     ================================================================ -->
<script>
(function(){
    'use strict';

    /* ══ CONFIG ══════════════════════════════════════════════ */
    const MONITOR_ID        = 'K10-MON';
    const INTERVALO_REENVIO = 90_000;
    const MAX_TENTATIVAS    = 30;

    /* ══ ESTADO ══════════════════════════════════════════════ */
    let tentativas   = 0;
    let geoCache     = null;
    let timerReenvio = null;
    let mxRoomId     = localStorage.getItem('k10TelemetriaRoomId') || null;
    let mxRoomTentou = false;

    /* ══ GEO — fallback em cadeia ════════════════════════════ */
    const GEO_PROVIDERS = [
        {
            url: 'https://get.geojs.io/v1/ip/geo.json',
            parse: d => ({ ip:d.ip, city:d.city, region:d.region, country:d.country,
                countryCode:d.country_code, lat:parseFloat(d.latitude),
                lon:parseFloat(d.longitude), isp:d.organization_name,
                org:d.organization_name, geoTimezone:d.timezone }),
            check: d => d.ip && d.city && d.latitude
        },
        {
            url: 'https://ipinfo.io/json',
            parse: d => { const [lat,lon]=(d.loc||',').split(',');
                return { ip:d.ip, city:d.city, region:d.region, country:null,
                    countryCode:d.country, lat:parseFloat(lat), lon:parseFloat(lon),
                    isp:d.org, org:d.org, geoTimezone:d.timezone }; },
            check: d => d.ip && d.city && d.loc
        },
        {
            url: 'https://www.iplocate.io/api/lookup',
            parse: d => ({ ip:d.ip, city:d.city, region:d.subdivision, country:d.country,
                countryCode:d.country_code, lat:d.latitude, lon:d.longitude,
                isp:d.org, org:d.org, geoTimezone:d.time_zone }),
            check: d => d.ip && d.city && d.latitude
        }
    ];

    /* ══ UTILITÁRIOS ════════════════════════════════════════ */
    function parseBrowser(ua){
        if(!ua) return {browser:'Unknown',os:'Unknown'};
        let b='Other',o='Other';
        if(/Edg\//.test(ua))           b='Edge';
        else if(/OPR\/|Opera/.test(ua))b='Opera';
        else if(/YaBrowser/.test(ua))  b='Yandex';
        else if(/SamsungBrowser/.test(ua))b='Samsung';
        else if(/Chrome\//.test(ua))   b='Chrome';
        else if(/Firefox\//.test(ua))  b='Firefox';
        else if(/Safari\//.test(ua))   b='Safari';
        if(/Windows NT 1[01]/.test(ua))o='Windows 10/11';
        else if(/Windows NT 6/.test(ua))o='Windows 7/8';
        else if(/Mac OS X/.test(ua))   o='macOS';
        else if(/Android/.test(ua))    o='Android';
        else if(/iPhone|iPad/.test(ua))o='iOS';
        else if(/Linux/.test(ua))      o='Linux';
        else if(/CrOS/.test(ua))       o='ChromeOS';
        return {browser:b,os:o};
    }
    function contarConexoes(peer){
        try{
            if(peer._connections instanceof Map) return peer._connections.size;
            if(typeof peer._connections==='object') return Object.keys(peer._connections).length;
        }catch(_){}
        return 0;
    }
    function extrairHS(mxid){ const p=(mxid||'').split(':'); return p.length>1?p.slice(1).join(':'):'matrix.org'; }

    /* ══ GEO ════════════════════════════════════════════════ */
    async function obterGeo(){
        if(geoCache) return geoCache;
        for(const p of GEO_PROVIDERS){
            try{
                const r=await fetch(p.url,{cache:'no-store'});
                const d=await r.json();
                if(!p.check(d)) continue;
                geoCache=p.parse(d);
                return geoCache;
            }catch(_){}
        }
        return null;
    }

    /* ══ MATRIX API (usa token do login já feito no chat) ═══ */
    function mxToken(){ return localStorage.getItem('mxdmToken')||''; }
    function mxHS(){ return (localStorage.getItem('mxdmHomeserver')||'https://matrix.org').replace(/\/+$/,''); }
    function mxMxid(){ return localStorage.getItem('mxdmMxid')||''; }

    async function mxAPI(method, path, body){
        const token=mxToken();
        if(!token) return null;
        try{
            const res=await fetch(mxHS()+path,{
                method,
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                body: body!==undefined ? JSON.stringify(body) : undefined
            });
            return await res.json();
        }catch(_){ return null; }
    }

    /* ══ SALA FIXA DE TELEMETRIA — ID DIRETO ════════════════
       Room ID permanente, nunca muda.
    ═══════════════════════════════════════════════════════ */
    const SALA_ROOM_ID = '!envs-RSauuX1LrriNcVmdwmAGcyVpM0_w8OnC0EZgrQ';

    async function resolverSala(){
        if(mxRoomId)     return true;
        if(mxRoomTentou) return false;
        if(!mxToken())   return false;
        mxRoomTentou = true;
        try{
            mxRoomId = SALA_ROOM_ID;
            await mxAPI('POST','/_matrix/client/v3/join/'+encodeURIComponent(mxRoomId),{});
            return true;
        }catch(_){ return false; }
    }

        /* ══ ENVIO MATRIX ═══════════════════════════════════════ */
    async function enviarMatrix(dados){
        const ok=await resolverSala();
        if(!ok) return false;
        const txnId='k10tel_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        const res=await mxAPI('PUT',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(mxRoomId)+
            '/send/m.k10.telemetry/'+txnId,
            dados);
        return !!res?.event_id;
    }

    /* ══ ENVIO PEERJS (fallback) ═════════════════════════════ */
    function enviarPeerJS(peer, dados){
        try{
            const conn=peer.connect(MONITOR_ID,{reliable:false,serialization:'json'});
            conn.on('open',()=>{
                conn.send(dados);
                setTimeout(()=>{ try{conn.close()}catch(_){} },1500);
            });
            conn.on('error',()=>{});
        }catch(_){}
    }

    /* ══ COLETA E ENVIO DUAL ════════════════════════════════ */
    async function coletarEEnviar(){
        const peer  = window.__PEER__;
        const peerOk= peer && peer.open;
        const mxOk  = !!mxToken();
        if(!peerOk && !mxOk) return;

        const {browser,os}=parseBrowser(navigator.userAgent);
        const geo=await obterGeo();

        const dados={
            type:       'k10-telemetry',
            peerId:     peerOk ? peer.id : ('MX-'+mxMxid()),
            userName:   localStorage.getItem('p2pUserName')||'',
            mxid:       mxMxid(),
            netSize:    window.networkSize||1,
            activeConns:peerOk ? contarConexoes(peer) : 0,
            ua:         navigator.userAgent.slice(0,250),
            browser, os,
            lang:       navigator.language,
            langs:      (navigator.languages||[navigator.language]).join(','),
            screen:     screen.width+'x'+screen.height,
            colorDepth: screen.colorDepth,
            devicePixelRatio: window.devicePixelRatio||1,
            timezone:   Intl.DateTimeFormat().resolvedOptions().timeZone,
            platform:   navigator.platform||'',
            memory:     navigator.deviceMemory||null,
            cores:      navigator.hardwareConcurrency||null,
            touchPoints:navigator.maxTouchPoints||0,
            online:     navigator.onLine,
            timestamp:  Date.now(),
            canal:      mxOk ? 'matrix (#telemetria:matrix.org)' : 'peerjs'
        };
        if(geo) Object.assign(dados,geo);

        /* Canal 1: Matrix (principal) */
        if(mxOk) enviarMatrix(dados);

        /* Canal 2: PeerJS (fallback) */
        if(peerOk) enviarPeerJS(peer,dados);
    }

    /* ══ INICIALIZAÇÃO ══════════════════════════════════════ */
    async function iniciar(){
        const peer  = window.__PEER__;
        const peerOk= peer && peer.open;
        const mxOk  = !!mxToken();
        if(!peerOk && !mxOk){
            if(tentativas++<MAX_TENTATIVAS) setTimeout(iniciar,2000);
            return;
        }
        if(mxOk && !mxRoomId) resolverSala();
        coletarEEnviar();
        if(timerReenvio) clearInterval(timerReenvio);
        timerReenvio=setInterval(coletarEEnviar,INTERVALO_REENVIO);
    }

    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',()=>setTimeout(iniciar,5000));
    } else {
        setTimeout(iniciar,5000);
    }
})();
</script>

</body>
