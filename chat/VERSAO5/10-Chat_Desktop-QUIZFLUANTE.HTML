<!-- ================================================================
     K10 BROADCAST REGISTRY v1
     Usa a mesma sala Matrix de telemetria para registrar TODAS
     as transmissões ativas. Novo usuário consulta os últimos
     5 minutos e recebe automaticamente tudo que está ativo.
     ================================================================ -->
<script>
(function(){
    'use strict';
    const SALA_ROOM_ID = '!envs-RSauuX1LrriNcVmdwmAGcyVpM0_w8OnC0EZgrQ';
    const JANELA_MS    = 5 * 60 * 1000;
    const EV_START     = 'm.k10.broadcast';
    const EV_STOP      = 'm.k10.broadcast.stop';

    function mxToken(){ return localStorage.getItem('mxdmToken')||''; }
    function mxHS(){ return (localStorage.getItem('mxdmHomeserver')||'https://matrix.org').replace(/\/+$/,''); }

    async function mxAPI(method, path, body){
        const token = mxToken();
        if(!token) return null;
        try{
            const res = await fetch(mxHS()+path,{
                method,
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                body: body!==undefined ? JSON.stringify(body) : undefined
            });
            return await res.json();
        }catch(_){ return null; }
    }

    let _joinedRoom = false;
    async function ensureRoom(){
        if(_joinedRoom || !mxToken()) return !!mxToken();
        try{
            await mxAPI('POST','/_matrix/client/v3/join/'+encodeURIComponent(SALA_ROOM_ID),{});
            _joinedRoom = true;
        }catch(_){}
        return _joinedRoom;
    }

    /* Registra início de transmissão */
    async function publish(broadcastData){
        if(!mxToken()) return false;
        await ensureRoom();
        const txnId = 'k10bc_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        const payload = { ...broadcastData, timestamp: Date.now(), _k10bc: 1 };
        const res = await mxAPI('PUT',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(SALA_ROOM_ID)+'/send/'+EV_START+'/'+txnId,
            payload);
        if(res?.event_id) console.log('[K10Registry] broadcast registrado:', broadcastData.broadcastType, broadcastData.streamId);
        return !!res?.event_id;
    }

    /* Registra parada de transmissão */
    async function publishStop(streamId, broadcastType, peerId){
        if(!mxToken()) return false;
        await ensureRoom();
        const txnId = 'k10bcs_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        const res = await mxAPI('PUT',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(SALA_ROOM_ID)+'/send/'+EV_STOP+'/'+txnId,
            { streamId, broadcastType, peerId, timestamp: Date.now(), _k10bc: 1 });
        if(res?.event_id) console.log('[K10Registry] broadcast parado:', broadcastType, streamId);
        return !!res?.event_id;
    }

    /* Busca transmissões dos últimos 5 minutos */
    async function fetchRecent(){
        if(!mxToken()) return [];
        await ensureRoom();
        const cutoff = Date.now() - JANELA_MS;
        const res = await mxAPI('GET',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(SALA_ROOM_ID)+'/messages?dir=b&limit=300');
        if(!res?.chunk) return [];

        const starts = new Map();
        const stops  = new Set();
        for(const ev of res.chunk){
            const c = ev.content;
            if(!c || !c._k10bc) continue;
            if((c.timestamp||0) < cutoff) continue;
            if(ev.type === EV_STOP){ if(c.streamId) stops.add(c.streamId); }
            else if(ev.type === EV_START){ const sid=c.streamId; if(sid && !starts.has(sid)) starts.set(sid,c); }
        }
        const ativos = [];
        for(const [sid,data] of starts){ if(!stops.has(sid)) ativos.push(data); }
        console.log('[K10Registry] transmissoes ativas (5min):', ativos.length);
        return ativos;
    }

    /* Injeta transmissões no estado React como se fossem mensagens P2P */
    async function syncLateJoiner(){
        const ativos = await fetchRecent();
        if(!ativos.length) return;
        for(const bc of ativos){
            try{
                let fakeData = { ...bc };
                // FIX BUG-REGISTRY-SENDER: todos os handlers indexam state por data.sender,
                // mas o registry salva o campo como 'peerId'. Mapear aqui para todos os tipos.
                fakeData.sender     = bc.peerId;
                fakeData.senderName = bc.senderName || bc.peerId;

                if(bc.broadcastType==='iptv'){
                    fakeData.type='iptv-start';
                    fakeData.id=bc.streamId+'_reg_'+Date.now();
                    fakeData.ttl=0;
                    // campos iptv: url, name, country, flag já vêm de ...bc via publish({...data})
                } else if(bc.broadcastType==='radio'){
                    fakeData.type='radio-world-start';
                    fakeData.id=bc.streamId+'_reg_'+Date.now();
                    // FIX BUG-REGISTRY-RADIO: handler usa streamUrl/fileName/radioId
                    fakeData.radioId   = bc.streamId;
                    fakeData.fileName  = bc.name;
                    fakeData.streamUrl = bc.url;
                    fakeData.ttl=0;
                } else if(bc.broadcastType==='youtube'){
                    fakeData.type='radio-youtube-start';
                    fakeData.id=bc.streamId+'_reg_'+Date.now();
                    fakeData.youtubeId=bc.youtubeId;
                    fakeData.ttl=0;
                } else if(bc.broadcastType==='whiteboard'){
                    fakeData.type='whiteboard-session-announce';
                    // FIX BUG-REGISTRY-WB: handler usa owner/ownerName/sessionId
                    fakeData.owner     = bc.peerId;
                    fakeData.ownerName = bc.senderName || bc.peerId;
                    fakeData.sessionId = bc.sessionId || bc.streamId;
                    fakeData.ttl=0;
                } else if(bc.broadcastType==='markdown'){
                    fakeData.type='md-editor-session-announce';
                    // FIX BUG-REGISTRY-MD: handler usa owner/ownerName/sessionId
                    fakeData.owner     = bc.peerId;
                    fakeData.ownerName = bc.senderName || bc.peerId;
                    fakeData.sessionId = bc.sessionId || bc.streamId;
                    fakeData.content=bc.content||'';
                    fakeData.ttl=0;
                } else if(bc.broadcastType==='youtube-chat'){
                    // FIX REGISTRY-YTCHAT: recupera o chat YouTube ao vivo para late-joiners
                    fakeData.type='youtube-chat-start';
                    fakeData.id=bc.streamId+'_reg_'+Date.now();
                    fakeData.youtubeId=bc.youtubeId;
                    fakeData.ttl=0;
                } else { continue; }
                if(typeof window.handleIncomingDataRef?.current==='function'){
                    window.handleIncomingDataRef.current(fakeData, bc.peerId||'__registry__');
                }
                window.k10Toast&&window.k10Toast('📡 Recuperado: '+bc.broadcastType+(bc.name?' · '+bc.name:''),'info',4000);
            }catch(e){ console.warn('[K10Registry] erro ao aplicar:', e); }
        }
    }

    /* ══════════════════════════════════════════════════════
       RELÓGIO DO SERVIDOR DE TELEMETRIA
       Envia um ping ao Matrix, lê o origin_server_ts de
       volta e calcula o offset exato entre relógio local
       e relógio do servidor. Precisão ≈ RTT/2.
    ══════════════════════════════════════════════════════ */
    async function syncClockFromMatrix(){
        if(!mxToken()) return null;
        await ensureRoom();
        const t0 = Date.now();
        const txnId = 'k10clk_'+t0+'_'+Math.random().toString(36).slice(2,6);

        /* 1. Envia evento de ping — o servidor carimbará origin_server_ts */
        const sent = await mxAPI('PUT',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(SALA_ROOM_ID)+
            '/send/m.k10.clock/'+txnId,
            { _k10clk:1, ts_local: t0 });
        const t1 = Date.now();
        if(!sent?.event_id) return null;

        const rtt = t1 - t0;

        /* 2. Busca o evento de volta para ler origin_server_ts */
        const ev = await mxAPI('GET',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(SALA_ROOM_ID)+
            '/event/'+encodeURIComponent(sent.event_id));
        if(!ev?.origin_server_ts) return null;

        /* 3. Calcula offset:
              O servidor processou o evento em origin_server_ts.
              Nosso relógio local quando o servidor processou ≈ t0 + rtt/2.
              Offset = server_ts - local_ts_at_server_moment              */
        const offset = ev.origin_server_ts - (t0 + rtt / 2);

        /* Sanidade: ignora offsets absurdos (>5 min) */
        if(Math.abs(offset) > 300000) {
            console.warn('[K10Clock] offset suspeito, ignorado:', offset);
            return null;
        }

        window.K10ServerClockOffset = offset;
        console.log(`[K10Clock] ✅ sincronizado com servidor Matrix · offset=${Math.round(offset)}ms · RTT=${rtt}ms`);

        /* Dispara evento global para o React atualizar clockOffsetRef */
        window.dispatchEvent(new CustomEvent('k10-clock-sync', { detail: { offset, rtt } }));
        return offset;
    }

    /* trueNow corrigido pelo servidor Matrix */
    function trueNow(){ return Date.now() + (window.K10ServerClockOffset || 0); }

    window.K10BroadcastRegistry = { publish, publishStop, fetchRecent, syncLateJoiner, syncClockFromMatrix, trueNow };
    console.log('[K10BroadcastRegistry] pronto');

    /* Sincroniza o relógio automaticamente assim que o token estiver disponível */
    function tentarSyncClock(tentativas){
        tentativas = tentativas||0;
        if(mxToken()){ syncClockFromMatrix(); return; }
        if(tentativas < 40) setTimeout(()=>tentarSyncClock(tentativas+1), 3000);
    }
    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',()=>setTimeout(tentarSyncClock,6000));
    } else {
        setTimeout(tentarSyncClock,6000);
    }
    /* Re-sincroniza a cada 5 minutos */
    setInterval(()=>{ if(mxToken()) syncClockFromMatrix(); }, 5*60*1000);
})();
</script>
