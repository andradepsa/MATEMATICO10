const WorldRadiosModal = ({ lang, onClose, onBroadcast }) => {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [previewUrl, setPreviewUrl] = useState(null);
  const audioRef = useRef(null);

  const searchRadios = async () => {
    if (!query.trim()) return;
    setLoading(true);
    try {
      const data = await fetchWithFallback(
        RADIO_API_SERVERS,
        (server) => `${server}/json/stations/search?name=${encodeURIComponent(query)}&limit=20&order=clickcount&reverse=true`
      );
      setResults(data);
    } catch (e) {
      console.error(e);
      window.k10Toast('Error searching radios — all servers failed', 'error');
    }
    setLoading(false);
  };

  const togglePreview = (url) => {
    if (previewUrl === url) {
      setPreviewUrl(null);
      if (audioRef.current) {
        audioRef.current.pause();
        audioRef.current.src = '';
      }
    } else {
      setPreviewUrl(url);
      if (audioRef.current) {
        audioRef.current.src = url;
        audioRef.current.play().catch(e => console.error("Preview play error:", e));
      }
    }
  };

  return (
    <div className="media-controls-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="media-controls-modal" style={{ maxWidth: '600px', maxHeight: '80vh', display: 'flex', flexDirection: 'column' }}>

          <h2><i className="fas fa-globe"></i> World Radios</h2>

        <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', padding: '0 20px' }}>
          <input 
            type="text" 
            value={query} 
            onChange={e => setQuery(e.target.value)} 
            placeholder="Search by name or country..." 
            style={{ flex: 1, padding: '10px', borderRadius: '8px', border: '1px solid #334155', background: '#1e293b', color: 'white' }}
            onKeyDown={e => e.key === 'Enter' && searchRadios()}
          />
          <button onClick={searchRadios} style={{ padding: '10px 16px', background: '#2563eb', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
            {loading ? '...' : 'Search'}
          </button>
        </div>

        <div style={{ overflowY: 'auto', flex: 1, display: 'flex', flexDirection: 'column', gap: '8px', padding: '0 20px 20px 20px' }}>
          {results.map((r, i) => (
            <div key={i} style={{ background: '#1e293b', padding: '12px', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

                <div style={{ fontSize: '12px', color: '#94a3b8' }}>{r.country} • {(r.tags || '').split(',').slice(0,3).join(', ')}</div>
              </div>
              <div style={{ display: 'flex', gap: '8px', flexShrink: 0 }}>
                <button 
                  onClick={() => togglePreview(r.url_resolved)}
                  style={{ background: previewUrl === r.url_resolved ? '#ef4444' : '#10b981', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >
                  <i className={`fas ${previewUrl === r.url_resolved ? 'fa-stop' : 'fa-play'}`}></i> {previewUrl === r.url_resolved ? 'Stop' : 'Preview'}
                </button>
                <button 
                  onClick={() => {
                    if (audioRef.current) { audioRef.current.pause(); audioRef.current.src = ''; }
                    onBroadcast(r);
                  }}
                  style={{ background: '#8b5cf6', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >

            </div>
          ))}
          {results.length === 0 && !loading && (
            <div style={{ textAlign: 'center', color: '#64748b', padding: '20px' }}>No radios found.</div>
          )}

        <audio ref={audioRef} style={{ display: 'none' }} />

// ═══════════════════════════════════════════════
// API QUIZ ENGINE — Motor unificado para todas as APIs sem chave
// Cada config: { url()|string, normalize(data) → {pergunta,opcoes[],correta} }
// ═══════════════════════════════════════════════
const _qsh  = a => [...a].sort(() => Math.random() - 0.5);
const _qdec = s => { try { const e = document.createElement('textarea'); e.innerHTML = s; return e.value; } catch(_) { return s; } };
const _qpick = (arr, n) => _qsh(arr).slice(0, n);
const _qrand = (arr) => arr[Math.floor(Math.random() * arr.length)];

const API_QUIZ_CONFIGS = {
  // ── Trivia ──────────────────────────────────────────────────
  opentdb: {
    url: () => 'https://opentdb.com/api.php?amount=1&type=multiple',
    normalize: d => {
      const q = d.results?.[0]; if (!q) return null;
      const correct = _qdec(q.correct_answer);
      const opts = _qsh([...(q.incorrect_answers.map(_qdec)), correct]);
      return { pergunta: `[${_qdec(q.category)}]\n${_qdec(q.question)}`, opcoes: opts, correta: opts.indexOf(correct) };
    }
  },
  triviaapi: {
    url: () => 'https://the-trivia-api.com/v2/questions?limit=1',
    normalize: d => {
      const q = d?.[0]; if (!q) return null;
      const opts = _qsh([...q.incorrectAnswers, q.correctAnswer]);
      return { pergunta: q.question.text, opcoes: opts, correta: opts.indexOf(q.correctAnswer) };
    }
  },
  jservice: {
    url: () => `https://jservice.io/api/random?count=4`,
    normalize: d => {
      if (!Array.isArray(d) || d.length < 4) return null;
      const strip = s => s?.replace(/<[^>]+>/g,'').replace(/\\/g,'').trim() || '';
      const main = d[0];
      const question = strip(main.question); const correct = strip(main.answer);
      if (!question || !correct || correct.length > 60) return null;
      const wrongs = d.slice(1).map(c => strip(c.answer)).filter(a => a && a !== correct && a.length < 60).slice(0,3);
      if (wrongs.length < 3) return null;
      const opts = _qsh([...wrongs, correct]);
      return { pergunta: `📺 ${main.category?.title || 'Jeopardy!'}\n${question}`, opcoes: opts, correta: opts.indexOf(correct) };
    }
  },
  numbers: {
    url: () => { const n = Math.floor(Math.random()*999)+1; return `https://numbersapi.com/${n}/trivia?json`; },
    normalize: d => {
      if (!d.found || !d.text) return null;
      const num = d.number;
      const wrong = _qsh([num+1,num+3,num-2,num*2,num+7,num-5].filter(n=>n>0&&n!==num)).slice(0,3).map(String);
      const opts = _qsh([...wrong, String(num)]);
      return { pergunta: `🔢 Qual número está oculto?\n"${d.text.replace(String(num),'???')}"`, opcoes: opts, correta: opts.indexOf(String(num)) };
    }
  },
  // ── Universos / Personagens ──────────────────────────────────
  pokemon: {
    url: () => `https://pokeapi.co/api/v2/pokemon/${Math.floor(Math.random()*151)+1}`,
    normalize: async d => {
      if (!d.name) return null;
      const type = d.types[0].type.name;
      const ptTypes = {fire:'Fogo',water:'Água',grass:'Planta',electric:'Elétrico',psychic:'Psíquico',normal:'Normal',poison:'Veneno',ground:'Terra',rock:'Pedra',fighting:'Lutador',bug:'Inseto',ghost:'Fantasma',dragon:'Dragão',ice:'Gelo',flying:'Voador',dark:'Sombrio',steel:'Aço',fairy:'Fada'};
      const ptType = ptTypes[type] || type;
      const allTypes = Object.values(ptTypes);
      const wrongs = _qpick(allTypes.filter(t=>t!==ptType),3);
      const opts = _qsh([...wrongs, ptType]);
      return { pergunta: `⚡ Qual é o tipo principal do Pokémon ${d.name.toUpperCase()}?`, opcoes: opts, correta: opts.indexOf(ptType) };
    }
  },
  rickmorty: {
    url: () => `https://rickandmortyapi.com/api/character/${Math.floor(Math.random()*826)+1}`,
    normalize: d => {
      if (!d.name || !d.species) return null;
      const qTypes = ['species','status'];
      const qt = _qrand(qTypes);
      if (qt === 'species') {
        const species = ['Human','Alien','Robot','Cronenberg','Mythological Creature','Animal','Humanoid','Poopybutthole'];
        const correct = d.species; if (!species.includes(correct)) return null;
        const opts = _qsh([..._qpick(species.filter(s=>s!==correct),3), correct]);
        return { pergunta: `🛸 Qual é a espécie de ${d.name}?`, opcoes: opts, correta: opts.indexOf(correct) };
      } else {
        const statuses = ['Alive','Dead','unknown'];
        const correct = d.status; if (!statuses.includes(correct)) return null;
        const opts = _qsh(statuses);
        return { pergunta: `🛸 Qual é o status de ${d.name} em Rick & Morty?`, opcoes: opts, correta: opts.indexOf(correct) };
      }
    }
  },
  harrypotter: {
    url: () => 'https://hp-api.onrender.com/api/characters',
    normalize: d => {
      const houses = ['Gryffindor','Slytherin','Ravenclaw','Hufflepuff'];
      const chars = d.filter(c => c.name && houses.includes(c.house));
      if (!chars.length) return null;
      const char = _qrand(chars);
      const opts = _qsh(houses);
      return { pergunta: `🧙 Em qual casa de Hogwarts está ${char.name}?`, opcoes: opts, correta: opts.indexOf(char.house) };
    }
  },
  starwars: {
    url: () => `https://swapi.dev/api/people/?page=${Math.floor(Math.random()*9)+1}`,
    normalize: async d => {
      const char = _qrand(d.results); if (!char) return null;
      const hw = await fetch(char.homeworld).then(r=>r.json()).catch(()=>null);
      if (!hw?.name) return null;
      const planets = ['Tatooine','Alderaan','Naboo','Coruscant','Kamino','Geonosis','Mustafar','Hoth','Dagobah','Bespin','Endor','Jakku'];
      const correct = hw.name;
      const wrongs = planets.includes(correct) ? _qpick(planets.filter(p=>p!==correct),3) : _qpick(planets,3);
      const opts = _qsh([...wrongs, correct]);
      return { pergunta: `⚔️ Qual é o planeta natal de ${char.name}?`, opcoes: opts, correta: opts.indexOf(correct) };
    }
  },
  chucknorris: {
    url: () => 'https://api.chucknorris.io/jokes/categories',
    normalize: async d => {
      const cat = _qrand(d);
      const joke = await fetch(`https://api.chucknorris.io/jokes/random?category=${cat}`).then(r=>r.json()).catch(()=>null);
      if (!joke?.value) return null;
      const wrongs = _qpick(d.filter(c=>c!==cat),3);
      const opts = _qsh([...wrongs, cat]);
      return { pergunta: `💪 De qual categoria é esta piada do Chuck Norris?\n"${joke.value}"`, opcoes: opts, correta: opts.indexOf(cat) };
    }
  },
  magictg: {
    url: () => `https://api.magicthegathering.io/v1/cards?page=${Math.floor(Math.random()*100)+1}&pageSize=10`,
    normalize: d => {
      const types = ['Creature','Instant','Sorcery','Enchantment','Artifact','Land','Planeswalker'];
      const cards = (d.cards||[]).filter(c => c.name && c.type && types.some(t=>c.type.includes(t)));
      if (!cards.length) return null;
      const card = _qrand(cards);
      const correct = types.find(t=>card.type.includes(t));
      const opts = _qsh([..._qpick(types.filter(t=>t!==correct),3), correct]);
      return { pergunta: `🃏 Qual é o tipo da carta Magic:\n"${card.name}"?`, opcoes: opts, correta: opts.indexOf(correct) };
    }
  },
  digimon: {
    url: () => `https://digi-api.com/api/v1/digimon/${Math.floor(Math.random()*1460)+1}`,
    normalize: d => {
      if (!d.name || !d.levels?.[0]) return null;
      const allLevels = ['Fresh','In Training','Rookie','Champion','Ultimate','Mega','Armor'];
      const correct = d.levels[0].level; if (!allLevels.includes(correct)) return null;
      const opts = _qsh(allLevels).slice(0,4);
      if (!opts.includes(correct)) { opts[3] = correct; }
      const optsF = _qsh(opts);
      return { pergunta: `🦕 Qual é o nível do Digimon ${d.name}?`, opcoes: optsF, correta: optsF.indexOf(correct) };
    }
  },
  dictionary: {
    url: () => {
      const words = ['serendipity','ephemeral','melancholy','ubiquitous','eloquent','resilient','tenacious','enigmatic','pragmatic','nostalgic','benevolent','clandestine','perseverance','ambiguous','luminous','cryptic','whimsical','eloquence','stoic','ethereal'];
      return `https://api.dictionaryapi.dev/api/v2/entries/en/${_qrand(words)}`;
    },
    normalize: d => {
      const entry = d[0]; if (!entry) return null;
      const word = entry.word;
      const def = entry.meanings?.[0]?.definitions?.[0]?.definition;
      if (!def) return null;
      const fakes = [
        'The process of converting light into sound waves','A type of geological formation found near volcanic areas',
        'An ancient navigational instrument used by sailors','The study of microscopic organisms in soil',
        'A ceremonial ritual performed during harvest season','A unit of measurement for electrical resistance'
      ];
      const wrongs = _qpick(fakes,3);
      const opts = _qsh([...wrongs, def]);
      return { pergunta: `📖 Qual palavra em inglês corresponde à definição?\n"${def}"`, opcoes: [..._qpick(['abstract','illuminate','profound','deduce'],3), word].sort(()=>Math.random()-0.5), correta: 0 };
    }
  },
};

// Fetcher genérico — normaliza qualquer API para {pergunta, opcoes, correta}
async function fetchApiQuizQuestion(apiId) {
  const cfg = API_QUIZ_CONFIGS[apiId];
  if (!cfg) return null;
  try {
    const urlStr = typeof cfg.url === 'function' ? cfg.url() : cfg.url;
    const data = await fetch(urlStr).then(r => r.json());
    const result = cfg.normalize(data);
    // normalize pode ser async (ex: starwars busca homeworld)
    return result instanceof Promise ? await result : result;
  } catch(e) {
    console.warn(`[QuizAPI:${apiId}]`, e.message);
    return null;
  }
}

// Cache de imagens: query -> URL  (evita chamar API repetidamente)
// Cache de rodada: guarda SÓ a URL escolhida para etapa 2 reusar a mesma foto
// Limpo a cada nova rodada — nunca acumula no computador do usuário
const _worldImgCache = {};
const _worldImgLocks = {};

async function fetchWorldImage(query, usedImagesSet, syncCallback) {
  if (!Array.isArray(_worldImgCache[query])) {
    _worldImgCache[query] = [];
  }

  if (_worldImgCache[query].length === 0) {
    if (!_worldImgLocks[query]) {
      _worldImgLocks[query] = (async () => {
        const key = getPixabayKey();
        try {
          const url = `https://pixabay.com/api/?key=${key}&q=${encodeURIComponent(query)}&image_type=photo&safesearch=true&per_page=200&orientation=horizontal`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.hits && data.hits.length > 0) {
            let hitsArr = [...data.hits];
            // Fisher-Yates shuffle
            for (let i = hitsArr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [hitsArr[i], hitsArr[j]] = [hitsArr[j], hitsArr[i]];
            }
            _worldImgCache[query] = hitsArr;
            
            // ── SOLUÇÃO 2: Limpeza LRU Simples (Prevenção Memory Leak) ──
            const keys = Object.keys(_worldImgCache);
            if (keys.length > 20) {
              const oldKey = keys.find(k => k !== query);
              if (oldKey) delete _worldImgCache[oldKey];
            }
            
            if (syncCallback) syncCallback(hitsArr);
          }
        } catch(e) { console.warn('Pixabay fetch error', e); } finally {
          _worldImgLocks[query] = null;
        }
      })();
    }
    await _worldImgLocks[query];
  }

  while (_worldImgCache[query].length > 0) {
    const pick = _worldImgCache[query].shift();
    if (usedImagesSet && !usedImagesSet.has(pick.id)) {
       usedImagesSet.add(pick.id);
       return pick; // Retorna todo o objeto 'hit' (incluindo .id e .webformatURL/.largeImageURL)
    }
  }
  return null;
}

// Gera 3 alternativas falsas de um array, evitando o valor correto
function pickFakeAlts(pool, correct, count = 3) {
  const filtered = pool.filter(v => v.toLowerCase() !== correct.toLowerCase());
  const shuffled = filtered.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Monta 4 alternativas (1 certa + 3 erradas) embaralhadas; retorna [opts, correctIndex]
function buildAlternatives(pool, correct) {
  const fakes = pickFakeAlts(pool, correct, 3);
  const all = [...fakes, correct].sort(() => Math.random() - 0.5);
  const correctIdx = all.findIndex(v => v.toLowerCase() === correct.toLowerCase());
  return [all, correctIdx];
}

/* ── Dropdown customizado com barra de rolagem ── */
const ScrollableDropdown = ({ value, onChange, disabled, options }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const selected = options.find(o => o.value === value) || options[0];

  return (
    <div ref={ref} style={{ position: 'relative', width: '100%', marginTop: '4px' }}>
      <div
        onClick={() => { if (!disabled) setOpen(o => !o); }}
        style={{
          width: '100%', padding: '9px 36px 9px 12px', borderRadius: '8px',
          background: disabled ? 'var(--bg)' : 'var(--surface)',
          border: `2px solid ${open ? 'var(--k10-purple)' : 'var(--k10-purple-bdr)'}`,
          color: disabled ? 'var(--text-muted)' : 'var(--text)',
          fontSize: '13px', fontWeight: '500', cursor: disabled ? 'not-allowed' : 'pointer',
          display: 'flex', alignItems: 'center', gap: '6px', userSelect: 'none',
          boxShadow: open ? '0 0 0 3px var(--k10-purple-lt2)' : 'none',
          transition: 'border-color 0.15s, box-shadow 0.15s', boxSizing: 'border-box',
          opacity: disabled ? 0.6 : 1,
        }}
      >
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {selected ? `${selected.emoji ? selected.emoji + ' ' : ''}${selected.label}` : '—'}
        </span>
        <span style={{
          position: 'absolute', right: '12px', fontSize: '10px', color: 'var(--k10-purple)',
          transform: open ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s'
        }}>▼</span>
      </div>

      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, zIndex: 9999,
          background: 'var(--surface)', border: '2px solid var(--k10-purple-bdr)',
          borderRadius: '10px', boxShadow: '0 8px 24px rgba(99,102,241,0.18)',
          maxHeight: '220px', overflowY: 'auto', overflowX: 'hidden',
        }}>
          {options.map((opt, i) => {
            if (opt.isGroup) return (
              <div key={i} style={{
                padding: '5px 12px 3px', fontSize: '10px', fontWeight: '700',
                color: 'var(--k10-purple-txt)', textTransform: 'uppercase',
                letterSpacing: '0.6px', background: 'var(--k10-purple-lt)',
                borderTop: i > 0 ? '1px solid var(--k10-purple-bdr)' : 'none',
              }}>{opt.label}</div>
            );
            const isSelected = opt.value === value;
            return (
              <div key={i} onClick={() => { onChange(opt.value); setOpen(false); }}
                style={{
                  padding: '9px 14px', fontSize: '13px', cursor: 'pointer',
                  background: isSelected ? 'var(--k10-purple-lt2)' : 'transparent',
                  color: isSelected ? 'var(--k10-purple-txt)' : 'var(--text)',
                  fontWeight: isSelected ? '700' : '400',
                  borderLeft: isSelected ? '3px solid var(--k10-purple)' : '3px solid transparent',
                  transition: 'background 0.12s',
                  display: 'flex', alignItems: 'center', gap: '6px',
                }}
                onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = 'var(--k10-purple-lt)'; }}
                onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = 'transparent'; }}
              >
                {opt.emoji && <span>{opt.emoji}</span>}
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{opt.label}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

            const peerP2POwner = quizBotActive && globalQuizOwner && globalQuizOwner !== peerId;

            // V73: cooldown pós-parada — bloqueia botão de iniciar para todos por 3 min
            if (!quizBotActive && quizStopCooldown > 0) {
              const mins = Math.floor(quizStopCooldown / 60);
              const secs = quizStopCooldown % 60;
              const display = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#fff7ed', border: '1.5px solid #fed7aa',

              );

          <button 
            className="primary-btn" 
            onClick={() => {
              const newActive = !quizBotActive;
              let handoffSent = false;
              if (!newActive && sendQuizHandoff) {
                try { sendQuizHandoff(); handoffSent = true; } catch(e) { console.warn('Quiz handoff failed', e); }
              }
              setGlobalQuizOwner(newActive ? peerId : null);
              setQuizBotActive(newActive);
              if (newActive) {
                notifyServer('quiz-bot-start');
              } else if (!handoffSent) {
                notifyServer('quiz-bot-stop');
              }
              if (broadcastToggle) broadcastToggle(newActive);
              if (newActive) {
                const initialJitterMs = 1000 + Math.floor(Math.random() * 2000);
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                quizJitterTimerRef.current = setTimeout(askNextQuestion, initialJitterMs);
              } else {
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                if (startQuizStopCooldown) startQuizStopCooldown(); // V73: cooldown 3min para o dono local
              }
            }}
            style={{ background: iAmOwner ? '#ef4444' : '#10b981', width: '100%' }}
          >
            {iAmOwner ? t(lang, 'quizStopBot') : t(lang, 'quizStartBot')}
          </button>
            );
          })()}
        </div>
      </div>
    </FloatingWindow>
  );
};

// IptvPlayer — player HLS.js para streams m3u8
// ══════════════════════════════════════════════════════════════
const loadHlsJs = () => new Promise(resolve => {
  if (window.Hls) { resolve(window.Hls); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js';
  s.onload = () => resolve(window.Hls);
  s.onerror = () => resolve(null);
  document.head.appendChild(s);
});

const IptvPlayer = ({ url, name, flag }) => {
  const videoRef  = useRef(null);
  const hlsRef    = useRef(null);
  const [status,   setStatus]   = useState('loading');
  const [levels,   setLevels]   = useState([]);   // qualidade disponíveis
  const [curLevel, setCurLevel] = useState(-1);   // -1 = Auto
  const [showRes,  setShowRes]  = useState(false);
  const [muted,    setMuted]    = useState(false);
  const [volume,   setVolume]   = useState(1);
  const [fullscr,  setFullscr]  = useState(false);
  const [paused,   setPaused]   = useState(false);  // ▶/⏸ controle
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!url || !videoRef.current) return;
    setStatus('loading');
    setLevels([]);
    setCurLevel(-1);

    loadHlsJs().then(Hls => {
      if (!Hls) { setStatus('error'); return; }
      if (hlsRef.current) hlsRef.current.destroy();

      if (Hls.isSupported()) {
        const hls = new Hls({ maxBufferLength: 30, startLevel: -1 });
        hlsRef.current = hls;
        hls.loadSource(url);
        hls.attachMedia(videoRef.current);

        hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
          videoRef.current.play().catch(()=>{});
          setStatus('playing');
          // Monta lista de qualidades
          const lvls = data.levels.map((l, i) => ({
            index: i,
            label: l.height ? `${l.height}p` : `Nível ${i+1}`,
            bitrate: l.bitrate,
            width: l.width,
            height: l.height,
          }));
          setLevels(lvls);
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
          setCurLevel(hls.manualLevel === -1 ? -1 : data.level);
        });

        hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) setStatus('error'); });

      } else if (videoRef.current.canPlayType('application/vnd.apple.mpegurl')) {
        videoRef.current.src = url;
        videoRef.current.play().catch(()=>{});
        setStatus('playing');
      } else { setStatus('error'); }
    });
    return () => { if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; } };
  }, [url]);

  const setQuality = (index) => {
    if (!hlsRef.current) return;
    hlsRef.current.currentLevel = index; // -1 = Auto
    hlsRef.current.manualLevel  = index;
    setCurLevel(index);
    setShowRes(false);
  };

  const toggleMute = () => {
    if (!videoRef.current) return;
    videoRef.current.muted = !muted;
    setMuted(!muted);
  };

  const togglePlayPause = () => {
    if (!videoRef.current) return;
    if (videoRef.current.paused) {
      videoRef.current.play().catch(()=>{});
      setPaused(false);
    } else {
      videoRef.current.pause();
      setPaused(true);
    }
  };

  const changeVolume = (v) => {
    if (!videoRef.current) return;
    videoRef.current.volume = v;
    setVolume(v);
    if (v === 0) setMuted(true);
    else if (muted) { setMuted(false); videoRef.current.muted = false; }
  };

  const toggleFullscreen = () => {
    if (!wrapRef.current) return;
    if (!document.fullscreenElement) {
      wrapRef.current.requestFullscreen().catch(()=>{});
      setFullscr(true);
    } else {
      document.exitFullscreen();
      setFullscr(false);
    }
  };

  const curLabel = curLevel === -1 ? 'Auto' : (levels[curLevel]?.label || `Nível ${curLevel+1}`);

  return (
    <div ref={wrapRef} style={{ width:'100%', height:'100%', background:'#000', position:'relative',
                                display:'flex', flexDirection:'column', overflow:'hidden' }}>
      {/* Vídeo */}
      <video ref={videoRef}
        style={{ flex:1, width:'100%', display: status==='error'?'none':'block', objectFit:'contain' }}
        onClick={() => setShowRes(false)} />

      {/* Loading */}
      {status === 'loading' && (
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
                      alignItems:'center', justifyContent:'center', gap:'10px', color:'white', background:'#000' }}>
          <div style={{ fontSize:'36px' }}>{flag||'📡'}</div>
          <div style={{ fontSize:'13px', fontWeight:700 }}>{name}</div>
          <div style={{ display:'flex', alignItems:'center', gap:'8px', color:'#94a3b8', fontSize:'11px' }}>
            <div style={{ width:'12px', height:'12px', borderRadius:'50%', border:'2px solid #64748b',
                          borderTopColor:'#60a5fa', animation:'spin 0.8s linear infinite' }}></div>
            Carregando stream...
          </div>
        </div>
      )}

      {/* Erro */}
      {status === 'error' && (
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
                      alignItems:'center', justifyContent:'center', gap:'10px', color:'white', background:'#000' }}>
          <div style={{ fontSize:'36px' }}>📵</div>
          <div style={{ fontSize:'13px', fontWeight:700 }}>{name}</div>
          <div style={{ fontSize:'11px', color:'#ef4444' }}>Stream indisponível</div>
          <button onClick={() => { setStatus('loading'); hlsRef.current?.loadSource(url); }}
            style={{ background:'#1e293b', border:'1px solid #334155', color:'#94a3b8',
                     borderRadius:'6px', padding:'5px 14px', fontSize:'11px', cursor:'pointer' }}>
            ↺ Tentar novamente
          </button>
        </div>
      )}

      {/* ── Barra de controles personalizados ── */}
      {status === 'playing' && (
        <div style={{ flexShrink:0, background:'rgba(0,0,0,0.85)', padding:'6px 10px',
                      display:'flex', alignItems:'center', gap:'8px', borderTop:'1px solid #1e293b' }}>

          {/* ── Play / Pause ── */}
          <button onClick={togglePlayPause}
            title={paused ? 'Retomar' : 'Pausar'}
            style={{ background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.2)',
                     color:'white', cursor:'pointer', fontSize:'13px', padding:'3px 8px',
                     borderRadius:'6px', display:'flex', alignItems:'center', justifyContent:'center',
                     minWidth:'28px', transition:'background 0.15s' }}>
            <i className={`fas fa-${paused ? 'play' : 'pause'}`}></i>
          </button>

          {/* Mute / Volume */}
          <button onClick={toggleMute}
            style={{ background:'none', border:'none', color:'white', cursor:'pointer', fontSize:'14px', padding:'2px 6px' }}>
            <i className={`fas fa-volume-${muted||volume===0?'mute':volume<0.5?'down':'up'}`}></i>
          </button>
          <input type="range" min="0" max="1" step="0.05" value={muted ? 0 : volume}
            onChange={e => changeVolume(parseFloat(e.target.value))}
            style={{ width:'64px', accentColor:'#3b82f6', cursor:'pointer' }} />

          {/* Nome do canal */}
          <span style={{ flex:1, color:'#94a3b8', fontSize:'10px', fontWeight:600,
                         whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
            {flag} {name}
          </span>

          {/* ── Seletor de Resolução ── */}
          {levels.length > 0 && (
            <div style={{ position:'relative' }}>
              <button onClick={() => setShowRes(!showRes)}
                style={{ background: showRes?'#1d4ed8':'#1e293b', border:'1px solid #334155',
                         color:'white', borderRadius:'6px', padding:'3px 10px',
                         fontSize:'10px', fontWeight:700, cursor:'pointer',
                         display:'flex', alignItems:'center', gap:'5px' }}>
                <i className="fas fa-sliders-h" style={{fontSize:'9px'}}></i>
                {curLabel}
                <i className={`fas fa-chevron-${showRes?'down':'up'}`} style={{fontSize:'8px'}}></i>
              </button>

              {/* Dropdown de qualidades */}
              {showRes && (
                <div style={{ position:'absolute', bottom:'calc(100% + 6px)', right:0, zIndex:100,
                              background:'#0f172a', border:'1px solid #334155', borderRadius:'8px',
                              overflow:'hidden', minWidth:'120px', boxShadow:'0 8px 24px rgba(0,0,0,0.5)' }}>
                  <div style={{ padding:'6px 10px', fontSize:'9px', fontWeight:700,
                                color:'#475569', letterSpacing:'1px', borderBottom:'1px solid #1e293b' }}>
                    RESOLUÇÃO
                  </div>
                  {/* Auto */}
                  <button onClick={() => setQuality(-1)}
                    style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                             width:'100%', padding:'7px 12px', background: curLevel===-1?'#1d4ed8':'transparent',
                             border:'none', color: curLevel===-1?'white':'#e2e8f0',
                             fontSize:'12px', fontWeight:600, cursor:'pointer', textAlign:'left' }}>
                    <span>⚡ Auto</span>
                    {curLevel === -1 && <i className="fas fa-check" style={{fontSize:'9px',color:'#60a5fa'}}></i>}
                  </button>
                  {/* Níveis disponíveis (do maior para o menor) */}
                  {[...levels].sort((a,b) => (b.height||0)-(a.height||0)).map(lv => (
                    <button key={lv.index} onClick={() => setQuality(lv.index)}
                      style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                               width:'100%', padding:'7px 12px', background: curLevel===lv.index?'#1d4ed8':'transparent',
                               border:'none', color: curLevel===lv.index?'white':'#e2e8f0',
                               fontSize:'12px', fontWeight:600, cursor:'pointer', textAlign:'left' }}>
                      <span>
                        {lv.height >= 1080 ? '🔵 ' : lv.height >= 720 ? '🟢 ' : lv.height >= 480 ? '🟡 ' : '🔴 '}
                        {lv.label}
                        {lv.height >= 1080 ? ' HD' : lv.height >= 720 ? ' HD' : ''}
                      </span>
                      <span style={{ color:'#475569', fontSize:'9px', marginLeft:'8px' }}>
                        {lv.bitrate ? `${Math.round(lv.bitrate/1000)}k` : ''}
                      </span>
                      {curLevel === lv.index && <i className="fas fa-check" style={{fontSize:'9px',color:'#60a5fa'}}></i>}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Fullscreen */}
          <button onClick={toggleFullscreen}
            style={{ background:'none', border:'none', color:'white', cursor:'pointer', fontSize:'13px', padding:'2px 5px' }}>
            <i className={`fas fa-${fullscr?'compress':'expand'}`}></i>
          </button>
        </div>
      )}
    </div>
  );
};

const IptvModal = ({ onClose, onPlay }) => {
  const [channels, setChannels] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [search, setSearch] = useState('');
  const [continente, setContinente] = useState('todos');
  const [countryFilter, setCountryFilter] = useState('todos');

  useEffect(() => {
    fetchIptvData().then(({ chs, streams }) => {
      const chMap = {};
      chs.forEach(c => { chMap[c.id] = c; });
      const list = streams
        .filter(s => s.url && (s.url.includes('.m3u8') || s.url.includes('/live') || s.url.includes('stream')))
        .map(s => {
          const ch = chMap[s.channel] || {};
          const iso = ch.country || 'ZZ';
          return { id: s.channel, name: ch.name || s.channel, url: s.url, iso, flag: ISO_FLAGS[iso] || '🌐', logo: ch.logo || '', cats: (ch.categories||[]).join(',') };
        })
        .filter(c => c.name && c.url);
      setChannels(list);
      setLoading(false);
    }).catch(e => { setError('Erro ao carregar canais: ' + e.message); setLoading(false); });
  }, []);

  // Agrupa por continente
  const getContinent = (iso) => {
    for (const [cont, isos] of Object.entries(CONTINENTES)) {
      if (isos.includes(iso)) return cont;
    }
    return '🌐 Outros';
  };

  const filtered = channels.filter(c => {
    if (search && !c.name.toLowerCase().includes(search.toLowerCase()) && !c.iso.toLowerCase().includes(search.toLowerCase())) return false;
    if (continente !== 'todos' && getContinent(c.iso) !== continente) return false;
    if (countryFilter !== 'todos' && c.iso !== countryFilter) return false;
    return true;
  });

  const allContinentes = [...new Set(channels.map(c => getContinent(c.iso)))].sort();
  const countriesInCont = continente === 'todos'
    ? [...new Set(channels.map(c => c.iso))].sort()
    : [...new Set(channels.filter(c => getContinent(c.iso) === continente).map(c => c.iso))].sort();

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:99999, display:'flex', alignItems:'center', justifyContent:'center', padding:'12px' }}>
      <div style={{ background:'#0f172a', border:'1px solid #1e3a5f', borderRadius:'16px', width:'100%', maxWidth:'720px', height:'90vh', display:'flex', flexDirection:'column', boxShadow:'0 24px 80px rgba(0,0,0,0.8)', overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'16px 20px 12px', borderBottom:'1px solid #1e293b', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px' }}>
            <div>
              <h3 style={{ margin:0, color:'white', fontSize:'18px', fontWeight:700, display:'flex', alignItems:'center', gap:'10px' }}>
                📡 IPTV Mundial
              </h3>
              <p style={{ margin:'3px 0 0', color:'#64748b', fontSize:'12px' }}>
                {loading ? 'Carregando canais do mundo inteiro...' : `${filtered.length} canais disponíveis · clique para transmitir na janelinha`}
              </p>
            </div>
            <button onClick={onClose} style={{ background:'none', border:'none', color:'#64748b', fontSize:'22px', cursor:'pointer' }}>✕</button>
          </div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Pesquisar canal ou país (ex: CNN, Brasil, US)..."
            style={{ width:'100%', padding:'9px 14px', background:'#1e293b', border:'1px solid #334155', borderRadius:'8px', color:'#e2e8f0', fontSize:'13px', outline:'none', boxSizing:'border-box' }} />
        </div>

        {/* Continents */}
        <div style={{ padding:'8px 12px', borderBottom:'1px solid #1e293b', display:'flex', gap:'6px', overflowX:'auto', flexShrink:0 }}>
          {['todos', ...allContinentes].map(c => (
            <button key={c} onClick={() => { setContinente(c); setCountryFilter('todos'); }}
              style={{ background: continente===c?'#7c3aed':'#1e293b', color: continente===c?'white':'#94a3b8',
                       border: continente===c?'none':'1px solid #334155', borderRadius:'20px',
                       padding:'4px 12px', fontSize:'11px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              {c === 'todos' ? '🌍 Todos' : c}
            </button>
          ))}
        </div>

        {/* Countries */}
        <div style={{ padding:'6px 12px', borderBottom:'1px solid #1e293b', display:'flex', gap:'5px', overflowX:'auto', flexShrink:0 }}>
          <button onClick={() => setCountryFilter('todos')}
            style={{ background: countryFilter==='todos'?'#1d4ed8':'#1e293b', color: countryFilter==='todos'?'white':'#94a3b8',
                     border: countryFilter==='todos'?'none':'1px solid #334155', borderRadius:'16px',
                     padding:'3px 10px', fontSize:'10px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
            Todos os países
          </button>
          {countriesInCont.map(iso => (
            <button key={iso} onClick={() => setCountryFilter(iso)}
              style={{ background: countryFilter===iso?'#1d4ed8':'#1e293b', color: countryFilter===iso?'white':'#94a3b8',
                       border: countryFilter===iso?'none':'1px solid #334155', borderRadius:'16px',
                       padding:'3px 10px', fontSize:'10px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              {ISO_FLAGS[iso]||'🌐'} {iso}
            </button>
          ))}
        </div>

        {/* Channel List */}
        <div style={{ flex:1, overflowY:'auto' }}>
          {loading ? (
            <div style={{ padding:'60px', textAlign:'center', color:'#475569' }}>
              <div style={{ fontSize:'40px', marginBottom:'12px' }}>📡</div>
              <div style={{ color:'#94a3b8', fontWeight:600 }}>Carregando canais do mundo inteiro...</div>
              <div style={{ fontSize:'12px', marginTop:'6px' }}>iptv-org.github.io</div>
            </div>
          ) : error ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#ef4444' }}>{error}</div>
          ) : filtered.length === 0 ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#475569' }}>Nenhum canal encontrado</div>
          ) : (
            (() => {
              // Agrupa por país
              const groups = {};
              filtered.forEach(c => {
                const key = `${c.flag} ${c.iso}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(c);
              });
              return Object.entries(groups).sort().map(([country, chs]) => (
                <div key={country}>
                  <div style={{ padding:'8px 16px 4px', fontSize:'11px', fontWeight:700, color:'#475569', letterSpacing:'1px', background:'#0a0f1e', position:'sticky', top:0, zIndex:1 }}>
                    {country} · {chs.length} canal(is)
                  </div>
                  {chs.map((ch, i) => (
                    <div key={i} style={{ display:'flex', alignItems:'center', padding:'10px 16px', borderBottom:'1px solid #0f172a', cursor:'pointer', transition:'background 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.background='#1e293b'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                      onClick={() => onPlay(ch.url, ch.name, ch.iso, ch.flag)}>
                      {ch.logo ? (
                        <img src={ch.logo} alt="" style={{ width:'36px', height:'36px', objectFit:'contain', borderRadius:'4px', marginRight:'12px', background:'#1e293b', flexShrink:0 }}
                          onError={e=>{e.target.style.display='none'}} />
                      ) : (
                        <div style={{ width:'36px', height:'36px', borderRadius:'4px', background:'#1e293b', marginRight:'12px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'18px' }}>{ch.flag}</div>
                      )}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ color:'#e2e8f0', fontWeight:600, fontSize:'13px', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{ch.name}</div>
                        <div style={{ color:'#475569', fontSize:'10px' }}>{ch.cats || 'general'}</div>
                      </div>
                      <button style={{ background:'#7c3aed', color:'white', border:'none', borderRadius:'8px', padding:'6px 14px', fontSize:'11px', fontWeight:700, cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', gap:'5px' }}>
                        <i className="fas fa-play"></i> Transmitir
                      </button>
                    </div>
                  ))}
                </div>
              ));
            })()
          )}
        </div>

        <div style={{ padding:'10px 20px', borderTop:'1px solid #1e293b', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ color:'#475569', fontSize:'11px' }}>Fonte: iptv-org.github.io · {channels.length} streams carregados</span>
          <button onClick={onClose} style={{ background:'none', border:'1px solid #334155', color:'#94a3b8', borderRadius:'6px', padding:'5px 14px', fontSize:'12px', cursor:'pointer' }}>Fechar</button>
        </div>
      </div>
    </div>
  );
};

// IptvFilmesModal — mesmo modelo do IPTV, filtrado por filmes
// Categorias: movies · entertainment · animation · comedy · classic
// ══════════════════════════════════════════════════════════════
const GENERO_LABELS = {
  movies:        { icon:'🎬', label:'Filmes' },
  entertainment: { icon:'🎭', label:'Entretenimento' },
  animation:     { icon:'🎠', label:'Animação' },
  comedy:        { icon:'😂', label:'Comédia' },
  classic:       { icon:'🎞️', label:'Clássicos' },
  kids:          { icon:'🧸', label:'Kids' },
  documentary:   { icon:'🎥', label:'Documentários' },
  music:         { icon:'🎵', label:'Música' },
  series:        { icon:'📺', label:'Séries' },
  general:       { icon:'▶️', label:'Geral' },
};
const CATS_FILMES = ['movies','entertainment','animation','comedy','classic','kids','documentary','series'];

const IptvFilmesModal = ({ onClose, onPlay }) => {
  const [channels, setChannels]   = useState([]);
  const [loading, setLoading]     = useState(true);
  const [error, setError]         = useState(null);
  const [search, setSearch]       = useState('');
  const [genero, setGenero]       = useState('todos');
  const [countryFilter, setCountryFilter] = useState('todos');

  useEffect(() => {
    fetchIptvData().then(({ chs, streams }) => {
      const chMap = {};
      chs.forEach(c => { chMap[c.id] = c; });

      const list = streams
        .filter(s => s.url && (s.url.includes('.m3u8') || s.url.includes('stream') || s.url.includes('/live')))
        .map(s => {
          const ch = chMap[s.channel] || {};
          const cats = ch.categories || [];
          const primaryCat = CATS_FILMES.find(c => cats.includes(c)) || null;
          if (!primaryCat) return null; // descarta canais sem categoria de filmes
          const iso = ch.country || 'ZZ';
          return {
            id:     s.channel,
            name:   ch.name || s.channel,
            url:    s.url,
            iso,
            flag:   ISO_FLAGS[iso] || '🌐',
            logo:   ch.logo || '',
            cat:    primaryCat,
            cats:   cats,
          };
        })
        .filter(Boolean);

      setChannels(list);
      setLoading(false);
    }).catch(e => { setError('Erro: ' + e.message); setLoading(false); });
  }, []);

  const generosDisponiveis = [...new Set(channels.map(c => c.cat))].sort();
  const paisesDisponiveis  = [...new Set(
    (genero === 'todos' ? channels : channels.filter(c => c.cat === genero)).map(c => c.iso)
  )].sort();

  const filtered = channels.filter(c => {
    if (genero !== 'todos' && c.cat !== genero) return false;
    if (countryFilter !== 'todos' && c.iso !== countryFilter) return false;
    if (search && !c.name.toLowerCase().includes(search.toLowerCase()) &&
        !c.iso.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  // Agrupa por gênero (ou por país dentro do gênero)
  const grupos = {};
  filtered.forEach(c => {
    const g = c.cat;
    if (!grupos[g]) grupos[g] = [];
    grupos[g].push(c);
  });

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.88)', zIndex:99999,
                  display:'flex', alignItems:'center', justifyContent:'center', padding:'12px' }}>
      <div style={{ background:'#0f172a', border:'1px solid #7c3aed', borderRadius:'16px',
                    width:'100%', maxWidth:'720px', height:'90vh', display:'flex', flexDirection:'column',
                    boxShadow:'0 24px 80px rgba(124,58,237,0.3)', overflow:'hidden' }}>

        {/* ── Header ── */}
        <div style={{ padding:'16px 20px 12px', borderBottom:'1px solid #1e293b', flexShrink:0,
                      background:'linear-gradient(135deg,#1e1b4b 0%,#0f172a 100%)' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px' }}>
            <div>
              <h3 style={{ margin:0, color:'white', fontSize:'18px', fontWeight:700,
                           display:'flex', alignItems:'center', gap:'10px' }}>
                🎬 IPTV Filmes Mundial
              </h3>
              <p style={{ margin:'3px 0 0', color:'#7c3aed', fontSize:'12px' }}>
                {loading ? 'Carregando catálogo global...'
                         : `${filtered.length} canais · filmes, séries e entretenimento do mundo`}
              </p>
            </div>
            <button onClick={onClose}
              style={{ background:'none', border:'none', color:'#64748b', fontSize:'22px', cursor:'pointer' }}>✕</button>
          </div>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="🔍 Pesquisar canal ou país..."
            style={{ width:'100%', padding:'9px 14px', background:'#1e293b', border:'1px solid #4c1d95',
                     borderRadius:'8px', color:'#e2e8f0', fontSize:'13px', outline:'none', boxSizing:'border-box' }} />
        </div>

        {/* ── Filtro por Gênero ── */}
        <div style={{ padding:'8px 12px', borderBottom:'1px solid #1e293b',
                      display:'flex', gap:'6px', overflowX:'auto', flexShrink:0, background:'#0a0e1a' }}>
          {['todos', ...generosDisponiveis].map(g => {
            const meta = GENERO_LABELS[g] || { icon:'▶️', label: g };
            return (
              <button key={g} onClick={() => { setGenero(g); setCountryFilter('todos'); }}
                style={{ background: genero===g ? '#7c3aed' : '#1e293b',
                         color: genero===g ? 'white' : '#94a3b8',
                         border: genero===g ? 'none' : '1px solid #334155',
                         borderRadius:'20px', padding:'4px 14px', fontSize:'11px',
                         fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
                {meta.icon} {g === 'todos' ? 'Todos' : meta.label}
              </button>
            );
          })}
        </div>

        {/* ── Filtro por País ── */}
        <div style={{ padding:'6px 12px', borderBottom:'1px solid #1e293b',
                      display:'flex', gap:'5px', overflowX:'auto', flexShrink:0 }}>
          <button onClick={() => setCountryFilter('todos')}
            style={{ background: countryFilter==='todos'?'#4c1d95':'#1e293b',
                     color: countryFilter==='todos'?'white':'#94a3b8',
                     border: countryFilter==='todos'?'none':'1px solid #334155',
                     borderRadius:'16px', padding:'3px 10px', fontSize:'10px',
                     fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
            🌍 Todos os países
          </button>
          {paisesDisponiveis.map(iso => (
            <button key={iso} onClick={() => setCountryFilter(iso)}
              style={{ background: countryFilter===iso?'#4c1d95':'#1e293b',
                       color: countryFilter===iso?'white':'#94a3b8',
                       border: countryFilter===iso?'none':'1px solid #334155',
                       borderRadius:'16px', padding:'3px 10px', fontSize:'10px',
                       fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              {ISO_FLAGS[iso]||'🌐'} {iso}
            </button>
          ))}
        </div>

        {/* ── Lista de Canais ── */}
        <div style={{ flex:1, overflowY:'auto' }}>
          {loading ? (
            <div style={{ padding:'60px', textAlign:'center', color:'#475569' }}>
              <div style={{ fontSize:'48px', marginBottom:'12px' }}>🎬</div>
              <div style={{ color:'#7c3aed', fontWeight:700, fontSize:'15px' }}>Carregando catálogo global...</div>
              <div style={{ fontSize:'12px', color:'#475569', marginTop:'6px' }}>iptv-org.github.io · filmes · séries · entretenimento</div>
            </div>
          ) : error ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#ef4444' }}>{error}</div>
          ) : filtered.length === 0 ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#475569' }}>Nenhum canal encontrado</div>
          ) : (
            Object.entries(grupos).sort().map(([g, chs]) => {
              const meta = GENERO_LABELS[g] || { icon:'▶️', label: g };
              // Dentro de cada gênero, agrupa por país
              const porPais = {};
              chs.forEach(c => {
                const k = `${c.flag} ${c.iso}`;
                if (!porPais[k]) porPais[k] = [];
                porPais[k].push(c);
              });
              return (
                <div key={g}>
                  {/* Cabeçalho do gênero */}
                  <div style={{ padding:'10px 16px 6px', background:'linear-gradient(90deg,#1e1b4b,#0f172a)',
                                borderBottom:'1px solid #1e293b', position:'sticky', top:0, zIndex:2,
                                display:'flex', alignItems:'center', gap:'8px' }}>
                    <span style={{ fontSize:'20px' }}>{meta.icon}</span>
                    <span style={{ color:'#a78bfa', fontWeight:700, fontSize:'13px', letterSpacing:'0.5px' }}>
                      {meta.label.toUpperCase()}
                    </span>
                    <span style={{ color:'#475569', fontSize:'11px' }}>· {chs.length} canal(is)</span>
                  </div>

                  {/* Canais dentro do gênero */}
                  {Object.entries(porPais).sort().map(([pais, canais]) => (
                    <div key={pais}>
                      <div style={{ padding:'6px 16px 2px', fontSize:'10px', fontWeight:700,
                                    color:'#334155', letterSpacing:'1px', background:'#0a0f1e',
                                    position:'sticky', top:'37px', zIndex:1 }}>
                        {pais} · {canais.length}
                      </div>
                      {canais.map((ch, i) => (
                        <div key={i}
                          style={{ display:'flex', alignItems:'center', padding:'10px 16px',
                                   borderBottom:'1px solid #0f172a', cursor:'pointer', transition:'background 0.15s' }}
                          onMouseEnter={e => e.currentTarget.style.background='#1e293b'}
                          onMouseLeave={e => e.currentTarget.style.background='transparent'}
                          onClick={() => onPlay(ch.url, ch.name, ch.iso, ch.flag)}>
                          {ch.logo ? (
                            <img src={ch.logo} alt="" onError={e => e.target.style.display='none'}
                              style={{ width:'40px', height:'40px', objectFit:'contain', borderRadius:'6px',
                                       marginRight:'12px', background:'#1e293b', flexShrink:0 }} />
                          ) : (
                            <div style={{ width:'40px', height:'40px', borderRadius:'6px', background:'#1e293b',
                                          marginRight:'12px', flexShrink:0, display:'flex',
                                          alignItems:'center', justifyContent:'center', fontSize:'20px' }}>
                              {meta.icon}
                            </div>
                          )}
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ color:'#e2e8f0', fontWeight:600, fontSize:'13px',
                                          whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                              {ch.name}
                            </div>
                            <div style={{ color:'#475569', fontSize:'10px' }}>
                              {ch.flag} {ch.iso} · {ch.cats.join(', ')}
                            </div>
                          </div>
                          <button style={{ background:'linear-gradient(135deg,#7c3aed,#4c1d95)',
                                           color:'white', border:'none', borderRadius:'8px',
                                           padding:'7px 14px', fontSize:'11px', fontWeight:700,
                                           cursor:'pointer', flexShrink:0, display:'flex',
                                           alignItems:'center', gap:'5px' }}>
                            <i className="fas fa-film"></i> Transmitir
                          </button>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              );
            })
          )}
        </div>

        {/* ── Footer ── */}
        <div style={{ padding:'10px 20px', borderTop:'1px solid #1e293b', flexShrink:0,
                      display:'flex', alignItems:'center', justifyContent:'space-between',
                      background:'#0a0e1a' }}>
          <span style={{ color:'#475569', fontSize:'11px' }}>
            🎬 {channels.length} canais de filmes · iptv-org.github.io
          </span>
          <button onClick={onClose}
            style={{ background:'none', border:'1px solid #4c1d95', color:'#7c3aed',
                     borderRadius:'6px', padding:'5px 14px', fontSize:'12px', cursor:'pointer' }}>
            Fechar
          </button>
        </div>
      </div>
    </div>
  );
};

const IptvCategoryModal = ({ configKey, onClose, onPlay }) => {
  const cfg = IPTV_CAT_DEFS[configKey];
  const [channels, setChannels] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [error, setError]       = useState(null);
  const [search, setSearch]     = useState('');
  const [catFilter, setCatFilter] = useState('todos');
  const [countryFilter, setCountryFilter] = useState('todos');

  useEffect(() => {
    fetchIptvData().then(({ chs, streams }) => {
      const chMap = {};
      chs.forEach(c => { chMap[c.id] = c; });
      const list = streams
        .filter(s => s.url && (s.url.includes('.m3u8') || s.url.includes('stream') || s.url.includes('/live')))
        .map(s => {
          const ch = chMap[s.channel] || {};
          const cats = ch.categories || [];
          const primaryCat = cfg.cats.find(c => cats.includes(c)) || null;
          if (!primaryCat) return null;
          const iso = ch.country || 'ZZ';
          return { id:s.channel, name:ch.name||s.channel, url:s.url, iso, flag:ISO_FLAGS[iso]||'🌐', logo:ch.logo||'', cat:primaryCat, cats };
        })
        .filter(Boolean);
      setChannels(list);
      setLoading(false);
    }).catch(e => { setError('Erro: ' + e.message); setLoading(false); });
  }, []);

  const catsDisponiveis = [...new Set(channels.map(c => c.cat))].sort();
  const paisesDisponiveis = [...new Set(
    (catFilter === 'todos' ? channels : channels.filter(c => c.cat === catFilter)).map(c => c.iso)
  )].sort();

  const filtered = channels.filter(c => {
    if (catFilter !== 'todos' && c.cat !== catFilter) return false;
    if (countryFilter !== 'todos' && c.iso !== countryFilter) return false;
    if (search && !c.name.toLowerCase().includes(search.toLowerCase()) && !c.iso.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const grupos = {};
  filtered.forEach(c => {
    if (!grupos[c.cat]) grupos[c.cat] = {};
    const k = c.flag + ' ' + c.iso;
    if (!grupos[c.cat][k]) grupos[c.cat][k] = [];
    grupos[c.cat][k].push(c);
  });

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.88)', zIndex:99999, display:'flex', alignItems:'center', justifyContent:'center', padding:'12px' }}>

            <div>
              <h3 style={{ margin:0, color:'white', fontSize:'18px', fontWeight:700 }}>{cfg.title}</h3>
              <p style={{ margin:'3px 0 0', color:cfg.accent, fontSize:'12px' }}>
                {loading ? 'Carregando ' + cfg.desc + '...' : filtered.length + ' canais · ' + cfg.desc}

            <button onClick={onClose} style={{ background:'none', border:'none', color:'#64748b', fontSize:'22px', cursor:'pointer' }}>✕</button>

// ── V74-A: Sincronização de Relógio entre Peers ─────────────────────────────
// clockOffsetRef = diferença entre relógio do servidor NTP e Date.now() local
// trueNow()      = Date.now() + clockOffsetRef.current (sempre use no lugar de Date.now() no Quiz)
// syncClock()    = sincroniza via worldtimeapi.org → fallback timeapi.io (timeout 3s, sanidade ±30s)
const clockOffsetRef = useRef(0);
const trueNow = () => Date.now() + clockOffsetRef.current;
const syncClock = async () => {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);
  try {
    const t0 = Date.now();
    const res = await fetch('https://worldtimeapi.org/api/ip', { signal: controller.signal });
    const data = await res.json();
    clearTimeout(timeoutId);
    const serverMs = new Date(data.datetime).getTime();
    const rtt = Date.now() - t0;
    const offset = serverMs + rtt / 2 - Date.now();
    if (Math.abs(offset) < 30000) clockOffsetRef.current = offset; // sanidade ±30s
    console.log(`[V74-A] syncClock OK (worldtimeapi) offset=${Math.round(offset)}ms`);
    return;
  } catch(e) { clearTimeout(timeoutId); }
  // Fallback: timeapi.io
  const ctrl2 = new AbortController();
  const tid2 = setTimeout(() => ctrl2.abort(), 3000);
  try {
    const t0 = Date.now();
    const res = await fetch('https://timeapi.io/api/time/current/zone?timeZone=UTC', { signal: ctrl2.signal });
    const data = await res.json();
    clearTimeout(tid2);
    const serverMs = new Date(data.dateTime + 'Z').getTime();
    const rtt = Date.now() - t0;
    const offset = serverMs + rtt / 2 - Date.now();
    if (Math.abs(offset) < 30000) clockOffsetRef.current = offset;
    console.log(`[V74-A] syncClock OK (timeapi.io) offset=${Math.round(offset)}ms`);
  } catch(e) { clearTimeout(tid2); console.warn('[V74-A] syncClock falhou — usando offset=0'); }
};

// Embaralha array in-place (Fisher-Yates)
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Retira o próximo lugar da fila; quando vazia, reembaralha tudo de novo
function nextWorldPlace() {
  if (worldQuizQueueRef.current.length === 0) {
    // Cria nova fila com todos os índices embaralhados + seed de tempo para variar sempre
    const indices = WORLD_PLACES.map((_, i) => i);
    shuffleArray(indices);
    // Garante que o primeiro da nova fila ≠ último lugar jogado (evita repetição na virada)
    if (worldQuizPlaceRef.current) {
      const lastIdx = WORLD_PLACES.indexOf(worldQuizPlaceRef.current);
      if (indices[0] === lastIdx && indices.length > 1) {
        [indices[0], indices[1]] = [indices[1], indices[0]];
      }
    }
    worldQuizQueueRef.current = indices;
  }
  const idx = worldQuizQueueRef.current.shift();
  return WORLD_PLACES[idx];
}

  // FIX N-3 V20: era connections (stale closure) → connectionsRef.current
  if (selectedContact && (!isCentralServer(selectedContact) || (serverE2EE && serverE2EE[selectedContact]?.active))) {
    const payload = { ...msgData, direct: true };
    if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(selectedContact)) {
      window.MxDM.send(selectedContact, payload).catch(e => console.warn('[MxDM] poll-create send error:', e));
    } else {
      const conn = connectionsRef.current.find(c => c.peer === selectedContact);
      if (conn && conn.open) conn.send(payload);
    }
    setMessages(prev => [...prev, { ...msgData, sender: 'you', recipient: selectedContact, direct: true }].slice(-500));
  } else {
    if (window.MxDM && window.MxDM.broadcast) window.MxDM.broadcast({ ...msgData, direct: false }).catch(e => console.warn('[MxDM] poll-create broadcast error:', e));
    connectionsRef.current.forEach(c => { if (c.open) try { c.send({ ...msgData, direct: false }); } catch(e){} });
    setMessages(prev => [...prev, { ...msgData, sender: 'you', recipient: 'general' }].slice(-500));
    // ── MODO GERAL NOVO: injeta notificação no overlay Matrix ──
    if (typeof window._matrixGeralInjetarMsg === 'function')
      window._matrixGeralInjetarMsg(`📊 Enquete: ${question}`, userName, timeStr);
  }
  setShowPollCreator(false);
};

// ─────────────────────────────────────────────────────────────────────
// QUIZ HANDOFF: quando o usuário desliga o bot, transfere o estado
// (disciplina, intervalo, IDs já usados, hits em buffer) para o servidor
// continuar a transmissão exatamente de onde parou.
// IMPORTANTE: segue o mesmo padrão do programa — só URL + ID das imagens
// (nada de binário). O servidor reusa fetchWorldImage com os mesmos IDs
// no Set de já-usados pra não repetir.
// ─────────────────────────────────────────────────────────────────────
const sendQuizHandoff = () => {
  if (!centralServerId) return;
  const conn = connectionsRef.current.find(c => c.peer === centralServerId && c.open);
  if (!conn) return;

  // Snapshot dos hits do Pixabay já buscados mas ainda não usados (por query)
  // _worldImgCache é módulo-level, então acessamos por window
  const bufferedHits = {};
  try {
    if (typeof _worldImgCache === 'object' && _worldImgCache) {
      for (const q in _worldImgCache) {
        if (Array.isArray(_worldImgCache[q]) && _worldImgCache[q].length > 0) {
          bufferedHits[q] = _worldImgCache[q].slice(0); // shallow copy
        }
      }
    }
  } catch(e) {}

  const handoff = {
    type: 'quiz-handoff',
    quizDiscipline: quizDisciplineRef.current,
    quizInterval: safeQuizInterval(),
    usedImageIds: Array.from(worldQuizUsedImagesRef.current || []),
    bufferedHits,                                  // hits Pixabay (URL+ID, sem binário)
    lastPlaceQuery: worldQuizPlaceRef.current ? worldQuizPlaceRef.current.query : null,
    lastQuizTime: lastQuizTimeRef.current,        // Sincroniza cooldown global
    senderName: userNameRef.current || 'Quiz Master', // FIX BUG-3: ref evita stale closure
  };
  try { conn.send(handoff); } catch(e) {} // handoff enviado ao servidor
};

const sendQuizQuestion = (quizData) => {
  const timestamp = new Date();
  const now = trueNow(); // V74-A: usa relógio sincronizado em vez de Date.now() local
  lastQuizTimeRef.current = now; // Atualiza cooldown local
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  // IMPORTANTE: usa type:'message' para que o servidor faça relay automaticamente
  // O campo quizPayload embute os dados estruturados do quiz
  const wireMsg = {
    type: 'message',
    id: msgId,
    ttl: 15,
    senderName: '🤖 Quiz Bot',
    direct: false,
    time: timeStr,
    timestamp: timestamp.getTime(),
    text: '__QUIZ__',          // texto sentinela — clientes antigos ignoram, clientes novos detectam
    quizPayload: quizData      // dados completos do quiz
  };

  const localMsg = {
    type: 'quiz-question',
    sender: 'you',
    senderName: '🤖 Quiz Bot',
    time: timeStr,
    timestamp: timestamp.getTime(),
    recipient: target || 'general',
    quizVotes: {},
    quizRevealed: false,
    ...quizData
  };

  if (target) {
    if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(target)) {
      window.MxDM.send(target, { ...wireMsg, direct: true, recipient: target, sender: peerIdRef.current || peerId }).catch(e => console.warn('[MxDM] quiz send error:', e));
    } else {
      const conn = connectionsRef.current.find(c => c.peer === target && c.open);
      if (conn) try { conn.send(wireMsg); } catch(e) { console.error('Quiz send error', e); }
    }
    setMessages(prev => [...prev, { ...localMsg, direct: true, recipient: target }].slice(-500));
  } else {
    connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
    setMessages(prev => [...prev, localMsg].slice(-500));
    // ── MODO GERAL: injeta quiz localmente E envia para sala Matrix ──
    const _quizPayloadGeral = { ...quizData, quizQuestion: localMsg.quizQuestion || quizData.quizQuestion };
    if (typeof window._matrixGeralInjetarQuiz === 'function')
      window._matrixGeralInjetarQuiz(_quizPayloadGeral, '🤖 Quiz Bot', timeStr);
    // Envia para a sala Matrix Geral para que usuários sem P2P recebam
    if (typeof window.enviarParaMatrix === 'function') {
      const _nomeK10 = localStorage.getItem('p2pUserName') || '';
      const _prefixo = _nomeK10 ? `[K10·${_nomeK10}] ` : '';
      window.enviarParaMatrix('__K10QUIZ__:' + _prefixo + JSON.stringify(_quizPayloadGeral));
    }
  }
  
  // Envia para os inscritos do World Quiz, independentemente de estar em um servidor ou não
  if (quizData.quizStage) {
    worldQuizSubscribersRef.current.forEach(subId => {
      const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
      if (subConn) try { subConn.send(wireMsg); } catch(e) {}
    });
  }
};

const sendQuizReveal = (quizId) => {
  const timestamp = new Date();
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  const q = currentQuizQuestionRef.current;
  const refVotes = q ? (q.votes || {}) : {};

  setMessages(prev => {
    const quizMsg = prev.find(m => m.quizId === quizId);
    const stateVotes = quizMsg ? (quizMsg.quizVotes || {}) : {};
    const mergedVotes = { ...stateVotes, ...refVotes };

    // IMPORTANTE: usa type:'message' para relay pelo servidor
    const wireMsg = {
      type: 'message',
      id: msgId,
      ttl: 15,
      senderName: '🤖 Quiz Bot',
      direct: false,
      time: timeStr,
      text: '__QUIZ_REVEAL__',
      quizRevealPayload: { quizId, votes: mergedVotes, quizCorrect: q ? q.corretaIndex : undefined }
    };

    if (target) {
      if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(target)) {
        window.MxDM.send(target, { ...wireMsg, direct: true, recipient: target, sender: peerIdRef.current || peerId }).catch(e => console.warn('[MxDM] quiz reveal error:', e));
      } else {
        const conn = connectionsRef.current.find(c => c.peer === target && c.open);
        if (conn) try { conn.send(wireMsg); } catch(e) {}
      }
    } else {
      connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
    }
    
    if (q && q.quizStage) {
      worldQuizSubscribersRef.current.forEach(subId => {
        const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
        if (subConn) try { subConn.send(wireMsg); } catch(e) {}
      });
    }

    return prev.map(m =>
      m.quizId === quizId ? { ...m, quizRevealed: true, quizVotes: mergedVotes } : m
    );
  });
  // ── MODO GERAL NOVO: revela resposta no overlay Matrix ──
  if (typeof window._matrixGeralRevealQuiz === 'function' && currentQuizQuestionRef.current) {
    const cq = currentQuizQuestionRef.current;
    if (cq.quizId === quizId && cq.corretaIndex !== undefined)
      window._matrixGeralRevealQuiz(quizId, cq.corretaIndex);
  }
};

    timestamp: Date.now(),
    recipient: 'general',
    text: `⚠️ VIOLAÇÃO DETECTADA: "${violatorName || violatorId}" enviou quiz com apenas ${Math.round(elapsedSec)}s de intervalo (mínimo: ${MIN_QUIZ_INTERVAL}s). Mensagem BLOQUEADA pela rede.`
  };

  if (typeof window._matrixGeralInjetarMsg === 'function')
    window._matrixGeralInjetarMsg(alertMsg.text, alertMsg.senderName, alertMsg.time);
};

// ── Eleição de Mestre P2P (Self-Healing e Consistência) ──
const checkAndAssumeQuizMaster = () => {
  if (!quizBotActiveRef.current) return false;
  // Pega todos os peers conectados + nós mesmos
  // FIX: exclui servidores K10-GATE / K10-CENTRAL da eleição — eles nunca rodam quiz
  // Sem esse filtro, 'K10-GATE-XXXX' ganha sempre (alfanumérico 'K' < maioria dos IDs)
  // e o usuário nunca vira mestre, então askNextQuestion retorna sem enviar perguntas.
  const peers = [peerId, ...connectionsRef.current
    .filter(c => c.open && !isCentralServer(c.peer))
    .map(c => c.peer)];
  peers.sort(); // Eleição alfanumérica
  const isMaster = peers[0] === peerId;
  const wasMaster = quizMasterIdRef.current === peerId;
  quizMasterIdRef.current = peers[0];

  if (isMaster && !wasMaster) {
     console.log("👑 Assumi a coroa de Mestre do Quiz via P2P (Alfanumérico)!");
     if (quizTimerRef.current) clearTimeout(quizTimerRef.current);
     if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
     // Jitter aleatório p/ dar segurança que todos enxergaram a queda unânime
     const takeoverDelayMs = 2000 + Math.floor(Math.random() * 2000); 
     quizJitterTimerRef.current = setTimeout(() => {
        // ── SOLUÇÃO 5: Master Claim pra Resolução de Conflito ──
        connectionsRef.current.forEach(c => { if(c.open) try{c.send({type: 'master-claim', senderId: peerId});}catch(e){} });
        askNextQuestion();
     }, takeoverDelayMs);
     
     // RETORNO FALSO TEMPORÁRIO: Bloqueia a execução imediata para evitar disparo duplo de perguntas, delegando para o setTimeout acima.
     return false;
  }
  return isMaster;
};

const askNextQuestion = async () => {
  if (quizTimerRef.current) clearTimeout(quizTimerRef.current);

  const isMaster = checkAndAssumeQuizMaster();

  if (!isMaster) {
      // Somos ouvintes/escravos (Vice-Mestres ou Recebedores).
      // Apenas aguardamos. O tempo e os dados virão pelo relay.
      const masterId = quizMasterIdRef.current;
      
      // Enviamos inscrição (Fallback pra garantir rotas diretas, vital pro World Sync)
      if (masterId !== worldQuizSubscribedToRef.current) {
        worldQuizSubscribedToRef.current = masterId;
        const subMsg = { type: 'subscribe-world-quiz', myId: peerId, distributorId: masterId };
        const masterConn = connectionsRef.current.find(c => c.peer === masterId && c.open);
        if (masterConn) {
          try { masterConn.send(subMsg); } catch(e) {}
        }
      }
      
      // Vigilância P2P pra Failover rápido: se o master demorar muito, re-elege
      quizTimerRef.current = setTimeout(() => {
        if (quizBotActiveRef.current) {
          console.log("Quiz: Timeout esperando mestre. Removendo inscrição e triggando auto-cura...");
          worldQuizSubscribedToRef.current = null;
          askNextQuestion(); // Retorna ao ciclo para auto-cura local ser triggada
        }
      }, safeQuizInterval() * 1000 + 15000); // Fôlego pro master network
      
      return;
  }

  // ── SE CHEGAMOS AQUI: SOMOS O MESTRE DA REDE! ──
  worldQuizSubscribedToRef.current = null;

  // FIX: Respeita o intervalo global mesmo após virar mestre (handoff sync)
  const now = trueNow(); // V74-A: relógio sincronizado
  const elapsed = now - lastQuizTimeRef.current;
  const minIntervalMs = MIN_QUIZ_INTERVAL * 1000;
  
  if (elapsed < minIntervalMs) {
    const wait = minIntervalMs - elapsed + 1000;
    console.log(`Quiz: Cooldown global ativo. Aguardando ${Math.round(wait/1000)}s...`);
    quizTimerRef.current = setTimeout(askNextQuestion, wait);
    return;
  }

  // ── World Quiz: rota direta Fetch ──
  const _disc = quizDisciplineRef.current;
  if (_disc === 'world') {
      return askWorldQuestion();
  }

  const ALL_POOL_NO_WORLD = QUIZ_SUBJECTS.filter(s => s.id !== 'world' && !s.apiId);

  let questions = [];
  let selectedSubject;

  if (_disc === 'all') {
    selectedSubject = ALL_POOL_NO_WORLD[quizAllIndexRef.current % ALL_POOL_NO_WORLD.length];
    quizAllIndexRef.current = (quizAllIndexRef.current + 1) % ALL_POOL_NO_WORLD.length;
  } else if (_disc === 'apis') {
    // Rotaciona entre todas as fontes de API
    selectedSubject = API_QUIZ_SUBJECTS[quizAllIndexRef.current % API_QUIZ_SUBJECTS.length];
    quizAllIndexRef.current = (quizAllIndexRef.current + 1) % API_QUIZ_SUBJECTS.length;
  } else {
    selectedSubject = QUIZ_SUBJECTS.find(s => s.id === _disc);
  }

  // ── API Quiz Engine: subject com apiId usa motor unificado ──
  if (selectedSubject?.apiId) {
    const q = await fetchApiQuizQuestion(selectedSubject.apiId);
    if (q && q.pergunta && Array.isArray(q.opcoes) && typeof q.correta === 'number') {
      const quizId = 'quiz-' + Date.now() + '-' + Math.random().toString(36).substring(2);
      currentQuizQuestionRef.current = { ...q, quizId, p: q.pergunta, corretaIndex: q.correta, cleanOpts: q.opcoes, votes: {} };
      sendQuizQuestion({ quizId, quizQuestion: q.pergunta, quizOptions: q.opcoes, quizCorrect: q.correta, quizSubject: `${selectedSubject.emoji} ${selectedSubject.name}`, quizStage: 0, nonce: Math.random().toString(36).substring(2, 10) });
      quizTimerRef.current = setTimeout(() => {
        if (quizBotActiveRef.current) { sendQuizReveal(quizId); currentQuizQuestionRef.current = null; setTimeout(askNextQuestion, 3000); }
      }, safeQuizInterval() * 1000);
      return;
    }
    // Fallback se API falhou: usa matéria estática
    console.warn(`[QuizAPI:${selectedSubject.apiId}] retornou null — usando fallback`);
    selectedSubject = ALL_POOL_NO_WORLD[0];
  }

  // Guarda contra subject inválido ou sem url
  if (!selectedSubject || !selectedSubject.url) {
    selectedSubject = ALL_POOL_NO_WORLD[0];
  }
  
  try {
    const res = await fetch(selectedSubject.url);
    const data = await res.json();
    
    // Handle the specific JSON format provided (array of arrays or direct array)
    const arr = Array.isArray(data) ? data : (Object.values(data).find(v => Array.isArray(v)) || []);
    questions = arr.filter(p => p.pergunta && Array.isArray(p.opcoes) && typeof p.correta === 'number');
    
  } catch (e) {
    console.error("Fetch error", e);
  }
  
  if (!questions || questions.length === 0) {
    questions = [
      { pergunta: "Qual a capital do Brasil?", opcoes: ["São Paulo", "Rio de Janeiro", "Brasília", "Salvador"], correta: 2 },
      { pergunta: "Qual o maior planeta do sistema solar?", opcoes: ["Terra", "Marte", "Júpiter", "Saturno"], correta: 2 },
      { pergunta: "Quem pintou a Mona Lisa?", opcoes: ["Van Gogh", "Leonardo da Vinci", "Picasso", "Michelangelo"], correta: 1 }
    ];
  }

  const q = questions[Math.floor(Math.random() * questions.length)];
  const questionText = q.pergunta;
  const L = ['A','B','C','D','E','F'];

  // FIX: Remove prefixo duplicado (ex: "A) texto" -> "texto") que alguns JSONs já incluem
  const stripPrefix = (str) => str.replace(/^[A-Fa-f]\)\s*/, '').trim();
  const cleanOpts = q.opcoes.map(stripPrefix);

  const quizId = 'quiz-' + Date.now() + '-' + Math.random().toString(36).substring(2);

  currentQuizQuestionRef.current = {
    ...q,
    quizId,
    p: questionText,
    corretaIndex: q.correta,
    cleanOpts,
    votes: {}
  };

  // Send structured quiz-question message (not plain text)
  sendQuizQuestion({
    quizId,
    quizQuestion: questionText,
    quizOptions: cleanOpts,
    quizCorrect: q.correta,
    quizSubject: `${selectedSubject.emoji} ${selectedSubject.name}`,
    quizStage: 0,
    nonce: Math.random().toString(36).substring(2, 10),
  });

  quizTimerRef.current = setTimeout(() => {
    if (quizBotActiveRef.current) {
      sendQuizReveal(quizId);
      currentQuizQuestionRef.current = null;
      setTimeout(askNextQuestion, 3000); // 3s para usuários verem a resposta
    }
  }, safeQuizInterval() * 1000);
};

const handleAvatarChange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 120;
      const MAX_HEIGHT = 120;
      let width = img.width;
      let height = img.height;
      
      if (width > height) {
        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
      } else {
        if (height > MAX_HEIGHT) {
          width *= MAX_HEIGHT / height;
          height = MAX_HEIGHT;
        }
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.7); // Compress to 70% quality
      setUserAvatar(base64);
      localStorage.setItem('p2pUserAvatar', base64);
      
      // Notify all mapped Matrix DMs and connected peers about the new avatar
      const avatarPayload = { type: 'avatar-update', peerId, avatar: base64 };
      if (window.MxDM && window.MxDM.broadcast) window.MxDM.broadcast(avatarPayload).catch(err => console.warn('[MxDM] avatar broadcast error:', err));
      connectionsRef.current.forEach(conn => {
        if (conn.open) {
          try { conn.send(avatarPayload); } catch(err) {}
        }
      });
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};
