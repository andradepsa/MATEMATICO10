  if (seenMessagesRef.current.has(dedupKey)) return;
  seenMessagesRef.current.add(dedupKey);
  setMessages(prev => [...prev, {
    type: 'text',
    sender: 'system',
    senderName: '🚨 Vigilância da Rede',
    time: new Date(data.timestamp).toLocaleTimeString('en-US'),
    timestamp: data.timestamp,
    recipient: 'general',
    text: `⚠️ VIOLAÇÃO DETECTADA por ${data.detectedByName || data.detectedBy}: "${data.violatorName}" enviou quiz com apenas ${data.elapsedSec}s de intervalo (mínimo: ${MIN_QUIZ_INTERVAL}s). Mensagem BLOQUEADA.`
  }].slice(-500));
  return;
}

if (data.type === 'master-claim') {
  // ── SOLUÇÃO 5: Resolução de Conflito de Split Brain ──
  // Se outro peer clama ser mestre e tem um ID menor que o meu (prioridade), eu recuo.
  if (data.senderId < peerId && quizMasterIdRef.current === peerId) {
     console.log("🏳️ Cedi a coroa P2P para um nó prioritário pós-conflito:", data.senderId);
     quizMasterIdRef.current = data.senderId;
     if (quizTimerRef.current) clearTimeout(quizTimerRef.current);
     if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
  }
  return;
}

if (data.type === 'subscribe-world-quiz') {
  worldQuizSubscribersRef.current.add(data.myId);
  // ── LATE JOINER SYNC (Sincroniza novato com o estado atual) ──
  // SOLUÇÃO VULNERABILIDADE 7 (RETRANSMISSÃO SYNC): enviamos o cache e os ids sempre 
  // se o master re-confirmar ou via fallbacks de broadcast periódico pra esse peer
  if (quizMasterIdRef.current === peerId) {
     // 1. Sincroniza o Buffer de Imagens Em Cache
     Object.keys(_worldImgCache).forEach(query => {
        const hits = _worldImgCache[query];
        if (hits && hits.length > 0) {
           const syncMsg = { type: 'quiz-buffer-sync', query, hits };
           const conn = connectionsRef.current.find(c => c.peer === data.myId && c.open);
           if (conn) try { conn.send(syncMsg); } catch(e){}
        }
     });
     // 2. Sincroniza o Diário de Bordo (IDs de fotos do Pixabay proibidas pra não repetir)
     const usedIds = Array.from(worldQuizUsedImagesRef.current);
     if (usedIds.length > 0) {
        const usedMsg = { type: 'quiz-used-sync', usedIds };
        const conn = connectionsRef.current.find(c => c.peer === data.myId && c.open);
        if (conn) try { conn.send(usedMsg); } catch(e){}
     }
  }
  return;
}

if (data.type === 'quiz-used-sync' && Array.isArray(data.usedIds)) {
  data.usedIds.forEach(id => worldQuizUsedImagesRef.current.add(id));
  return;
}

if (data.type === 'quiz-buffer-sync' && data.hits) {
  if (!Array.isArray(_worldImgCache[data.query])) {
    _worldImgCache[data.query] = [];
  }
  const existingIds = new Set(_worldImgCache[data.query].map(h => h.id));
  const newHits = data.hits.filter(h => !existingIds.has(h.id));
  _worldImgCache[data.query] = [..._worldImgCache[data.query], ...newHits];
  return;
}

if (data.type === 'quiz-bot-global-toggle') {
  // V69-LOCK-1: só o dono atual pode parar — ignora stop vindo de quem não é o globalQuizOwner
  if (!data.active && data.owner && data.owner !== globalQuizOwnerRef.current) return;
  setQuizBotActive(data.active);
  quizBotActiveRef.current = data.active;
  if (data.active) {
    setGlobalQuizOwner(data.owner);
    globalQuizOwnerRef.current = data.owner;
    // Sincroniza a disciplina do transmissor para que failover use a correta
    if (data.discipline) {
      setQuizDiscipline(data.discipline);
      quizDisciplineRef.current = data.discipline;
    }
    setTimeout(checkAndAssumeQuizMaster, 2000);
  } else {
    setGlobalQuizOwner(null);
    globalQuizOwnerRef.current = null;
    startQuizStopCooldownRef.current(); // V73: cooldown 3min anti-spam após parada do quiz
  }
  return;
}

if (data.type === 'quiz-bot-status') {
  setServerQuizBotActive(data.active);
  // V46: rastreia quem tem a responsabilidade do quiz no servidor
  setQuizServerOwnerId(data.active ? (data.owner || null) : null);
  if (data.active && data.owner !== peerId && quizBotActiveRef.current) {
    // Se outro ligou o bot e eu também estou com ele ligado, eu desligo o meu
    setQuizBotActive(false);
    alert(t(langRef.current, 'botAlreadyActiveServer')); // FIX BUG-NEW-4: era t(lang,...) stale closure
  }
  return;
}

if (data.type === 'network-stats' && data.totalOnline !== undefined) {
if (data.worldQuizNodes) {
  worldQuizNodesRef.current = data.worldQuizNodes;
}
setNetworkSize(prev => Math.max(data.totalOnline, connectionsRef.current.length + 1)); // FIX P-1 V22: era connections.length (stale closure em callback PeerJS)
// Relay stats to other peers to spread the info
let ttl = data.ttl !== undefined ? data.ttl : 5;
if (ttl > 0) {
const relay = { ...data, ttl: ttl - 1 };
// FIX BUG-C: relay via ref — sem efeito colateral dentro do state updater
connectionsRef.current.forEach(c => {
if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){}
});
}
return;
}


if (data.type === 'migrate-to-p2p' && Array.isArray(data.peers)) {
// Servidor migrou para P2P — conectando aos peers
if (peerInstance.current) {
data.peers.forEach(newPId => {
const activeCount = Object.keys(peerInstance.current.connections).length;
if (activeCount < maxConnections && newPId !== peerId && !peerInstance.current.connections[newPId] && !bannedPeersRef.current.has(newPId)) {
setTimeout(() => connectToPeer(newPId), Math.random() * 3000); // Random delay to prevent connection storms
}
});
}
// FASE-2: proteção mútua — se não temos groupId ainda, o servidor/reservado já
// enviou o groupId via peer-list; aqui apenas registramos o message do sistema
setMessages(prev => [...prev, { text: data.message || "Servidor lotado. Você foi migrado para a rede descentralizada (P2P) automaticamente.", sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now() }].slice(-500));
return;
}


if (data.type === 'handshake') { 
  // V48: não seta como central se for servidor em Router Mode (ele vai desconectar após atribuir grupo)
  if (isCentralServer(pId) && !routerModeServersRef.current.has(pId)) setCentralServerId(pId); 
  if (data.avatar) {
    setAvatars(prev => ({ ...prev, [pId]: data.avatar }));
  }
  // FIX-CONTACT-OPEN: o outro lado nos selecionou explicitamente como contato → aparecer na lista de conversas
  if (data.contactOpen && !directPeersRef.current.has(pId)) {
    directPeersRef.current.add(pId);
    setDirectPeers(prev => { const s = new Set(prev); s.add(pId); return s; });
  }
  return; 
}

// V52: group0-welcome — legado: ignorado silenciosamente (gateway agora envia peer-list direto)
if (data.type === 'group0-welcome') {
  bootstrapDoneRef.current = true;
  return;
}
// ── FIM K10 V52: group0-welcome removido ──────────────────────────────────

if (data.type === 'avatar-update' && data.avatar) {
  setAvatars(prev => ({ ...prev, [pId]: data.avatar }));
  return;
}


if (data.type === 'e2ee-secret' && data.secret) {
setE2eeState(prev => ({ ...prev, [pId]: { ...prev[pId], contactSecret: data.secret } }));
const name = getContactName(pId);
setMessages(prev => [...prev, { text: t(langRef.current, 'e2eeSecretReceived', { name }), sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now(), systemFor: pId }].slice(-500));
return;
}


if (data.type === 'server-e2ee-invite' && data.groupSecret && data.serverId) {
const name = getContactName(pId);
setMessages(prev => [...prev, {
text: t(langRef.current, 'groupInviteReceived', { name, id: data.serverId }), // FIX BUG-NEW-4: era t(lang,...) stale
sender: '__system__',
recipient: 'you',
senderName: 'System',
time: new Date().toLocaleTimeString(),
type: 'text',
direct: true,
timestamp: Date.now(),
systemFor: pId,
isInvite: true,
inviteData: { serverId: data.serverId, groupSecret: data.groupSecret }
}].slice(-500)); // FIX BUG-F
return;
}


if (data.type === 'peer-list') {
  bootstrapDoneRef.current = true; // V52: sinaliza que gateway respondeu com alocação
  if (window.__k10StallTimer) { clearTimeout(window.__k10StallTimer); window.__k10StallTimer = null; }
  // ── V25 C-19: peer-list comprimido K10 ──────────────────────────────
  // Servidor envia V25: { gid, user, count }
  //   'user'  = sufixo atribuído a ESTE peer (K10_POSITION_LIST[posIdx])
  //   'count' = total de membros no grupo agora
  //   → Para saber quem são: K10_POSITION_LIST[0..count-1] — lista pré-definida!
  // Servidor envia V24 compat: { gid, suffix, users:[2chars] }
  // Mantém compatibilidade com formato antigo { peers:[], groupId }

  if (data.gid) {
    // ── Formato V25/V24: recebe GID e sufixo/user atribuído ──
    const newGid = data.gid;
    // V48: se o servidor que enviou o peer-list opera em Router Mode, marca-o para não reconectar
    if (data.routerMode === true && isCentralServer(pId)) {
      routerModeServersRef.current.add(pId);
      addAudit(`[V48] Router Mode detectado em ${pId} — não será centralServerId`, 'info');
    }
    // V42: atualiza lista de servidores do grupo (máx 10, enviada pelo K10-CENTRAL V36)
    // Só sobrescreve se o campo veio na mensagem — ausente = servidor pré-V36 (mantém null = fallback)
    if (Object.prototype.hasOwnProperty.call(data, 'groupServers') && Array.isArray(data.groupServers)) {
      groupServersRef.current = data.groupServers;
    }
    // V26: aprende o índice binário do GID — habilita recepção de pacotes binários
    // gidIdx é enviado pelo servidor V26; se ausente (servidor V25), registra localmente
    if (typeof data.gidIdx === 'number') {
      k10bin.learnGid(newGid, data.gidIdx);
    } else {
      k10bin.registerGid(newGid); // fallback: atribui índice local
    }
    // V25: 'user' é o sufixo atribuído; V24: 'suffix'
    const assignedSuffix = data.user || data.suffix;

    // Atualiza GID do nó — o servidor é sempre autoritativo na atribuição
    // FIX V39-GROUP: a condição anterior bloqueava a atualização quando o usuário
    // já tinha um savedGroupId no localStorage (ex: AAAA) e o servidor atribuía um
    // grupo filho (ex: AAAB). Resultado: todos os clientes ficavam reportando AAAA
    // ao monitor mesmo após o servidor criar grupos filhos, fazendo o monitor mostrar
    // 1 grupo com N>50 usuários em vez dos grupos reais.
    myGroupIdRef.current = newGid;
    localStorage.setItem('myGroupId', newGid);
    sendUserToMonitor();

    if (typeof K10GroupShadow !== 'undefined' && K10GroupShadow.probeAndElect) {
      setTimeout(() => K10GroupShadow.probeAndElect(), 500);
    }

    // FIX V26→V23: Peer ID NUNCA muda. Apenas registra posição se sufixo atribuído.
    if (assignedSuffix && assignedSuffix.length === K10_SUFFIX_LEN) {
      const posIdx = K10_POSITION_LIST.indexOf(assignedSuffix);
      if (posIdx >= 0) myPositionIdxRef.current = posIdx;
      addAudit(`[K10] Grupo ${newGid} atribuído (pos ${posIdx+1}). Peer ID mantido: ${peerIdRef.current}`, 'sys');
    }

    // V25: conecta aos peers do grupo usando K10_POSITION_LIST[0..count-1]
    // Não precisa de lista de sufixos — a lista pré-definida é suficiente!
    const count = data.count !== undefined ? data.count
      : (Array.isArray(data.users) ? data.users.length : 0);

    if (!directoryGlobalRef.current[newGid]) {
      directoryGlobalRef.current[newGid] = { reservados: [], groupSize: 0 };
    }
    directoryGlobalRef.current[newGid].groupSize = count;
    fillGroupPresenceBits(newGid, count);

    if (peerInstance.current && count > 0) {
      const maxConns = isSuperNodeRef.current ? 50 : 15;
      // FIX V33-PEERLIST: conecta usando IDs PeerJS reais enviados pelo servidor (data.peers).
      // Bug V25: iterava K10_POSITION_LIST para construir IDs sintéticos (K10AAAA+sufixo) que
      // nunca existem na rede PeerJS — peer IDs reais são aleatórios (ex: QYTPF8YAM).
      // Fix: usa data.peers[] com os IDs reais, conforme enviado pelo servidor V33+.
      if (Array.isArray(data.peers) && data.peers.length > 0) {
        data.peers.forEach((fullPeerId) => {
          if (fullPeerId === peerIdRef.current) return; // não conecta a si mesmo
          const activeCount = Object.keys(peerInstance.current.connections).length;
          if (activeCount < maxConns
              && !peerInstance.current.connections[fullPeerId]
              && !bannedPeersRef.current.has(fullPeerId)) {
            setTimeout(() => connectToPeer(fullPeerId), Math.random() * 3000);
          }
        });
      }
    }

  } else if (Array.isArray(data.peers)) {
    // ── Formato legado (compatibilidade): peers com IDs completos ──
    if (peerInstance.current) {
      const maxConns = isSuperNodeRef.current ? 50 : 15;
      data.peers.forEach(newPId => {
        const activeCount = Object.keys(peerInstance.current.connections).length;
        if (activeCount < maxConns
            && newPId !== peerId
            && !peerInstance.current.connections[newPId]
            && !bannedPeersRef.current.has(newPId)) {
          setTimeout(() => connectToPeer(newPId), Math.random() * 3000);
        }
      });
    }
    if (data.groupId) {
      // FIX V47-GROUP-LEGACY: mesmo fix do V39-GROUP aplicado ao handler legado.
      // Antes: condicional bloqueava update quando savedGroupId era diferente de data.groupId.
      // Agora: atualização incondicional (servidor tem autoridade sobre o GID).
      myGroupIdRef.current = data.groupId;
      localStorage.setItem('myGroupId', data.groupId);
      sendUserToMonitor();
    }
  }
  return;
}


if (data.type === 'pex') {
// V23 S-10: PEX comprimido — suporta {gid, users:[2chars]} e formato legado {peers, groupId}
const gid = data.gid || data.groupId;
if (gid) {
  if (!directoryGlobalRef.current[gid]) {
    directoryGlobalRef.current[gid] = { reservados: [], groupSize: 0 };
  }
  // FIX-AUDIT-CLI4: groupSize só é inflado por count (campo autoritativo V25) ou pelo servidor central
  // Peers P2P com dados stale podem ter groupSize desatualizado — usamos apenas para conectar, não para inflar
  const fromServer = isCentralServer(pId);
  // V25: campo 'count' = autoritativo (vem do servidor junto com peer-list/pex)
  if (typeof data.count === 'number' && data.count > 0) {
    const safe = Math.min(data.count, K10_MAX_GROUP);
    if (fromServer || safe > (directoryGlobalRef.current[gid].groupSize || 0)) {
      directoryGlobalRef.current[gid].groupSize = safe;
    }
    fillGroupPresenceBits(gid, directoryGlobalRef.current[gid].groupSize || safe);
  }
  // Formato V23: lista comprimida (tamanho real da lista)
  if (Array.isArray(data.users)) {
    // Só inflamos se vier do servidor; de peers P2P aceita apenas se maior pelo número real de entradas
    const listLen = data.users.length;
    if (fromServer) {
      directoryGlobalRef.current[gid].groupSize = Math.max(directoryGlobalRef.current[gid].groupSize || 0, listLen);
    }
    if (data.isReservado && data.suffix) {
      const set = new Set(directoryGlobalRef.current[gid].reservados);
      set.add(k10BuildPeerId(gid, data.suffix));
      directoryGlobalRef.current[gid].reservados = [...set].slice(0, 10);
    }
  }
  // Formato legado: groupSize scalar — só do servidor para evitar inflação P2P
  if (data.groupSize !== undefined && fromServer) {
    const safeGs = Math.min(Math.max(0, parseInt(data.groupSize) || 0), K10_MAX_GROUP);
    directoryGlobalRef.current[gid].groupSize = Math.max(directoryGlobalRef.current[gid].groupSize || 0, safeGs);
  }
  if (data.isReservado && data.peerId) {
    const set = new Set(directoryGlobalRef.current[gid].reservados);
    set.add(data.peerId);
    directoryGlobalRef.current[gid].reservados = [...set].slice(0, 10);
  }
}
// Conecta a peers da lista (formato V23 ou legado)
if (peerInstance.current) {
const activeCount = Object.keys(peerInstance.current.connections).length;
if (activeCount < maxConnections) {
  // Formato V23: reconstrói peerIds a partir dos sufixos
  if (gid && Array.isArray(data.users)) {
    data.users.forEach(suffix => {
      if (typeof suffix !== 'string' || suffix.length !== K10_SUFFIX_LEN) return;
      const fullPeerId = k10BuildPeerId(gid, suffix);
      if (fullPeerId !== peerId && !peerInstance.current.connections[fullPeerId] && !bannedPeersRef.current.has(fullPeerId)) {
        setTimeout(() => connectToPeer(fullPeerId), 2000);
      }
    });
  }
  // Formato legado
  if (Array.isArray(data.peers)) {
    data.peers.forEach(newPId => {
      if (newPId !== peerId && !peerInstance.current.connections[newPId] && !bannedPeersRef.current.has(newPId)) {
        setTimeout(() => connectToPeer(newPId), 2000);
      }
    });
  }
}
}
return;
}


// ── V26: join-update — broadcast compacto de entrada/contagem de grupo ───────
if (data.type === 'join-update') {
  const newCount = typeof data.newCount === 'number'
    ? Math.min(Math.max(0, data.newCount), K10_MAX_GROUP)
    : -1;

  if (data.gid && newCount >= 0) {
    if (!directoryGlobalRef.current[data.gid]) {
      directoryGlobalRef.current[data.gid] = { reservados: [], groupSize: 0 };
    }
    const cur = directoryGlobalRef.current[data.gid].groupSize || 0;
    directoryGlobalRef.current[data.gid].groupSize = Math.max(cur, newCount);
    fillGroupPresenceBits(data.gid, newCount);
    addAudit(`[K10-V26] join-update binário: grupo ${data.gid} → ${newCount} usuários`, 'sys');

    // FIX-3-JOIN-UPDATE: loop de IDs sintéticos removido. k10BuildPeerId(gid,suffix) gera
    // IDs K10AAAA+sufixo que não existem no PeerJS (peer IDs reais são aleatórios, ex: QYTPF8YAM).
    // Conexão P2P é feita via peer-list (V33), que envia data.peers[] com IDs reais do servidor.
  }
  return;
}

// ── V25/V26: pex-update — broadcast compacto de saída de peer ────────────────
// V26 binário: relay já foi feito no interceptor acima; só processa estado local
// V25 JSON:    relay normal com TTL decrementado
if (data.type === 'pex-update') {
  // V26 binário usa newCount direto; V25 JSON deriva de indexOf(user)
  const newCount = (data._binary && typeof data.newCount === 'number')
    ? data.newCount
    : (data.user ? K10_POSITION_LIST.indexOf(data.user) : -1);

  if (data.gid && newCount >= 0) {
    if (!directoryGlobalRef.current[data.gid]) {
      directoryGlobalRef.current[data.gid] = { reservados: [], groupSize: 0 };
    }
    // Atualiza groupSize apenas se for redução (nunca inflamos por pex-update)
    const cur = directoryGlobalRef.current[data.gid].groupSize || 0;
    directoryGlobalRef.current[data.gid].groupSize = cur > newCount ? newCount : cur;
    fillGroupPresenceBits(data.gid, newCount);
    const tag = data._binary ? '[K10-V26] pex-update binário' : '[K10-V25] pex-update';
    addAudit(`${tag}: grupo ${data.gid} → ${newCount} usuários`, 'sys');
  }

  // Relay JSON apenas para pacotes V25 (binários já foram relayados no interceptor)
  if (!data._binary) {
    const pexJsonMsgId = data.msgId || (pId + '_pexupd_' + Date.now());
    if (isDuplicate(pexJsonMsgId)) return;
    const safeTtlUpd = Math.min(Math.max(0, parseInt(data.ttl) || 0), 6);
    if (safeTtlUpd > 0) {
      const relay = { ...data, ttl: safeTtlUpd - 1, msgId: pexJsonMsgId };
      connectionsRef.current.forEach(c => {
        if (c.peer !== pId && c.open) try { c.send(relay); } catch(e) {}
      });
    }
  }
  return;
}

// ── position-update — atualiza APENAS myGroupId (GID) ──
// NUNCA altera o Peer ID (p2pChatClientId). Apenas aceita se vier
// do servidor central (isCentralServer) para prevenir spoofing.
if (data.type === 'position-update') {
  if (!data.gid) return;
  // Segurança: só aceita do servidor central
  if (!isCentralServer(pId) && pId !== centralServerIdRef.current) return;
  // Atualiza SOMENTE o Group ID — Peer ID permanece intocado
  myGroupIdRef.current = data.gid;
  localStorage.setItem('myGroupId', data.gid);
  sendUserToMonitor();
  // Atualiza posição se sufixo informado
  if (data.user) {
    const newPosIdx = K10_POSITION_LIST.indexOf(data.user);
    if (newPosIdx >= 0) {
      myPositionIdxRef.current = newPosIdx;
      setGroupPresenceBit(data.gid, newPosIdx, true);
    }
  }
  addAudit(`[Hydra] position-update recebido do servidor: novo GID = ${data.gid}`, 'sys');
  return;
}


// ── V53: handlers homeostáticos obsoletos — descartados sem relay ──
// pex-family, group-tutor-status, group-alert, group-compensate,
// group-orphan-rescue, group-size-report, gid-promote nunca são emitidos
// por servidores V51+/V52+. Relay desnecessário removido para evitar
// propagação de tráfego residual de versões antigas.
if (data.type === 'pex-family' || data.type === 'group-tutor-status' ||
    data.type === 'group-alert' || data.type === 'group-compensate' ||
    data.type === 'group-orphan-rescue' || data.type === 'group-size-report' ||
    data.type === 'gid-promote') {
  return; // descarta silenciosamente
}

// V51: group-full — gateway notifica que o grupo atingiu 50
if (data.type === 'group-full') {
  const { gid, size } = data;
  if (gid && directoryGlobalRef.current[gid]) {
    directoryGlobalRef.current[gid].groupSize = size || K10_MAX_GROUP;
  }
  addAudit(`[V51] Grupo ${gid} CHEIO (${size}/${K10_MAX_GROUP})`, 'warn');
  // V77: redireciona overflow para Grupo Oficial descentralizado
  window.dispatchEvent(new CustomEvent('k10-overflow-to-oficial'));
  return;
}

// V51: group-reopened — gateway notifica que o grupo reabriu (49)
if (data.type === 'group-reopened') {
  const { gid, size } = data;
  if (gid && directoryGlobalRef.current[gid]) {
    directoryGlobalRef.current[gid].groupSize = size || K10_MAX_GROUP - 1;
  }
  addAudit(`[V51] Grupo ${gid} REABERTO (${size}/${K10_MAX_GROUP})`, 'ok');
  return;
}

// V52: group-state-sync — gossip entre gateways, atualiza diretório local
if (data.type === 'group-state-sync') {
  const { gid, size, open } = data;
  if (gid) {
    if (!directoryGlobalRef.current[gid]) {
      directoryGlobalRef.current[gid] = { reservados: [], groupSize: 0, lastUpdate: Date.now() };
    }
    directoryGlobalRef.current[gid].groupSize = size || 0;
    directoryGlobalRef.current[gid].lastUpdate = Date.now();
  }
  return;
}

// V70: group-servers-update — primary notifica que groupServers mudou (secondary recrutado/liberado)
if (data.type === 'group-servers-update') {
  if (Array.isArray(data.groupServers)) {

const p2pSendDirect = async (targetId, payload) => {
  let sent = false;

      await libp2pRef.current.services.pubsub.publish(`k10-private-${targetId}`, new TextEncoder().encode(JSON.stringify(payload)));

        sent = true;
      } catch(e) {}
    }
  }
  return sent;
};

const sendChunkedData = (targetId, idKey, dataBlob, typePrefix, metaData) => {

const timestamp = new Date(), formattedTime = formatTime(timestamp);

setMessages(prev => { const msg = { ...metaData, [idKey]: id, sender: 'you', recipient: targetId, senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio', sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(), [isFile ? 'fileData' : 'audioData']: localUrl }; const updated = [...prev, msg]; return updated; });

const sendStart = async () => {
  const startSent = await p2pSendDirect(targetId, { type: `${typePrefix}-start`, [idKey]: id, [isFile ? 'fileSize' : 'audioSize']: dataBlob.size, senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(), ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type }) });

const readChunk = () => { const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE); reader.readAsArrayBuffer(chunk); };
reader.onload = async ev => {
const chunkSent = await p2pSendDirect(targetId, { type: `${typePrefix}-chunk`, [idKey]: id, chunk: ev.target.result, offset, direct: true });
if (!chunkSent) { alert(t(langRef.current, 'connectionLost')); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); return; }
offset += ev.target.result.byteLength;
const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, progress } : m));
if (offset < dataBlob.size) requestAnimationFrame(readChunk);
else setMessages(prev => { const updated = prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: 100 } : m); return updated; });
};
reader.onerror = () => { alert(t(langRef.current, 'fileReadError')); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); };
