        }
      }
    }, 150);
    if (setPendingGroup) setPendingGroup(null);
  }
}, [pendingGroup]);



const [isSending, setIsSending] = useState(false);
const decryptionCache = useRef(new Map());


// formatTime definida em módulo-level (acima de ChatManager)

const canSendPrivate = selectedContact && !!e2eeState[selectedContact]?.mySecret;
const hasAnyE2EE = selectedContact && (!!e2eeState[selectedContact]?.mySecret || !!e2eeState[selectedContact]?.contactSecret);
const selectedIsServer = selectedContact && isCentralServer(selectedContact);
const serverGroupActive = selectedIsServer && serverE2EE[selectedContact]?.active;
const selectedMatrixReachable = !!(selectedContact && window.MxDM && window.MxDM.canSend && window.MxDM.canSend(selectedContact));
const selectedPeerReachable = !!(selectedContact && (selectedMatrixReachable || connections.some(c => c.peer === selectedContact && c.open)));


const filteredMessages = useMemo(() => {
// ── NOVO: P2P exige contato selecionado — sem contato = lista vazia ──
// Mensagens 'general' pertencem ao Modo Geral (Matrix), não à aba P2P
if (!selectedContact) return [];
const isSrv = isCentralServer(selectedContact);
return messages.filter(msg =>
(msg.sender === selectedContact && msg.recipient === 'you') ||
(msg.sender === 'you' && msg.recipient === selectedContact) ||
(msg.systemFor === selectedContact) ||
(isSrv && msg.recipient === selectedContact) ||
(isSrv && msg.sender === selectedContact)
);
}, [messages, selectedContact]);

// ── Prévia da última mensagem por contato (padrão WhatsApp/Signal) ──
const lastMsgByPeer = useMemo(() => {
  const map = {};
  messages.forEach(m => {
    if (!m.timestamp || m.type === 'poll-create' || m.type === 'quiz-question') return;
    const peer = m.sender === 'you' ? m.recipient : m.sender;
    if (!peer || peer === 'general' || peer === 'you') return;
    if (!map[peer] || m.timestamp > map[peer].timestamp) map[peer] = m;
  });
  return map;
}, [messages]);

const relTime = (ts) => {
  if (!ts) return '';
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return 'agora';
  if (d < 3600) return Math.floor(d/60) + 'm';
  if (d < 86400) return Math.floor(d/3600) + 'h';
  return Math.floor(d/86400) + 'd';
};

const MessageText = ({ msg, onContentChange, onHide }) => {
  const contactPeer = msg.sender === 'you' ? msg.recipient : msg.sender;
  const isE2EE = typeof msg.text === 'string' && msg.text.startsWith(E2EE_PREFIX);
  const isGroup = typeof msg.text === 'string' && msg.text.startsWith(GROUP_E2EE_PREFIX);

  // ── Per-user quiz-bot translation ──────────────────────────────
  const isQuizBot = msg.senderName === '🤖 Quiz Bot';
  const quizCacheKey = `pt|${lang}|${msg.text}`;
  const [quizTranslated, setQuizTranslated] = useState(() => {
    if (!isQuizBot) return null;
    if (lang === 'pt') return msg.text || null;
    // Prioridade 1: já veio traduzido do handleIncomingData (caso normal)
    if (msg.translatedText) return msg.translatedText;
    // Prioridade 2: cache sessionStorage (recarregou a página)
    return _gtCache[quizCacheKey] || null;
  });
  const [quizTranslating, setQuizTranslating] = useState(false);

  useEffect(() => {
    if (!isQuizBot || !msg.text) { setQuizTranslated(null); return; }
    if (lang === 'pt') { setQuizTranslated(msg.text); return; }
    // Caso 1: já traduzido — usa direto, zero fetch
    if (msg.translatedText) { setQuizTranslated(msg.translatedText); return; }
    // Caso 2: cache sessionStorage disponível — usa direto, zero fetch
    if (_gtCache[quizCacheKey]) { setQuizTranslated(_gtCache[quizCacheKey]); return; }
    // Caso 3: fallback (mensagem antiga sem pré-tradução) — fetch com deduplicação
    let cancelled = false;
    setQuizTranslating(true);
    translateQuizText(msg.text, lang)
      .then(result => { if (!cancelled) setQuizTranslated(result); })
      .catch(() => { if (!cancelled) setQuizTranslated(msg.text); })
      .finally(() => { if (!cancelled) setQuizTranslating(false); });
    return () => { cancelled = true; };
  }, [isQuizBot, msg.text, lang, msg.translatedText, quizCacheKey]);
  // ──────────────────────────────────────────────────────────────

  const cacheKey = `${msg.timestamp}-${msg.text}`;
  const [display, setDisplay] = useState(() => {
    if (!isE2EE && !isGroup) return { plain: msg.text, encrypted: false };
    if (decryptionCache.current.has(cacheKey)) return decryptionCache.current.get(cacheKey);
    return null;
  });

  useEffect(() => {
    if (onContentChange) onContentChange();
  }, [display, onContentChange]);

  useEffect(() => {
    if (display && (display.noKey || display.error)) {
      if (onHide) onHide(msg.timestamp);
    }
  }, [display, msg.timestamp, onHide]);

  useEffect(() => {
    if (!isE2EE && !isGroup) return;
    if (decryptionCache.current.has(cacheKey)) {
      setDisplay(decryptionCache.current.get(cacheKey));
      return;
    }

    let isMounted = true;
    const runDecryption = async () => {
      if (isGroup) {
        const b64 = msg.text.slice(GROUP_E2EE_PREFIX.length);
        const serverSecrets = Object.values(serverE2EE).filter(s => s.groupSecret).map(s => s.groupSecret);
        if (serverSecrets.length === 0) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, noKey: true, isGroup: true });
          return;
        }
        for (const secret of serverSecrets) {
          try {
            const plain = await decryptMsg(b64, secret);
            const result = { plain, encrypted: true, isGroup: true };
            decryptionCache.current.set(cacheKey, result);
            if (isMounted) setDisplay(result);
            return;
          } catch(e) {}
        }
        if (isMounted) setDisplay({ plain: null, encrypted: true, error: true, isGroup: true });
      } else {
        const b64 = msg.text.slice(E2EE_PREFIX.length);
        const isMine = msg.sender === 'you';
        const secret = isMine ? e2eeState[contactPeer]?.mySecret : e2eeState[contactPeer]?.contactSecret;
        if (!secret) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, noKey: true });
          return;
        }
        try {
          const plain = await decryptMsg(b64, secret);
          const result = { plain, encrypted: true };
          decryptionCache.current.set(cacheKey, result);
          if (isMounted) setDisplay(result);
        } catch(e) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, error: true });
        }
      }
    };

    runDecryption();
    return () => { isMounted = false; };
  }, [msg.text, contactPeer, e2eeState[contactPeer]?.mySecret, e2eeState[contactPeer]?.contactSecret, JSON.stringify(serverE2EE)]);

  const renderMarkdown = (text) => {
    if (!text) return null;
    if (window.marked && window.DOMPurify) {
      const rawHtml = marked.parse(text);
      const cleanHtml = DOMPurify.sanitize(rawHtml);
      return <div className="md-editor-preview" style={{ padding: 0, background: 'transparent' }} dangerouslySetInnerHTML={{ __html: sanitizeHTML(cleanHtml) }} />;
    }
    return text;
  };

  const isInvite = msg.isInvite;

  const handleAcceptInvite = () => {
    if (msg.inviteData) {
      setServerE2EE(prev => ({ ...prev, [msg.inviteData.serverId]: { active: true, groupSecret: msg.inviteData.groupSecret } }));
      connectToPeer(msg.inviteData.serverId);
      setMessages(prev => prev.map(m => m.timestamp === msg.timestamp ? { ...m, isInvite: false, text: t(lang, 'joinedGroup', { id: msg.inviteData.serverId }) } : m));
    }
  };

  const handleDeclineInvite = () => {
    setMessages(prev => prev.map(m => m.timestamp === msg.timestamp ? { ...m, isInvite: false, text: t(lang, 'declinedGroup', { id: msg.inviteData.serverId }) } : m));
  };

  if (isInvite) {
    return (
      <div className="invite-container" style={{ marginTop: '8px', padding: '10px', background: '#f0f9ff', borderRadius: '8px', border: '1px solid #bae6fd' }}>
        <div style={{ fontSize: '13px', marginBottom: '8px', color: '#0369a1', fontWeight: '500' }}>{msg.text}</div>
        <div style={{ display: 'flex', gap: '8px' }}>
          <button onClick={handleAcceptInvite} style={{ background: '#10b981', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{t(lang, 'accept')}</button>
          <button onClick={handleDeclineInvite} style={{ background: '#ef4444', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{t(lang, 'decline')}</button>
        </div>
      </div>
    );
  }

  if (display === null) return null;
  if (!display.encrypted) {
    if (isQuizBot) {
      const displayTxt = quizTranslated !== null ? quizTranslated : (quizTranslating ? '⏳ ...' : display.plain);
      const langName = getLangName(lang);
      return (
        <div>
          {lang !== 'pt' && (
            <div style={{ fontSize: '10px', color: '#64748b', marginBottom: '3px', fontStyle: 'italic' }}>
              🌐 {langName}
            </div>
          )}
          <div style={{ whiteSpace: 'pre-wrap' }}>{displayTxt}</div>
        </div>
      );
    }
    // For regular text messages: show translated text when available (from auto-translate)
    const isSentByMe = msg.sender === 'you';
    if (!isSentByMe && msg.translatedText && msg.translatedText !== display.plain) {
      return (
        <div>
          <div>{renderMarkdown(msg.translatedText)}</div>
          <div style={{ fontSize: '10px', color: '#94a3b8', marginTop: '3px', fontStyle: 'italic', display: 'flex', alignItems: 'center', gap: '4px' }}>
            🌐 <span style={{ textDecoration: 'line-through', opacity: 0.6 }}>{display.plain.slice(0, 50)}{display.plain.length > 50 ? '…' : ''}</span>
          </div>
        </div>
      );
    }
    return <div>{renderMarkdown(display.plain)}</div>;
  }
  if (display.noKey || display.error) return null;
  const decryptedText = display.plain;
  // Show translated version of decrypted text when available
  if (msg.sender !== 'you' && msg.translatedText && msg.translatedText !== decryptedText) {
    return (
      <div>
        <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>{display.isGroup ? '🛡️ GROUP' : '🔒 PRIVATE'}</div>
        <div>{renderMarkdown(msg.translatedText)}</div>
        <div style={{ fontSize: '10px', color: '#94a3b8', marginTop: '3px', fontStyle: 'italic' }}>🌐 {decryptedText.slice(0, 40)}{decryptedText.length > 40 ? '…' : ''}</div>
      </div>
    );
  }
  return (
    <div>
      <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>{display.isGroup ? '🛡️ GROUP' : '🔒 PRIVATE'}</div>
      <div>{renderMarkdown(decryptedText)}</div>
    </div>
  );
};


const sendDirectMessage = async () => {
if (!userName.trim()) { window.k10Toast(t(lang, 'pleaseSetName'), 'warning'); return; }
if (!newMessage.trim() || cooldownRemaining > 0 || isSending) return;
if (newMessage.length > 2000) { window.k10Toast(t(lang, 'msgTooLong'), 'warning'); return; }


if (selectedContact) {
  // Se o libp2p estiver online, permitimos tentar o envio mesmo sem conexão PeerJS direta imediata
  const conn = connectionsRef.current.find(c => c.peer === selectedContact);
  const libp2pAvailable = libp2pRef.current && libp2pStatus === 'online';
  const matrixAvailable = !!(window.MxDM && window.MxDM.canSend && window.MxDM.canSend(selectedContact));
  if ((!conn || !conn.open) && !libp2pAvailable && !matrixAvailable) { 
    window.k10Toast(t(lang, 'contactOffline', { name: getContactName(selectedContact) }), 'warning'); 
    return; 
  }
} else if (connectionsRef.current.length === 0 && libp2pStatus !== 'online') {
// FIX V67-BUG2: era alert() bloqueante — travava o event loop do JS enquanto
// o usuário não clicava OK. Com o JS travado, o PeerJS não enviava heartbeats
// e todas as conexões morriam (timeout). Substituído por mensagem inline no chat.
const _errMsg = t(lang, 'noConnections') || 'Sem conexões P2P ativas. Aguarde a rede se conectar.';
// ── MODO GERAL NOVO: injeta erro no overlay Matrix (recipient:'general' não renderiza mais na aba P2P) ──
const _errTime = formatTime(new Date());
if (typeof window._matrixGeralInjetarMsg === 'function')
  window._matrixGeralInjetarMsg('⚠️ ' + _errMsg, 'System', _errTime);
return;
}


setIsSending(true);
const currentCooldown = Math.max(1, Math.floor(networkSize / 1000));
setCooldownRemaining(currentCooldown);


try {
const timestamp = new Date();
const msgId = Date.now() + Math.random().toString(36).substring(2);
if (registerSentMessage) registerSentMessage(msgId);
let textToSend = newMessage;


if (selectedContact && (!selectedIsServer || serverGroupActive)) {
if (selectedIsServer && serverGroupActive) {
textToSend = GROUP_E2EE_PREFIX + await encryptMsg(newMessage, serverE2EE[selectedContact].groupSecret);
} else if (!selectedIsServer && canSendPrivate) {
textToSend = E2EE_PREFIX + await encryptMsg(newMessage, e2eeState[selectedContact].mySecret);
}
const conn = connectionsRef.current.find(c => c.peer === selectedContact && c.open); // FIX N-8 V20: era connections.find (stale pós-await encryptMsg)
const fallbackConn = conn ? null : connectionsRef.current.find(c => c.open && isCentralServer(c.peer));
const sendConn = conn || fallbackConn;

const msgPayload = { type: 'message', id: msgId, ttl: 15, text: textToSend, sender: peerId, senderName: userName, recipient: selectedContact, direct: true, time: formatTime(timestamp) };

let directSent = false;
// FASE 2/3: Matrix DM é o transporte primário user↔user.
if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(selectedContact)) {
  try {
    await window.MxDM.send(selectedContact, msgPayload);
    directSent = true;
    addAudit(`[MxDM] DM Out: ${msgId.slice(0,8)} → ${selectedContact}`, 'success');
  } catch(e) { console.warn('[MxDM] send error:', e); }
}

// Libp2p fica apenas como fallback legado, nunca como base do privado.
if (!directSent && libp2pRef.current && libp2pStatus === 'online') {
  try {
    await libp2pRef.current.services.pubsub.publish(`k10-private-${selectedContact}`, new TextEncoder().encode(JSON.stringify(msgPayload)));
    directSent = true;
    addAudit(`[libp2p] DM fallback Out: ${msgId.slice(0,8)}`, 'success');
  } catch(e) { console.warn('[libp2p] Private DM Publish error:', e); }
}
// Fallback PeerJS (mantido para WebRTC voz/vídeo/arquivos da Fase 3)
if (!directSent && sendConn) {
  sendConn.send(msgPayload);
} else if (!directSent && !sendConn) {
  throw new Error('No connection available (Matrix/PeerJS/libp2p) to send private message.');
}

const newMsgObj = { text: textToSend, sender: 'you', recipient: selectedContact, senderName: userName, time: formatTime(timestamp), type: 'text', direct: true, timestamp: timestamp.getTime() };
setMessages(prev => {
const updated = [...prev, newMsgObj].slice(-500);
return updated;
}) ;
} else {
// Sem contato selecionado na aba P2P → redireciona para o Modo Geral (Matrix)
if (typeof window._matrixGeralActive === 'function') window._matrixGeralActive();
}
setNewMessage('');
} catch (err) { window.k10Toast(t(lang, 'sendError') + err.message, 'error'); }
finally { setIsSending(false); }
};


const handleSecretSent = (targetPeer, mySecret) => {
setE2eeState(prev => ({ ...prev, [targetPeer]: { ...prev[targetPeer], mySecret } }));
};
const handleServerE2EEActivate = (srvId, groupSecret) => {
setServerE2EE(prev => ({ ...prev, [srvId]: { active: true, groupSecret } }));
};
const handleServerE2EEDeactivate = (srvId) => {
setServerE2EE(prev => { const u = { ...prev }; delete u[srvId]; return u; });
};
const deleteMessage = (ts) => {
setMessages(prev => { const u = prev.filter(m => m.timestamp !== ts); return u; });
};
const deleteMessagesByContact = (pId) => {
setMessages(prev => { const u = prev.filter(m => !((m.sender === pId && m.recipient === 'you') || (m.sender === 'you' && m.recipient === pId) || m.systemFor === pId)); return u; });
};


const scrollToBottom = (behavior = "smooth", force = false) => {
if (messagesContainerRef.current) {
const container = messagesContainerRef.current;
const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 150;


if (force || isAtBottom) {
// Use a small timeout to ensure DOM is fully updated
setTimeout(() => {
container.scrollTo({
top: container.scrollHeight,
behavior
});
}, 50);
}
}
};


useEffect(() => {
scrollToBottom("auto", true);
}, [selectedContact]);


useEffect(() => {
scrollToBottom("smooth");
}, [filteredMessages]);


useEffect(() => {
remoteStreams.forEach(({ peerId: rPeerId, stream, type }) => {
if (type === 'voice') { const el = audioRefs.current[rPeerId]; if (el && el.srcObject !== stream) { el.srcObject = stream; el.play().catch(() => {}); } }
else if (type === 'video') { const el = videoRefs.current[rPeerId]; if (el && el.srcObject !== stream) { el.srcObject = stream; el.play().catch(() => {}); } }
});
}, [remoteStreams]);


const getInputStatus = () => {
// BUG C-5 FIX: cooldown deve ser checado PRIMEIRO, independente do selectedContact.
// Antes, em modo geral (sem contato), o placeholder de cooldown nunca era exibido.
if (cooldownRemaining > 0) return { placeholder: t(lang, 'waitCooldown', { s: cooldownRemaining }), style: {} };
if (!selectedContact) return { placeholder: t(lang, 'generalMsg'), style: {} };
if (selectedIsServer && serverGroupActive)
return { placeholder: t(lang, 'groupMsg', { name: getContactName(selectedContact) }), style: { borderColor: '#3b82f6', boxShadow: '0 0 0 2px rgba(59,130,246,0.2)' } };
if (selectedIsServer)
return { placeholder: t(lang, 'generalMsg'), style: {} };
if (canSendPrivate && !selectedIsServer)
return { placeholder: t(lang, 'privateMsg', { name: getContactName(selectedContact) }), style: { borderColor: '#10b981', boxShadow: '0 0 0 2px rgba(16,185,129,0.2)' } };
return { placeholder: t(lang, 'regularMsg', { name: getContactName(selectedContact) }), style: {} };
};


const inputStatus = getInputStatus();


return (
<div>
{showSendSecretModal && (
<SendSecretModal lang={lang} connections={connections} contacts={contacts} getContactName={getContactName}
isCentralServer={isCentralServer} onSend={handleSecretSent} onClose={() => setShowSendSecretModal(false)} e2eeState={e2eeState} />
)}
{showServerE2EEModal && selectedContact && isCentralServer(selectedContact) && (
<ServerE2EEModal lang={lang} serverId={selectedContact} connections={connections} e2eeState={e2eeState}
getContactName={getContactName} onActivate={handleServerE2EEActivate} onDeactivate={handleServerE2EEDeactivate}
onClose={() => setShowServerE2EEModal(false)} currentServerE2EE={serverE2EE[selectedContact]} />
)}


<div className="chat-main-container">
{/* V101: sidebar única com conteúdo contextual por aba */}
<div className="conversations-list">
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px' }}>
    <h4 style={{ margin: 0 }}>
      {activeChatTab === 'p2p' ? '👤 P2P' :
       activeChatTab === 'general' ? '🌐 Geral' :
       activeChatTab === 'youtube' ? '📺 YouTube' :
       activeChatTab === 'group' ? '🔒 Grupos' :
       activeChatTab === 'salinhas' ? '💬 Salinhas' :
       t(lang, 'conversations')}
    </h4>
    <button className="icon-btn" onClick={() => setShowTorrentManager(true)} title={t(lang, 'torrentManager')} style={{ padding: '4px' }}>
      <i className="fas fa-magnet"></i>
    </button>
  </div>
  {/* Lista de contatos P2P — keep-alive */}
  <div className="k10-sidebar-panel" hidden={activeChatTab !== 'p2p'}>{(() => {
    // V46: só aparece na lista: (1) contatos salvos, (2) quem mandou msg direta
    // APENAS K10-CENTRAL fica oculto — todos os outros contatos/servidores aparecem normalmente
    // FIX-CONTACTS-LIST: aparece na lista SOMENTE se o usuário selecionou explicitamente
    // o contato (activatedContacts) OU se o contato fez uma chamada/enviou mensagem direta (directPeers).
    // Removido: contacts.some(c => c.peerId === conn.peer) — esta condição fazia qualquer contato
    // salvo aparecer ao se conectar automaticamente via mesh (peer-list/pex), sem ação do usuário.
    const peerJsIds = new Set(connections.map(c => c.peer));
    const allPeers = Array.from(new Set([...peerJsIds, ...(libp2pPeers || [])]));

    const visiblePeers = allPeers.filter(pId => 
      pId !== 'K10-CENTRAL' && pId !== 'K10-HUB-V62' && (
        (activatedContacts && activatedContacts.has(pId)) ||
        (activatedContactsRef && activatedContactsRef.current.has(pId)) ||
        (directPeers && directPeers.has(pId)) ||
        (directPeersRef && directPeersRef.current.has(pId)) ||
        pId === selectedContact
      )
    );

    let finalConns = visiblePeers.map(pId => {
      const conn = connections.find(c => c.peer === pId);
      return conn || { peer: pId, open: false, _libp2pOnly: true };
    });

    // ── Fuse.js: filtra contatos pelo nome ou peerId quando há busca ──
    if (contactSearch.trim() && finalConns.length > 0 && window.Fuse) {
      const searchItems = finalConns.map(conn => ({
        ...conn,
        _displayName: getContactName(conn.peer),
      }));
      const fuse = new window.Fuse(searchItems, {
        keys: ['_displayName', 'peer'],
        threshold: 0.4,
        distance: 100,
      });
      finalConns = fuse.search(contactSearch.trim()).map(r => r.item);
    }

    const hasAnyPeers = visiblePeers.length > 0;
    return (
      <>
        {/* Fuse.js: campo de busca — aparece apenas com 2+ contatos */}
        {hasAnyPeers && (
          <div style={{ padding: '0 0 8px 0', position: 'relative' }}>
            <i className="fas fa-search" style={{ position:'absolute', left:'10px', top:'50%', transform:'translateY(-50%)', color:'var(--text-muted)', fontSize:'12px', pointerEvents:'none' }}></i>
            <input
              type="text"
              value={contactSearch}
              onChange={e => setContactSearch(e.target.value)}
              placeholder="Buscar contato..."
              style={{ width:'100%', padding:'6px 10px 6px 28px', border:'1.5px solid var(--border)', borderRadius:'7px', fontSize:'12px', outline:'none', background:'var(--surface)', color:'var(--text)', boxSizing:'border-box' }}
              onFocus={e => e.target.style.borderColor='var(--primary)'}
              onBlur={e => e.target.style.borderColor='var(--border)'}
            />
          </div>
        )}
        {finalConns.length === 0 ? (
          <div style={{ padding: '16px', color: 'var(--text-muted)', fontSize: '13px', textAlign: 'center' }}>
            {contactSearch.trim() ? '🔍 Nenhum contato encontrado' : t(lang, 'waitingConnections')}
          </div>
        ) : finalConns.map((conn, i) => {
      const isSelected = selectedContact === conn.peer;
      const hasVoice = activeCalls.some(c => c.peerId === conn.peer && c.type === 'voice');
      const hasVideo = activeCalls.some(c => c.peerId === conn.peer && c.type === 'video' && c.localStream);
      const e2ee = e2eeState[conn.peer];
      const hasMine = !!e2ee?.mySecret, hasTheirs = !!e2ee?.contactSecret;
      const isServer = isCentralServer(conn.peer);
      const srvGrpActive = isServer && serverE2EE[conn.peer]?.active;
      return (
        <div key={i} className={`conversation-item${isSelected ? ' selected' : ''}${conn.peer === centralServerId ? ' central-server' : ''}`}
          onClick={() => { const sel = isSelected ? null : conn.peer; setSelectedContact(sel); if (sel) changeTab('p2p'); else changeTab('general'); }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <Avatar peerId={conn.peer} name={getContactName(conn.peer)} avatars={avatars} size="medium" />
              <div>
                <div className="conversation-name">

<div className="chat-messages-container">
{/* ── Tab bar: 5 abas sempre visíveis ── */}
{(() => {
  const tabStyle = (id, color) => ({
    flex: 1, padding: '9px 4px 8px', border: 'none',

    borderBottom: activeChatTab === id ? `2px solid ${color}` : '2px solid transparent',

    fontSize: '11px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px', position: 'relative'
  });
  // ── Navegação por teclado (WCAG 2.1 pattern para tabs) ──
  const TAB_ORDER = ['p2p', 'general', 'youtube', 'group', 'salinhas'];
  const handleTabKeyDown = (e) => {
    const idx = TAB_ORDER.indexOf(activeChatTab);
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      const next = TAB_ORDER[(idx + 1) % TAB_ORDER.length];
      changeTab(next);
      setTimeout(() => document.querySelector(`[data-tab="${next}"]`)?.focus(), 10);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      const prev = TAB_ORDER[(idx - 1 + TAB_ORDER.length) % TAB_ORDER.length];
      changeTab(prev);
      setTimeout(() => document.querySelector(`[data-tab="${prev}"]`)?.focus(), 10);
    } else if (e.key === 'Home') {
      e.preventDefault();
      changeTab(TAB_ORDER[0]);
      setTimeout(() => document.querySelector(`[data-tab="${TAB_ORDER[0]}"]`)?.focus(), 10);
    } else if (e.key === 'End') {
      e.preventDefault();
      changeTab(TAB_ORDER[TAB_ORDER.length - 1]);
      setTimeout(() => document.querySelector(`[data-tab="${TAB_ORDER[TAB_ORDER.length - 1]}"]`)?.focus(), 10);
    }
  };
  const UnreadBadge = ({count}) => count > 0 ? (
    <span style={{position:'absolute',top:'3px',right:'3px',background:'#ef4444',color:'white',fontSize:'9px',fontWeight:700,borderRadius:'10px',padding:'1px 4px',minWidth:'14px',textAlign:'center',lineHeight:'14px'}}>{count > 99 ? '99+' : count}</span>

        <span style={{ fontSize: '15px' }}>👤</span>
        <span>P2P</span>
        <UnreadBadge count={tabUnread.p2p} />
      </button>
      {/* Geral */}
      <button role="tab" data-tab="general" aria-selected={activeChatTab === 'general'} tabIndex={activeChatTab === 'general' ? 0 : -1}
        onClick={() => { setSelectedContact(null); changeTab('general'); }} onKeyDown={handleTabKeyDown} style={tabStyle('general', '#10b981')} title="Modo Geral — broadcast P2P">
        <span style={{ fontSize: '15px' }}>🌐</span>
        <span>Geral</span>
        <UnreadBadge count={tabUnread.general} />
      </button>
      {/* YouTube */}
      <button role="tab" data-tab="youtube" aria-selected={activeChatTab === 'youtube'} tabIndex={activeChatTab === 'youtube' ? 0 : -1}
        onClick={() => changeTab('youtube')} onKeyDown={handleTabKeyDown} style={tabStyle('youtube', '#ef4444')} title="YouTube Chat">
        <span style={{ fontSize: '15px' }}><i className="fab fa-youtube"></i></span>
        <span>YouTube</span>
        {youtubeChatId && <span style={{ position:'absolute', top:'4px', right:'6px', background:'#ef4444', borderRadius:'50%', width:'7px', height:'7px' }}></span>}
      </button>
      {/* Grupos */}
      <button role="tab" data-tab="group" aria-selected={activeChatTab === 'group'} tabIndex={activeChatTab === 'group' ? 0 : -1}
        onClick={() => changeTab('group')} onKeyDown={handleTabKeyDown} style={tabStyle('group', '#2563eb')} title="Grupos (Ferramentas)">
        <span style={{ fontSize: '15px' }}>🔒</span>
        <span>Grupos</span>
        <UnreadBadge count={tabUnread.group} />
      </button>
      {/* Salinhas */}
      <button role="tab" data-tab="salinhas" aria-selected={activeChatTab === 'salinhas'} tabIndex={activeChatTab === 'salinhas' ? 0 : -1}
        onClick={() => changeTab('salinhas')} onKeyDown={handleTabKeyDown} style={tabStyle('salinhas', '#10b981')} title="Salinhas Matrix">
        <span style={{ fontSize: '15px' }}>💬</span>
        <span>Salinhas</span>
      </button>
    </div>
  );
})()}

)}
{msg.sender !== '__system__' && <div className="message-timestamp">{msg.time}</div>}

</div>
)})}

const FloatingWindow = ({ title, onClose, children, initialPosition, initialSize, onNextCamera }) => {
const [pos, setPos] = useState(initialPosition || { x: 50, y: 50 });
const [size, setSize] = useState(initialSize || { width: 320, height: 240 });
const [isDragging, setIsDragging] = useState(false);
const [isResizing, setIsResizing] = useState(false);
const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
const [resizeStart, setResizeStart] = useState({ x: 0, y: 0, w: 0, h: 0 });
const [showSettings, setShowSettings] = useState(false);
const [opacity, setOpacity] = useState(1);
const [headerColor, setHeaderColor] = useState('#2563eb');


const handleMouseDown = (e) => {
if (e.target.closest('.window-controls')) return;
setIsDragging(true);
setDragOffset({
x: e.clientX - pos.x,
y: e.clientY - pos.y
});
};


const handleResizeDown = (e) => {
e.preventDefault();
e.stopPropagation();
setIsResizing(true);
setResizeStart({
x: e.clientX,
y: e.clientY,
w: size.width,
h: size.height
});
};


const handleMouseMove = (e) => {
if (isDragging) {
setPos({
x: e.clientX - dragOffset.x,
y: e.clientY - dragOffset.y
});
}
if (isResizing) {
const dw = e.clientX - resizeStart.x;
const dh = e.clientY - resizeStart.y;
setSize({
width: Math.max(200, resizeStart.w + dw),
height: Math.max(150, resizeStart.h + dh)
});
}
};


const handleMouseUp = () => {
setIsDragging(false);
setIsResizing(false);
};


useEffect(() => {
if (isDragging || isResizing) {
window.addEventListener('mousemove', handleMouseMove);
window.addEventListener('mouseup', handleMouseUp);
} else {
window.removeEventListener('mousemove', handleMouseMove);
window.removeEventListener('mouseup', handleMouseUp);
}
return () => {
window.removeEventListener('mousemove', handleMouseMove);
window.removeEventListener('mouseup', handleMouseUp);
};
}, [isDragging, isResizing, dragOffset, resizeStart]);


return (
<div className="floating-window" style={{
position: 'fixed',

// Cache de imagens: query -> URL  (evita chamar API repetidamente)
// Cache de rodada: guarda SÓ a URL escolhida para etapa 2 reusar a mesma foto
// Limpo a cada nova rodada — nunca acumula no computador do usuário
const _worldImgCache = {};
const _worldImgLocks = {};

async function fetchWorldImage(query, usedImagesSet, syncCallback) {
  if (!Array.isArray(_worldImgCache[query])) {
    _worldImgCache[query] = [];
  }

  if (_worldImgCache[query].length === 0) {
    if (!_worldImgLocks[query]) {
      _worldImgLocks[query] = (async () => {
        const key = getPixabayKey();
        try {
          const url = `https://pixabay.com/api/?key=${key}&q=${encodeURIComponent(query)}&image_type=photo&safesearch=true&per_page=200&orientation=horizontal`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.hits && data.hits.length > 0) {
            let hitsArr = [...data.hits];
            // Fisher-Yates shuffle
            for (let i = hitsArr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [hitsArr[i], hitsArr[j]] = [hitsArr[j], hitsArr[i]];
            }
            _worldImgCache[query] = hitsArr;
            
            // ── SOLUÇÃO 2: Limpeza LRU Simples (Prevenção Memory Leak) ──
            const keys = Object.keys(_worldImgCache);
            if (keys.length > 20) {
              const oldKey = keys.find(k => k !== query);
              if (oldKey) delete _worldImgCache[oldKey];
            }
            
            if (syncCallback) syncCallback(hitsArr);
          }
        } catch(e) { console.warn('Pixabay fetch error', e); } finally {
          _worldImgLocks[query] = null;
        }
      })();
    }
    await _worldImgLocks[query];
  }

  while (_worldImgCache[query].length > 0) {
    const pick = _worldImgCache[query].shift();
    if (usedImagesSet && !usedImagesSet.has(pick.id)) {
       usedImagesSet.add(pick.id);
       return pick; // Retorna todo o objeto 'hit' (incluindo .id e .webformatURL/.largeImageURL)
    }
  }
  return null;
}

// Gera 3 alternativas falsas de um array, evitando o valor correto
function pickFakeAlts(pool, correct, count = 3) {
  const filtered = pool.filter(v => v.toLowerCase() !== correct.toLowerCase());
  const shuffled = filtered.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Monta 4 alternativas (1 certa + 3 erradas) embaralhadas; retorna [opts, correctIndex]
function buildAlternatives(pool, correct) {
  const fakes = pickFakeAlts(pool, correct, 3);
  const all = [...fakes, correct].sort(() => Math.random() - 0.5);
  const correctIdx = all.findIndex(v => v.toLowerCase() === correct.toLowerCase());
  return [all, correctIdx];
}

const QuizBotWindow = ({ lang, onClose, quizBotActive, setQuizBotActive, askNextQuestion, quizInterval, setQuizInterval, quizIntervalInput, setQuizIntervalInput, quizDiscipline, setQuizDiscipline, serverQuizBotActive, notifyServer, quizJitterTimerRef, broadcastToggle, sendQuizHandoff, quizServerOwnerId, globalQuizOwner, setGlobalQuizOwner, quizMasterIdRef, peerId, quizStopCooldown, startQuizStopCooldown }) => {

        <div style={{ marginBottom: '10px', textAlign: 'left' }}>
          <label style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{t(lang, 'quizDiscipline')}</label>
          <select value={quizDiscipline} onChange={e => setQuizDiscipline(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text)', marginTop: '4px' }} disabled={quizBotActive}>
            <option value="all">{t(lang, 'quizAllDisciplines')}</option>
            {QUIZ_SUBJECTS.map(sub => (
              <option key={sub.id} value={sub.id}>{sub.emoji} {t(lang, sub.nameKey)}</option>
            ))}
          </select>
        </div>
        <div style={{ marginBottom: '20px', textAlign: 'left' }}>
          <label style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{t(lang, 'quizTimePerQuestion')}</label>
          <input 
            type="number" 
            value={quizIntervalInput} 
            onChange={e => setQuizIntervalInput(Number(e.target.value))} 
            onBlur={() => {
              const val = Math.max(DEFAULT_QUIZ_INTERVAL, quizIntervalInput);
              setQuizIntervalInput(val);
              setQuizInterval(val);
            }}
            min="120" 
            style={{ width: '100%', padding: '8px', borderRadius: '4px', background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text)', marginTop: '4px' }} 
            disabled={quizBotActive} 
          />

        <div style={{ marginBottom: '20px' }}>
          <span style={{ display: 'inline-block', padding: '8px 16px', borderRadius: '20px', background: quizBotActive ? '#10b98120' : '#ef444420', color: quizBotActive ? '#10b981' : '#ef4444', fontWeight: 'bold' }}>
            {quizBotActive ? t(lang, 'quizActive') : t(lang, 'quizInactive')}
          </span>
        </div>

        <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginTop: 'auto' }}>
          {(() => {
            // V69-LOCK-2: dono = quem ativou via P2P ou via servidor
            const peerP2POwner = quizBotActive && globalQuizOwner && globalQuizOwner !== peerId;
            const isLockedByServer = serverQuizBotActive && quizServerOwnerId !== peerId;
            const isLocked = peerP2POwner || isLockedByServer;
            const iAmOwner = (quizBotActive && globalQuizOwner === peerId) ||
                             (serverQuizBotActive && quizServerOwnerId === peerId);

            // V69-LOCK-2: não-donos NUNCA veem o botão Stop — apenas um painel de bloqueio
            if (isLocked) {
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#f1f5f9', border: '1.5px solid #e2e8f0',
                  textAlign: 'center', color: '#64748b', fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                }}>
                  {t(lang, 'quizLockedByOther')}
                </div>
              );
            }

            // V73: cooldown pós-parada — bloqueia botão de iniciar para todos por 3 min
            if (!quizBotActive && quizStopCooldown > 0) {
              const mins = Math.floor(quizStopCooldown / 60);
              const secs = quizStopCooldown % 60;
              const display = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#fff7ed', border: '1.5px solid #fed7aa',
                  textAlign: 'center', color: '#c2410c', fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                }}>
                  {t(lang, 'quizStopCooldownMsg', { s: display })}
                </div>
              );
            }

            return (
          <button 
            className="primary-btn" 
            onClick={() => {
              const newActive = !quizBotActive;
              let handoffSent = false;
              if (!newActive && sendQuizHandoff) {
                try { sendQuizHandoff(); handoffSent = true; } catch(e) { console.warn('Quiz handoff failed', e); }
              }
              setGlobalQuizOwner(newActive ? peerId : null);
              setQuizBotActive(newActive);
              if (newActive) {
                notifyServer('quiz-bot-start');
              } else if (!handoffSent) {
                notifyServer('quiz-bot-stop');
              }
              if (broadcastToggle) broadcastToggle(newActive);
              if (newActive) {
                const initialJitterMs = 1000 + Math.floor(Math.random() * 2000);
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                quizJitterTimerRef.current = setTimeout(askNextQuestion, initialJitterMs);
              } else {
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                if (startQuizStopCooldown) startQuizStopCooldown(); // V73: cooldown 3min para o dono local
              }
            }}
            style={{ background: iAmOwner ? '#ef4444' : '#10b981', width: '100%' }}
          >
            {iAmOwner ? t(lang, 'quizStopBot') : t(lang, 'quizStartBot')}
          </button>
            );
          })()}
        </div>
      </div>
    </FloatingWindow>
  );
};

// IptvPlayer — player HLS.js para streams m3u8
// ══════════════════════════════════════════════════════════════
const loadHlsJs = () => new Promise(resolve => {
  if (window.Hls) { resolve(window.Hls); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js';
  s.onload = () => resolve(window.Hls);
  s.onerror = () => resolve(null);
  document.head.appendChild(s);
});

const IptvPlayer = ({ url, name, flag }) => {
  const videoRef  = useRef(null);
  const hlsRef    = useRef(null);
  const [status,   setStatus]   = useState('loading');
  const [levels,   setLevels]   = useState([]);   // qualidade disponíveis
  const [curLevel, setCurLevel] = useState(-1);   // -1 = Auto
  const [showRes,  setShowRes]  = useState(false);
  const [muted,    setMuted]    = useState(false);
  const [volume,   setVolume]   = useState(1);
  const [fullscr,  setFullscr]  = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!url || !videoRef.current) return;
    setStatus('loading');
    setLevels([]);
    setCurLevel(-1);

    loadHlsJs().then(Hls => {
      if (!Hls) { setStatus('error'); return; }
      if (hlsRef.current) hlsRef.current.destroy();

      if (Hls.isSupported()) {
        const hls = new Hls({ maxBufferLength: 30, startLevel: -1 });
        hlsRef.current = hls;
        hls.loadSource(url);
        hls.attachMedia(videoRef.current);

        hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
          videoRef.current.play().catch(()=>{});
          setStatus('playing');
          // Monta lista de qualidades
          const lvls = data.levels.map((l, i) => ({
            index: i,
            label: l.height ? `${l.height}p` : `Nível ${i+1}`,
            bitrate: l.bitrate,
            width: l.width,
            height: l.height,
          }));
          setLevels(lvls);
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
          setCurLevel(hls.manualLevel === -1 ? -1 : data.level);
        });

        hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) setStatus('error'); });

      } else if (videoRef.current.canPlayType('application/vnd.apple.mpegurl')) {
        videoRef.current.src = url;
        videoRef.current.play().catch(()=>{});
        setStatus('playing');
      } else { setStatus('error'); }
    });
    return () => { if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; } };
  }, [url]);

  const setQuality = (index) => {
    if (!hlsRef.current) return;
    hlsRef.current.currentLevel = index; // -1 = Auto
    hlsRef.current.manualLevel  = index;
    setCurLevel(index);
    setShowRes(false);
  };

  const toggleMute = () => {
    if (!videoRef.current) return;
    videoRef.current.muted = !muted;
    setMuted(!muted);
  };

  const changeVolume = (v) => {
    if (!videoRef.current) return;
    videoRef.current.volume = v;
    setVolume(v);
    if (v === 0) setMuted(true);
    else if (muted) { setMuted(false); videoRef.current.muted = false; }
  };

  const toggleFullscreen = () => {
    if (!wrapRef.current) return;
    if (!document.fullscreenElement) {
      wrapRef.current.requestFullscreen().catch(()=>{});
      setFullscr(true);
    } else {
      document.exitFullscreen();
      setFullscr(false);
    }
  };

  const curLabel = curLevel === -1 ? 'Auto' : (levels[curLevel]?.label || `Nível ${curLevel+1}`);

  return (
    <div ref={wrapRef} style={{ width:'100%', height:'100%', background:'#000', position:'relative',
                                display:'flex', flexDirection:'column', overflow:'hidden' }}>
      {/* Vídeo */}
      <video ref={videoRef}
        style={{ flex:1, width:'100%', display: status==='error'?'none':'block', objectFit:'contain' }}
        onClick={() => setShowRes(false)} />

      {/* Loading */}
      {status === 'loading' && (
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
                      alignItems:'center', justifyContent:'center', gap:'10px', color:'white', background:'#000' }}>
          <div style={{ fontSize:'36px' }}>{flag||'📡'}</div>
          <div style={{ fontSize:'13px', fontWeight:700 }}>{name}</div>
          <div style={{ display:'flex', alignItems:'center', gap:'8px', color:'#94a3b8', fontSize:'11px' }}>
            <div style={{ width:'12px', height:'12px', borderRadius:'50%', border:'2px solid #64748b',
                          borderTopColor:'#60a5fa', animation:'spin 0.8s linear infinite' }}></div>
            Carregando stream...
          </div>
        </div>
      )}

      {/* Erro */}
      {status === 'error' && (
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
                      alignItems:'center', justifyContent:'center', gap:'10px', color:'white', background:'#000' }}>
          <div style={{ fontSize:'36px' }}>📵</div>
          <div style={{ fontSize:'13px', fontWeight:700 }}>{name}</div>
          <div style={{ fontSize:'11px', color:'#ef4444' }}>Stream indisponível</div>
          <button onClick={() => { setStatus('loading'); hlsRef.current?.loadSource(url); }}
            style={{ background:'#1e293b', border:'1px solid #334155', color:'#94a3b8',
                     borderRadius:'6px', padding:'5px 14px', fontSize:'11px', cursor:'pointer' }}>
            ↺ Tentar novamente
          </button>
        </div>
      )}

      {/* ── Barra de controles personalizados ── */}
      {status === 'playing' && (
        <div style={{ flexShrink:0, background:'rgba(0,0,0,0.85)', padding:'6px 10px',
                      display:'flex', alignItems:'center', gap:'8px', borderTop:'1px solid #1e293b' }}>

          {/* Mute / Volume */}
          <button onClick={toggleMute}
            style={{ background:'none', border:'none', color:'white', cursor:'pointer', fontSize:'14px', padding:'2px 6px' }}>
            <i className={`fas fa-volume-${muted||volume===0?'mute':volume<0.5?'down':'up'}`}></i>
          </button>
          <input type="range" min="0" max="1" step="0.05" value={muted ? 0 : volume}
            onChange={e => changeVolume(parseFloat(e.target.value))}
            style={{ width:'64px', accentColor:'#3b82f6', cursor:'pointer' }} />

          {/* Nome do canal */}
          <span style={{ flex:1, color:'#94a3b8', fontSize:'10px', fontWeight:600,
                         whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
            {flag} {name}
          </span>

          {/* ── Seletor de Resolução ── */}
          {levels.length > 0 && (
            <div style={{ position:'relative' }}>
              <button onClick={() => setShowRes(!showRes)}
                style={{ background: showRes?'#1d4ed8':'#1e293b', border:'1px solid #334155',
                         color:'white', borderRadius:'6px', padding:'3px 10px',
                         fontSize:'10px', fontWeight:700, cursor:'pointer',
                         display:'flex', alignItems:'center', gap:'5px' }}>
                <i className="fas fa-sliders-h" style={{fontSize:'9px'}}></i>
                {curLabel}
                <i className={`fas fa-chevron-${showRes?'down':'up'}`} style={{fontSize:'8px'}}></i>
              </button>

              {/* Dropdown de qualidades */}
              {showRes && (
                <div style={{ position:'absolute', bottom:'calc(100% + 6px)', right:0, zIndex:100,
                              background:'#0f172a', border:'1px solid #334155', borderRadius:'8px',
                              overflow:'hidden', minWidth:'120px', boxShadow:'0 8px 24px rgba(0,0,0,0.5)' }}>
                  <div style={{ padding:'6px 10px', fontSize:'9px', fontWeight:700,
                                color:'#475569', letterSpacing:'1px', borderBottom:'1px solid #1e293b' }}>
                    RESOLUÇÃO
                  </div>
                  {/* Auto */}
                  <button onClick={() => setQuality(-1)}
                    style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                             width:'100%', padding:'7px 12px', background: curLevel===-1?'#1d4ed8':'transparent',
                             border:'none', color: curLevel===-1?'white':'#e2e8f0',
                             fontSize:'12px', fontWeight:600, cursor:'pointer', textAlign:'left' }}>
                    <span>⚡ Auto</span>
                    {curLevel === -1 && <i className="fas fa-check" style={{fontSize:'9px',color:'#60a5fa'}}></i>}
                  </button>
                  {/* Níveis disponíveis (do maior para o menor) */}
                  {[...levels].sort((a,b) => (b.height||0)-(a.height||0)).map(lv => (
                    <button key={lv.index} onClick={() => setQuality(lv.index)}
                      style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                               width:'100%', padding:'7px 12px', background: curLevel===lv.index?'#1d4ed8':'transparent',
                               border:'none', color: curLevel===lv.index?'white':'#e2e8f0',
                               fontSize:'12px', fontWeight:600, cursor:'pointer', textAlign:'left' }}>
                      <span>
                        {lv.height >= 1080 ? '🔵 ' : lv.height >= 720 ? '🟢 ' : lv.height >= 480 ? '🟡 ' : '🔴 '}
                        {lv.label}
                        {lv.height >= 1080 ? ' HD' : lv.height >= 720 ? ' HD' : ''}
                      </span>
                      <span style={{ color:'#475569', fontSize:'9px', marginLeft:'8px' }}>
                        {lv.bitrate ? `${Math.round(lv.bitrate/1000)}k` : ''}
                      </span>
                      {curLevel === lv.index && <i className="fas fa-check" style={{fontSize:'9px',color:'#60a5fa'}}></i>}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Fullscreen */}
          <button onClick={toggleFullscreen}
            style={{ background:'none', border:'none', color:'white', cursor:'pointer', fontSize:'13px', padding:'2px 5px' }}>
            <i className={`fas fa-${fullscr?'compress':'expand'}`}></i>
          </button>
        </div>
      )}
    </div>
  );
};

const IptvModal = ({ onClose, onPlay }) => {
  const [channels, setChannels] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [search, setSearch] = useState('');
  const [continente, setContinente] = useState('todos');
  const [countryFilter, setCountryFilter] = useState('todos');

  useEffect(() => {
    Promise.all([
      fetch('https://iptv-org.github.io/api/channels.json').then(r=>r.json()),
      fetch('https://iptv-org.github.io/api/streams.json').then(r=>r.json()),
    ]).then(([chs, streams]) => {
      const chMap = {};
      chs.forEach(c => { chMap[c.id] = c; });
      const list = streams
        .filter(s => s.url && (s.url.includes('.m3u8') || s.url.includes('/live') || s.url.includes('stream')))
        .map(s => {
          const ch = chMap[s.channel] || {};
          const iso = ch.country || 'ZZ';
          return { id: s.channel, name: ch.name || s.channel, url: s.url, iso, flag: ISO_FLAGS[iso] || '🌐', logo: ch.logo || '', cats: (ch.categories||[]).join(',') };
        })
        .filter(c => c.name && c.url);
      setChannels(list);
      setLoading(false);
    }).catch(e => { setError('Erro ao carregar canais: ' + e.message); setLoading(false); });
  }, []);

  // Agrupa por continente
  const getContinent = (iso) => {
    for (const [cont, isos] of Object.entries(CONTINENTES)) {
      if (isos.includes(iso)) return cont;
    }
    return '🌐 Outros';
  };

  const filtered = channels.filter(c => {
    if (search && !c.name.toLowerCase().includes(search.toLowerCase()) && !c.iso.toLowerCase().includes(search.toLowerCase())) return false;
    if (continente !== 'todos' && getContinent(c.iso) !== continente) return false;
    if (countryFilter !== 'todos' && c.iso !== countryFilter) return false;
    return true;
  });

  const allContinentes = [...new Set(channels.map(c => getContinent(c.iso)))].sort();
  const countriesInCont = continente === 'todos'
    ? [...new Set(channels.map(c => c.iso))].sort()
    : [...new Set(channels.filter(c => getContinent(c.iso) === continente).map(c => c.iso))].sort();

            </div>
            <button onClick={onClose} style={{ background:'none', border:'none', color:'#64748b', fontSize:'22px', cursor:'pointer' }}>✕</button>
          </div>

        </div>

        {/* Continents */}
        <div style={{ padding:'8px 12px', borderBottom:'1px solid #1e293b', display:'flex', gap:'6px', overflowX:'auto', flexShrink:0 }}>
          {['todos', ...allContinentes].map(c => (
            <button key={c} onClick={() => { setContinente(c); setCountryFilter('todos'); }}
              style={{ background: continente===c?'#7c3aed':'#1e293b', color: continente===c?'white':'#94a3b8',
                       border: continente===c?'none':'1px solid #334155', borderRadius:'20px',
                       padding:'4px 12px', fontSize:'11px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              {c === 'todos' ? '🌍 Todos' : c}
            </button>
          ))}
        </div>

        {/* Countries */}
        <div style={{ padding:'6px 12px', borderBottom:'1px solid #1e293b', display:'flex', gap:'5px', overflowX:'auto', flexShrink:0 }}>

            style={{ background: countryFilter==='todos'?'#1d4ed8':'#1e293b', color: countryFilter==='todos'?'white':'#94a3b8',
                     border: countryFilter==='todos'?'none':'1px solid #334155', borderRadius:'16px',
                     padding:'3px 10px', fontSize:'10px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
            Todos os países
          </button>
          {countriesInCont.map(iso => (
            <button key={iso} onClick={() => setCountryFilter(iso)}
              style={{ background: countryFilter===iso?'#1d4ed8':'#1e293b', color: countryFilter===iso?'white':'#94a3b8',
                       border: countryFilter===iso?'none':'1px solid #334155', borderRadius:'16px',
                       padding:'3px 10px', fontSize:'10px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              {ISO_FLAGS[iso]||'🌐'} {iso}
            </button>
          ))}
        </div>

        {/* Channel List */}
        <div style={{ flex:1, overflowY:'auto' }}>
          {loading ? (
            <div style={{ padding:'60px', textAlign:'center', color:'#475569' }}>
              <div style={{ fontSize:'40px', marginBottom:'12px' }}>📡</div>
              <div style={{ color:'#94a3b8', fontWeight:600 }}>Carregando canais do mundo inteiro...</div>
              <div style={{ fontSize:'12px', marginTop:'6px' }}>iptv-org.github.io</div>
            </div>
          ) : error ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#ef4444' }}>{error}</div>
          ) : filtered.length === 0 ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#475569' }}>Nenhum canal encontrado</div>
          ) : (
            (() => {
              // Agrupa por país
              const groups = {};
              filtered.forEach(c => {
                const key = `${c.flag} ${c.iso}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(c);
              });
              return Object.entries(groups).sort().map(([country, chs]) => (
                <div key={country}>
                  <div style={{ padding:'8px 16px 4px', fontSize:'11px', fontWeight:700, color:'#475569', letterSpacing:'1px', background:'#0a0f1e', position:'sticky', top:0, zIndex:1 }}>
                    {country} · {chs.length} canal(is)
                  </div>
                  {chs.map((ch, i) => (
                    <div key={i} style={{ display:'flex', alignItems:'center', padding:'10px 16px', borderBottom:'1px solid #0f172a', cursor:'pointer', transition:'background 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.background='#1e293b'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                      onClick={() => onPlay(ch.url, ch.name, ch.iso, ch.flag)}>
                      {ch.logo ? (
                        <img src={ch.logo} alt="" style={{ width:'36px', height:'36px', objectFit:'contain', borderRadius:'4px', marginRight:'12px', background:'#1e293b', flexShrink:0 }}
                          onError={e=>{e.target.style.display='none'}} />
                      ) : (
                        <div style={{ width:'36px', height:'36px', borderRadius:'4px', background:'#1e293b', marginRight:'12px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'18px' }}>{ch.flag}</div>
                      )}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ color:'#e2e8f0', fontWeight:600, fontSize:'13px', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{ch.name}</div>
                        <div style={{ color:'#475569', fontSize:'10px' }}>{ch.cats || 'general'}</div>
                      </div>
                      <button style={{ background:'#7c3aed', color:'white', border:'none', borderRadius:'8px', padding:'6px 14px', fontSize:'11px', fontWeight:700, cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', gap:'5px' }}>
                        <i className="fas fa-play"></i> Transmitir
                      </button>
                    </div>
                  ))}
                </div>
              ));
            })()
          )}
        </div>

        <div style={{ padding:'10px 20px', borderTop:'1px solid #1e293b', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ color:'#475569', fontSize:'11px' }}>Fonte: iptv-org.github.io · {channels.length} streams carregados</span>
          <button onClick={onClose} style={{ background:'none', border:'1px solid #334155', color:'#94a3b8', borderRadius:'6px', padding:'5px 14px', fontSize:'12px', cursor:'pointer' }}>Fechar</button>
        </div>
      </div>
    </div>
  );
};

    ]).then(([chs, streams]) => {
      const chMap = {};
      chs.forEach(c => { chMap[c.id] = c; });

      const list = streams
        .filter(s => s.url && (s.url.includes('.m3u8') || s.url.includes('stream') || s.url.includes('/live')))
        .map(s => {
          const ch = chMap[s.channel] || {};
          const cats = ch.categories || [];
          const primaryCat = CATS_FILMES.find(c => cats.includes(c)) || null;
          if (!primaryCat) return null; // descarta canais sem categoria de filmes
          const iso = ch.country || 'ZZ';
          return {
            id:     s.channel,
            name:   ch.name || s.channel,
            url:    s.url,
            iso,
            flag:   ISO_FLAGS[iso] || '🌐',

              <button key={g} onClick={() => { setGenero(g); setCountryFilter('todos'); }}

              chs.forEach(c => {
                const k = `${c.flag} ${c.iso}`;

                porPais[k].push(c);

                <div key={g}>

                  <div style={{ padding:'10px 16px 6px', background:'linear-gradient(90deg,#1e1b4b,#0f172a)',

                    <span style={{ color:'#475569', fontSize:'11px' }}>· {chs.length} canal(is)</span>
                  </div>

                  {/* Canais dentro do gênero */}
                  {Object.entries(porPais).sort().map(([pais, canais]) => (
                    <div key={pais}>
                      <div style={{ padding:'6px 16px 2px', fontSize:'10px', fontWeight:700,
                                    color:'#334155', letterSpacing:'1px', background:'#0a0f1e',
                                    position:'sticky', top:'37px', zIndex:1 }}>

                              style={{ width:'40px', height:'40px', objectFit:'contain', borderRadius:'6px',
                                       marginRight:'12px', background:'#1e293b', flexShrink:0 }} />
                          ) : (
                            <div style={{ width:'40px', height:'40px', borderRadius:'6px', background:'#1e293b',
                                          marginRight:'12px', flexShrink:0, display:'flex',
                                          alignItems:'center', justifyContent:'center', fontSize:'20px' }}>
                              {meta.icon}
                            </div>
                          )}
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ color:'#e2e8f0', fontWeight:600, fontSize:'13px',
                                          whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                              {ch.name}
                            </div>
                            <div style={{ color:'#475569', fontSize:'10px' }}>
                              {ch.flag} {ch.iso} · {ch.cats.join(', ')}
                            </div>
                          </div>
                          <button style={{ background:'linear-gradient(135deg,#7c3aed,#4c1d95)',
                                           color:'white', border:'none', borderRadius:'8px',
                                           padding:'7px 14px', fontSize:'11px', fontWeight:700,
                                           cursor:'pointer', flexShrink:0, display:'flex',
                                           alignItems:'center', gap:'5px' }}>
                            <i className="fas fa-film"></i> Transmitir
                          </button>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              );
            })
          )}
        </div>

        {/* ── Footer ── */}
        <div style={{ padding:'10px 20px', borderTop:'1px solid #1e293b', flexShrink:0,
                      display:'flex', alignItems:'center', justifyContent:'space-between',
                      background:'#0a0e1a' }}>
          <span style={{ color:'#475569', fontSize:'11px' }}>
            🎬 {channels.length} canais de filmes · iptv-org.github.io
          </span>
          <button onClick={onClose}
            style={{ background:'none', border:'1px solid #4c1d95', color:'#7c3aed',
                     borderRadius:'6px', padding:'5px 14px', fontSize:'12px', cursor:'pointer' }}>
            Fechar
          </button>
        </div>
      </div>
    </div>
  );
};

const IptvCategoryModal = ({ configKey, onClose, onPlay }) => {
  const cfg = IPTV_CAT_DEFS[configKey];
  const [channels, setChannels] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [error, setError]       = useState(null);
  const [search, setSearch]     = useState('');
  const [catFilter, setCatFilter] = useState('todos');
  const [countryFilter, setCountryFilter] = useState('todos');

  useEffect(() => {
    Promise.all([
      fetch('https://iptv-org.github.io/api/channels.json').then(r => r.json()),
      fetch('https://iptv-org.github.io/api/streams.json').then(r => r.json()),
    ]).then(([chs, streams]) => {
      const chMap = {};
      chs.forEach(c => { chMap[c.id] = c; });
      const list = streams
        .filter(s => s.url && (s.url.includes('.m3u8') || s.url.includes('stream') || s.url.includes('/live')))
        .map(s => {
          const ch = chMap[s.channel] || {};
          const cats = ch.categories || [];
          const primaryCat = cfg.cats.find(c => cats.includes(c)) || null;
          if (!primaryCat) return null;
          const iso = ch.country || 'ZZ';
          return { id:s.channel, name:ch.name||s.channel, url:s.url, iso, flag:ISO_FLAGS[iso]||'🌐', logo:ch.logo||'', cat:primaryCat, cats };
        })
        .filter(Boolean);
      setChannels(list);
      setLoading(false);
    }).catch(e => { setError('Erro: ' + e.message); setLoading(false); });
  }, []);

  const catsDisponiveis = [...new Set(channels.map(c => c.cat))].sort();
  const paisesDisponiveis = [...new Set(
    (catFilter === 'todos' ? channels : channels.filter(c => c.cat === catFilter)).map(c => c.iso)
  )].sort();

  const filtered = channels.filter(c => {
    if (catFilter !== 'todos' && c.cat !== catFilter) return false;
    if (countryFilter !== 'todos' && c.iso !== countryFilter) return false;
    if (search && !c.name.toLowerCase().includes(search.toLowerCase()) && !c.iso.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const grupos = {};
  filtered.forEach(c => {
    if (!grupos[c.cat]) grupos[c.cat] = {};
    const k = c.flag + ' ' + c.iso;
    if (!grupos[c.cat][k]) grupos[c.cat][k] = [];
    grupos[c.cat][k].push(c);
  });

    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.88)', zIndex:99999, display:'flex', alignItems:'center', justifyContent:'center', padding:'12px' }}>
      <div style={{ background:'linear-gradient(160deg,' + cfg.bg + ' 0%,#0f172a 100%)', border:'1px solid ' + cfg.accent + '55', borderRadius:'16px', width:'100%', maxWidth:'720px', height:'90vh', display:'flex', flexDirection:'column', boxShadow:'0 24px 80px ' + cfg.shadow, overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'16px 20px 12px', borderBottom:'1px solid #1e293b', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px' }}>
            <div>
              <h3 style={{ margin:0, color:'white', fontSize:'18px', fontWeight:700 }}>{cfg.title}</h3>
              <p style={{ margin:'3px 0 0', color:cfg.accent, fontSize:'12px' }}>
                {loading ? 'Carregando ' + cfg.desc + '...' : filtered.length + ' canais · ' + cfg.desc}
              </p>
            </div>
            <button onClick={onClose} style={{ background:'none', border:'none', color:'#64748b', fontSize:'22px', cursor:'pointer' }}>✕</button>
          </div>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder={'🔍 Pesquisar canal de ' + cfg.desc + '...'}
            style={{ width:'100%', padding:'9px 14px', background:'#1e293b', border:'1px solid ' + cfg.accentDark, borderRadius:'8px', color:'#e2e8f0', fontSize:'13px', outline:'none', boxSizing:'border-box' }} />
        </div>

        {/* Filtro por Subcategoria (se tiver mais de 1 cat) */}
        {cfg.cats.length > 1 && (
          <div style={{ padding:'8px 12px', borderBottom:'1px solid #1e293b', display:'flex', gap:'6px', overflowX:'auto', flexShrink:0, background:'#0a0e1a' }}>
            {['todos', ...catsDisponiveis].map(g => (
              <button key={g} onClick={() => { setCatFilter(g); setCountryFilter('todos'); }}
                style={{ background:catFilter===g?cfg.accent:'#1e293b', color:catFilter===g?'white':'#94a3b8', border:catFilter===g?'none':'1px solid #334155', borderRadius:'20px', padding:'4px 14px', fontSize:'11px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
                {g === 'todos' ? cfg.emoji + ' Todos' : (cfg.labels[g] || g)}
              </button>
            ))}
          </div>
        )}

        {/* Filtro por País */}
        <div style={{ padding:'6px 12px', borderBottom:'1px solid #1e293b', display:'flex', gap:'5px', overflowX:'auto', flexShrink:0 }}>
          <button onClick={() => setCountryFilter('todos')}
            style={{ background:countryFilter==='todos'?cfg.accentDark:'#1e293b', color:countryFilter==='todos'?'white':'#94a3b8', border:countryFilter==='todos'?'none':'1px solid #334155', borderRadius:'16px', padding:'3px 10px', fontSize:'10px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
            🌍 Todos os países
          </button>
          {paisesDisponiveis.map(iso => (
            <button key={iso} onClick={() => setCountryFilter(iso)}
              style={{ background:countryFilter===iso?cfg.accentDark:'#1e293b', color:countryFilter===iso?'white':'#94a3b8', border:countryFilter===iso?'none':'1px solid #334155', borderRadius:'16px', padding:'3px 10px', fontSize:'10px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              {ISO_FLAGS[iso]||'🌐'} {iso}
            </button>
          ))}
        </div>

        {/* Lista de Canais */}
        <div style={{ flex:1, overflowY:'auto' }}>
          {loading ? (
            <div style={{ padding:'60px', textAlign:'center' }}>
              <div style={{ fontSize:'48px', marginBottom:'12px' }}>{cfg.emoji}</div>
              <div style={{ color:cfg.accent, fontWeight:700, fontSize:'15px' }}>Carregando {cfg.desc}...</div>
              <div style={{ fontSize:'12px', color:'#475569', marginTop:'6px' }}>iptv-org.github.io</div>
            </div>
          ) : error ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#ef4444' }}>{error}</div>
          ) : filtered.length === 0 ? (
            <div style={{ padding:'40px', textAlign:'center', color:'#475569' }}>Nenhum canal encontrado para esta categoria</div>
          ) : (
            Object.entries(grupos).sort().map(([g, porPais]) => (
              <div key={g}>
                <div style={{ padding:'10px 16px 6px', background:'#0a0e1a', borderBottom:'1px solid #1e293b', position:'sticky', top:0, zIndex:2, display:'flex', alignItems:'center', gap:'8px' }}>
                  <span style={{ color:cfg.accent, fontWeight:700, fontSize:'13px', letterSpacing:'0.5px' }}>
                    {cfg.labels[g] || g} · {Object.values(porPais).flat().length} canal(is)
                  </span>
                </div>
                {Object.entries(porPais).sort().map(([pais, canais]) => (
                  <div key={pais}>
                    <div style={{ padding:'5px 16px 2px', fontSize:'10px', fontWeight:700, color:'#334155', letterSpacing:'1px', background:'#080d18', position:'sticky', top:'37px', zIndex:1 }}>
                      {pais} · {canais.length}
                    </div>
                    {canais.map((ch, i) => (
                      <div key={i} style={{ display:'flex', alignItems:'center', padding:'10px 16px', borderBottom:'1px solid #0f172a', cursor:'pointer', transition:'background 0.15s' }}
                        onMouseEnter={e => e.currentTarget.style.background='#1e293b'} onMouseLeave={e => e.currentTarget.style.background='transparent'}
                        onClick={() => onPlay(ch.url, ch.name, ch.iso, ch.flag)}>
                        {ch.logo ? (
                          <img src={ch.logo} alt="" onError={e => e.target.style.display='none'} style={{ width:'38px', height:'38px', objectFit:'contain', borderRadius:'6px', marginRight:'12px', background:'#1e293b', flexShrink:0 }} />
                        ) : (
                          <div style={{ width:'38px', height:'38px', borderRadius:'6px', background:'#1e293b', marginRight:'12px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'20px' }}>{ch.flag}</div>
                        )}
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ color:'#e2e8f0', fontWeight:600, fontSize:'13px', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{ch.name}</div>
                          <div style={{ color:'#475569', fontSize:'10px' }}>{ch.flag} {ch.iso} · {ch.cats.join(', ')}</div>
                        </div>
                        <button style={{ background:'linear-gradient(135deg,' + cfg.accent + ',' + cfg.accentDark + ')', color:'white', border:'none', borderRadius:'8px', padding:'7px 14px', fontSize:'11px', fontWeight:700, cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', gap:'5px' }}>
                          <i className={'fas ' + cfg.btnIcon}></i> Transmitir
                        </button>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            ))
          )}
        </div>

        {/* Footer */}
        <div style={{ padding:'10px 20px', borderTop:'1px solid #1e293b', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'space-between', background:'#0a0e1a' }}>
          <span style={{ color:'#475569', fontSize:'11px' }}>{cfg.emoji} {channels.length} canais · iptv-org.github.io</span>
          <button onClick={onClose} style={{ background:'none', border:'1px solid ' + cfg.accentDark, color:cfg.accent, borderRadius:'6px', padding:'5px 14px', fontSize:'12px', cursor:'pointer' }}>Fechar</button>
        </div>
      </div>
    </div>
  );
};

const ChatClient = ({ libp2pRef, libp2pStatus, libp2pPeers, addGlobalAudit }) => {
const [lang, setLang] = useState(() => localStorage.getItem('p2pUserLang') || detectBrowserLang());

const [dynTranslTick, setDynTranslTick] = useState(0);
const [dynTranslLoading, setDynTranslLoading] = useState(false);

// Translate UI when language changes
useEffect(() => {
  if (lang === 'en' || lang === 'pt') {
    _dynTransl = {};
    _dynTranslLang = lang;
    _dynTranslReady = true;
    setDynTranslTick(v => v + 1);
    setDynTranslLoading(false);
    return;
  }
  setDynTranslLoading(true);
  buildDynTransl(lang).then(() => {
    setDynTranslTick(v => v + 1);
    setDynTranslLoading(false);
  });
}, [lang]);

useEffect(() => {
const savedDark = localStorage.getItem('chatDarkMode');
if (savedDark === 'false') {
  document.body.classList.remove('dark-mode');
} else {
  document.body.classList.add('dark-mode'); // default: dark
}
}, []);


const toggleDarkMode = () => {
const isDark = document.body.classList.toggle('dark-mode');
localStorage.setItem('chatDarkMode', isDark ? 'true' : 'false');
};


const setLangAndSave = (code) => {
setLang(code);
localStorage.setItem('p2pUserLang', code);
};


const [peerId, setPeerId] = usePersistentId();
// Keep a ref to lang so event handlers inside closures always see the current value
const langRef = useRef(lang);
useEffect(() => { langRef.current = lang; }, [lang]);
// V74-B: libp2pStatusRef — evita stale closure em p2pBroadcast, p2pSendDirect, handleFileChange e relay híbrido
const libp2pStatusRef = useRef(libp2pStatus);
useEffect(() => { libp2pStatusRef.current = libp2pStatus; }, [libp2pStatus]);
const [userName, setUserName] = useState(() => localStorage.getItem('p2pUserName') || '');
const [userAvatar, setUserAvatar] = useState(() => localStorage.getItem('p2pUserAvatar') || '');
const userAvatarRef = useRef(localStorage.getItem('p2pUserAvatar') || ''); // FIX BUG-D: evita stale closure em sendHandshake
useEffect(() => { userAvatarRef.current = userAvatar; }, [userAvatar]);
const userNameRef = useRef(localStorage.getItem('p2pUserName') || ''); // FIX BUG-3: evita stale closure em sendRadioSync/sendQuizHandoff
useEffect(() => { userNameRef.current = userName; }, [userName]);
const [editingName, setEditingName] = useState(!localStorage.getItem('p2pUserName'));
const [avatars, setAvatars] = useState({}); // { peerId: base64 }
const [connections, setConnections] = useState([]);
// FIX BUG-2 & BUG-6: connectionsRef always holds latest connections array
// — safe to read inside effects and event handlers without stale-closure risk
const connectionsRef = useRef([]);
useEffect(() => { connectionsRef.current = connections; }, [connections]);
// V36: peers que iniciaram conexão DIRETA (incoming) — aparecem na aba Privado
const directPeersRef = useRef(new Set());
// V43-FIX: directPeers como STATE (além do ref) para que o React re-renderize a aba Privado
// quando um novo peer direto é registrado. directPeersRef mantém para leituras síncronas.
const [directPeers, setDirectPeers] = useState(new Set());
// FIX-CONTACTS-LIST: rastreia contatos EXPLICITAMENTE abertos pelo usuário (seleção na lista de contatos).
// Impede que contatos que se conectam automaticamente via mesh apareçam na lista de conversas.

// ── V74-A: Sincronização de Relógio entre Peers ─────────────────────────────
// clockOffsetRef = diferença entre relógio do servidor NTP e Date.now() local
// trueNow()      = Date.now() + clockOffsetRef.current (sempre use no lugar de Date.now() no Quiz)
// syncClock()    = sincroniza via worldtimeapi.org → fallback timeapi.io (timeout 3s, sanidade ±30s)
const clockOffsetRef = useRef(0);
const trueNow = () => Date.now() + clockOffsetRef.current;
const syncClock = async () => {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);
  try {
    const t0 = Date.now();
    const res = await fetch('https://worldtimeapi.org/api/ip', { signal: controller.signal });
    const data = await res.json();
    clearTimeout(timeoutId);
    const serverMs = new Date(data.datetime).getTime();
    const rtt = Date.now() - t0;
    const offset = serverMs + rtt / 2 - Date.now();
    if (Math.abs(offset) < 30000) clockOffsetRef.current = offset; // sanidade ±30s
    console.log(`[V74-A] syncClock OK (worldtimeapi) offset=${Math.round(offset)}ms`);
    return;
  } catch(e) { clearTimeout(timeoutId); }
  // Fallback: timeapi.io
  const ctrl2 = new AbortController();
  const tid2 = setTimeout(() => ctrl2.abort(), 3000);
  try {
    const t0 = Date.now();
    const res = await fetch('https://timeapi.io/api/time/current/zone?timeZone=UTC', { signal: ctrl2.signal });
    const data = await res.json();
    clearTimeout(tid2);
    const serverMs = new Date(data.dateTime + 'Z').getTime();
    const rtt = Date.now() - t0;
    const offset = serverMs + rtt / 2 - Date.now();
    if (Math.abs(offset) < 30000) clockOffsetRef.current = offset;
    console.log(`[V74-A] syncClock OK (timeapi.io) offset=${Math.round(offset)}ms`);
  } catch(e) { clearTimeout(tid2); console.warn('[V74-A] syncClock falhou — usando offset=0'); }
};
useEffect(() => {
  syncClock();
  const clockSyncInterval = setInterval(syncClock, 5 * 60 * 1000); // re-sincroniza a cada 5 min
  return () => clearInterval(clockSyncInterval);
}, []);

// Embaralha array in-place (Fisher-Yates)
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Retira o próximo lugar da fila; quando vazia, reembaralha tudo de novo
function nextWorldPlace() {
  if (worldQuizQueueRef.current.length === 0) {
    // Cria nova fila com todos os índices embaralhados + seed de tempo para variar sempre
    const indices = WORLD_PLACES.map((_, i) => i);
    shuffleArray(indices);
    // Garante que o primeiro da nova fila ≠ último lugar jogado (evita repetição na virada)
    if (worldQuizPlaceRef.current) {
      const lastIdx = WORLD_PLACES.indexOf(worldQuizPlaceRef.current);
      if (indices[0] === lastIdx && indices.length > 1) {
        [indices[0], indices[1]] = [indices[1], indices[0]];
      }
    }
    worldQuizQueueRef.current = indices;
  }
  const idx = worldQuizQueueRef.current.shift();
  return WORLD_PLACES[idx];
}
