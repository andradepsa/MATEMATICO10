            onMouseDown={handleResizeDown}
            style={{
              position: 'absolute',
              bottom: 0,
              right: 0,
              width: '15px',
              height: '15px',
              cursor: 'nwse-resize',
              zIndex: 1001,
              background: 'linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.3) 50%)',
              borderBottomRightRadius: '10px'
            }}
          />
        </div>
      );
    };

    // ================================================================
    // MAIN APP
    // ================================================================
    const App = () => {
      const [lang, setLang] = useState('en');
      const [showTutorial, setShowTutorial] = useState(false);
      const [showGeneralModeInfo, setShowGeneralModeInfo] = useState(false);

      useEffect(() => {
        if (localStorage.getItem('modo') === 'dark') { document.body.classList.add('dark-mode'); }
      }, []);

      const toggleDarkMode = () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        // localStorage.setItem('modo', isDark ? 'dark' : 'light');
      };

      const toggleLang = () => {
        const newLang = lang === 'en' ? 'pt' : 'en';
        setLang(newLang);
      };

      const [peerId, setPeerId] = usePersistentId();
      const [userName, setUserName] = useState(() => localStorage.getItem('p2pUserName') || '');
      const [editingName, setEditingName] = useState(!localStorage.getItem('p2pUserName'));
      const [connections, setConnections] = useState([]);
      const [messages, setMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [showContacts, setShowContacts] = useState(false);
      const [contacts, setContacts] = useState(() => { try { return JSON.parse(localStorage.getItem('p2pContacts') || '[]'); } catch { return []; } });
      const [activeCalls, setActiveCalls] = useState([]);
      const [remoteStreams, setRemoteStreams] = useState([]);
      const [error, setError] = useState(null);
      const [isLocalVideoVisible, setIsLocalVideoVisible] = useState(false);
      const [showEmojiPanel, setShowEmojiPanel] = useState(false);
      const [selectedContact, setSelectedContact] = useState(null);
      const [isPeerInitialized, setIsPeerInitialized] = useState(false);
      const [centralServerId, setCentralServerId] = useState(null);
      const [cooldownRemaining, setCooldownRemaining] = useState(0);
      const [networkSize, setNetworkSize] = useState(1);
      const [isSuperNode, setIsSuperNode] = useState(false);
      const [pendingTorrentRequests, setPendingTorrentRequests] = useState({});
      const [radioState, setRadioState] = useState({ 
        status: 'idle', 
        type: 'file',
        startTime: 0, 
        duration: 0, 
        audioUrl: null, 
        youtubeId: null,
        fileName: '', 
        sender: '',
        showVideo: false,
        videoSize: 'medium'
      });
      const [e2eeState, setE2eeState] = useState({});
      const [serverE2EE, setServerE2EE] = useState({});
      const [torrents, setTorrents] = useState([]);
      const [showTorrentManager, setShowTorrentManager] = useState(false);

      const peerInstance = useRef(null);
      const fileInputRef = useRef(null);
      const pendingFiles = useRef({});
      const audioRefs = useRef({});
      const videoRefs = useRef({});
      const localVideoRef = useRef(null);
      const localStreamsRef = useRef(new Map());
      const seenMessagesRef = useRef(new Set());
      const radioStateRef = useRef(radioState);
      const radioAudioRef = useRef(null);
      const youtubePlayerRef = useRef(null);
      const youtubeContainerRef = useRef(null);
      const torrentClientRef = useRef(null);
      const pendingRadioFiles = useRef({});
      const radioIntervalRef = useRef(null);
      const knownUsersRef = useRef(new Set());
      const lastMessageTimeRef = useRef(new Map());
      const bannedPeersRef = useRef(new Set());
      const spamViolationsRef = useRef(new Map());
      const CHUNK_SIZE = 16 * 1024;

      useEffect(() => { radioStateRef.current = radioState; }, [radioState]);

      useEffect(() => {
        if (!centralServerId) {
          setNetworkSize(connections.length + 1);
        } else {
          setNetworkSize(prev => Math.max(prev, connections.length + 1));
        }
      }, [connections.length, centralServerId]);

      useEffect(() => {
        if (cooldownRemaining > 0) {
          const timer = setTimeout(() => setCooldownRemaining(prev => prev - 1), 1000);
          return () => clearTimeout(timer);
        }
      }, [cooldownRemaining]);

      const isCentralServer = (id) => id && id.endsWith('-CENTRAL');
      const generateNewId = () => {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const buffer = new Uint8Array(9);
        crypto.getRandomValues(buffer);
        return Array.from(buffer).map(b => chars[b % chars.length]).join('');
      };
      const getContactName = (pId) => contacts.find(c => c.peerId === pId)?.name || pId;
      const saveUserName = () => { if (userName.trim()) { localStorage.setItem('p2pUserName', userName); setEditingName(false); } };
      const formatTime = (date) => date.toLocaleTimeString('en-US');

      const stopAndRemoveLocalStream = (pId) => {
        const stream = localStreamsRef.current.get(pId);
        if (stream) {
          stream.getTracks().forEach(tr => tr.stop());
          localStreamsRef.current.delete(pId);
          if (localStreamsRef.current.size === 0) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
          else { const first = localStreamsRef.current.values().next().value; if (localVideoRef.current && first) localVideoRef.current.srcObject = first; }
        }
      };

      const sendHandshake = (conn) => { try { conn.send({ type: 'handshake', peerId }); } catch(e) {} };

      const handleIncomingData = (data, pId) => {
        if (data.type === 'network-stats' && data.totalOnline !== undefined) {
          setNetworkSize(prev => Math.max(data.totalOnline, connections.length + 1));
          // Relay stats to other peers to spread the info
          let ttl = data.ttl !== undefined ? data.ttl : 5;
          if (ttl > 0) {
            const relay = { ...data, ttl: ttl - 1 };
            setConnections(cc => {
              cc.forEach(c => {
                if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){}
              });
              return cc;
            });
          }
          return;
        }

        if (data.type === 'migrate-to-p2p' && Array.isArray(data.peers)) {
          console.log("Servidor migrou para P2P! Conectando aos peers...");
          const maxConnections = isSuperNode ? 50 : 15;
          if (peerInstance.current) {
            data.peers.forEach(newPId => {
              const activeCount = Object.keys(peerInstance.current.connections).length;
              if (activeCount < maxConnections && newPId !== peerId && !peerInstance.current.connections[newPId] && !bannedPeersRef.current.has(newPId)) {
                setTimeout(() => connectToPeer(newPId), Math.random() * 3000); // Random delay to prevent connection storms
              }
            });
          }
          setMessages(prev => [...prev, { text: data.message || "Servidor lotado. Você foi migrado para a rede descentralizada (P2P) automaticamente.", sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now() }]);
          return;
        }

        if (data.type === 'handshake') { if (isCentralServer(pId)) setCentralServerId(pId); return; }

        if (data.type === 'e2ee-secret' && data.secret) {
          setE2eeState(prev => ({ ...prev, [pId]: { ...prev[pId], contactSecret: data.secret } }));
          const name = getContactName(pId);
          setMessages(prev => [...prev, { text: t(lang, 'e2eeSecretReceived', { name }), sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now(), systemFor: pId }]);
          return;
        }

        if (data.type === 'server-e2ee-invite' && data.groupSecret && data.serverId) {
          const name = getContactName(pId);
          setMessages(prev => [...prev, { 
            text: t(lang, 'groupInviteReceived', { name, id: data.serverId }), 
            sender: '__system__', 
            recipient: 'you', 
            senderName: 'System', 
            time: new Date().toLocaleTimeString(), 
            type: 'text', 
            direct: true, 
            timestamp: Date.now(), 
            systemFor: pId,
            isInvite: true,
            inviteData: { serverId: data.serverId, groupSecret: data.groupSecret }
          }]);
          return;
        }

        if (data.type === 'pex' && Array.isArray(data.peers)) {
          const maxConnections = isSuperNode ? 50 : 15;
          if (peerInstance.current) {
            const activeCount = Object.keys(peerInstance.current.connections).length;
            if (activeCount < maxConnections) {
              data.peers.forEach(newPId => {
                if (newPId !== peerId && !peerInstance.current.connections[newPId] && !bannedPeersRef.current.has(newPId)) {
                  setTimeout(() => connectToPeer(newPId), 2000);
                }
              });
            }
          }
          return;
        }

        if (data.type === 'radio-request-sync') { setConnections(cc => { const c = cc.find(x => x.peer === pId); if (c) sendRadioSync(c); return cc; }); return; }

        if (data.type === 'radio-sync') {
          const now = Date.now(), endTime = data.startTime + data.duration * 1000;
          if (now < endTime) {
            setRadioState(prev => {
              if (prev.status === 'idle') {
                return { status: now >= data.startTime ? 'playing' : 'buffering', startTime: data.startTime, duration: data.duration, audioUrl: null, fileName: data.fileName, sender: data.senderName };
              }
              return prev;
            });
          }
          return;
        }

        if (data.type === 'radio-youtube-start') {
          if (seenMessagesRef.current.has(data.id)) return;
          if (radioStateRef.current.status !== 'idle') return;
          seenMessagesRef.current.add(data.id);
          let ttl = data.ttl !== undefined ? data.ttl : 8;
          if (ttl > 0) { const relay = { ...data, ttl: ttl - 1 }; setConnections(cc => { cc.forEach(c => { if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){} }); return cc; }); }
          setRadioState({ 
            status: 'playing', 
            type: 'youtube', 
            startTime: data.startTime, 
            duration: data.duration || 300, 
            audioUrl: null, 
            youtubeId: data.youtubeId, 
            fileName: 'YouTube Video', 
            sender: data.senderName,
            showVideo: true,
            videoSize: 'medium'
          });
          return;
        }

        if (data.type === 'radio-start' || data.type === 'radio-chunk') {
          if (seenMessagesRef.current.has(data.id)) return;
          if (data.type === 'radio-start' && radioStateRef.current.status !== 'idle') return;
          if (data.type === 'radio-chunk' && radioStateRef.current.status === 'idle' && !pendingRadioFiles.current[data.radioId]) return;
          seenMessagesRef.current.add(data.id);
          if (seenMessagesRef.current.size > 5000) { const f = seenMessagesRef.current.values().next().value; seenMessagesRef.current.delete(f); }
          let ttl = data.ttl !== undefined ? data.ttl : 8;
          if (ttl > 0) { const relay = { ...data, ttl: ttl - 1 }; setConnections(cc => { cc.forEach(c => { if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){} }); return cc; }); }
          if (data.type === 'radio-start') {
            pendingRadioFiles.current[data.radioId] = { chunks: new Uint8Array(data.fileSize), receivedBytes: 0, totalSize: data.fileSize };
            setRadioState({ status: 'buffering', type: 'file', startTime: data.startTime, duration: data.duration, audioUrl: null, youtubeId: null, fileName: data.fileName, sender: data.senderName, showVideo: false, videoSize: 'medium' });
          } else {
            const fd = pendingRadioFiles.current[data.radioId];
            if (fd) {
              const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
              fd.chunks.set(chunk, data.offset); fd.receivedBytes += chunk.length;
              if (fd.receivedBytes === fd.totalSize) { const url = URL.createObjectURL(new Blob([fd.chunks], { type: 'audio/mpeg' })); setRadioState(prev => ({ ...prev, audioUrl: url })); delete pendingRadioFiles.current[data.radioId]; }
            }
          }
          return;
        }

        if (data.type === 'message' && data.id) {
          if (data.sender) {
            if (!knownUsersRef.current.has(data.sender)) { 
              knownUsersRef.current.add(data.sender); 
              setNetworkSize(prev => Math.max(prev, knownUsersRef.current.size + 1)); 
            }
            const now = Date.now(), lastTime = lastMessageTimeRef.current.get(data.sender) || 0;
            const requiredMs = Math.max(500, Math.floor(knownUsersRef.current.size / 1000)) * 1000;
            if (now - lastTime < requiredMs) {
              const violations = (spamViolationsRef.current.get(data.sender) || 0) + 1;
              spamViolationsRef.current.set(data.sender, violations);
              if (violations >= 3) {
                bannedPeersRef.current.add(data.sender);
                spamViolationsRef.current.delete(data.sender);
                setConnections(cc => { const c = cc.find(x => x.peer === data.sender); if (c) c.close(); return cc.filter(x => x.peer !== data.sender); });
              }
              return;
            }
            spamViolationsRef.current.set(data.sender, 0);
            lastMessageTimeRef.current.set(data.sender, now);
          }
          if (seenMessagesRef.current.has(data.id)) return;
          seenMessagesRef.current.add(data.id);
          if (seenMessagesRef.current.size > 5000) { const f = seenMessagesRef.current.values().next().value; seenMessagesRef.current.delete(f); }
          let ttl = data.ttl !== undefined ? data.ttl : 15;
          if (ttl > 0) { const relay = { ...data, ttl: ttl - 1 }; setConnections(cc => { cc.forEach(c => { if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){} }); return cc; }); }
        }

        const timestamp = data.timestamp || Date.now();
        const messageTime = data.time || formatTime(new Date(timestamp));
        const isFromSrv = isCentralServer(pId);
        const baseMessage = { 
          sender: pId, 
          senderName: data.senderName || getContactName(pId), 
          time: messageTime, 
          direct: data.direct || false, 
          timestamp, 
          recipient: data.direct ? 'you' : (isFromSrv ? pId : 'general') 
        };
        let messageToAdd = null;

        if (data.type === 'message') {
          if (data.text === '#$%') {
            if (radioStateRef.current.status === 'idle') setRadioState({ status: 'playing', startTime: Date.now(), duration: 300, audioUrl: null, fileName: t(lang, 'radioGlobal'), sender: data.senderName || 'Server' });
            return;
          }
          messageToAdd = { ...baseMessage, text: data.text, type: 'text' };
        } else if (data.type === 'file-start') {
          pendingFiles.current[data.fileId] = { fileName: data.fileName, chunks: new Uint8Array(data.fileSize), receivedBytes: 0, totalSize: data.fileSize, fileType: data.fileType };
          messageToAdd = { ...baseMessage, fileId: data.fileId, fileName: data.fileName, type: 'file', receiving: true, progress: 0 };
        } else if (data.type === 'file-chunk') {
          const fd = pendingFiles.current[data.fileId];
          if (fd) {
            const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
            fd.chunks.set(chunk, data.offset); fd.receivedBytes += chunk.length;
            const progress = Math.min(100, Math.floor((fd.receivedBytes / fd.totalSize) * 100));
            setMessages(prev => prev.map(m => m.fileId === data.fileId ? { ...m, progress } : m));
            if (fd.receivedBytes === fd.totalSize) { const url = URL.createObjectURL(new Blob([fd.chunks], { type: fd.fileType || 'application/octet-stream' })); setMessages(prev => prev.map(m => m.fileId === data.fileId ? { ...m, fileData: url, receiving: false, progress: 100 } : m)); delete pendingFiles.current[data.fileId]; }
          }
          return;
        } else if (data.type === 'audio-start') {
          pendingFiles.current[data.audioId] = { chunks: new Uint8Array(data.audioSize), receivedBytes: 0, totalSize: data.audioSize };
          messageToAdd = { ...baseMessage, audioId: data.audioId, type: 'audio', receiving: true, progress: 0 };
        } else if (data.type === 'audio-chunk') {
          const ad = pendingFiles.current[data.audioId];
          if (ad) {
            const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
            ad.chunks.set(chunk, data.offset); ad.receivedBytes += chunk.length;
            const progress = Math.min(100, Math.floor((ad.receivedBytes / ad.totalSize) * 100));
            setMessages(prev => prev.map(m => m.audioId === data.audioId ? { ...m, progress } : m));
            if (ad.receivedBytes === ad.totalSize) { const url = URL.createObjectURL(new Blob([ad.chunks], { type: 'audio/webm' })); setMessages(prev => prev.map(m => m.audioId === data.audioId ? { ...m, audioData: url, receiving: false, progress: 100 } : m)); delete pendingFiles.current[data.audioId]; }
          }
          return;
        } else if (data.type === 'torrent-request') {
          setPendingTorrentRequests(prev => ({ ...prev, [pId]: { magnet: data.magnet, fileName: data.fileName } }));
          return;
        }

        if (messageToAdd) {
          setMessages(prev => { const updated = [...prev, messageToAdd].slice(-50); return updated; });
        }
      };

      const sendRadioSync = (conn) => {
        if (radioStateRef.current.status !== 'idle') {
          const syncMsg = { type: 'radio-sync', startTime: radioStateRef.current.startTime, duration: radioStateRef.current.duration, fileName: radioStateRef.current.fileName, senderName: radioStateRef.current.sender };
          const send = () => { try { conn.send(syncMsg); } catch(e) {} };
          send(); setTimeout(send, 1000); setTimeout(send, 2000);
        }
      };

      const connectToPeer = (peerIdToConnect) => {
        if (!peerIdToConnect || !peerInstance.current || !isPeerInitialized) return;
        if (bannedPeersRef.current.has(peerIdToConnect)) return;
        if (connections.some(c => c.peer === peerIdToConnect && c.open)) return;
        try {
          const conn = peerInstance.current.connect(peerIdToConnect, { reliable: true });
          if (!conn) throw new Error("Connection failed");
          
          const timeoutId = setTimeout(() => {
            if (conn && !conn.open) {
              console.warn(`Connection to ${peerIdToConnect} timed out. Closing attempt.`);
              conn.close();
              setMessages(prev => [...prev, { text: `⚠️ ${t(lang, 'connectionFailed')} ${peerIdToConnect} (Timeout)`, sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now() }]);
            }
          }, 10000);

          conn.on('open', () => { 
            clearTimeout(timeoutId); 
            setConnections(prev => [...prev.filter(c => c.peer !== peerIdToConnect), conn]); 
            sendHandshake(conn); 
            if (!knownUsersRef.current.has(peerIdToConnect)) {
              knownUsersRef.current.add(peerIdToConnect);
              setNetworkSize(prev => Math.max(prev, knownUsersRef.current.size + 1));
            }
          });
          conn.on('error', err => { clearTimeout(timeoutId); setConnections(prev => prev.filter(c => c.peer !== peerIdToConnect)); alert(t(lang, 'connectFailed') + (err.message || 'Contact offline')); });
          conn.on('close', () => { clearTimeout(timeoutId); setConnections(prev => prev.filter(c => c.peer !== peerIdToConnect)); });
          conn.on('data', data => handleIncomingData(data, peerIdToConnect));
        } catch (err) { alert(t(lang, 'connectError') + err.message); }
      };

      useEffect(() => {
        if (!peerId) return;
        const peer = new Peer(peerId, {
          host: '0.peerjs.com', port: 443, secure: true,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun.ekiga.net:3478' },
              { urls: 'stun:stun.stunprotocol.org:3478' }
            ],
            sdpSemantics: 'unified-plan', iceTransportPolicy: 'all', bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require', iceCandidatePoolSize: 10
          },
          debug: 2
        });

        peer.on('open', (id) => {
          setIsPeerInitialized(true);
          const urlParams = new URLSearchParams(window.location.search);
          const portasStr = urlParams.get('portas');
          if (portasStr) {
            const portas = portasStr.split(',');
            const centralId = portas.find(isCentralServer);
            if (centralId) { setCentralServerId(centralId); setSelectedContact(centralId); }
            else if (!centralServerId) { setCentralServerId(portas[0]); setSelectedContact(portas[0]); }
            setTimeout(() => {
              portas.forEach(porta => {
                if (porta && porta !== id) {
                  const conn = peer.connect(porta, { reliable: true });
                  if (conn) {
                    conn.on('open', () => { setConnections(prev => [...prev.filter(c => c.peer !== porta), conn]); sendRadioSync(conn); try { conn.send({ type: 'radio-request-sync' }); } catch(e){} });
                    conn.on('data', data => handleIncomingData(data, porta));
                    conn.on('close', () => setConnections(prev => prev.filter(c => c.peer !== porta)));
                    conn.on('error', () => setConnections(prev => prev.filter(c => c.peer !== porta)));
                  }
                }
              });
            }, 1000);
          }
        });

        peer.on('error', err => {
          if (err.type === 'unavailable-id') { const newId = generateNewId(); localStorage.setItem(PEER_ID_STORAGE_KEY, newId); window.location.reload(); }
          else if (err.type !== 'peer-unavailable') setError(`PeerJS Error: ${err.type}`);
        });

        peer.on('connection', conn => {
          if (bannedPeersRef.current.has(conn.peer)) { setTimeout(() => conn.close(), 500); return; }
          const maxConns = isSuperNode ? 50 : 15;
          if (connections.length >= maxConns) { setTimeout(() => conn.close(), 500); return; }
          conn.on('open', () => { 
            setConnections(prev => [...prev.filter(c => c.peer !== conn.peer), conn]); 
            sendHandshake(conn); 
            if (!knownUsersRef.current.has(conn.peer)) {
              knownUsersRef.current.add(conn.peer);
              setNetworkSize(prev => Math.max(prev, knownUsersRef.current.size + 1));
            }
          });
          conn.on('data', data => handleIncomingData(data, conn.peer));
          conn.on('close', () => { setConnections(prev => prev.filter(c => c.peer !== conn.peer)); endCall(conn.peer, 'video'); endCall(conn.peer, 'voice'); });
          conn.on('error', () => { setConnections(prev => prev.filter(c => c.peer !== conn.peer)); endCall(conn.peer, 'video'); endCall(conn.peer, 'voice'); });
        });

        peer.on('call', async call => {
          const callType = call.metadata?.type || 'video';
          try {
            call.answer(null);
            setActiveCalls(prev => [...prev.filter(c => !(c.peerId === call.peer && c.type === callType)), { peerId: call.peer, call, localStream: null, type: callType, direction: 'incoming', isTemporaryStream: false }]);
            call.on('stream', remoteStream => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === call.peer && s.type === callType)), { peerId: call.peer, stream: remoteStream, type: callType }]));
            call.on('close', () => endCall(call.peer, callType));
            call.on('error', () => endCall(call.peer, callType));
          } catch (err) { call.close(); alert(t(lang, 'cameraError') + err.message); }
        });

        peerInstance.current = peer;
        return () => {
          if (peerInstance.current) { peerInstance.current.destroy(); peerInstance.current = null; }
          localStreamsRef.current.forEach(s => s.getTracks().forEach(tr => tr.stop()));
          localStreamsRef.current.clear();
          setActiveCalls([]); setRemoteStreams([]); setIsLocalVideoVisible(false);
          if (localVideoRef.current) localVideoRef.current.srcObject = null;
          setIsPeerInitialized(false);
        };
      }, [peerId]);

      useEffect(() => {
        if (window.WebTorrent) {
          torrentClientRef.current = new window.WebTorrent();
          const iv = setInterval(() => {
            if (torrentClientRef.current) {
              const active = torrentClientRef.current.torrents.map(t => ({
                infoHash: t.infoHash,
                name: t.name,
                progress: t.progress,
                downloadSpeed: t.downloadSpeed,
                uploadSpeed: t.uploadSpeed,
                numPeers: t.numPeers,
                done: t.done,
                magnetURI: t.magnetURI,
                timeRemaining: t.timeRemaining
              }));
              setTorrents(active);
            }
          }, 1000);
          return () => {
            clearInterval(iv);
            if (torrentClientRef.current) torrentClientRef.current.destroy();
          };
        }
      }, []);

      useEffect(() => {
        const sendHeartbeat = () => {
          if (!peerInstance.current || !peerId) return;
          
          const heartbeatMsg = { type: 'heartbeat', peerId };
          
          // 1. Send to central server if connected
          if (centralServerId) {
            const serverConn = connections.find(c => c.peer === centralServerId && c.open);
            if (serverConn) {
              try { serverConn.send(heartbeatMsg); } catch(e) {}
            } else {
              // If not connected, try a quick connection just for heartbeat
              const tempConn = peerInstance.current.connect(centralServerId, { reliable: true });
              if (tempConn) {
                tempConn.on('open', () => {
                  try { tempConn.send(heartbeatMsg); } catch(e) {}
                  setTimeout(() => tempConn.close(), 2000);
                });
              }
            }
          }
        };

        const interval = setInterval(sendHeartbeat, 30000);
        // Send initial heartbeat after a short delay
        const timeout = setTimeout(sendHeartbeat, 5000);
        
        return () => {
          clearInterval(interval);
          clearTimeout(timeout);
        };
      }, [peerId, centralServerId, connections.length]);

      useEffect(() => {
        const iv = setInterval(() => {
          if (connections.length > 0) {
            const allKnown = Array.from(new Set([...connections.map(c => c.peer), ...Array.from(knownUsersRef.current)]));
            connections.forEach(conn => {
              if (conn.open) try { conn.send({ type: 'pex', peers: [...allKnown].sort(() => 0.5 - Math.random()).slice(0, isSuperNode ? 100 : 50) }); } catch(e) {}
            });
          }
        }, 30000);
        return () => clearInterval(iv);
      }, [connections]);

      useEffect(() => {
        const check = () => {
          setRadioState(current => {
            if (current.status === 'idle') return current;
            const now = Date.now();
            
            if (current.type === 'file') {
              const endTime = current.startTime + current.duration * 1000;
              if (now >= endTime) { 
                if (radioAudioRef.current) { radioAudioRef.current.pause(); radioAudioRef.current.src = ''; } 
                return { status: 'idle', type: 'file', startTime: 0, duration: 0, audioUrl: null, youtubeId: null, fileName: '', sender: '', showVideo: false, videoSize: 'medium' }; 
              }
              if (current.status === 'buffering') {
                if (now >= current.startTime) {
                  if (current.audioUrl && radioAudioRef.current) { 
                    const off = (now - current.startTime) / 1000; 
                    radioAudioRef.current.src = current.audioUrl; 
                    radioAudioRef.current.currentTime = off; 
                    radioAudioRef.current.play().catch(() => {}); 
                  }
                  return { ...current, status: 'playing' };
                }
                return { ...current, _tick: now };
              }
            } else if (current.type === 'youtube') {
              const endTime = current.startTime + (current.duration || 300) * 1000;
              if (now >= endTime) {
                if (youtubePlayerRef.current) {
                  try { youtubePlayerRef.current.destroy(); } catch(e) {}
                  youtubePlayerRef.current = null;
                }
                return { status: 'idle', type: 'file', startTime: 0, duration: 0, audioUrl: null, youtubeId: null, fileName: '', sender: '', showVideo: false, videoSize: 'medium' };
              }
              if (now >= current.startTime && current.status === 'playing') {
                if (window.YT && window.YT.Player && !youtubePlayerRef.current && youtubeContainerRef.current) {
                  youtubePlayerRef.current = new window.YT.Player(youtubeContainerRef.current, {
                    height: '100%',
                    width: '100%',
                    videoId: current.youtubeId,
                    playerVars: {
                      autoplay: 1,
                      controls: 1,
                      start: Math.floor((now - current.startTime) / 1000)
                    },
                    events: {
                      onReady: (event) => {
                        event.target.playVideo();
                      }
                    }
                  });
                }
              }
            }
            return current;
          });
        };
        radioIntervalRef.current = setInterval(check, 500);
        return () => clearInterval(radioIntervalRef.current);
      }, []);

      const stopRadio = () => {
        if (radioAudioRef.current) { radioAudioRef.current.pause(); radioAudioRef.current.src = ''; }
        if (youtubePlayerRef.current) {
          try { youtubePlayerRef.current.destroy(); } catch(e) {}
          youtubePlayerRef.current = null;
        }
        setRadioState({ status: 'idle', type: 'file', startTime: 0, duration: 0, audioUrl: null, youtubeId: null, fileName: '', sender: '', showVideo: false, videoSize: 'medium' });
      };

      const handleRadioUpload = (e) => {
        if (radioStateRef.current.status !== 'idle') { alert(t(lang, 'radioAlreadyPlaying')); e.target.value = ''; return; }
        const file = e.target.files[0]; if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert(t(lang, 'maxFileSizeErr')); e.target.value = ''; return; }
        const url = URL.createObjectURL(file);
        const audio = new Audio(url);
        audio.onloadedmetadata = () => {
          let duration = audio.duration;
          if (!duration || duration === Infinity) duration = 300;
          const startTime = Date.now() + 60000;
          const radioId = peerId + '_radio_' + Date.now();
          const startMsg = { type: 'radio-start', id: radioId + '_start', radioId, fileName: file.name, fileSize: file.size, duration, startTime, sender: peerId, senderName: userName, ttl: 15 };
          const fallbackMsg = { type: 'message', text: '#$%', id: radioId + '_fallback', sender: peerId, senderName: userName, ttl: 15 };
          seenMessagesRef.current.add(startMsg.id); seenMessagesRef.current.add(fallbackMsg.id);
          setConnections(cc => { cc.forEach(c => { if (c.open && c.peer === selectedContact) try { c.send(startMsg); c.send(fallbackMsg); } catch(e){} }); return cc; });
          setRadioState({ status: 'buffering', type: 'file', startTime, duration, audioUrl: null, youtubeId: null, fileName: file.name, sender: userName, showVideo: false, videoSize: 'medium' });
          const reader = new FileReader(); let offset = 0;
          reader.onload = ev => {
            const buffer = ev.target.result;
            const chunkMsg = { type: 'radio-chunk', id: radioId + '_chunk_' + offset, radioId, offset, chunk: buffer, ttl: 15 };
            seenMessagesRef.current.add(chunkMsg.id);
            setConnections(cc => { cc.forEach(c => { if (c.open && c.peer === selectedContact) try { c.send(chunkMsg); } catch(e){} }); return cc; });
            offset += buffer.byteLength;
            if (offset < file.size) reader.readAsArrayBuffer(file.slice(offset, offset + 64 * 1024));
            else setRadioState(prev => ({ ...prev, audioUrl: url }));
          };
          reader.readAsArrayBuffer(file.slice(0, 64 * 1024));
        };
      };

      const handleYoutubeRadio = () => {
        if (radioStateRef.current.status !== 'idle') { alert(t(lang, 'radioAlreadyPlaying')); return; }
        const url = prompt(t(lang, 'enterYoutubeUrl'));
        if (!url) return;
        
        let videoId = '';
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        if (match && match[2].length === 11) {
          videoId = match[2];
        } else {
          alert(t(lang, 'invalidYoutubeUrl'));
          return;
        }

        const startTime = Date.now() + 5000; // 5s delay for sync
        const duration = 300; // 5 minutes limit
        const radioId = peerId + '_yt_' + Date.now();
        const startMsg = { 
          type: 'radio-youtube-start', 
          id: radioId + '_start', 
          radioId, 
          youtubeId: videoId, 
          startTime, 
          duration,
          sender: peerId, 
          senderName: userName, 
          ttl: 15 
        };
        
        seenMessagesRef.current.add(startMsg.id);
        setConnections(cc => { cc.forEach(c => { if (c.open) try { c.send(startMsg); } catch(e){} }); return cc; });
        setRadioState({ 
          status: 'playing', 
          type: 'youtube', 
          startTime, 
          duration, 
          audioUrl: null, 
          youtubeId: videoId, 
          fileName: 'YouTube Video', 
          sender: userName,
          showVideo: true,
          videoSize: 'medium'
        });
      };

      const announceList = [
        'wss://tracker.btorrent.xyz',
        'wss://tracker.openwebtorrent.com',
        'wss://tracker.webtorrent.dev',
        'wss://tracker.files.fm:7073/announce',
        'wss://hub.bugout.link'
      ];

      const handleTorrentSeed = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 500 * 1024 * 1024) { alert(t(lang, 'torrentLimit')); return; }
        
        if (torrentClientRef.current) {
          torrentClientRef.current.seed(file, { announce: announceList }, (torrent) => {
            const magnet = torrent.magnetURI;
            const text = `🧲 TORRENT: ${file.name}\n${magnet}`;
            sendMessage(text);
            setMessages(prev => [...prev, { text: t(lang, 'torrentStarted', { name: file.name }), sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now() }]);
          });
        }
      };

      const handleTorrentDirectSeed = (file, targetPeer) => {
        if (!file || !targetPeer) return;
        if (file.size > 500 * 1024 * 1024) { alert(t(lang, 'torrentLimit')); return; }
        
        if (torrentClientRef.current) {
          torrentClientRef.current.seed(file, { announce: announceList }, (torrent) => {
            const magnet = torrent.magnetURI;
            const conn = connections.find(c => c.peer === targetPeer);
            if (conn && conn.open) {
              conn.send({ type: 'torrent-request', magnet, fileName: file.name });
              setMessages(prev => [...prev, { text: `📤 Torrent request sent to ${getContactName(targetPeer)}: ${file.name}`, sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now() }]);
            }
          });
        }
      };

      const handleTorrentDownload = (magnet) => {
        if (torrentClientRef.current) {
          const existing = torrentClientRef.current.get(magnet);
          if (existing) {
            if (existing.done) {
              existing.files.forEach(f => f.getBlob((err, blob) => {
                if (err) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = f.name;
                a.click();
              }));
            }
            return;
          }
          
          torrentClientRef.current.add(magnet, { announce: announceList }, (torrent) => {
            torrent.on('done', () => {
              setMessages(prev => [...prev, { text: `✅ Torrent ${torrent.name} ${t(lang, 'completed')}!`, sender: '__system__', recipient: 'you', senderName: 'System', time: new Date().toLocaleTimeString(), type: 'text', direct: true, timestamp: Date.now() }]);
              torrent.files.forEach(f => f.getBlob((err, blob) => {
                if (err) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = f.name;
                a.click();
              }));
            });
          });
          setShowTorrentManager(true);
        }
      };

      const stopTorrent = (infoHash) => {
        if (torrentClientRef.current) {
          const t = torrentClientRef.current.get(infoHash);
          if (t) t.destroy();
        }
      };

      const handleFileChange = (e) => {
        if (!userName.trim()) { alert(t(lang, 'defineNameFirst')); setEditingName(true); return; }
        if (!selectedContact) { alert(t(lang, 'selectContactFirst2')); return; }
        const file = e.target.files[0]; if (!file) return;
        const conn = connections.find(c => c.peer === selectedContact);
        if (!conn || !conn.open) { alert(t(lang, 'contactOffline2')); return; }
        sendChunkedData(conn, 'fileId', file, 'file', { fileName: file.name });
        fileInputRef.current.value = '';
      };

      const sendChunkedData = (conn, idKey, dataBlob, typePrefix, metaData) => {
        const id = peerId + `_${typePrefix}_` + Date.now();
        const reader = new FileReader(); let offset = 0;
        const timestamp = new Date(), formattedTime = formatTime(timestamp);
        const isFile = typePrefix === 'file';
        const localUrl = URL.createObjectURL(dataBlob);
        setMessages(prev => { const msg = { ...metaData, [idKey]: id, sender: 'you', recipient: conn.peer, senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio', sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(), [isFile ? 'fileData' : 'audioData']: localUrl }; const updated = [...prev, msg].slice(-50); return updated; });
        try { conn.send({ type: `${typePrefix}-start`, [idKey]: id, [isFile ? 'fileSize' : 'audioSize']: dataBlob.size, senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(), ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type }) }); }
        catch (err) { alert(t(lang, 'sendError') + err.message); setMessages(prev => prev.filter(m => m[idKey] !== id)); return; }
        const readChunk = () => { const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE); reader.readAsArrayBuffer(chunk); };
        reader.onload = ev => {
          if (!conn || !conn.open) { alert(t(lang, 'connectionLost')); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); return; }
          try {
            conn.send({ type: `${typePrefix}-chunk`, [idKey]: id, chunk: ev.target.result, offset, direct: true });
            offset += ev.target.result.byteLength;
            const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
            setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, progress } : m));
            if (offset < dataBlob.size) requestAnimationFrame(readChunk);
            else setMessages(prev => { const updated = prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: 100 } : m); return updated; });
          } catch (err) { alert(t(lang, 'sendingError') + err.message); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); }
        };
        reader.onerror = () => { alert(t(lang, 'fileReadError')); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); };
        readChunk();
      };

      const handleAudioRecording = (audioBlob, targetContact) => {
        if (!userName.trim()) { alert(t(lang, 'defineNameFirst')); setEditingName(true); return; }
        if (!targetContact) { alert(t(lang, 'selectContactFirst2')); return; }
        const conn = connections.find(c => c.peer === targetContact);
        if (!conn || !conn.open) { alert(t(lang, 'contactOffline2')); return; }
        sendChunkedData(conn, 'audioId', audioBlob, 'audio', {});
      };

      const startVoiceCall = async (peerIdToCall) => {
        if (!peerInstance.current || !peerIdToCall) return;
        if (activeCalls.some(c => c.peerId === peerIdToCall && c.type === 'voice')) return;
        const conn = connections.find(c => c.peer === peerIdToCall);
        if (!conn || !conn.open) { alert(t(lang, 'contactOffline2')); return; }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          localStreamsRef.current.set(peerIdToCall + '_voice', stream);
          const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'voice' } });
          setActiveCalls(prev => [...prev, { peerId: peerIdToCall, call, localStream: stream, type: 'voice', direction: 'outgoing', isTemporaryStream: false }]);
          call.on('stream', rs => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'voice')), { peerId: peerIdToCall, stream: rs, type: 'voice' }]));
          call.on('close', () => endCall(peerIdToCall, 'voice'));
          call.on('error', err => { alert(t(lang, 'callError') + err.message); endCall(peerIdToCall, 'voice'); });
        } catch (err) { alert(t(lang, 'micError') + err.message); }
      };

      const toggleVideoCall = async (peerIdToCall) => {
        if (!peerInstance.current || !peerIdToCall) return;
        const existingCall = activeCalls.find(c => c.peerId === peerIdToCall && c.type === 'video');
        const isSendingVideo = existingCall && existingCall.localStream;
        const conn = connections.find(c => c.peer === peerIdToCall);
        if (isSendingVideo) {
          if (existingCall.localStream) { existingCall.localStream.getTracks().forEach(tr => tr.stop()); localStreamsRef.current.delete(peerIdToCall + '_video'); }
          setActiveCalls(prev => prev.map(c => c.peerId === peerIdToCall && c.type === 'video' ? { ...c, localStream: null } : c));
          if (localStreamsRef.current.size === 0) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
        } else {
          if (!conn || !conn.open) { alert(t(lang, 'contactOffline2')); return; }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStreamsRef.current.set(peerIdToCall + '_video', stream);
            setIsLocalVideoVisible(true);
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
            const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'video' } });
            setActiveCalls(prev => [...prev.filter(c => !(c.peerId === peerIdToCall && c.type === 'video')), { peerId: peerIdToCall, call, localStream: stream, type: 'video', direction: 'outgoing', isTemporaryStream: false }]);
            call.on('stream', rs => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'video')), { peerId: peerIdToCall, stream: rs, type: 'video' }]));
            call.on('close', () => endCall(peerIdToCall, 'video'));
            call.on('error', err => { alert(t(lang, 'videoError') + err.message); endCall(peerIdToCall, 'video'); });
          } catch (err) { alert(t(lang, 'cameraError') + err.message); }
        }
      };

      const endCall = (peerIdToEnd, callType) => {
        const callData = activeCalls.find(c => c.peerId === peerIdToEnd && c.type === callType);
        if (callData) {
          if (callData.call) callData.call.close();
          if (callData.localStream) { callData.localStream.getTracks().forEach(tr => tr.stop()); stopAndRemoveLocalStream(peerIdToEnd + '_' + callType); }
        }
        setActiveCalls(prev => prev.filter(c => !(c.peerId === peerIdToEnd && c.type === callType)));
        setRemoteStreams(prev => prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType)));
        const anyVideo = Array.from(localStreamsRef.current.values()).some(s => s.getVideoTracks().some(tr => tr.readyState === 'live'));
        if (!anyVideo) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
      };

      const populateEmojiPanel = () => {
        const emojis = ["😀","😁","😂","🤣","😃","😄","😅","😆","😉","😊","😋","😎","😍","😘","🥰","😗","😙","😚","🙂","🤗","🤩","🤔","🤨","😐","😑","😶","🙄","😏","😣","😥","😮","🤐","😴","😪","😵","😤","😭","😡","🤯","🥵","👍","👎","👌","✌️","🤞","👋","🤚","🖐️","👏","🙌","👐","🤲","🙏","💪","🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🙈","🙉","🙊","🍇","🍈","🍉","🍊","🍋","🍌","🍍","🥭","🍎","🍏","🍐","🍑","🍒","🍓","🥝","🍔","🍟","🍕","🌭","🥪","🌮","🌯","🍜","🍝","🍣","🍤","🍦","🍧","🍨","🍩","🍪","🎂","🍰","🧁","🍫","🍬","🍭","☕","🍵","🍷","🍸","🍹","🍺","🏠","🏡","🏢","🏰","🚂","🚗","✈️","🚀","🌍","🌈","⭐","🌙","☀️","❤️","💙","💚","💛","🧡","💜","🖤","🤍","💔","💯","🔥","⚡","✨","🎉","🎊","🎈","🎁","🏆","🥇","🎯","🎮","🎵","🎶","📱","💻","⌚","📷","🔑","💡","🔒","🔓","🛒","💰","📚","✏️","📝","🗓️"];
        return (
          <div className="emoji-panel">
            <div className="emoji-panel-header">{t(lang, 'emojis')}</div>
            <div className="emoji-panel-content">{emojis.map((e, i) => <span key={i} className="emoji-item" onClick={() => setNewMessage(prev => prev + e)}>{e}</span>)}</div>
            <div className="emoji-panel-footer">{t(lang, 'scrollMore')}</div>
          </div>
        );
      };

      const generateInviteLink = () => {
        if (!peerId) return;
        const activePeers = connections.filter(c => c.open && c.peer !== peerId).map(c => c.peer);
        const allIds = [peerId, ...activePeers].slice(0, 196);
        const url = new URL(window.location.href);
        url.searchParams.set('portas', allIds.join(','));
        const finalUrl = url.toString();
        navigator.clipboard.writeText(finalUrl);
        prompt(t(lang, 'inviteLinkCopied'), finalUrl);
      };

      if (error) return <div className="error-message"><h1>{t(lang, 'errApp')}</h1><p>{error}</p><button onClick={() => window.location.reload()}>{t(lang, 'tryAgain')}</button></div>;

      return (
        <div>
          {showTutorial && <TutorialModal lang={lang} onClose={() => setShowTutorial(false)} />}
          {showGeneralModeInfo && <GeneralModeInfoModal lang={lang} selectedContact={selectedContact} onClose={() => setShowGeneralModeInfo(false)} />}
          {showTorrentManager && (
            <TorrentManagerModal 
              lang={lang} 
              torrents={torrents} 
              onClose={() => setShowTorrentManager(false)} 
              onStop={stopTorrent} 
              onSeed={handleTorrentSeed}
              onDownload={handleTorrentDownload}
            />
          )}

          <input type="file" ref={fileInputRef} style={{ display: 'none' }} onChange={handleFileChange} />
          <input type="file" id="radioInput" accept="audio/mp3,audio/mpeg" style={{ display: 'none' }} onChange={handleRadioUpload} />
          <audio ref={radioAudioRef} style={{ display: 'none' }} />

          <div className="app-header">
            <h1 className="app-title">
              Chat K10
              <span>{t(lang, 'appSubtitle')}</span>
            </h1>
            <div className="header-buttons">
              <div className="general-mode-status" onClick={() => setShowGeneralModeInfo(true)} style={{ cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'flex-end' }}>
                <span className="general-mode-text" style={{ color: !selectedContact ? '#4ade80' : '#94a3b8' }}>
                  {t(lang, !selectedContact ? 'generalModeActivated' : 'generalModeDeactivated')}
                </span>
                <span style={{ fontSize: '10px', color: '#94a3b8', marginTop: '2px', fontWeight: '600' }}>
                  {t(lang, !selectedContact ? 'generalModeActivatedDesc' : 'generalModeDeactivatedDesc')}
                </span>
              </div>
              <div className="network-size-badge" title={lang === 'pt' ? 'Usuários Online na Teia Geral' : 'Users Online in General Web'}>
                <i className="fas fa-users"></i> {networkSize} ONLINE
              </div>
              <button onClick={() => setShowTutorial(true)} className="header-button" title={t(lang, 'tutorial')}>
                <i className="fas fa-book-open"></i>
              </button>
              <button onClick={() => setShowContacts(true)} className="header-button" title={t(lang, 'contacts')}>
                <i className="fas fa-address-book"></i>
              </button>
              <button onClick={toggleDarkMode} className="header-button" title={t(lang, 'darkMode')}>🌙</button>
              <button onClick={toggleLang} className="lang-btn" title="Switch Language">
                🌐 {t(lang, 'language')}
              </button>
            </div>
          </div>

          {radioState.status !== 'idle' && (
            <div className="radio-bar">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                <div style={{ textAlign: 'left' }}>
                  <div style={{ fontSize: '14px', fontWeight: '700' }}>🎵 {t(lang, 'radioGlobal')}: {radioState.fileName}</div>
                  <div style={{ fontSize: '12px', color: '#94a3b8', marginTop: '2px' }}>{t(lang, 'djLabel')}{radioState.sender}</div>
                </div>
                <button onClick={stopRadio} style={{ background: '#ef4444', color: 'white', border: 'none', padding: '4px 10px', borderRadius: '6px', fontSize: '11px', fontWeight: 700, cursor: 'pointer' }}>
                  <i className="fas fa-stop"></i> STOP
                </button>
              </div>

              {radioState.type === 'youtube' && (
                <div style={{ marginBottom: '10px' }}>
                  <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginBottom: '8px' }}>
                    <button 
                      onClick={() => setRadioState(prev => ({ ...prev, showVideo: !prev.showVideo }))}
                      style={{ background: '#3b82f6', color: 'white', border: 'none', padding: '4px 12px', borderRadius: '6px', fontSize: '11px', fontWeight: 600, cursor: 'pointer' }}
                    >
                      {radioState.showVideo ? t(lang, 'hideVideo') : t(lang, 'showVideo')}
                    </button>
                    {radioState.showVideo && (
                      <div style={{ display: 'flex', alignItems: 'center', gap: '5px' }}>
                        <span style={{ fontSize: '11px', color: '#94a3b8' }}>{t(lang, 'videoSize')}</span>
                        <select 
                          value={radioState.videoSize} 
                          onChange={e => setRadioState(prev => ({ ...prev, videoSize: e.target.value }))}
                          style={{ background: '#1e293b', color: 'white', border: '1px solid #334155', borderRadius: '4px', fontSize: '11px', padding: '2px' }}
                        >
                          <option value="small">{t(lang, 'small')}</option>
                          <option value="medium">{t(lang, 'medium')}</option>
                          <option value="large">{t(lang, 'large')}</option>
                        </select>
                      </div>
                    )}
                  </div>
                  
                  <div style={{ 
                    display: radioState.showVideo ? 'block' : 'none',
                    margin: '0 auto',
                    width: radioState.videoSize === 'small' ? '320px' : radioState.videoSize === 'medium' ? '560px' : '854px',
                    height: radioState.videoSize === 'small' ? '180px' : radioState.videoSize === 'medium' ? '315px' : '480px',
                    maxWidth: '100%',
                    aspectRatio: '16/9',
                    background: '#000',
                    borderRadius: '8px',
                    overflow: 'hidden'
                  }}>
                    <div ref={youtubeContainerRef} id="youtube-player"></div>
                  </div>
                </div>
              )}

              {radioState.status === 'buffering'
                ? <div style={{ color: '#f59e0b', marginTop: '4px', fontSize: '13px', fontWeight: '600' }}>
                    {t(lang, 'radioStartsIn', { s: Math.max(0, Math.ceil((radioState.startTime - Date.now()) / 1000)) })}{!radioState.audioUrl && radioState.type === 'file' && t(lang, 'downloading')}
                  </div>
                : <div style={{ color: '#10b981', marginTop: '4px', fontSize: '13px', fontWeight: '600' }}>{t(lang, 'nowPlaying')}</div>}
              
              {radioState.type === 'file' && (
                <div style={{ marginTop: '8px' }}>
                  <label style={{ fontSize: '12px', color: '#94a3b8' }}>{t(lang, 'volume')} </label>
                  <input type="range" min="0" max="1" step="0.1" defaultValue="0.5" onChange={e => { if (radioAudioRef.current) radioAudioRef.current.volume = parseFloat(e.target.value); }} />
                </div>
              )}
            </div>
          )}

          <div className="user-info-container">
            {editingName ? (
              <div className="user-name-form">
                <input type="text" value={userName} onChange={e => setUserName(e.target.value)} placeholder={t(lang, 'typeName')} autoFocus />
                <button onClick={saveUserName} disabled={!userName.trim()}>{t(lang, 'save')}</button>
              </div>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>{t(lang, 'yourName')}:</span>
                <span className="username">{userName}</span>
                <button className="user-edit-button" onClick={() => setEditingName(true)}>{t(lang, 'edit')}</button>
              </div>
            )}
          </div>

          <div className="peer-id-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: '14px', flexWrap: 'wrap' }}>
              <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>{t(lang, 'yourId')}</span>
              <span className="peer-id-label">{peerId}</span>
              <button onClick={() => setIsSuperNode(!isSuperNode)} style={{ backgroundColor: isSuperNode ? '#fef3c7' : 'white', color: isSuperNode ? '#b45309' : '#64748b', border: `1px solid ${isSuperNode ? '#f59e0b' : 'var(--border)'}`, padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '700' }}>
                <i className="fas fa-bolt" style={{ color: isSuperNode ? '#d97706' : '#94a3b8' }}></i> {isSuperNode ? t(lang, 'superNodeOn') : t(lang, 'superNodeOff')}
              </button>
              <button onClick={() => document.getElementById('radioInput').click()} disabled={radioState.status !== 'idle' || !selectedContact || isCentralServer(selectedContact)}
                style={{ backgroundColor: (radioState.status !== 'idle' || !selectedContact || isCentralServer(selectedContact)) ? '#f1f5f9' : '#8b5cf6', color: (radioState.status !== 'idle' || !selectedContact || isCentralServer(selectedContact)) ? '#94a3b8' : 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: (radioState.status !== 'idle' || !selectedContact || isCentralServer(selectedContact)) ? 'not-allowed' : 'pointer', fontSize: '12px', fontWeight: '700' }}
                title={(!selectedContact || isCentralServer(selectedContact)) ? "DJ Radio is disabled in General/Server chat to prevent network overload." : ""}>
                <i className="fas fa-music"></i> {t(lang, 'djRadio')}
              </button>
              <button onClick={handleYoutubeRadio} disabled={radioState.status !== 'idle'}
                style={{ backgroundColor: radioState.status !== 'idle' ? '#f1f5f9' : '#ef4444', color: radioState.status !== 'idle' ? '#94a3b8' : 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: radioState.status !== 'idle' ? 'not-allowed' : 'pointer', fontSize: '12px', fontWeight: '700' }}>
                <i className="fab fa-youtube"></i> {t(lang, 'youtubeRadio')}
              </button>
            </div>
            <div style={{ display: 'flex', gap: '8px' }}>
              <button onClick={() => { navigator.clipboard.writeText(peerId); alert(t(lang, 'copied')); }}>{t(lang, 'copy')}</button>
              <button onClick={generateInviteLink} className="invite-btn">{t(lang, 'generateInviteLink')}</button>
            </div>
          </div>

          {isLocalVideoVisible && (
            <FloatingWindow title={t(lang, 'you')} initialPosition={{ x: 20, y: 20 }} onClose={() => setIsLocalVideoVisible(false)}>
              <video className="local-video-player" ref={localVideoRef} autoPlay muted style={{ display: 'block', width: '100%', height: '100%', objectFit: 'cover' }}></video>
            </FloatingWindow>
          )}
          {remoteStreams.map((sd, idx) => sd.type === 'video' && (
            <FloatingWindow key={sd.peerId} title={getContactName(sd.peerId)} initialPosition={{ x: 40 + (idx * 30), y: 40 + (idx * 30) }} onClose={() => endCall(sd.peerId, 'video')}>
              <video className="video-player" ref={el => videoRefs.current[sd.peerId] = el} autoPlay style={{ display: 'block', width: '100%', height: '100%', objectFit: 'cover' }}></video>
            </FloatingWindow>
          ))}

          {activeCalls.map((call, idx) => call.type === 'voice' && (
            <div key={idx} className="audio-call-container">
              <i className="fas fa-phone" style={{ color: '#22c55e' }}></i>
              <span style={{ fontSize: '14px', fontWeight: 600 }}>{t(lang, 'voiceCallWith')} {getContactName(call.peerId)}</span>
              <button className="call-end-button" onClick={() => endCall(call.peerId, 'voice')}>{t(lang, 'endCall')}</button>
              <audio ref={el => audioRefs.current[call.peerId] = el} autoPlay></audio>
              <div style={{ marginTop: '4px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                <label style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{t(lang, 'volume')}</label>
                <input type="range" min="0" max="1" step="0.1" defaultValue="1" onChange={e => { if (audioRefs.current[call.peerId]) audioRefs.current[call.peerId].volume = parseFloat(e.target.value); }} />
              </div>
            </div>
          ))}

          {showContacts ? (
            <ContactsScreen lang={lang} contacts={contacts} setContacts={setContacts} onBack={() => setShowContacts(false)}
              onSelectContact={(pId) => { connectToPeer(pId); setSelectedContact(pId); setShowContacts(false); }} />
          ) : (
            <ChatManager
              lang={lang}
              connections={connections} messages={messages} setMessages={setMessages}
              contacts={contacts} userName={userName} peerId={peerId}
              activeCalls={activeCalls} endCall={endCall} startVoiceCall={startVoiceCall}
              toggleVideoCall={toggleVideoCall} remoteStreams={remoteStreams}
              audioRefs={audioRefs} videoRefs={videoRefs} handleFileChange={handleFileChange}
              fileInputRef={fileInputRef} handleAudioRecording={handleAudioRecording}
              newMessage={newMessage} setNewMessage={setNewMessage}
              showEmojiPanel={showEmojiPanel} setShowEmojiPanel={setShowEmojiPanel}
              populateEmojiPanel={populateEmojiPanel} getContactName={getContactName}
              selectedContact={selectedContact} setSelectedContact={setSelectedContact}
              localVideoRef={localVideoRef} registerSentMessage={(id) => seenMessagesRef.current.add(id)}
              cooldownRemaining={cooldownRemaining} setCooldownRemaining={setCooldownRemaining}
              networkSize={networkSize} centralServerId={centralServerId}
              e2eeState={e2eeState} setE2eeState={setE2eeState}
              isCentralServer={isCentralServer}
              serverE2EE={serverE2EE} setServerE2EE={setServerE2EE} connectToPeer={connectToPeer}
              handleTorrentSeed={handleTorrentSeed} handleTorrentDownload={handleTorrentDownload}
              setShowTorrentManager={setShowTorrentManager}
              pendingTorrentRequests={pendingTorrentRequests}
              setPendingTorrentRequests={setPendingTorrentRequests}
              handleTorrentDirectSeed={handleTorrentDirectSeed}
            />
          )}
        </div>
      );
    };

    ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
  </script>
</body>
</html>
