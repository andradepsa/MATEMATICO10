quizBotActive,
onOpenQuizBot
}) => {
// FIX: usa connectionsRef recebido via prop (do App) para evitar stale closure no sendDirectMessage
// Se não recebeu a prop (compatibilidade), cria um ref local sincronizado com connections
const _localConnRef = useRef(connections);
useEffect(() => { _localConnRef.current = connections; }, [connections]);
const connectionsRef = connectionsRefProp || _localConnRef;

const messagesEndRef = useRef(null);
const messagesContainerRef = useRef(null);
const [showSendSecretModal, setShowSendSecretModal] = useState(false);
const [showServerE2EEModal, setShowServerE2EEModal] = useState(false);
const [hiddenMessages, setHiddenMessages] = useState(new Set());
const [activeChatTab, setActiveChatTab] = useState('native');
const [activeGroupName, setActiveGroupName] = useState(null);
// Grupos abertos pelo usuário — aparecem na lista de conversas apenas quando selecionados
const [openedGroups, setOpenedGroups] = useState([]);
const handleGroupSelected = (name) => {
  setOpenedGroups(prev => {
    if (prev.some(g => g.name === name)) return prev;
    return [...prev, { name }];
  });
  setActiveGroupName(name);
  setActiveChatTab('group');
};
// V46: sistema de uma aba só — sem sidebarTab


const handleVote = (pollId, optionIndex) => {
  // Update local state first for immediate feedback
  setMessages(prev => prev.map(m => {
    if (m.pollId === pollId) {
      const votes = { ...(m.pollVotes || {}) };
      if (votes[peerId] === optionIndex) {
        delete votes[peerId]; // Toggle off
      } else {
        votes[peerId] = optionIndex;
      }
      return { ...m, pollVotes: votes };
    }
    return m;
  }));

  const voteData = {
    type: 'poll-vote',
    id: 'vote-' + Date.now(),
    pollId,
    optionIndex,
    sender: peerId,
    ttl: 15
  };

  // FIX N-4 V20: era connections (stale closure) → connectionsRef.current
  if (selectedContact && (!isCentralServer(selectedContact) || (serverE2EE && serverE2EE[selectedContact]?.active))) {
    const conn = connectionsRef.current.find(c => c.peer === selectedContact);
    if (conn && conn.open) conn.send({ ...voteData, direct: true });
  } else {
    connectionsRef.current.forEach(c => { if (c.open) try { c.send({ ...voteData, direct: false }); } catch(e){} });
  }
};

const handleQuizAnswer = (quizId, optionIndex) => {
  // Update local vote count immediately (optimistic)
  setMessages(prev => prev.map(m => {
    if (m.quizId === quizId && !m.quizRevealed) {
      const votes = { ...(m.quizVotes || {}) };
      if (votes[peerId] === undefined) {
        votes[peerId] = optionIndex;
      }
      return { ...m, quizVotes: votes };
    }
    return m;
  }));

  // Also record in currentQuizQuestionRef so sendQuizReveal picks it up
  if (currentQuizQuestionRef.current && currentQuizQuestionRef.current.quizId === quizId) {
    if (!currentQuizQuestionRef.current.votes) currentQuizQuestionRef.current.votes = {};
    if (currentQuizQuestionRef.current.votes[peerId] === undefined) {
      currentQuizQuestionRef.current.votes[peerId] = optionIndex;
    }
  }

  // Broadcast the answer so host and others can update stats
  // IMPORTANTE: usa type:'message' para relay pelo servidor
  const answerData = {
    type: 'message',
    id: 'qans-' + Date.now() + '-' + Math.random().toString(36).substring(2),
    text: '__QUIZ_ANSWER__',
    quizAnswerPayload: { quizId, optionIndex, voterId: peerId },
    senderName: userName || peerId,
    ttl: 15,
    direct: false
  };

  // FIX N-5 V20: era connections (stale closure) → connectionsRef.current
  if (selectedContact && (!isCentralServer(selectedContact) || (serverE2EE && serverE2EE[selectedContact]?.active))) {
    const conn = connectionsRef.current.find(c => c.peer === selectedContact);
    if (conn && conn.open) conn.send({ ...answerData, direct: true });
  } else {
    connectionsRef.current.forEach(c => { if (c.open) try { c.send({ ...answerData, direct: false }); } catch(e){} });
  }
};


useEffect(() => {
if (!youtubeChatId) setActiveChatTab('native');
}, [youtubeChatId]);
useEffect(() => {
if (!activeGroupName && activeChatTab === 'group') setActiveChatTab('native');
}, [activeGroupName]);

// Abre grupo solicitado via ContactsScreen ou Ferramentas (pendingGroup vem do App)
useEffect(() => {
  if (pendingGroup) {
    handleGroupSelected(pendingGroup.name);

}, [pendingGroup]);

// V77: escuta eventos do Grupo Oficial e auto-abre como Modo Geral
useEffect(() => {
  const openOficial = () => {
    setOpenedGroups(prev => prev.some(g => g.name === OFICIAL_GROUP_NAME) ? prev : [...prev, { name: OFICIAL_GROUP_NAME }]);

    addAudit('⭐ Modo Geral lotado — Grupo Oficial ativado automaticamente', 'sys');
  };
  window.addEventListener('k10-join-oficial',        onJoin);
  window.addEventListener('k10-overflow-to-oficial', onOverflow);
  return () => {
    window.removeEventListener('k10-join-oficial',        onJoin);
    window.removeEventListener('k10-overflow-to-oficial', onOverflow);
  };
}, []);


const [isSending, setIsSending] = useState(false);
const decryptionCache = useRef(new Map());


// formatTime definida em módulo-level (acima de ChatManager)

const canSendPrivate = selectedContact && !!e2eeState[selectedContact]?.mySecret;
const hasAnyE2EE = selectedContact && (!!e2eeState[selectedContact]?.mySecret || !!e2eeState[selectedContact]?.contactSecret);
const selectedIsServer = selectedContact && isCentralServer(selectedContact);
const serverGroupActive = selectedIsServer && serverE2EE[selectedContact]?.active;


const filteredMessages = useMemo(() => {
if (!selectedContact) {
return messages.filter(msg => !msg.recipient || msg.recipient === 'general');
}
const isSrv = isCentralServer(selectedContact);
return messages.filter(msg =>
(msg.sender === selectedContact && msg.recipient === 'you') ||
(msg.sender === 'you' && msg.recipient === selectedContact) ||
(msg.systemFor === selectedContact) ||
(isSrv && msg.recipient === selectedContact) ||
(isSrv && msg.sender === selectedContact) ||
(isSrv && (!msg.recipient || msg.recipient === 'general'))
);
}, [messages, selectedContact]);


const MessageText = ({ msg, onContentChange, onHide }) => {
  const contactPeer = msg.sender === 'you' ? msg.recipient : msg.sender;
  const isE2EE = typeof msg.text === 'string' && msg.text.startsWith(E2EE_PREFIX);
  const isGroup = typeof msg.text === 'string' && msg.text.startsWith(GROUP_E2EE_PREFIX);

  // ── Per-user quiz-bot translation ──────────────────────────────
  const isQuizBot = msg.senderName === '🤖 Quiz Bot';
  const quizCacheKey = `pt|${lang}|${msg.text}`;
  const [quizTranslated, setQuizTranslated] = useState(() => {
    if (!isQuizBot) return null;
    if (lang === 'pt') return msg.text || null;
    // Prioridade 1: já veio traduzido do handleIncomingData (caso normal)
    if (msg.translatedText) return msg.translatedText;
    // Prioridade 2: cache sessionStorage (recarregou a página)
    return _gtCache[quizCacheKey] || null;
  });
  const [quizTranslating, setQuizTranslating] = useState(false);

  useEffect(() => {
    if (!isQuizBot || !msg.text) { setQuizTranslated(null); return; }
    if (lang === 'pt') { setQuizTranslated(msg.text); return; }
    // Caso 1: já traduzido — usa direto, zero fetch
    if (msg.translatedText) { setQuizTranslated(msg.translatedText); return; }
    // Caso 2: cache sessionStorage disponível — usa direto, zero fetch
    if (_gtCache[quizCacheKey]) { setQuizTranslated(_gtCache[quizCacheKey]); return; }
    // Caso 3: fallback (mensagem antiga sem pré-tradução) — fetch com deduplicação
    let cancelled = false;
    setQuizTranslating(true);
    translateQuizText(msg.text, lang)
      .then(result => { if (!cancelled) setQuizTranslated(result); })
      .catch(() => { if (!cancelled) setQuizTranslated(msg.text); })
      .finally(() => { if (!cancelled) setQuizTranslating(false); });
    return () => { cancelled = true; };
  }, [isQuizBot, msg.text, lang, msg.translatedText, quizCacheKey]);
  // ──────────────────────────────────────────────────────────────

  const cacheKey = `${msg.timestamp}-${msg.text}`;
  const [display, setDisplay] = useState(() => {
    if (!isE2EE && !isGroup) return { plain: msg.text, encrypted: false };
    if (decryptionCache.current.has(cacheKey)) return decryptionCache.current.get(cacheKey);
    return null;
  });

  useEffect(() => {
    if (onContentChange) onContentChange();
  }, [display, onContentChange]);

  useEffect(() => {
    if (display && (display.noKey || display.error)) {
      if (onHide) onHide(msg.timestamp);
    }
  }, [display, msg.timestamp, onHide]);

  useEffect(() => {
    if (!isE2EE && !isGroup) return;
    if (decryptionCache.current.has(cacheKey)) {
      setDisplay(decryptionCache.current.get(cacheKey));
      return;
    }

    let isMounted = true;
    const runDecryption = async () => {
      if (isGroup) {
        const b64 = msg.text.slice(GROUP_E2EE_PREFIX.length);
        const serverSecrets = Object.values(serverE2EE).filter(s => s.groupSecret).map(s => s.groupSecret);
        if (serverSecrets.length === 0) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, noKey: true, isGroup: true });
          return;
        }
        for (const secret of serverSecrets) {
          try {
            const plain = await decryptMsg(b64, secret);
            const result = { plain, encrypted: true, isGroup: true };
            decryptionCache.current.set(cacheKey, result);
            if (isMounted) setDisplay(result);
            return;
          } catch(e) {}
        }
        if (isMounted) setDisplay({ plain: null, encrypted: true, error: true, isGroup: true });
      } else {
        const b64 = msg.text.slice(E2EE_PREFIX.length);
        const isMine = msg.sender === 'you';
        const secret = isMine ? e2eeState[contactPeer]?.mySecret : e2eeState[contactPeer]?.contactSecret;
        if (!secret) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, noKey: true });
          return;
        }
        try {
          const plain = await decryptMsg(b64, secret);
          const result = { plain, encrypted: true };
          decryptionCache.current.set(cacheKey, result);
          if (isMounted) setDisplay(result);
        } catch(e) {
          if (isMounted) setDisplay({ plain: null, encrypted: true, error: true });
        }
      }
    };

    runDecryption();
    return () => { isMounted = false; };
  }, [msg.text, contactPeer, e2eeState[contactPeer]?.mySecret, e2eeState[contactPeer]?.contactSecret, JSON.stringify(serverE2EE)]);

  const renderMarkdown = (text) => {
    if (!text) return null;
    if (window.marked && window.DOMPurify) {
      const rawHtml = marked.parse(text);
      const cleanHtml = DOMPurify.sanitize(rawHtml);
      return <div className="md-editor-preview" style={{ padding: 0, background: 'transparent' }} dangerouslySetInnerHTML={{ __html: sanitizeHTML(cleanHtml) }} />;
    }
    return text;
  };

  const isInvite = msg.isInvite;

  const handleAcceptInvite = () => {
    if (msg.inviteData) {
      setServerE2EE(prev => ({ ...prev, [msg.inviteData.serverId]: { active: true, groupSecret: msg.inviteData.groupSecret } }));
      connectToPeer(msg.inviteData.serverId);
      setMessages(prev => prev.map(m => m.timestamp === msg.timestamp ? { ...m, isInvite: false, text: t(lang, 'joinedGroup', { id: msg.inviteData.serverId }) } : m));
    }
  };

  const handleDeclineInvite = () => {
    setMessages(prev => prev.map(m => m.timestamp === msg.timestamp ? { ...m, isInvite: false, text: t(lang, 'declinedGroup', { id: msg.inviteData.serverId }) } : m));
  };

  if (isInvite) {
    return (
      <div className="invite-container" style={{ marginTop: '8px', padding: '10px', background: '#f0f9ff', borderRadius: '8px', border: '1px solid #bae6fd' }}>
        <div style={{ fontSize: '13px', marginBottom: '8px', color: '#0369a1', fontWeight: '500' }}>{msg.text}</div>
        <div style={{ display: 'flex', gap: '8px' }}>
          <button onClick={handleAcceptInvite} style={{ background: '#10b981', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{t(lang, 'accept')}</button>
          <button onClick={handleDeclineInvite} style={{ background: '#ef4444', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>{t(lang, 'decline')}</button>
        </div>
      </div>
    );
  }

  if (display === null) return null;
  if (!display.encrypted) {
    if (isQuizBot) {
      const displayTxt = quizTranslated !== null ? quizTranslated : (quizTranslating ? '⏳ ...' : display.plain);
      const langName = getLangName(lang);
      return (
        <div>
          {lang !== 'pt' && (
            <div style={{ fontSize: '10px', color: '#64748b', marginBottom: '3px', fontStyle: 'italic' }}>
              🌐 {langName}
            </div>
          )}
          <div style={{ whiteSpace: 'pre-wrap' }}>{displayTxt}</div>
        </div>
      );
    }
    // For regular text messages: show translated text when available (from auto-translate)
    const isSentByMe = msg.sender === 'you';
    if (!isSentByMe && msg.translatedText && msg.translatedText !== display.plain) {
      return (
        <div>
          <div>{renderMarkdown(msg.translatedText)}</div>
          <div style={{ fontSize: '10px', color: '#94a3b8', marginTop: '3px', fontStyle: 'italic', display: 'flex', alignItems: 'center', gap: '4px' }}>
            🌐 <span style={{ textDecoration: 'line-through', opacity: 0.6 }}>{display.plain.slice(0, 50)}{display.plain.length > 50 ? '…' : ''}</span>
          </div>
        </div>
      );
    }
    return <div>{renderMarkdown(display.plain)}</div>;
  }
  if (display.noKey || display.error) return null;
  const decryptedText = display.plain;
  // Show translated version of decrypted text when available
  if (msg.sender !== 'you' && msg.translatedText && msg.translatedText !== decryptedText) {
    return (
      <div>
        <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>{display.isGroup ? '🛡️ GROUP' : '🔒 PRIVATE'}</div>
        <div>{renderMarkdown(msg.translatedText)}</div>
        <div style={{ fontSize: '10px', color: '#94a3b8', marginTop: '3px', fontStyle: 'italic' }}>🌐 {decryptedText.slice(0, 40)}{decryptedText.length > 40 ? '…' : ''}</div>
      </div>
    );
  }
  return (
    <div>
      <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>{display.isGroup ? '🛡️ GROUP' : '🔒 PRIVATE'}</div>
      <div>{renderMarkdown(decryptedText)}</div>
    </div>
  );
};


const sendDirectMessage = async () => {
if (!userName.trim()) { alert(t(lang, 'pleaseSetName')); return; }
if (!newMessage.trim() || cooldownRemaining > 0 || isSending) return;
if (newMessage.length > 2000) { alert(t(lang, 'msgTooLong')); return; }


if (selectedContact) {
  // Se o libp2p estiver online, permitimos tentar o envio mesmo sem conexão PeerJS direta imediata
  const conn = connectionsRef.current.find(c => c.peer === selectedContact);
  const libp2pAvailable = libp2pRef.current && libp2pStatus === 'online';
  if ((!conn || !conn.open) && !libp2pAvailable) { 
    alert(t(lang, 'contactOffline', { name: getContactName(selectedContact) })); 
    return; 
  }
} else if (connectionsRef.current.length === 0 && libp2pStatus !== 'online') {
// FIX V67-BUG2: era alert() bloqueante — travava o event loop do JS enquanto
// o usuário não clicava OK. Com o JS travado, o PeerJS não enviava heartbeats
// e todas as conexões morriam (timeout). Substituído por mensagem inline no chat.
const _errMsg = t(lang, 'noConnections') || 'Sem conexões P2P ativas. Aguarde a rede se conectar.';
setMessages(prev => [...prev, { text: '⚠️ ' + _errMsg, sender: '__system__', recipient: 'general', senderName: 'System', time: formatTime(new Date()), type: 'text', direct: false, timestamp: Date.now() }].slice(-500));
return;
}


setIsSending(true);
const currentCooldown = Math.max(1, Math.floor(networkSize / 1000));
setCooldownRemaining(currentCooldown);


try {
const timestamp = new Date();
const msgId = Date.now() + Math.random().toString(36).substring(2);
if (registerSentMessage) registerSentMessage(msgId);
let textToSend = newMessage;


if (selectedContact && (!selectedIsServer || serverGroupActive)) {
if (selectedIsServer && serverGroupActive) {
textToSend = GROUP_E2EE_PREFIX + await encryptMsg(newMessage, serverE2EE[selectedContact].groupSecret);
} else if (!selectedIsServer && canSendPrivate) {
textToSend = E2EE_PREFIX + await encryptMsg(newMessage, e2eeState[selectedContact].mySecret);
}
const conn = connectionsRef.current.find(c => c.peer === selectedContact && c.open); // FIX N-8 V20: era connections.find (stale pós-await encryptMsg)
// V70-DIRECT-FALLBACK: sem conexão direta, roteia pelo gateway (K10GatewayShadow faz relay por recipient)
const fallbackConn = conn ? null : connectionsRef.current.find(c => c.open && isCentralServer(c.peer));
const sendConn = conn || fallbackConn;

const msgPayload = { type: 'message', id: msgId, ttl: 15, text: textToSend, sender: peerId, senderName: userName, recipient: selectedContact, direct: true, time: formatTime(timestamp) };

let directSent = false;
// Prioridade Libp2p para DM (via tópico privado)
if (libp2pRef.current && libp2pStatus === 'online') {
  try {
    await libp2pRef.current.services.pubsub.publish(`k10-private-${selectedContact}`, new TextEncoder().encode(JSON.stringify(msgPayload)));
    directSent = true;
    addAudit(`[libp2p] DM Out: ${msgId.slice(0,8)}`, 'success');
  } catch(e) { console.warn('[libp2p] Private DM Publish error:', e); }
}

// Fallback PeerJS
if (!directSent && sendConn) {
  sendConn.send(msgPayload);
} else if (!directSent && !sendConn) {
  throw new Error('No connection available (PeerJS/libp2p) to send private message.');
}

const newMsgObj = { text: textToSend, sender: 'you', recipient: selectedContact, senderName: userName, time: formatTime(timestamp), type: 'text', direct: true, timestamp: timestamp.getTime() };
setMessages(prev => {
const updated = [...prev, newMsgObj].slice(-500);
return updated;
});
} else {
const msgData = { type: 'message', id: msgId, ttl: 15, text: textToSend, sender: peerId, senderName: userName, direct: false, time: formatTime(timestamp) }; // FIX C-15: sender: peerId ausente → relay tracking e spam guard não funcionavam para mensagens próprias
// --- ENVIO HÍBRIDO COM PRIORIDADE LIBP2P ---
let libp2pSent = false;
if (libp2pRef.current && libp2pStatus === 'online') {
  try {
    await K10GeneralRoom.publishAll(libp2pRef.current, msgData);
    libp2pSent = true;
    addAudit(`[libp2p] Msg Out: ${msgId.slice(0,8)}`, 'success');
  } catch(e) { console.warn('[libp2p] Gossip error:', e); }
}

// PeerJS Mesh (apenas como mesh complementar ou fallback)
if (!libp2pSent) {
  connectionsRef.current.forEach(c => { 
    if (c.open) {
      try { c.send(msgData); } catch(e){} 
    }
  }); 
}


const newMsgObj = { text: textToSend, sender: 'you', recipient: 'general', senderName: userName, time: formatTime(timestamp), type: 'text', direct: false, timestamp: timestamp.getTime() };
setMessages(prev => {
const updated = [...prev, newMsgObj].slice(-500);
return updated;
});
}
setNewMessage('');
} catch (err) { alert(t(lang, 'sendError') + err.message); }
finally { setIsSending(false); }
};


const handleSecretSent = (targetPeer, mySecret) => {
setE2eeState(prev => ({ ...prev, [targetPeer]: { ...prev[targetPeer], mySecret } }));
};
const handleServerE2EEActivate = (srvId, groupSecret) => {
setServerE2EE(prev => ({ ...prev, [srvId]: { active: true, groupSecret } }));
};
const handleServerE2EEDeactivate = (srvId) => {
setServerE2EE(prev => { const u = { ...prev }; delete u[srvId]; return u; });
};
const deleteMessage = (ts) => {
setMessages(prev => { const u = prev.filter(m => m.timestamp !== ts); return u; });
};
const deleteMessagesByContact = (pId) => {
setMessages(prev => { const u = prev.filter(m => !((m.sender === pId && m.recipient === 'you') || (m.sender === 'you' && m.recipient === pId) || m.systemFor === pId)); return u; });
};


const scrollToBottom = (behavior = "smooth", force = false) => {
if (messagesContainerRef.current) {
const container = messagesContainerRef.current;
const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 150;


if (force || isAtBottom) {
// Use a small timeout to ensure DOM is fully updated
setTimeout(() => {
container.scrollTo({
top: container.scrollHeight,
behavior
});
}, 50);
}
}
};


useEffect(() => {
scrollToBottom("auto", true);
}, [selectedContact]);


useEffect(() => {
scrollToBottom("smooth");
}, [filteredMessages]);


useEffect(() => {
remoteStreams.forEach(({ peerId: rPeerId, stream, type }) => {
if (type === 'voice') { const el = audioRefs.current[rPeerId]; if (el && el.srcObject !== stream) { el.srcObject = stream; el.play().catch(() => {}); } }
else if (type === 'video') { const el = videoRefs.current[rPeerId]; if (el && el.srcObject !== stream) { el.srcObject = stream; el.play().catch(() => {}); } }
});
}, [remoteStreams]);


const getInputStatus = () => {
// BUG C-5 FIX: cooldown deve ser checado PRIMEIRO, independente do selectedContact.
// Antes, em modo geral (sem contato), o placeholder de cooldown nunca era exibido.
if (cooldownRemaining > 0) return { placeholder: t(lang, 'waitCooldown', { s: cooldownRemaining }), style: {} };
if (!selectedContact) return { placeholder: t(lang, 'generalMsg'), style: {} };
if (selectedIsServer && serverGroupActive)
return { placeholder: t(lang, 'groupMsg', { name: getContactName(selectedContact) }), style: { borderColor: '#3b82f6', boxShadow: '0 0 0 2px rgba(59,130,246,0.2)' } };
if (selectedIsServer)
return { placeholder: t(lang, 'generalMsg'), style: {} };
if (canSendPrivate && !selectedIsServer)
return { placeholder: t(lang, 'privateMsg', { name: getContactName(selectedContact) }), style: { borderColor: '#10b981', boxShadow: '0 0 0 2px rgba(16,185,129,0.2)' } };
return { placeholder: t(lang, 'regularMsg', { name: getContactName(selectedContact) }), style: {} };
};


const inputStatus = getInputStatus();


return (
<div>
{showSendSecretModal && (
<SendSecretModal lang={lang} connections={connections} contacts={contacts} getContactName={getContactName}
isCentralServer={isCentralServer} onSend={handleSecretSent} onClose={() => setShowSendSecretModal(false)} e2eeState={e2eeState} />
)}
{showServerE2EEModal && selectedContact && isCentralServer(selectedContact) && (
<ServerE2EEModal lang={lang} serverId={selectedContact} connections={connections} e2eeState={e2eeState}
getContactName={getContactName} onActivate={handleServerE2EEActivate} onDeactivate={handleServerE2EEDeactivate}
onClose={() => setShowServerE2EEModal(false)} currentServerE2EE={serverE2EE[selectedContact]} />
)}


<div className="chat-main-container">
{/* V46: sidebar única — contatos salvos + quem mandou msg direta. K10-CENTRAL oculto da UI */}
<div className="conversations-list">
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px' }}>
    <h4 style={{ margin: 0 }}>{t(lang, 'conversations')}</h4>
    <button className="icon-btn" onClick={() => setShowTorrentManager(true)} title={t(lang, 'torrentManager')} style={{ padding: '4px' }}>
      <i className="fas fa-magnet"></i>
    </button>
  </div>
  {(() => {
    // V46: só aparece na lista: (1) contatos salvos, (2) quem mandou msg direta
    // APENAS K10-CENTRAL fica oculto — todos os outros contatos/servidores aparecem normalmente
    // FIX-CONTACTS-LIST: aparece na lista SOMENTE se o usuário selecionou explicitamente
    // o contato (activatedContacts) OU se o contato fez uma chamada/enviou mensagem direta (directPeers).
    // Removido: contacts.some(c => c.peerId === conn.peer) — esta condição fazia qualquer contato
    // salvo aparecer ao se conectar automaticamente via mesh (peer-list/pex), sem ação do usuário.
    const peerJsIds = new Set(connections.map(c => c.peer));
    const allPeers = Array.from(new Set([...peerJsIds, ...(libp2pPeers || [])]));

    const visiblePeers = allPeers.filter(pId => 
      pId !== 'K10-CENTRAL' && pId !== 'K10-HUB-V62' && (
        (activatedContacts && activatedContacts.has(pId)) ||
        (activatedContactsRef && activatedContactsRef.current.has(pId)) ||
        (directPeers && directPeers.has(pId)) ||
        (directPeersRef && directPeersRef.current.has(pId)) ||
        pId === selectedContact

    );

    const finalConns = visiblePeers.map(pId => {
      const conn = connections.find(c => c.peer === pId);
      return conn || { peer: pId, open: false, _libp2pOnly: true };
    });
    if (finalConns.length === 0) return (
      <div style={{ padding: '16px', color: 'var(--text-muted)', fontSize: '13px', textAlign: 'center' }}>
        {t(lang, 'noConnectionsGeneral')}
      </div>
    );
    return finalConns.map((conn, i) => {
      const isSelected = selectedContact === conn.peer;
      const hasVoice = activeCalls.some(c => c.peerId === conn.peer && c.type === 'voice');
      const hasVideo = activeCalls.some(c => c.peerId === conn.peer && c.type === 'video' && c.localStream);
      const e2ee = e2eeState[conn.peer];
      const hasMine = !!e2ee?.mySecret, hasTheirs = !!e2ee?.contactSecret;
      const isServer = isCentralServer(conn.peer);
      const srvGrpActive = isServer && serverE2EE[conn.peer]?.active;
      return (
        <div key={i} className={`conversation-item${isSelected ? ' selected' : ''}${conn.peer === centralServerId ? ' central-server' : ''}`}
          onClick={() => setSelectedContact(isSelected ? null : conn.peer)}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <Avatar peerId={conn.peer} name={getContactName(conn.peer)} avatars={avatars} size="medium" />
              <div>
                <div className="conversation-name">
                  {!isServer && hasMine && hasTheirs && <span title="Full E2EE active" style={{ marginRight: '4px' }}>🔒</span>}
                  {!isServer && hasMine && !hasTheirs && <span title="Sending encrypted" style={{ marginRight: '4px' }}>📤</span>}
                  {!isServer && !hasMine && hasTheirs && <span title="Receiving encrypted" style={{ marginRight: '4px' }}>📥</span>}
                  {isServer && srvGrpActive && <span title="Group encryption active" style={{ marginRight: '4px' }}>🛡️</span>}
                  {getContactName(conn.peer)}
                  <span style={{ marginLeft: '6px', fontSize: '10px', display: 'inline-flex', gap: '3px' }}>
                    {connections.some(c => c.peer === conn.peer && c.open) && <span title="PeerJS Connected" style={{ color: '#10b981', fontWeight: 'bold' }}>P</span>}
                    {libp2pPeers && libp2pPeers.includes(conn.peer) && <span title="libp2p Online" style={{ color: '#3b82f6', fontWeight: 'bold' }}>L</span>}
                  </span>
                </div>
                <div className="conversation-peer-id">{conn.peer}</div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: '8px', position: 'relative' }}>
              <div className="sidebar-icon-btn" style={{ color: '#94a3b8' }} onClick={e => { e.stopPropagation(); deleteMessagesByContact(conn.peer); }} title={t(lang, 'deleteMessages')}>
                <i className="fas fa-trash"></i>
              </div>
              <div className="sidebar-icon-btn" style={{ color: '#ef4444' }} onClick={e => { e.stopPropagation(); if(confirm(t(lang, 'confirmRemoveFriend', { name: getContactName(conn.peer) }))) { disconnectPeer(conn.peer); deleteMessagesByContact(conn.peer); } }} title={t(lang, 'removeFriend')}>
                <i className="fas fa-user-minus"></i>
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: '5px', marginTop: '7px', flexWrap: 'wrap' }}>
            {!isServer && (hasVoice
              ? <button onClick={e => { e.stopPropagation(); endCall(conn.peer, 'voice'); }} className="call-btn" style={{ background: '#ef4444' }} title={t(lang, 'endVoiceCall')}><i className="fas fa-phone-slash"></i></button>
              : <button onClick={e => { e.stopPropagation(); startVoiceCall(conn.peer); }} className="call-btn" style={{ background: '#22c55e' }} title={t(lang, 'voiceCall')}><i className="fas fa-phone"></i></button>)}
            {!isServer && (
              <button onClick={e => { e.stopPropagation(); toggleVideoCall(conn.peer); }} className="call-btn" style={{ background: hasVideo ? '#ef4444' : '#22c55e' }} title={hasVideo ? t(lang, 'stopCamera') : t(lang, 'camera')}>
                <i className={`fas ${hasVideo ? 'fa-video-slash' : 'fa-video'}`}></i>
              </button>
            )}
            {isServer && (
              <button className={`server-e2ee-btn ${srvGrpActive ? 'active' : 'inactive'}`}
                onClick={e => { e.stopPropagation(); setSelectedContact(conn.peer); setShowServerE2EEModal(true); }}
                title={srvGrpActive ? 'Group encryption ACTIVE — click to manage' : 'Click to activate group encryption on server'}>
                🛡️
              </button>
            )}
            {!isServer && (
              <button onClick={e => { e.stopPropagation(); const input = document.createElement('input'); input.type = 'file'; input.onchange = (ev) => handleTorrentDirectSeed(ev.target.files[0], conn.peer); input.click(); }} className="call-btn" style={{ background: '#8b5cf6' }} title={t(lang, 'sendTorrent')}>
                <i className="fas fa-magnet"></i>
              </button>
            )}
          </div>
          {pendingTorrentRequests[conn.peer] && (
            <div style={{ marginTop: '8px', padding: '8px', background: '#fff7ed', borderRadius: '6px', border: '1px solid #ffedd5', fontSize: '11px' }}>
              <div style={{ fontWeight: '600', color: '#9a3412', marginBottom: '4px' }}>🧲 Torrent: {pendingTorrentRequests[conn.peer].fileName}</div>
              <div style={{ display: 'flex', gap: '4px' }}>
                <button onClick={(e) => { e.stopPropagation(); handleTorrentDownload(pendingTorrentRequests[conn.peer].magnet); setPendingTorrentRequests(prev => { const u = {...prev}; delete u[conn.peer]; return u; }); }} style={{ flex: 1, background: '#22c55e', color: 'white', border: 'none', padding: '4px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>ACEITAR</button>
                <button onClick={(e) => { e.stopPropagation(); setPendingTorrentRequests(prev => { const u = {...prev}; delete u[conn.peer]; return u; }); }} style={{ flex: 1, background: '#ef4444', color: 'white', border: 'none', padding: '4px', borderRadius: '4px', cursor: 'pointer', fontWeight: '600' }}>RECUSAR</button>
              </div>
            </div>
          )}
        </div>
      );
    });
  })()}

{/* ── Grupos abertos — aparecem aqui só quando selecionados ── */}
{openedGroups.length > 0 && (
  <div style={{ borderTop:'1px solid var(--border)', marginTop:'8px', paddingTop:'8px' }}>
    <div style={{ fontSize:'11px', fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'.08em', padding:'0 14px 6px' }}>
      🔒 Grupos
    </div>
    {openedGroups.map((g, i) => {
      const isOfficial = g.name === 'Chat K10 Oficial';
      const isActiveGrp = activeGroupName === g.name && activeChatTab === 'group';
      return (
        <div key={i}
          className={'conversation-item' + (isActiveGrp ? ' selected' : '')}
          onClick={() => handleGroupSelected(g.name)}
          style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
            <span style={{ fontSize:'18px' }}>{isOfficial ? '⭐' : '🔒'}</span>
            <div>
              <div className="conversation-name" style={{ color: isOfficial ? '#1d4ed8' : 'var(--text)' }}>{g.name}</div>
              <div className="conversation-peer-id">{isOfficial ? 'Grupo oficial' : 'Grupo P2P'}</div>
            </div>
          </div>
          <button
            title="Remover da lista"
            onClick={e => {
              e.stopPropagation();
              setOpenedGroups(prev => {
                return prev.filter(x => x.name !== g.name);
              });
              if (activeGroupName === g.name) { setActiveGroupName(null); setActiveChatTab('native'); }
            }}
            style={{ background:'none', border:'none', cursor:'pointer', color:'#94a3b8', padding:'4px 6px', fontSize:'12px', borderRadius:'4px' }}
            onMouseEnter={e => e.currentTarget.style.color='#ef4444'}
            onMouseLeave={e => e.currentTarget.style.color='#94a3b8'}>
            <i className="fas fa-times"></i>
          </button>
        </div>
      );
    })}
  </div>
)}
</div>

<div className="chat-messages-container">
{/* Tab bar — Chat Nativo / YouTube / Grupo */}
{(youtubeChatId || openedGroups.length > 0) && (
  <div style={{ display: 'flex', background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border)', flexShrink:0 }}>
    <button
      onClick={() => setActiveChatTab('native')}

    >
      💬 Chat

    {youtubeChatId && (
      <button
        onClick={() => setActiveChatTab('youtube')}
        style={{ flex: 1, padding: '10px', border: 'none', background: activeChatTab === 'youtube' ? 'var(--surface)' : 'transparent', borderBottom: activeChatTab === 'youtube' ? '2px solid #ef4444' : '2px solid transparent', fontWeight: activeChatTab === 'youtube' ? '700' : 'normal', cursor: 'pointer', color: activeChatTab === 'youtube' ? '#ef4444' : 'var(--text-muted)', fontSize:'13px' }}
      >

    )}
    {openedGroups.length > 0 && (

      >

          title="Fechar grupo"
        >✕</span>
      </button>

  </div>
)}
{activeChatTab === 'native' ? (

<>
{/* ── Banner Quiz Bot ativo no Modo Geral ─────────────────────── */}
{(!selectedContact || isCentralServer(selectedContact)) && quizBotActive && (
  <div style={{ display:'flex', alignItems:'center', gap:'8px', padding:'6px 16px',
                background:'linear-gradient(90deg,#064e3b,#065f46)', borderBottom:'1px solid #10b981',

      {t(lang, 'quizManage')}
    </button>
  </div>
)}
<div className="chat-messages" ref={messagesContainerRef}>
{filteredMessages.length === 0 && (
<div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '13px', marginTop: '40px' }}>
{selectedContact ? t(lang, 'noMessages') : (connections.length === 0 ? t(lang, 'noConnectionsGeneral') : t(lang, 'generalChatWelcome'))}
</div>
)}
{filteredMessages.map((msg, i) => {
if (hiddenMessages.has(msg.timestamp)) return null;
return (
<div key={msg.timestamp || i}
className={`message-bubble ${msg.sender === 'you' ? 'sent' : 'received'}`}
style={msg.sender === '__system__' ? { background: '#eff6ff', border: '1px solid #bfdbfe', color: '#1d4ed8', fontSize: '12px', maxWidth: '92%', borderRadius: '10px' } : {}}>
{msg.sender !== '__system__' && (
  <div className="avatar-container">
    <Avatar 
      peerId={msg.sender === 'you' ? peerId : msg.sender} 
      name={msg.sender === 'you' ? userName : (msg.senderName || getContactName(msg.sender))} 
      avatars={msg.sender === 'you' ? { [peerId]: avatars[peerId] || localStorage.getItem('p2pUserAvatar') } : avatars} 
      size="small" 
    />
  </div>
)}
<div className="message-content-wrapper">
{msg.sender !== '__system__' && (
<div className="chat-user-bubble">{msg.sender === 'you' ? (t(lang, 'you') + ' · ' + userName) : (msg.senderName || getContactName(msg.sender))}</div>
)}
{msg.type === 'poll-create' ? (
  <Poll msg={msg} peerId={peerId} onVote={handleVote} />
) : msg.type === 'quiz-question' ? (
  <QuizQuestion msg={msg} peerId={peerId} onAnswer={handleQuizAnswer} />
) : msg.type === 'text' ? (
msg.text && msg.text.includes('🧲 TORRENT:') ? (
<div className="torrent-card">
<div className="torrent-card-header">
<i className="fas fa-magnet"></i> {msg.text.split('\n')[0].replace('🧲 TORRENT: ', '')}
</div>
<div className="torrent-info">Magnet Link Detected</div>
<button className="torrent-btn download" onClick={() => handleTorrentDownload(msg.text.split('\n')[1])}>
<i className="fas fa-download"></i> {t(lang, 'downloadTorrent')}
</button>
</div>
) : <MessageText msg={msg} onContentChange={() => scrollToBottom("smooth")} onHide={(ts) => setHiddenMessages(prev => new Set(prev).add(ts))} />

const FloatingWindow = ({ title, onClose, children, initialPosition, initialSize, onNextCamera }) => {
const [pos, setPos] = useState(initialPosition || { x: 50, y: 50 });
const [size, setSize] = useState(initialSize || { width: 320, height: 240 });
const [isDragging, setIsDragging] = useState(false);
const [isResizing, setIsResizing] = useState(false);
const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
const [resizeStart, setResizeStart] = useState({ x: 0, y: 0, w: 0, h: 0 });
const [showSettings, setShowSettings] = useState(false);
const [opacity, setOpacity] = useState(1);
const [headerColor, setHeaderColor] = useState('#2563eb');


const handleMouseDown = (e) => {
if (e.target.closest('.window-controls')) return;
setIsDragging(true);
setDragOffset({
x: e.clientX - pos.x,
y: e.clientY - pos.y
});
};


const handleResizeDown = (e) => {
e.preventDefault();
e.stopPropagation();
setIsResizing(true);
setResizeStart({
x: e.clientX,
y: e.clientY,
w: size.width,
h: size.height
});
};


const handleMouseMove = (e) => {
if (isDragging) {
setPos({
x: e.clientX - dragOffset.x,
y: e.clientY - dragOffset.y
});
}
if (isResizing) {
const dw = e.clientX - resizeStart.x;
const dh = e.clientY - resizeStart.y;
setSize({
width: Math.max(200, resizeStart.w + dw),
height: Math.max(150, resizeStart.h + dh)
});
}
};


const handleMouseUp = () => {
setIsDragging(false);
setIsResizing(false);
};


useEffect(() => {
if (isDragging || isResizing) {
window.addEventListener('mousemove', handleMouseMove);
window.addEventListener('mouseup', handleMouseUp);
} else {
window.removeEventListener('mousemove', handleMouseMove);
window.removeEventListener('mouseup', handleMouseUp);
}
return () => {
window.removeEventListener('mousemove', handleMouseMove);
window.removeEventListener('mouseup', handleMouseUp);
};
}, [isDragging, isResizing, dragOffset, resizeStart]);


return (
<div className="floating-window" style={{
position: 'fixed',
left: pos.x,
top: pos.y,
width: size.width + 'px',
height: size.height + 'px',
backgroundColor: 'var(--surface)',
border: '1px solid var(--border)',
borderRadius: '10px',
boxShadow: '0 12px 30px rgba(0,0,0,0.3)',
zIndex: 1000,
display: 'flex',
flexDirection: 'column',
overflow: 'hidden',
opacity: opacity,
transition: 'opacity 0.2s'
}}>
<div
onMouseDown={handleMouseDown}
style={{
padding: '10px 14px',
backgroundColor: headerColor,
color: '#fff',
cursor: 'move',
display: 'flex',
justifyContent: 'space-between',
alignItems: 'center',
userSelect: 'none',
flexShrink: 0
}}
>
<span style={{ fontSize: '13px', fontWeight: '700', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: 1 }}>{title}</span>
<div className="window-controls" style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
{onNextCamera && (
<button
onClick={onNextCamera}
style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer', padding: '4px', fontSize: '14px', opacity: 0.8 }}
title="Próxima Câmera"

<i className="fas fa-sync-alt"></i>
</button>
)}
<button
onClick={() => setShowSettings(!showSettings)}

<i className="fas fa-cog"></i>
</button>
{onClose && (

style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer', padding: '4px', fontSize: '14px' }}

>
<i className="fas fa-times"></i>
</button>
)}
</div>
</div>


<div style={{ flex: 1, position: 'relative', backgroundColor: '#000', overflow: 'hidden' }}>
{children}


{showSettings && (
<div style={{
position: 'absolute',
top: 0,
left: 0,

bottom: 0,
backgroundColor: 'rgba(15, 23, 42, 0.95)',
color: '#fff',

zIndex: 10,

<div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(255,255,255,0.1)', paddingBottom: '8px' }}>
<span style={{ fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Configurações da Janela</span>
<button onClick={() => setShowSettings(false)} style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer' }}>
<i className="fas fa-times"></i>
</button>
</div>


<div style={{ display: 'flex', flexDirection: 'column', gap: '5px' }}>
<label style={{ opacity: 0.7 }}>Opacidade: {Math.round(opacity * 100)}%</label>
<input

</div>
</div>


<div style={{ marginTop: 'auto', textAlign: 'center', opacity: 0.5, fontSize: '10px' }}>
Arraste o canto inferior direito para redimensionar
</div>
</div>
)}
</div>


{/* Resize handle */}
<div
onMouseDown={handleResizeDown}
style={{
position: 'absolute',
bottom: 0,

width: '15px',

cursor: 'nwse-resize',
zIndex: 1001,
background: 'linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.3) 50%)',
borderBottomRightRadius: '10px'
}}
/>
</div>
);
};

}

// FIX V10: callback ref garante srcObject quando o <video> monta (resolve tela preta).

  localVideoRef.current = el;
  if (el && !el.srcObject && localStreamsRef && localStreamsRef.current && localStreamsRef.current.size > 0) {

const WorldRadiosModal = ({ lang, onClose, onBroadcast }) => {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [previewUrl, setPreviewUrl] = useState(null);
  const audioRef = useRef(null);

  const searchRadios = async () => {
    if (!query.trim()) return;
    setLoading(true);
    try {
      const res = await fetch(`https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(query)}&limit=20`);
      const data = await res.json();
      setResults(data);
    } catch (e) {
      console.error(e);
      alert('Error searching radios');
    }
    setLoading(false);
  };

  const togglePreview = (url) => {
    if (previewUrl === url) {
      setPreviewUrl(null);
      if (audioRef.current) {
        audioRef.current.pause();
        audioRef.current.src = '';
      }
    } else {
      setPreviewUrl(url);
      if (audioRef.current) {
        audioRef.current.src = url;
        audioRef.current.play().catch(e => console.error("Preview play error:", e));
      }
    }
  };

  return (
    <div className="media-controls-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="media-controls-modal" style={{ maxWidth: '600px', maxHeight: '80vh', display: 'flex', flexDirection: 'column' }}>
        <div className="media-controls-header">
          <h2><i className="fas fa-globe"></i> World Radios</h2>
          <button className="tutorial-close" onClick={onClose}>×</button>
        </div>
        
        <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', padding: '0 20px' }}>
          <input 
            type="text" 
            value={query} 
            onChange={e => setQuery(e.target.value)} 
            placeholder="Search by name or country..." 
            style={{ flex: 1, padding: '10px', borderRadius: '8px', border: '1px solid #334155', background: '#1e293b', color: 'white' }}
            onKeyDown={e => e.key === 'Enter' && searchRadios()}
          />
          <button onClick={searchRadios} style={{ padding: '10px 16px', background: '#2563eb', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
            {loading ? '...' : 'Search'}
          </button>
        </div>

        <div style={{ overflowY: 'auto', flex: 1, display: 'flex', flexDirection: 'column', gap: '8px', padding: '0 20px 20px 20px' }}>
          {results.map((r, i) => (
            <div key={i} style={{ background: '#1e293b', padding: '12px', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ overflow: 'hidden', marginRight: '10px' }}>
                <div style={{ fontWeight: 'bold', fontSize: '14px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.name}</div>
                <div style={{ fontSize: '12px', color: '#94a3b8' }}>{r.country} • {(r.tags || '').split(',').slice(0,3).join(', ')}</div>
              </div>
              <div style={{ display: 'flex', gap: '8px', flexShrink: 0 }}>
                <button 
                  onClick={() => togglePreview(r.url_resolved)}
                  style={{ background: previewUrl === r.url_resolved ? '#ef4444' : '#10b981', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >
                  <i className={`fas ${previewUrl === r.url_resolved ? 'fa-stop' : 'fa-play'}`}></i> {previewUrl === r.url_resolved ? 'Stop' : 'Preview'}
                </button>
                <button 
                  onClick={() => {
                    if (audioRef.current) { audioRef.current.pause(); audioRef.current.src = ''; }
                    onBroadcast(r);
                  }}
                  style={{ background: '#8b5cf6', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >
                  <i className="fas fa-broadcast-tower"></i> Broadcast
                </button>
              </div>
            </div>
          ))}
          {results.length === 0 && !loading && (
            <div style={{ textAlign: 'center', color: '#64748b', padding: '20px' }}>No radios found.</div>
          )}
        </div>
        <audio ref={audioRef} style={{ display: 'none' }} />
      </div>
    </div>
  );
};

// Cache de imagens: query -> URL  (evita chamar API repetidamente)
// Cache de rodada: guarda SÓ a URL escolhida para etapa 2 reusar a mesma foto
// Limpo a cada nova rodada — nunca acumula no computador do usuário
const _worldImgCache = {};
const _worldImgLocks = {};

async function fetchWorldImage(query, usedImagesSet, syncCallback) {
  if (!Array.isArray(_worldImgCache[query])) {
    _worldImgCache[query] = [];
  }

  if (_worldImgCache[query].length === 0) {
    if (!_worldImgLocks[query]) {
      _worldImgLocks[query] = (async () => {
        const key = getPixabayKey();
        try {
          const url = `https://pixabay.com/api/?key=${key}&q=${encodeURIComponent(query)}&image_type=photo&safesearch=true&per_page=200&orientation=horizontal`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.hits && data.hits.length > 0) {
            let hitsArr = [...data.hits];
            // Fisher-Yates shuffle
            for (let i = hitsArr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [hitsArr[i], hitsArr[j]] = [hitsArr[j], hitsArr[i]];
            }
            _worldImgCache[query] = hitsArr;
            
            // ── SOLUÇÃO 2: Limpeza LRU Simples (Prevenção Memory Leak) ──
            const keys = Object.keys(_worldImgCache);
            if (keys.length > 20) {
              const oldKey = keys.find(k => k !== query);
              if (oldKey) delete _worldImgCache[oldKey];
            }
            
            if (syncCallback) syncCallback(hitsArr);
          }
        } catch(e) { console.warn('Pixabay fetch error', e); } finally {
          _worldImgLocks[query] = null;
        }
      })();
    }
    await _worldImgLocks[query];
  }

  while (_worldImgCache[query].length > 0) {
    const pick = _worldImgCache[query].shift();
    if (usedImagesSet && !usedImagesSet.has(pick.id)) {
       usedImagesSet.add(pick.id);
       return pick; // Retorna todo o objeto 'hit' (incluindo .id e .webformatURL/.largeImageURL)
    }
  }
  return null;
}

// Gera 3 alternativas falsas de um array, evitando o valor correto
function pickFakeAlts(pool, correct, count = 3) {
  const filtered = pool.filter(v => v.toLowerCase() !== correct.toLowerCase());
  const shuffled = filtered.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Monta 4 alternativas (1 certa + 3 erradas) embaralhadas; retorna [opts, correctIndex]
function buildAlternatives(pool, correct) {
  const fakes = pickFakeAlts(pool, correct, 3);
  const all = [...fakes, correct].sort(() => Math.random() - 0.5);
  const correctIdx = all.findIndex(v => v.toLowerCase() === correct.toLowerCase());
  return [all, correctIdx];
}

const MIN_QUIZ_INTERVAL = 60;  // TRAVA de vigilância: mínimo de 1 minuto entre perguntas (anti-spam)
const DEFAULT_QUIZ_INTERVAL = 120; // Tempo padrão de exibição da pergunta: 2 minutos

const QuizBotWindow = ({ lang, onClose, quizBotActive, setQuizBotActive, askNextQuestion, quizInterval, setQuizInterval, quizIntervalInput, setQuizIntervalInput, quizDiscipline, setQuizDiscipline, serverQuizBotActive, notifyServer, quizJitterTimerRef, broadcastToggle, sendQuizHandoff, quizServerOwnerId, globalQuizOwner, setGlobalQuizOwner, quizMasterIdRef, peerId, quizStopCooldown, startQuizStopCooldown }) => {
  const langName = getLangName(lang);
  return (
    <FloatingWindow
      title={t(lang, 'quizBotTitle')}
      onClose={onClose}
      initialPosition={{ x: Math.max(20, window.innerWidth / 2 - 175), y: Math.max(20, window.innerHeight / 2 - 260) }}
      initialSize={{ width: 350, height: 520 }}
    >
      <div style={{ padding: '20px', textAlign: 'center', height: '100%', overflowY: 'auto', display: 'flex', flexDirection: 'column', justifyContent: 'flex-start' }}>
        <p style={{ marginBottom: '8px', color: 'var(--text-muted)', fontSize: '13px' }}>
          {t(lang, 'quizBotDesc')}
        </p>
        <div style={{ background: '#f0fdf4', border: '1px solid #bbf7d0', borderRadius: '8px', padding: '10px', marginBottom: '14px', fontSize: '11px', color: '#166534', textAlign: 'left' }}>
          {t(lang, 'quizP2PInfo')}
          <div style={{ marginTop: '5px', fontWeight: 'bold' }}>
            {t(lang, 'quizP2PCapacity')}
          </div>
        </div>

        <div style={{ background: '#eff6ff', border: '1px solid #bfdbfe', borderRadius: '8px', padding: '8px 12px', marginBottom: '14px', fontSize: '12px', color: '#1d4ed8' }}>
          {t(lang, 'quizYourLang')} <strong>{langName}</strong>
          {lang === 'pt'
            ? ' ' + t(lang, 'quizLangOriginal')
            : ' ' + t(lang, 'quizLangTranslated')}
          <div style={{ marginTop: '4px', color: '#64748b', fontSize: '11px' }}>
            {t(lang, 'quizLangTip')}
          </div>
        </div>
        
        <div style={{ marginBottom: '10px', textAlign: 'left' }}>
          <label style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{t(lang, 'quizDiscipline')}</label>
          <select value={quizDiscipline} onChange={e => setQuizDiscipline(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text)', marginTop: '4px' }} disabled={quizBotActive}>
            <option value="all">{t(lang, 'quizAllDisciplines')}</option>
            {QUIZ_SUBJECTS.map(sub => (
              <option key={sub.id} value={sub.id}>{sub.emoji} {t(lang, sub.nameKey)}</option>
            ))}
          </select>
        </div>
        <div style={{ marginBottom: '20px', textAlign: 'left' }}>
          <label style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{t(lang, 'quizTimePerQuestion')}</label>
          <input 
            type="number" 
            value={quizIntervalInput} 
            onChange={e => setQuizIntervalInput(Number(e.target.value))} 
            onBlur={() => {
              const val = Math.max(DEFAULT_QUIZ_INTERVAL, quizIntervalInput);
              setQuizIntervalInput(val);
              setQuizInterval(val);
            }}
            min="120" 
            style={{ width: '100%', padding: '8px', borderRadius: '4px', background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text)', marginTop: '4px' }} 
            disabled={quizBotActive} 
          />
        </div>

        <div style={{ marginBottom: '20px' }}>
          <span style={{ display: 'inline-block', padding: '8px 16px', borderRadius: '20px', background: quizBotActive ? '#10b98120' : '#ef444420', color: quizBotActive ? '#10b981' : '#ef4444', fontWeight: 'bold' }}>
            {quizBotActive ? t(lang, 'quizActive') : t(lang, 'quizInactive')}
          </span>
        </div>

        <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginTop: 'auto' }}>
          {(() => {
            // V69-LOCK-2: dono = quem ativou via P2P ou via servidor
            const peerP2POwner = quizBotActive && globalQuizOwner && globalQuizOwner !== peerId;
            const isLockedByServer = serverQuizBotActive && quizServerOwnerId !== peerId;
            const isLocked = peerP2POwner || isLockedByServer;
            const iAmOwner = (quizBotActive && globalQuizOwner === peerId) ||
                             (serverQuizBotActive && quizServerOwnerId === peerId);

            // V69-LOCK-2: não-donos NUNCA veem o botão Stop — apenas um painel de bloqueio
            if (isLocked) {
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#f1f5f9', border: '1.5px solid #e2e8f0',
                  textAlign: 'center', color: '#64748b', fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                }}>
                  {t(lang, 'quizLockedByOther')}
                </div>
              );
            }

            // V73: cooldown pós-parada — bloqueia botão de iniciar para todos por 3 min
            if (!quizBotActive && quizStopCooldown > 0) {
              const mins = Math.floor(quizStopCooldown / 60);
              const secs = quizStopCooldown % 60;
              const display = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
              return (
                <div style={{
                  width: '100%', padding: '14px 16px', borderRadius: '10px',
                  background: '#fff7ed', border: '1.5px solid #fed7aa',
                  textAlign: 'center', color: '#c2410c', fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                }}>
                  {t(lang, 'quizStopCooldownMsg', { s: display })}
                </div>
              );
            }

            return (
          <button 
            className="primary-btn" 
            onClick={() => {
              const newActive = !quizBotActive;
              let handoffSent = false;
              if (!newActive && sendQuizHandoff) {
                try { sendQuizHandoff(); handoffSent = true; } catch(e) { console.warn('Quiz handoff failed', e); }
              }
              setGlobalQuizOwner(newActive ? peerId : null);
              setQuizBotActive(newActive);
              if (newActive) {
                notifyServer('quiz-bot-start');
              } else if (!handoffSent) {
                notifyServer('quiz-bot-stop');
              }
              if (broadcastToggle) broadcastToggle(newActive);
              if (newActive) {
                const initialJitterMs = 1000 + Math.floor(Math.random() * 2000);
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                quizJitterTimerRef.current = setTimeout(askNextQuestion, initialJitterMs);
              } else {
                if (quizJitterTimerRef.current) clearTimeout(quizJitterTimerRef.current);
                if (startQuizStopCooldown) startQuizStopCooldown(); // V73: cooldown 3min para o dono local
              }
            }}
            style={{ background: iAmOwner ? '#ef4444' : '#10b981', width: '100%' }}
          >
            {iAmOwner ? t(lang, 'quizStopBot') : t(lang, 'quizStartBot')}
          </button>
            );
          })()}
        </div>
      </div>
    </FloatingWindow>
  );
};

// ── V74-A: Sincronização de Relógio entre Peers ─────────────────────────────
// clockOffsetRef = diferença entre relógio do servidor NTP e Date.now() local
// trueNow()      = Date.now() + clockOffsetRef.current (sempre use no lugar de Date.now() no Quiz)
// syncClock()    = sincroniza via worldtimeapi.org → fallback timeapi.io (timeout 3s, sanidade ±30s)
const clockOffsetRef = useRef(0);
const trueNow = () => Date.now() + clockOffsetRef.current;
const syncClock = async () => {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);
  try {
    const t0 = Date.now();
    const res = await fetch('https://worldtimeapi.org/api/ip', { signal: controller.signal });
    const data = await res.json();
    clearTimeout(timeoutId);
    const serverMs = new Date(data.datetime).getTime();
    const rtt = Date.now() - t0;
    const offset = serverMs + rtt / 2 - Date.now();
    if (Math.abs(offset) < 30000) clockOffsetRef.current = offset; // sanidade ±30s
    console.log(`[V74-A] syncClock OK (worldtimeapi) offset=${Math.round(offset)}ms`);
    return;
  } catch(e) { clearTimeout(timeoutId); }
  // Fallback: timeapi.io
  const ctrl2 = new AbortController();
  const tid2 = setTimeout(() => ctrl2.abort(), 3000);
  try {
    const t0 = Date.now();
    const res = await fetch('https://timeapi.io/api/time/current/zone?timeZone=UTC', { signal: ctrl2.signal });
    const data = await res.json();
    clearTimeout(tid2);
    const serverMs = new Date(data.dateTime + 'Z').getTime();
    const rtt = Date.now() - t0;
    const offset = serverMs + rtt / 2 - Date.now();
    if (Math.abs(offset) < 30000) clockOffsetRef.current = offset;
    console.log(`[V74-A] syncClock OK (timeapi.io) offset=${Math.round(offset)}ms`);
  } catch(e) { clearTimeout(tid2); console.warn('[V74-A] syncClock falhou — usando offset=0'); }
};
useEffect(() => {
  syncClock();
  const clockSyncInterval = setInterval(syncClock, 5 * 60 * 1000); // re-sincroniza a cada 5 min
  return () => clearInterval(clockSyncInterval);
}, []);

// Embaralha array in-place (Fisher-Yates)
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Retira o próximo lugar da fila; quando vazia, reembaralha tudo de novo
function nextWorldPlace() {
  if (worldQuizQueueRef.current.length === 0) {
    // Cria nova fila com todos os índices embaralhados + seed de tempo para variar sempre
    const indices = WORLD_PLACES.map((_, i) => i);
    shuffleArray(indices);
    // Garante que o primeiro da nova fila ≠ último lugar jogado (evita repetição na virada)
    if (worldQuizPlaceRef.current) {
      const lastIdx = WORLD_PLACES.indexOf(worldQuizPlaceRef.current);
      if (indices[0] === lastIdx && indices.length > 1) {
        [indices[0], indices[1]] = [indices[1], indices[0]];
      }
    }
    worldQuizQueueRef.current = indices;
  }
  const idx = worldQuizQueueRef.current.shift();
  return WORLD_PLACES[idx];
}

// ─────────────────────────────────────────────────────────────────────
// QUIZ HANDOFF: quando o usuário desliga o bot, transfere o estado
// (disciplina, intervalo, IDs já usados, hits em buffer) para o servidor
// continuar a transmissão exatamente de onde parou.
// IMPORTANTE: segue o mesmo padrão do programa — só URL + ID das imagens
// (nada de binário). O servidor reusa fetchWorldImage com os mesmos IDs
// no Set de já-usados pra não repetir.
// ─────────────────────────────────────────────────────────────────────
const sendQuizHandoff = () => {
  if (!centralServerId) return;
  const conn = connectionsRef.current.find(c => c.peer === centralServerId && c.open);
  if (!conn) return;

  // Snapshot dos hits do Pixabay já buscados mas ainda não usados (por query)
  // _worldImgCache é módulo-level, então acessamos por window
  const bufferedHits = {};
  try {
    if (typeof _worldImgCache === 'object' && _worldImgCache) {
      for (const q in _worldImgCache) {
        if (Array.isArray(_worldImgCache[q]) && _worldImgCache[q].length > 0) {
          bufferedHits[q] = _worldImgCache[q].slice(0); // shallow copy
        }
      }
    }
  } catch(e) {}

  const handoff = {
    type: 'quiz-handoff',
    quizDiscipline: quizDisciplineRef.current,
    quizInterval: safeQuizInterval(),
    usedImageIds: Array.from(worldQuizUsedImagesRef.current || []),
    bufferedHits,                                  // hits Pixabay (URL+ID, sem binário)
    lastPlaceQuery: worldQuizPlaceRef.current ? worldQuizPlaceRef.current.query : null,
    lastQuizTime: lastQuizTimeRef.current,        // Sincroniza cooldown global
    senderName: userNameRef.current || 'Quiz Master', // FIX BUG-3: ref evita stale closure
  };
  try { conn.send(handoff); } catch(e) {} // handoff enviado ao servidor
};

const sendQuizQuestion = (quizData) => {
  const timestamp = new Date();
  const now = trueNow(); // V74-A: usa relógio sincronizado em vez de Date.now() local
  lastQuizTimeRef.current = now; // Atualiza cooldown local
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  // IMPORTANTE: usa type:'message' para que o servidor faça relay automaticamente
  // O campo quizPayload embute os dados estruturados do quiz
  const wireMsg = {
    type: 'message',
    id: msgId,
    ttl: 15,
    senderName: '🤖 Quiz Bot',
    direct: false,
    time: timeStr,
    timestamp: timestamp.getTime(),
    text: '__QUIZ__',          // texto sentinela — clientes antigos ignoram, clientes novos detectam
    quizPayload: quizData      // dados completos do quiz
  };

  const localMsg = {
    type: 'quiz-question',
    sender: 'you',
    senderName: '🤖 Quiz Bot',
    time: timeStr,
    timestamp: timestamp.getTime(),
    recipient: target || 'general',
    quizVotes: {},
    quizRevealed: false,
    ...quizData
  };

  if (target) {
    const conn = connectionsRef.current.find(c => c.peer === target && c.open);
    if (conn) try { conn.send(wireMsg); } catch(e) { console.error('Quiz send error', e); }
    setMessages(prev => [...prev, localMsg].slice(-500));
  } else {
    connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
    // V77: propaga perguntas do quiz para todos sub-grupos do Grupo Oficial
    K10OficialShadow.publishAll(libp2pRef.current, wireMsg);
    setMessages(prev => [...prev, localMsg].slice(-500));
  }
  
  // Envia para os inscritos do World Quiz, independentemente de estar em um servidor ou não
  if (quizData.quizStage) {
    worldQuizSubscribersRef.current.forEach(subId => {
      const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
      if (subConn) try { subConn.send(wireMsg); } catch(e) {}
    });
  }
};

const sendQuizReveal = (quizId) => {
  const timestamp = new Date();
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  const q = currentQuizQuestionRef.current;
  const refVotes = q ? (q.votes || {}) : {};

  setMessages(prev => {
    const quizMsg = prev.find(m => m.quizId === quizId);
    const stateVotes = quizMsg ? (quizMsg.quizVotes || {}) : {};
    const mergedVotes = { ...stateVotes, ...refVotes };

    // IMPORTANTE: usa type:'message' para relay pelo servidor
    const wireMsg = {
      type: 'message',
      id: msgId,
      ttl: 15,
      senderName: '🤖 Quiz Bot',
      direct: false,
      time: timeStr,
      text: '__QUIZ_REVEAL__',
      quizRevealPayload: { quizId, votes: mergedVotes }
    };

    if (target) {
      const conn = connectionsRef.current.find(c => c.peer === target && c.open);
      if (conn) try { conn.send(wireMsg); } catch(e) {}
    } else {
      connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
      // V13: propaga reveal via libp2p para peers do Grupo Oficial
      K10OficialShadow.publishAll(libp2pRef.current, wireMsg);
    }
    
    if (q && q.quizStage) {
      worldQuizSubscribersRef.current.forEach(subId => {
        const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
        if (subConn) try { subConn.send(wireMsg); } catch(e) {}
      });
    }

    return prev.map(m =>
      m.quizId === quizId ? { ...m, quizRevealed: true, quizVotes: mergedVotes } : m
    );
  });
};

const askWorldQuestion = async () => {
  if (quizTimerRef.current) clearTimeout(quizTimerRef.current);
  worldQuizStageRef.current = 0;

  // Pega próximo lugar da fila embaralhada (nunca repete antes de ver todos os 35)
  const place = nextWorldPlace();
  worldQuizPlaceRef.current = place;
  worldQuizImageRef.current = null;

  // Busca imagem na Pixabay com suporte a buffer
  const hit = await fetchWorldImage(place.query, worldQuizUsedImagesRef.current, (hits) => {
    // Replica o buffer para toda a conexões (Takeover Support)
    const syncMsg = { type: 'quiz-buffer-sync', query: place.query, hits };
    connectionsRef.current.forEach(c => { if(c.open) try{c.send(syncMsg);}catch(e){} });
  });

  const imgUrl = hit ? hit.largeImageURL || hit.webformatURL : null;
  const imgId = hit ? hit.id : null;
  worldQuizImageRef.current = imgUrl;

  // ── ETAPA 1: Qual o PAÍS? ──
  const [countryOpts, countryCorrectIdx] = buildAlternatives(ALL_COUNTRIES, place.country);
  const quizId1 = 'quiz-world1-' + Date.now() + '-' + Math.random().toString(36).substring(2);
  worldQuizId1Ref.current = quizId1;
  worldQuizStageRef.current = 1;

  const quizData1 = {
    quizId:      quizId1,
    quizQuestion:'🌍 Em qual PAÍS fica este lugar famoso?',
    quizOptions: countryOpts,
    quizCorrect: countryCorrectIdx,
    quizSubject: '📸 Lugares do Mundo',
    quizStage:   1,
    quizImage:   imgUrl || undefined,
    quizImageId: imgId || undefined,
    nonce: Math.random().toString(36).substring(2, 10),
  };

  currentQuizQuestionRef.current = { ...quizData1, quizId: quizId1, votes: {} };
  sendQuizQuestion(quizData1);

  // Após intervalo: avança direto para etapa 2 (sem reveal automático)
  quizTimerRef.current = setTimeout(() => {
    if (!quizBotActiveRef.current) return;
    currentQuizQuestionRef.current = null;
    worldQuizStageRef.current = 0;

    setTimeout(() => {
      if (!quizBotActiveRef.current) return;

      // ── ETAPA 2: Qual o ESTADO/CIDADE? ── (mesma imagem, sem nova chamada API)
      const statePool = place.statePool || ALL_COUNTRIES; // fallback seguro
      const [stateOpts, stateCorrectIdx] = buildAlternatives(statePool, place.state);
      const quizId2 = 'quiz-world2-' + Date.now() + '-' + Math.random().toString(36).substring(2);
      worldQuizId2Ref.current = quizId2;
      worldQuizStageRef.current = 2;

      const quizData2 = {
        quizId:      quizId2,
        quizQuestion:'🗺️ Em qual ESTADO ou CIDADE fica este lugar?',
        quizOptions: stateOpts,
        quizCorrect: stateCorrectIdx,
        quizSubject: '📸 Lugares do Mundo',
        quizStage:   2,
        quizImage:   worldQuizImageRef.current || undefined,  // mesma imagem — zero chamadas extras
        nonce: Math.random().toString(36).substring(2, 10),
      };

      currentQuizQuestionRef.current = { ...quizData2, quizId: quizId2, votes: {} };
      sendQuizQuestion(quizData2);

      // Após mais intervalo: avança para próxima rodada (sem reveal automático)
      quizTimerRef.current = setTimeout(() => {
        if (!quizBotActiveRef.current) return;
        currentQuizQuestionRef.current = null;
        worldQuizStageRef.current = 0;

        setTimeout(() => {
          if (quizBotActiveRef.current) askNextQuestion();
        }, 10000); // 10s de respiro entre rodadas
      }, safeQuizInterval() * 1000); // etapa 2 — mesmo tempo do quiz normal

    }, 5000); // 5s entre etapa 1 e etapa 2
  }, safeQuizInterval() * 1000); // etapa 1 — mesmo tempo do quiz normal

const fillGroupPresenceBits = (gid, count) => {
const bits = ensureGroupPresenceBits(gid);
if (!bits) return null;
const safeCount = Math.min(Math.max(0, parseInt(count) || 0), K10_MAX_GROUP);
bits.fill(0);
for (let i = 0; i < safeCount; i++) bits[i >> 3] |= (1 << (i & 7));

};

const setGroupPresenceBit = (gid, index, online = true) => {
const bits = ensureGroupPresenceBits(gid);
if (!bits) return;
if (typeof index !== 'number' || index < 0 || index >= K10_MAX_GROUP) return;
const byte = index >> 3;
const mask = 1 << (index & 7);
if (online) bits[byte] |= mask;
else bits[byte] &= (~mask) & 0xFF;
};

if (!pkt) return false;
const buf = pkt.buffer.slice(pkt.byteOffset, pkt.byteOffset + pkt.byteLength);
let sent = false;
connectionsRef.current.forEach(c => {
  if (c.peer !== exceptPeer && c.open) {
    try { c.send(buf); sent = true; } catch(e) {}
  }
});
return sent;
};

// Detectada ANTES de qualquer JSON.parse — ArrayBuffer com magic byte 0xB1
// Converte para objeto JS com mesmo formato V25 e deixa cair nos handlers abaixo
if (K10BinaryProtocolClient.isBinaryPacket(data)) {
  const decoded = k10bin.decodeToObject(data);
  if (!decoded) {
    // GID ainda não aprendido (peer conectou antes do peer-list) — ignora silenciosamente
    return;
  }

  // Dedup binário: usa gidIdx + type numérico do pacote + seq
  // IMPORTANTE: usa pkt.type (numérico direto do pacote) — não deriva do objeto decodificado
  // Evita colisão: pex-update=0x01, position-update=0x02, gid-promote=0x03
  const rawPkt = k10bin.decode(data instanceof ArrayBuffer ? new Uint8Array(data) : data);
  if (rawPkt && decoded._gidIdx !== undefined && decoded._seq !== undefined) {
    if (k10bin.isDuplicate(decoded._gidIdx, rawPkt.type, decoded._seq)) return;
  }

  // Relay binário P2P: recodifica com TTL decrementado — sem JSON.stringify/parse
  if ((decoded.ttl || 0) > 0) {
    const relayBuf = k10bin.reencodeWithDecrementedTtl(data instanceof ArrayBuffer ? new Uint8Array(data) : data);
    if (relayBuf) {
      connectionsRef.current.forEach(c => {
        if (c.peer !== pId && c.open) {
          try { c.send(relayBuf.buffer); } catch(e) {
            // Fallback JSON para peers que não suportam binário
            try { c.send(decoded); } catch(e2) {}
          }
        }
      });
      // Libp2p relay (converte para JSON pra facilitar pubsub por enquanto)
      libp2pRelay({ ...decoded, ttl: (decoded.ttl || 0) - 1 }, pId);
    }
  }

  // Substitui 'data' pelo objeto decodificado — os handlers V25 abaixo processam normalmente
  data = decoded;
