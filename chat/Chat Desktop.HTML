<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat K10</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    #root {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .app-title {
      margin: 0;
      font-size: 24px;
    }
    .header-buttons {
      display: flex;
      gap: 10px;
    }
    .header-button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .user-info-container {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .username {
      font-weight: bold;
      color: #333;
    }
    .user-edit-button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .user-name-form {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .user-name-form input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      width: 200px;
    }
    .user-name-form button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 3px;
      cursor: pointer;
    }
    .user-name-form button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .peer-id-container {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .peer-id-container button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 3px;
      cursor: pointer;
    }
    .chat-main-container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 300px);
    }
    .conversations-list {
      width: 300px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow-y: auto;
    }
    .conversation-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .conversation-item.selected {
      background-color: #e6f3ff;
    }
    .conversation-item.central-server {
      border-left: 4px solid #ffc107 !important;
    }
    .conversation-name {
      font-weight: bold;
      color: #333;
    }
    .conversation-peer-id {
      font-size: 12px;
      color: #666;
    }
    .chat-messages-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message-bubble {
      max-width: 70%;
      padding: 10px;
      border-radius: 10px;
      position: relative;
      word-wrap: break-word;
    }
    .message-bubble.sent {
      background-color: #007bff;
      color: white;
      align-self: flex-end;
    }
    .message-bubble.received {
      background-color: #e9ecef;
      color: #333;
      align-self: flex-start;
    }
    .chat-user-bubble {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .message-timestamp {
      font-size: 10px;
      color: #999;
      margin-top: 5px;
      text-align: right;
    }
    .file-link {
      color: inherit;
      text-decoration: underline;
    }
    .audio-player {
      width: 200px;
      margin-top: 5px;
    }
    .reply-private-button {
      font-size: 10px;
      background: none;
      border: none;
      color: #007bff;
      cursor: pointer;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chat-input-container {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
      gap: 10px;
      align-items: center;
    }
    .voice-button {
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .voice-button.recording {
      background-color: #ff5722;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .voice-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .chat-input-container button {
      padding: 8px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-input-container button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .message-input-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .emoji-button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      margin-right: 5px;
    }
    .message-input {
      width: 100%;
      padding: 8px 40px 8px 40px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
    }
    .message-input:disabled {
      background-color: #f4f4f4;
      cursor: not-allowed;
    }
    .emoji-panel {
      position: absolute;
      bottom: 50px;
      left: 0;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      width: 300px;
      max-height: 200px;
      display: flex;
      flex-direction: column;
    }
    .emoji-panel-header {
      background-color: #007bff;
      color: white;
      padding: 5px 10px;
      font-weight: bold;
    }
    .emoji-panel-content {
      display: flex;
      flex-wrap: wrap;
      padding: 10px;
      overflow-y: auto;
    }
    .emoji-item {
      font-size: 24px;
      padding: 5px;
      cursor: pointer;
    }
    .emoji-panel-footer {
      padding: 5px 10px;
      border-top: 1px solid #ddd;
    }
    .barra-rolagem-label {
      font-size: 12px;
      color: #666;
    }
    .contact-form {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .contact-form-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .contact-form input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      flex: 1;
    }
    .contact-form button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 3px;
      cursor: pointer;
    }
    .connected-peers {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .peer-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .peer-item:last-child {
      border-bottom: none;
    }
    .peer-item button {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .error-message {
      background-color: #f8d7da;
      color: #721c24;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      margin: 20px;
    }
    .error-message button {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 10px;
    }
    .progress-container {
      margin-top: 5px;
    }
    .progress-bar {
      width: 100%;
      background-color: #f0f0f0;
      border-radius: 5px;
      overflow: hidden;
    }
    /* FIX Bug 3: Era "transition: width: 0.3s ease" (dois-pontos extra = CSS inválido) */
    .progress {
      height: 5px;
      background-color: #007bff;
      transition: width 0.3s ease;
    }
    .green-delete-icon {
      position: absolute;
      top: 5px;
      right: 5px;
      color: #28a745;
      cursor: pointer;
      font-size: 14px;
    }
    .green-delete-icon:hover {
      color: #218838;
    }
    .video-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }
    .video-player, .local-video-player {
      width: 320px;
      height: 240px;
      background-color: #000;
      border-radius: 5px;
    }
    .local-video-player {
      border: 2px solid #007bff;
    }
    .video-label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .audio-call-container {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .call-end-button {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    .dark-mode .app-header { background-color: #1f1f1f; }
    .dark-mode .user-info-container,
    .dark-mode .peer-id-container,
    .dark-mode .contact-form,
    .dark-mode .connected-peers,
    .dark-mode .chat-messages-container,
    .dark-mode .conversations-list,
    .dark-mode .audio-call-container,
    .dark-mode .video-container {
      background-color: #1e1e1e;
      color: #e0e0e0;
    }
    .dark-mode .message-bubble.received {
      background-color: #2e2e2e;
      color: #e0e0e0;
    }
    .dark-mode .message-input {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
    }
    .dark-mode .emoji-panel {
      background-color: #2a2a2a;
      border-color: #444;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>

  <script type="text/babel">
    console.log("Script started loading");

    const { useState, useEffect, useRef, useMemo } = React;

    // ─── ErrorBoundary ───────────────────────────────────────────────────────────
    class ErrorBoundary extends React.Component {
      state = { error: null };
      static getDerivedStateFromError(error) {
        console.error("ErrorBoundary caught error:", error);
        return { error };
      }
      render() {
        if (this.state.error) {
          return (
            <div className="error-message">
              <h1>Erro na aplicação</h1>
              <p>{this.state.error.message}</p>
              <p>Verifique o console do navegador para mais detalhes.</p>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ─── Constantes ──────────────────────────────────────────────────────────────
    const PEER_ID_STORAGE_KEY = 'p2pChatClientId';
    const MESSAGES_STORAGE_KEY = 'p2pChatMessages';

    // ─── Hook: ID persistente ─────────────────────────────────────────────────────
    const usePersistentId = () => {
      const [peerId, setPeerId] = useState('');

      // FIX Bug 2 (prevenção): generateId definido aqui e reutilizado abaixo.
      // generateNewId (idêntico) também é definido no corpo do App para garantir
      // que o handler de erro do PeerJS sempre encontre a função.
      const generateId = () => {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const buffer = new Uint8Array(9);
        crypto.getRandomValues(buffer);
        return Array.from(buffer).map(b => chars[b % chars.length]).join('');
      };

      useEffect(() => {
        const loadOrGenerateId = () => {
          const savedId = localStorage.getItem(PEER_ID_STORAGE_KEY);
          if (savedId) {
            setPeerId(savedId);
          } else {
            const newId = generateId();
            localStorage.setItem(PEER_ID_STORAGE_KEY, newId);
            setPeerId(newId);
          }
        };
        loadOrGenerateId();
      }, []);

      return [peerId, setPeerId];
    };

    // ─── VoiceRecorder ───────────────────────────────────────────────────────────
    const VoiceRecorder = ({ onRecordingComplete, disabled, selectedContact }) => {
      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          mediaRecorderRef.current.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunksRef.current.push(event.data);
          };
          mediaRecorderRef.current.onstop = () => {
            if (audioChunksRef.current.length === 0) return;
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            onRecordingComplete(audioBlob, selectedContact);
            audioChunksRef.current = [];
            stream.getTracks().forEach(track => track.stop());
          };
          audioChunksRef.current = [];
          mediaRecorderRef.current.start(200);
          setIsRecording(true);
        } catch (err) {
          alert('Erro ao acessar o microfone: ' + err.message);
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          try { mediaRecorderRef.current.stop(); } catch (err) {}
          setIsRecording(false);
        }
      };

      return (
        <button
          className={`voice-button ${isRecording ? 'recording' : ''}`}
          onClick={() => isRecording ? stopRecording() : startRecording()}
          disabled={disabled}
          title="Gravar áudio"
        >
          <i className="fas fa-microphone button-icon"></i>
        </button>
      );
    };

    // ─── ContactsScreen ──────────────────────────────────────────────────────────
    const ContactsScreen = ({ contacts, setContacts, onBack, onSelectContact }) => {
      const [newName, setNewName] = useState('');
      const [newPeerId, setNewPeerId] = useState('');
      const [nameError, setNameError] = useState('');
      const [idError, setIdError] = useState('');

      const handleAddContact = (e) => {
        e.preventDefault();
        let valid = true;
        if (!newName.trim()) { setNameError('Nome é obrigatório'); valid = false; } else setNameError('');
        if (!newPeerId.trim()) { setIdError('ID é obrigatório'); valid = false; } else setIdError('');
        if (!valid) return;
        setContacts(prev => {
          const updated = [...prev, { name: newName, peerId: newPeerId }];
          localStorage.setItem('p2pContacts', JSON.stringify(updated));
          return updated;
        });
        setNewName(''); setNewPeerId('');
      };

      const handleRemoveContact = (peerId, e) => {
        e.stopPropagation();
        setContacts(prev => {
          const updated = prev.filter(c => c.peerId !== peerId);
          localStorage.setItem('p2pContacts', JSON.stringify(updated));
          return updated;
        });
      };

      return (
        <div>
          <button onClick={onBack} style={{ marginBottom: '20px' }}>← Voltar</button>
          <h2>Lista de Contatos</h2>
          <form className="contact-form" onSubmit={handleAddContact}>
            <div className="contact-form-row">
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <input type="text" placeholder="Nome do contato" value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  style={{ borderColor: nameError ? 'red' : '#ddd' }} />
                {nameError && <span style={{ color: 'red', fontSize: '12px' }}>{nameError}</span>}
              </div>
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <input type="text" placeholder="ID do contato" value={newPeerId}
                  onChange={(e) => setNewPeerId(e.target.value)}
                  style={{ borderColor: idError ? 'red' : '#ddd' }} />
                {idError && <span style={{ color: 'red', fontSize: '12px' }}>{idError}</span>}
              </div>
              <button type="submit">Adicionar</button>
            </div>
          </form>
          <div className="connected-peers contacts-list">
            {contacts.length === 0 ? (
              <p>Nenhum contato adicionado ainda.</p>
            ) : (
              contacts.map((contact, i) => (
                <div key={i} className="peer-item" onClick={() => onSelectContact(contact.peerId)}>
                  <span style={{ flex: 1 }}>{contact.name} - {contact.peerId}</span>
                  <button onClick={(e) => handleRemoveContact(contact.peerId, e)} style={{ marginLeft: '10px' }}>🗑️</button>
                </div>
              ))
            )}
          </div>
        </div>
      );
    };

    // ─── UpdatedChatManager ──────────────────────────────────────────────────────
    const UpdatedChatManager = ({
      connections, messages, setMessages, contacts, userName, peerId,
      activeCalls, endCall, startVoiceCall, toggleVideoCall, remoteStreams,
      audioRefs, videoRefs, handleFileChange, fileInputRef, handleAudioRecording,
      newMessage, setNewMessage, showEmojiPanel, setShowEmojiPanel, populateEmojiPanel,
      getContactName, selectedContact, setSelectedContact, localVideoRef,
      registerSentMessage, cooldownRemaining, setCooldownRemaining, networkSize, centralServerId
    }) => {
      const messagesEndRef = useRef(null);

      const formatTime = (date) => {
        const h = date.getHours().toString().padStart(2, '0');
        const m = date.getMinutes().toString().padStart(2, '0');
        const s = date.getSeconds().toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
      };

      const filteredMessages = useMemo(() => {
        if (!selectedContact) return [];
        return messages.filter(msg =>
          (msg.sender === selectedContact && msg.recipient === 'you') ||
          (msg.sender === 'you' && msg.recipient === selectedContact)
        );
      }, [messages, selectedContact]);

      const sendDirectMessage = () => {
        if (!userName.trim()) { alert('Por favor, defina seu nome antes de enviar mensagens'); return; }
        if (!newMessage.trim() || !selectedContact || cooldownRemaining > 0) return;
        const conn = connections.find(c => c.peer === selectedContact);
        if (!conn) { alert(`Contato ${getContactName(selectedContact)} não está conectado.`); return; }

        const currentCooldown = Math.max(1, Math.floor(networkSize / 1000));
        setCooldownRemaining(currentCooldown);

        try {
          const timestamp = new Date();
          const msgId = Date.now() + Math.random().toString(36).substring(7);
          if (registerSentMessage) registerSentMessage(msgId);

          conn.send({
            type: 'message',
            id: msgId,
            ttl: 8,
            text: newMessage,
            senderName: userName,
            direct: true,
            time: formatTime(timestamp)
          });

          setMessages(prev => {
            const updated = [...prev, {
              text: newMessage, sender: 'you', recipient: selectedContact,
              senderName: userName, time: formatTime(timestamp), type: 'text',
              direct: true, timestamp: timestamp.getTime()
            }];
            localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
            return updated;
          });
          setNewMessage('');
        } catch (err) {
          alert(`Erro ao enviar mensagem: ${err.message}`);
        }
      };

      const deleteMessage = (messageTimestamp) => {
        setMessages(prev => {
          const updated = prev.filter(msg => msg.timestamp !== messageTimestamp);
          localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      const deleteMessagesByContact = (cPeerId) => {
        setMessages(prev => {
          const updated = prev.filter(msg =>
            !((msg.sender === cPeerId && msg.recipient === 'you') ||
              (msg.sender === 'you' && msg.recipient === cPeerId))
          );
          localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      useEffect(() => {
        if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
      }, [filteredMessages]);

      useEffect(() => {
        remoteStreams.forEach(({ peerId: rPeerId, stream, type }) => {
          if (type === 'voice') {
            const audioEl = audioRefs.current[rPeerId];
            if (audioEl && audioEl.srcObject !== stream) {
              audioEl.srcObject = stream;
              audioEl.play().catch(e => console.warn("Audio play failed:", e));
            }
          } else if (type === 'video') {
            const videoEl = videoRefs.current[rPeerId];
            if (videoEl && videoEl.srcObject !== stream) {
              videoEl.srcObject = stream;
              videoEl.play().catch(e => console.warn("Video play failed:", e));
            }
          }
        });
        return () => {
          Object.values(audioRefs.current).forEach(a => { if (a) a.srcObject = null; });
          Object.values(videoRefs.current).forEach(v => { if (v) v.srcObject = null; });
        };
      }, [remoteStreams]);

      return (
        <div>
          <div className="chat-main-container">
            <div className="conversations-list">
              <h4 style={{ padding: '10px', margin: '0', borderBottom: '1px solid #eee' }}>Conversas</h4>
              {connections.map((conn, i) => {
                const isSelected = selectedContact === conn.peer;
                const hasVoiceCall = activeCalls.some(c => c.peerId === conn.peer && c.type === 'voice');
                return (
                  <div key={i}
                    className={`conversation-item ${isSelected ? 'selected' : 'unselected'} ${conn.peer === centralServerId ? 'central-server' : ''}`}
                    onClick={() => setSelectedContact(conn.peer)}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <div>
                        <div className="conversation-name">{getContactName(conn.peer)}</div>
                        <div className="conversation-peer-id">{conn.peer}</div>
                      </div>
                      <div className="green-delete-icon"
                        onClick={(e) => { e.stopPropagation(); deleteMessagesByContact(conn.peer); }}
                        title="Apagar todas as mensagens deste contato">
                        <i className="fas fa-trash"></i>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: '5px', marginTop: '5px' }}>
                      {hasVoiceCall ? (
                        <button onClick={(e) => { e.stopPropagation(); endCall(conn.peer, 'voice'); }}
                          style={{ padding: '4px', background: '#ff5722', width: '30px', height: '30px', borderRadius: '50%' }}
                          title="Encerrar chamada de voz">
                          <i className="fas fa-phone-slash"></i>
                        </button>
                      ) : (
                        <button onClick={(e) => { e.stopPropagation(); startVoiceCall(conn.peer); }}
                          style={{ padding: '4px', background: '#4CAF50', width: '30px', height: '30px', borderRadius: '50%' }}
                          title="Iniciar chamada de voz">
                          <i className="fas fa-phone"></i>
                        </button>
                      )}
                      <button onClick={(e) => { e.stopPropagation(); toggleVideoCall(conn.peer); }}
                        style={{
                          padding: '4px',
                          background: activeCalls.some(c => c.peerId === conn.peer && c.type === 'video' && c.localStream) ? '#ff5722' : '#4CAF50',
                          width: '30px', height: '30px', borderRadius: '50%'
                        }}
                        title={activeCalls.some(c => c.peerId === conn.peer && c.type === 'video' && c.localStream) ? "Desligar Câmera" : "Ligar Câmera"}>
                        <i className={`fas ${activeCalls.some(c => c.peerId === conn.peer && c.type === 'video' && c.localStream) ? 'fa-video-slash' : 'fa-video'}`}></i>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="chat-messages-container">
              <div className="chat-messages">
                {filteredMessages.map((msg, i) => (
                  <div key={msg.timestamp || i} className={`message-bubble ${msg.sender === 'you' ? 'sent' : 'received'}`}>
                    <div className="chat-user-bubble">
                      {msg.sender === 'you' ? userName : getContactName(msg.sender)}
                    </div>
                    {msg.type === 'text' ? (
                      <div>{msg.text}</div>
                    ) : msg.type === 'file' ? (
                      <div>
                        {msg.fileData
                          ? <a href={msg.fileData} download={msg.fileName} className="file-link">{msg.fileName}</a>
                          : <span>{msg.fileName}</span>}
                        {(msg.receiving || msg.sending) && (
                          <div className="progress-container">
                            <div className="progress-bar">
                              <div className="progress" style={{ width: `${msg.progress}%` }} />
                            </div>
                          </div>
                        )}
                      </div>
                    ) : msg.type === 'audio' && (
                      <div>
                        {msg.audioData
                          ? <audio controls src={msg.audioData} className="audio-player" />
                          : <span>Áudio</span>}
                        {(msg.receiving || msg.sending) && (
                          <div className="progress-container">
                            <div className="progress-bar">
                              <div className="progress" style={{ width: `${msg.progress}%` }} />
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                    <div className="message-timestamp">{msg.time}</div>
                    {msg.sender !== 'you' && !selectedContact && (
                      <button className="reply-private-button" onClick={() => setSelectedContact(msg.sender)}>
                        Responder em privado <i className="fas fa-reply"></i>
                      </button>
                    )}
                    <div className="green-delete-icon" onClick={() => deleteMessage(msg.timestamp)} title="Remover mensagem">
                      <i className="fas fa-trash"></i>
                    </div>
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>
              <div className="chat-input-container">
                <VoiceRecorder
                  onRecordingComplete={handleAudioRecording}
                  disabled={!selectedContact || !connections.some(c => c.peer === selectedContact)}
                  selectedContact={selectedContact}
                />
                <button onClick={() => fileInputRef.current.click()}
                  disabled={!selectedContact || !connections.some(c => c.peer === selectedContact)}
                  title="Enviar arquivo">
                  <i className="fas fa-paperclip"></i>
                </button>
                <div className="message-input-container">
                  <button className="emoji-button" onClick={() => setShowEmojiPanel(!showEmojiPanel)} title="Emojis">😊</button>
                  <input type="text" value={newMessage}
                    onChange={(e) => setNewMessage(e.target.value)}
                    placeholder={
                      cooldownRemaining > 0
                        ? `Aguarde ${cooldownRemaining}s (Modo Lento: ${networkSize} usuários)`
                        : selectedContact ? `Mensagem para ${getContactName(selectedContact)}...` : "Selecione um contato..."
                    }
                    onKeyPress={(e) => {
                      if (e.key === 'Enter' && selectedContact && cooldownRemaining === 0) sendDirectMessage();
                    }}
                    className="message-input"
                    disabled={!selectedContact || cooldownRemaining > 0}
                  />
                  {showEmojiPanel && populateEmojiPanel()}
                </div>
                <button
                  onClick={sendDirectMessage}
                  disabled={!newMessage.trim() || !selectedContact || !connections.some(c => c.peer === selectedContact) || cooldownRemaining > 0}
                  title="Enviar mensagem">
                  {cooldownRemaining > 0 ? `${cooldownRemaining}s` : <i className="fas fa-paper-plane"></i>}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ─── App ─────────────────────────────────────────────────────────────────────
    const App = () => {
      // Dark mode
      useEffect(() => {
        if (localStorage.getItem('modo') === 'dark') {
          document.body.classList.add('dark-mode');
          const btn = document.getElementById('darkModeBtn');
          if (btn) btn.textContent = '☀️';
        }
      }, []);

      const toggleDarkMode = () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('modo', isDark ? 'dark' : 'light');
        const btn = document.getElementById('darkModeBtn');
        if (btn) btn.textContent = isDark ? '☀️' : '🌙';
      };

      const [peerId, setPeerId] = usePersistentId();
      const [userName, setUserName] = useState(() => localStorage.getItem('p2pUserName') || '');
      const [editingName, setEditingName] = useState(!localStorage.getItem('p2pUserName'));
      const [connections, setConnections] = useState([]);
      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem(MESSAGES_STORAGE_KEY);
        try {
          const parsed = saved ? JSON.parse(saved) : [];
          return parsed.map((msg, i) => ({ ...msg, timestamp: msg.timestamp || Date.now() + i }));
        } catch { localStorage.removeItem(MESSAGES_STORAGE_KEY); return []; }
      });
      const [newMessage, setNewMessage] = useState('');
      const [showContacts, setShowContacts] = useState(false);
      const [contacts, setContacts] = useState(() => {
        try { return JSON.parse(localStorage.getItem('p2pContacts') || '[]'); } catch { return []; }
      });
      const [activeCalls, setActiveCalls] = useState([]);
      const [remoteStreams, setRemoteStreams] = useState([]);
      const [error, setError] = useState(null);
      const [isLocalVideoVisible, setIsLocalVideoVisible] = useState(false);
      const [showEmojiPanel, setShowEmojiPanel] = useState(false);
      const [selectedContact, setSelectedContact] = useState(null);
      const [isPeerInitialized, setIsPeerInitialized] = useState(false);
      const [centralServerId, setCentralServerId] = useState(null);
      const [cooldownRemaining, setCooldownRemaining] = useState(0);
      const [networkSize, setNetworkSize] = useState(1);
      const [isSuperNode, setIsSuperNode] = useState(false);
      const [radioState, setRadioState] = useState({ status: 'idle', startTime: 0, duration: 0, audioUrl: null, fileName: '', sender: '' });

      const peerInstance = useRef(null);
      const fileInputRef = useRef(null);
      const pendingFiles = useRef({});
      const audioRefs = useRef({});
      const videoRefs = useRef({});
      const localVideoRef = useRef(null);
      const localStreamsRef = useRef(new Map());
      const seenMessagesRef = useRef(new Set());
      const radioStateRef = useRef(radioState);
      const radioAudioRef = useRef(null);
      const pendingRadioFiles = useRef({});
      const radioIntervalRef = useRef(null);
      const knownUsersRef = useRef(new Set());
      const lastMessageTimeRef = useRef(new Map());
      const bannedPeersRef = useRef(new Set());

      // FIX Bug 5: refs que mantêm sempre o valor atual para closures estáticas (PeerJS)
      const connectionsRef = useRef([]);
      const isSuperNodeRef = useRef(false);

      useEffect(() => { connectionsRef.current = connections; }, [connections]);
      useEffect(() => { isSuperNodeRef.current = isSuperNode; }, [isSuperNode]);
      useEffect(() => { radioStateRef.current = radioState; }, [radioState]);

      const CHUNK_SIZE = 16 * 1024;

      // FIX Bug 2: generateNewId definido aqui (no topo do App) antes de qualquer useEffect
      const generateNewId = () => {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const buffer = new Uint8Array(9);
        crypto.getRandomValues(buffer);
        return Array.from(buffer).map(b => chars[b % chars.length]).join('');
      };

      const isCentralServer = (id) => id && id.endsWith('-CENTRAL');
      const getContactName = (pId) => contacts.find(c => c.peerId === pId)?.name || pId;
      const formatTime = (date) => date.toLocaleTimeString('pt-BR');
      const saveUserName = () => {
        if (userName.trim()) { localStorage.setItem('p2pUserName', userName); setEditingName(false); }
      };

      // ── sendRadioSync / sendHandshake ──────────────────────────────────────────
      const sendRadioSync = (conn) => {
        if (radioStateRef.current.status !== 'idle') {
          const syncMsg = {
            type: 'radio-sync',
            startTime: radioStateRef.current.startTime,
            duration: radioStateRef.current.duration,
            fileName: radioStateRef.current.fileName,
            senderName: radioStateRef.current.sender
          };
          const fallbackMsg = {
            type: 'message', text: '#$%',
            senderName: radioStateRef.current.sender,
            id: 'radio_block_' + Date.now() + Math.random()
          };
          const send = () => {
            try { conn.send(syncMsg); conn.send(fallbackMsg); } catch (e) {}
          };
          send();
          setTimeout(send, 1000);
          setTimeout(send, 2000);
        }
      };

      // FIX Bug 1: Desktop NUNCA é servidor — isServer sempre false.
      // Removida a referência a pureServerMode (variável não definida no Desktop).
      const sendHandshake = (conn) => {
        const handshake = {
          type: 'handshake',
          radio: {
            status: radioStateRef.current.status,
            startTime: radioStateRef.current.startTime,
            duration: radioStateRef.current.duration,
            fileName: radioStateRef.current.fileName,
            senderName: radioStateRef.current.sender
          },
          isServer: false,   // ← FIX: era "pureServerMode" (ReferenceError)
          peerId: peerId
        };
        try { conn.send(handshake); } catch (e) { console.error("Erro no handshake", e); }
      };

      // Cooldown timer
      useEffect(() => {
        if (cooldownRemaining > 0) {
          const timer = setTimeout(() => setCooldownRemaining(prev => prev - 1), 1000);
          return () => clearTimeout(timer);
        }
      }, [cooldownRemaining]);

      // ── stopAndRemoveLocalStream ───────────────────────────────────────────────
      // Recebe a chave completa (ex: "abc123_video") para buscar no mapa.
      const stopAndRemoveLocalStream = (key) => {
        const stream = localStreamsRef.current.get(key);
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          localStreamsRef.current.delete(key);
          if (localStreamsRef.current.size === 0) {
            setIsLocalVideoVisible(false);
            if (localVideoRef.current) localVideoRef.current.srcObject = null;
          } else {
            const firstActiveStream = localStreamsRef.current.values().next().value;
            if (localVideoRef.current && firstActiveStream) localVideoRef.current.srcObject = firstActiveStream;
          }
        }
      };

      // ── PeerJS init ───────────────────────────────────────────────────────────
      useEffect(() => {
        if (!peerId) return;
        console.log("App: Initializing PeerJS with ID:", peerId);

        // FIX Design: apenas os 5 servidores STUN reais do Google.
        // Os 80+ servidores anteriores (gmail.google.com, youtube.google.com, etc.)
        // não existem e causavam segundos de latência no ICE gathering.
        const peer = new Peer(peerId, {
          host: '0.peerjs.com',
          port: 443,
          secure: true,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' },
              { urls: 'stun:stun3.l.google.com:19302' },
              { urls: 'stun:stun4.l.google.com:19302' }
            ],
            sdpSemantics: 'unified-plan',
            iceTransportPolicy: 'all',
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require',
            iceCandidatePoolSize: 10
          },
          debug: 2
        });

        peer.on('open', (id) => {
          console.log("PeerJS: Connected with ID:", id);
          setIsPeerInitialized(true);

          const urlParams = new URLSearchParams(window.location.search);
          const portasStr = urlParams.get('portas');
          if (portasStr) {
            const portas = portasStr.split(',');
            const centralIdFromList = portas.find(isCentralServer);
            if (centralIdFromList) {
              setCentralServerId(centralIdFromList);
              setSelectedContact(centralIdFromList);
            } else {
              const serverId = portas[0];
              setCentralServerId(serverId);
              setSelectedContact(serverId);
            }

            setTimeout(() => {
              portas.forEach(porta => {
                if (porta && porta !== id) {
                  const conn = peer.connect(porta, { reliable: true });
                  if (conn) {
                    conn.on('open', () => {
                      setConnections(prev => [...prev.filter(c => c.peer !== porta), conn]);
                      sendRadioSync(conn);
                      try { conn.send({ type: 'radio-request-sync' }); } catch (e) {}
                      try { conn.send({ type: 'server-request-info' }); } catch (e) {}
                    });
                    conn.on('data', (data) => handleIncomingData(data, porta));
                    conn.on('close', () => setConnections(prev => prev.filter(c => c.peer !== porta)));
                    conn.on('error', () => setConnections(prev => prev.filter(c => c.peer !== porta)));
                  }
                }
              });
            }, 1000);
          }
        });

        peer.on('error', (err) => {
          console.error("PeerJS: Error:", err);
          if (err.type === 'unavailable-id') {
            // FIX Bug 2: generateNewId está definido acima (sem ReferenceError)
            const newId = generateNewId();
            localStorage.setItem(PEER_ID_STORAGE_KEY, newId);
            window.location.reload();
          } else if (err.type === 'peer-unavailable') {
            console.log("PeerJS: Peer unavailable");
          } else {
            setError(`Erro PeerJS: ${err.type}`);
          }
        });

        peer.on('connection', (conn) => {
          console.log("PeerJS: Incoming connection from:", conn.peer);

          if (bannedPeersRef.current.has(conn.peer)) {
            setTimeout(() => conn.close(), 500);
            return;
          }

          // FIX Bug 5: usa refs atualizados em vez de closure estática
          const maxConns = isSuperNodeRef.current ? 50 : 15;
          if (connectionsRef.current.length >= maxConns) {
            console.log("App: Limite de conexões atingido. Rejeitando:", conn.peer);
            setTimeout(() => conn.close(), 500);
            return;
          }

          if (connectionsRef.current.some(c => c.peer === conn.peer)) {
            setConnections(prev => prev.map(c => c.peer === conn.peer ? conn : c));
            return;
          }

          conn.on('open', () => {
            setConnections(prev => [...prev.filter(c => c.peer !== conn.peer), conn]);
            sendHandshake(conn);
          });
          conn.on('data', (data) => handleIncomingData(data, conn.peer));
          conn.on('close', () => {
            setConnections(prev => prev.filter(c => c.peer !== conn.peer));
            endCall(conn.peer, 'video');
            endCall(conn.peer, 'voice');
          });
          conn.on('error', () => {
            setConnections(prev => prev.filter(c => c.peer !== conn.peer));
            endCall(conn.peer, 'video');
            endCall(conn.peer, 'voice');
          });
        });

        peer.on('call', async (call) => {
          const callType = call.metadata?.type || 'video';
          try {
            call.answer(null);
            setActiveCalls(prev => [
              ...prev.filter(c => !(c.peerId === call.peer && c.type === callType)),
              { peerId: call.peer, call, localStream: null, type: callType, direction: 'incoming', isTemporaryStream: false }
            ]);
            call.on('stream', (remoteStream) => {
              setRemoteStreams(prev => [
                ...prev.filter(s => !(s.peerId === call.peer && s.type === callType)),
                { peerId: call.peer, stream: remoteStream, type: callType }
              ]);
            });
            call.on('close', () => endCall(call.peer, callType));
            call.on('error', () => endCall(call.peer, callType));
          } catch (err) {
            call.close();
            alert('Erro ao acessar câmera/microfone: ' + err.message);
          }
        });

        peerInstance.current = peer;

        return () => {
          if (peerInstance.current) { peerInstance.current.destroy(); peerInstance.current = null; }
          localStreamsRef.current.forEach((stream) => stream.getTracks().forEach(t => t.stop()));
          localStreamsRef.current.clear();
          setActiveCalls([]); setRemoteStreams([]);
          setIsLocalVideoVisible(false);
          if (localVideoRef.current) localVideoRef.current.srcObject = null;
          setIsPeerInitialized(false);
        };
      }, [peerId]);

      // PEX interval
      useEffect(() => {
        const pexInterval = setInterval(() => {
          if (connections.length > 0) {
            const allKnownPeers = Array.from(new Set([
              ...connections.map(c => c.peer),
              ...Array.from(knownUsersRef.current)
            ]));
            connections.forEach(conn => {
              if (conn.open) {
                try {
                  const subset = [...allKnownPeers].sort(() => 0.5 - Math.random()).slice(0, isSuperNode ? 100 : 50);
                  conn.send({ type: 'pex', peers: subset });
                } catch (e) {}
              }
            });
          }
        }, 30000);
        return () => clearInterval(pexInterval);
      }, [connections]);

      // ── connectToPeer ─────────────────────────────────────────────────────────
      const connectToPeer = (peerIdToConnect) => {
        if (!peerIdToConnect || !peerInstance.current || !isPeerInitialized) return;
        if (bannedPeersRef.current.has(peerIdToConnect)) return;
        if (connections.some(conn => conn.peer === peerIdToConnect && conn.open)) return;

        try {
          const conn = peerInstance.current.connect(peerIdToConnect, { reliable: true });
          if (!conn) throw new Error("Não foi possível criar a conexão");

          conn.on('open', () => {
            setConnections(prev => [...prev.filter(c => c.peer !== peerIdToConnect), conn]);
            sendHandshake(conn);
          });
          conn.on('error', (err) => {
            setConnections(prev => prev.filter(c => c.peer !== peerIdToConnect));
            alert(`Erro ao conectar com ${getContactName(peerIdToConnect)}: ${err.message || 'Contato offline ou ID inválido'}`);
          });
          conn.on('close', () => setConnections(prev => prev.filter(c => c.peer !== peerIdToConnect)));
          conn.on('data', (data) => handleIncomingData(data, peerIdToConnect));
        } catch (err) {
          alert(`Erro ao conectar com ${getContactName(peerIdToConnect)}: ${err.message || 'Contato offline ou ID inválido'}`);
        }
      };

      // ── handleIncomingData ────────────────────────────────────────────────────
      const handleIncomingData = (data, pId) => {
        if (data.type === 'handshake') {
          if (data.radio && data.radio.status === 'playing') {
            radioStateRef.current = {
              status: 'playing',
              startTime: data.radio.startTime,
              duration: data.radio.duration,
              fileName: data.radio.fileName,
              sender: data.radio.senderName
            };
          }
          if (data.isServer || isCentralServer(pId)) {
            if (isCentralServer(pId)) {
              setCentralServerId(pId);
            } else if (!centralServerId || pId === centralServerId) {
              setCentralServerId(pId);
            }
          }
          // FIX Bug 1: bloco "if (pureServerMode)" removido —
          // Desktop nunca é servidor e activeConnectionsRef não existe aqui.
          return;
        }

        if (data.type === 'pex' && Array.isArray(data.peers)) {
          const maxConnections = isSuperNode ? 50 : 15;
          if (peerInstance.current) {
            const activeConnCount = Object.keys(peerInstance.current.connections).length;
            if (activeConnCount < maxConnections) {
              data.peers.forEach(newPeerId => {
                if (newPeerId !== peerId && !peerInstance.current.connections[newPeerId] && !bannedPeersRef.current.has(newPeerId)) {
                  connectToPeer(newPeerId);
                }
              });
            }
          }
          return;
        }

        if (data.type === 'radio-request-sync') {
          setConnections(currentConns => {
            const conn = currentConns.find(c => c.peer === pId);
            if (conn) sendRadioSync(conn);
            return currentConns;
          });
          return;
        }

        if (data.type === 'radio-sync') {
          const now = Date.now();
          const endTime = data.startTime + data.duration * 1000;
          if (now < endTime) {
            setRadioState(prev => {
              if (prev.status === 'idle') {
                const newStatus = now >= data.startTime ? 'playing' : 'buffering';
                return { status: newStatus, startTime: data.startTime, duration: data.duration, audioUrl: null, fileName: data.fileName, sender: data.senderName };
              }
              return prev;
            });
          }
          return;
        }

        if (data.type === 'radio-start' || data.type === 'radio-chunk') {
          // Deduplicação via seenMessages (para radio-start)
          if (data.id && seenMessagesRef.current.has(data.id)) return;

          if (data.type === 'radio-start' && radioStateRef.current.status !== 'idle') return;
          if (data.type === 'radio-chunk' && radioStateRef.current.status === 'idle' && !pendingRadioFiles.current[data.radioId]) return;

          if (data.id) {
            seenMessagesRef.current.add(data.id);
            if (seenMessagesRef.current.size > 5000) {
              seenMessagesRef.current.delete(seenMessagesRef.current.values().next().value);
            }
          }

          let currentTtl = data.ttl !== undefined ? data.ttl : 8;
          if (currentTtl > 0) {
            const relayData = { ...data, ttl: currentTtl - 1 };
            setConnections(currentConns => {
              currentConns.forEach(conn => {
                if (conn.peer !== pId && conn.open) { try { conn.send(relayData); } catch (e) {} }
              });
              return currentConns;
            });
          }

          if (data.type === 'radio-start') {
            pendingRadioFiles.current[data.radioId] = {
              chunks: new Uint8Array(data.fileSize),
              receivedBytes: 0,
              totalSize: data.fileSize,
              receivedOffsets: new Set()  // FIX Bug 9: rastreia offsets recebidos para evitar dupla contagem
            };
            setRadioState({ status: 'buffering', startTime: data.startTime, duration: data.duration, audioUrl: null, fileName: data.fileName, sender: data.senderName });
          } else if (data.type === 'radio-chunk') {
            const fileData = pendingRadioFiles.current[data.radioId];
            if (fileData) {
              // FIX Bug 9: ignora chunk duplicado para não somar receivedBytes duas vezes
              if (fileData.receivedOffsets.has(data.offset)) return;
              fileData.receivedOffsets.add(data.offset);

              const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
              fileData.chunks.set(chunk, data.offset);
              fileData.receivedBytes += chunk.length;

              if (fileData.receivedBytes === fileData.totalSize) {
                const blob = new Blob([fileData.chunks], { type: 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                setRadioState(prev => ({ ...prev, audioUrl: url }));
                delete pendingRadioFiles.current[data.radioId];
              }
            }
          }
          return;
        }

        if (data.type === 'message' && data.id) {
          // FIX Bug 4: anti-cheat usa pId (peerId da conexão direta) em vez de data.sender
          // (data.sender nunca existe nas mensagens; só data.senderName existe).
          


const now = Date.now();
          if (!knownUsersRef.current.has(pId)) {
            knownUsersRef.current.add(pId);
            setNetworkSize(knownUsersRef.current.size);
          }

          // NOVA REGRA: O Servidor Central é isento de banimento por velocidade (Anti-Auto-Ban)
          if (pId !== centralServerId) {
            const lastTime = lastMessageTimeRef.current.get(pId) || 0;
            // Cálculo dinâmico de cooldown baseado no tamanho da rede
            const requiredCooldownMs = Math.max(1, Math.floor(knownUsersRef.current.size / 1000)) * 1000;

            if (now - lastTime < requiredCooldownMs) {
              console.log(`App: Mensagem de ${pId} ignorada por cooldown. Iniciando banimento.`);
              bannedPeersRef.current.add(pId);
              setConnections(currentConns => {
                const connToClose = currentConns.find(c => c.peer === pId);
                if (connToClose) { connToClose.close(); }
                return currentConns.filter(c => c.peer !== pId);
              });
              return;
            }
            lastMessageTimeRef.current.set(pId, now);
          }

        if (seenMessagesRef.current.has(data.id)) return;

          let currentTtl = data.ttl !== undefined ? data.ttl : 8;
          if (currentTtl > 0) {
            const relayData = { ...data, ttl: currentTtl - 1 };
            setConnections(currentConns => {
              currentConns.forEach(conn => {
                if (conn.peer !== pId && conn.open) { try { conn.send(relayData); } catch (e) {} }
              });
              return currentConns;
            });
          }
        }

        const timestamp = data.timestamp || Date.now();
        const messageTime = data.time || formatTime(new Date(timestamp));
        const baseMessage = {
          sender: pId, senderName: data.senderName || getContactName(pId),
          time: messageTime, direct: data.direct || false, timestamp,
          recipient: data.direct ? 'you' : undefined
        };

        let messageToAdd = null;

        if (data.type === 'message') {
          if (data.text === '#$%') {
            if (radioStateRef.current.status === 'idle') {
              setRadioState({ status: 'playing', startTime: Date.now(), duration: 300, audioUrl: null, fileName: 'Rádio Global', sender: data.senderName || 'Servidor' });
            }
            return;
          }
          messageToAdd = { ...baseMessage, text: data.text, type: 'text' };
        } else if (data.type === 'file-start') {
          pendingFiles.current[data.fileId] = { fileName: data.fileName, chunks: new Uint8Array(data.fileSize), receivedBytes: 0, totalSize: data.fileSize, fileType: data.fileType };
          messageToAdd = { ...baseMessage, fileId: data.fileId, fileName: data.fileName, type: 'file', receiving: true, progress: 0 };
        } else if (data.type === 'file-chunk') {
          const fileData = pendingFiles.current[data.fileId];
          if (fileData) {
            const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
            fileData.chunks.set(chunk, data.offset);
            fileData.receivedBytes += chunk.length;
            const progress = Math.min(100, Math.floor((fileData.receivedBytes / fileData.totalSize) * 100));
            setMessages(prev => prev.map(msg => msg.fileId === data.fileId ? { ...msg, progress } : msg));
            if (fileData.receivedBytes === fileData.totalSize) {
              const blob = new Blob([fileData.chunks], { type: fileData.fileType || 'application/octet-stream' });
              const url = URL.createObjectURL(blob);
              setMessages(prev => prev.map(msg => msg.fileId === data.fileId ? { ...msg, fileData: url, receiving: false, progress: 100 } : msg));
              delete pendingFiles.current[data.fileId];
            }
          }
          return;
        } else if (data.type === 'audio-start') {
          pendingFiles.current[data.audioId] = { chunks: new Uint8Array(data.audioSize), receivedBytes: 0, totalSize: data.audioSize };
          messageToAdd = { ...baseMessage, audioId: data.audioId, type: 'audio', receiving: true, progress: 0 };
        } else if (data.type === 'audio-chunk') {
          const audioData = pendingFiles.current[data.audioId];
          if (audioData) {
            const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
            audioData.chunks.set(chunk, data.offset);
            audioData.receivedBytes += chunk.length;
            const progress = Math.min(100, Math.floor((audioData.receivedBytes / audioData.totalSize) * 100));
            setMessages(prev => prev.map(msg => msg.audioId === data.audioId ? { ...msg, progress } : msg));
            if (audioData.receivedBytes === audioData.totalSize) {
              const blob = new Blob([audioData.chunks], { type: 'audio/webm' });
              const url = URL.createObjectURL(blob);
              setMessages(prev => prev.map(msg => msg.audioId === data.audioId ? { ...msg, audioData: url, receiving: false, progress: 100 } : msg));
              delete pendingFiles.current[data.audioId];
            }
          }
          return;
        }

        if (messageToAdd) {
          setMessages(prev => {
            const updated = [...prev, messageToAdd];
            if (messageToAdd.type === 'text' || messageToAdd.receiving) {
              localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
            }
            return updated;
          });
        }
      };

      // ── sendChunkedData ───────────────────────────────────────────────────────
      const sendChunkedData = (conn, idKey, dataBlob, typePrefix, metaData) => {
        const id = peerId + `_${typePrefix}_` + Date.now();
        const reader = new FileReader();
        let offset = 0;
        const timestamp = new Date();
        const formattedTime = formatTime(timestamp);
        const isFile = typePrefix === 'file';
        const localUrl = URL.createObjectURL(dataBlob);

        setMessages(prev => {
          const updated = [...prev, {
            ...metaData, [idKey]: id, sender: 'you', recipient: conn.peer,
            senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio',
            sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(),
            [isFile ? 'fileData' : 'audioData']: localUrl
          }];
          localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
          return updated;
        });

        try {
          conn.send({
            type: `${typePrefix}-start`,
            [idKey]: id,
            [isFile ? 'fileSize' : 'audioSize']: dataBlob.size,
            senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(),
            ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type })
          });
        } catch (err) {
          alert(`Erro ao iniciar envio: ${err.message}`);
          setMessages(prev => prev.filter(msg => msg[idKey] !== id));
          return;
        }

        const readChunk = () => {
          const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE);
          reader.readAsArrayBuffer(chunk);
        };

        reader.onload = (ev) => {
          if (!conn || !conn.open) {
            alert(`Conexão perdida com ${getContactName(conn.peer)} durante o envio.`);
            setMessages(prev => prev.map(msg => msg[idKey] === id ? { ...msg, sending: false, progress: -1 } : msg));
            return;
          }
          const chunkBuffer = ev.target.result;
          try {
            conn.send({ type: `${typePrefix}-chunk`, [idKey]: id, chunk: chunkBuffer, offset, direct: true });
            offset += chunkBuffer.byteLength;
            const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
            setMessages(prev => prev.map(msg => msg[idKey] === id ? { ...msg, progress } : msg));
            if (offset < dataBlob.size) {
  // setTimeout garante que o envio continue mesmo se a aba estiver escondida
  setTimeout(readChunk, 0); 
} else {
              setMessages(prev => {
                const updated = prev.map(msg => msg[idKey] === id ? { ...msg, sending: false, progress: 100 } : msg);
                localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
                return updated;
              });
            }
          } catch (err) {
            alert(`Erro ao enviar parte: ${err.message}`);
            setMessages(prev => prev.map(msg => msg[idKey] === id ? { ...msg, sending: false, progress: -1 } : msg));
          }
        };
        reader.onerror = () => {
          setMessages(prev => prev.map(msg => msg[idKey] === id ? { ...msg, sending: false, progress: -1 } : msg));
        };
        readChunk();
      };

      // ── Radio timer ───────────────────────────────────────────────────────────
      useEffect(() => {
        const checkRadio = () => {
          setRadioState(current => {
            if (current.status === 'idle') return current;
            const now = Date.now();
            const endTime = current.startTime + current.duration * 1000;

            if (now >= endTime) {
              if (radioAudioRef.current) { radioAudioRef.current.pause(); radioAudioRef.current.src = ''; }
              // FIX Bug 8: revoga o Object URL ao encerrar a rádio (evita vazamento de memória)
              if (current.audioUrl) URL.revokeObjectURL(current.audioUrl);
              return { status: 'idle', startTime: 0, duration: 0, audioUrl: null, fileName: '', sender: '' };
            }

            if (current.status === 'buffering') {
              if (now >= current.startTime) {
                if (current.audioUrl && radioAudioRef.current) {
                  const offset = (now - current.startTime) / 1000;
                  radioAudioRef.current.src = current.audioUrl;
                  radioAudioRef.current.currentTime = offset;
                  radioAudioRef.current.play().catch(e => console.error("Erro ao tocar rádio:", e));
                }
                return { ...current, status: 'playing' };
              } else {
                return { ...current, _tick: now };
              }
            }
            return current;
          });
        };
        radioIntervalRef.current = setInterval(checkRadio, 500);
        return () => clearInterval(radioIntervalRef.current);
      }, []);

      // ── handleRadioUpload ─────────────────────────────────────────────────────
      const handleRadioUpload = (e) => {
        if (radioStateRef.current.status !== 'idle') { alert("Já existe uma música tocando na sala!"); e.target.value = ''; return; }
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert("O arquivo MP3 deve ter no máximo 5MB."); e.target.value = ''; return; }

        const url = URL.createObjectURL(file);
        const audio = new Audio(url);
        audio.onloadedmetadata = () => {
          let duration = audio.duration;
          if (!duration || duration === Infinity) duration = 300;
          // FIX Bug 8: revoga a URL temporária usada apenas para obter a duração
          URL.revokeObjectURL(url);

          const startTime = Date.now() + 60000;
          const radioId = peerId + '_radio_' + Date.now();
          const startMsg = { type: 'radio-start', id: radioId + '_start', radioId, fileName: file.name, fileSize: file.size, duration, startTime, sender: peerId, senderName: userName, ttl: 8 };
          const fallbackMsg = { type: 'message', text: '#$%', id: radioId + '_fallback', sender: peerId, senderName: userName, ttl: 8 };

          seenMessagesRef.current.add(startMsg.id);
          seenMessagesRef.current.add(fallbackMsg.id);
          setConnections(currentConns => {
            currentConns.forEach(conn => {
              if (conn.open) { try { conn.send(startMsg); conn.send(fallbackMsg); } catch (e) {} }
            });
            return currentConns;
          });

          setRadioState({ status: 'buffering', startTime, duration, audioUrl: null, fileName: file.name, sender: userName });

          const reader = new FileReader();
          let offset = 0;
          reader.onload = (ev) => {
            const buffer = ev.target.result;
            const chunkMsg = { type: 'radio-chunk', id: radioId + '_chunk_' + offset, radioId, offset, chunk: buffer, ttl: 8 };
            seenMessagesRef.current.add(chunkMsg.id);
            setConnections(currentConns => {
              currentConns.forEach(conn => { if (conn.open) { try { conn.send(chunkMsg); } catch (e) {} } });
              return currentConns;
            });
            offset += buffer.byteLength;
            if (offset < file.size) {
              reader.readAsArrayBuffer(file.slice(offset, offset + 64 * 1024));
            } else {
              // Cria URL final apenas ao terminar de enviar os chunks
              const finalUrl = URL.createObjectURL(file);
              setRadioState(prev => ({ ...prev, audioUrl: finalUrl }));
            }
          };
          reader.readAsArrayBuffer(file.slice(0, 64 * 1024));
        };
      };

      // ── handleFileChange / handleAudioRecording ───────────────────────────────
      const handleFileChange = (e) => {
        if (!userName.trim()) { alert('Defina seu nome.'); setEditingName(true); return; }
        if (!selectedContact) { alert('Selecione um contato.'); return; }
        const file = e.target.files[0];
        if (!file) return;
        const conn = connections.find(c => c.peer === selectedContact);
        if (!conn || !conn.open) { alert(`Contato ${getContactName(selectedContact)} offline.`); return; }
        sendChunkedData(conn, 'fileId', file, 'file', { fileName: file.name });
        fileInputRef.current.value = '';
      };

      const handleAudioRecording = (audioBlob, targetContact) => {
        if (!userName.trim()) { alert('Defina seu nome.'); setEditingName(true); return; }
        if (!targetContact) { alert('Selecione um contato.'); return; }
        const conn = connections.find(c => c.peer === targetContact);
        if (!conn || !conn.open) { alert(`Contato ${getContactName(targetContact)} offline.`); return; }
        sendChunkedData(conn, 'audioId', audioBlob, 'audio', {});
      };

      // ── startVoiceCall ────────────────────────────────────────────────────────
      const startVoiceCall = async (peerIdToCall) => {
        if (!peerInstance.current || !peerIdToCall) return;
        if (activeCalls.some(c => c.peerId === peerIdToCall && c.type === 'voice')) return;
        const conn = connections.find(c => c.peer === peerIdToCall);
        if (!conn || !conn.open) { alert(`Contato ${getContactName(peerIdToCall)} offline.`); return; }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          localStreamsRef.current.set(peerIdToCall + '_voice', stream);
          const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'voice' } });
          setActiveCalls(prev => [...prev, { peerId: peerIdToCall, call, localStream: stream, type: 'voice', direction: 'outgoing', isTemporaryStream: false }]);
          call.on('stream', (remoteStream) => {
            setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'voice')), { peerId: peerIdToCall, stream: remoteStream, type: 'voice' }]);
          });
          call.on('close', () => endCall(peerIdToCall, 'voice'));
          call.on('error', (err) => { alert('Erro chamada de voz: ' + err.message); endCall(peerIdToCall, 'voice'); });
        } catch (err) {
          alert('Erro ao acessar microfone: ' + err.message);
        }
      };

      // ── toggleVideoCall ───────────────────────────────────────────────────────
      const toggleVideoCall = async (peerIdToCall) => {
        if (!peerInstance.current || !peerIdToCall) return;
        const existingCall = activeCalls.find(c => c.peerId === peerIdToCall && c.type === 'video');
        const isSendingVideo = existingCall && existingCall.localStream;
        const conn = connections.find(c => c.peer === peerIdToCall);

        if (isSendingVideo) {
          existingCall.localStream.getTracks().forEach(track => track.stop());
          localStreamsRef.current.delete(peerIdToCall + '_video');
          setActiveCalls(prev => prev.map(c => c.peerId === peerIdToCall && c.type === 'video' ? { ...c, localStream: null } : c));
          if (localStreamsRef.current.size === 0) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
        } else {
          if (!conn || !conn.open) { alert(`Contato ${getContactName(peerIdToCall)} offline.`); return; }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStreamsRef.current.set(peerIdToCall + '_video', stream);
            setIsLocalVideoVisible(true);
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;

            if (existingCall) {
              setActiveCalls(prev => prev.map(c => c.peerId === peerIdToCall && c.type === 'video' ? { ...c, localStream: stream } : c));
              peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'video' } });
            } else {
              const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'video' } });
              setActiveCalls(prev => [...prev.filter(c => !(c.peerId === peerIdToCall && c.type === 'video')), { peerId: peerIdToCall, call, localStream: stream, type: 'video', direction: 'outgoing', isTemporaryStream: false }]);
              call.on('stream', (remoteStream) => {
                setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'video')), { peerId: peerIdToCall, stream: remoteStream, type: 'video' }]);
              });
              call.on('close', () => endCall(peerIdToCall, 'video'));
              call.on('error', (err) => { alert('Erro chamada de vídeo: ' + err.message); endCall(peerIdToCall, 'video'); });
            }
          } catch (err) {
            alert('Erro ao acessar câmera/microfone: ' + err.message);
          }
        }
      };

      // ── endCall ───────────────────────────────────────────────────────────────
      const endCall = (peerIdToEnd, callType) => {
        const callData = activeCalls.find(c => c.peerId === peerIdToEnd && c.type === callType);
        if (callData) {
          if (callData.call) callData.call.close();
          if (callData.localStream) {
            callData.localStream.getTracks().forEach(track => track.stop());
            // chave correta: peerIdToEnd + '_' + callType (igual ao armazenamento)
            stopAndRemoveLocalStream(peerIdToEnd + '_' + callType);
          }
        }
        setActiveCalls(prev => prev.filter(c => !(c.peerId === peerIdToEnd && c.type === callType)));
        setRemoteStreams(prev => prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType)));
        const anyLocalVideoActive = Array.from(localStreamsRef.current.values()).some(stream => stream.getVideoTracks().some(t => t.readyState === 'live'));
        if (!anyLocalVideoActive) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
      };

      // ── populateEmojiPanel ────────────────────────────────────────────────────
      const populateEmojiPanel = () => {
        const emojis = [
          "😀","😁","😂","🤣","😃","😄","😅","😆","😉","😊","😋","😎","😍","😘","🥰","😗","😙","😚","🙂","🤗",
          "🤩","🤔","🤨","😐","😑","😶","🙄","😏","😣","😥","😮","🤐","😴","😪","😵","😤","😭","😡","🤯","🥵",
          "👍","👎","👌","✌️","🤞","👋","🤚","🖐️","👏","🙌","👐","🤲","🙏","💪","👀","👁️","👶","🧒","👦","👧",
          "🧑","🧔","👩","👨","🧓","👴","👵","🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷",
          "🐸","🐵","🙈","🙉","🙊","🐒","🐔","🐧","🐦","🐤","🦆","🦅","🦉","🦇","🐺","🐗","🐴","🦄","🐝","🦋",
          "🍇","🍉","🍊","🍋","🍌","🍍","🍎","🍏","🍑","🍒","🍓","🥝","🍅","🥑","🍆","🥕","🌽","🍄","🍞","🧀",
          "🍔","🍟","🍕","🌭","🥪","🌮","🌯","🍱","🍣","🍜","🍝","🍛","🍲","🥗","🍿","🎂","🍰","🧁","🍫","🍬",
          "☕","🍵","🍾","🍷","🍸","🍹","🍺","🍻","🥂","🥤","🌍","🌎","🌏","🏔️","🌋","🏖️","🏝️","🏠","🏢","🏥",
          "🚂","🚗","🚕","🚙","🚌","🚎","🚑","🚒","✈️","🚀","🛸","🚢","⚓","🎠","🎡","🎢","🎪","💈","⛲","⛺",
          "⚽","🏀","🏈","⚾","🎾","🏐","🏉","🎱","🏓","🏸","🥊","🎯","🎲","🎭","🎨","🎬","🎤","🎸","🎹","🎺",
          "❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","☮️",
          "🌟","⭐","✨","💫","🌙","🌛","🌜","🌚","🌞","⚡","🔥","💧","🌊","🌈","☁️","❄️","🌬️","🎉","🎊","🎁"
        ];
        return (
          <div className="emoji-panel">
            <div className="emoji-panel-header">Emojis</div>
            <div className="emoji-panel-content">
              {emojis.map((emoji, index) => (
                <span key={index} className="emoji-item" onClick={() => setNewMessage(prev => prev + emoji)}>
                  {emoji}
                </span>
              ))}
            </div>
            <div className="emoji-panel-footer">
              <span className="barra-rolagem-label">Role para ver mais</span>
            </div>
          </div>
        );
      };

      // ── generateInviteLink ────────────────────────────────────────────────────
      const generateInviteLink = () => {
        if (!peerId) return;
        const activePeers = connections.filter(c => c.open && c.peer !== peerId).map(c => c.peer);
        const allIds = [peerId, ...activePeers].slice(0, 196);
        const url = new URL(window.location.href);
        url.searchParams.set('portas', allIds.join(','));
        const finalUrl = url.toString();
        navigator.clipboard.writeText(finalUrl);
        prompt(`Link de convite gerado! (${allIds.length} porta(s)). Copie abaixo:`, finalUrl);
      };

      // ── render ────────────────────────────────────────────────────────────────
      if (error) {
        return (
          <div className="error-message">
            <h1>Erro</h1>
            <p>{error}</p>
            <button onClick={() => window.location.reload()}>Tentar novamente</button>
          </div>
        );
      }

      return (
        <div>
          <input type="file" ref={fileInputRef} style={{ display: 'none' }} onChange={handleFileChange} />
          <div className="app-header">
            <h1 className="app-title">Chat K10</h1>
            <div className="header-buttons">
              <button onClick={() => setShowContacts(true)} className="header-button" title="Contatos">
                <i className="fas fa-address-book"></i>
              </button>
              <button onClick={toggleDarkMode} className="header-button" title="Modo Noturno" id="darkModeBtn">🌙</button>
            </div>
          </div>

          <input type="file" id="radioInput" accept="audio/mp3,audio/mpeg" style={{ display: 'none' }} onChange={handleRadioUpload} />
          <audio ref={radioAudioRef} style={{ display: 'none' }} />

          {radioState.status !== 'idle' && (
            <div style={{ background: '#1e293b', color: 'white', padding: '10px', margin: '0', textAlign: 'center', borderBottom: '1px solid #334155' }}>
              <div style={{ fontSize: '14px', fontWeight: 'bold' }}>🎵 Rádio Global: {radioState.fileName}</div>
              <div style={{ fontSize: '12px', color: '#94a3b8' }}>DJ: {radioState.sender}</div>
              {radioState.status === 'buffering' ? (
                <div style={{ color: '#f59e0b', marginTop: '5px', fontSize: '13px', fontWeight: 'bold' }}>
                  A música começa em {Math.max(0, Math.ceil((radioState.startTime - Date.now()) / 1000))}s...
                  {!radioState.audioUrl && " (Baixando...)"}
                </div>
              ) : (
                <div style={{ color: '#10b981', marginTop: '5px', fontSize: '13px', fontWeight: 'bold' }}>▶ Tocando agora</div>
              )}
              <div style={{ marginTop: '10px' }}>
                <label style={{ fontSize: '12px', color: '#94a3b8' }}>Volume: </label>
                <input type="range" min="0" max="1" step="0.1" defaultValue="0.5"
                  onChange={(e) => { if (radioAudioRef.current) radioAudioRef.current.volume = parseFloat(e.target.value); }} />
              </div>
            </div>
          )}

          <div className="user-info-container">
            {editingName ? (
              <div className="user-name-form">
                <input type="text" value={userName} onChange={(e) => setUserName(e.target.value)} placeholder="Digite seu nome" autoFocus />
                <button onClick={saveUserName} disabled={!userName.trim()}>Salvar</button>
              </div>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <span className="username">{userName}</span>
                <button className="user-edit-button" onClick={() => setEditingName(true)}>Editar</button>
              </div>
            )}
          </div>

          <div className="peer-id-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
              <span>Seu ID: {peerId}</span>
              <button
                onClick={() => setIsSuperNode(!isSuperNode)}
                style={{ backgroundColor: isSuperNode ? '#fef3c7' : 'white', color: isSuperNode ? '#b45309' : '#666', border: `1px solid ${isSuperNode ? '#f59e0b' : '#ddd'}`, padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '5px', fontSize: '12px', fontWeight: 'bold' }}
                title="SuperNós aceitam mais conexões e ajudam a estabilizar a rede">
                <i className="fas fa-bolt" style={{ color: isSuperNode ? '#d97706' : '#999' }}></i>
                {isSuperNode ? 'SuperNó ON' : 'SuperNó OFF'}
              </button>
              <button
                onClick={() => document.getElementById('radioInput').click()}
                disabled={radioState.status !== 'idle'}
