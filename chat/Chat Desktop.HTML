// ─────────────────────────────────────────────────────────────────────
// QUIZ HANDOFF: quando o usuário desliga o bot, transfere o estado
// (disciplina, intervalo, IDs já usados, hits em buffer) para o servidor
// continuar a transmissão exatamente de onde parou.
// IMPORTANTE: segue o mesmo padrão do programa — só URL + ID das imagens
// (nada de binário). O servidor reusa fetchWorldImage com os mesmos IDs
// no Set de já-usados pra não repetir.
// ─────────────────────────────────────────────────────────────────────
const sendQuizHandoff = () => {
  if (!centralServerId) return;
  const conn = connectionsRef.current.find(c => c.peer === centralServerId && c.open);
  if (!conn) return;

  // Snapshot dos hits do Pixabay já buscados mas ainda não usados (por query)
  // _worldImgCache é módulo-level, então acessamos por window
  const bufferedHits = {};
  try {
    if (typeof _worldImgCache === 'object' && _worldImgCache) {
      for (const q in _worldImgCache) {
        if (Array.isArray(_worldImgCache[q]) && _worldImgCache[q].length > 0) {
          bufferedHits[q] = _worldImgCache[q].slice(0); // shallow copy
        }
      }
    }
  } catch(e) {}

  const handoff = {
    type: 'quiz-handoff',
    quizDiscipline: quizDisciplineRef.current,
    quizInterval: safeQuizInterval(),
    usedImageIds: Array.from(worldQuizUsedImagesRef.current || []),
    bufferedHits,                                  // hits Pixabay (URL+ID, sem binário)
    lastPlaceQuery: worldQuizPlaceRef.current ? worldQuizPlaceRef.current.query : null,
    lastQuizTime: lastQuizTimeRef.current,        // Sincroniza cooldown global
    senderName: userNameRef.current || 'Quiz Master', // FIX BUG-3: ref evita stale closure
  };
  try { conn.send(handoff); } catch(e) {} // handoff enviado ao servidor
};

const sendQuizQuestion = (quizData) => {
  const timestamp = new Date();
  const now = trueNow(); // V74-A: usa relógio sincronizado em vez de Date.now() local
  lastQuizTimeRef.current = now; // Atualiza cooldown local
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  // IMPORTANTE: usa type:'message' para que o servidor faça relay automaticamente
  // O campo quizPayload embute os dados estruturados do quiz
  const wireMsg = {
    type: 'message',
    id: msgId,
    ttl: 15,
    senderName: '🤖 Quiz Bot',
    direct: false,
    time: timeStr,
    timestamp: timestamp.getTime(),
    text: '__QUIZ__',          // texto sentinela — clientes antigos ignoram, clientes novos detectam
    quizPayload: quizData      // dados completos do quiz
  };

  const localMsg = {
    type: 'quiz-question',
    sender: 'you',
    senderName: '🤖 Quiz Bot',
    time: timeStr,
    timestamp: timestamp.getTime(),
    recipient: target || 'general',
    quizVotes: {},
    quizRevealed: false,
    ...quizData
  };

  if (target) {
    if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(target)) {
      window.MxDM.send(target, { ...wireMsg, direct: true, recipient: target, sender: peerIdRef.current || peerId }).catch(e => console.warn('[MxDM] quiz send error:', e));
    } else {
      const conn = connectionsRef.current.find(c => c.peer === target && c.open);
      if (conn) try { conn.send(wireMsg); } catch(e) { console.error('Quiz send error', e); }
    }
    setMessages(prev => [...prev, { ...localMsg, direct: true, recipient: target }].slice(-500));
  } else {
    connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
    setMessages(prev => [...prev, localMsg].slice(-500));
    // ── MODO GERAL NOVO: injeta quiz interativo no overlay Matrix ──
    if (typeof window._matrixGeralInjetarQuiz === 'function')
      window._matrixGeralInjetarQuiz(
        { ...quizData, quizQuestion: localMsg.quizQuestion || quizData.quizQuestion },
        '🤖 Quiz Bot', timeStr
      );
  }
  
  // Envia para os inscritos do World Quiz, independentemente de estar em um servidor ou não
  if (quizData.quizStage) {
    worldQuizSubscribersRef.current.forEach(subId => {
      const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
      if (subConn) try { subConn.send(wireMsg); } catch(e) {}
    });
  }
};

const sendQuizReveal = (quizId) => {
  const timestamp = new Date();
  const timeStr = timestamp.toLocaleTimeString('en-US');
  const msgId = Date.now() + Math.random().toString(36).substring(2);
  const target = selectedContactRef.current;

  const q = currentQuizQuestionRef.current;
  const refVotes = q ? (q.votes || {}) : {};

  setMessages(prev => {
    const quizMsg = prev.find(m => m.quizId === quizId);
    const stateVotes = quizMsg ? (quizMsg.quizVotes || {}) : {};
    const mergedVotes = { ...stateVotes, ...refVotes };

    // IMPORTANTE: usa type:'message' para relay pelo servidor
    const wireMsg = {
      type: 'message',
      id: msgId,
      ttl: 15,
      senderName: '🤖 Quiz Bot',
      direct: false,
      time: timeStr,
      text: '__QUIZ_REVEAL__',
      quizRevealPayload: { quizId, votes: mergedVotes, quizCorrect: q ? q.corretaIndex : undefined }
    };

    if (target) {
      if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(target)) {
        window.MxDM.send(target, { ...wireMsg, direct: true, recipient: target, sender: peerIdRef.current || peerId }).catch(e => console.warn('[MxDM] quiz reveal error:', e));
      } else {
        const conn = connectionsRef.current.find(c => c.peer === target && c.open);
        if (conn) try { conn.send(wireMsg); } catch(e) {}
      }
    } else {
      connectionsRef.current.forEach(c => { if (c.open) try { c.send(wireMsg); } catch(e) {} });
    }
    
    if (q && q.quizStage) {
      worldQuizSubscribersRef.current.forEach(subId => {
        const subConn = connectionsRef.current.find(c => c.peer === subId && c.open);
        if (subConn) try { subConn.send(wireMsg); } catch(e) {}
      });
    }

    return prev.map(m =>
      m.quizId === quizId ? { ...m, quizRevealed: true, quizVotes: mergedVotes } : m
    );
  });
  // ── MODO GERAL NOVO: revela resposta no overlay Matrix ──
  if (typeof window._matrixGeralRevealQuiz === 'function' && currentQuizQuestionRef.current) {
    const cq = currentQuizQuestionRef.current;
    if (cq.quizId === quizId && cq.corretaIndex !== undefined)
      window._matrixGeralRevealQuiz(quizId, cq.corretaIndex);
  }
};

const handleAvatarChange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 120;
      const MAX_HEIGHT = 120;
      let width = img.width;
      let height = img.height;
      
      if (width > height) {
        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
      } else {
        if (height > MAX_HEIGHT) {
          width *= MAX_HEIGHT / height;
          height = MAX_HEIGHT;
        }
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.7); // Compress to 70% quality
      setUserAvatar(base64);
      localStorage.setItem('p2pUserAvatar', base64);
      
      // Notify all mapped Matrix DMs and connected peers about the new avatar
      const avatarPayload = { type: 'avatar-update', peerId, avatar: base64 };
      if (window.MxDM && window.MxDM.broadcast) window.MxDM.broadcast(avatarPayload).catch(err => console.warn('[MxDM] avatar broadcast error:', err));
      connectionsRef.current.forEach(conn => {
        if (conn.open) {
          try { conn.send(avatarPayload); } catch(err) {}
        }
      });
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

const createMatrixRtcPeer = (remotePeerId, callType, localStream) => {
  const pc = new RTCPeerConnection(matrixRtcConfig());
  const key = matrixRtcKey(remotePeerId, callType);
  matrixRtcRef.current.set(key, pc);
  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      p2pSendDirect(remotePeerId, { type: 'matrix-rtc-ice', callType, candidate: ev.candidate.toJSON ? ev.candidate.toJSON() : ev.candidate });
    }
  };
  pc.ontrack = (ev) => {
    const stream = ev.streams && ev.streams[0] ? ev.streams[0] : new MediaStream([ev.track]);
    setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === remotePeerId && s.type === callType)), { peerId: remotePeerId, stream, type: callType }]);
  };
  pc.onconnectionstatechange = () => {
    if (['failed','closed','disconnected'].includes(pc.connectionState)) {
      matrixRtcRef.current.delete(key);
      if (pc.connectionState !== 'disconnected') endCall(remotePeerId, callType);
    }
  };
  if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  const call = { peer: remotePeerId, metadata: { type: callType, via: 'matrix' }, __matrixRtc: true, close: () => { try { pc.close(); } catch(e) {} } };
  return { pc, call };

const handleMatrixRtcSignal = async (data, pId) => {
  const callType = data.callType || 'video';
  const key = matrixRtcKey(pId, callType);
  if (data.type === 'matrix-rtc-offer') {
    if (!directPeersRef.current.has(pId)) {
      directPeersRef.current.add(pId);
      setDirectPeers(prev => { const s = new Set(prev); s.add(pId); return s; });
    }
    const constraints = callType === 'voice' ? { audio: true, video: false } : { audio: true, video: true };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    localStreamsRef.current.set(pId + '_' + callType, stream);
    if (callType === 'video') {
      setIsLocalVideoVisible(true);

    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await p2pSendDirect(pId, { type: 'matrix-rtc-answer', callType, sdp: answer, senderName: userNameRef.current || userName, time: formatTime(new Date()) });
    return true;
  }
  if (data.type === 'matrix-rtc-answer') {
    const pc = matrixRtcRef.current.get(key);
    if (pc && data.sdp) await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    return true;

  if (data.type === 'matrix-rtc-ice') {
    const pc = matrixRtcRef.current.get(key);
    if (pc && data.candidate) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    return true;
  }
  if (data.type === 'matrix-rtc-hangup') {
    const pc = matrixRtcRef.current.get(key);
    if (pc) { try { pc.close(); } catch(e) {} matrixRtcRef.current.delete(key); }
    endCall(pId, callType);
    return true;
  }

};

const p2pSendDirect = async (targetId, payload) => {
  let sent = false;
  // FASE 2/3: Matrix DM é o transporte primário user↔user para mensagens, ferramentas,
  // arquivos/áudios em chunks e pré-sinalização de chamadas — sem gateway/servidor/grupo K10.
  if (window.MxDM && window.MxDM.canSend && window.MxDM.canSend(targetId)) {
    try {
      await window.MxDM.send(targetId, { ...payload, direct: payload.direct !== false, recipient: targetId, sender: payload.sender || peerIdRef.current || peerId });
      sent = true;
    } catch(e) { console.warn('[MxDM] Direct send error:', e); }
  }

  if (!sent && libp2pRef.current && libp2pStatusRef.current === 'online') {
    try {
      await libp2pRef.current.services.pubsub.publish(`k10-private-${targetId}`, new TextEncoder().encode(JSON.stringify(payload)));
      sent = true;
    } catch(e) { console.warn('[libp2p] Direct send error:', e); }
  }
  
  if (!sent) {
    const conn = connectionsRef.current.find(c => c.peer === targetId);
    if (conn && conn.open) {
      try {
        conn.send(payload);
        sent = true;
      } catch(e) {}
    }
  }
  return sent;
};

const sendChunkedData = (targetId, idKey, dataBlob, typePrefix, metaData) => {
const id = peerId + `_${typePrefix}_` + Date.now();
const reader = new FileReader(); let offset = 0;
const timestamp = new Date(), formattedTime = formatTime(timestamp);
const isFile = typePrefix === 'file';
const localUrl = URL.createObjectURL(dataBlob);
setMessages(prev => { const msg = { ...metaData, [idKey]: id, sender: 'you', recipient: targetId, senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio', sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(), [isFile ? 'fileData' : 'audioData']: localUrl }; const updated = [...prev, msg]; return updated; });

const sendStart = async () => {
  const startSent = await p2pSendDirect(targetId, { type: `${typePrefix}-start`, [idKey]: id, [isFile ? 'fileSize' : 'audioSize']: dataBlob.size, senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(), ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type }) });
  if (!startSent) {
    window.k10Toast(t(langRef.current, 'sendError'), 'error'); // V74-D: langRef evita stale closure
    setMessages(prev => prev.filter(m => m[idKey] !== id));
    return;
  }
  readChunk();
};

const readChunk = () => { const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE); reader.readAsArrayBuffer(chunk); };
reader.onload = async ev => {
const chunkSent = await p2pSendDirect(targetId, { type: `${typePrefix}-chunk`, [idKey]: id, chunk: ev.target.result, offset, direct: true });
if (!chunkSent) { window.k10Toast(t(langRef.current, 'connectionLost'), 'error'); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); return; }
offset += ev.target.result.byteLength;
const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, progress } : m));
if (offset < dataBlob.size) requestAnimationFrame(readChunk);
else setMessages(prev => { const updated = prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: 100 } : m); return updated; });
};
reader.onerror = () => { window.k10Toast(t(langRef.current, 'fileReadError'), 'error'); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); };
sendStart();
};

}
// BUG C-4 FIX: usa connectionsRef.current para evitar stale closure
const conn = connectionsRef.current.find(c => c.peer === peerIdToCall);
if (isSendingVideo) {
if (existingCall.localStream) { existingCall.localStream.getTracks().forEach(tr => tr.stop()); localStreamsRef.current.delete(peerIdToCall + '_video'); }
setActiveCalls(prev => prev.map(c => c.peerId === peerIdToCall && c.type === 'video' ? { ...c, localStream: null } : c));
if (localStreamsRef.current.size === 0) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
} else {
const conn = connectionsRef.current.find(c => c.peer === peerIdToCall);
const libp2pOnline = libp2pPeers && libp2pPeers.includes(peerIdToCall);
const matrixOnline = !!(window.MxDM && window.MxDM.canSend && window.MxDM.canSend(peerIdToCall));
if ((!conn || !conn.open) && !libp2pOnline && !matrixOnline) { window.k10Toast(t(lang, 'contactOffline2'), 'warning'); return; }
try {
const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
localStreamsRef.current.set(peerIdToCall + '_video', stream);
setIsLocalVideoVisible(true);
if (localVideoRef.current) localVideoRef.current.srcObject = stream;
if (matrixOnline) {
  await startMatrixRtcCall(peerIdToCall, 'video', stream);
  return;
}
// Fallback PeerJS quando o contato não está mapeado no Matrix DM
p2pSendDirect(peerIdToCall, { type: 'call-pre-signal', callType: 'video', senderName: userName, time: formatTime(new Date()) });
const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'video' } });
setActiveCalls(prev => [...prev.filter(c => !(c.peerId === peerIdToCall && c.type === 'video')), { peerId: peerIdToCall, call, localStream: stream, type: 'video', direction: 'outgoing', isTemporaryStream: false }]);
call.on('stream', rs => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'video')), { peerId: peerIdToCall, stream: rs, type: 'video' }]));
call.on('close', () => endCall(peerIdToCall, 'video'));
call.on('error', err => { window.k10Toast(t(lang, 'videoError') + err.message, 'error'); endCall(peerIdToCall, 'video'); });
} catch (err) { window.k10Toast(t(lang, 'cameraError') + err.message, 'error'); }
}
};


const broadcastYoutubeChat = () => {
if (youtubeChatId) { window.k10Toast(t(lang, 'chatAlreadyActive') || 'A chat is already active. Stop it first.', 'warning'); return; }
const url = prompt(t(lang, 'enterYoutubeUrl') || 'Enter YouTube Live URL for Chat:');
if (!url) return;
let yId = null;
try {
let parsedUrl = url;
if (!parsedUrl.startsWith('http')) parsedUrl = 'https://' + parsedUrl;
if (parsedUrl.includes('youtu.be/')) yId = parsedUrl.split('youtu.be/')[1].split('?')[0];
else if (parsedUrl.includes('youtube.com/watch')) yId = new URL(parsedUrl).searchParams.get('v');
else if (parsedUrl.includes('youtube.com/live/')) yId = parsedUrl.split('youtube.com/live/')[1].split('?')[0];
} catch (e) {}
if (!yId) { window.k10Toast(t(lang, 'invalidYoutubeUrl') || 'Invalid YouTube URL', 'warning'); return; }


setYoutubeChatId(yId);
const msgId = Date.now() + Math.random().toString(36).substring(2);
const msgData = { type: 'youtube-chat-start', id: msgId, youtubeId: yId, ttl: 15 };
p2pBroadcast(msgData);
};


const stopYoutubeChat = () => {
setYoutubeChatId(null);
// FIX BUG-L5b: sem este broadcast nenhum peer recebia o stop — rede ficava com chat preso
const msgId = Date.now() + Math.random().toString(36).substring(2);
const msgData = { type: 'youtube-chat-stop', id: msgId, ttl: 8 };
p2pBroadcast(msgData);
};


const endCall = (peerIdToEnd, callType) => {
  // V7-B19: parar tracks do remoteStream antes de remover
  try {
    setRemoteStreams(prev => {
      prev.forEach(s => { if (s.peerId === peerIdToEnd && s.type === callType && s.stream) { try { s.stream.getTracks().forEach(t => t.stop()); } catch(e){} } });
      return prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType));
    });
  } catch(e){}
// FIX C-10: usa activeCallsRef.current (sempre fresco) — activeCalls é closure stale em callbacks PeerJS
const callData = activeCallsRef.current.find(c => c.peerId === peerIdToEnd && c.type === callType);
if (callData) {
if (callData.call && callData.call.__matrixRtc) {
  try { p2pSendDirect(peerIdToEnd, { type: 'matrix-rtc-hangup', callType }); } catch(e) {}
  try { matrixRtcRef.current.delete(matrixRtcKey(peerIdToEnd, callType)); } catch(e) {}
}
if (callData.call) callData.call.close();
if (callData.localStream) { callData.localStream.getTracks().forEach(tr => tr.stop()); stopAndRemoveLocalStream(peerIdToEnd + '_' + callType); }
}
setActiveCalls(prev => prev.filter(c => !(c.peerId === peerIdToEnd && c.type === callType)));
setRemoteStreams(prev => prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType)));
const anyVideo = Array.from(localStreamsRef.current.values()).some(s => s.getVideoTracks().some(tr => tr.readyState === 'live'));
if (!anyVideo) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
};

{showFilmes && (() => {

    if (filmesQuery.trim().length < 2) return;
    setFilmesLoading(true); setFilmesResults([]);
    if (filmesTab === 'youtube') {
      const q = encodeURIComponent(`site:youtube.com ${filmesQuery.trim()}`);
      const ddgUrl = encodeURIComponent(`https://html.duckduckgo.com/html/?q=${q}`);
      
      const fetchDDG = () => fetch(`https://api.allorigins.win/raw?url=${ddgUrl}`)
        .then(r => r.text())
        .then(t => {
          const itemsMap = new Map();
          Array.from(t.matchAll(/watch%3Fv%3D([a-zA-Z0-9_\-]{11})[^\"]*\">([^<]+)<\/a>/g)).forEach(m => {
            const vId = m[1];
            const title = m[2];
            if (title.includes(' - YouTube') && !itemsMap.has(vId)) {
              itemsMap.set(vId, {
                videoId: vId,
                title: title.replace(' - YouTube', '').replace(/&amp;/g, '&'),
                author: 'YouTube',
                thumb: `https://img.youtube.com/vi/${vId}/mqdefault.jpg`
              });
            }
          });
          const items = Array.from(itemsMap.values()).slice(0, 50);
          if (items.length > 0) return items;
          throw new Error('No results from DDG');
        });

      fetchDDG()
        .then(items => { setFilmesResults(items); setFilmesLoading(false); })
        .catch(() => {
           // Fallback to lemno / piped via cors proxy
           const fbUrl = encodeURIComponent(`https://pipedapi.in.projectsegfau.lt/search?q=${encodeURIComponent(filmesQuery.trim())}&filter=videos`);
           fetch(`https://api.allorigins.win/raw?url=${fbUrl}`)
            .then(r => r.json())
            .then(d => {
              const items = (d?.items || []).filter(i => i.url && i.url.includes('/watch?v=')).map(i => {
                const vId = i.url.split('v=')[1]?.split('&')[0];
                return {
                  videoId: vId || '', title: i.title || '', author: i.uploaderName || '',
                  thumb: i.thumbnail || (vId ? `https://img.youtube.com/vi/${vId}/mqdefault.jpg` : '')
                };
              }).filter(i => i.videoId).slice(0, 50);
              setFilmesResults(items); setFilmesLoading(false);
            }).catch(() => { setFilmesResults([]); setFilmesLoading(false); });
        });
    } else {
      fetch(`https://archive.org/advancedsearch.php?q=title:${encodeURIComponent(filmesQuery.trim())}+AND+mediatype:movies&fl[]=identifier&fl[]=title&fl[]=year&rows=50&output=json`)
        .then(r => r.json())

      <div style={{display:'flex',gap:'6px',marginBottom:'12px'}}>
        {[{id:'youtube',label:'▶ YouTube',color:'#ef4444'},{id:'archive',label:'🎬 Archive.org',color:'#a78bfa'}].map(tab => (
          <button key={tab.id} onClick={() => { setFilmesTab(tab.id); setFilmesResults([]); setFilmesQuery(''); }}
            style={{flex:1,padding:'7px',borderRadius:'8px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'12px',
              background: filmesTab===tab.id ? tab.color : '#1e293b',
              color: filmesTab===tab.id ? 'white' : '#64748b',
              transition:'all 0.15s'}}>
            {tab.label}

        {!filmesLoading && filmesQuery.trim().length<2 && filmesResults.length===0 && <div style={{textAlign:'center',color:'#475569',padding:'24px',fontSize:'12px'}}>Digite e pressione Enter para buscar.</div>}
        {filmesResults.map((item,i) => {
          const title = item.title;
          const thumb = filmesTab==='youtube'
            ? (item.thumb || `https://img.youtube.com/vi/${item.videoId}/mqdefault.jpg`)
            : `https://archive.org/services/img/${item.identifier}`;
          const sub = filmesTab==='youtube' ? item.author : (item.year ? `📅 ${item.year}` : '');
          return (
            <div key={i} onClick={() => transmitir(item)}
              style={{display:'flex',alignItems:'center',gap:'10px',padding:'9px',borderRadius:'8px',cursor:'pointer',borderBottom:'1px solid #1e293b'}}
              onMouseEnter={e=>e.currentTarget.style.backgroundColor='#1e1a2e'}

              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:'12px',color:'#e2e8f0',lineHeight:'1.4',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{title}</div>

              <span style={{color: filmesTab==='youtube' ? '#ef4444' : '#a78bfa',fontSize:'20px',flexShrink:0}}>▶</span>

{showContacts ? (
<ContactsScreen lang={lang} contacts={contacts} setContacts={setContacts} onBack={() => setShowContacts(false)}
onSelectContact={(pId) => {

}}
onSelectGroup={(name) => {

}}

) : (
<ChatManager
lang={lang}
connections={connections} messages={messages} setMessages={setMessages}
contacts={contacts} userName={userName} peerId={peerId}

toggleVideoCall={toggleVideoCall} remoteStreams={remoteStreams}
audioRefs={audioRefs} videoRefs={videoRefs} handleFileChange={handleFileChange}
fileInputRef={fileInputRef} handleAudioRecording={handleAudioRecording}
newMessage={newMessage} setNewMessage={setNewMessage}
showEmojiPanel={showEmojiPanel} setShowEmojiPanel={setShowEmojiPanel}
populateEmojiPanel={populateEmojiPanel} getContactName={getContactName}
selectedContact={selectedContact} setSelectedContact={setSelectedContact}
localVideoRef={localVideoRef} registerSentMessage={(id) => seenMessagesRef.current.add(id)}

networkSize={networkSize} centralServerId={centralServerId}

serverE2EE={serverE2EE} setServerE2EE={setServerE2EE} connectToPeer={connectToPeer}
handleTorrentSeed={handleTorrentSeed} handleTorrentDownload={handleTorrentDownload}
setShowTorrentManager={setShowTorrentManager}
pendingTorrentRequests={pendingTorrentRequests}
setPendingTorrentRequests={setPendingTorrentRequests}
handleTorrentDirectSeed={handleTorrentDirectSeed}
youtubeChatId={youtubeChatId}
broadcastYoutubeChat={broadcastYoutubeChat}
stopYoutubeChat={stopYoutubeChat}
disconnectPeer={disconnectPeer}

avatars={avatars}

const App = () => {
    const [view, setView] = useState('chat');
    const libp2pRef = useRef(null);
    const [libp2pStatus, setLibp2pStatus] = useState('offline');
    const [libp2pPeers, setLibp2pPeers] = useState([]); // Peers descobertos via libp2p
    const [networkLogs, setNetworkLogs] = useState([]);
    
    const addGlobalAudit = (msg, type = 'info') => {
        const entry = { msg, type, time: new Date().toLocaleTimeString() };
        setNetworkLogs(prev => [entry, ...prev].slice(0, 50));
    };

    const startLibp2p = async () => {
        if (libp2pRef.current || libp2pStatus === 'starting' || libp2pStatus === 'online') return;
        setLibp2pStatus('starting');
        addGlobalAudit('🛠️ Inicializando libp2p descentralizado...', 'info');

        try {
          const { createLibp2p } = await import(`${'libp2p'}`);
          const { webSockets } = await import(`${'@libp2p/websockets'}`);
          const { webRTC } = await import(`${'@libp2p/webrtc'}`);
          const { noise } = await import(`${'@chainsafe/libp2p-noise'}`);
          const { yamux } = await import(`${'@libp2p/yamux'}`);
          const { mplex } = await import(`${'@libp2p/mplex'}`);
          const { bootstrap } = await import(`${'@libp2p/bootstrap'}`);
          const { kadDHT } = await import(`${'@libp2p/kad-dht'}`);
          const { multiaddr } = await import(`${'@multiformats/multiaddr'}`);
          const { gossipsub } = await import(`${'@libp2p/gossipsub'}`);
          const { peerIdFromPrivateKey } = await import(`${'@libp2p/peer-id'}`);

          // Obtém o mesmo peerId usado pelo PeerJS
          const peerJsId = localStorage.getItem(PEER_ID_STORAGE_KEY) || (() => {
            const newId = generateId(); 
            localStorage.setItem(PEER_ID_STORAGE_KEY, newId);
            return newId;
          })();

          // Gera uma chave privada determinística a partir do peerJsId
          const enc = new TextEncoder();
          const seedData = enc.encode(`k10-${peerJsId}`);
          const hashBuffer = await crypto.subtle.digest('SHA-256', seedData);
          
          const { keys } = await import(`${'@libp2p/crypto'}`);
          const privKey = await keys.generateKeyPairFromSeed('Ed25519', new Uint8Array(hashBuffer));
          // peerIdFromPrivateKey é síncrono no libp2p v2 (sem await)
          const libp2pPeerId = peerIdFromPrivateKey(privKey);

          const node = await createLibp2p({
            peerId: libp2pPeerId,
            addresses: { listen: ['/webrtc', '/wss', '/ws'] },
            transports: [webSockets(), webRTC()],
            connectionEncryption: [noise()],
            streamMuxers: [yamux(), mplex()],
            peerDiscovery: [
              bootstrap({
                list: [
                  '/dnsaddr/bootstrap.libp2p.io/p2p/QmNnoo2uR3RvoSRqY9TqC5B6fS1Jthf4xXjVv2UzzLaTX',
                  '/dnsaddr/bootstrap.libp2p.io/p2p/QmQCU2EcSTwsxgMwvSsyn88HNWL6HUeDm6ex6hwQVkHyw',
                  '/dnsaddr/bootstrap.libp2p.io/p2p/QmbLHAnMoWSWS71A9SdrxD1TJ8T2oFsJp78v4fE8shzHWh'
                ]
              })
            ],
            services: {
              dht: kadDHT({ clientMode: false }), // Permitir servir a DHT para melhor descoberta
              pubsub: gossipsub({
                // V76: Mesh mais denso — 6 peers alvo, mín 4, máx 12
                D: 6, Dlo: 4, Dhi: 12,
                // Fanout TTL: mantém fanout ativo 60s mesmo sem assinar o tópico
                fanoutTTL: 60_000,
                // Cache de mensagens: 6 janelas × heartbeat; gossip em 3 delas
                mcacheLength: 6, mcacheGossip: 3,
                // Publica mesmo sem peers no tópico (evita silêncio em rede fria)
                allowPublishToZeroTopicPeers: true
              })
            }
          });

          await node.start();
          libp2pRef.current = node;
          setLibp2pStatus('online');
          addGlobalAudit(`✅ libp2p Online! ID: ${node.peerId.toString()} (Unificado com PeerJS: ${peerJsId})`, 'success');
          
          node.services.pubsub.subscribe('k10-discovery');
          // Canal privado para este nó
          node.services.pubsub.subscribe(`k10-private-${node.peerId.toString()}`);


          // Anúncio periódico no DHT e no PubSub
          // FIX V79: libp2pStatus era capturado pela closure sempre como 'offline'
          // (stale closure). Agora usa libp2pRef.current diretamente — sem depender
          // de state React congelado no momento da criação do setInterval.
          setInterval(async () => {
            if (libp2pRef.current && !libp2pRef.current.status?.includes('stop')) {
              const myIdStr = libp2pRef.current.peerId.toString();
              const discoveryMsg = { type: 'discovery', peerId: myIdStr, time: Date.now() };
              try {
                await libp2pRef.current.services.pubsub.publish('k10-discovery', enc.encode(JSON.stringify(discoveryMsg)));
              } catch(e) {}
              try {
                await libp2pRef.current.services.dht.put(enc.encode(`k10:peer:${myIdStr}`), enc.encode(Date.now().toString()));
              } catch(e) {}
            }
          }, 60000);

          node.services.pubsub.addEventListener('message', (evt) => {
            if (evt.detail.topic === 'k10-discovery') {
              try {
                const data = JSON.parse(new TextDecoder().decode(evt.detail.data));
                if (data.type === 'discovery' && data.peerId !== node.peerId.toString()) {
                  setLibp2pPeers(prev => prev.includes(data.peerId) ? prev : [...prev, data.peerId]);
                  node.dial(data.peerId).catch(() => {});
                }
              } catch(e) {}
            }
          });

          // Escuta por novos peers
          node.addEventListener('peer:discovery', (evt) => {
             const discoveredId = evt.detail.id.toString();
             setLibp2pPeers(prev => prev.includes(discoveredId) ? prev : [...prev, discoveredId]);
             addGlobalAudit(`📡 Peer descoberto via libp2p: ${discoveredId.slice(0,12)}...`, 'info');
             if (evt.detail.multiaddrs && evt.detail.multiaddrs.length > 0) {
               node.dial(evt.detail.id).catch(() => {});
             }
          });

        } catch (e) {
          console.error("[K10] Libp2p Start Failed:", e);
          setLibp2pStatus('offline');
          addGlobalAudit(`❌ Falha Libp2p: ${e.message}`, 'error');
        }
    };

    const stopLibp2p = async () => {
        if (libp2pRef.current) {
            await libp2pRef.current.stop();
            libp2pRef.current = null;
            setLibp2pStatus('offline');
            addGlobalAudit('🛑 Nó libp2p parado.', 'warning');
        }
    };

    useEffect(() => {
        if (view === 'chat' || view === 'central' || view === 'monitor') {
            startLibp2p();
        }
    }, [view]);

    return (
        <div className="super-app">
            <div className="app-viewport">
                <ChatClient libp2pRef={libp2pRef} libp2pStatus={libp2pStatus} libp2pPeers={libp2pPeers} addGlobalAudit={addGlobalAudit} />
            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
<script>
  (async () => {
    try {
      await esbuild.initialize({ wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.20.1/esbuild.wasm' });
      const script = document.getElementById('esbuild-main').textContent;
      const { code } = await esbuild.transform(script, {
        loader: 'tsx',
        format: 'esm', // Suporte nativo para módulos ES do importmap/Libp2p
        target: 'esnext'
      });
      const s = document.createElement('script');
      s.type = 'module';
      s.textContent = code;
      document.body.appendChild(s);
    } catch (e) {
      console.error('Esbuild error:', e);
      document.getElementById('k10-loading').innerHTML = '<p style="color:red;text-align:center;margin-top:20px">Erro ao carregar o chat. Por favor, recarregue a página.</p>';
    }
  })();
</script>

    // --------------------------------------------------
    // API fetch helper — fetch() com CORS (substitui JSONP)
    // --------------------------------------------------
    // ── MATRIX API — chamadas diretas (sem proxy) ──
    async function matrixGet(path, params = {}) {
        const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
        const sep = path.includes('?') ? '&' : '?';
        const url = MATRIX_HS + path + sep + 'access_token=' + encodeURIComponent(MATRIX_TOKEN) + (qs ? '&'+qs : '');
        const resp = await fetch(url, { signal: AbortSignal.timeout(35000) });
        return resp.json();
    }
    async function matrixPost(path, body = {}) {
        const url = MATRIX_HS + path + '?access_token=' + encodeURIComponent(MATRIX_TOKEN);
        const resp = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body), signal: AbortSignal.timeout(35000) });
        return resp.json();
    }
    async function matrixPut(path, body = {}) {
        const url = MATRIX_HS + path + '?access_token=' + encodeURIComponent(MATRIX_TOKEN);
        const resp = await fetch(url, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body), signal: AbortSignal.timeout(35000) });
        return resp.json();
    }

    function escapeHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
    }

    async function resolverRoomId(alias) {
        try {
            const dados = await matrixGet('/_matrix/client/v3/directory/room/' + encodeURIComponent(alias));
            return dados.room_id || null;
        } catch (e) {
            console.warn(`[Matrix] Erro ao resolver alias ${alias}:`, e);
            return null;
        }
    }

    function injetarMensagemNoChat(sala, mensagem) {
        if (!sala._mensagens) sala._mensagens = [];
        const hora = new Date(mensagem.timestamp).toLocaleTimeString();
        const remetente = mensagem.sender.split(':')[0];
        const body = mensagem.body;

        // Remove msg local com mesmo texto se existir (evita duplicata)
        const localIdx = sala._mensagens.findIndex(m => m._local && m._texto === body);
        if (localIdx !== -1) sala._mensagens.splice(localIdx, 1);

        sala._mensagens.push({ body, sender: remetente, hora });

        if (_salaAtiva === sala.alias) {
            renderizarChatMatrix(sala);
        }
        // Atualiza o Modo Geral se a mensagem for da sala geral
        if (sala.alias === SALA_GERAL_ALIAS) {
            renderizarChatGeral();
        }
    }

    // Renderiza a área de conversa de uma sala específica
    function renderizarChatMatrix(sala) {
        const overlay = document.getElementById('matrix-chat-overlay');
        if (!overlay) return;
        const msgArea = document.getElementById('matrix-chat-messages');
        if (!msgArea) return;

        const msgs = sala._mensagens || [];
        if (msgs.length === 0) {
            // Só mostra loading se o histórico ainda não foi carregado
            const status = sala._historicoCarregado
                ? `<div id="matrix-chat-empty">📭 Nenhuma mensagem ainda em ${sala.nome}</div>`
                : `<div id="matrix-chat-empty">⏳ Carregando mensagens de ${sala.nome}...</div>`;
            msgArea.innerHTML = status;
            return;
        }
        msgArea.innerHTML = msgs.map((m, idx) => {
            const isLocal   = !!m._local;
            const isFailed  = !!m._falhou;
            const cls       = isFailed ? 'bubble-failed' : isLocal ? 'bubble-sending' : (m.sender === '👤 Você' ? 'bubble-sent' : '');
            const label     = isFailed  ? '❌ Você (falhou)' :
                              isLocal   ? '⏳ Você (enviando…)' :
                              escapeHtml(m.sender);
            const retryBtn  = isFailed
                ? `<span class="matrix-bubble-retry" onclick="window._matrixRetry(${idx})">↩ Tentar novamente</span>`
                : '';
            return `
            <div class="matrix-chat-bubble ${cls}" data-idx="${idx}">
                <div class="matrix-bubble-name">${label}</div>
                <div>${escapeHtml(m.body)}</div>
                <div class="matrix-bubble-time">${m.hora}${retryBtn}</div>
            </div>`;
        }).join('');
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    async function enviarParaSala(sala, texto) {
        try {
            const txnId = 'k10_' + Date.now();
            const res = await matrixPut(
                `/_matrix/client/v3/rooms/${encodeURIComponent(sala.room_id)}/send/m.room.message/${txnId}`,
                { msgtype: 'm.text', body: texto }
            );
            if (res && res.event_id) return true;
            const motivo = res && res.error ? res.error : (res && res.errcode ? res.errcode : 'falha desconhecida');
            console.error('[Matrix] ❌ Envio rejeitado:', motivo);
            if (res && res.errcode === 'M_UNKNOWN_TOKEN') { MATRIX_TOKEN = ''; localStorage.removeItem('matrixToken'); _matrixSolicitarLogin('Sessão expirada — faça login novamente'); }
            mostrarToast(`❌ Mensagem não enviada: ${motivo}`);
            return false;
        } catch(e) {
            console.error('[Matrix] ❌ Envio falhou:', e);
            mostrarToast('❌ Falha de rede ao enviar mensagem');
            return false;
        }
    }

    // --------------------------------------------------
    // LONG POLL — uma requisição cobre todas as salas
    // O Deno segura a conexão até 25s esperando msg nova
    // Consumo: ~1 req/25s por usuário (vs 1 req/3s antes)
    // --------------------------------------------------
    async function iniciarLongPoll() {
        if (_longPollAtivo) return;
        _longPollAtivo = true;
        console.log('[Matrix] 🔄 Long poll direto iniciado');
        while (true) {
            if (!MATRIX_TOKEN) { await _sleep(3000); continue; }
            const salas = salasInfo.filter(s => s.room_id);
            if (salas.length === 0) { await _sleep(3000); continue; }
            try {
                const roomIds = salas.map(s => s.room_id);
                const filter = JSON.stringify({
                    room: { rooms: roomIds, timeline: { limit: 50, types: ['m.room.message'] }, state: { types: [] }, ephemeral: { types: [] } },
                    presence: { types: [] }, account_data: { types: [] }
                });
                const params = { timeout: 25000, filter };
                if (_syncToken) params.since = _syncToken;
                const _pingT0 = Date.now();
                const dados = await matrixGet('/_matrix/client/v3/sync', params);
                // Atualiza indicador de latência (exclui o long-poll timeout de 25s do cálculo)
                if (_syncToken) _atualizarPing(Date.now() - _pingT0);
                if (dados.errcode === 'M_UNKNOWN_TOKEN') {
                    MATRIX_TOKEN = ''; localStorage.removeItem('matrixToken');
                    _matrixSolicitarLogin('Sessão expirada — faça login novamente');
                    await _sleep(8000); continue;
                }
                if (dados.next_batch) _syncToken = dados.next_batch;
                const joinedRooms = (dados.rooms && dados.rooms.join) || {};
                for (const [roomId, roomData] of Object.entries(joinedRooms)) {
                    const sala = salasInfo.find(s => s.room_id === roomId);
                    if (!sala) continue;
                    for (const ev of (roomData.timeline && roomData.timeline.events || [])) {
                        if (ev.type !== 'm.room.message' || !ev.content || ev.content.msgtype !== 'm.text') continue;
                        if (sala.ultimasMensagens.has(ev.event_id)) continue;
                        sala.ultimasMensagens.add(ev.event_id);
                        injetarMensagemNoChat(sala, { event_id: ev.event_id, sender: ev.sender, body: ev.content.body, timestamp: ev.origin_server_ts, room_id: roomId });
                        if (_salaAtiva === sala.alias) renderizarChatMatrix(sala);
                    }
                }
            } catch(e) {
                console.warn('[Matrix] ⚠️ Long poll erro:', e.message || e);
                await _sleep(5000);
            }
        }
    }

    function _sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    window.enviarParaMatrix = async (texto, indiceSala = 0) => { if (salasInfo[indiceSala]) await enviarParaSala(salasInfo[indiceSala], texto); };

        `;

        if (typeof _atualizarDraftIndicators === 'function') _atualizarDraftIndicators();

    // --------------------------------------------------
    // SELECIONAR sala ativa
    // --------------------------------------------------
    function _abrirOverlaySala(alias) {
        garantirOverlay();
        const overlay = document.getElementById('matrix-chat-overlay');
        if (alias) {
            const sala = salasInfo.find(s => s.alias === alias);
            if (sala) {
                if (!sala._mensagens) sala._mensagens = [];
                if (overlay) overlay.classList.add('ativo');
                // Atualiza header com nome da sala
                const nomeEl = document.getElementById('matrix-chat-sala-nome');
                if (nomeEl) nomeEl.textContent = sala.nome || alias;
                // Restaura rascunho salvo para esta sala
                const input = document.getElementById('matrix-chat-input');
                if (input) {
                    const draft = sessionStorage.getItem('mx_draft_' + alias) || '';
                    input.value = draft;
                    // Salva rascunho ao digitar
                    input._draftAlias = alias;
                    if (!input._draftListener) {
                        input._draftListener = true;
                        input.addEventListener('input', function() {
                            if (this._draftAlias) {
                                const v = this.value;
                                if (v) sessionStorage.setItem('mx_draft_' + this._draftAlias, v);
                                else   sessionStorage.removeItem('mx_draft_' + this._draftAlias);
                                // Atualiza indicador visual de rascunho na sidebar
                                _atualizarDraftIndicators();
                            }
                        });
                    }
                }
                // Mostra mensagens já em cache imediatamente
                renderizarChatMatrix(sala);
                // Só carrega histórico se ainda não carregou
                if (!sala._historicoCarregado) {
                    sala._historicoCarregado = true;
                    carregarHistorico(sala, 30);
                }
            }
        } else {
            if (overlay) overlay.classList.remove('ativo');
        }
    }

    // Atualiza o indicador ✏️ de rascunho em cada item da sidebar
    function _atualizarDraftIndicators() {
        document.querySelectorAll('.matrix-conv-item').forEach(function(el) {
            const alias = el.dataset.alias;
            if (!alias) return;
            const hasDraft = !!sessionStorage.getItem('mx_draft_' + alias);
            el.classList.toggle('has-draft', hasDraft);
        });
    }

    // Helper: atualiza o dot de ping com base em ms
    function _atualizarPing(ms) {
        // Salinhas
        const dot = document.getElementById('matrix-ping-dot');
        if (dot) {
            dot.classList.remove('ping-good','ping-mid','ping-bad','ping-idle');
            if      (ms < 800)  { dot.classList.add('ping-good'); dot.title = `Latência: ${ms}ms ✅`; }
            else if (ms < 2500) { dot.classList.add('ping-mid');  dot.title = `Latência: ${ms}ms ⚠️`; }
            else                { dot.classList.add('ping-bad');  dot.title = `Latência: ${ms}ms ❌`; }
        }
        // Modo Geral (mesmo token, mesmo poll)
        const dotG = document.getElementById('general-matrix-ping');
        if (dotG) {
            dotG.classList.remove('ping-good','ping-mid','ping-bad','ping-idle');
            if      (ms < 800)  { dotG.classList.add('ping-good'); dotG.title = `Latência: ${ms}ms ✅`; }
            else if (ms < 2500) { dotG.classList.add('ping-mid');  dotG.title = `Latência: ${ms}ms ⚠️`; }
            else                { dotG.classList.add('ping-bad');  dotG.title = `Latência: ${ms}ms ❌`; }
        }
    }

    window._matrixSelecionarSala = function(alias) {
        _salaAtiva = alias;
        window._matrixSalaAtual = alias || 'geral';
        renderizarSidebarMatrix();

        // V102/CORREÇÃO Bug 1: verifica se o painel está VISÍVEL (não só se o elemento existe no DOM).
        // O elemento sempre existe (React usa hidden attr), então precisamos checar closest('[hidden]').
        const _salinhasEl = document.getElementById('matrix-salinhas-content');
        const _gruposEl   = document.getElementById('matrix-grupos-content');
        const _salinhasActive = _salinhasEl && !_salinhasEl.closest('[hidden]');
        const _gruposActive   = _gruposEl   && !_gruposEl.closest('[hidden]');
        if (alias && !_salinhasActive && !_gruposActive) {
            // Ativa a aba Salinhas clicando no botão correspondente
            const salinhasBtn = document.querySelector('[title="Salinhas Matrix"]');
            if (salinhasBtn) {
                salinhasBtn.click();
                // Aguarda o React renderizar o #matrix-salinhas-content e reinjecta o bloco
                setTimeout(function() { renderizarSidebarMatrix(); _abrirOverlaySala(alias); }, 150);
            } else {
                _abrirOverlaySala(alias);
            }
        } else {
            _abrirOverlaySala(alias);
        }
        console.log(`[Matrix] 🏠 Sala ativa: ${alias || 'MODO GERAL'}`);
    };

    // --------------------------------------------------
    // FECHAR sala específica
    // --------------------------------------------------
    window._matrixFecharSala = function(alias) {
        salasInfo = salasInfo.filter(s => s.alias !== alias || s.geral);
        if (_salaAtiva === alias) {
            _salaAtiva = null;
            window._matrixSalaAtual = 'geral';
            const overlay = document.getElementById('matrix-chat-overlay');
            if (overlay) overlay.classList.remove('ativo');
        }
        renderizarSidebarMatrix();
        mostrarToast('🚪 Sala fechada');
    };

    window._matrixEnviarChat = async function() {
        const input = document.getElementById('matrix-chat-input');
        if (!input || !input.value.trim() || !_salaAtiva) return;
        // Pede login APENAS quando o usuário tenta enviar uma mensagem
        if (!MATRIX_TOKEN) {
            _matrixSolicitarLogin('Faça login para enviar mensagens');
            return;
        }
        const texto = input.value.trim();
        input.value = '';
        // Limpa o rascunho salvo ao enviar
        sessionStorage.removeItem('mx_draft_' + _salaAtiva);
        _atualizarDraftIndicators();
        const sala = salasInfo.find(s => s.alias === _salaAtiva);
        if (!sala || !sala.room_id) return;
        if (!sala._mensagens) sala._mensagens = [];
        // Prefixo com nome do usuário K10
        const nomeK10 = localStorage.getItem('p2pUserName') || '';
        const textoFinal = nomeK10 ? `[K10·${nomeK10}] ${texto}` : texto;
        // Adiciona localmente com estado "enviando…"
        const msgLocal = { body: textoFinal, sender: '👤 Você', hora: new Date().toLocaleTimeString(), _local: true, _texto: textoFinal };
        sala._mensagens.push(msgLocal);
        renderizarChatMatrix(sala);
        // Tenta enviar para o Matrix via GAS
        const ok = await enviarParaSala(sala, textoFinal);
        if (!ok) {
            // Marca a bolha como falhou para o usuário ver
            msgLocal._falhou = true;
            delete msgLocal._local;
            renderizarChatMatrix(sala);
        }
        // Se ok=true, o polling substituirá a bolha local pelo event_id real do Matrix
    };

    // Retry de mensagem falhada
    window._matrixRetry = async function(idx) {
        const sala = salasInfo.find(s => s.alias === _salaAtiva);
        if (!sala || !sala._mensagens[idx]) return;
        const m = sala._mensagens[idx];
        const texto = m._texto || m.body;
        m._falhou = false;
        m._local  = true;
        renderizarChatMatrix(sala);
        const ok = await enviarParaSala(sala, texto);
        if (!ok) { m._falhou = true; delete m._local; renderizarChatMatrix(sala); }
    };

    function _diagLog(msg, tipo) {
        const log = document.getElementById('matrix-diag-log');
        if (!log) return;
        const ts = new Date().toLocaleTimeString();
        const line = document.createElement('div');

    window._matrixExecutarDiag = async function() {
        const log = document.getElementById('matrix-diag-log');
        if (log) log.innerHTML = '';
        window._diagRelatorio = [];
        window._diagUserId   = null;
        window._diagEventId  = null;

        // ── 1. PROXY ──
        _diagSep('1. PROXY GAS');
        _diagLog('Servidor: ' + MATRIX_HS, 'inf');
        let proxyOk = !!MATRIX_TOKEN;
        if (!MATRIX_TOKEN) { _diagLog('❌ Não está logado — clique em 🔑 Login', 'err'); return; }
        _diagLog('✅ Token presente no localStorage', 'ok');

        // ── 2. TOKEN / WHOAMI direto ──
        _diagSep('2. TOKEN — AUTENTICAÇÃO');
        try {
            const r = await matrixGet('/_matrix/client/v3/account/whoami');
            if (r && r.user_id) {
                _diagLog('✅ Conta: ' + r.user_id, 'ok');
                window._diagUserId = r.user_id;
            } else {
                _diagLog('❌ Token inválido: ' + JSON.stringify(r), 'err');
                _diagLog('👉 Clique em 🔑 Login para gerar novo token.', 'warn');
            }
        } catch(e) { _diagLog('❌ Erro whoami: ' + e.message, 'err'); }

        // ── 3. SALAS ──
        _diagSep('3. SALAS CARREGADAS');
        _diagLog('Total em salasInfo: ' + salasInfo.length, 'inf');
        salasInfo.forEach(s => _diagLog(
            (s.room_id ? '✅' : '❌') + ' ' + s.nome + ' → ' + (s.room_id || 'SEM room_id'),
            s.room_id ? 'ok' : 'err'
        ));

        // ── 4. LEITURA ──
        _diagSep('4. LEITURA DE MENSAGENS');
        for (const sala of salasInfo.slice(0,3)) {
            if (!sala.room_id) { _diagLog('⏭ ' + sala.nome + ' sem room_id', 'warn'); continue; }
            try {
                const _rd = await matrixGet(`/_matrix/client/v3/rooms/${encodeURIComponent(sala.room_id)}/messages`, { dir: 'b', limit: 2 });
                const r = { mensagens: (_rd.chunk||[]).filter(e=>e.type==='m.room.message').map(e=>({sender:e.sender, body:e.content?.body})) };
                if (r && Array.isArray(r.mensagens)) {
                    if (r.mensagens.length > 0)
                        _diagLog('✅ ' + sala.nome + ': ' + r.mensagens.length + ' msg(s) lida(s). Último sender: ' + r.mensagens[0].sender, 'ok');
                    else
                        _diagLog('⚠️ ' + sala.nome + ': lista vazia (bot fora da sala ou sala vazia)', 'warn');
                } else {
                    _diagLog('❌ ' + sala.nome + ': ' + JSON.stringify(r).slice(0,100), 'err');
                }
            } catch(e) { _diagLog('❌ ' + sala.nome + ': ' + e.message, 'err'); }
        }

        // ── 5. ENVIO ──
        _diagSep('5. ENVIO DE MENSAGEM (teste)');
        // Prioriza a sala que teve leitura bem-sucedida (tem mensagens) — evita testar sala que o bot não está
        const salaEnvio = salasInfo.find(s => s.room_id && s._mensagens && s._mensagens.length > 0)
                       || salasInfo.find(s => s.room_id);
        if (salaEnvio) {
            const textoTeste = '[K10·DIAG] Auto-teste ' + new Date().toLocaleTimeString();
            _diagLog('Enviando para: ' + salaEnvio.nome, 'inf');
            try {
                const _txn = 'k10_diag_' + Date.now();
                const r = await matrixPut(`/_matrix/client/v3/rooms/${encodeURIComponent(salaEnvio.room_id)}/send/m.room.message/${_txn}`, { msgtype: 'm.text', body: textoTeste });
                if (r && r.event_id) {
                    _diagLog('✅ Envio OK! event_id: ' + r.event_id, 'ok');
                    window._diagEventId = r.event_id;
                    window._diagSalaEnvio = salaEnvio;
                } else {
                    const motivo = (r && r.erro) ? r.erro : JSON.stringify(r);
                    _diagLog('❌ Envio rejeitado: ' + motivo, 'err');
                    _diagLog('👉 Bot provavelmente fora da sala. Clique em 🔧 Auto-Fix.', 'warn');
                }
            } catch(e) { _diagLog('❌ Erro no envio: ' + e.message, 'err'); }
        } else {
            _diagLog('⏭ Nenhuma sala disponível para teste.', 'warn');
        }

        // ── 6. POLLING ──
        _diagSep('6. POLLING — RECEBER MENSAGENS');
        if (window._diagEventId && window._diagSalaEnvio) {
            _diagLog('Aguardando 5s pelo poll confirmar o envio...', 'inf');
            await new Promise(res => setTimeout(res, 5000));
            const s = salasInfo.find(x => x.room_id === window._diagSalaEnvio.room_id);
            const chegou = s && s.ultimasMensagens && s.ultimasMensagens.has(window._diagEventId);
            if (chegou)
                _diagLog('✅ Polling OK! Mensagem confirmada na fila de recebimento.', 'ok');
            else
                _diagLog('⚠️ Mensagem enviada mas ainda não voltou no poll (delay normal do Matrix ≤30s).', 'warn');
        } else {
            _diagLog('⏭ Pulando (envio não teve sucesso).', 'warn');
        }

        // ── RESUMO ──
        _diagSep('RESUMO FINAL');
        if (window._diagUserId && window._diagEventId)
            _diagLog('🟢 SISTEMA OK — Token válido e envio funcionando!', 'ok');
        else if (window._diagUserId && !window._diagEventId)
            _diagLog('🟡 Token OK mas envio falhou — bot fora da(s) sala(s). Use 🔧 Auto-Fix.', 'warn');
        else
            _diagLog('🔴 Token inválido — configure ACCESS_TOKEN no GAS e faça novo deploy.', 'err');
    };

    window._matrixEntrarSala = async function(alias, nome, cat) {
        const jaAberta = salasInfo.find(s => s.alias === alias);
        if (jaAberta) {
            document.getElementById('matrix-modal-overlay')?.remove();
            window._matrixSelecionarSala(alias);
            return;
        }

        // ── 1. Resolve room_id (funciona sem login) ──
        mostrarToast(`⏳ Conectando em ${nome}...`);
        const roomId = await resolverRoomId(alias);
        if (!roomId) { mostrarToast('❌ Sala não encontrada'); return; }

        // ── 2. Entra na sala SE estiver logado (não bloqueia se não estiver) ──
        if (MATRIX_TOKEN) {
            try {
                const r = await matrixPost(`/_matrix/client/v3/join/${encodeURIComponent(roomId)}`);
                if (r && r.errcode === 'M_UNKNOWN_TOKEN') {
                    MATRIX_TOKEN = ''; localStorage.removeItem('matrixToken');
                }
            } catch(e) { console.warn('[Matrix] join aviso:', e.message); }
        }

        // ── 3. Adiciona à lista e abre (sempre, mesmo sem login) ──
        const isGeral = ALIASES_GERAL.has(alias);
        salasInfo.push({ alias, nome, cat, geral: isGeral, room_id: roomId, ultimasMensagens: new Set(), _historicoCarregado: false, _mensagens: [], _sinceToken: null });
        document.getElementById('matrix-modal-overlay')?.remove();
        renderizarSidebarMatrix();
        window._matrixSelecionarSala(alias);
        mostrarToast(`✅ ${nome} aberta!`);
    };

    // --------------------------------------------------
    // Carrega histórico de uma sala
    // --------------------------------------------------
    async function carregarHistorico(sala, limite = 30) {
        try {
            const dados = await matrixGet(`/_matrix/client/v3/rooms/${encodeURIComponent(sala.room_id)}/messages`, { dir: 'b', limit: Math.min(limite, 50) });
            // Normaliza para o formato esperado
            if (dados.chunk) { dados.mensagens = dados.chunk.filter(ev => ev.type==='m.room.message' && ev.content?.msgtype==='m.text').map(ev => ({ event_id: ev.event_id, sender: ev.sender, body: ev.content.body, timestamp: ev.origin_server_ts })).reverse(); dados.since = dados.start || ''; }
            if (!sala._mensagens) sala._mensagens = [];
            // Guarda o since token para o polling começar a pegar msgs novas daqui
            if (dados.since) sala._sinceToken = dados.since;
            if (dados.mensagens && dados.mensagens.length > 0) {
                for (const msg of dados.mensagens) {
                    if (!sala.ultimasMensagens.has(msg.event_id)) {
                        sala.ultimasMensagens.add(msg.event_id);
                        const hora = new Date(msg.timestamp).toLocaleTimeString();
                        const remetente = msg.sender.split(':')[0];
                        sala._mensagens.push({ body: msg.body, sender: remetente, hora });
                    }
                }
                console.log(`[Matrix] 📜 Histórico: ${dados.mensagens.length} msgs de "${sala.nome}"`);
            }
            if (_salaAtiva === sala.alias) renderizarChatMatrix(sala);
        } catch (e) {
            console.warn(`[Matrix] ⚠️ Sem histórico para "${sala.nome}":`, e);
            if (_salaAtiva === sala.alias) renderizarChatMatrix(sala);
        }
    }

    function renderizarChatGeral() {
        const sala = _getSalaGeral();
        const msgArea = document.getElementById('general-matrix-messages');
        if (!msgArea) return;
        if (!sala || sala._mensagens.length === 0) {
            msgArea.innerHTML = sala && sala._historicoCarregado
                ? '<div id="general-matrix-empty">📭 Nenhuma mensagem ainda. Seja o primeiro!</div>'
                : '<div id="general-matrix-empty">⏳ Carregando mensagens...</div>';
            return;
        }
        msgArea.innerHTML = sala._mensagens.map((m, idx) => {
            const isLocal  = !!m._local;
            const isFailed = !!m._falhou;
            const cls   = isFailed ? 'bubble-failed' : isLocal ? 'bubble-sending' : (m.sender === '👤 Você' ? 'bubble-sent' : '');
            const label = isFailed ? '❌ Você (falhou)' : isLocal ? '⏳ Você (enviando…)' : escapeHtml(m.sender);
            const retry = isFailed
                ? `<span class="matrix-bubble-retry" onclick="window._matrixGeralRetry(${idx})">↩ Tentar novamente</span>`
                : '';
            return `<div class="matrix-chat-bubble ${cls}" data-idx="${idx}">
                <div class="matrix-bubble-name">${label}</div>
                <div>${escapeHtml(m.body)}</div>
                <div class="matrix-bubble-time">${m.hora}${retry}</div>
            </div>`;
        }).join('');
        msgArea.scrollTop = msgArea.scrollHeight;
    }

        bubble.innerHTML = `
            <div class="matrix-bubble-name">${escapeHtml(r)}</div>
