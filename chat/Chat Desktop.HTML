                style={{ backgroundColor: radioState.status !== 'idle' ? '#f1f5f9' : '#8b5cf6', color: radioState.status !== 'idle' ? '#94a3b8' : 'white', border: 'none', padding: '5px 10px', borderRadius: '4px', cursor: radioState.status !== 'idle' ? 'not-allowed' : 'pointer', display: 'flex', alignItems: 'center', gap: '5px', fontSize: '12px', fontWeight: 'bold' }}
                title="Tocar música MP3 para toda a sala">
                <i className="fas fa-music"></i> DJ Rádio
              </button>
            </div>
            <div>
              <button onClick={() => { navigator.clipboard.writeText(peerId); alert('ID copiado!'); }}>Copiar</button>
              <button onClick={generateInviteLink} style={{ marginLeft: '10px', backgroundColor: '#10b981', color: 'white', border: 'none' }}>Gerar Link de Convite</button>
            </div>
          </div>

          {(remoteStreams.length > 0 || isLocalVideoVisible) && (
            <div className="video-container">
              {isLocalVideoVisible && (
                <div>
                  <div className="video-label">Você</div>
                  <video className="local-video-player" ref={localVideoRef} autoPlay muted></video>
                </div>
              )}
              {remoteStreams.map((streamData, index) => (
                streamData.type === 'video' && (
                  <div key={index}>
                    <div className="video-label">{getContactName(streamData.peerId)}</div>
                    <video className="video-player" ref={el => videoRefs.current[streamData.peerId] = el} autoPlay></video>
                  </div>
                )
              ))}
            </div>
          )}

          {activeCalls.map((call, index) => (
            call.type === 'voice' && (
              <div key={index} className="audio-call-container">
                <span>Chamada de voz com {getContactName(call.peerId)}</span>
                <button className="call-end-button" onClick={() => endCall(call.peerId, 'voice')}>Encerrar</button>
                <audio ref={el => audioRefs.current[call.peerId] = el} autoPlay></audio>
                <div style={{ marginTop: '5px' }}>
                  <label style={{ fontSize: '10px' }}>Volume: </label>
                  <input type="range" min="0" max="1" step="0.1" defaultValue="1"
                    onChange={(e) => { if (audioRefs.current[call.peerId]) audioRefs.current[call.peerId].volume = parseFloat(e.target.value); }} />
                </div>
              </div>
            )
          ))}

          {showContacts ? (
            <ContactsScreen
              contacts={contacts}
              setContacts={setContacts}
              onBack={() => setShowContacts(false)}
              onSelectContact={(pId) => { connectToPeer(pId); setSelectedContact(pId); setShowContacts(false); }}
            />
          ) : (
            <UpdatedChatManager
              connections={connections} messages={messages} setMessages={setMessages}
              contacts={contacts} userName={userName} peerId={peerId}
              activeCalls={activeCalls} endCall={endCall} startVoiceCall={startVoiceCall}
              toggleVideoCall={toggleVideoCall} remoteStreams={remoteStreams}
              audioRefs={audioRefs} videoRefs={videoRefs} handleFileChange={handleFileChange}
              fileInputRef={fileInputRef} handleAudioRecording={handleAudioRecording}
              newMessage={newMessage} setNewMessage={setNewMessage}
              showEmojiPanel={showEmojiPanel} setShowEmojiPanel={setShowEmojiPanel}
              populateEmojiPanel={populateEmojiPanel} getContactName={getContactName}
              selectedContact={selectedContact} setSelectedContact={setSelectedContact}
              localVideoRef={localVideoRef}
              registerSentMessage={(id) => seenMessagesRef.current.add(id)}
              cooldownRemaining={cooldownRemaining} setCooldownRemaining={setCooldownRemaining}
              networkSize={networkSize} centralServerId={centralServerId}
            />
          )}
        </div>
      );
    };

    // FIX Bug 7: ReactDOM.render (deprecado no React 18) → createRoot
    const rootEl = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(rootEl);
    reactRoot.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
