<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Bot K10</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f111a; color: #e0e4f0; min-height: 100vh; display: flex; justify-content: center; padding: 28px 16px; }
  .box { width: 100%; max-width: 500px; }
  h1 { font-size: 17px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

  /* conexão */
  .conn-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text], input[type=number] { background: #1a1d2e; border: 1px solid #2a2f45; border-radius: 8px; padding: 9px 12px; color: #e0e4f0; font-size: 13px; font-family: inherit; outline: none; width: 100%; }
  input:focus { border-color: #6c63ff; }
  .btn { background: #6c63ff; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { opacity: .85; } .btn:disabled { opacity: .3; cursor: default; }
  .btn.red { background: #ef4444; } .btn.green { background: #22c55e; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .s-off { background:#1a1d2e; color:#5a6480; } .s-off .dot { background:#5a6480; }
  .s-con { background:#0a0f20; color:#6c63ff; } .s-con .dot { background:#6c63ff; animation:blink .8s infinite; }
  .s-ok  { background:#052011; color:#22c55e; } .s-ok  .dot { background:#22c55e; }
  .s-err { background:#1a0505; color:#ef4444; } .s-err .dot { background:#ef4444; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  hr { border: none; border-top: 1px solid #1e2235; margin: 16px 0; }

  /* subjects */
  .subjects { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .subj { background:#1a1d2e; border:1px solid #2a2f45; border-radius:8px; padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; user-select:none; }
  .subj:hover { border-color:#3a3f60; }
  .subj.checked { background:#1a1a35; border-color:#6c63ff; color:#a8a4ff; }
  .subj .ck { width:15px; height:15px; border-radius:4px; border:1.5px solid #3a3f60; display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0; }
  .subj.checked .ck { background:#6c63ff; border-color:#6c63ff; }
  .subj-all { grid-column:1/-1; }

  .cfg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .cfg label { display:block; font-size:10px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:#5a6480; margin-bottom:5px; }

  /* quiz area */
  #quizArea { display:none; }

  /* progress */
  .prog-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; color:#5a6480; }
  .prog-wrap { background:#1a1d2e; border-radius:99px; height:4px; margin-bottom:16px; }
  .prog-fill { height:4px; border-radius:99px; background:#6c63ff; transition:width .4s; }

  /* timer arc */
  .timer-row { display:flex; justify-content:center; margin-bottom:16px; }
  .timer-svg { position:relative; }
  .timer-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#e0e4f0; }

  /* question card */
  .q-card { background:#1a1d2e; border:1px solid #2a2f45; border-radius:12px; padding:18px; margin-bottom:14px; }
  .q-materia { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#6c63ff; margin-bottom:8px; }
  .q-text { font-size:15px; line-height:1.6; color:#e0e4f0; }

  /* options */
  .options { display:grid; gap:8px; margin-bottom:14px; }
  .opt {
    background: #1a1d2e;
    border: 1px solid #2a2f45;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #e0e4f0;
    transition: border-color .12s, background .12s, transform .1s;
    text-align: left;
    width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: #6c63ff; background: #20224a; transform: translateY(-1px); }
  .opt .ltr { width:28px; height:28px; border-radius:50%; background:#252840; border:1px solid #3a3f60; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; color:#8892b0; }
  .opt:disabled { cursor: default; transform: none; }

  /* estados após resposta */
  .opt.correct { background:#052011; border-color:#22c55e; color:#4ade80; }
  .opt.correct .ltr { background:#22c55e; border-color:#22c55e; color:#fff; }
  .opt.wrong { background:#1a0505; border-color:#ef4444; color:#f87171; }
  .opt.wrong .ltr { background:#ef4444; border-color:#ef4444; color:#fff; }
  .opt.dim { opacity:.35; }

  /* feedback */
  .feedback { border-radius:10px; padding:12px 16px; font-size:14px; font-weight:600; text-align:center; margin-bottom:14px; display:none; }
  .feedback.ok  { background:#052011; color:#22c55e; border:1px solid #15803d; }
  .feedback.err { background:#1a0505; color:#ef4444; border:1px solid #991b1b; }
  .feedback.show { display:block; }

  /* next btn */
  #nextBtn { width:100%; padding:12px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; background:#6c63ff; color:#fff; border:none; display:none; transition:opacity .15s; }
  #nextBtn:hover { opacity:.85; }

  /* score */
  #scoreArea { display:none; text-align:center; padding:24px 0; }
  .score-big { font-size:56px; font-weight:700; }
  .score-sub { font-size:14px; color:#5a6480; margin-top:6px; margin-bottom:20px; }
  .score-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
  .score-box { background:#1a1d2e; border:1px solid #2a2f45; border-radius:10px; padding:14px; }
  .score-val { font-size:22px; font-weight:700; }
  .score-lbl { font-size:10px; color:#5a6480; margin-top:3px; text-transform:uppercase; letter-spacing:.8px; }
  .score-ok  { color:#22c55e; }
  .score-err { color:#ef4444; }
  .score-neu { color:#6c63ff; }

  /* log */
  .log { background:#0d0f18; border:1px solid #1e2235; border-radius:8px; padding:8px 12px; height:80px; overflow-y:auto; font-size:11px; font-family:monospace; color:#3a4260; margin-top:14px; }
  .log .ok{color:#22c55e;} .log .inf{color:#6c63ff;} .log .wrn{color:#f59e0b;} .log .err{color:#ef4444;}
</style>
</head>
<body>
<div class="box">
  <h1>🤖 Quiz Bot K10</h1>

  <!-- CONEXÃO -->
  <div class="conn-row">
    <input type="text" id="serverId" placeholder="ID do servidor (ex: AAAAAA-CENTRAL)" />
    <button class="btn" id="btnConn" onclick="toggleConn()">Conectar</button>
  </div>
  <div id="pill" class="pill s-off" style="margin-bottom:14px"><div class="dot"></div><span id="pillTxt">Desconectado</span></div>

  <!-- CONFIG -->
  <div id="configArea">
    <div class="subjects" id="subjList"></div>
    <div class="cfg" style="grid-template-columns:1fr;">
      <div>
        <label>Tempo por pergunta (s)</label>
        <input type="number" id="timer" value="60" min="5" max="300">
      </div>
    </div>
    <button class="btn green" id="btnStart" onclick="startQuiz()" style="width:100%">▶ Iniciar Quiz</button>
  </div>

  <!-- QUIZ INTERATIVO -->
  <div id="quizArea">
    <div class="prog-row">
      <span id="progTxt" style="font-size:12px;color:#5a6480;">Pergunta <span id="qCount">1</span></span>
      <span id="materiaTxt" style="color:#6c63ff;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;"></span>
      <button class="btn red" onclick="stopQuiz()" style="padding:4px 10px;font-size:11px;">■ Parar</button>
    </div>
    <div class="prog-wrap" style="display:none"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

    <!-- Timer circular -->
    <div class="timer-row">
      <div class="timer-svg" style="width:64px;height:64px;">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="#1a1d2e" stroke-width="5"/>
          <circle id="timerArc" cx="32" cy="32" r="28" fill="none" stroke="#6c63ff" stroke-width="5"
            stroke-dasharray="175.9" stroke-dashoffset="0"
            stroke-linecap="round" transform="rotate(-90 32 32)"/>
        </svg>
        <div class="timer-num" id="timerNum">20</div>
      </div>
    </div>

    <div class="q-card">
      <div class="q-materia" id="qMateria"></div>
      <div class="q-text" id="qText">—</div>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="log" id="logBox"></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// DISCIPLINAS — adicione/remova linhas aqui
// ═══════════════════════════════════════════════════
const SUBJECTS = [
  { id:'mat', name:'Matemática', emoji:'📐', url:'https://andradepsa.github.io/MATEMATICO10//projetos/B/matematica.json' },
  { id:'fis', name:'Física',     emoji:'⚡', url:'https://andradepsa.github.io/MATEMATICO10//projetos/B/fisica.json'     },
  { id:'bio', name:'Biologia',   emoji:'🧬', url:'https://andradepsa.github.io/MATEMATICO10//projetos/B/biologia.json'   },
  { id:'his', name:'História',   emoji:'📜', url:'https://andradepsa.github.io/MATEMATICO10//projetos/B/historia.json'   },
  { id:'geo', name:'Geografia',  emoji:'🌍', url:'https://andradepsa.github.io/MATEMATICO10//projetos/B/geografia.json'  },
  // { id:'qui', name:'Química', emoji:'🧪', url:'https://...' },
];
// ═══════════════════════════════════════════════════

let peer=null, conn=null;
let allQuestions=[], queue=[], qIdx=0, acertos=0, erros=0, totalRespondidas=0;
let tickInterval=null, autoAdvTimer=null, answered=false;
let currentTimer=60;
let selected=new Set();
const L=['A','B','C','D','E','F'];
const CIRC=2*Math.PI*28; // 175.9

// ── Subjects ────────────────────────────────────────
function buildSubjects(){
  const el=document.getElementById('subjList'); el.innerHTML='';
  const all=document.createElement('div');
  all.className='subj subj-all'; all.id='subj-all';
  all.innerHTML='<div class="ck" id="ck-all"></div><span>✅ Todas as disciplinas</span>';
  all.onclick=toggleAll; el.appendChild(all);
  SUBJECTS.forEach(s=>{
    const d=document.createElement('div');
    d.className='subj'; d.id='subj-'+s.id;
    d.innerHTML=`<div class="ck" id="ck-${s.id}"></div><span>${s.emoji} ${s.name}</span>`;
    d.onclick=()=>toggleSubj(s.id); el.appendChild(d);
  });
}
function toggleSubj(id){ selected.has(id)?selected.delete(id):selected.add(id); refreshUI(); }
function toggleAll(){ selected.size===SUBJECTS.length?selected.clear():SUBJECTS.forEach(s=>selected.add(s.id)); refreshUI(); }
function refreshUI(){
  const all=selected.size===SUBJECTS.length;
  setChk('all',all);
  SUBJECTS.forEach(s=>setChk(s.id,selected.has(s.id)));
}
function setChk(id,on){
  const el=document.getElementById('subj-'+id), ck=document.getElementById('ck-'+id);
  if(!el)return; el.classList.toggle('checked',on); ck.textContent=on?'✓':'';
}

// ── PeerJS ──────────────────────────────────────────
function setStatus(cls,txt){ document.getElementById('pill').className='pill '+cls; document.getElementById('pillTxt').textContent=txt; }
function toggleConn(){ (peer&&!peer.destroyed)?disconnect():connect(); }

function connect(){
  const sid=document.getElementById('serverId').value.trim();
  if(!sid){ log('Digite o ID do servidor','wrn'); return; }
  setStatus('s-con','Conectando...'); document.getElementById('btnConn').disabled=true;
  const botId='QuizBot'+Math.random().toString(36).substr(2,5).toUpperCase();
  peer=new Peer(botId,{host:'0.peerjs.com',port:443,secure:true});
  peer.on('open',()=>{
    log('Bot: '+botId,'inf');
    conn=peer.connect(sid);
    conn.on('open',()=>{ setStatus('s-ok','Conectado ✓'); document.getElementById('btnConn').textContent='Desconectar'; document.getElementById('btnConn').disabled=false; log('Servidor: '+sid,'ok'); send('🤖 Quiz Bot conectado!'); });
    conn.on('close',()=>{ setStatus('s-off','Desconectado'); document.getElementById('btnConn').textContent='Conectar'; document.getElementById('btnConn').disabled=false; });
    conn.on('error',()=>{ setStatus('s-err','Erro'); document.getElementById('btnConn').disabled=false; });
  });
  peer.on('error',(e)=>{ setStatus('s-err','Erro: '+e.type); document.getElementById('btnConn').disabled=false; document.getElementById('btnConn').textContent='Conectar'; log(e.type,'err'); });
}
function disconnect(){ try{conn&&conn.close(); peer&&peer.destroy();}catch(e){} peer=null; conn=null; setStatus('s-off','Desconectado'); document.getElementById('btnConn').textContent='Conectar'; }
function send(text){ if(!conn)return; try{conn.send({type:'message',text,senderName:'🤖 Quiz Bot',id:Date.now().toString(36)+Math.random().toString(36).substr(2,4),ttl:8});}catch(e){} }

// ── Quiz ────────────────────────────────────────────
async function startQuiz(){
  if(selected.size===0){ log('Selecione ao menos uma disciplina!','wrn'); return; }
  const timer=parseInt(document.getElementById('timer').value)||60;
  currentTimer=timer;
  log('Carregando...','inf');
  allQuestions=[];
  for(const sid of selected){
    const s=SUBJECTS.find(x=>x.id===sid); if(!s)continue;
    try{
      const r=await fetch(s.url); const data=await r.json();
      const arr=Array.isArray(data)?data:(Object.values(data).find(v=>Array.isArray(v))||[]);
      const valid=arr.filter(p=>p.pergunta&&Array.isArray(p.opcoes)&&typeof p.correta==='number');
      log(s.name+': '+valid.length+' perguntas','ok');
      allQuestions=allQuestions.concat(valid.map(p=>({...p,_mat:s.name})));
    }catch(e){ log('Erro '+s.name+': '+e.message,'err'); }
  }
  if(allQuestions.length===0){ log('Nenhuma pergunta carregada!','err'); return; }
  queue=allQuestions.sort(()=>Math.random()-.5).slice();
  qIdx=0; acertos=0; erros=0; totalRespondidas=0;
  document.getElementById('configArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  const mats=[...selected].map(id=>SUBJECTS.find(s=>s.id===id)?.name).filter(Boolean).join(', ');
  send('🎯 *Quiz iniciando!*\n📚 '+mats+'\n⏱️ '+timer+'s por pergunta\n♾️ Perguntas contínuas');
  showQ();
}

function showQ(){
  // Reshuffle when queue is exhausted
  if(qIdx>=queue.length){
    queue=allQuestions.sort(()=>Math.random()-.5).slice();
    qIdx=0;
    log('Fila reiniciada ('+queue.length+' perguntas)','inf');
  }
  const q=queue[qIdx]; answered=false;
  clearTimeout(autoAdvTimer);

  // UI update
  totalRespondidas++;
  document.getElementById('qCount').textContent=totalRespondidas;
  document.getElementById('materiaTxt').textContent=q._mat||'';

  // question card
  document.getElementById('qMateria').textContent=q._mat||'';
  document.getElementById('qText').textContent=q.pergunta;

  // options
  const opts=document.getElementById('options'); opts.innerHTML='';
  q.opcoes.forEach((op,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="ltr">${L[i]}</span><span>${op}</span>`;
    b.onclick=()=>answer(i,q);
    opts.appendChild(b);
  });

  // feedback reset
  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.textContent='';

  // send to server — clean format
  let optsText='';
  q.opcoes.forEach((op,i)=>{ optsText+=`\n${L[i]}) ${op}`; });
  const txt=`🎯 *${q._mat||'Quiz'}*\n${q.pergunta}\n${optsText}\n\n⏱️ ${currentTimer} segundos!`;
  send(txt);

  // start timer
  startTimer(currentTimer, q);
}

function startTimer(sec, q){
  clearInterval(tickInterval);
  let remaining=sec;
  const arc=document.getElementById('timerArc');
  const num=document.getElementById('timerNum');
  arc.style.stroke='#6c63ff';

  function tick(){
    remaining--;
    const pct=remaining/sec;
    arc.style.stroke=pct<.3?'#ef4444':pct<.6?'#f59e0b':'#6c63ff';
    arc.setAttribute('stroke-dashoffset', CIRC*(1-pct));
    num.textContent=remaining;
    if(remaining<=0){
      clearInterval(tickInterval);
      if(!answered) timeUp(q);
    }
  }

  arc.setAttribute('stroke-dashoffset','0');
  num.textContent=sec;
  tickInterval=setInterval(tick,1000);
}

function answer(idx, q){
  if(answered) return;
  answered=true;
  clearInterval(tickInterval);

  const opts=document.querySelectorAll('.opt');
  const fb=document.getElementById('feedback');

  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.correta){ b.classList.add('correct'); }
    else if(i===idx && idx!==q.correta){ b.classList.add('wrong'); }
    else { b.classList.add('dim'); }
  });

  const correto=(idx===q.correta);
  if(correto){ acertos++; fb.className='feedback ok show'; fb.textContent='✅ Correto!'; send('✅ *'+L[q.correta]+') '+q.opcoes[q.correta]+'*'); }
  else       { erros++;   fb.className='feedback err show'; fb.textContent='❌ Errado! A resposta era '+L[q.correta]+') '+q.opcoes[q.correta]; send('❌ *Resposta: '+L[q.correta]+') '+q.opcoes[q.correta]+'*'); }

  const arc=document.getElementById('timerArc'); arc.style.stroke=correto?'#22c55e':'#ef4444';
  autoAdvTimer=setTimeout(()=>{ qIdx++; showQ(); }, 4000);
}

function timeUp(q){
  answered=true;
  erros++;
  const opts=document.querySelectorAll('.opt');
  opts.forEach((b,i)=>{ b.disabled=true; if(i===q.correta)b.classList.add('correct'); else b.classList.add('dim'); });
  const fb=document.getElementById('feedback');
  fb.className='feedback err show';
  fb.textContent='⏱️ Tempo esgotado! Era '+L[q.correta]+') '+q.opcoes[q.correta];
  send('⏱️ Tempo! *Resposta: '+L[q.correta]+') '+q.opcoes[q.correta]+'*');
  autoAdvTimer=setTimeout(()=>{ qIdx++; showQ(); }, 4000);
}

function nextQ(){ qIdx++; showQ(); }

function stopQuiz(){
  clearInterval(tickInterval);
  clearTimeout(autoAdvTimer);
  document.getElementById('quizArea').style.display='none';
  document.getElementById('configArea').style.display='block';
  const pct=totalRespondidas>0?Math.round(acertos/totalRespondidas*100):0;
  send('⏹️ *Quiz encerrado!*\nRespondidas: '+totalRespondidas+' | Acertos: '+acertos+' ('+pct+'%)');
  log('Parado. Acertos: '+acertos+'/'+totalRespondidas,'wrn');
}

// ── Log ──────────────────────────────────────────────
function log(msg,cls='inf'){ const b=document.getElementById('logBox'); b.innerHTML+=`<div class="${cls}">[${new Date().toLocaleTimeString('pt-BR')}] ${msg}</div>`; b.scrollTop=b.scrollHeight; }

buildSubjects();
</script>
</body>
</html>
