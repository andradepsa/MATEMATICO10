<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat K10</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    #root { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .app-header { display: flex; justify-content: space-between; align-items: center; background-color: #007bff; color: white; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; }
    .app-title { margin: 0; font-size: 24px; }
    .header-buttons { display: flex; gap: 10px; }
    .header-button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    .user-info-container { background-color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .username { font-weight: bold; color: #333; }
    .user-edit-button { background-color: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    .user-name-form { display: flex; gap: 10px; align-items: center; }
    .user-name-form input { padding: 8px; border: 1px solid #ddd; border-radius: 3px; width: 200px; }
    .user-name-form button { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; }
    .user-name-form button:disabled { background-color: #ccc; cursor: not-allowed; }
    .peer-id-container { background-color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .peer-id-container button { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; }
    .chat-main-container { display: flex; gap: 20px; height: calc(100vh - 300px); }
    .conversations-list { width: 300px; background-color: white; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-y: auto; }
    .conversation-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
    .conversation-item.selected { background-color: #e6f3ff; }
    .conversation-item.central-server { border-left: 4px solid #ffc107 !important; }
    .conversation-name { font-weight: bold; color: #333; }
    .conversation-peer-id { font-size: 12px; color: #666; }
    .chat-messages-container { flex: 1; display: flex; flex-direction: column; background-color: white; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message-bubble { max-width: 70%; padding: 10px; border-radius: 10px; position: relative; word-wrap: break-word; }
    .message-bubble.sent { background-color: #007bff; color: white; align-self: flex-end; }
    .message-bubble.received { background-color: #e9ecef; color: #333; align-self: flex-start; }
    .chat-user-bubble { font-size: 12px; font-weight: bold; margin-bottom: 5px; }
    .message-timestamp { font-size: 10px; color: #999; margin-top: 5px; text-align: right; }
    .file-link { color: inherit; text-decoration: underline; }
    .audio-player { width: 200px; margin-top: 5px; }
    .chat-input-container { display: flex; padding: 10px; border-top: 1px solid #eee; gap: 10px; align-items: center; }
    .voice-button { padding: 8px; background-color: #4CAF50; color: white; border: none; border-radius: 50%; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .voice-button.recording { background-color: #ff5722; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .voice-button:disabled { background-color: #ccc; cursor: not-allowed; }
    .chat-input-container button { padding: 8px; background-color: #007bff; color: white; border: none; border-radius: 50%; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .chat-input-container button:disabled { background-color: #ccc; cursor: not-allowed; }
    .message-input-container { flex: 1; position: relative; display: flex; align-items: center; }
    .emoji-button { background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 5px; }
    .message-input { width: 100%; padding: 8px 40px 8px 40px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    .message-input:disabled { background-color: #f4f4f4; cursor: not-allowed; }
    .emoji-panel { position: absolute; bottom: 50px; left: 0; background-color: white; border: 1px solid #ddd; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); width: 300px; max-height: 200px; display: flex; flex-direction: column; z-index: 100; }
    .emoji-panel-header { background-color: #007bff; color: white; padding: 5px 10px; font-weight: bold; }
    .emoji-panel-content { display: flex; flex-wrap: wrap; padding: 10px; overflow-y: auto; }
    .emoji-item { font-size: 24px; padding: 5px; cursor: pointer; }
    .emoji-panel-footer { padding: 5px 10px; border-top: 1px solid #ddd; }
    .barra-rolagem-label { font-size: 12px; color: #666; }
    .contact-form { background-color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .contact-form-row { display: flex; gap: 10px; align-items: flex-start; }
    .contact-form input { padding: 8px; border: 1px solid #ddd; border-radius: 3px; flex: 1; }
    .contact-form button { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; }
    .connected-peers { background-color: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .peer-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
    .peer-item:last-child { border-bottom: none; }
    .peer-item button { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    .error-message { background-color: #f8d7da; color: #721c24; padding: 20px; border-radius: 5px; text-align: center; margin: 20px; }
    .error-message button { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; margin-top: 10px; }
    .progress-container { margin-top: 5px; }
    .progress-bar { width: 100%; background-color: #f0f0f0; border-radius: 5px; overflow: hidden; }
    .progress { height: 5px; background-color: #007bff; transition: width 0.3s ease; }
    .green-delete-icon { position: absolute; top: 5px; right: 5px; color: #28a745; cursor: pointer; font-size: 14px; }
    .green-delete-icon:hover { color: #218838; }
    .video-container { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .video-player, .local-video-player { width: 320px; height: 240px; background-color: #000; border-radius: 5px; }
    .local-video-player { border: 2px solid #007bff; }
    .video-label { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    .audio-call-container { background-color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .call-end-button { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }

    /* ===================== E2EE STYLES ===================== */
    .private-mode-toggle {
      background: none; border: 1px solid #10b981; color: #10b981;
      border-radius: 50%; padding: 0; font-size: 16px; font-weight: bold;
      cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .private-mode-toggle.active { background-color: #10b981; color: white; }
    .private-mode-toggle:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---- Send Secret Modal ---- */
    .secret-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .secret-modal {
      background: #0f2744; border-radius: 16px; padding: 32px 36px;
      max-width: 500px; width: 95%; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      border: 1px solid #1e4d8c; color: #e0f0ff;
      max-height: 90vh; overflow-y: auto;
    }
    .secret-modal h3 { margin: 0 0 6px; font-size: 20px; color: #10b981; }
    .secret-modal .sm-subtitle { margin: 0 0 20px; font-size: 13px; color: #7eb3d8; }
    .sm-section { margin-bottom: 18px; }
    .sm-label { display: block; font-size: 11px; color: #7eb3d8; margin-bottom: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .sm-contact-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
    .sm-contact-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #162a44; border: 1px solid #1e4d8c; border-radius: 8px;
      padding: 10px 14px; cursor: pointer; transition: all 0.15s;
    }
    .sm-contact-item:hover { border-color: #10b981; background: #0d2238; }
    .sm-contact-item.selected { border-color: #10b981; background: #0a2a1a; }
    .sm-contact-item.is-server { opacity: 0.4; cursor: not-allowed; }
    .sm-contact-name { font-size: 14px; font-weight: bold; }
    .sm-contact-id { font-size: 11px; color: #7eb3d8; margin-top: 2px; }
    .sm-server-tag { font-size: 10px; background: #fbbf24; color: #78350f; border-radius: 4px; padding: 2px 6px; font-weight: bold; }
    .sm-e2ee-tag { font-size: 10px; background: #10b981; color: #fff; border-radius: 4px; padding: 2px 6px; font-weight: bold; }
    .sm-secret-display {
      background: #0a1a33; border: 1px solid #1e4d8c; border-radius: 8px;
      padding: 12px 14px; font-family: monospace; font-size: 12px;
      color: #34d399; word-break: break-all; line-height: 1.6;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .sm-secret-text { flex: 1; }
    .sm-copy-btn { background: #1e4d8c; border: none; color: #7eb3d8; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .sm-copy-btn:hover { background: #2563eb; color: white; }
    .sm-info-box {
      background: #0a2210; border: 1px solid #10b981; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; color: #6ee7b7; margin-top: 12px;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .sm-warning-box {
      background: #1c1200; border: 1px solid #f59e0b; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; color: #fcd34d; margin-top: 8px;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .sm-btn-row { display: flex; gap: 10px; margin-top: 22px; }
    .sm-btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: bold; font-size: 14px; cursor: pointer; transition: opacity 0.15s;
    }
    .sm-btn:hover { opacity: 0.88; }
    .sm-btn.green { background: #10b981; color: white; }
    .sm-btn.blue { background: #3b82f6; color: white; }
    .sm-btn.gray { background: #334155; color: #94a3b8; }
    .sm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sm-status { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; }
    .sm-status.ok { background: #0a2210; color: #34d399; border: 1px solid #10b981; }
    .sm-status.err { background: #2a0a0a; color: #f87171; border: 1px solid #ef4444; }
    .sm-status.info { background: #0c1a33; color: #93c5fd; border: 1px solid #3b82f6; }

    /* ---- Server E2EE badge in conversation list ---- */
    .server-e2ee-btn {
      padding: 4px; width: 30px; height: 30px; border-radius: 50%;
      color: white; border: none; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .server-e2ee-btn.active { background: #10b981 !important; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .server-e2ee-btn.inactive { background: #475569; }

    /* ---- Server E2EE banner in chat ---- */
    .server-e2ee-banner {
      padding: 8px 14px; display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: bold; border-top: 1px solid;
    }
    .server-e2ee-banner.active {
      background: #f0fdf4; border-color: #bbf7d0; color: #059669;
    }
    .server-e2ee-banner.inactive {
      background: #fff7ed; border-color: #fed7aa; color: #c2410c;
    }

    /* ---- E2EE badge in bubbles ---- */
    .msg-encrypted-badge {
      display: inline-flex; align-items: center; gap: 3px;
      background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4);
      border-radius: 4px; padding: 1px 6px; font-size: 10px; color: #10b981;
      margin-bottom: 4px; font-weight: bold;
    }
    .msg-encrypted-badge.group { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #3b82f6; }
    .msg-encrypted-locked { font-size: 12px; color: #f59e0b; font-style: italic; }
    .msg-no-key { font-size: 11px; color: #94a3b8; font-style: italic; }

    /* ===================== DARK MODE ===================== */
    body.dark-mode { background-color: #121212; color: #e0e0e0; }
    .dark-mode .app-header { background-color: #1f1f1f; }
    .dark-mode .user-info-container, .dark-mode .peer-id-container, .dark-mode .contact-form,
    .dark-mode .connected-peers, .dark-mode .chat-messages-container, .dark-mode .conversations-list,
    .dark-mode .audio-call-container { background-color: #1e1e1e; color: #e0e0e0; }
    .dark-mode .message-bubble.received { background-color: #2e2e2e; color: #e0e0e0; }
    .dark-mode .message-input { background-color: #333; color: #fff; border: 1px solid #555; }
    .dark-mode .emoji-panel { background-color: #2a2a2a; border-color: #444; }
    .dark-mode .conversation-name { color: #e0e0e0; }
    .dark-mode .conversation-peer-id { color: #999; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // =====================================================================
    // AES-GCM E2EE HELPERS
    // =====================================================================
    async function deriveKey(secret) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("chat-k10-e2ee-2026"), iterations: 600000, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
      );
    }

    async function encryptMsg(text, secret) {
      const key = await deriveKey(secret);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      const combined = new Uint8Array(iv.length + cipher.byteLength);
      combined.set(iv, 0); combined.set(new Uint8Array(cipher), 12);
      return btoa(String.fromCharCode(...combined));
    }

    async function decryptMsg(b64, secret) {
      const key = await deriveKey(secret);
      const data = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const iv = data.slice(0, 12), cipher = data.slice(12);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
      return new TextDecoder().decode(plain);
    }

    function generateSecret() {
      return Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2,'0')).join('');
    }

    const E2EE_PREFIX = "\u{1F512}E2EE:";
    const GROUP_E2EE_PREFIX = "\u{1F6E1}GRP:";
    // =====================================================================

    class ErrorBoundary extends React.Component {
      state = { error: null };
      static getDerivedStateFromError(error) { return { error }; }
      render() {
        if (this.state.error) return (
          <div className="error-message">
            <h1>Erro na aplicação</h1>
            <p>{this.state.error.message}</p>
          </div>
        );
        return this.props.children;
      }
    }

    const PEER_ID_STORAGE_KEY = 'p2pChatClientId';
    const MESSAGES_STORAGE_KEY = 'p2pChatMessages';

    const usePersistentId = () => {
      const [peerId, setPeerId] = useState('');
      const generateId = () => {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const buffer = new Uint8Array(9);
        crypto.getRandomValues(buffer);
        return Array.from(buffer).map(b => chars[b % chars.length]).join('');
      };
      useEffect(() => {
        const savedId = localStorage.getItem(PEER_ID_STORAGE_KEY);
        if (savedId) { setPeerId(savedId); }
        else { const newId = generateId(); localStorage.setItem(PEER_ID_STORAGE_KEY, newId); setPeerId(newId); }
      }, []);
      return [peerId, setPeerId];
    };

    // =====================================================================
    // SendSecretModal — envia segredo via P2P direto, bloqueia servidor
    // =====================================================================
    const SendSecretModal = ({ connections, contacts, getContactName, isCentralServer, onSend, onClose, e2eeState }) => {
      const [selectedPeer, setSelectedPeer] = useState(null);
      const [mySecret] = useState(() => generateSecret());
      const [status, setStatus] = useState(null);
      const [sent, setSent] = useState(false);

      const eligibleConns = connections.filter(c => c.open && !isCentralServer(c.peer));

      const handleSend = () => {
        if (!selectedPeer) { setStatus({ type: 'err', msg: 'Selecione um contato.' }); return; }
        const conn = connections.find(c => c.peer === selectedPeer && c.open);
        if (!conn) { setStatus({ type: 'err', msg: 'Contato não está conectado.' }); return; }
        try {
          conn.send({ type: 'e2ee-secret', secret: mySecret, direct: true });
          onSend(selectedPeer, mySecret);
          setSent(true);
          setStatus({ type: 'ok', msg: `Segredo enviado para ${getContactName(selectedPeer)}! Você já pode usar o Modo Privado.` });
        } catch (err) {
          setStatus({ type: 'err', msg: 'Falha ao enviar: ' + err.message });
        }
      };

      const copySecret = () => {
        navigator.clipboard.writeText(mySecret);
        setStatus({ type: 'info', msg: 'Segredo copiado! (Envie só como alternativa de backup)' });
      };

      return (
        <div className="secret-modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="secret-modal">
            <h3>🔑 Enviar Segredo Privado</h3>
            <p className="sm-subtitle">
              Escolha com quem trocar o segredo. Ele será enviado diretamente via P2P — só essa pessoa recebe.
            </p>

            <div className="sm-section">
              <span className="sm-label">Selecione o contato</span>
              {eligibleConns.length === 0 ? (
                <div style={{ color: '#f87171', fontSize: '13px', padding: '10px 0' }}>
                  ⚠️ Nenhum contato conectado disponível (servidores centrais são bloqueados).
                </div>
              ) : (
                <div className="sm-contact-list">
                  {connections.map((conn, i) => {
                    const isServer = isCentralServer(conn.peer);
                    const hasE2EE = !!e2eeState[conn.peer];
                    const isOpen = conn.open;
                    return (
                      <div key={i}
                        className={`sm-contact-item${isServer ? ' is-server' : ''}${selectedPeer === conn.peer ? ' selected' : ''}${!isOpen ? ' is-server' : ''}`}
                        onClick={() => { if (!isServer && isOpen) setSelectedPeer(conn.peer); }}
                        title={isServer ? 'Não é possível enviar segredo ao servidor central' : !isOpen ? 'Contato offline' : ''}
                      >
                        <div>
                          <div className="sm-contact-name">{getContactName(conn.peer)}</div>
                          <div className="sm-contact-id">{conn.peer}</div>
                        </div>
                        <div style={{ display: 'flex', gap: '4px', alignItems: 'center' }}>
                          {isServer && <span className="sm-server-tag">SERVIDOR</span>}
                          {!isOpen && !isServer && <span className="sm-server-tag" style={{ background: '#dc2626', color: 'white' }}>OFFLINE</span>}
                          {hasE2EE && !isServer && <span className="sm-e2ee-tag">🔒 E2EE</span>}
                          {selectedPeer === conn.peer && <span style={{ color: '#10b981', fontSize: '18px' }}>✓</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {selectedPeer && (
              <div className="sm-section">
                <span className="sm-label">Seu segredo gerado (será enviado automaticamente)</span>
                <div className="sm-secret-display">
                  <span className="sm-secret-text">{mySecret.substring(0, 24)}...{mySecret.substring(mySecret.length - 8)}</span>
                  <button className="sm-copy-btn" onClick={copySecret} title="Copiar segredo completo">📋 Copiar</button>
                </div>
                <div className="sm-info-box">
                  <span>✅</span>
                  <span>O segredo é enviado diretamente pela conexão P2P criptografada — <strong>nenhum servidor intermediário vê esse dado</strong>.</span>
                </div>
                <div className="sm-warning-box">
                  <span>⚠️</span>
                  <span>A outra pessoa também precisa te enviar o segredo <em>dela</em> para que você possa ler as mensagens dela.</span>
                </div>
              </div>
            )}

            {status && (
              <div className={`sm-status ${status.type}`}>{status.msg}</div>
            )}

            <div className="sm-btn-row">
              {!sent ? (
                <button className="sm-btn green" onClick={handleSend} disabled={!selectedPeer || eligibleConns.length === 0}>
                  🚀 Enviar Segredo Agora
                </button>
              ) : (
                <button className="sm-btn green" onClick={onClose}>✅ Fechar</button>
              )}
              <button className="sm-btn gray" onClick={onClose}>Cancelar</button>
            </div>
          </div>
        </div>
      );
    };

    // =====================================================================
    // ServerE2EEModal — estende criptografia ao servidor (modo grupo)
    // =====================================================================
    const ServerE2EEModal = ({ serverId, connections, e2eeState, getContactName, onActivate, onDeactivate, onClose, currentServerE2EE }) => {
      const [groupSecret] = useState(() => currentServerE2EE?.groupSecret || generateSecret());
      const [status, setStatus] = useState(null);
      const [activated, setActivated] = useState(false);
      const isAlreadyActive = currentServerE2EE?.active;

      // Contatos que já têm E2EE comigo (mySecret configurado) e não são o servidor
      const eligiblePeers = Object.entries(e2eeState)
        .filter(([pid, state]) => state.mySecret && pid !== serverId)
        .map(([pid]) => ({ pid, isOnline: connections.some(c => c.peer === pid && c.open) }));

      const handleActivate = () => {
        let sentCount = 0;
        eligiblePeers.forEach(({ pid, isOnline }) => {
          if (!isOnline) return;
          const conn = connections.find(c => c.peer === pid && c.open);
          if (conn) {
            try {
              conn.send({ type: 'server-e2ee-invite', serverId, groupSecret });
              sentCount++;
            } catch(e) {}
          }
        });
        onActivate(serverId, groupSecret);
        setActivated(true);
        setStatus({
          type: 'ok',
          msg: `🛡️ Criptografia de grupo ativada! Segredo enviado para ${sentCount} contato(s) online. Mensagens no servidor agora são criptografadas.`
        });
      };

      const handleDeactivate = () => {
        onDeactivate(serverId);
        onClose();
      };

      return (
        <div className="secret-modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="secret-modal">
            <h3>🛡️ Criptografia de Grupo no Servidor</h3>
            <p className="sm-subtitle">
              Estende sua criptografia E2EE para o servidor <strong style={{color:'#fbbf24'}}>{serverId}</strong>.
              Mensagens passam pelo servidor já criptografadas — ele não consegue ler nada.
            </p>

            {isAlreadyActive && !activated && (
              <div className="sm-info-box" style={{ marginBottom: '16px' }}>
                <span>🟢</span>
                <span><strong>Criptografia de grupo já está ativa</strong> neste servidor. Você pode reenviar o segredo para novos contatos ou desativar.</span>
              </div>
            )}

            <div className="sm-section">
              <span className="sm-label">
                Contatos com E2EE ativo ({eligiblePeers.length}) — receberão o segredo de grupo
              </span>
              {eligiblePeers.length === 0 ? (
                <div style={{ color: '#f87171', fontSize: '13px', padding: '10px 0' }}>
                  ⚠️ Nenhum contato com E2EE configurado.<br />
                  Primeiro troque segredos individuais com seus contatos usando o botão 🔑.
                </div>
              ) : (
                <div className="sm-contact-list">
                  {eligiblePeers.map(({ pid, isOnline }) => (
                    <div key={pid} className="sm-contact-item selected">
                      <div>
                        <div className="sm-contact-name">{getContactName(pid)}</div>
                        <div className="sm-contact-id">{pid}</div>
                      </div>
                      <div style={{ display: 'flex', gap: '4px' }}>
                        <span className="sm-e2ee-tag">🔒 E2EE</span>
                        {isOnline
                          ? <span className="sm-e2ee-tag" style={{ background: '#3b82f6' }}>ONLINE</span>
                          : <span className="sm-server-tag" style={{ background: '#dc2626', color: 'white' }}>OFFLINE</span>
                        }
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="sm-section">
              <span className="sm-label">Segredo de grupo (gerado automaticamente)</span>
              <div className="sm-secret-display">
                <span className="sm-secret-text">{groupSecret.substring(0, 20)}...{groupSecret.substring(groupSecret.length - 8)}</span>
                <button className="sm-copy-btn" onClick={() => { navigator.clipboard.writeText(groupSecret); setStatus({ type: 'info', msg: 'Segredo copiado!' }); }}>📋 Copiar</button>
              </div>
            </div>

            <div className="sm-info-box">
              <span>🛡️</span>
              <div>
                <strong>Como funciona:</strong><br />
                O segredo de grupo é enviado via P2P direto (nunca pelo servidor) para todos os contatos listados.
                A partir daí, toda mensagem enviada para o servidor sai criptografada — o servidor só vê texto ilegível.
                Usuários sem o segredo não conseguem ler.
              </div>
            </div>

            <div className="sm-warning-box">
              <span>⚠️</span>
              <span>Contatos OFFLINE não receberão o segredo agora. Reenvie depois que ficarem online.</span>
            </div>

            {status && <div className={`sm-status ${status.type}`}>{status.msg}</div>}

            <div className="sm-btn-row">
              {!activated ? (
                <>
                  <button className="sm-btn green" onClick={handleActivate} disabled={eligiblePeers.length === 0}>
                    🛡️ {isAlreadyActive ? 'Reenviar Segredo' : 'Ativar Criptografia de Grupo'}
                  </button>
                  {isAlreadyActive && (
                    <button className="sm-btn gray" onClick={handleDeactivate} style={{ background: '#dc2626', color: 'white' }}>
                      🔓 Desativar
                    </button>
                  )}
                </>
              ) : (
                <button className="sm-btn green" onClick={onClose}>✅ Fechar</button>
              )}
              <button className="sm-btn gray" onClick={onClose}>Cancelar</button>
            </div>
          </div>
        </div>
      );
    };

    // =====================================================================
    // VoiceRecorder
    // =====================================================================
    const VoiceRecorder = ({ onRecordingComplete, disabled, selectedContact }) => {
      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          mediaRecorderRef.current.ondataavailable = (event) => { if (event.data.size > 0) audioChunksRef.current.push(event.data); };
          mediaRecorderRef.current.onstop = () => {
            if (audioChunksRef.current.length === 0) return;
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            onRecordingComplete(audioBlob, selectedContact);
            audioChunksRef.current = [];
            stream.getTracks().forEach(t => t.stop());
          };
          audioChunksRef.current = [];
          mediaRecorderRef.current.start(200);
          setIsRecording(true);
        } catch (err) { alert('Erro ao acessar o microfone: ' + err.message); }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          try { mediaRecorderRef.current.stop(); } catch (e) {}
          setIsRecording(false);
        }
      };

      return (
        <button className={`voice-button ${isRecording ? 'recording' : ''}`}
          onClick={() => isRecording ? stopRecording() : startRecording()}
          disabled={disabled} title="Gravar áudio">
          <i className="fas fa-microphone"></i>
        </button>
      );
    };

    // =====================================================================
    // ContactsScreen
    // =====================================================================
    const ContactsScreen = ({ contacts, setContacts, onBack, onSelectContact }) => {
      const [newName, setNewName] = useState('');
      const [newPeerId, setNewPeerId] = useState('');
      const [nameError, setNameError] = useState('');
      const [idError, setIdError] = useState('');

      const handleAddContact = (e) => {
        e.preventDefault();
        let valid = true;
        if (!newName.trim()) { setNameError('Nome é obrigatório'); valid = false; } else setNameError('');
        if (!newPeerId.trim()) { setIdError('ID é obrigatório'); valid = false; } else setIdError('');
        if (!valid) return;
        const newContact = { name: newName, peerId: newPeerId };
        setContacts(prev => { const updated = [...prev, newContact]; localStorage.setItem('p2pContacts', JSON.stringify(updated)); return updated; });
        setNewName(''); setNewPeerId('');
      };

      const handleRemoveContact = (peerId, e) => {
        e.stopPropagation();
        setContacts(prev => { const updated = prev.filter(c => c.peerId !== peerId); localStorage.setItem('p2pContacts', JSON.stringify(updated)); return updated; });
      };

      return (
        <div>
          <button onClick={onBack} style={{ marginBottom: '20px' }}>← Voltar</button>
          <h2>Lista de Contatos</h2>
          <form className="contact-form" onSubmit={handleAddContact}>
            <div className="contact-form-row">
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <input type="text" placeholder="Nome do contato" value={newName} onChange={e => setNewName(e.target.value)} style={{ borderColor: nameError ? 'red' : '#ddd' }} />
                {nameError && <span style={{ color: 'red', fontSize: '12px' }}>{nameError}</span>}
              </div>
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <input type="text" placeholder="ID do contato" value={newPeerId} onChange={e => setNewPeerId(e.target.value)} style={{ borderColor: idError ? 'red' : '#ddd' }} />
                {idError && <span style={{ color: 'red', fontSize: '12px' }}>{idError}</span>}
              </div>
              <button type="submit">Adicionar</button>
            </div>
          </form>
          <div className="connected-peers">
            {contacts.length === 0 ? <p>Nenhum contato adicionado ainda.</p> : contacts.map((contact, i) => (
              <div key={i} className="peer-item" onClick={() => onSelectContact(contact.peerId)}>
                <span style={{ flex: 1 }}>{contact.name} - {contact.peerId}</span>
                <button onClick={(e) => handleRemoveContact(contact.peerId, e)} style={{ marginLeft: '10px' }}>🗑️</button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // =====================================================================
    // UpdatedChatManager — E2EE + Server Group E2EE
    // =====================================================================
    const UpdatedChatManager = ({
      connections, messages, setMessages, contacts, userName, peerId,
      activeCalls, endCall, startVoiceCall, toggleVideoCall, remoteStreams,
      audioRefs, videoRefs, handleFileChange, fileInputRef, handleAudioRecording,
      newMessage, setNewMessage, showEmojiPanel, setShowEmojiPanel, populateEmojiPanel,
      getContactName, selectedContact, setSelectedContact, localVideoRef,
      registerSentMessage, cooldownRemaining, setCooldownRemaining, networkSize, centralServerId,
      e2eeState, setE2eeState, isCentralServer,
      serverE2EE, setServerE2EE
    }) => {
      const messagesEndRef = useRef(null);
      const [showSendSecretModal, setShowSendSecretModal] = useState(false);
      const [showServerE2EEModal, setShowServerE2EEModal] = useState(false);

      const formatTime = (date) => {
        const h = date.getHours().toString().padStart(2,'0');
        const m = date.getMinutes().toString().padStart(2,'0');
        const s = date.getSeconds().toString().padStart(2,'0');
        return `${h}:${m}:${s}`;
      };

      const canSendPrivate = selectedContact && !!e2eeState[selectedContact]?.mySecret;
      const hasAnyE2EE = selectedContact && (!!e2eeState[selectedContact]?.mySecret || !!e2eeState[selectedContact]?.contactSecret);
      const selectedIsServer = selectedContact && isCentralServer(selectedContact);
      const serverGroupActive = selectedIsServer && serverE2EE[selectedContact]?.active;

      const filteredMessages = useMemo(() => {
        if (!selectedContact) return [];
        return messages.filter(msg =>
          (msg.sender === selectedContact && msg.recipient === 'you') ||
          (msg.sender === 'you' && msg.recipient === selectedContact) ||
          (msg.systemFor === selectedContact)
        );
      }, [messages, selectedContact]);

      // MessageText com suporte a E2EE individual e grupo
      const MessageText = ({ msg }) => {
        const [display, setDisplay] = useState(null);
        const contactPeer = msg.sender === 'you' ? msg.recipient : msg.sender;
        const isE2EE = typeof msg.text === 'string' && msg.text.startsWith(E2EE_PREFIX);
        const isGroup = typeof msg.text === 'string' && msg.text.startsWith(GROUP_E2EE_PREFIX);

        useEffect(() => {
          if (!isE2EE && !isGroup) { setDisplay({ plain: msg.text, encrypted: false }); return; }

          if (isGroup) {
            // Descriptografar com segredo de grupo do servidor
            const b64 = msg.text.slice(GROUP_E2EE_PREFIX.length);
            // Tentar todos os segredos de grupo conhecidos
            const serverSecrets = Object.values(serverE2EE).filter(s => s.groupSecret).map(s => s.groupSecret);
            if (serverSecrets.length === 0) { setDisplay({ plain: null, encrypted: true, noKey: true, isGroup: true }); return; }

            const tryDecrypt = async () => {
              for (const secret of serverSecrets) {
                try {
                  const plain = await decryptMsg(b64, secret);
                  setDisplay({ plain, encrypted: true, isGroup: true });
                  return;
                } catch(e) {}
              }
              setDisplay({ plain: null, encrypted: true, error: true, isGroup: true });
            };
            tryDecrypt();
            return;
          }

          // E2EE individual
          const b64 = msg.text.slice(E2EE_PREFIX.length);
          const isMine = msg.sender === 'you';
          const secret = isMine
            ? e2eeState[contactPeer]?.mySecret
            : e2eeState[contactPeer]?.contactSecret;

          if (!secret) { setDisplay({ plain: null, encrypted: true, noKey: true }); return; }
          decryptMsg(b64, secret)
            .then(plain => setDisplay({ plain, encrypted: true }))
            .catch(() => setDisplay({ plain: null, encrypted: true, error: true }));
        }, [msg.text, contactPeer, JSON.stringify(e2eeState[contactPeer]), JSON.stringify(serverE2EE)]);

        if (display === null) return <span style={{ color: '#aaa', fontSize: '12px' }}>...</span>;
        if (!display.encrypted) return <div>{display.plain}</div>;
        return (
          <div>
            <div className={`msg-encrypted-badge${display.isGroup ? ' group' : ''}`}>
              {display.isGroup ? '🛡️ GRUPO' : '🔒 PRIVADO'}
            </div>
            {display.plain
              ? <div>{display.plain}</div>
              : display.noKey
                ? <div className="msg-no-key">🔑 {display.isGroup ? 'Sem segredo de grupo...' : 'Aguardando segredo do contato...'}</div>
                : <div className="msg-encrypted-locked">{display.error ? '🔴 Segredo incorreto' : '🔒 Criptografado'}</div>
            }
          </div>
        );
      };

      const sendDirectMessage = async () => {
        if (!userName.trim()) { alert('Por favor, defina seu nome antes de enviar mensagens'); return; }
        if (!newMessage.trim() || !selectedContact || cooldownRemaining > 0) return;
        const conn = connections.find(c => c.peer === selectedContact);
        if (!conn || !conn.open) { alert(`Contato ${getContactName(selectedContact)} não está conectado.`); return; }

        const currentCooldown = Math.max(1, Math.floor(networkSize / 1000));
        setCooldownRemaining(currentCooldown);

        try {
          const timestamp = new Date();
          const msgId = Date.now() + Math.random().toString(36).substring(7);
          if (registerSentMessage) registerSentMessage(msgId);

          let textToSend = newMessage;

          // Criptografia de grupo para servidor
          if (selectedIsServer && serverGroupActive) {
            const secret = serverE2EE[selectedContact].groupSecret;
            textToSend = GROUP_E2EE_PREFIX + await encryptMsg(newMessage, secret);
          }
          // Criptografia individual para P2P
          else if (!selectedIsServer && canSendPrivate) {
            const secret = e2eeState[selectedContact].mySecret;
            textToSend = E2EE_PREFIX + await encryptMsg(newMessage, secret);
          }

          conn.send({ type: 'message', id: msgId, ttl: 8, text: textToSend, senderName: userName, direct: true, time: formatTime(timestamp) });

          const newMessageObj = {
            text: textToSend, sender: 'you', recipient: selectedContact, senderName: userName,
            time: formatTime(timestamp), type: 'text', direct: true, timestamp: timestamp.getTime()
          };
          setMessages(prev => { const updated = [...prev, newMessageObj]; localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated)); return updated; });
          setNewMessage('');
        } catch (err) { alert(`Erro ao enviar mensagem: ${err.message}`); }
      };

      const handleSecretSent = (targetPeer, mySecret) => {
        setE2eeState(prev => ({
          ...prev,
          [targetPeer]: { ...prev[targetPeer], mySecret }
        }));
      };

      const handleServerE2EEActivate = (srvId, groupSecret) => {
        setServerE2EE(prev => ({ ...prev, [srvId]: { active: true, groupSecret } }));
      };

      const handleServerE2EEDeactivate = (srvId) => {
        setServerE2EE(prev => {
          const updated = { ...prev };
          delete updated[srvId];
          return updated;
        });
      };

      const deleteMessage = (messageTimestamp) => {
        setMessages(prev => { const updated = prev.filter(msg => msg.timestamp !== messageTimestamp); localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated)); return updated; });
      };

      const deleteMessagesByContact = (pId) => {
        setMessages(prev => {
          const updated = prev.filter(msg => !((msg.sender === pId && msg.recipient === 'you') || (msg.sender === 'you' && msg.recipient === pId) || msg.systemFor === pId));
          localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      useEffect(() => { if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" }); }, [filteredMessages]);

      useEffect(() => {
        remoteStreams.forEach(({ peerId: rPeerId, stream, type }) => {
          if (type === 'voice') { const el = audioRefs.current[rPeerId]; if (el && el.srcObject !== stream) { el.srcObject = stream; el.play().catch(() => {}); } }
          else if (type === 'video') { const el = videoRefs.current[rPeerId]; if (el && el.srcObject !== stream) { el.srcObject = stream; el.play().catch(() => {}); } }
        });
      }, [remoteStreams]);

      // Status bar texto
      const getInputStatus = () => {
        if (!selectedContact) return { placeholder: "Selecione um contato...", style: {} };
        if (cooldownRemaining > 0) return { placeholder: `Aguarde ${cooldownRemaining}s...`, style: {} };
        if (selectedIsServer && serverGroupActive)
          return { placeholder: `🛡️ Mensagem criptografada no grupo ${getContactName(selectedContact)}...`, style: { borderColor: '#3b82f6', boxShadow: '0 0 0 2px rgba(59,130,246,0.2)' } };
        if (canSendPrivate && !selectedIsServer)
          return { placeholder: `🔒 Mensagem privada para ${getContactName(selectedContact)}...`, style: { borderColor: '#10b981', boxShadow: '0 0 0 2px rgba(16,185,129,0.2)' } };
        return { placeholder: `Mensagem para ${getContactName(selectedContact)}...`, style: {} };
      };

      const inputStatus = getInputStatus();

      return (
        <div>
          {showSendSecretModal && (
            <SendSecretModal
              connections={connections} contacts={contacts} getContactName={getContactName}
              isCentralServer={isCentralServer} onSend={handleSecretSent}
              onClose={() => setShowSendSecretModal(false)} e2eeState={e2eeState}
            />
          )}

          {showServerE2EEModal && selectedContact && isCentralServer(selectedContact) && (
            <ServerE2EEModal
              serverId={selectedContact}
              connections={connections}
              e2eeState={e2eeState}
              getContactName={getContactName}
              onActivate={handleServerE2EEActivate}
              onDeactivate={handleServerE2EEDeactivate}
              onClose={() => setShowServerE2EEModal(false)}
              currentServerE2EE={serverE2EE[selectedContact]}
            />
          )}

          <div className="chat-main-container">
            <div className="conversations-list">
              <h4 style={{ padding: '10px', margin: '0', borderBottom: '1px solid #eee' }}>Conversas</h4>
              {connections.map((conn, i) => {
                const isSelected = selectedContact === conn.peer;
                const hasVoice = activeCalls.some(c => c.peerId === conn.peer && c.type === 'voice');
                const hasVideo = activeCalls.some(c => c.peerId === conn.peer && c.type === 'video' && c.localStream);
                const e2ee = e2eeState[conn.peer];
                const hasMine = !!e2ee?.mySecret;
                const hasTheirs = !!e2ee?.contactSecret;
                const isServer = isCentralServer(conn.peer);
                const srvGrpActive = isServer && serverE2EE[conn.peer]?.active;

                return (
                  <div key={i}
                    className={`conversation-item ${isSelected ? 'selected' : ''} ${conn.peer === centralServerId ? 'central-server' : ''}`}
                    onClick={() => setSelectedContact(conn.peer)}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <div>
                        <div className="conversation-name">
                          {/* Ícones E2EE individual */}
                          {!isServer && hasMine && hasTheirs && <span title="E2EE total ativo" style={{ marginRight: '4px' }}>🔒</span>}
                          {!isServer && hasMine && !hasTheirs && <span title="Enviando criptografado" style={{ marginRight: '4px' }}>📤</span>}
                          {!isServer && !hasMine && hasTheirs && <span title="Recebendo criptografado" style={{ marginRight: '4px' }}>📥</span>}
                          {/* Ícone E2EE grupo servidor */}
                          {isServer && srvGrpActive && <span title="Criptografia de grupo ativa" style={{ marginRight: '4px' }}>🛡️</span>}
                          {getContactName(conn.peer)}
                        </div>
                        <div className="conversation-peer-id">{conn.peer}</div>
                      </div>
                      <div className="green-delete-icon" onClick={e => { e.stopPropagation(); deleteMessagesByContact(conn.peer); }} title="Apagar mensagens">
                        <i className="fas fa-trash"></i>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: '5px', marginTop: '5px', flexWrap: 'wrap' }}>
                      {hasVoice
                        ? <button onClick={e => { e.stopPropagation(); endCall(conn.peer, 'voice'); }} style={{ padding: '4px', background: '#ff5722', width: '30px', height: '30px', borderRadius: '50%', color: 'white', border: 'none', cursor: 'pointer' }} title="Encerrar voz"><i className="fas fa-phone-slash"></i></button>
                        : <button onClick={e => { e.stopPropagation(); startVoiceCall(conn.peer); }} style={{ padding: '4px', background: '#4CAF50', width: '30px', height: '30px', borderRadius: '50%', color: 'white', border: 'none', cursor: 'pointer' }} title="Voz"><i className="fas fa-phone"></i></button>}
                      <button onClick={e => { e.stopPropagation(); toggleVideoCall(conn.peer); }}
                        style={{ padding: '4px', background: hasVideo ? '#ff5722' : '#4CAF50', width: '30px', height: '30px', borderRadius: '50%', color: 'white', border: 'none', cursor: 'pointer' }}
                        title={hasVideo ? "Desligar câmera" : "Câmera"}>
                        <i className={`fas ${hasVideo ? 'fa-video-slash' : 'fa-video'}`}></i>
                      </button>

                      {/* 🛡️ Botão de criptografia de grupo — só aparece no servidor */}
                      {isServer && (
                        <button
                          className={`server-e2ee-btn ${srvGrpActive ? 'active' : 'inactive'}`}
                          onClick={e => { e.stopPropagation(); setSelectedContact(conn.peer); setShowServerE2EEModal(true); }}
                          title={srvGrpActive ? 'Criptografia de grupo ATIVA — clique para gerenciar' : 'Clique para ativar criptografia de grupo no servidor'}
                        >
                          🛡️
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="chat-messages-container">
              <div className="chat-messages">
                {filteredMessages.map((msg, i) => (
                  <div key={msg.timestamp || i} className={`message-bubble ${msg.sender === 'you' ? 'sent' : msg.sender === '__system__' ? 'received' : 'received'}`}
                    style={msg.sender === '__system__' ? { background: '#f0f9ff', border: '1px solid #bae6fd', color: '#0369a1', fontSize: '12px', maxWidth: '90%' } : {}}>
                    {msg.sender !== '__system__' && (
                      <div className="chat-user-bubble">{msg.sender === 'you' ? userName : getContactName(msg.sender)}</div>
                    )}
                    {msg.type === 'text' ? (
                      <MessageText msg={msg} />
                    ) : msg.type === 'file' ? (
                      <div>
                        {msg.fileData ? <a href={msg.fileData} download={msg.fileName} className="file-link">{msg.fileName}</a> : <span>{msg.fileName}</span>}
                        {(msg.receiving || msg.sending) && <div className="progress-container"><div className="progress-bar"><div className="progress" style={{ width: `${msg.progress}%` }} /></div></div>}
                      </div>
                    ) : msg.type === 'audio' && (
                      <div>
                        {msg.audioData ? <audio controls src={msg.audioData} className="audio-player" /> : <span>Áudio</span>}
                        {(msg.receiving || msg.sending) && <div className="progress-container"><div className="progress-bar"><div className="progress" style={{ width: `${msg.progress}%` }} /></div></div>}
                      </div>
                    )}
                    {msg.sender !== '__system__' && <div className="message-timestamp">{msg.time}</div>}
                    {msg.sender !== '__system__' && <div className="green-delete-icon" onClick={() => deleteMessage(msg.timestamp)} title="Remover"><i className="fas fa-trash"></i></div>}
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>

              {/* Banner de status E2EE no servidor */}
              {selectedIsServer && (
                <div className={`server-e2ee-banner ${serverGroupActive ? 'active' : 'inactive'}`}>
                  {serverGroupActive
                    ? <><span>🛡️</span><span>Criptografia de grupo <strong>ATIVA</strong> — mensagens passam pelo servidor criptografadas</span>
                        <button onClick={() => setShowServerE2EEModal(true)} style={{ marginLeft: 'auto', background: '#10b981', color: 'white', border: 'none', borderRadius: '4px', padding: '3px 8px', cursor: 'pointer', fontSize: '11px' }}>Gerenciar</button></>
                    : <><span>⚠️</span><span>Criptografia de grupo <strong>inativa</strong> no servidor</span>
                        <button onClick={() => setShowServerE2EEModal(true)} style={{ marginLeft: 'auto', background: '#f97316', color: 'white', border: 'none', borderRadius: '4px', padding: '3px 8px', cursor: 'pointer', fontSize: '11px' }}>🛡️ Ativar</button></>
                  }
                </div>
              )}

              {/* Banner E2EE individual */}
              {!selectedIsServer && selectedContact && (e2eeState[selectedContact]?.mySecret || e2eeState[selectedContact]?.contactSecret) && (() => {
                const s = e2eeState[selectedContact];
                const hasMine = !!s?.mySecret, hasTheirs = !!s?.contactSecret;
                let icon, color, label;
                if (hasMine && hasTheirs) { icon = '🔒'; color = '#10b981'; label = 'Criptografia total ativa'; }
                else if (hasMine) { icon = '📤'; color = '#3b82f6'; label = 'Enviando criptografado · aguardando segredo do contato'; }
                else { icon = '📥'; color = '#8b5cf6'; label = 'Lendo msgs do contato · envie seu segredo para criptografar suas msgs'; }
                return (
                  <div style={{ padding: '6px 14px', background: '#f0fdf4', borderTop: '1px solid #d1fae5', fontSize: '12px', color, display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <span>{icon}</span><span>{label}</span>
                  </div>
                );
              })()}

              <div className="chat-input-container">
                <VoiceRecorder onRecordingComplete={handleAudioRecording}
                  disabled={!selectedContact || !connections.some(c => c.peer === selectedContact)} selectedContact={selectedContact} />
                <button onClick={() => fileInputRef.current.click()}
                  disabled={!selectedContact || !connections.some(c => c.peer === selectedContact)} title="Enviar arquivo">
                  <i className="fas fa-paperclip"></i>
                </button>

                {/* 🔑 Botão de segredo individual — bloqueado no servidor */}
                <button
                  className={`private-mode-toggle${hasAnyE2EE && !selectedIsServer ? ' active' : ''}`}
                  onClick={() => setShowSendSecretModal(true)}
                  disabled={selectedIsServer}
                  title={selectedIsServer ? 'Servidor: use o botão 🛡️ na lista' : 'Enviar / gerenciar segredo privado'}
                  style={{ flexShrink: 0 }}
                >
                  🔑
                </button>

                <div className="message-input-container">
                  <button className="emoji-button" onClick={() => setShowEmojiPanel(!showEmojiPanel)} title="Emojis">😊</button>
                  <input type="text" value={newMessage}
                    onChange={e => setNewMessage(e.target.value)}
                    placeholder={inputStatus.placeholder}
                    onKeyPress={e => { if (e.key === 'Enter' && selectedContact && cooldownRemaining === 0) sendDirectMessage(); }}
                    className="message-input"
                    disabled={!selectedContact || cooldownRemaining > 0}
                    style={inputStatus.style}
                  />
                  {showEmojiPanel && populateEmojiPanel()}
                </div>
                <button onClick={sendDirectMessage}
                  disabled={!newMessage.trim() || !selectedContact || !connections.some(c => c.peer === selectedContact) || cooldownRemaining > 0}
                  title="Enviar">
                  {cooldownRemaining > 0 ? `${cooldownRemaining}s` : <i className="fas fa-paper-plane"></i>}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =====================================================================
    // MAIN APP
    // =====================================================================
    const App = () => {
      useEffect(() => {
        if (localStorage.getItem('modo') === 'dark') {
          document.body.classList.add('dark-mode');
          const btn = document.getElementById('darkModeBtn');
          if (btn) btn.textContent = '☀️';
        }
      }, []);

      const toggleDarkMode = () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('modo', isDark ? 'dark' : 'light');
        const btn = document.getElementById('darkModeBtn');
        if (btn) btn.textContent = isDark ? '☀️' : '🌙';
      };

      const [peerId, setPeerId] = usePersistentId();
      const [userName, setUserName] = useState(() => localStorage.getItem('p2pUserName') || '');
      const [editingName, setEditingName] = useState(!localStorage.getItem('p2pUserName'));
      const [connections, setConnections] = useState([]);
      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem(MESSAGES_STORAGE_KEY);
        try { const parsed = saved ? JSON.parse(saved) : []; return parsed.map((msg, i) => ({ ...msg, timestamp: msg.timestamp || Date.now() + i })); }
        catch { localStorage.removeItem(MESSAGES_STORAGE_KEY); return []; }
      });
      const [newMessage, setNewMessage] = useState('');
      const [showContacts, setShowContacts] = useState(false);
      const [contacts, setContacts] = useState(() => { try { return JSON.parse(localStorage.getItem('p2pContacts') || '[]'); } catch { return []; } });
      const [activeCalls, setActiveCalls] = useState([]);
      const [remoteStreams, setRemoteStreams] = useState([]);
      const [error, setError] = useState(null);
      const [isLocalVideoVisible, setIsLocalVideoVisible] = useState(false);
      const [showEmojiPanel, setShowEmojiPanel] = useState(false);
      const [selectedContact, setSelectedContact] = useState(null);
      const [isPeerInitialized, setIsPeerInitialized] = useState(false);
      const [centralServerId, setCentralServerId] = useState(null);
      const [cooldownRemaining, setCooldownRemaining] = useState(0);
      const [networkSize, setNetworkSize] = useState(1);
      const [isSuperNode, setIsSuperNode] = useState(false);
      const [radioState, setRadioState] = useState({ status: 'idle', startTime: 0, duration: 0, audioUrl: null, fileName: '', sender: '' });
      const [e2eeState, setE2eeState] = useState({});
      // NOVO: estado de criptografia de grupo por servidor
      const [serverE2EE, setServerE2EE] = useState({});

      const peerInstance = useRef(null);
      const fileInputRef = useRef(null);
      const pendingFiles = useRef({});
      const audioRefs = useRef({});
      const videoRefs = useRef({});
      const localVideoRef = useRef(null);
      const localStreamsRef = useRef(new Map());
      const seenMessagesRef = useRef(new Set());
      const radioStateRef = useRef(radioState);
      const radioAudioRef = useRef(null);
      const pendingRadioFiles = useRef({});
      const radioIntervalRef = useRef(null);
      const knownUsersRef = useRef(new Set());
      const lastMessageTimeRef = useRef(new Map());
      const bannedPeersRef = useRef(new Set());
      const CHUNK_SIZE = 16 * 1024;

      useEffect(() => { radioStateRef.current = radioState; }, [radioState]);

      useEffect(() => {
        if (cooldownRemaining > 0) {
          const timer = setTimeout(() => setCooldownRemaining(prev => prev - 1), 1000);
          return () => clearTimeout(timer);
        }
      }, [cooldownRemaining]);

      const isCentralServer = (id) => id && id.endsWith('-CENTRAL');
      const generateNewId = () => {
        const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const buffer = new Uint8Array(9);
        crypto.getRandomValues(buffer);
        return Array.from(buffer).map(b => chars[b % chars.length]).join('');
      };
      const getContactName = (pId) => contacts.find(c => c.peerId === pId)?.name || pId;
      const saveUserName = () => { if (userName.trim()) { localStorage.setItem('p2pUserName', userName); setEditingName(false); } };
      const formatTime = (date) => date.toLocaleTimeString('pt-BR');

      const stopAndRemoveLocalStream = (pId) => {
        const stream = localStreamsRef.current.get(pId);
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          localStreamsRef.current.delete(pId);
          if (localStreamsRef.current.size === 0) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
          else { const first = localStreamsRef.current.values().next().value; if (localVideoRef.current && first) localVideoRef.current.srcObject = first; }
        }
      };

      const sendHandshake = (conn) => {
        try { conn.send({ type: 'handshake', peerId }); } catch(e) {}
      };

      const handleIncomingData = (data, pId) => {
        if (data.type === 'handshake') {
          if (isCentralServer(pId)) setCentralServerId(pId);
          return;
        }

        // Receber segredo individual E2EE via P2P
        if (data.type === 'e2ee-secret' && data.secret) {
          setE2eeState(prev => ({
            ...prev,
            [pId]: { ...prev[pId], contactSecret: data.secret }
          }));
          const name = getContactName(pId);
          setMessages(prev => [...prev, {
            text: `🔑 Segredo E2EE recebido de ${name}. Suas mensagens dele(a) serão descriptografadas automaticamente.`,
            sender: '__system__', recipient: 'you', senderName: 'Sistema',
            time: new Date().toLocaleTimeString('pt-BR'), type: 'text',
            direct: true, timestamp: Date.now(), systemFor: pId
          }]);
          return;
        }

        // NOVO: Receber convite de criptografia de grupo do servidor via P2P
        if (data.type === 'server-e2ee-invite' && data.groupSecret && data.serverId) {
          setServerE2EE(prev => ({
            ...prev,
            [data.serverId]: { active: true, groupSecret: data.groupSecret }
          }));
          const name = getContactName(pId);
          setMessages(prev => [...prev, {
            text: `🛡️ ${name} ativou criptografia de grupo para o servidor "${data.serverId}". Suas mensagens neste servidor agora são criptografadas automaticamente.`,
            sender: '__system__', recipient: 'you', senderName: 'Sistema',
            time: new Date().toLocaleTimeString('pt-BR'), type: 'text',
            direct: true, timestamp: Date.now(), systemFor: data.serverId
          }]);
          return;
        }

        if (data.type === 'pex' && Array.isArray(data.peers)) {
          const maxConnections = isSuperNode ? 50 : 15;
          if (peerInstance.current) {
            const activeCount = Object.keys(peerInstance.current.connections).length;
            if (activeCount < maxConnections) {
              data.peers.forEach(newPId => {
                if (newPId !== peerId && !peerInstance.current.connections[newPId] && !bannedPeersRef.current.has(newPId)) connectToPeer(newPId);
              });
            }
          }
          return;
        }

        if (data.type === 'radio-request-sync') {
          setConnections(cc => { const c = cc.find(x => x.peer === pId); if (c) sendRadioSync(c); return cc; });
          return;
        }

        if (data.type === 'radio-sync') {
          const now = Date.now(), endTime = data.startTime + data.duration * 1000;
          if (now < endTime) {
            setRadioState(prev => {
              if (prev.status === 'idle') {
                const newStatus = now >= data.startTime ? 'playing' : 'buffering';
                return { status: newStatus, startTime: data.startTime, duration: data.duration, audioUrl: null, fileName: data.fileName, sender: data.senderName };
              }
              return prev;
            });
          }
          return;
        }

        if (data.type === 'radio-start' || data.type === 'radio-chunk') {
          if (seenMessagesRef.current.has(data.id)) return;
          if (data.type === 'radio-start' && radioStateRef.current.status !== 'idle') return;
          if (data.type === 'radio-chunk' && radioStateRef.current.status === 'idle' && !pendingRadioFiles.current[data.radioId]) return;
          seenMessagesRef.current.add(data.id);
          if (seenMessagesRef.current.size > 5000) { const f = seenMessagesRef.current.values().next().value; seenMessagesRef.current.delete(f); }
          let ttl = data.ttl !== undefined ? data.ttl : 8;
          if (ttl > 0) {
            const relay = { ...data, ttl: ttl - 1 };
            setConnections(cc => { cc.forEach(c => { if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){} }); return cc; });
          }
          if (data.type === 'radio-start') {
            pendingRadioFiles.current[data.radioId] = { chunks: new Uint8Array(data.fileSize), receivedBytes: 0, totalSize: data.fileSize };
            setRadioState({ status: 'buffering', startTime: data.startTime, duration: data.duration, audioUrl: null, fileName: data.fileName, sender: data.senderName });
          } else {
            const fd = pendingRadioFiles.current[data.radioId];
            if (fd) {
              const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
              fd.chunks.set(chunk, data.offset); fd.receivedBytes += chunk.length;
              if (fd.receivedBytes === fd.totalSize) {
                const url = URL.createObjectURL(new Blob([fd.chunks], { type: 'audio/mpeg' }));
                setRadioState(prev => ({ ...prev, audioUrl: url }));
                delete pendingRadioFiles.current[data.radioId];
              }
            }
          }
          return;
        }

        if (data.type === 'message' && data.id) {
          if (data.sender) {
            if (!knownUsersRef.current.has(data.sender)) { knownUsersRef.current.add(data.sender); setNetworkSize(knownUsersRef.current.size); }
            const now = Date.now(), lastTime = lastMessageTimeRef.current.get(data.sender) || 0;
            const requiredMs = Math.max(1, Math.floor(knownUsersRef.current.size / 1000)) * 1000;
            if (now - lastTime < requiredMs) {
              bannedPeersRef.current.add(data.sender);
              setConnections(cc => { const c = cc.find(x => x.peer === data.sender); if (c) c.close(); return cc.filter(x => x.peer !== data.sender); });
              return;
            }
            lastMessageTimeRef.current.set(data.sender, now);
          }
          if (seenMessagesRef.current.has(data.id)) return;
          seenMessagesRef.current.add(data.id);
          if (seenMessagesRef.current.size > 5000) { const f = seenMessagesRef.current.values().next().value; seenMessagesRef.current.delete(f); }
          let ttl = data.ttl !== undefined ? data.ttl : 8;
          if (ttl > 0) {
            const relay = { ...data, ttl: ttl - 1 };
            setConnections(cc => { cc.forEach(c => { if (c.peer !== pId && c.open) try { c.send(relay); } catch(e){} }); return cc; });
          }
        }

        const timestamp = data.timestamp || Date.now();
        const messageTime = data.time || formatTime(new Date(timestamp));
        const baseMessage = { sender: pId, senderName: data.senderName || getContactName(pId), time: messageTime, direct: data.direct || false, timestamp, recipient: data.direct ? 'you' : undefined };
        let messageToAdd = null;

        if (data.type === 'message') {
          if (data.text === '#$%') {
            if (radioStateRef.current.status === 'idle') setRadioState({ status: 'playing', startTime: Date.now(), duration: 300, audioUrl: null, fileName: 'Rádio Global', sender: data.senderName || 'Servidor' });
            return;
          }
          messageToAdd = { ...baseMessage, text: data.text, type: 'text' };
        } else if (data.type === 'file-start') {
          pendingFiles.current[data.fileId] = { fileName: data.fileName, chunks: new Uint8Array(data.fileSize), receivedBytes: 0, totalSize: data.fileSize, fileType: data.fileType };
          messageToAdd = { ...baseMessage, fileId: data.fileId, fileName: data.fileName, type: 'file', receiving: true, progress: 0 };
        } else if (data.type === 'file-chunk') {
          const fd = pendingFiles.current[data.fileId];
          if (fd) {
            const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
            fd.chunks.set(chunk, data.offset); fd.receivedBytes += chunk.length;
            const progress = Math.min(100, Math.floor((fd.receivedBytes / fd.totalSize) * 100));
            setMessages(prev => prev.map(m => m.fileId === data.fileId ? { ...m, progress } : m));
            if (fd.receivedBytes === fd.totalSize) {
              const url = URL.createObjectURL(new Blob([fd.chunks], { type: fd.fileType || 'application/octet-stream' }));
              setMessages(prev => prev.map(m => m.fileId === data.fileId ? { ...m, fileData: url, receiving: false, progress: 100 } : m));
              delete pendingFiles.current[data.fileId];
            }
          }
          return;
        } else if (data.type === 'audio-start') {
          pendingFiles.current[data.audioId] = { chunks: new Uint8Array(data.audioSize), receivedBytes: 0, totalSize: data.audioSize };
          messageToAdd = { ...baseMessage, audioId: data.audioId, type: 'audio', receiving: true, progress: 0 };
        } else if (data.type === 'audio-chunk') {
          const ad = pendingFiles.current[data.audioId];
          if (ad) {
            const chunk = data.chunk instanceof ArrayBuffer ? new Uint8Array(data.chunk) : new Uint8Array(Object.values(data.chunk));
            ad.chunks.set(chunk, data.offset); ad.receivedBytes += chunk.length;
            const progress = Math.min(100, Math.floor((ad.receivedBytes / ad.totalSize) * 100));
            setMessages(prev => prev.map(m => m.audioId === data.audioId ? { ...m, progress } : m));
            if (ad.receivedBytes === ad.totalSize) {
              const url = URL.createObjectURL(new Blob([ad.chunks], { type: 'audio/webm' }));
              setMessages(prev => prev.map(m => m.audioId === data.audioId ? { ...m, audioData: url, receiving: false, progress: 100 } : m));
              delete pendingFiles.current[data.audioId];
            }
          }
          return;
        }

        if (messageToAdd) {
          setMessages(prev => { const updated = [...prev, messageToAdd]; if (messageToAdd.type === 'text' || messageToAdd.receiving) localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated)); return updated; });
        }
      };

      const sendRadioSync = (conn) => {
        if (radioStateRef.current.status !== 'idle') {
          const syncMsg = { type: 'radio-sync', startTime: radioStateRef.current.startTime, duration: radioStateRef.current.duration, fileName: radioStateRef.current.fileName, senderName: radioStateRef.current.sender };
          const send = () => { try { conn.send(syncMsg); } catch(e) {} };
          send(); setTimeout(send, 1000); setTimeout(send, 2000);
        }
      };

      const connectToPeer = (peerIdToConnect) => {
        if (!peerIdToConnect || !peerInstance.current || !isPeerInitialized) return;
        if (bannedPeersRef.current.has(peerIdToConnect)) return;
        if (connections.some(c => c.peer === peerIdToConnect && c.open)) return;
        try {
          const conn = peerInstance.current.connect(peerIdToConnect, { reliable: true });
          if (!conn) throw new Error("Conexão falhou");
          conn.on('open', () => { setConnections(prev => [...prev.filter(c => c.peer !== peerIdToConnect), conn]); sendHandshake(conn); });
          conn.on('error', err => { setConnections(prev => prev.filter(c => c.peer !== peerIdToConnect)); alert(`Erro ao conectar: ${err.message || 'Contato offline'}`); });
          conn.on('close', () => setConnections(prev => prev.filter(c => c.peer !== peerIdToConnect)));
          conn.on('data', data => handleIncomingData(data, peerIdToConnect));
        } catch (err) { alert(`Erro ao conectar: ${err.message}`); }
      };

      useEffect(() => {
        if (!peerId) return;
        const peer = new Peer(peerId, {
          host: '0.peerjs.com', port: 443, secure: true,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun.ekiga.net:3478' },
              { urls: 'stun:stun.stunprotocol.org:3478' }
            ],
            sdpSemantics: 'unified-plan', iceTransportPolicy: 'all', bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require', iceCandidatePoolSize: 10
          },
          debug: 2
        });

        peer.on('open', (id) => {
          setIsPeerInitialized(true);
          const urlParams = new URLSearchParams(window.location.search);
          const portasStr = urlParams.get('portas');
          if (portasStr) {
            const portas = portasStr.split(',');
            const centralId = portas.find(isCentralServer);
            if (centralId) { setCentralServerId(centralId); setSelectedContact(centralId); }
            else if (!centralServerId) { setCentralServerId(portas[0]); setSelectedContact(portas[0]); }
            setTimeout(() => {
              portas.forEach(porta => {
                if (porta && porta !== id) {
                  const conn = peer.connect(porta, { reliable: true });
                  if (conn) {
                    conn.on('open', () => { setConnections(prev => [...prev.filter(c => c.peer !== porta), conn]); sendRadioSync(conn); try { conn.send({ type: 'radio-request-sync' }); } catch(e){} });
                    conn.on('data', data => handleIncomingData(data, porta));
                    conn.on('close', () => setConnections(prev => prev.filter(c => c.peer !== porta)));
                    conn.on('error', () => setConnections(prev => prev.filter(c => c.peer !== porta)));
                  }
                }
              });
            }, 1000);
          }
        });

        peer.on('error', err => {
          if (err.type === 'unavailable-id') { const newId = generateNewId(); localStorage.setItem(PEER_ID_STORAGE_KEY, newId); window.location.reload(); }
          else if (err.type !== 'peer-unavailable') setError(`Erro PeerJS: ${err.type}`);
        });

        peer.on('connection', conn => {
          if (bannedPeersRef.current.has(conn.peer)) { setTimeout(() => conn.close(), 500); return; }
          const maxConns = isSuperNode ? 50 : 15;
          if (connections.length >= maxConns) { setTimeout(() => conn.close(), 500); return; }
          if (connections.some(c => c.peer === conn.peer)) { setConnections(prev => prev.map(c => c.peer === conn.peer ? conn : c)); return; }
          conn.on('open', () => { setConnections(prev => [...prev.filter(c => c.peer !== conn.peer), conn]); sendHandshake(conn); });
          conn.on('data', data => handleIncomingData(data, conn.peer));
          conn.on('close', () => { setConnections(prev => prev.filter(c => c.peer !== conn.peer)); endCall(conn.peer, 'video'); endCall(conn.peer, 'voice'); });
          conn.on('error', () => { setConnections(prev => prev.filter(c => c.peer !== conn.peer)); endCall(conn.peer, 'video'); endCall(conn.peer, 'voice'); });
        });

        peer.on('call', async call => {
          const callType = call.metadata?.type || 'video';
          try {
            call.answer(null);
            setActiveCalls(prev => [...prev.filter(c => !(c.peerId === call.peer && c.type === callType)), { peerId: call.peer, call, localStream: null, type: callType, direction: 'incoming', isTemporaryStream: false }]);
            call.on('stream', remoteStream => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === call.peer && s.type === callType)), { peerId: call.peer, stream: remoteStream, type: callType }]));
            call.on('close', () => endCall(call.peer, callType));
            call.on('error', () => endCall(call.peer, callType));
          } catch (err) { call.close(); alert('Erro ao acessar câmera/microfone: ' + err.message); }
        });

        peerInstance.current = peer;
        return () => {
          if (peerInstance.current) { peerInstance.current.destroy(); peerInstance.current = null; }
          localStreamsRef.current.forEach(s => s.getTracks().forEach(t => t.stop()));
          localStreamsRef.current.clear();
          setActiveCalls([]); setRemoteStreams([]); setIsLocalVideoVisible(false);
          if (localVideoRef.current) localVideoRef.current.srcObject = null;
          setIsPeerInitialized(false);
        };
      }, [peerId]);

      useEffect(() => {
        const iv = setInterval(() => {
          if (connections.length > 0) {
            const allKnown = Array.from(new Set([...connections.map(c => c.peer), ...Array.from(knownUsersRef.current)]));
            connections.forEach(conn => {
              if (conn.open) try { conn.send({ type: 'pex', peers: [...allKnown].sort(() => 0.5 - Math.random()).slice(0, isSuperNode ? 100 : 50) }); } catch(e) {}
            });
          }
        }, 30000);
        return () => clearInterval(iv);
      }, [connections]);

      useEffect(() => {
        const check = () => {
          setRadioState(current => {
            if (current.status === 'idle') return current;
            const now = Date.now(), endTime = current.startTime + current.duration * 1000;
            if (now >= endTime) { if (radioAudioRef.current) { radioAudioRef.current.pause(); radioAudioRef.current.src = ''; } return { status: 'idle', startTime: 0, duration: 0, audioUrl: null, fileName: '', sender: '' }; }
            if (current.status === 'buffering') {
              if (now >= current.startTime) {
                if (current.audioUrl && radioAudioRef.current) { const off = (now - current.startTime) / 1000; radioAudioRef.current.src = current.audioUrl; radioAudioRef.current.currentTime = off; radioAudioRef.current.play().catch(() => {}); }
                return { ...current, status: 'playing' };
              }
              return { ...current, _tick: now };
            }
            return current;
          });
        };
        radioIntervalRef.current = setInterval(check, 500);
        return () => clearInterval(radioIntervalRef.current);
      }, []);

      const handleRadioUpload = (e) => {
        if (radioStateRef.current.status !== 'idle') { alert("Já existe uma música tocando!"); e.target.value = ''; return; }
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert("Máx 5MB."); e.target.value = ''; return; }
        const url = URL.createObjectURL(file);
        const audio = new Audio(url);
        audio.onloadedmetadata = () => {
          let duration = audio.duration;
          if (!duration || duration === Infinity) duration = 300;
          const startTime = Date.now() + 60000;
          const radioId = peerId + '_radio_' + Date.now();
          const startMsg = { type: 'radio-start', id: radioId + '_start', radioId, fileName: file.name, fileSize: file.size, duration, startTime, sender: peerId, senderName: userName, ttl: 8 };
          const fallbackMsg = { type: 'message', text: '#$%', id: radioId + '_fallback', sender: peerId, senderName: userName, ttl: 8 };
          seenMessagesRef.current.add(startMsg.id); seenMessagesRef.current.add(fallbackMsg.id);
