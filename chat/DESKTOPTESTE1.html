          setConnections(cc => { cc.forEach(c => { if (c.open) try { c.send(startMsg); c.send(fallbackMsg); } catch(e){} }); return cc; });
          setRadioState({ status: 'buffering', startTime, duration, audioUrl: null, fileName: file.name, sender: userName });
          const reader = new FileReader(); let offset = 0;
          reader.onload = ev => {
            const buffer = ev.target.result;
            const chunkMsg = { type: 'radio-chunk', id: radioId + '_chunk_' + offset, radioId, offset, chunk: buffer, ttl: 8 };
            seenMessagesRef.current.add(chunkMsg.id);
            setConnections(cc => { cc.forEach(c => { if (c.open) try { c.send(chunkMsg); } catch(e){} }); return cc; });
            offset += buffer.byteLength;
            if (offset < file.size) reader.readAsArrayBuffer(file.slice(offset, offset + 64 * 1024));
            else setRadioState(prev => ({ ...prev, audioUrl: url }));
          };
          reader.readAsArrayBuffer(file.slice(0, 64 * 1024));
        };
      };

      const handleFileChange = (e) => {
        if (!userName.trim()) { alert('Defina seu nome.'); setEditingName(true); return; }
        if (!selectedContact) { alert('Selecione um contato.'); return; }
        const file = e.target.files[0]; if (!file) return;
        const conn = connections.find(c => c.peer === selectedContact);
        if (!conn || !conn.open) { alert(`Contato offline.`); return; }
        sendChunkedData(conn, 'fileId', file, 'file', { fileName: file.name });
        fileInputRef.current.value = '';
      };

      const sendChunkedData = (conn, idKey, dataBlob, typePrefix, metaData) => {
        const id = peerId + `_${typePrefix}_` + Date.now();
        const reader = new FileReader(); let offset = 0;
        const timestamp = new Date(), formattedTime = formatTime(timestamp);
        const isFile = typePrefix === 'file';
        const localUrl = URL.createObjectURL(dataBlob);
        setMessages(prev => { const msg = { ...metaData, [idKey]: id, sender: 'you', recipient: conn.peer, senderName: userName, time: formattedTime, type: isFile ? 'file' : 'audio', sending: true, progress: 0, direct: true, timestamp: timestamp.getTime(), [isFile ? 'fileData' : 'audioData']: localUrl }; const updated = [...prev, msg]; localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated)); return updated; });
        try { conn.send({ type: `${typePrefix}-start`, [idKey]: id, [isFile ? 'fileSize' : 'audioSize']: dataBlob.size, senderName: userName, time: formattedTime, direct: true, timestamp: timestamp.getTime(), ...(isFile && { fileName: metaData.fileName, fileType: dataBlob.type }) }); }
        catch (err) { alert(`Erro ao iniciar envio: ${err.message}`); setMessages(prev => prev.filter(m => m[idKey] !== id)); return; }
        const readChunk = () => { const chunk = dataBlob.slice(offset, offset + CHUNK_SIZE); reader.readAsArrayBuffer(chunk); };
        reader.onload = ev => {
          if (!conn || !conn.open) { alert(`Conexão perdida.`); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); return; }
          try {
            conn.send({ type: `${typePrefix}-chunk`, [idKey]: id, chunk: ev.target.result, offset, direct: true });
            offset += ev.target.result.byteLength;
            const progress = Math.min(100, Math.floor((offset / dataBlob.size) * 100));
            setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, progress } : m));
            if (offset < dataBlob.size) requestAnimationFrame(readChunk);
            else setMessages(prev => { const updated = prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: 100 } : m); localStorage.setItem(MESSAGES_STORAGE_KEY, JSON.stringify(updated)); return updated; });
          } catch (err) { alert(`Erro: ${err.message}`); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); }
        };
        reader.onerror = () => { alert('Erro ao ler dados'); setMessages(prev => prev.map(m => m[idKey] === id ? { ...m, sending: false, progress: -1 } : m)); };
        readChunk();
      };

      const handleAudioRecording = (audioBlob, targetContact) => {
        if (!userName.trim()) { alert('Defina seu nome.'); setEditingName(true); return; }
        if (!targetContact) { alert('Selecione um contato.'); return; }
        const conn = connections.find(c => c.peer === targetContact);
        if (!conn || !conn.open) { alert('Contato offline.'); return; }
        sendChunkedData(conn, 'audioId', audioBlob, 'audio', {});
      };

      const startVoiceCall = async (peerIdToCall) => {
        if (!peerInstance.current || !peerIdToCall) return;
        if (activeCalls.some(c => c.peerId === peerIdToCall && c.type === 'voice')) return;
        const conn = connections.find(c => c.peer === peerIdToCall);
        if (!conn || !conn.open) { alert('Contato offline.'); return; }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          localStreamsRef.current.set(peerIdToCall + '_voice', stream);
          const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'voice' } });
          setActiveCalls(prev => [...prev, { peerId: peerIdToCall, call, localStream: stream, type: 'voice', direction: 'outgoing', isTemporaryStream: false }]);
          call.on('stream', rs => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'voice')), { peerId: peerIdToCall, stream: rs, type: 'voice' }]));
          call.on('close', () => endCall(peerIdToCall, 'voice'));
          call.on('error', err => { alert('Erro chamada: ' + err.message); endCall(peerIdToCall, 'voice'); });
        } catch (err) { alert('Erro microfone: ' + err.message); }
      };

      const toggleVideoCall = async (peerIdToCall) => {
        if (!peerInstance.current || !peerIdToCall) return;
        const existingCall = activeCalls.find(c => c.peerId === peerIdToCall && c.type === 'video');
        const isSendingVideo = existingCall && existingCall.localStream;
        const conn = connections.find(c => c.peer === peerIdToCall);
        if (isSendingVideo) {
          if (existingCall.localStream) { existingCall.localStream.getTracks().forEach(t => t.stop()); localStreamsRef.current.delete(peerIdToCall + '_video'); }
          setActiveCalls(prev => prev.map(c => c.peerId === peerIdToCall && c.type === 'video' ? { ...c, localStream: null } : c));
          if (localStreamsRef.current.size === 0) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
        } else {
          if (!conn || !conn.open) { alert('Contato offline.'); return; }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStreamsRef.current.set(peerIdToCall + '_video', stream);
            setIsLocalVideoVisible(true);
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
            const call = peerInstance.current.call(peerIdToCall, stream, { metadata: { type: 'video' } });
            setActiveCalls(prev => [...prev.filter(c => !(c.peerId === peerIdToCall && c.type === 'video')), { peerId: peerIdToCall, call, localStream: stream, type: 'video', direction: 'outgoing', isTemporaryStream: false }]);
            call.on('stream', rs => setRemoteStreams(prev => [...prev.filter(s => !(s.peerId === peerIdToCall && s.type === 'video')), { peerId: peerIdToCall, stream: rs, type: 'video' }]));
            call.on('close', () => endCall(peerIdToCall, 'video'));
            call.on('error', err => { alert('Erro vídeo: ' + err.message); endCall(peerIdToCall, 'video'); });
          } catch (err) { alert('Erro câmera: ' + err.message); }
        }
      };

      const endCall = (peerIdToEnd, callType) => {
        const callData = activeCalls.find(c => c.peerId === peerIdToEnd && c.type === callType);
        if (callData) {
          if (callData.call) callData.call.close();
          if (callData.localStream) { callData.localStream.getTracks().forEach(t => t.stop()); stopAndRemoveLocalStream(peerIdToEnd + '_' + callType); }
        }
        setActiveCalls(prev => prev.filter(c => !(c.peerId === peerIdToEnd && c.type === callType)));
        setRemoteStreams(prev => prev.filter(s => !(s.peerId === peerIdToEnd && s.type === callType)));
        const anyVideo = Array.from(localStreamsRef.current.values()).some(s => s.getVideoTracks().some(t => t.readyState === 'live'));
        if (!anyVideo) { setIsLocalVideoVisible(false); if (localVideoRef.current) localVideoRef.current.srcObject = null; }
      };

      const populateEmojiPanel = () => {
        const emojis = ["😀","😁","😂","🤣","😃","😄","😅","😆","😉","😊","😋","😎","😍","😘","🥰","😗","😙","😚","🙂","🤗","🤩","🤔","🤨","😐","😑","😶","🙄","😏","😣","😥","😮","🤐","😴","😪","😵","😤","😭","😡","🤯","🥵","👍","👎","👌","✌️","🤞","👋","🤚","🖐️","👏","🙌","👐","🤲","🙏","💪","🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🙈","🙉","🙊","🍇","🍈","🍉","🍊","🍋","🍌","🍍","🥭","🍎","🍏","🍐","🍑","🍒","🍓","🥝","🍔","🍟","🍕","🌭","🥪","🌮","🌯","🍜","🍝","🍣","🍤","🍦","🍧","🍨","🍩","🍪","🎂","🍰","🧁","🍫","🍬","🍭","☕","🍵","🍷","🍸","🍹","🍺","🏠","🏡","🏢","🏰","🚂","🚗","✈️","🚀","🌍","🌈","⭐","🌙","☀️","❤️","💙","💚","💛","🧡","💜","🖤","🤍","💔","💯","🔥","⚡","✨","🎉","🎊","🎈","🎁","🏆","🥇","🎯","🎮","🎵","🎶","📱","💻","⌚","📷","🔑","💡","🔒","🔓","🛒","💰","📚","✏️","📝","🗓️"];
        return (
          <div className="emoji-panel">
            <div className="emoji-panel-header">Emojis</div>
            <div className="emoji-panel-content">{emojis.map((e, i) => <span key={i} className="emoji-item" onClick={() => setNewMessage(prev => prev + e)}>{e}</span>)}</div>
            <div className="emoji-panel-footer"><span className="barra-rolagem-label">Role para ver mais</span></div>
          </div>
        );
      };

      const generateInviteLink = () => {
        if (!peerId) return;
        const activePeers = connections.filter(c => c.open && c.peer !== peerId).map(c => c.peer);
        const allIds = [peerId, ...activePeers].slice(0, 196);
        const url = new URL(window.location.href);
        url.searchParams.set('portas', allIds.join(','));
        const finalUrl = url.toString();
        navigator.clipboard.writeText(finalUrl);
        prompt(`Link gerado! (${allIds.length} porta(s)). Copie:`, finalUrl);
      };

      if (error) return <div className="error-message"><h1>Erro</h1><p>{error}</p><button onClick={() => window.location.reload()}>Tentar novamente</button></div>;

      return (
        <div>
          <input type="file" ref={fileInputRef} style={{ display: 'none' }} onChange={handleFileChange} />
          <input type="file" id="radioInput" accept="audio/mp3,audio/mpeg" style={{ display: 'none' }} onChange={handleRadioUpload} />
          <audio ref={radioAudioRef} style={{ display: 'none' }} />

          <div className="app-header">
            <h1 className="app-title">Chat K10</h1>
            <div className="header-buttons">
              <button onClick={() => setShowContacts(true)} className="header-button" title="Contatos"><i className="fas fa-address-book"></i></button>
              <button onClick={toggleDarkMode} className="header-button" title="Modo Noturno" id="darkModeBtn">🌙</button>
            </div>
          </div>

          {radioState.status !== 'idle' && (
            <div style={{ background: '#1e293b', color: 'white', padding: '10px', textAlign: 'center', borderBottom: '1px solid #334155' }}>
              <div style={{ fontSize: '14px', fontWeight: 'bold' }}>🎵 Rádio Global: {radioState.fileName}</div>
              <div style={{ fontSize: '12px', color: '#94a3b8' }}>DJ: {radioState.sender}</div>
              {radioState.status === 'buffering'
                ? <div style={{ color: '#f59e0b', marginTop: '5px', fontSize: '13px', fontWeight: 'bold' }}>A música começa em {Math.max(0, Math.ceil((radioState.startTime - Date.now()) / 1000))}s...{!radioState.audioUrl && " (Baixando...)"}</div>
                : <div style={{ color: '#10b981', marginTop: '5px', fontSize: '13px', fontWeight: 'bold' }}>▶ Tocando agora</div>}
              <div style={{ marginTop: '10px' }}>
                <label style={{ fontSize: '12px', color: '#94a3b8' }}>Volume: </label>
                <input type="range" min="0" max="1" step="0.1" defaultValue="0.5" onChange={e => { if (radioAudioRef.current) radioAudioRef.current.volume = parseFloat(e.target.value); }} />
              </div>
            </div>
          )}

          <div className="user-info-container">
            {editingName ? (
              <div className="user-name-form">
                <input type="text" value={userName} onChange={e => setUserName(e.target.value)} placeholder="Digite seu nome" autoFocus />
                <button onClick={saveUserName} disabled={!userName.trim()}>Salvar</button>
              </div>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <span className="username">{userName}</span>
                <button className="user-edit-button" onClick={() => setEditingName(true)}>Editar</button>
              </div>
            )}
          </div>

          <div className="peer-id-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: '15px', flexWrap: 'wrap' }}>
              <span>Seu ID: <strong>{peerId}</strong></span>
              <button onClick={() => setIsSuperNode(!isSuperNode)} style={{ backgroundColor: isSuperNode ? '#fef3c7' : 'white', color: isSuperNode ? '#b45309' : '#666', border: `1px solid ${isSuperNode ? '#f59e0b' : '#ddd'}`, padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}>
                <i className="fas fa-bolt" style={{ color: isSuperNode ? '#d97706' : '#999' }}></i> {isSuperNode ? 'SuperNó ON' : 'SuperNó OFF'}
              </button>
              <button onClick={() => document.getElementById('radioInput').click()} disabled={radioState.status !== 'idle'}
                style={{ backgroundColor: radioState.status !== 'idle' ? '#f1f5f9' : '#8b5cf6', color: radioState.status !== 'idle' ? '#94a3b8' : 'white', border: 'none', padding: '5px 10px', borderRadius: '4px', cursor: radioState.status !== 'idle' ? 'not-allowed' : 'pointer', fontSize: '12px', fontWeight: 'bold' }}>
                <i className="fas fa-music"></i> DJ Rádio
              </button>
            </div>
            <div>
              <button onClick={() => { navigator.clipboard.writeText(peerId); alert('ID copiado!'); }}>Copiar</button>
              <button onClick={generateInviteLink} style={{ marginLeft: '10px', backgroundColor: '#10b981', color: 'white', border: 'none' }}>Gerar Link de Convite</button>
            </div>
          </div>

          {(remoteStreams.length > 0 || isLocalVideoVisible) && (
            <div className="video-container">
              {isLocalVideoVisible && <div><div className="video-label">Você</div><video className="local-video-player" ref={localVideoRef} autoPlay muted></video></div>}
              {remoteStreams.map((sd, idx) => sd.type === 'video' && (
                <div key={idx}><div className="video-label">{getContactName(sd.peerId)}</div>
                <video className="video-player" ref={el => videoRefs.current[sd.peerId] = el} autoPlay></video></div>
              ))}
            </div>
          )}

          {activeCalls.map((call, idx) => call.type === 'voice' && (
            <div key={idx} className="audio-call-container">
              <span>Chamada de voz com {getContactName(call.peerId)}</span>
              <button className="call-end-button" onClick={() => endCall(call.peerId, 'voice')}>Encerrar</button>
              <audio ref={el => audioRefs.current[call.peerId] = el} autoPlay></audio>
              <div style={{ marginTop: '5px' }}>
                <label style={{ fontSize: '10px' }}>Volume: </label>
                <input type="range" min="0" max="1" step="0.1" defaultValue="1" onChange={e => { if (audioRefs.current[call.peerId]) audioRefs.current[call.peerId].volume = parseFloat(e.target.value); }} />
              </div>
            </div>
          ))}

          {showContacts ? (
            <ContactsScreen contacts={contacts} setContacts={setContacts} onBack={() => setShowContacts(false)}
              onSelectContact={(pId) => { connectToPeer(pId); setSelectedContact(pId); setShowContacts(false); }} />
          ) : (
            <UpdatedChatManager
              connections={connections} messages={messages} setMessages={setMessages}
              contacts={contacts} userName={userName} peerId={peerId}
              activeCalls={activeCalls} endCall={endCall} startVoiceCall={startVoiceCall}
              toggleVideoCall={toggleVideoCall} remoteStreams={remoteStreams}
              audioRefs={audioRefs} videoRefs={videoRefs} handleFileChange={handleFileChange}
              fileInputRef={fileInputRef} handleAudioRecording={handleAudioRecording}
              newMessage={newMessage} setNewMessage={setNewMessage}
              showEmojiPanel={showEmojiPanel} setShowEmojiPanel={setShowEmojiPanel}
              populateEmojiPanel={populateEmojiPanel} getContactName={getContactName}
              selectedContact={selectedContact} setSelectedContact={setSelectedContact}
              localVideoRef={localVideoRef} registerSentMessage={(id) => seenMessagesRef.current.add(id)}
              cooldownRemaining={cooldownRemaining} setCooldownRemaining={setCooldownRemaining}
              networkSize={networkSize} centralServerId={centralServerId}
              e2eeState={e2eeState} setE2eeState={setE2eeState}
              isCentralServer={isCentralServer}
              serverE2EE={serverE2EE} setServerE2EE={setServerE2EE}
            />
          )}
        </div>
      );
    };

    ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
  </script>
</body>
</html>
