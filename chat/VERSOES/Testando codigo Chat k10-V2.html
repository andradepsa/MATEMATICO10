<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>K10 OMNI-AUDITOR | GALAXY-CLASS v3.0</title>
    <style>
        :root { 
            --glow: #00f2ff; --bg: #02040a; --panel: #0d1117; 
            --danger: #ff3366; --success: #00ffaa; --warn: #ffcc00;
            --accent: #58a6ff;
        }
        body { 
            background: var(--bg); color: #c9d1d9; font-family: 'JetBrains Mono', monospace; 
            margin: 0; overflow-x: hidden; font-size: 12px;
        }
        /* Dashboard Layout */
        .dashboard { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
        .sidebar { 
            background: var(--panel); border-right: 1px solid #30363d; padding: 25px; 
            display: flex; flex-direction: column; gap: 20px;
        }
        .main-view { padding: 30px; overflow-y: auto; background: radial-gradient(circle at top right, #161b22, #02040a); }
        
        /* Elements */
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .glitch-title { color: var(--glow); font-size: 1.5rem; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 10px var(--glow); }
        
        /* Test Grid */
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .test-unit { 
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; 
            position: relative; transition: 0.2s;
        }
        .test-unit.active { border-color: var(--glow); box-shadow: 0 0 15px rgba(0,242,255,0.1); }
        .test-unit h4 { margin: 0 0 10px 0; color: var(--accent); font-size: 11px; text-transform: uppercase; }
        .progress-mini { height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; margin-top: 10px; }
        .progress-bar { height: 100%; width: 0%; transition: 0.4s; }

        /* Logs */
        .console { 
            background: #000; border-radius: 8px; padding: 15px; height: 300px; 
            overflow-y: auto; font-size: 11px; border: 1px solid #30363d; line-height: 1.6;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }
        
        /* Inputs */
        input[type="file"] { display: none; }
        .upload-label { 
            display: block; padding: 15px; background: #21262d; border: 2px dashed #30363d; 
            text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .upload-label:hover { border-color: var(--glow); color: var(--glow); }
        
        .btn { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-family: inherit; transition: 0.3s; margin-top: 10px;
        }
        .btn-glow { background: var(--glow); color: #000; }
        .btn-glow:hover { box-shadow: 0 0 25px var(--glow); transform: translateY(-2px); }

        iframe { width: 0; height: 0; border: none; visibility: hidden; }
    </style>
</head>
<body>

<div class="dashboard">
    <aside class="sidebar">
        <div class="card">
            <h2 class="glitch-title">K10-OMNI</h2>
            <p style="font-size: 10px; opacity: 0.5;">GALAXY CLASS SECURITY AUDITOR</p>
        </div>

        <div class="card">
            <label class="upload-label" for="chatFile">
                <span>📂 CARREGAR MONOBLOCO K20</span>
                <input type="file" id="chatFile">
            </label>
            <button class="btn btn-glow" id="startBtn" disabled>INICIAR VARREDURA TOTAL</button>
        </div>

        <div class="card">
            <h3>STATUS DA MISSÃO</h3>
            <div id="missionStatus">EM ESPERA...</div>
            <div class="progress-mini"><div id="totalProgress" class="progress-bar" style="background: var(--glow)"></div></div>
        </div>

        <div class="console" id="mainConsole">
            <div class="log-entry" style="color: var(--warn)">> Sistema pronto para diagnóstico profundo.</div>
        </div>
    </aside>

    <main class="main-view">
        <div class="status-header">
            <div>
                <h1 id="fileNameLabel">NENHUM FICHEIRO SELECIONADO</h1>
                <p id="fileSizeLabel">Aguardando telemetria...</p>
            </div>
            <div class="card" style="padding: 10px 20px; text-align: right;">
                <div style="font-size: 20px; color: var(--success);" id="finalScore">000.0</div>
                <div style="font-size: 9px;">SCORE DE INTEGRIDADE</div>
            </div>
        </div>

        <div class="test-grid" id="testGrid">
            </div>

        <div class="card" id="reportArea" style="margin-top: 25px; display: none;">
            <h3 style="color: var(--glow)">📄 RELATÓRIO DE CAIXA PRETA (JSON)</h3>
            <textarea id="jsonOutput" readonly style="width:100%; height:120px; background:#000; color:var(--success); border:1px solid #333; font-family:monospace; margin-top:10px; padding:10px;"></textarea>
            <button class="btn" style="background:#238636; color:white;" id="copyBtn">COPIAR PARA IA</button>
        </div>
    </main>
</div>

<iframe id="sandbox"></iframe>

<script>
    // DEFINIÇÃO DOS TESTES GALAXY-CLASS
    const OMNI_TESTS = [
        { id: 'core', name: 'Arquitetura React/Babel', desc: 'Verifica montagem do JSX e loops de renderização.', weight: 15 },
        { id: 'p2p', name: 'Motor PeerJS & Network', desc: 'Valida IDs -CENTRAL e sinalização P2P.', weight: 15 },
        { id: 'crypto', name: 'Criptografia AES-256-GCM', desc: 'Verifica deriveKey e SubtleCrypto integrity.', weight: 20 },
        { id: 'torrent', name: 'WebTorrent Engine', desc: 'Teste de magnet links e fragmentação de dados.', weight: 10 },
        { id: 'security', name: 'Blindagem XSS/Sanitization', desc: 'Varredura por dangerouslySetInnerHTML e injeções.', weight: 15 },
        { id: 'quiz', name: 'IA & Quiz Bot Engine', desc: 'Valida tradução dinâmica e repositório JSON.', weight: 10 },
        { id: 'multimedia', name: 'AV Stream & Whiteboard', desc: 'Integridade de Canvas e MediaDevices.', weight: 15 }
    ];

    let fileContent = "";
    const consoleEl = document.getElementById('mainConsole');
    const startBtn = document.getElementById('startBtn');
    const sandbox = document.getElementById('sandbox');

    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = 'log-entry';
        const color = type === 'error' ? 'var(--danger)' : (type === 'warn' ? 'var(--warn)' : '#c9d1d9');
        div.style.color = color;
        div.innerText = `> ${new Date().toLocaleTimeString()} | ${msg}`;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    document.getElementById('chatFile').onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        fileContent = await file.text();
        document.getElementById('fileNameLabel').innerText = file.name.toUpperCase();
        document.getElementById('fileSizeLabel').innerText = `${(file.size / 1024).toFixed(2)} KB DETECTADOS`;
        startBtn.disabled = false;
        log(`Ficheiro ${file.name} carregado com sucesso.`);
        setupTestGrid();
    };

    function setupTestGrid() {
        const grid = document.getElementById('testGrid');
        grid.innerHTML = "";
        OMNI_TESTS.forEach(t => {
            grid.innerHTML += `
                <div class="test-unit" id="unit-${t.id}">
                    <h4>${t.name}</h4>
                    <p style="font-size:10px; opacity:0.7">${t.desc}</p>
                    <div class="progress-mini"><div class="progress-bar" id="bar-${t.id}" style="background:var(--accent)"></div></div>
                    <div id="res-${t.id}" style="font-size:9px; margin-top:5px; text-align:right">PENDENTE</div>
                </div>
            `;
        });
    }

    async function runOmniTest() {
        startBtn.disabled = true;
        log("INICIANDO PROTOCOLO OMNI-AUDITOR...", "warn");
        let totalScore = 0;
        const results = {};

        for(let i=0; i < OMNI_TESTS.length; i++) {
            const t = OMNI_TESTS[i];
            const unit = document.getElementById(`unit-${t.id}`);
            const bar = document.getElementById(`bar-${t.id}`);
            const resText = document.getElementById(`res-${t.id}`);
            
            unit.classList.add('active');
            log(`Executando: ${t.name}...`);
            
            let score = 0;
            let detail = "";

            // Lógica de Teste Individual
            switch(t.id) {
                case 'core':
                    score = fileContent.includes('id="root"') && fileContent.includes('Babel') ? 100 : 0;
                    detail = score === 100 ? "Virtual DOM Correct" : "Root or Babel Missing";
                    break;
                case 'p2p':
                    score = fileContent.includes('-CENTRAL') && fileContent.includes('Peer') ? 100 : 50;
                    detail = score === 100 ? "P2P Logic Standardized" : "Central ID Logic Weak";
                    break;
                case 'crypto':
                    const hasSubtle = fileContent.includes('crypto.subtle');
                    const hasAES = fileContent.includes('AES-GCM');
                    score = hasSubtle && hasAES ? 100 : (hasSubtle ? 60 : 0);
                    detail = score === 100 ? "Military Grade Cryptography" : "Crypto Incomplete";
                    break;
                case 'security':
                    const dangerous = (fileContent.match(/dangerouslySetInnerHTML/g) || []).length;
                    score = dangerous === 0 ? 100 : Math.max(0, 100 - (dangerous * 20));
                    detail = dangerous === 0 ? "No XSS Injections Found" : `${dangerous} security holes found`;
                    break;
                case 'quiz':
                    score = fileContent.includes('translateQuizText') && fileContent.includes('QUIZ_SUBJECTS') ? 100 : 30;
                    detail = score === 100 ? "Multilingual Bot Valid" : "Bot Logic Missing";
                    break;
                case 'multimedia':
                    score = fileContent.includes('canvas') && fileContent.includes('VoiceRecorder') ? 100 : 40;
                    detail = "Media Handlers Verified";
                    break;
                case 'torrent':
                    score = fileContent.includes('WebTorrent') || fileContent.includes('handleTorrentSeed') ? 100 : 0;
                    detail = "WebTorrent Engine Ready";
                    break;
            }

            // Animação da barra
            bar.style.width = "100%";
            bar.style.background = score > 70 ? 'var(--success)' : (score > 40 ? 'var(--warn)' : 'var(--danger)');
            resText.innerText = `${score}% | ${detail}`;
            
            results[t.id] = { score, detail };
            totalScore += (score * (t.weight / 100));
            
            await new Promise(r => setTimeout(r, 600));
            unit.classList.remove('active');
            document.getElementById('totalProgress').style.width = `${((i+1)/OMNI_TESTS.length)*100}%`;
        }

        finalize(totalScore, results);
    }

    function finalize(score, results) {
        document.getElementById('finalScore').innerText = score.toFixed(1);
        document.getElementById('missionStatus').innerText = score > 90 ? "🟢 SISTEMA IMPECÁVEL" : "🔴 REVISÃO OBRIGATÓRIA";
        
        const report = {
            id: "K10-GALAXY-" + Math.random().toString(36).substr(2, 9).toUpperCase(),
            score: score.toFixed(2),
            tests: results,
            integrity_check: "COMPLETED",
            date: new Date().toISOString()
        };

        document.getElementById('jsonOutput').value = JSON.stringify(report, null, 2);
        document.getElementById('reportArea').style.display = "block";
        log("AUDITORIA CONCLUÍDA. Relatório gerado.", "success");
    }

    startBtn.onclick = runOmniTest;
    document.getElementById('copyBtn').onclick = () => {
        document.getElementById('jsonOutput').select();
        document.execCommand('copy');
        alert("RELATÓRIO DE CAIXA PRETA COPIADO!");
    };
</script>
</body>
</html>
