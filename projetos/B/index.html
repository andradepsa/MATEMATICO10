<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Menu Disciplinas</title>
  <style>
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 200px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }
    .dropdown-content a {
      color: black;
      padding: 8px 12px;
      text-decoration: none;
      display: block;
    }
    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }
    .dropdown.show .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
<div class="dropdown" id="dd-disciplinas">
  <button class="dropbtn" onclick="toggleMenu('dd-disciplinas')">📚 Disciplinas ▾</button>
  <div class="dropdown-content" id="lista-disciplinas">
    <!-- Links das disciplinas serão inseridos aqui -->
  </div>
</div>
<script>
  // Função para abrir/fechar menu
  function toggleMenu(id) {
    document.getElementById(id).classList.toggle("show");
  }
  // Função fictícia para carregar arquivos
  function carregar(arquivo) {
    console.log("Carregando:", arquivo);
    // Aqui você coloca sua lógica real de leitura/uso do JSON
  }
  // Cada disciplina tem uma lista de arquivos
  const disciplinas = {
    "➗ Matemática": [
      "matematica1.json",
      "matematica2.json",
      "matematica3.json",
      "matematica4.json"
    ],
    "🌍 Geografia": [
      "geografia1.json",
      "geografia2.json"
    ],
    "🧬 Biologia": [
      "biologia1.json",
      "biologia2.json"
    ],
    "📜 História": [
      "historia1.json",
      "historia2.json"
    ],
    "⚛️ Física": [
      "fisica1.json",
      "fisica2.json"
    ]
  };
  const lista = document.getElementById("lista-disciplinas");
  // Cria um link por disciplina
  Object.entries(disciplinas).forEach(([nome, arquivos]) => {
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = nome;
    link.onclick = () => {
      arquivos.forEach(arq => carregar(arq));
    };
    lista.appendChild(link);
  });
</script>
</body>
</html>
