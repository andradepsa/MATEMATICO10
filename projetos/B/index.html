<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulados Online</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
  color: #333;
}

/* HEADER */
header {
  text-align: center;
  padding: 40px;
  background: #111;
  color: #fff;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* CARDS */
.card {
  background: #fff;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
  font-size: 18px;
  font-weight: bold;
  border: 1px solid #ddd;
}

.card:hover {
  transform: scale(1.05);
  background: #111;
  color: #fff;
}

/* QUIZ */
#quiz {
  padding: 20px;
}

.questao {
  background: #fff;
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

/* TOPO */
.topo-botoes {
  margin-bottom: 20px;
}

/* INPUT */
input[type="number"] {
  padding: 8px;
  width: 80px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

/* BOTÕES */
button {
  margin: 5px;
  padding: 10px 15px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background: #111;
  color: #fff;
  transition: 0.3s;
}

button:hover {
  background: #444;
}

/* RESULTADOS */
.correta {
  color: #0a7a0a;
  font-weight: bold;
}

.errada {
  color: #c00000;
  font-weight: bold;
}

/* LINK LOGO */
.logo-link {
  display: inline-block;
  margin-top: 15px;
  text-align: center;
  color: #fff;
  text-decoration: none;
}

.logo-link img {
  width: 80px;
}

.logo-link div {
  margin-top: 8px;
  font-weight: bold;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<header>
  <h1>📚 Simulados Online</h1>
  <p>Escolha uma matéria</p>

  <a href="https://www.matematico10.com.br/" class="logo-link">
    <img src="https://i.ibb.co/r8cSn8n/Simbolo-Matem-tico-10-removebg-preview.png">
    <div>Volte Matemático 10</div>
  </a>
</header>

<div class="container">
  <div class="card" onclick="carregar('matematica.json')">📐 Matemática</div>
  <div class="card" onclick="carregar('geografia.json')">🌎 Geografia</div>
  <div class="card" onclick="carregar('biologia.json')">🧬 Biologia</div>
  <div class="card" onclick="carregar('historia.json')">📜 História</div>
  <div class="card" onclick="carregar('fisica.json')">⚡ Física</div>

  <div class="card" onclick="window.location.href='https://www.matematico10.com.br/V%C3%ADdeosK10'">
    📁 Minha Teca
  </div>
</div>

<div id="quiz"></div>

<script>
let questoes = [];
let questoesSelecionadas = [];
let respostasUsuario = [];
let quantidade = 10;

async function carregar(arquivo) {
  const resposta = await fetch(arquivo);
  questoes = await resposta.json();
  gerarLista();
}

function embaralhar(array) {
  return array.sort(() => Math.random() - 0.5);
}

function gerarLista() {
  quantidade = parseInt(document.getElementById("qtd")?.value) || 10;

  const misturadas = embaralhar([...questoes]);
  questoesSelecionadas = misturadas.slice(0, quantidade);

  questoesSelecionadas = questoesSelecionadas.map(q => {
    let opcoes = q.opcoes.map((texto, index) => ({
      texto,
      correta: index === q.correta
    }));

    opcoes = embaralhar(opcoes);

    return {
      pergunta: q.pergunta,
      opcoes: opcoes.map(o => o.texto),
      correta: opcoes.findIndex(o => o.correta)
    };
  });

  mostrarQuestoes();
}

function mostrarQuestoes() {
  const quiz = document.getElementById('quiz');

  quiz.innerHTML = `
    <div class="topo-botoes">
      <label>Quantidade:</label>
      <input type="number" id="qtd" value="${quantidade}" min="1">
      <button onclick="gerarLista()">🔄 Gerar Lista</button>
      <button onclick="corrigir()">✅ Finalizar</button>
      <button onclick="baixarPDF()">📄 Baixar PDF</button>
    </div>
  `;

  questoesSelecionadas.forEach((q, index) => {
    const div = document.createElement('div');
    div.classList.add('questao');

    let html = `<p><strong>${index + 1}. ${q.pergunta}</strong></p>`;

    q.opcoes.forEach((opcao, i) => {
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${String.fromCharCode(65 + i)}) ${opcao}
        </label><br>
      `;
    });

    div.innerHTML = html;
    quiz.appendChild(div);
  });
}

function corrigir() {
  let acertos = 0;
  respostasUsuario = [];

  questoesSelecionadas.forEach((q, index) => {
    const marcada = document.querySelector(`input[name="q${index}"]:checked`);

    if (marcada) {
      const resposta = parseInt(marcada.value);
      respostasUsuario.push(resposta);
      if (resposta === q.correta) acertos++;
    } else {
      respostasUsuario.push(null);
    }
  });

  mostrarResultado(acertos);
}

function mostrarResultado(acertos) {
  const quiz = document.getElementById('quiz');

  let html = `<h2>Resultado Final</h2>`;
  html += `<p>Você acertou ${acertos} de ${questoesSelecionadas.length}</p><hr>`;

  questoesSelecionadas.forEach((q, index) => {
    html += `<p><strong>${index + 1}. ${q.pergunta}</strong></p>`;

    q.opcoes.forEach((opcao, i) => {
      let classe = "";

      if (i === q.correta) classe = "correta";
      if (respostasUsuario[index] === i && i !== q.correta) classe = "errada";

      html += `<p class="${classe}">${String.fromCharCode(65 + i)}) ${opcao}</p>`;
    });

    html += "<br>";
  });

  quiz.innerHTML = html;
}

function baixarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  doc.setFontSize(16);
  doc.text("SIMULADO", 105, 10, null, null, "center");

  doc.setFontSize(10);

  questoesSelecionadas.forEach((q, index) => {
    let texto = `${index + 1}. ${q.pergunta}`;
    let linhas = doc.splitTextToSize(texto, 180);

    doc.text(linhas, 10, y);
    y += linhas.length * 5;

    q.opcoes.forEach((opcao, i) => {
      let opcaoTexto = `${String.fromCharCode(65 + i)}) ${opcao}`;
      let linhasOp = doc.splitTextToSize(opcaoTexto, 170);

      doc.text(linhasOp, 15, y);
      y += linhasOp.length * 5;
    });

    y += 5;

    if (y > 270) {
      doc.addPage();
      y = 20;
    }
  });

  doc.save("simulado.pdf");
}
</script>

</body>
</html>
