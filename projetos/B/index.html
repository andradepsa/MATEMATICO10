<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Menu Disciplinas</title>
  <style>
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 200px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }
    .dropdown-content a {
      color: black;
      padding: 8px 12px;
      text-decoration: none;
      display: block;
    }
    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }
    .dropdown.show .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>
<div class="dropdown" id="dd-disciplinas">
  <button class="dropbtn" onclick="toggleMenu('dd-disciplinas')">📚 Disciplinas ▾</button>
  <div class="dropdown-content" id="lista-disciplinas">
    <!-- Links das disciplinas serão inseridos aqui -->
  </div>
</div>
<script>
  // Função para abrir/fechar menu
  function toggleMenu(id) {
    document.getElementById(id).classList.toggle("show");
  }

  // Gera array de nomes: prefixo + 1..total + ".json"
  function gerarArquivos(prefixo, total) {
    return Array.from({ length: total }, (_, i) => `${prefixo}${i + 1}.json`);
  }

  // Função para carregar múltiplos arquivos JSON em paralelo e mesclar
  async function carregar(arquivos) {
    const respostas = await Promise.all(arquivos.map(arq => fetch(arq)));
    const jsons = await Promise.all(respostas.map(res => res.json()));
    const dadosMesclados = jsons.flat();
    console.log("Carregando:", dadosMesclados);
    // Aqui você coloca sua lógica real de leitura/uso do JSON
  }

  // Cada disciplina tem uma lista de arquivos gerada automaticamente
  const disciplinas = {
    "➗ Matemática": gerarArquivos("matematica", 12),
    "🌍 Geografia":  gerarArquivos("geografia",   2),
    "🧬 Biologia":   gerarArquivos("biologia",    2),
    "📜 História":   gerarArquivos("historia",    2),
    "⚛️ Física":     gerarArquivos("fisica",      2),
  };

  const lista = document.getElementById("lista-disciplinas");
  // Cria um link por disciplina
  Object.entries(disciplinas).forEach(([nome, arquivos]) => {
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = nome;
    link.onclick = () => carregar(arquivos);
    lista.appendChild(link);
  });
</script>
</body>
</html>
