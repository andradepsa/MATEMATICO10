<script>
window.__M10_DATA__ = { matematica: [], fisica: [], historia: [], geografia: [], biologia: [], gerais: [], videos: [] };
window.__M10_DATA_LOADED__ = false;
window.__M10_OFFLINE__ = false;
window.__M10_CACHE_INFO__ = { hits: 0, misses: 0, savedAt: null };

function m10CacheGet(key) {
  try {
    const raw = localStorage.getItem("m10-cache-" + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.data)) return null;
    return obj;
  } catch (e) { return null; }
}
function m10CacheSet(key, data) {
  try {
    localStorage.setItem("m10-cache-" + key, JSON.stringify({ t: Date.now(), data }));
  } catch (e) { /* cota cheia — sem problema */ }
}

function parseVideosFromHtml(html) {
  const re = /<a\s+href="https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{6,})"[^>]*>([^<]+)<\/a>(?:\s*\(([^)]*)\))?/g;
  const seen = new Map();
  let m;
  while ((m = re.exec(html)) !== null) {
    const id = m[1], title = m[2].trim(), dur = (m[3] || "—").trim();
    if (!seen.has(id)) seen.set(id, { id, title, dur });
  }
  return Array.from(seen.values());
}

window.__M10_DATA_PROMISE__ = (async () => {
  const GITHUB_BASE = "https://raw.githubusercontent.com/andradepsa/MATEMATICO10/main/projetos/B/";
  const VIDEOS_URL = "https://raw.githubusercontent.com/andradepsa/MATEMATICO10/main/V%C3%ADdeosK10.html";

  const remoteFiles = ["matematica", "fisica", "historia", "geografia", "biologia", "gerais"];
  await Promise.all(remoteFiles.map(async (name) => {
    try {
      const r = await fetch(GITHUB_BASE + name + ".json");
      if (r.ok) {
        const json = await r.json();
        window.__M10_DATA__[name] = json;
        m10CacheSet(name, json);
      } else {
        throw new Error("HTTP " + r.status);
      }
    } catch (e) {
      const cached = m10CacheGet(name);
      if (cached && cached.data.length > 0) {
        window.__M10_DATA__[name] = cached.data;
        window.__M10_CACHE_INFO__.hits++;
        window.__M10_CACHE_INFO__.savedAt = cached.t;
        window.__M10_OFFLINE__ = true;
        console.warn("⚠ " + name + ": usando cache local (" + cached.data.length + " questões de " + new Date(cached.t).toLocaleDateString("pt-BR") + ")");
      } else {
        window.__M10_CACHE_INFO__.misses++;
        console.warn("Falha ao carregar " + name + ".json:", e.message);
      }
    }
  }));

  try {
    const r = await fetch(VIDEOS_URL);
    if (r.ok) {
      const html = await r.text();
      window.__M10_DATA__.videos = parseVideosFromHtml(html);
      m10CacheSet("videos", window.__M10_DATA__.videos);
      console.log("✓ " + window.__M10_DATA__.videos.length + " vídeos extraídos do VídeosK10.html");
    } else {
      throw new Error("HTTP " + r.status);
    }
  } catch (e) {
    const cached = m10CacheGet("videos");
    if (cached && cached.data.length > 0) {
      window.__M10_DATA__.videos = cached.data;
      window.__M10_CACHE_INFO__.hits++;
      window.__M10_OFFLINE__ = true;
      console.warn("⚠ vídeos: usando cache local (" + cached.data.length + ")");
    }
  }

  /* Ciclo 44: se TODOS os bancos falharam sem cache, sinaliza erro para retry */
  const falhasTotais = window.__M10_CACHE_INFO__.misses;
  window.__M10_DATA_ERROR__ = falhasTotais >= 6;
  window.__M10_DATA_LOADED__ = true;
  window.dispatchEvent(new Event("m10-data-loaded"));
  console.log("✓ Dados carregados:", Object.keys(window.__M10_DATA__).map(k => k + ":" + (window.__M10_DATA__[k] || []).length).join(", "));
})();
</script>

function useDataLoaded() {
  const [loaded, setLoaded] = useState(window.__M10_DATA_LOADED__ || false);

    if (loaded) return;
    const handler = () => setLoaded(true);

function ri(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  while (b) {
    const t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}
function lcm(a, b) {
  return Math.abs(a * b) / gcd(a, b);
}

  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;

}

  if (k > n || k < 0) return 0;
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return Math.round(r);
}
function fmt(v) {
  return typeof v === "number" ? String(Math.round(v * 1e6) / 1e6) : String(v);
}
function validarQuestao(q) {
  if (!q || typeof q !== "object") return false;

  if (!Array.isArray(q.opcoes) || q.opcoes.length !== 4 && q.opcoes.length !== 5) return false;

function distratores(correto, tipo) {
  const res = [];
  const mults = [1.08, 0.91, 1.18, 0.82, 1.25, 0.75, 1.35, 0.65];
  for (const m of mults) {
    if (res.length >= 3) break;
    let v;
    if (tipo === "inteiro") v = Math.round(correto * m + (m > 1 ? 1 : -1));else v = parseFloat((correto * m).toFixed(2));
    if (v !== correto && !res.includes(v)) res.push(v);
  }
  const delta = Math.max(1, Math.abs(correto) * 0.12);
  while (res.length < 3) res.push(Math.round(correto + delta * (res.length + 2)));

}

  const pool = arr || GMAT;

  let candidatos = exatos.length > 0 ? exatos : pool;
  if (candidatos.length === 0) candidatos = pool;
  for (let t = 0; t < 20; t++) {
    try {
      const g = candidatos[Math.floor(Math.random() * candidatos.length)];
      const q = g.fn();
      if (validarQuestao(q)) return q;
    } catch (e) {}
  }
  /* Ciclo 8: fallback robusto — tenta qualquer gerador do pool antes da questão de segurança */
  for (let t = 0; t < 10; t++) {
    try {
      const g = pool[Math.floor(Math.random() * pool.length)];
      const q = g.fn();
      if (validarQuestao(q)) return q;
    } catch (e) {}
  }

  };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toQuestion(q) {
  const tagged = q.opcoes.map((t, i) => ({
    t: typeof t === "string" ? t.trim() : t,
    correta: i === q.correta
  }));
  const sh = shuffle(tagged);
  return {
    pergunta: q.pergunta,
    opcoes: sh.map(o => o.t),
    correta: sh.findIndex(o => o.correta),
    explicacao: typeof q.explicacao === "string" && q.explicacao.trim() ? q.explicacao.trim() : "",
    origem: "json"
  };
}
function generateQuestions(subjectId, count, opts) {

  const diff = o.diff || 2;
  const reviewList = o.review || [];
  const fileMap = {
    mat: "matematica",
    fis: "fisica",
    hist: "historia",
    geo: "geografia",
    bio: "biologia",
    ger: "gerais"
  };

  const injectReview = list => {
    if (reviewList.length === 0 || list.length === 0) return list;
    const nRev = Math.min(reviewList.length, Math.max(1, Math.round(count * 0.2)));
    const rev = shuffle(reviewList).slice(0, nRev).map(q => ({
      ...toQuestion(q),
      explicacao: q.explicacao || "Esta questão apareceu antes e você errou — bora acertar agora!",
      isReview: true
    }));
    return shuffle([...list.slice(nRev), ...rev]);
  };

  if (subjectId === "desafio") {
    const out = [];
    const mats = Math.ceil(count * 0.4);
    for (let i = 0; i < mats; i++) out.push({ ...gerarQuestaoIA(GMAT, diff), origem: "ia" });
    const others = [
      { arr: GPORT, origem: "ia" },
      { arr: GING, origem: "ia" },
      { arr: GQUIM, origem: "ia" },
      { arr: GFIS, origem: "ia" },
      { arr: GHIST, origem: "ia" },
      { arr: GGEO, origem: "ia" },
      { arr: GBIO, origem: "ia" }
    ];
    const rest = count - mats;
    const bancos = ["fisica", "historia", "geografia", "biologia", "gerais"].filter(f => (window.__M10_DATA__[f] || []).length > 0);
    for (let i = 0; i < rest; i++) {
      if (bancos.length > 0 && Math.random() < 0.5) {
        const f = bancos[ri(0, bancos.length - 1)];
        const bank = window.__M10_DATA__[f].filter(validarQuestao);
        out.push({ ...toQuestion(bank[ri(0, bank.length - 1)]), origem: "json" });
      } else {
        const g = others[ri(0, others.length - 1)];
        out.push({ ...gerarQuestaoIA(g.arr, 2), origem: g.origem });
      }
    }
    return shuffle(out);
  }

  const subject = getSubject(subjectId);
  if (subject && subject.mode === "gerador" && subject.gen) {
    const list = [];
    for (let i = 0; i < count; i++) list.push({ ...gerarQuestaoIA(subject.gen, diff), origem: "ia" });
    return injectReview(list);
  }

  const file = fileMap[subjectId];
  if (!file) return [];
  const bank = (window.__M10_DATA__[file] || []).filter(validarQuestao);

  /* Matérias híbridas: geradores locais + banco JSON (50/50) — bancos antigos preservados */
  const MIXED = { mat: GMAT, fis: GFIS, hist: GHIST, geo: GGEO, bio: GBIO };
  const mixedArr = MIXED[subjectId];
  if (mixedArr) {
    const halfIA = Math.ceil(count / 2);
    const halfJSON = count - halfIA;
    const fromIA = [];
    for (let i = 0; i < halfIA; i++) fromIA.push({ ...gerarQuestaoIA(mixedArr, diff), origem: "ia" });
    let fromJSON = [];
    if (bank.length > 0) {
      fromJSON = shuffle(bank).slice(0, halfJSON).map(toQuestion);
    } else {
      for (let i = 0; i < halfJSON; i++) fromJSON.push({ ...gerarQuestaoIA(mixedArr, diff), origem: "ia" });
    }
    return injectReview(shuffle([...fromIA, ...fromJSON]));
  }
  if (bank.length === 0) {
    const fallback = [];
    for (let i = 0; i < count; i++) fallback.push({ ...gerarQuestaoIA(GMAT, diff), origem: "ia" });
    return fallback;
  }
  return injectReview(shuffle(bank).slice(0, count).map(toQuestion));
}

const RANK_WEIGHT_QUESTION = 10,

function computeRankScore(s) {
  return s.questionsAnswered * RANK_WEIGHT_QUESTION + s.videosWatched * RANK_WEIGHT_VIDEO + s.minutesWatched * RANK_WEIGHT_MINUTE;
}
function computeLeague(score) {
  let league = LEAGUES[0];
  for (let i = 0; i < LEAGUES.length; i++) if (score >= LEAGUE_THRESHOLDS[i]) league = LEAGUES[i];
  return league;
}
function leagueProgress(score) {
  const current = computeLeague(score);
  const idx = LEAGUES.indexOf(current);
  const base = LEAGUE_THRESHOLDS[idx];
  if (idx >= LEAGUES.length - 1) return {
    current,
    next: null,
    into: score - base,
    need: 0,
    pct: 1
  };
  const nextThreshold = LEAGUE_THRESHOLDS[idx + 1];
  return {
    current,
    next: LEAGUES[idx + 1],
    into: score - base,
    need: nextThreshold - base,
    pct: (score - base) / (nextThreshold - base)
  };
}
function levelFromXp(xp) {
  let lvl = 1,
    need = 50,
    acc = 0,
    prev = 0;
  while (xp >= acc + need) {
    acc += need;
    prev = acc;
    lvl++;
    need = Math.round(need * 1.18);
  }
  return {
    level: lvl,
    into: xp - prev,
    need,
    pct: (xp - prev) / need
  };
}
