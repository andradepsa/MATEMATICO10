<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulados Online</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #333;
    }

    header {
      text-align: center;
      padding: 40px;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .card:hover {
      transform: scale(1.05);
    }

    #quiz {
      padding: 20px;
    }

    .questao {
      background: white;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>📚 Simulados Online</h1>
  <p>Escolha uma matéria para começar</p>
</header>

<div class="container">
  <div class="card" onclick="carregar('matematica.json')">📐 Matemática</div>
  <div class="card" onclick="carregar('geografia.json')">🌎 Geografia</div>
  <div class="card" onclick="carregar('biologia.json')">🧬 Biologia</div>
  <div class="card" onclick="carregar('historia.json')">📜 História</div>
  <div class="card" onclick="carregar('fisica.json')">⚡ Física</div>
</div>

<div id="quiz"></div>

<script>
let questoes = [];

async function carregar(arquivo) {
  const resposta = await fetch(arquivo);
  questoes = await resposta.json();
  mostrarQuestoes();
}

function mostrarQuestoes() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';

  questoes.forEach((q, index) => {
    const div = document.createElement('div');
    div.classList.add('questao');

    let html = `<p><strong>${index + 1}. ${q.pergunta}</strong></p>`;

    q.opcoes.forEach((opcao, i) => {
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${opcao}
        </label><br>
      `;
    });

    html += `<button onclick="verificar(${index})">Responder</button>`;
    html += `<p id="res${index}"></p>`;

    div.innerHTML = html;
    quiz.appendChild(div);
  });
}

function verificar(index) {
  const resposta = document.querySelector(`input[name="q${index}"]:checked`);
  const resultado = document.getElementById(`res${index}`);

  if (!resposta) {
    resultado.innerText = "Escolha uma opção!";
    return;
  }

  if (parseInt(resposta.value) === questoes[index].correta) {
    resultado.innerText = "✅ Correto!";
  } else {
    resultado.innerText = "❌ Errado!";
  }
}
</script>

</body>
</html>
