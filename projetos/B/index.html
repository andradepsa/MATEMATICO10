<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Central de Estudos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #333;
  }

  header {
    text-align: center;
    padding: 40px 20px;
    background: #111;
    color: #fff;
  }

  header h1 { margin: 0 0 10px; }
  header p { margin: 0 0 15px; }

  .logo-link {
    display: inline-block;
    text-align: center;
    color: #fff;
    text-decoration: none;
  }

  .logo-link img {
    width: 80px;
    display: block;
    margin: 0 auto;
  }

  .logo-link div {
    margin-top: 8px;
    font-weight: bold;
    font-size: 0.9rem;
  }

  /* DROPDOWN */
  .dropdown {
    position: relative;
    display: inline-block;
    margin: 10px;
  }

  .dropbtn {
    background-color: #111;
    color: white;
    padding: 15px 20px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.3s;
  }

  .dropbtn:hover { background-color: #444; }

  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #fff;
    min-width: 200px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    border-radius: 8px;
    z-index: 1;
  }

  .dropdown-content a {
    color: #111;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    font-weight: bold;
  }

  .dropdown-content a:hover { background-color: #f1f1f1; }

  .dropdown:hover .dropdown-content { display: block; }

  /* RESPONSIVO */
  @media (max-width: 500px) {
    .dropdown { display: block; margin: 10px auto; }
  }

  #quiz { padding: 20px; }
  .questao { background: #fff; margin-bottom: 15px; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
  .topo-botoes { margin-bottom: 20px; }

  input[type="number"] { padding: 8px; width: 80px; border: 1px solid #ccc; border-radius: 5px; }

  button {
    margin: 5px;
    padding: 10px 15px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background: #111;
    color: #fff;
    transition: 0.3s;
  }
  button:hover { background: #444; }

  .correta { color: #0a7a0a; font-weight: bold; }
  .errada { color: #c00000; font-weight: bold; }
</style>
</head>

<body>
<header>
  <h1>Central de Estudos</h1>
  <p>Escolha uma opção</p>

  <a href="https://www.matematico10.com.br/" class="logo-link">
    <img src="https://i.ibb.co/DNQv5x8/Simbolo-Matem-tico-10-removebg-preview.pngg" alt="Logo Matemático 10">
    <div>Volte Matemático 10</div>
  </a>
</header>

<div style="text-align:left; margin: 20px;">
  
<div style="text-align:center; margin: 20px 0;">
  
  <!-- Disciplinas -->
  <div class="dropdown">
    <button class="dropbtn">📚 Disciplinas</button>
    <div class="dropdown-content">
      <a href="#" onclick="carregar('matematica.json')">➗ Matemática</a>
      <a href="#" onclick="carregar('geografia.json')">🌍 Geografia</a>
      <a href="#" onclick="carregar('biologia.json')">🧬 Biologia</a>
      <a href="#" onclick="carregar('historia.json')">📜 História</a>
      <a href="#" onclick="carregar('fisica.json')">⚛️ Física</a>
    </div>
  </div>

  <!-- Recursos -->
  <div class="dropdown">
    <button class="dropbtn">📁 Recursos</button>
    <div class="dropdown-content">
      <a href="https://www.matematico10.com.br/V%C3%ADdeosK10">🎬 Minha Teca</a>
      <a href="https://www.matematico10.com.br/projetos/PlanejAnuais">📅 Plan.Anuais</a>
      <a href="https://www.matematico10.com.br/projetos/C/ProvasObmep">📝 Provas OBMEP</a>
      <a href="https://andradepsa.github.io/MATEMATICO10/projetos/D/index.html">🧠 Hyperdimensional</a>
      <a href="https://andradepsa.github.io/MATEMATICO10/projetos/UniversalChess.html">Universal Chess</a>
      <a href="https://andradepsa.github.io/MATEMATICO10/projetos/Museu.html">Museu Matemático 10</a>
      <a href="https://andradepsa.github.io/MATEMATICO10/projetos/heart-equation.html">Heart Equation</a>
    </div>
  </div>

</div>

<style>
/* Mantém os botões lado a lado no centro */
.dropdown {
  display: inline-block;
  position: relative;
  margin: 0 5px;
}

.dropbtn {
  padding: 10px 16px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

/* Menu interno alinhado à esquerda */
.dropdown-content {
  display: none;
  position: absolute;
  min-width: max-content;
  background-color: #fff;
  box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
  text-align: left; /* 👈 aqui está o segredo */
}

.dropdown-content a {
  display: block;
  padding: 10px;
  text-decoration: none;
  white-space: nowrap;
  text-align: left; /* garante alinhamento */
}

.dropdown:hover .dropdown-content {
  display: block;
}
</style>
<div id="quiz"></div>

<script>
let questoes = [];
let questoesSelecionadas = [];
let respostasUsuario = [];
let quantidade = 10;

async function carregar(arquivo) {
  const resposta = await fetch(arquivo);
  questoes = await resposta.json();
  gerarLista();
}

function embaralhar(array) { return array.sort(() => Math.random() - 0.5); }

function gerarLista() {
  quantidade = parseInt(document.getElementById("qtd")?.value) || 10;
  const misturadas = embaralhar([...questoes]);
  questoesSelecionadas = misturadas.slice(0, quantidade);
  questoesSelecionadas = questoesSelecionadas.map(q => {
    let opcoes = q.opcoes.map((texto, index) => ({ texto, correta: index === q.correta }));
    opcoes = embaralhar(opcoes);
    return { pergunta: q.pergunta, opcoes: opcoes.map(o => o.texto), correta: opcoes.findIndex(o => o.correta) };
  });
  mostrarQuestoes();
}

function mostrarQuestoes() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = `
    <div class="topo-botoes">
      <label>Quantidade:</label>
      <input type="number" id="qtd" value="${quantidade}" min="1">
      <button onclick="gerarLista()">🔄 Gerar Lista</button>
      <button onclick="corrigir()">✅ Finalizar</button>
      <button onclick="baixarPDF()">📄 Baixar PDF</button>
    </div>
  `;
  questoesSelecionadas.forEach((q, index) => {
    const div = document.createElement('div');
    div.classList.add('questao');
    let html = `<p><strong>${index + 1}. ${q.pergunta}</strong></p>`;
    q.opcoes.forEach((opcao, i) => { html += `<label><input type="radio" name="q${index}" value="${i}">${String.fromCharCode(65 + i)}) ${opcao}</label><br>`; });
    div.innerHTML = html;
    quiz.appendChild(div);
  });
}

function corrigir() {
  let acertos = 0;
  respostasUsuario = [];
  questoesSelecionadas.forEach((q, index) => {
    const marcada = document.querySelector(`input[name="q${index}"]:checked`);
    if (marcada) { const resposta = parseInt(marcada.value); respostasUsuario.push(resposta); if (resposta === q.correta) acertos++; }
    else { respostasUsuario.push(null); }
  });
  mostrarResultado(acertos);
}

function mostrarResultado(acertos) {
  const quiz = document.getElementById('quiz');
  let html = `<h2>Resultado Final</h2>`;
  html += `<p>Você acertou ${acertos} de ${questoesSelecionadas.length}</p><hr>`;
  questoesSelecionadas.forEach((q, index) => {
    html += `<p><strong>${index + 1}. ${q.pergunta}</strong></p>`;
    q.opcoes.forEach((opcao, i) => {
      let classe = "";
      if (i === q.correta) classe = "correta";
      if (respostasUsuario[index] === i && i !== q.correta) classe = "errada";
      html += `<p class="${classe}">${String.fromCharCode(65 + i)}) ${opcao}</p>`;
    });
    html += "<br>";
  });
  quiz.innerHTML = html;
}

function baixarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(16);
  doc.text("SIMULADO", 105, 10, null, null, "center");
  doc.setFontSize(10);
  questoesSelecionadas.forEach((q, index) => {
    let texto = `${index + 1}. ${q.pergunta}`;
    let linhas = doc.splitTextToSize(texto, 180);
    doc.text(linhas, 10, y); y += linhas.length * 5;
    q.opcoes.forEach((opcao, i) => { let linhasOp = doc.splitTextToSize(`${String.fromCharCode(65 + i)}) ${opcao}`, 170); doc.text(linhasOp, 15, y); y += linhasOp.length * 5; });
    y += 5; if (y > 270) { doc.addPage(); y = 20; }
  });
  doc.save("simulado.pdf");
}
</script>
</body>
</html>
