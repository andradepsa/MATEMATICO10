  --bg: #0b0e17; --card: #121827; --text: #eaeef5; --muted: #8b99b5;
  --green: #58cc02; --green-d: #3d9a01; --red: #ff5a47;

#k10bar .kb b { color: var(--gold); }
#k10bar .kb .dot { width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, var(--gold), var(--gold-d)); box-shadow: 0 0 10px rgba(245,166,35,.6); }
#k10bar .kl { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#k10bar .kl::-webkit-scrollbar { display: none; }
#k10bar .kl a { color: var(--muted); text-decoration: none; font-size: 12.5px; font-weight: 700; padding: 8px 10px; border-radius: 9px; white-space: nowrap; }
#k10bar .kl a:hover { color: var(--gold-hi); background: rgba(245,166,35,.1); }

<script>
function ri(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  while (b) {
    const t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}
function lcm(a, b) {
  return Math.abs(a * b) / gcd(a, b);
}
function fat(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function comb(n, k) {
  if (k > n || k < 0) return 0;
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return Math.round(r);
}
function fmt(v) {
  return typeof v === "number" ? String(Math.round(v * 1e6) / 1e6) : String(v);
}
function validarQuestao(q) {
  if (!q || typeof q !== "object") return false;
  if (typeof q.pergunta !== "string" || q.pergunta.trim() === "" || q.pergunta.length > 400) return false;
  if (!Array.isArray(q.opcoes) || q.opcoes.length !== 4 && q.opcoes.length !== 5) return false;
  if (typeof q.correta !== "number" || q.correta < 0 || q.correta > q.opcoes.length - 1) return false;
  if (q.opcoes.some(x => x === null || x === undefined || x === "")) return false;
  if (q.opcoes.some(x => typeof x === "string" && x.length > 200)) return false;
  if (new Set(q.opcoes).size < q.opcoes.length) return false;
  return true;
}

function distratores(correto, tipo) {
  const res = [];
  const mults = [1.08, 0.91, 1.18, 0.82, 1.25, 0.75, 1.35, 0.65];
  for (const m of mults) {
    if (res.length >= 3) break;
    let v;
    if (tipo === "inteiro") v = Math.round(correto * m + (m > 1 ? 1 : -1));else v = parseFloat((correto * m).toFixed(2));
    if (v !== correto && !res.includes(v)) res.push(v);
  }
  const delta = Math.max(1, Math.abs(correto) * 0.12);
  while (res.length < 3) res.push(Math.round(correto + delta * (res.length + 2)));
  return res.slice(0, 3);
}
function montarQuestao(pergunta, correto, tipo) {
  const d = distratores(correto, tipo);
  let opcoes = d.map(v => fmt(v));
  const oc = fmt(correto);
  opcoes = opcoes.filter(o => o !== oc).slice(0, 3);
  while (opcoes.length < 3) opcoes.push(String(Math.abs(correto) + opcoes.length * 11 + 5));
  const set = new Set(opcoes);
  if (set.size < 3) {
    opcoes = Array.from(set);
    while (opcoes.length < 3) opcoes.push(String(correto + opcoes.length * 13));
  }
  const pos = ri(0, 3);
  opcoes.splice(pos, 0, oc);
  opcoes = opcoes.slice(0, 4);
  while (opcoes.length < 4) opcoes.push("—");
  return {
    pergunta: pergunta.trim(),
    opcoes,
    correta: pos
  };
}
/* ===== M10 v2: Motor de geradores com dificuldade + explicações ===== */
const GMAT = [], GPORT = [], GING = [], GQUIM = [], GFIS = [], GHIST = [], GGEO = [], GBIO = [], GFIL = [], GSOC = [], GLIT = [], GART = [], GINF = [];
const addGen = (arr, d, fn) => arr.push({ fn, d: d || 2 });
function Q(pergunta, correto, tipo, explicacao) {
  const q = montarQuestao(pergunta, correto, tipo);
  q.explicacao = explicacao || "";
  return q;
}
const fmtBR = n => n.toLocaleString("pt-BR");
function pickDistinct(pool, n, exclude) {
  const out = [];
  const ex = new Set(Array.isArray(exclude) ? exclude : [exclude]);
  let guard = 0;
  while (out.length < n && guard < 300) {
    guard++;
    const v = pool[ri(0, pool.length - 1)];
    if (!ex.has(v) && !out.includes(v)) out.push(v);
  }
  return out;
}

addGen(GMAT, 1, () => {
  const a = ri(2, 50), b = ri(2, 50);
  return Q(`Quanto é ${a} + ${b}?`, a + b, "inteiro", `Some as unidades e as dezenas: ${a} + ${b} = ${a + b}.`);
});
addGen(GMAT, 1, () => {
  const a = ri(20, 99), b = ri(2, a);
  return Q(`Quanto é ${a} - ${b}?`, a - b, "inteiro", `Subtraindo: ${a} - ${b} = ${a - b}. Dica: conte de ${b} até ${a}.`);
});

function gerarQuestaoIA(arr, diff) {
  const pool = arr || GMAT;
  if (pool.length === 0) pool = GMAT;
  const alvo = diff || 2;
  const exatos = pool.filter(g => g.d === alvo);
  let candidatos = exatos.length > 0 ? exatos : pool;
  if (candidatos.length === 0) candidatos = pool;
  for (let t = 0; t < 20; t++) {
    try {
      const g = candidatos[Math.floor(Math.random() * candidatos.length)];
      const q = g.fn();
      if (validarQuestao(q)) { q.gi = pool.indexOf(g); return q; }
    } catch (e) {}
  }
  /* Ciclo 8: fallback robusto — tenta qualquer gerador do pool antes da questão de segurança */
  for (let t = 0; t < 10; t++) {
    try {
      const g = pool[Math.floor(Math.random() * pool.length)];
      const q = g.fn();
      if (validarQuestao(q)) { q.gi = pool.indexOf(g); return q; }
    } catch (e) {}
  }
  return {
    pergunta: "Quanto é 3 × 4?",
    opcoes: ["10", "12", "14", "16"],
    correta: 1,
    explicacao: "3 × 4 = 12."
  };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toQuestion(q) {
  const tagged = q.opcoes.map((t, i) => ({
    t: typeof t === "string" ? t.trim() : t,
    correta: i === q.correta
  }));
  const sh = shuffle(tagged);
  return {
    pergunta: q.pergunta,
    opcoes: sh.map(o => o.t),
    correta: sh.findIndex(o => o.correta),
    explicacao: typeof q.explicacao === "string" && q.explicacao.trim() ? q.explicacao.trim() : "",
    origem: "json"
  };
}

﻿addGen(GMAT, 2, () => {
  let h = ri(-6, 6);
  let k = ri(-6, 6);
  while (h === k || h === -k) { h = ri(-6, 6); k = ri(-6, 6); }
  const r = ri(1, 6);

  const formatarTermo = (valor, variavel) => {
    if (valor === 0) return variavel;
    if (valor === 1) return `${variavel} - 1`;
    if (valor === -1) return `${variavel} + 1`;
    if (valor > 0) return `${variavel} - ${valor}`;
    return `${variavel} + ${Math.abs(valor)}`;
  };

  const termoX = formatarTermo(h, 'x');
  const termoY = formatarTermo(k, 'y');

  const equacaoCorreta = `(${termoX})² + (${termoY})² = ${r}²`;

  const opcoes = [
    equacaoCorreta,
    `(${formatarTermo(k, 'x')})² + (${formatarTermo(h, 'y')})² = ${r}²`,
    `${termoX} + ${termoY} = ${r}`,
    `(${formatarTermo(-h, 'x')})² + (${formatarTermo(-k, 'y')})² = ${r}²`
  ];

  const opcoesEmbaralhadas = [...opcoes];
  for (let i = opcoesEmbaralhadas.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opcoesEmbaralhadas[i], opcoesEmbaralhadas[j]] = [opcoesEmbaralhadas[j], opcoesEmbaralhadas[i]];
  }

  const novoIndiceCorreta = opcoesEmbaralhadas.indexOf(equacaoCorreta);

  return {
    pergunta: `Escreva a equação da circunferência com centro em (${h}, ${k}) e raio ${r}.`,
    opcoes: opcoesEmbaralhadas,
    correta: novoIndiceCorreta,
    explicacao: `Equação da circunferência: (x − h)² + (y − k)² = r², onde (h, k) é o centro. Com centro (${h}, ${k}) e raio ${r}: ${equacaoCorreta}.`
  };
});

    var item = erros.splice(i, 1)[0];
    erros.push(item);
  } else {
    erros.push({ q: q, sub: subj.id, n: 1, ts: Date.now() });
  }
  saveER(erros);
}
function registrarAcertoNaRevisao(q) {
  var erros = loadER();

/* ---------- validador relaxado p/ bancos (perguntas ENEM longas) ---------- */
function validarBanco(q) {
  if (!q || typeof q !== "object") return false;
  if (typeof q.pergunta !== "string" || !q.pergunta.trim() || q.pergunta.length > 800) return false;
  if (!Array.isArray(q.opcoes) || (q.opcoes.length !== 4 && q.opcoes.length !== 5)) return false;
  if (typeof q.correta !== "number" || q.correta < 0 || q.correta >= q.opcoes.length) return false;
  if (q.opcoes.some(function (x) { return x === null || x === undefined || x === ""; })) return false;
  if (q.opcoes.some(function (x) { return typeof x === "string" && x.length > 300; })) return false;
  if (new Set(q.opcoes).size < q.opcoes.length) return false;
  return true;
}

/* ---------- vídeos: parse + busca Khan-style ---------- */
function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
var STOP = { qual: 1, quanto: 1, quais: 1, como: 1, onde: 1, quando: 1, sobre: 1, para: 1, pelo: 1, pela: 1, com: 1, uma: 1, dos: 1, das: 1, que: 1, seu: 1, sua: 1, esse: 1, essa: 1, este: 1, esta: 1, sao: 1, foi: 1, valor: 1, resolva: 1, calcule: 1, determine: 1, sendo: 1, sabendo: 1, todos: 1, todas: 1, cada: 1, mais: 1, menos: 1, entre: 1, resultado: 1, opcao: 1, correta: 1, marque: 1, assinale: 1, certo: 1, errado: 1, dados: 1, abaixo: 1, seguinte: 1, seguintes: 1, então: 1, apos: 1, durante: 1, segundo: 1, grupo: 1, coluna: 1, linha: 1, figura: 1, texto: 1, afirma: 1, correto: 1, incorreto: 1, relacao: 1, apresenta: 1 };
function stem(w) {
  if (w.length > 7) return w.replace(/(mente|acoes|cao|oes|is|es|s)$/, "");
  if (w.length > 5) return w.replace(/(es|s)$/, "");
  return w;
}
var CURTAS = { pi: 1, mmc: 1, mdc: 1, sen: 1, cos: 1, tan: 1, log: 1, ln: 1, ax: 1, fe: 1, h2o: 1 };
function palavrasChave(texto) {
  var words = norm(texto).split(/[^a-z0-9à-ú]+/).filter(function (w) { return (w.length >= 4 || CURTAS[w]) && !STOP[w]; });
  var st = words.map(function (w) { return CURTAS[w] ? w : stem(w); }).filter(function (w) { return w.length >= 2; });
  var seen = {}, out = [];
  for (var i = 0; i < st.length && out.length < 6; i++) if (!seen[st[i]]) { seen[st[i]] = 1; out.push(st[i]); }
  return out;
}
var _titleCache = new Map();
var _titleWords = new Map();
function buscarVideos(texto, n) {
  if (!VIDEOS.length) return [];
  var keys = palavrasChave(texto);
  if (!keys.length) return [];
  var res = [];
  for (var i = 0; i < VIDEOS.length && res.length < 12; i++) {
    var v = VIDEOS[i];
    var t = _titleCache.get(v.id);
    if (t === undefined) { t = norm(v.title); _titleCache.set(v.id, t); }
    var w = _titleWords.get(v.id);
    if (w === undefined) { w = " " + t.replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ") + " "; _titleWords.set(v.id, w); }
    var sc = 0;
    for (var k = 0; k < keys.length; k++) {
      var key = keys[k];
      var hit = key.length <= 3 ? w.indexOf(" " + key + " ") >= 0 : t.indexOf(key) >= 0;
      if (hit) sc++;
    }
    if (sc >= Math.min(2, keys.length)) { v._sc = sc; res.push(v); }
  }
  if (!res.length) return [];
  res.sort(function (a, b) { return b._sc - a._sc; });
  var fim = [], titulos = {};
  for (var j = 0; j < res.length && fim.length < (n || 2); j++) {
    var t3 = res[j].title.toLowerCase();
    if (!titulos[t3]) { titulos[t3] = 1; fim.push(res[j]); }
  }
  return fim;
}
function carregarVideos() {
  cacheGetJson(CACHE_VIDEOS, VIDEOS_URL).then(function (json) {
    if (json && json.length) { VIDEOS = json; return null; }
    return fetch(VIDEOS_URL).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (html) {
      var re = /<a\s+href="https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{6,})"[^>]*>([^<]+)<\/a>(?:\s*\(([^)]*)\))?/g;
      var seen = {}, m, out = [];
      while ((m = re.exec(html)) !== null) {
        if (!seen[m[1]]) { seen[m[1]] = 1; out.push({ id: m[1], title: m[2].trim(), dur: (m[3] || "").trim() }); }
      }
      VIDEOS = out;
      cachePutJson(CACHE_VIDEOS, VIDEOS_URL, out);
    });
  }).catch(function () { /* vídeos são bônus; offline funciona igual */ });
}

/* ---------- geração robusta ---------- */
function gerarSessao(subj) {
  var st = loadST();
  var vistas = st.vistas || [];
  var qs = [], seen = new Set(vistas), guard = 0;
  var bancoArr = subj.banco && DATA[subj.banco] ? shuffle(DATA[subj.banco]) : [];
  var nBanco = Math.floor(TOTAL / 2);

  for (var i = 0; i < bancoArr.length && qs.length < nBanco; i++) {
    var bq = bancoArr[i];
    if (validarBanco(bq) && !seen.has(bq.pergunta)) { seen.add(bq.pergunta); var tq = toQuestion(bq); tq.topic = window.TOPICOS ? TOPICOS.classificar(tq.pergunta) : null; qs.push(tq); }
  }
  var faltam = TOTAL - qs.length;
  while (qs.length < TOTAL && guard < TOTAL * 60) {
    guard++;
    try {
      var q = gerarQuestaoIA(subj.gen, 2);
      if (validarQuestao(q) && !seen.has(q.pergunta)) { q.topic = window.TOPICOS ? (TOPICOS.topicoGerador(subj.id, q.gi) || TOPICOS.classificar(q.pergunta)) : null; seen.add(q.pergunta); qs.push(q); }
    } catch (e) {}
  }
  /* últimas tentativas: aceita repetição de gerador (matérias com poucos geradores) */
  guard = 0;
  while (qs.length < TOTAL && guard < TOTAL * 30) {
    guard++;
    try {
      var q2 = gerarQuestaoIA(subj.gen, 2);
      if (validarQuestao(q2)) { q2.topic = window.TOPICOS ? (TOPICOS.topicoGerador(subj.id, q2.gi) || TOPICOS.classificar(q2.pergunta)) : null; qs.push(q2); }
    } catch (e) {}
  }
  return shuffle(qs).slice(0, TOTAL);
}

function registrarVistas(qs) {
  var st = loadST();
  var v = st.vistas || [];
  qs.forEach(function (q) { v.push(q.pergunta); });
  st.vistas = v.slice(-300);
  saveST(st);
}

function responder(idx) {
  var q = sessao.qs[sessao.i];
  var opts = document.querySelectorAll(".opt");

  if (ok) sessao.acertos++;
  /* alimenta o banco de erros (só em modo normal; na revisão, acerto remove da fila) */
  if (sessao.revisao) { if (ok) registrarAcertoNaRevisao(q); }
  else if (!ok) registrarErro(q, sessao.subj);
  opts.forEach(function (b, i) {
    b.disabled = true;
    if (i === q.correta) b.classList.add("ok");

  var vbx = document.getElementById("fbvids");

/* ---------- papers Zenodo (v12: por TÓPICO da sessão + filtro de relevância do título) ---------- */
var ZEN_TIPOS = { publication: "publicação", poster: "pôster", presentation: "apresentação", dataset: "dados", video: "vídeo", image: "imagem", software: "software", lesson: "aula" };

function carregarPapers(sess) {
  var box = document.getElementById("rpapers");
  if (!box) return;
  box.style.display = "none";
  if (location.protocol.indexOf("http") !== 0 || !window.TOPICOS) return; /* offline/file: não busca */
  /* tópicos únicos da sessão (mais frequentes primeiro), só os que têm query Zenodo curada */
  var cont = {};
  sess.qs.forEach(function (q) { var t = q.topic || TOPICOS.classificar(q.pergunta); if (t) cont[t] = (cont[t] || 0) + 1; });
  var tops = Object.keys(cont).filter(function (t) { return TOPICOS.zenDo(t); })
    .sort(function (a, b) { return cont[b] - cont[a]; }).slice(0, 4);
  if (!tops.length) return;
  box.innerHTML = '<div class="ptit">🔬 Aprofunde: papers científicos abertos</div><div class="pload">buscando artigos no Zenodo…</div>';
  box.style.display = "block";
  var prontos = 0, html = "";
  tops.forEach(function (t) {
    var qz = "metadata.title:(" + TOPICOS.zenDo(t) + ")";
    fetch("https://zenodo.org/api/records?q=" + encodeURIComponent(qz) + "&size=3&sort=mostrecent")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var hits = (d.hits && d.hits.hits) || [];
        var secs = "";
        hits.forEach(function (x) {
          var m = x.metadata || {};
          var t0 = String(m.title || "").replace(/<[^>]*>/g, "");
          if (!t0 || !TOPICOS.zenValido(t, t0)) return; /* rigor: o título precisa casar com o vocabulário do próprio tópico */
          if (t0.length > 120) t0 = t0.slice(0, 117) + "…";
          var ano = String(m.publication_date || "").slice(0, 4);
          var tipo = ZEN_TIPOS[(m.resource_type && m.resource_type.type) || "publication"] || "publicação";
          var link = m.doi ? "https://doi.org/" + m.doi : "https://zenodo.org/record/" + x.id;
          secs += '<a class="paper" href="' + link + '" target="_blank" rel="noopener"><span class="pnm">' + t0 + '</span><span class="pmeta">' + ano + ' · ' + tipo + (m.access_right === "open" ? " · acesso aberto" : "") + '</span></a>';
        });
        if (secs) html += '<div class="ptit" style="margin-top:12px">📌 ' + TOPICOS.rotulo(t) + "</div>" + secs;
      })
      .catch(function () {})
      .then(function () {
        prontos++;
        if (prontos < tops.length) return;
        box.innerHTML = html ? '<div class="ptit">🔬 Aprofunde: papers por tema da sua sessão</div>' + html : "";
        box.style.display = html ? "block" : "none"; /* nenhum relevante = seção oculta (honesto, nunca paper errado) */
      });
  });
}

    var resto = fila.slice(1);

/* ---------- teclado ---------- */
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && vmodalEl.classList.contains("on")) { e.preventDefault(); fecharVideo(); return; }
  if (document.getElementById("quiz").style.display === "none") return;
  if (e.key === "Enter" || e.key === " ") {
    var fb = document.getElementById("fb");
    if (fb.style.display === "block") { e.preventDefault(); proxima(); }
    return;
  }
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) {
    var b = document.querySelectorAll(".opt")[n - 1];
    if (b && !b.disabled) b.click();
  }
});

document.getElementById("back").onclick = function () { show("home"); renderHome(); };
document.getElementById("continuar").onclick = proxima;
document.getElementById("rdenovo").onclick = function () { iniciar(sessao.subj); };
document.getElementById("rtrocar").onclick = function () { show("home"); renderHome(); };
document.getElementById("recbtn").onclick = function () {
  var ul = document.getElementById("reclist");
  var aberto = ul.style.display === "flex";
  ul.style.display = aberto ? "none" : "flex";
  this.setAttribute("aria-expanded", String(!aberto));
};
document.getElementById("recbtn2").onclick = function () {
  var ul = document.getElementById("reclist2");
  var aberto = ul.style.display === "flex";
  ul.style.display = aberto ? "none" : "flex";
  this.setAttribute("aria-expanded", String(!aberto));
};

renderHome();
baixarBancos();

/* ---------- PWA: service worker + atalho ?revisao=1 ---------- */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
if (new URLSearchParams(location.search).get('revisao') === '1') {
  setTimeout(function () { if (loadER().length) iniciarRevisao(); }, 300);
}
