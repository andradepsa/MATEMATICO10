<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulados Online</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
}

header {
  text-align: center;
  padding: 40px;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

.card:hover { transform: scale(1.05); }

#conteudo {
  padding: 20px;
}

.questao {
  background: white;
  margin: 10px 0;
  padding: 15px;
  border-radius: 10px;
}

button {
  padding: 10px;
  margin: 10px 5px;
  border: none;
  background: #4facfe;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

/* VIDEOTECA */
#videoList {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.video-item {
  width: 250px;
  background: white;
  border-radius: 10px;
  cursor: pointer;
}

.video-item img {
  width: 100%;
}

.modal {
  display: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
}

.modal-content {
  background: white;
  margin: 5% auto;
  padding: 20px;
  width: 80%;
}
</style>
</head>

<body>

<header>
<h1>📚 Simulados Online</h1>
<p>Escolha uma disciplina ou acesse sua teca</p>
</header>

<div class="container">
  <div class="card" onclick="carregar('matematica.json')">📐 Matemática</div>
  <div class="card" onclick="carregar('portugues.json')">📖 Português</div>
  <div class="card" onclick="carregar('historia.json')">📜 História</div>
  <div class="card" onclick="carregar('geografia.json')">🌎 Geografia</div>
  <div class="card" onclick="carregar('biologia.json')">🧬 Biologia</div>
  <div class="card" onclick="carregar('fisica.json')">⚡ Física</div>
  <div class="card" onclick="carregar('quimica.json')">🧪 Química</div>
  <div class="card" onclick="carregar('filosofia.json')">🤔 Filosofia</div>
  <div class="card" onclick="carregar('sociologia.json')">👥 Sociologia</div>

  <div class="card" onclick="abrirTeca()">🎬 Minha Teca</div>
</div>

<div id="conteudo"></div>

<!-- SUA LISTA (EXATAMENTE COMO VOCÊ QUER) -->
<ul id="listaVideos" style="display:none;">
<li><a href="https://www.youtube.com/watch?v=f02_WI8OwnM">Thomas Pesquet Se Preparando Para Caminhada Espacial</a></li>
<li><a href="https://www.youtube.com/watch?v=w3wQsRTRi2I">Matemáquinas Vol.2</a></li>
<li><a href="https://www.youtube.com/watch?v=k2x8JWFtjGM">SACANI explica o SURGIMENTO ESTRELAS</a></li>
</ul>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <button onclick="fechar()">Fechar</button>
    <iframe id="player" width="100%" height="400" allowfullscreen></iframe>
  </div>
</div>

<script>
// =======================
// SIMULADOR
// =======================
let questoes = [];
let selecionadas = [];

async function carregar(arquivo) {
  const r = await fetch(arquivo);
  questoes = await r.json();

  selecionadas = questoes.sort(() => Math.random() - 0.5).slice(0, 10);

  mostrar();
}

function mostrar() {
  const div = document.getElementById("conteudo");
  div.innerHTML = `<button onclick="corrigir()">Finalizar</button>`;

  selecionadas.forEach((q, i) => {
    let html = `<div class="questao"><b>${q.pergunta}</b><br>`;

    q.opcoes.forEach((op, j) => {
      html += `
      <label>
        <input type="radio" name="q${i}" value="${j}">
        ${op}
      </label><br>`;
    });

    html += `</div>`;
    div.innerHTML += html;
  });
}

function corrigir() {
  let acertos = 0;

  selecionadas.forEach((q, i) => {
    const m = document.querySelector(`input[name="q${i}"]:checked`);
    if (m && parseInt(m.value) === q.correta) acertos++;
  });

  document.getElementById("conteudo").innerHTML += `<h2>Acertos: ${acertos}</h2>`;
}

// =======================
// 🎬 MINHA TECA
// =======================
function abrirTeca() {
  const container = document.getElementById("conteudo");

  container.innerHTML = `
    <h2>Minha Videoteca</h2>
    <input id="busca" placeholder="Buscar..." style="width:100%;padding:10px;">
    <div id="videoList"></div>
  `;

  const lista = document.querySelectorAll("#listaVideos li");
  let videos = [];

  lista.forEach(li => {
    const a = li.querySelector("a");
    const titulo = a.textContent;
    const link = a.href;
    const id = link.match(/v=([^&]+)/)[1];

    videos.push({ titulo, id });
  });

  render(videos);

  document.getElementById("busca").addEventListener("input", e => {
    const termo = e.target.value.toLowerCase();
    render(videos.filter(v => v.titulo.toLowerCase().includes(termo)));
  });
}

function render(videos) {
  const div = document.getElementById("videoList");
  div.innerHTML = "";

  videos.forEach(v => {
    div.innerHTML += `
      <div class="video-item" onclick="abrir('${v.id}')">
        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
        <p>${v.titulo}</p>
      </div>
    `;
  });
}

function abrir(id) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("player").src =
    `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function fechar() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}
</script>

</body>
</html>
