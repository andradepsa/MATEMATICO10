<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulados Online</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
}

header {
  text-align: center;
  padding: 40px;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
  font-size: 18px;
  font-weight: bold;
}

.card:hover {
  transform: scale(1.05);
}

#quiz {
  padding: 20px;
}

.questao {
  background: white;
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 10px;
}

.topo-botoes {
  margin-bottom: 20px;
}

input {
  padding: 8px;
  width: 80px;
}

button {
  margin: 5px;
  padding: 10px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background: #4facfe;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>📚 Simulados Online</h1>
  <p>Escolha uma matéria</p>
</header>

<div class="container">
  <div class="card" onclick="carregar('matematica.json')">📐 Matemática</div>
  <div class="card" onclick="carregar('geografia.json')">🌎 Geografia</div>
  <div class="card" onclick="carregar('biologia.json')">🧬 Biologia</div>
  <div class="card" onclick="carregar('historia.json')">📜 História</div>
  <div class="card" onclick="carregar('fisica.json')">⚡ Física</div>
</div>

<div id="quiz"></div>

<script>
let questoes = [];
let questoesSelecionadas = [];
let quantidade = 10;

// carregar JSON
async function carregar(arquivo) {
  const resposta = await fetch(arquivo);
  questoes = await resposta.json();
  gerarLista();
}

// embaralhar
function embaralhar(array) {
  return array.sort(() => Math.random() - 0.5);
}

// gerar lista
function gerarLista() {
  quantidade = parseInt(document.getElementById("qtd")?.value) || 10;

  const misturadas = embaralhar([...questoes]);
  questoesSelecionadas = misturadas.slice(0, quantidade);

  questoesSelecionadas = questoesSelecionadas.map(q => {
    let opcoes = q.opcoes.map((texto, index) => ({
      texto,
      correta: index === q.correta
    }));

    opcoes = embaralhar(opcoes);

    return {
      pergunta: q.pergunta,
      opcoes: opcoes.map(o => o.texto),
      correta: opcoes.findIndex(o => o.correta)
    };
  });

  mostrarQuestoes();
}

// mostrar
function mostrarQuestoes() {
  const quiz = document.getElementById('quiz');

  quiz.innerHTML = `
    <div class="topo-botoes">
      <label>Quantidade:</label>
      <input type="number" id="qtd" value="${quantidade}" min="1">
      <button onclick="gerarLista()">🔄 Gerar Lista</button>
      <button onclick="baixarPDF()">📄 Baixar PDF</button>
    </div>
  `;

  questoesSelecionadas.forEach((q, index) => {
    const div = document.createElement('div');
    div.classList.add('questao');

    let html = `<p><strong>${index + 1}. ${q.pergunta}</strong></p>`;

    q.opcoes.forEach((opcao, i) => {
      html += `<p>${String.fromCharCode(65 + i)}) ${opcao}</p>`;
    });

    div.innerHTML = html;
    quiz.appendChild(div);
  });
}

// PDF bonito
function baixarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  // título
  doc.setFontSize(16);
  doc.text("SIMULADO", 105, 10, null, null, "center");

  doc.setFontSize(10);

  questoesSelecionadas.forEach((q, index) => {

    let texto = `${index + 1}. ${q.pergunta}`;
    let linhas = doc.splitTextToSize(texto, 180);

    doc.text(linhas, 10, y);
    y += linhas.length * 5;

    q.opcoes.forEach((opcao, i) => {
      let opcaoTexto = `${String.fromCharCode(65 + i)}) ${opcao}`;
      let linhasOp = doc.splitTextToSize(opcaoTexto, 170);

      doc.text(linhasOp, 15, y);
      y += linhasOp.length * 5;
    });

    y += 5;

    // quebra de página
    if (y > 270) {
      doc.addPage();
      y = 20;
    }
  });

  doc.save("simulado.pdf");
}
</script>

</body>
</html>
