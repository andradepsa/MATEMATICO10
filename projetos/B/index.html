<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulados Online</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
}

header {
  text-align: center;
  padding: 40px;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
  font-size: 18px;
  font-weight: bold;
}

.card:hover {
  transform: scale(1.05);
}

#quiz {
  padding: 20px;
}

.questao {
  background: white;
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 10px;
}

button {
  margin: 5px;
  padding: 10px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background: #4facfe;
  color: white;
}

.correta { color: green; font-weight: bold; }
.errada { color: red; }
</style>
</head>

<body>

<header>
  <h1>📚 Simulados Online</h1>
  <p>Escolha uma matéria</p>
</header>

<div class="container">
  <div class="card" onclick="carregar('matematica.json')">📐 Matemática</div>
  <div class="card" onclick="carregar('historia.json')">📜 História</div>
  <div class="card" onclick="carregarMinhaTeca()">🎬 Minha Teca</div>
</div>

<div id="quiz"></div>

<script>
// =======================
// SIMULADO
// =======================
let questoes = [];
let questoesSelecionadas = [];
let respostasUsuario = [];

async function carregar(arquivo) {
  const resposta = await fetch(arquivo);
  questoes = await resposta.json();
  gerarLista();
}

function embaralhar(array) {
  return array.sort(() => Math.random() - 0.5);
}

function gerarLista() {
  const misturadas = embaralhar([...questoes]);
  questoesSelecionadas = misturadas.slice(0, 10);

  mostrarQuestoes();
}

function mostrarQuestoes() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = `<button onclick="corrigir()">Finalizar</button>`;

  questoesSelecionadas.forEach((q, index) => {
    let html = `<div class="questao"><p><b>${q.pergunta}</b></p>`;

    q.opcoes.forEach((op, i) => {
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${op}
        </label><br>`;
    });

    html += `</div>`;
    quiz.innerHTML += html;
  });
}

function corrigir() {
  let acertos = 0;

  questoesSelecionadas.forEach((q, i) => {
    const marcada = document.querySelector(`input[name="q${i}"]:checked`);
    if (marcada && parseInt(marcada.value) === q.correta) {
      acertos++;
    }
  });

  document.getElementById("quiz").innerHTML += `<h2>Acertos: ${acertos}</h2>`;
}

// =======================
// 🎬 MINHA TECA COM <li>
// =======================
async function carregarMinhaTeca() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = "Carregando vídeos...";

  const resposta = await fetch("minhateca.json");
  const lista = await resposta.json();

  let html = `
    <h2>🎬 Minha Teca</h2>
    <input type="text" id="busca" placeholder="Buscar..." style="width:100%;padding:10px;">
    <div id="videos" style="display:flex;flex-wrap:wrap;gap:15px;margin-top:20px;"></div>

    <div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);">
      <div style="background:white;margin:5% auto;padding:20px;width:90%;max-width:800px;">
        <span onclick="fechar()" style="cursor:pointer;font-size:20px;">✖</span>
        <h3 id="titulo"></h3>
        <iframe id="player" width="100%" height="400"></iframe>
      </div>
    </div>
  `;

  quiz.innerHTML = html;

  const videos = lista.map(v => extrair(v));
  render(videos);

  document.getElementById("busca").addEventListener("input", e => {
    const termo = e.target.value.toLowerCase();
    render(videos.filter(v => v.titulo.toLowerCase().includes(termo)));
  });
}

function extrair(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  const a = div.querySelector("a");

  return {
    titulo: a.textContent,
    id: a.href.split("v=")[1]
  };
}

function render(lista) {
  const container = document.getElementById("videos");
  container.innerHTML = "";

  lista.forEach(v => {
    const thumb = `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;

    container.innerHTML += `
      <div onclick="abrir('${v.id}','${v.titulo}')" style="width:250px;cursor:pointer;background:white;border-radius:10px;">
        <img src="${thumb}" style="width:100%;">
        <div style="padding:10px;">${v.titulo}</div>
      </div>
    `;
  });
}

function abrir(id, titulo) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("player").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
  document.getElementById("titulo").innerText = titulo;
}

function fechar() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

</script>

</body>
</html>
