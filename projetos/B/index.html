<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Menu Disciplinas</title>
  <style>
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropbtn {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 200px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }
    .dropdown-content a {
      color: black;
      padding: 8px 12px;
      text-decoration: none;
      display: block;
    }
    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }
    .dropdown.show .dropdown-content {
      display: block;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="dropdown" id="dd-disciplinas">
  <button class="dropbtn" onclick="toggleMenu('dd-disciplinas')">📚 Disciplinas ▾</button>
  <div class="dropdown-content" id="lista-disciplinas"></div>
</div>

<div id="status"></div>

<script>
  function toggleMenu(id) {
    document.getElementById(id).classList.toggle("show");
  }

  // Fecha o menu ao clicar fora
  window.addEventListener("click", function(e) {
    if (!e.target.matches(".dropbtn")) {
      document.querySelectorAll(".dropdown.show")
        .forEach(el => el.classList.remove("show"));
    }
  });

  // Gera array de nomes: prefixo + 1..total + ".json"
  function gerarArquivos(prefixo, total) {
    return Array.from({ length: total }, (_, i) => `${prefixo}${i + 1}.json`);
  }

  // Carrega todos os JSONs da disciplina em paralelo e mescla
  async function carregarDisciplina(nome, arquivos) {
    const status = document.getElementById("status");
    status.textContent = `Carregando ${nome}...`;

    try {
      const respostas = await Promise.all(
        arquivos.map(arq => fetch(arq))
      );

      // Verifica se todas as respostas foram OK
      respostas.forEach((res, i) => {
        if (!res.ok) throw new Error(`Erro ao carregar: ${arquivos[i]}`);
      });

      const jsons = await Promise.all(
        respostas.map(res => res.json())
      );

      const dadosMesclados = jsons.flat();

      status.textContent = `✅ ${nome}: ${dadosMesclados.length} itens carregados de ${arquivos.length} arquivo(s).`;
      console.log(`[${nome}]`, dadosMesclados);
      return dadosMesclados;

    } catch (erro) {
      status.textContent = `❌ Erro ao carregar ${nome}: ${erro.message}`;
      console.error(erro);
      return [];
    }
  }

  // Definição das disciplinas
  // Ajuste o segundo argumento de gerarArquivos() com o total de arquivos de cada disciplina
  const disciplinas = {
    "➗ Matemática":  gerarArquivos("matematica",  12),
    "🌍 Geografia":   gerarArquivos("geografia",    2),
    "🧬 Biologia":    gerarArquivos("biologia",     2),
    "📜 História":    gerarArquivos("historia",     2),
    "⚛️ Física":      gerarArquivos("fisica",       2),
  };

  // Monta os links do menu dinamicamente
  const lista = document.getElementById("lista-disciplinas");

  Object.entries(disciplinas).forEach(([nome, arquivos]) => {
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = nome;
    link.onclick = async (e) => {
      e.preventDefault();
      const dados = await carregarDisciplina(nome, arquivos);
      // TODO: use os dados aqui — ex: renderizarQuestoes(dados)
    };
    lista.appendChild(link);
  });
</script>

</body>
</html>
