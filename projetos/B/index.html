function parseVideosFromHtml(html) {
  const re = /<a\s+href="https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{6,})"[^>]*>([^<]+)<\/a>(?:\s*\(([^)]*)\))?/g;
  const seen = new Map();
  let m;
  while ((m = re.exec(html)) !== null) {
    const id = m[1], title = m[2].trim(), dur = (m[3] || "—").trim();
    if (!seen.has(id)) seen.set(id, { id, title, dur });
  }
  return Array.from(seen.values());
}

function ri(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  while (b) {
    const t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}
function lcm(a, b) {
  return Math.abs(a * b) / gcd(a, b);
}
function fat(n) {

function comb(n, k) {

  return Math.round(r);
}
function fmt(v) {
  return typeof v === "number" ? String(Math.round(v * 1e6) / 1e6) : String(v);
}
function validarQuestao(q) {
  if (!q || typeof q !== "object") return false;
  if (typeof q.pergunta !== "string" || q.pergunta.trim() === "") return false;
  if (!Array.isArray(q.opcoes) || q.opcoes.length !== 4 && q.opcoes.length !== 5) return false;
  if (typeof q.correta !== "number" || q.correta < 0 || q.correta > q.opcoes.length - 1) return false;
  if (q.opcoes.some(x => x === null || x === undefined || x === "")) return false;
  if (new Set(q.opcoes).size < q.opcoes.length) return false;
  return true;

function distratores(correto, tipo) {
  const res = [];
  const mults = [1.08, 0.91, 1.18, 0.82, 1.25, 0.75, 1.35, 0.65];
  for (const m of mults) {
    if (res.length >= 3) break;
    let v;
    if (tipo === "inteiro") v = Math.round(correto * m + (m > 1 ? 1 : -1));else v = parseFloat((correto * m).toFixed(2));
    if (v !== correto && !res.includes(v)) res.push(v);
  }
  const delta = Math.max(1, Math.abs(correto) * 0.12);
  while (res.length < 3) res.push(Math.round(correto + delta * (res.length + 2)));
  return res.slice(0, 3);
}
function montarQuestao(pergunta, correto, tipo) {

}

function gerarQuestaoIA() {
  for (let t = 0; t < 15; t++) {
    try {
      const q = MODELOS[Math.floor(Math.random() * MODELOS.length)]();
      if (validarQuestao(q)) return q;
    } catch (e) {}
  }
  return {
    pergunta: "Quanto é 3 × 4?",
    opcoes: ["10", "12", "14", "16"],
    correta: 1
  };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toQuestion(q) {
  const tagged = q.opcoes.map((t, i) => ({
    t,
    correta: i === q.correta
  }));
  const sh = shuffle(tagged);
  return {
    pergunta: q.pergunta,
    opcoes: sh.map(o => o.t),
    correta: sh.findIndex(o => o.correta),
    origem: "json"
  };
}
function generateQuestions(subjectId, count) {
  const fileMap = {
    mat: "matematica",
    fis: "fisica",
    hist: "historia",
    geo: "geografia",
    bio: "biologia",
    ger: "gerais"
  };
  const file = fileMap[subjectId];
  if (!file) return [];
  const bank = (window.__M10_DATA__[file] || []).filter(validarQuestao);
  if (subjectId === "mat") {
    const halfIA = Math.ceil(count / 2);
    const halfJSON = count - halfIA;
    const fromIA = [];
    for (let i = 0; i < halfIA; i++) fromIA.push({
      ...gerarQuestaoIA(),
      origem: "ia"
    });
    let fromJSON = [];
    if (bank.length > 0) {
      fromJSON = shuffle(bank).slice(0, halfJSON).map(toQuestion);
    } else {
      for (let i = 0; i < halfJSON; i++) fromJSON.push({
        ...gerarQuestaoIA(),
        origem: "ia"
      });
    }
    return shuffle([...fromIA, ...fromJSON]);
  }
  return shuffle(bank).slice(0, count).map(toQuestion);
}

const RANK_WEIGHT_QUESTION = 10,

  RANK_WEIGHT_MINUTE = 3;
function computeRankScore(s) {

function computeLeague(score) {

    next: null,
    into: score - base,
    need: 0,
    pct: 1

    current,
    next: LEAGUES[idx + 1],

}
