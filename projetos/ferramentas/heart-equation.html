  </div>
</div>

  Scroll para zoom

function lerp(a, b, t) { return a + (b - a) * t; }

function marchingCubes(res, bound, isoVal, onProgress) {
  const positions = [];
  const step = (2 * bound) / res;

  for (let xi = 0; xi < res; xi++) {
    if (onProgress) onProgress(xi / res);
    const x0 = -bound + xi * step;
    const x1 = x0 + step;
    for (let yi = 0; yi < res; yi++) {
      const y0 = -bound + yi * step;
      const y1 = y0 + step;
      for (let zi = 0; zi < res; zi++) {
        const z0 = -bound + zi * step;
        const z1 = z0 + step;

        const corners = [
          [x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
          [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]
        ];
        const vals = corners.map(c => heartF(c[0],c[1],c[2]));

        let cubeIdx = 0;
        for (let i = 0; i < 8; i++) if (vals[i] < isoVal) cubeIdx |= (1 << i);

        if (EDGE_TABLE[cubeIdx] === 0) continue;

        const edgePairs = [
          [0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]
        ];
        const verts = new Array(12);
        for (let e = 0; e < 12; e++) {
          if (EDGE_TABLE[cubeIdx] & (1 << e)) {
            const [a,b] = edgePairs[e];
            const t = (isoVal - vals[a]) / (vals[b] - vals[a]);
            verts[e] = [
              lerp(corners[a][0], corners[b][0], t),
              lerp(corners[a][1], corners[b][1], t),
              lerp(corners[a][2], corners[b][2], t)
            ];
          }
        }

        const tris = TRI_TABLE[cubeIdx];
        for (let t = 0; t < tris.length; t += 3) {
          const v0 = verts[tris[t]];
          const v1 = verts[tris[t+1]];
          const v2 = verts[tris[t+2]];
          positions.push(...v0, ...v1, ...v2);
        }
      }
    }
  }
  return new Float32Array(positions);
}

// ─── Build geometry async ────────────────────────────────────────────────────
const progress = document.getElementById('progress');

function computeAsync(res, bound) {
  return new Promise(resolve => {
    setTimeout(() => {
      const verts = marchingCubes(res, bound, 0, p => {
        progress.style.width = (p * 100) + '%';
      });
      resolve(verts);
    }, 20);
  });
}

let heartMesh;

async function buildHeart() {
  const verts = await computeAsync(90, 1.6);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.computeVertexNormals();

  // Swap Y/Z so top of heart faces up
  const pos = geo.attributes.position;
  const nor = geo.attributes.normal;
  for (let i = 0; i < pos.count; i++) {
    const py = pos.getY(i);
    const pz = pos.getZ(i);
    pos.setY(i, pz);
    pos.setZ(i, -py);
    const ny = nor.getY(i);
    const nz = nor.getZ(i);
    nor.setY(i, nz);
    nor.setZ(i, -ny);
  }
  pos.needsUpdate = true;
  nor.needsUpdate = true;

  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xdd1144,
    emissive: 0x550022,
    emissiveIntensity: 0.18,
    roughness: 0.28,
    metalness: 0.05,
    clearcoat: 0.6,
    clearcoatRoughness: 0.15,
    side: THREE.FrontSide,
  });

  heartMesh = new THREE.Mesh(geo, mat);
  heartMesh.scale.setScalar(1.55);
  scene.add(heartMesh);

  // Particle halo
  const pGeo = new THREE.BufferGeometry();
  const pCount = 600;
  const pPos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 2.8 + Math.random() * 1.2;
    pPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pPos[i*3+2] = r * Math.cos(phi);
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ color: 0xff6b8a, size: 0.025, transparent: true, opacity: 0.5 });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  document.getElementById('loading').classList.add('hidden');
}

buildHeart();

// ─── Controls ────────────────────────────────────────────────────────────────
let isDragging = false, prevX = 0, prevY = 0;
let rotX = 0.3, rotY = 0;
let zoom = 5.5;

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.01;
  rotX += (e.clientY - prevY) * 0.01;
  prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener('wheel', e => {
  zoom = Math.max(2.5, Math.min(9, zoom + e.deltaY * 0.005));
});

// Touch
let touchPrev = null;
renderer.domElement.addEventListener('touchstart', e => { touchPrev = e.touches[0]; });
renderer.domElement.addEventListener('touchmove', e => {
  if (!touchPrev) return;
  const t = e.touches[0];
  rotY += (t.clientX - touchPrev.clientX) * 0.01;
  rotX += (t.clientY - touchPrev.clientY) * 0.01;
  touchPrev = t;
});
renderer.domElement.addEventListener('touchend', () => { touchPrev = null; });

// ─── Animation ───────────────────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;

  if (heartMesh) {
    heartMesh.rotation.x = rotX;
    heartMesh.rotation.y = rotY + t * 0.25;
    // pulse
    const s = 1.55 + 0.025 * Math.sin(t * 2.5);
    heartMesh.scale.setScalar(s);
  }

  // Animate point light
  point1.position.x = 2 * Math.cos(t * 0.7);
  point1.position.z = 2 * Math.sin(t * 0.7);

  camera.position.z = zoom;
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const W = window.innerWidth, H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});
