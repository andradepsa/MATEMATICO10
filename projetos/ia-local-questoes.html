<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Local — Gerador de Questões</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a;
    --text: #e6edf3;
    --text-dim: #6e7681;
    --accent: #2dd4bf;
    --bg-2: #161b22;
    --border: #30363d;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    background:
      radial-gradient(circle at 20% 30%, rgba(45,212,191,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(6,182,212,0.05) 0%, transparent 50%),
      var(--bg);
  }

  /* === CAMPO DE BUSCA CENTRALIZADO === */
  .container {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .title {
    font-size: 1rem;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  .search-wrap {
    width: 100%;
    position: relative;
  }

  #search {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 1.25rem 1.25rem 1.25rem 3rem;
    font-size: 1.05rem;
    border-radius: 14px;
    font-family: inherit;
    transition: all 0.3s;
    outline: none;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(45,212,191,0.1);
  }

  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }

  /* === INDICADOR MINIMALISTA DE STATUS DA IA === */
  .status {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.82rem;
    color: var(--text-dim);
    min-height: 1.2em;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.3s;
  }
  .status.loading .status-dot {
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  .status.ready .status-dot { background: var(--accent); }
  .status.error .status-dot { background: #ef4444; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.5; }
  }

  /* === PROGRESSO DE CARREGAMENTO DA IA === */
  .progress-wrap {
    width: 100%;
    max-width: 480px;
    display: none;
  }
  .progress-wrap.active { display: block; }
  .progress-bar {
    height: 3px;
    background: var(--bg-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #06b6d4);
    width: 0%;
    transition: width 0.3s;
  }

  /* === RESULTADO GERADO PELA IA === */
  .output {
    width: 100%;
    margin-top: 1rem;
    display: none;
  }
  .output.active { display: block; }

  .question-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 0.75rem;
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .question-card .q-label {
    color: var(--accent);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 0.6rem;
    font-weight: 600;
  }
  .question-card .q-text {
    color: var(--text);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 0.85rem;
  }
  .question-card .q-answer {
    background: rgba(45,212,191,0.06);
    border-left: 2px solid var(--accent);
    padding: 0.6rem 0.85rem;
    border-radius: 4px;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.5;
  }
  .question-card .q-answer strong {
    color: var(--accent);
    display: block;
    margin-bottom: 0.2rem;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .question-card .q-meta {
    margin-top: 0.6rem;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .typing-cursor {
    display: inline-block;
    width: 6px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .footer-hint {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 1rem;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title">IA Local · Gerador de Questões</div>

    <div class="search-wrap">

<script type="module">
  import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

  // Configura para carregar modelos do CDN do Hugging Face
  env.allowLocalModels = false;
  env.useBrowserCache = true; // salva no Cache API do navegador

  const MODEL_ID = "onnx-community/Qwen2.5-0.5B-Instruct";
  let generator = null;
  let isReady = false;

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const searchEl = document.getElementById("search");
  const outputEl = document.getElementById("output");
  const progressWrap = document.getElementById("progress-wrap");
  const progressFill = document.getElementById("progress-fill");

  function setStatus(text, type = "") {
    statusText.textContent = text;
    statusEl.className = "status " + type;
  }

  // === Carrega o modelo na inicialização ===
  async function tryLoad(device) {
    return await pipeline("text-generation", MODEL_ID, {
      dtype: "q4",
      device: device,
      progress_callback: (p) => {
        if (p.status === "progress" && p.progress) {
          const pct = Math.min(100, Math.round(p.progress * 100));
          progressFill.style.width = pct + "%";
          setStatus(`Baixando IA via ${device.toUpperCase()}... ${pct}%`, "loading");
        } else if (p.status === "done") {
          progressFill.style.width = "100%";
        }
      }
    });
  }

  async function loadModel() {
    // Detecta GPU via WebGPU (mesma API que jogos usam no browser)
    let hasGPU = ("gpu" in navigator);
    if (hasGPU) {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) hasGPU = false;
      } catch (e) { hasGPU = false; }
    }

    progressWrap.classList.add("active");

    // Tenta GPU primeiro, depois cai para CPU (WASM) automaticamente
    const attempts = hasGPU ? ["webgpu", "wasm"] : ["wasm"];
    let lastError = null;

    for (const device of attempts) {
      try {
        setStatus(`Carregando IA via ${device.toUpperCase()} (~500MB, só na 1ª vez)...`, "loading");
        generator = await tryLoad(device);
        isReady = true;
        progressWrap.classList.remove("active");
        const label = device === "webgpu" ? "GPU (WebGPU)" : "CPU (WebAssembly)";
        setStatus(`IA pronta via ${label}. Digite sua pesquisa.`, "ready");
        searchEl.disabled = false;
        searchEl.focus();
        return;
      } catch (err) {
        console.warn(`Falha ao carregar via ${device}:`, err.message);
        lastError = err;
        // Continua para próximo método
      }
    }

    progressWrap.classList.remove("active");
    setStatus("Erro ao carregar IA: " + (lastError ? lastError.message : "desconhecido"), "error");
  }

  // === Busca por código nos datasets (sem IA) ===
  function searchDatasets(query) {
    const q = query.toLowerCase().trim();
    if (!q) return [];
    return DATASETS.filter(d => {
      const haystack = [
        d.nome, d.descricao, d.categoria, d.modalidade,
        d.tags.join(" "), d.casos.join(" "), d.criador
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }).slice(0, 6); // top 6 relevantes
  }

  // === Constrói as mensagens no formato chat (Qwen2.5-Instruct) ===
  function buildMessages(query, datasets) {
    // Pega apenas o dataset MAIS relevante (primeiro) para focar a questão
    const d = datasets[0];
    const contexto = `Nome: ${d.nome}
Categoria: ${d.categoria}
Ano: ${d.ano}
Tamanho: ${d.tamanho}
Criador: ${d.criador}
Descrição: ${d.descricao}`;

    return [
      {
        role: "system",
        content: "Você cria perguntas curtas e objetivas em português sobre bancos de dados de IA. Responda APENAS com a pergunta, sem explicação, sem markdown, sem asteriscos."
      },
      {
        role: "user",
        content: `Com base neste banco de dados, crie UMA pergunta objetiva:\n\n${contexto}`
      }
    ];
  }

  // === Gera a resposta correta a partir dos dados reais (sem IA) ===
  function getAnswer(d) {
    const campos = [
      { pergunta: "Quem é o criador", resposta: d.criador },
      { pergunta: "Qual é o tamanho", resposta: d.tamanho },
      { pergunta: "Em que ano foi lançado", resposta: String(d.ano) },
      { pergunta: "A qual categoria pertence", resposta: d.categoria },
      { pergunta: "Qual é a licença", resposta: d.licenca },
      { pergunta: "Qual é o formato dos arquivos", resposta: d.formato },
      { pergunta: "Quais idiomas estão cobertos", resposta: d.idiomas },
      { pergunta: "Cite um caso de uso", resposta: d.casos[0] }
    ];
    return campos[Math.floor(Math.random() * campos.length)];
  }

  // === Parseia a resposta da IA ===
  function parseResponse(text) {
    const pergunta = text.match(/PERGUNTA:\s*(.+?)(?=RESPOSTA:|$)/is);
    const resposta = text.match(/RESPOSTA:\s*(.+?)(?=FONTE:|$)/is);
    const fonte = text.match(/FONTE:\s*(.+?)(?:\n|$)/is);
    return {
      pergunta: pergunta ? pergunta[1].trim() : text.trim(),
      resposta: resposta ? resposta[1].trim() : "",
      fonte: fonte ? fonte[1].trim() : ""
    };
  }

  // === Gera questão usando a IA ===
  async function generateQuestion(query) {
    if (!isReady) return;
    const datasets = searchDatasets(query);

    if (datasets.length === 0) {
      outputEl.classList.add("active");
      outputEl.innerHTML = `<div class="question-card">
        <div class="q-label">Sem resultados</div>
        <div class="q-text">Nenhum banco de dados encontrado para "${query}". Tente: image, code, audio, web, LAION, Common Crawl, etc.</div>
      </div>`;
      return;
    }

    setStatus("Gerando questão...", "loading");
    searchEl.disabled = true;
    outputEl.classList.add("active");
    outputEl.innerHTML = `<div class="question-card">
      <div class="q-label">Gerando</div>
      <div class="q-text">A IA está formulando uma questão sobre "${query}"<span class="typing-cursor"></span></div>
    </div>`;

    try {
      const messages = buildMessages(query, datasets);
      const result = await generator(messages, {
        max_new_tokens: 80,
        temperature: 0.6,
        top_p: 0.85,
        do_sample: true,
        repetition_penalty: 1.15,
        return_full_text: false
      });

      // O resultado pode ser string OU array de messages (no formato chat)
      let text = "";
      const generated = result[0].generated_text;
      if (typeof generated === "string") {
        text = generated;
      } else if (Array.isArray(generated)) {
        const last = generated[generated.length - 1];
        text = (last && last.content) || "";
      } else if (generated && typeof generated === "object") {
        text = generated.content || JSON.stringify(generated);
      }

      // Limpa a pergunta gerada pela IA (remove markdown, asteriscos, etc)
      let pergunta = text.trim()
        .replace(/^\*\*|\*\*$/g, "")
        .replace(/^[-*•]\s*/, "")
        .replace(/^(PERGUNTA:|P:|Q:)\s*/i, "")
        .replace(/\s+/g, " ")
        .trim();

      // Sorteia a resposta dos dados reais (sem IA)
      const answer = getAnswer(datasets[0]);

      // Critério rigoroso para aceitar pergunta da IA:
      // 1. Tem tamanho razoável
      // 2. Contém "?" (é uma pergunta)
      // 3. Menciona o nome do dataset OU palavra relacionada
      const nomeLower = datasets[0].nome.toLowerCase();
      const palavrasChave = ["dataset", "banco de dados", "modelo", "ia", "treinamento", nomeLower];
      const mencionaRelevante = palavrasChave.some(p => pergunta.toLowerCase().includes(p.toLowerCase()));
      const coerente = pergunta.length >= 20 && pergunta.length <= 150 && pergunta.includes("?") && mencionaRelevante;

      // Se a IA não gerou pergunta coerente, usa template consistente com a resposta
      if (!coerente) {
        pergunta = answer.pergunta + " do banco de dados " + datasets[0].nome + "?";
      }

      const isFromIA = coerente;
      const label = isFromIA
        ? "Pergunta gerada pela IA · Resposta dos dados"
        : "Pergunta template · Resposta dos dados reais";

      outputEl.innerHTML = `
        <div class="question-card">
          <div class="q-label">${label}</div>
          <div class="q-text">${escapeHtml(pergunta)}</div>
          <div class="q-answer"><strong>Resposta</strong>${escapeHtml(answer.resposta)}</div>
          <div class="q-meta">Fonte: ${escapeHtml(datasets[0].nome)}${isFromIA ? " · 🤖 IA gerou a pergunta" : " · 📋 Pergunta template"}</div>
        </div>
        <div class="question-card" style="border-color: var(--border); opacity: 0.7;">
          <div class="q-label" style="color: var(--text-dim);">Contexto usado (${datasets.length} datasets encontrados)</div>
          <div class="q-meta" style="margin-top: 0.4rem;">
            ${datasets.map(d => `• ${escapeHtml(d.nome)} — ${escapeHtml(d.categoria)} (${d.ano})`).join("<br>")}
          </div>
        </div>
      `;
      setStatus("IA pronta. Digite sua pesquisa.", "ready");
    } catch (err) {
      console.error(err);
      outputEl.innerHTML = `<div class="question-card">
        <div class="q-label" style="color: #ef4444;">Erro</div>
        <div class="q-text">Falha ao gerar questão: ${escapeHtml(err.message)}</div>
      </div>`;
      setStatus("IA pronta. Digite sua pesquisa.", "ready");
    } finally {
      searchEl.disabled = false;
      searchEl.focus();
    }
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // === Eventos ===
  let debounceTimer;
  searchEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      clearTimeout(debounceTimer);
      const query = searchEl.value.trim();
      if (query) generateQuestion(query);
    }
  });

  // === Inicia ===
  loadModel();
</script>
</body>
</html>
