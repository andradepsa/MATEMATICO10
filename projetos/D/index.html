<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperdimensional Paradox</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a0a0a;
    color:#fff;
}

.container {
    text-align:center;
    padding:40px;
    border-radius:20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    max-width:600px;
    width:90%;
    animation: fadeIn 1s ease;
}

/* TÍTULO AJUSTADO */
h1 {
    font-size: clamp(1.8em, 4vw, 2.8em);
    line-height: 1.2;
    color:#ffffff;
}

/* GARANTE QUE NÃO QUEBRE */
.no-break {
    white-space: nowrap;
}

h2 {
    margin:15px 0 25px;
    font-weight:300;
    opacity:0.8;
}

p {
    margin:10px 0;
    opacity:0.7;
}

/* LOGO */
.logo-link {
    display:inline-block;
    margin:20px 0;
    text-decoration:none;
    color:#ccc;
    transition:0.3s;
}

.logo-link:hover {
    transform:scale(1.05);
    color:#fff;
}

.logo-link img {
    width:80px;
    filter: grayscale(100%) brightness(1.2);
}

.logo-text {
    margin-top:8px;
    font-weight:600;
}

/* BOTÕES */
.language-btn {
    margin:5px;
    padding:10px 20px;
    border:none;
    border-radius:30px;
    background:#333;
    color:#fff;
    cursor:pointer;
    transition:0.3s;
}

.language-btn:hover {
    background:#555;
    transform:translateY(-2px);
}

/* CTA */
.cta-btn {
    display:inline-block;
    margin-top:25px;
    padding:15px 35px;
    background:#ffffff;
    color:#000;
    border-radius:30px;
    text-decoration:none;
    font-size:1.2em;
    font-weight:600;
    transition:0.3s;
}

.cta-btn:hover {
    background:#ddd;
    transform:scale(1.05);
    box-shadow:0 10px 20px rgba(0,0,0,0.6);
}

/* ANIMAÇÃO */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

    <h1 id="title">
        <span class="no-break">Hyperdimensional</span><br>
        Paradox
    </h1>

    <a href="https://www.matematico10.com.br/projetos/B/" class="logo-link">
        <img src="https://i.ibb.co/DNQv5x8/Simbolo-Matem-tico-10-removebg-preview.png">
        <div class="logo-text">Voltar à Central de Estudos</div>
    </a>

    <h2 id="subtitle">The greatest logical challenge</h2>

    <p id="intro1"></p>
    <p id="intro2"></p>

    <div>
        <button class="language-btn" data-lang="pt">Português</button>
        <button class="language-btn" data-lang="en">English</button>
    </div>

    <a href="#" class="cta-btn" id="startChallenge">Start</a>

</div>

<script>
const translations = {
    en: {
        title: '<span class="no-break">Hyperdimensional</span><br>Paradox',
        subtitle: "The greatest logical-mathematical challenge ever conceived",
        intro1: "A powerful logic and math challenge.",
        intro2: "Are you ready?",
        btn: "Start Challenge"
    },
    pt: {
        title: '<span class="no-break">Paradoxo</span><br>Hiperdimensional',
        subtitle: "O maior desafio lógico-matemático já concebido",
        intro1: "Um poderoso desafio de lógica e matemática.",
        intro2: "Você está pronto?",
        btn: "Iniciar Desafio"
    }
};

let selectedLanguage = "en";

function applyLang() {
    document.getElementById("title").innerHTML = translations[selectedLanguage].title;
    document.getElementById("subtitle").innerHTML = translations[selectedLanguage].subtitle;
    document.getElementById("intro1").innerHTML = translations[selectedLanguage].intro1;
    document.getElementById("intro2").innerHTML = translations[selectedLanguage].intro2;
    document.getElementById("startChallenge").innerHTML = translations[selectedLanguage].btn;
}

document.querySelectorAll(".language-btn").forEach(btn => {
    btn.onclick = () => {
        selectedLanguage = btn.dataset.lang;
        applyLang();
    };
});

applyLang();

document.getElementById("startChallenge").addEventListener("click", function(e){
    e.preventDefault();

    if (selectedLanguage === "pt") {
        window.location.href = "Teste BR.HTML";
    } else {
        window.location.href = "Teste EUA.html";
    }
});
</script>

</body>
</html>
