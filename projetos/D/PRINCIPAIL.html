<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperdimensional Paradox - The Supreme Challenge</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            color: #f8f9fa;
            background: linear-gradient(135deg, #1a5276, #2c3e50);
            overflow-x: hidden;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 4em;
            font-weight: 800;
            background: linear-gradient(45deg, #3498db, #9b59b6);
            -webkit-background-clip: text;
            color: transparent;
        }

        h2 { margin: 20px 0; }

        .language-btn {
            padding: 10px 20px;
            margin: 5px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            background: #3498db;
            color: white;
        }

        .cta-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #e74c3c;
            color: white;
            border-radius: 30px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">
    <h1 id="title">Hyperdimensional Paradox</h1>
    <h2 id="subtitle">The greatest logical-mathematical challenge ever conceived</h2>

    <p id="intro-p1"></p>
    <p id="intro-p2"></p>

    <div>
        <button class="language-btn" data-lang="pt">Português</button>
        <button class="language-btn" data-lang="en">English</button>
    </div>

    <a href="#" class="cta-btn" id="startChallenge">Start</a>
</div>

<script>
const translations = {
    en: {
        title: "Hyperdimensional Paradox",
        subtitle: "The greatest logical-mathematical challenge ever conceived",
        intro1: "A logical and mathematical challenge.",
        intro2: "Are you ready?",
        btn: "Start"
    },
    pt: {
        title: "Paradoxo Hiperdimensional",
        subtitle: "O maior desafio lógico-matemático já concebido",
        intro1: "Um desafio de lógica e matemática.",
        intro2: "Você está pronto?",
        btn: "Começar"
    }
};

let lang = "en";

function applyLang() {
    document.getElementById("title").innerHTML = translations[lang].title;
    document.getElementById("subtitle").innerHTML = translations[lang].subtitle;
    document.getElementById("intro-p1").innerHTML = translations[lang].intro1;
    document.getElementById("intro-p2").innerHTML = translations[lang].intro2;
    document.getElementById("startChallenge").innerHTML = translations[lang].btn;
}

document.querySelectorAll(".language-btn").forEach(btn => {
    btn.onclick = () => {
        lang = btn.dataset.lang;
        applyLang();
    };
});

applyLang();

// partículas
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
