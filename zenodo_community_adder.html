<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Submeter Artigos Zenodo à Comunidade MATH10</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { color: #0077cc; }
    input, button { padding: 10px; margin: 10px 0; width: 100%; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #0077cc; color: white; cursor: pointer; }
    button:hover { background: #005fa3; }
    #log { background: white; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; font-family: monospace; border: 1px solid #ddd; }
    hr { border: none; border-top: 1px solid #ddd; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>🧮 Submeter Artigos Zenodo à Comunidade MATH10</h1>
  <p>Este script adiciona todos os seus artigos à comunidade <b>MATH10</b> automaticamente.</p>

  <label>Token Zenodo:</label>
  <input type="text" id="token" placeholder="Cole aqui seu token Zenodo">
  <button id="startBtn">Iniciar Submissão</button>

  <div id="log"></div>

  <script>
    const log = (msg) => {
      const div = document.getElementById("log");
      div.innerHTML += msg + "<br>";
      div.scrollTop = div.scrollHeight;
    };

    document.getElementById("startBtn").addEventListener("click", iniciar);

    async function iniciar() {
      const token = document.getElementById("token").value.trim();
      if (!token) return alert("Por favor, insira seu token Zenodo!");

      const proxy = "https://api.codetabs.com/v1/proxy/?quest=";
      const base = "https://zenodo.org/api";

      log("🔍 Buscando artigos publicados...");
      let page = 1;
      let todos = [];

      // ======================
      // 1️⃣ BUSCAR TODOS OS ARTIGOS
      // ======================
      while (true) {
        const url = `${proxy}${encodeURIComponent(base + "/records/?size=100&page=" + page + "&access_token=" + token)}`;
        const res = await fetch(url);
        if (!res.ok) {
          log(`❌ Erro HTTP ${res.status} na página ${page}`);
          break;
        }

        const data = await res.json().catch(() => null);
        const hits = data?.hits?.hits || [];

        if (hits.length === 0) {
          log(`📚 Fim da listagem — ${todos.length} artigos encontrados.`);
          break;
        }

        todos = todos.concat(hits);
        log(`📄 Página ${page}: ${hits.length} artigos`);
        page++;

        // Limite de segurança (máx. 30 páginas = 3000 artigos)
        if (page > 30) {
          log("⚠️ Limite de 30 páginas atingido — parando busca para evitar loop.");
          break;
        }

        await new Promise(r => setTimeout(r, 300)); // pequena pausa entre páginas
      }

      log(`✅ Total de artigos encontrados: ${todos.length}`);
      log("<hr>");

      // ======================
      // 2️⃣ CRIAR NOVA VERSÃO E ADICIONAR COMUNIDADE
      // ======================
      let contador = 0;
      for (const art of todos) {
        contador++;
        const id = art.id;
        log(`➡️ (${contador}/${todos.length}) Criando nova versão do artigo ${id}...`);

        // Criar nova versão via /records/
        const newVerURL = `${proxy}${encodeURIComponent(base + "/records/" + id + "/actions/newversion?access_token=" + token)}`;
        const resNew = await fetch(newVerURL, { method: "POST" });

        if (!resNew.ok) {
          log(`❌ Erro ao criar nova versão (${resNew.status})`);
          continue;
        }

        const newVer = await resNew.json().catch(() => null);
        const draftURL = newVer?.links?.latest_draft;
        if (!draftURL) {
          log(`⚠️ Não foi possível obter o draft do artigo ${id}`);
          continue;
        }

        const draftId = draftURL.split("/").pop();
        log(`🆕 Draft criado: ${draftId}`);

        // Adicionar comunidade MATH10
        const updateURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + draftId + "?access_token=" + token)}`;
        const body = { metadata: { communities: [{ identifier: "math10" }] } };

        const resUpdate = await fetch(updateURL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (!resUpdate.ok) {
          log(`⚠️ Falha ao adicionar comunidade (${resUpdate.status})`);
          continue;
        }

        // Publicar nova versão
        const publishURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + draftId + "/actions/publish?access_token=" + token)}`;
        const resPub = await fetch(publishURL, { method: "POST" });

        if (resPub.ok) {
          log(`✅ Artigo ${id} publicado na comunidade MATH10.`);
        } else {
          log(`❌ Erro ao publicar ${draftId} (${resPub.status})`);
        }

        // Pequena pausa entre artigos para evitar limite da API
        await new Promise(r => setTimeout(r, 2000));
      }

      log("<hr><b>🎯 Processo concluído!</b>");
    }
  </script>
</body>
</html>
