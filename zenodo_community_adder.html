<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Submeter para Comunidade MATH10</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
    input, button { padding: 8px; margin: 6px 0; width: 100%; }
    button { background: #0077cc; color: #fff; border: none; cursor: pointer; border-radius: 6px; }
    #log { background: #fff; border: 1px solid #ddd; padding: 10px; height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>🧮 Adicionar artigos Zenodo à comunidade MATH10</h1>
  <p>Informe seu token pessoal do Zenodo:</p>
  <input type="text" id="token" placeholder="Cole aqui seu token Zenodo">
  <button onclick="iniciar()">Iniciar</button>

  <div id="log"></div>

  <script>
    const log = (msg) => {
      const div = document.getElementById("log");
      div.innerHTML += msg + "<br>";
      div.scrollTop = div.scrollHeight;
    };

    async function iniciar() {
      const token = document.getElementById("token").value.trim();
      if (!token) return alert("Insira o token Zenodo!");

      const proxy = "https://api.codetabs.com/v1/proxy/?quest=";
      const base = "https://zenodo.org/api";

      log("🔍 Buscando artigos publicados...");
      let page = 1, todos = [];

      while (true) {
        const url = `${proxy}${encodeURIComponent(base + "/records/?size=100&page=" + page + "&access_token=" + token)}`;
        const res = await fetch(url);
        if (!res.ok) break;
        const data = await res.json();
        if (!data.hits || data.hits.hits.length === 0) break;
        todos = todos.concat(data.hits.hits);
        log(`📄 Página ${page}: ${data.hits.hits.length} artigos`);
        page++;
      }

      log(`✅ Total de ${todos.length} artigos encontrados.`);

      for (const art of todos) {
        const id = art.id;
        log(`<hr>➡️ Criando nova versão do artigo ${id}...`);

        // ✅ CORREÇÃO: usar /records/ (não /deposit/depositions/)
        const newVersionURL = `${proxy}${encodeURIComponent(base + "/records/" + id + "/actions/newversion?access_token=" + token)}`;
        const resNew = await fetch(newVersionURL, { method: "POST" });

        if (!resNew.ok) {
          log(`❌ Falha ao criar nova versão (HTTP ${resNew.status})`);
          continue;
        }

        const json = await resNew.json();
        const draft = json?.links?.latest_draft;
        if (!draft) {
          log("⚠️ Não foi possível criar rascunho.");
          continue;
        }

        const draftId = draft.split("/").pop();
        log(`🆕 Draft criado: ${draftId}`);

        // Adicionar comunidade
        const updateURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + draftId + "?access_token=" + token)}`;
        const body = { metadata: { communities: [{ identifier: "math10" }] } };

        const resUpdate = await fetch(updateURL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (!resUpdate.ok) {
          log(`⚠️ Erro ao adicionar comunidade (${resUpdate.status})`);
          continue;
        }

        // Publicar nova versão
        const pubURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + draftId + "/actions/publish?access_token=" + token)}`;
        const resPub = await fetch(pubURL, { method: "POST" });

        if (resPub.ok) {
          log(`✅ Artigo ${id} publicado na comunidade MATH10`);
        } else {
          log(`❌ Falha ao publicar (${resPub.status})`);
        }

        await new Promise(r => setTimeout(r, 2000)); // pausa
      }

      log("<hr>🎯 Concluído!");
    }
  </script>
</body>
</html>
