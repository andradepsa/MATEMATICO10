<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Submeter Artigos Zenodo MATH10</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { color: #0077cc; }
    input, button { padding: 10px; margin: 10px 0; width: 100%; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #0077cc; color: white; cursor: pointer; }
    button:hover { background: #005fa3; }
    #log { background: white; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; font-family: monospace; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>🧮 Submeter Artigos Zenodo à Comunidade MATH10</h1>
  <p>Insira seu <b>token de acesso do Zenodo</b> e clique em <b>Iniciar Submissão</b>.<br>
  O sistema vai buscar todos os seus artigos e enviá-los para a comunidade <b>MATH10</b>.</p>

  <label>Token Zenodo:</label>
  <input type="text" id="token" placeholder="Cole aqui seu token Zenodo">
  <button id="startBtn">Iniciar Submissão</button>

  <div id="log"></div>

  <script>
    const log = (msg) => {
      const div = document.getElementById("log");
      div.innerHTML += msg + "<br>";
      div.scrollTop = div.scrollHeight;
    };

    document.getElementById("startBtn").addEventListener("click", iniciar);

    async function iniciar() {
      const token = document.getElementById("token").value.trim();
      if (!token) return alert("Por favor, insira seu token Zenodo!");

      log("🔍 Buscando seus artigos...");

      try {
        // ✅ Proxy seguro (sem erro QUIC)
        const proxy = "https://api.codetabs.com/v1/proxy/?quest=";
        const base = "https://zenodo.org/api";
        let page = 1;
        let todos = [];

        // 1️⃣ Buscar todos os registros do usuário
        while (true) {
          const url = `${proxy}${encodeURIComponent(base + "/records/?size=100&page=" + page + "&access_token=" + token)}`;
          const res = await fetch(url);

          if (!res.ok) {
            log(`❌ Erro HTTP ${res.status} na página ${page}`);
            break;
          }

          const data = await res.json().catch(() => null);
          if (!data || !data.hits || data.hits.hits.length === 0) break;

          todos = todos.concat(data.hits.hits);
          log(`📄 Página ${page}: ${data.hits.hits.length} artigos encontrados`);
          page++;
        }

        if (todos.length === 0) {
          log("⚠️ Nenhum artigo encontrado ou token inválido!");
          return;
        }

        log(`✅ Total de artigos encontrados: ${todos.length}`);

        // 2️⃣ Criar nova versão e adicionar à comunidade
        for (let i = 0; i < todos.length; i++) {
          const art = todos[i];
          const id = art.id;
          log(`<hr>➡️ Criando nova versão do artigo ${id}...`);

          // Criar nova versão
          const newVerURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + id + "/actions/newversion?access_token=" + token)}`;
          const resNew = await fetch(newVerURL, { method: "POST" });

          if (!resNew.ok) {
            log(`❌ Erro ao criar nova versão de ${id} (${resNew.status})`);
            continue;
          }

          const newVer = await resNew.json().catch(() => null);
          const draftURL = newVer?.links?.latest_draft;
          if (!draftURL) {
            log(`⚠️ Não foi possível obter o draft de ${id}`);
            continue;
          }

          const draftId = draftURL.split("/").pop();
          log(`🆕 Draft criado: ${draftId}`);

          // Atualizar metadados (adicionar comunidade)
          const updateURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + draftId + "?access_token=" + token)}`;
          const body = { metadata: { communities: [{ identifier: "math10" }] } };

          const resUpdate = await fetch(updateURL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });

          if (!resUpdate.ok) {
            log(`⚠️ Falha ao adicionar comunidade no draft ${draftId} (${resUpdate.status})`);
            continue;
          }

          // Publicar o novo depósito
          const publishURL = `${proxy}${encodeURIComponent(base + "/deposit/depositions/" + draftId + "/actions/publish?access_token=" + token)}`;
          const resPub = await fetch(publishURL, { method: "POST" });

          if (resPub.ok) {
            log(`✅ Artigo ${id} enviado com sucesso para a comunidade MATH10!`);
          } else {
            log(`❌ Erro ao publicar ${draftId} (${resPub.status})`);
          }

          await new Promise(r => setTimeout(r, 2000)); // pausa leve entre artigos
        }

        log("<hr><b>🎯 Processo concluído!</b>");
      } catch (e) {
        console.error(e);
        log("❌ Erro no script: " + e.message);
      }
    }
  </script>
</body>
</html>
